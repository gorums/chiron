o positions 2-10 lose value; citation becomes the unit of reward."}, {"front": "Which of the four SEO pillars is usually the binding constraint, and which do beginners over-invest in?", "back": "Authority is usually the constraint. Beginners over-invest in on-page because it is the only pillar you can finish in an afternoon."}, {"front": "Which search intent type is the highest-value SEO territory in 2026, and why?", "back": "Commercial investigation - best X, X vs Y, X pricing. High purchase intent, and answer engines lean heavily on comparison and review content."}, {"front": "What is answer-first writing, in specifics?", "back": "A direct, self-contained 40-80 word answer immediately under the heading that asks the question, then elaborate. That is the part that gets extracted."}, {"front": "What is share of answer and how do you measure it?", "back": "Your visibility inside AI answers. Pick 20-30 buyer queries, run them monthly across ChatGPT, Perplexity, Gemini and Google AI Overviews, and log mentioned, cited with link, or absent - plus which competitors appear."}, {"front": "Why does entity consistency across LinkedIn, Crunchbase and directories matter for citation?", "back": "Answer engines assemble their picture of you from many sources. Inconsistent name, description or founder details make you a fuzzy entity, and fuzzy entities do not get cited."}], "elaborate": ["For your chosen business, list the three commercial-investigation queries a buyer would type before choosing a vendor. Run each one in an answer engine, log who is cited, and write what those cited sources have that you do not - then say which of the four pillars that gap belongs to.", "M07 argued that a website's job includes answering the questions that block a purchase. Take one objection you identified in the M07 audit and show how the same content would be written twice: once for a human reading the page, once as a 60-word extractable answer under a question-shaped heading."], "transfer": {"scenario": "A payroll software company publishes three explainer articles a week. Over twelve months organic sessions fell 34%, while Search Console impressions rose 11%. Their top pages are \"what is PAYE\" and \"how does payroll tax work,\" which together carry 71% of organic sessions and produce four trial signups a year. They rank position 6-9 for \"best payroll software for contractors\" and are absent from G2, Capterra and every roundup in the category. Their marketing lead wants to double the article cadence to recover the sessions.", "prompt": "Decide whether to approve the cadence increase, and set out what you would do instead for the next 90 days.", "model": "Do not approve it. Rising impressions with falling clicks is the signature of answer-engine displacement, and the traffic that fell was informational content whose only job was to catch a click that no longer happens - four signups a year confirms those pages never produced buyers. More explainers add supply where competent content is free and worth near zero. Instead, shift to commercial intent: \"best payroll software for contractors\" already sits at 6-9, and improving it beats starting a new page at zero. Read the SERP first and match its page type. Get listed and reviewed on G2 and Capterra and pursue roundups, because answer engines lean on those for commercial queries and absence there is absence from the answer. Then replace organic sessions as the headline KPI with share of answer, branded search and conversions from organic."}}}, {"id": "M09", "num": 9, "part": "p2", "title": "Content Marketing and Organic Social", "short": "Content & social", "meta": "120 minutes (50 read · 50 exercise · 20 recall)", "minutes": 120, "sections": [{"h": "Why this matters", "html": "<p>Content is the cheapest way to create demand and the easiest place to waste a year. Most content programs fail in a specific, predictable way: they produce traffic from people who will never buy, report that traffic as success, and get cut in the first budget review. Knowing the difference between traffic and demand is the whole skill.<\/p>", "text": "Content is the cheapest way to create demand and the easiest place to waste a year. Most content programs fail in a specific, predictable way: they produce traffic from people who will never buy, report that traffic as success, and get cut in the first budget review. Knowing the difference between traffic and demand is the whole skill."}, {"h": "Core concepts", "html": "<h3>Content that captures demand vs. content that creates it<\/h3>\n<p>Two different jobs, two different formats, two different metrics (M01).<\/p>\n<ul>\n<li><strong>Capture content<\/strong> meets people already looking: comparison pages, \"alternatives to X\", pricing, use-case and integration pages, documentation. Low volume, high intent, converts now. Overlaps heavily with SEO (M08).<\/li>\n<li><strong>Creation content<\/strong> reaches people not looking: opinion, original research, teardowns, video, newsletters. High volume, no immediate conversion, and the only way to expand beyond existing search demand.<\/li>\n<\/ul>\n<p>Most teams do neither and produce <strong>middle content<\/strong> — generic explainers about the category. It captures nothing (the reader is not buying) and creates nothing (it says nothing memorable). This is where content budgets die.<\/p>\n<h3>Traffic is not demand<\/h3>\n<p>Demand is a person who now wants your thing. Traffic is a page view. They correlate weakly.<\/p>\n<p>The test for any planned piece: <strong>who is the reader, and what do they do next?<\/strong> If the honest answer is \"a student, and nothing,\" do not write it, whatever the search volume. Fix the reporting too — measure assisted conversions, email signups, branded search lift, and pipeline touched, not sessions.<\/p>\n<h3>Content-market fit<\/h3>\n<p>Same discipline as product-market fit: a specific audience keeps consuming, sharing, and acting on a specific kind of content from you. You find it by publishing several distinct bets, watching which produce disproportionate response (replies, shares, inbound), and doubling down on that format-plus-topic rather than spreading evenly. You have it when people quote you back to yourself, competitors imitate the format, and sales calls open with \"I read your thing about X.\"<\/p>\n<h3>Formats and the job each does<\/h3>\n<ul>\n<li><strong>Comparison and \"alternatives\" pages<\/strong> — capture. The most reliable revenue per hour of writing. Write them honestly, including who you are wrong for.<\/li>\n<li><strong>Product-led content<\/strong> — teach the job while showing the product doing it. The demonstration is the argument.<\/li>\n<li><strong>Case studies<\/strong> — remove risk at the decision stage. Need numbers and a named customer; anonymous ones convince nobody.<\/li>\n<li><strong>Original research and proprietary data<\/strong> — the best link-and-citation asset available to a small company (M08).<\/li>\n<li><strong>Opinion / point of view<\/strong> — builds brand and memory, and requires being willing to be disagreed with. Safe opinions do nothing.<\/li>\n<li><strong>Video<\/strong> — highest trust per minute; YouTube content is transcribed, indexed, and retrieved by answer engines.<\/li>\n<li><strong>Newsletter<\/strong> — the compounding owned asset. Converts attention into a channel you keep.<\/li>\n<\/ul>\n<h3>A production system one person can sustain<\/h3>\n<p>The failure mode is a heroic cadence abandoned in week six. Build for the worst week you will have.<\/p>\n<p><strong>Pillar plus repurposing.<\/strong> Produce one substantial thing per week — a 20-minute video, a research piece, an interview, a deep post. Then cut it into derivative assets: three to five short-form posts, one newsletter section, a couple of clips, quotes for sales. One creation act, six to ten distributed pieces.<\/p>\n<p><strong>A weekly rhythm that fits around a job:<\/strong> Monday, pick the pillar topic from a continuously-kept idea list (customer questions, sales objections, support tickets, Reddit threads). Tuesday-Wednesday, make it. Thursday, cut derivatives and schedule. Friday, distribute and reply — that is work, not admin.<\/p>\n<p><strong>Where AI helps and where it hurts.<\/strong> Use it for outlines, transcription, repurposing one asset into another format, editing, headline variants. Do not use it for substance — the argument, the data, the story. Substance is the only scarce part now.<\/p>\n<h3>Distribution is half the job<\/h3>\n<p>Publishing is not distributing. Budget roughly half your content time to getting it in front of people: post natively where your audience is (platforms suppress links — post the content itself and put the link elsewhere), email your list, send it directly to ten specific people who would care, answer the question in the community where it was asked, pitch it to newsletters in your space, re-share the good ones months later.<\/p>\n<p>A mediocre piece distributed well reliably beats an excellent piece distributed nowhere.<\/p>\n<h3>Organic social, platform by platform<\/h3>\n<ul>\n<li><strong>LinkedIn<\/strong> — the default for B2B. Personal profiles outperform company pages by a wide margin, so the founder or a named employee should post. Text posts and carousels; native content over links; comments are where deals actually start.<\/li>\n<li><strong>Short video (TikTok, Reels, Shorts)<\/strong> — the cheapest remaining reach, still algorithmically distributed to non-followers. Hook in the first two seconds, no branded intro. Volume and iteration matter more than production value.<\/li>\n<li><strong>YouTube<\/strong> — the highest-durability channel in this module. A video ranks and earns for years, is transcribed into search and answer engines, and builds more trust than any text format. It is also the slowest to get going. If you can only commit to one long-term channel, this is usually it.<\/li>\n<li><strong>Reddit and communities (Discord, Slack groups, forums)<\/strong> — disproportionately read by both buyers and answer engines. To avoid being ejected: participate for weeks before mentioning your product, read the subreddit rules, disclose your affiliation plainly, answer fully in the comment rather than linking away, never run multiple accounts. Being helpful under your real identity is the entire strategy.<\/li>\n<li><strong>X, Instagram, Facebook groups<\/strong> — situational. Choose by where your ICP actually is (M02), not where you personally spend time.<\/li>\n<\/ul>\n<p>Pick two: one long-form home, one distribution surface. Doing five badly is the most common beginner error.<\/p>\n<h3>Creators and influencers<\/h3>\n<p>Borrowing an existing audience is usually faster than building one. How to evaluate a creator:<\/p>\n<ul>\n<li><strong>Audience match over size.<\/strong> A 4,000-subscriber newsletter for exactly your buyer beats 400,000 general followers.<\/li>\n<li><strong>Engagement quality<\/strong> — substantive comments or emoji, and is it the same handful of accounts every time?<\/li>\n<li><strong>Evidence of driving action<\/strong> — ask for a past campaign result, or start with a small paid test and a tracked link or code.<\/li>\n<li><strong>Voice fit.<\/strong> Give a brief with the message and constraints, not a script. Over-scripting is why most collaborations fail.<\/li>\n<li><strong>Repeat over one-off.<\/strong> Single mentions rarely convert; three exposures over a quarter can.<\/li>\n<\/ul>\n<h3>Community<\/h3>\n<p>The highest-effort, highest-retention asset here, and a real ongoing commitment — moderation, seeding conversation, showing up daily. An empty community is worse than none. Start one only when a cluster of customers already wants to talk to each other; otherwise participate in the communities that exist.<\/p>\n<h3>Organic reach declines, and email does not<\/h3>\n<p>Every platform follows the same arc: generous reach to attract creators, then compression as inventory is monetized. Your follower count is not a channel you own — it is access the platform rents you and can reprice. Hence converting audience into email (M12): a list is the only audience you can reach on purpose, and it is worth building from day one even at small scale.<\/p>", "text": "Content that captures demand vs. content that creates it Two different jobs, two different formats, two different metrics (M01). Capture content meets people already looking: comparison pages, \"alternatives to X\", pricing, use-case and integration pages, documentation. Low volume, high intent, converts now. Overlaps heavily with SEO (M08). Creation content reaches people not looking: opinion, original research, teardowns, video, newsletters. High volume, no immediate conversion, and the only way to expand beyond existing search demand. Most teams do neither and produce middle content — generic explainers about the category. It captures nothing (the reader is not buying) and creates nothing (it says nothing memorable). This is where content budgets die. Traffic is not demand Demand is a person who now wants your thing. Traffic is a page view. They correlate weakly. The test for any planned piece: who is the reader, and what do they do next? If the honest answer is \"a student, and nothing,\" do not write it, whatever the search volume. Fix the reporting too — measure assisted conversions, email signups, branded search lift, and pipeline touched, not sessions. Content-market fit Same discipline as product-market fit: a specific audience keeps consuming, sharing, and acting on a specific kind of content from you. You find it by publishing several distinct bets, watching which produce disproportionate response (replies, shares, inbound), and doubling down on that format-plus-topic rather than spreading evenly. You have it when people quote you back to yourself, competitors imitate the format, and sales calls open with \"I read your thing about X.\" Formats and the job each does Comparison and \"alternatives\" pages — capture. The most reliable revenue per hour of writing. Write them honestly, including who you are wrong for. Product-led content — teach the job while showing the product doing it. The demonstration is the argument. Case studies — remove risk at the decision stage. Need numbers and a named customer; anonymous ones convince nobody. Original research and proprietary data — the best link-and-citation asset available to a small company (M08). Opinion / point of "}, {"h": "How it works in practice", "html": "<p>A one-person program that works:<\/p>\n<ol>\n<li>Keep a running idea list sourced from real customer language — support tickets, sales objections, review sites, community threads. Never brainstorm from scratch.<\/li>\n<li>One pillar per week, on a fixed day, at a quality you can repeat.<\/li>\n<li>Cut it into five derivatives across your two chosen platforms.<\/li>\n<li>Spend Friday distributing and replying.<\/li>\n<li>Monthly, check which pieces produced replies, signups, or inbound — not views — and write more of those.<\/li>\n<li>Quarterly, kill the platform that produced nothing.<\/li>\n<\/ol>", "text": "A one-person program that works: Keep a running idea list sourced from real customer language — support tickets, sales objections, review sites, community threads. Never brainstorm from scratch. One pillar per week, on a fixed day, at a quality you can repeat. Cut it into five derivatives across your two chosen platforms. Spend Friday distributing and replying. Monthly, check which pieces produced replies, signups, or inbound — not views — and write more of those. Quarterly, kill the platform that produced nothing."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Commodity content is worthless.<\/strong> Anyone can generate a competent 1,500-word explainer in a minute, so competent explainers have no scarcity value and earn no links, citations, or memory.<\/li>\n<li><strong>Answer engines strip traffic from informational content.<\/strong> With roughly 60% of Google searches ending without a click, and top-position CTR dropping sharply when an AI Overview appears, \"write helpful articles and collect the traffic\" is structurally broken for generic topics.<\/li>\n<li><strong>So make what only you can make:<\/strong> proprietary data from your own operations, customer stories with real numbers, first-hand testing, genuine opinion. Those get linked, quoted, and cited — and citation is now a distribution channel of its own (M08).<\/li>\n<li><strong>Write to be cited, not only visited.<\/strong> Clear claims, specific numbers, quotable sentences, a named author with credentials. Getting your brand named inside an AI answer to a buying question beats 5,000 uncommitted visits.<\/li>\n<li><strong>Video and community are relatively insulated<\/strong> — expensive to fake, hard to summarize away.<\/li>\n<\/ul>", "text": "Commodity content is worthless. Anyone can generate a competent 1,500-word explainer in a minute, so competent explainers have no scarcity value and earn no links, citations, or memory. Answer engines strip traffic from informational content. With roughly 60% of Google searches ending without a click, and top-position CTR dropping sharply when an AI Overview appears, \"write helpful articles and collect the traffic\" is structurally broken for generic topics. So make what only you can make: proprietary data from your own operations, customer stories with real numbers, first-hand testing, genuine opinion. Those get linked, quoted, and cited — and citation is now a distribution channel of its own (M08). Write to be cited, not only visited. Clear claims, specific numbers, quotable sentences, a named author with credentials. Getting your brand named inside an AI answer to a buying question beats 5,000 uncommitted visits. Video and community are relatively insulated — expensive to fake, hard to summarize away."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Measuring content by traffic.<\/strong> The metric that most reliably hides failure.<\/li>\n<li><strong>Publishing without distributing.<\/strong> Half your hours belong after the publish button.<\/li>\n<li><strong>Starting on five platforms.<\/strong> You will sustain none.<\/li>\n<li><strong>A blog full of category explainers<\/strong> no buyer ever needed.<\/li>\n<li><strong>Posting only from the company LinkedIn page<\/strong> while no named human posts.<\/li>\n<li><strong>Entering Reddit to promote.<\/strong> You get banned, and the thread outlives you.<\/li>\n<li><strong>Hiring a creator for one post<\/strong> and calling the channel tested.<\/li>\n<li><strong>Quitting at month three<\/strong> — content and SEO both pay just past the point most people quit, which is exactly why the returns still exist.<\/li>\n<li><strong>Using AI for the argument<\/strong> rather than the assembly. It writes fluent averages, and average has no value left.<\/li>\n<\/ul>", "text": "Measuring content by traffic. The metric that most reliably hides failure. Publishing without distributing. Half your hours belong after the publish button. Starting on five platforms. You will sustain none. A blog full of category explainers no buyer ever needed. Posting only from the company LinkedIn page while no named human posts. Entering Reddit to promote. You get banned, and the thread outlives you. Hiring a creator for one post and calling the channel tested. Quitting at month three — content and SEO both pay just past the point most people quit, which is exactly why the returns still exist. Using AI for the argument rather than the assembly. It writes fluent averages, and average has no value left."}, {"h": "Exercise (50 minutes)", "html": "<p>Build a <strong>90-day content plan of 12 pieces<\/strong> for <strong>your chosen business<\/strong> (one per week, allowing for slippage).<\/p>\n<p><strong>Part A — the plan (35 min).<\/strong> A table with one row per piece:<\/p>\n<p><code># | Title/angle | Format | Job (capture / create / convert / prove) | Audience &amp; their trigger | Why only we can make this | Primary distribution | 3 derivatives | Success signal<\/code><\/p>\n<p>Constraints, to force real choices:<\/p>\n<ul>\n<li>At least 3 capture pieces tied to keywords from your M08 map<\/li>\n<li>At least 2 pieces built on something proprietary — your data, your customers, your testing<\/li>\n<li>At least 2 case studies or proof pieces<\/li>\n<li>At least 1 opinion piece that some readers will disagree with<\/li>\n<li>No more than 2 platforms in the distribution column<\/li>\n<li>For each piece, the success signal must be something other than pageviews<\/li>\n<\/ul>\n<p><strong>Part B — pressure-test it (15 min).<\/strong> Answer in writing:<\/p>\n<ol>\n<li>Which three pieces would you keep if you only had time for three? Why those?<\/li>\n<li>For each piece, name the person who reads it and what they do next. Delete any row where the honest answer is \"nobody in particular / nothing.\"<\/li>\n<li>What is your sustainable weekly time budget, and does this plan fit inside it in your worst week? If not, cut to what does.<\/li>\n<li>Which piece is most likely to be cited by an AI answer engine, and what makes it citable?<\/li>\n<\/ol>", "text": "Build a 90-day content plan of 12 pieces for your chosen business (one per week, allowing for slippage). Part A — the plan (35 min). A table with one row per piece: # | Title/angle | Format | Job (capture / create / convert / prove) | Audience &amp; their trigger | Why only we can make this | Primary distribution | 3 derivatives | Success signal Constraints, to force real choices: At least 3 capture pieces tied to keywords from your M08 map At least 2 pieces built on something proprietary — your data, your customers, your testing At least 2 case studies or proof pieces At least 1 opinion piece that some readers will disagree with No more than 2 platforms in the distribution column For each piece, the success signal must be something other than pageviews Part B — pressure-test it (15 min). Answer in writing: Which three pieces would you keep if you only had time for three? Why those? For each piece, name the person who reads it and what they do next. Delete any row where the honest answer is \"nobody in particular / nothing.\" What is your sustainable weekly time budget, and does this plan fit inside it in your worst week? If not, cut to what does. Which piece is most likely to be cited by an AI answer engine, and what makes it citable?"}, {"h": "Recall (20 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Capture vs. creation content, with two formats of each, and what \"middle content\" is<\/li>\n<li>The test that tells you whether a planned piece is worth writing<\/li>\n<li>What content-market fit looks like and how you would recognize it<\/li>\n<li>The pillar-plus-repurposing system and a weekly cadence one person can hold<\/li>\n<li>Why publishing is not distributing, and four distribution actions<\/li>\n<li>One sentence on the job of each: LinkedIn, short video, YouTube, Reddit<\/li>\n<li>Four criteria for evaluating a creator collaboration<\/li>\n<li>Why organic reach declines on every platform, and what that implies about email<\/li>\n<li>Two reasons commodity content lost its value in 2026, and what to make instead<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Capture vs. creation content, with two formats of each, and what \"middle content\" is The test that tells you whether a planned piece is worth writing What content-market fit looks like and how you would recognize it The pillar-plus-repurposing system and a weekly cadence one person can hold Why publishing is not distributing, and four distribution actions One sentence on the job of each: LinkedIn, short video, YouTube, Reddit Four criteria for evaluating a creator collaboration Why organic reach declines on every platform, and what that implies about email Two reasons commodity content lost its value in 2026, and what to make instead"}, {"h": "If you remember one thing", "html": "<p><strong>Produce only what nobody else could produce, then spend half your time distributing it.<\/strong> Traffic is not demand — if you cannot name the reader and the next action, the piece is not worth writing.<\/p>", "text": "Produce only what nobody else could produce, then spend half your time distributing it. Traffic is not demand — if you cannot name the reader and the next action, the piece is not worth writing."}], "suggest": [["What separates traffic from demand in a content report?", "What does a report that hides content failure actually look like?", "How do I show my content created demand before the budget review?"], ["Why does 'middle content' fail at both capturing and creating demand?", "Give me two capture formats and two creation formats for my business", "Which job do I start with if I can only make one piece a week?"], ["Why source ideas from support tickets instead of brainstorming?", "Show me one pillar piece cut into five derivatives", "How do I hold a weekly pillar cadence alongside running the business?"], ["Why do competent explainers now earn no links, citations or memory?", "What first-hand testing could a two-person business realistically do?", "My blog is all category explainers — what do I do with it now?"], ["Why is traffic the metric that most reliably hides failure?", "What does 'half your hours after publish' look like across a week?", "How do I take part on Reddit without getting banned for promoting?"], ["What does the 'why only we can make this' column really demand?", "Fill in one row: a capture piece tied to a keyword from my map", "What success signal do I pick for each piece if it isn't views?"], ["What does content-market fit look like when I hit it?", "One line each on the job of LinkedIn, short video, YouTube and Reddit", "If organic reach always decays, how hard should I push email instead?"], ["What does 'name the reader and the next action' mean in practice?", "Show me a piece that fails the 'only we could make this' test", "How do I split a working week 50/50 between making and distributing?"]], "assess": {"predict": "What do you think separates content that produces customers from content that produces lots of traffic and no customers?", "quiz": [{"q": "A team publishes weekly explainers titled \"What is customer retention?\" and \"A guide to churn.\" Traffic is growing. What does the module call this and why does it fail?", "options": ["Creation content - it reaches people who are not looking but takes longer to pay off", "Capture content - the format is right but the distribution is missing", "Middle content - it captures nothing because the reader is not buying and creates nothing because it says nothing memorable", "Product-led content - it needs the product woven in more explicitly"], "answer": 2, "why": "Generic explainers about the category are exactly what the module names middle content, and it says this is where content budgets die. Calling it creation content is the tempting error: creation content is opinion, original research, teardowns, video and newsletters - things that reach people not looking with something memorable, which a category explainer does not do."}, {"q": "You have five hours a week for content. The module's production system says to spend them how?", "options": ["One substantial pillar piece, cut into five or more derivatives, with roughly half the time spent distributing", "Five short pieces, one per weekday, to maximise algorithmic surface area", "Three pieces plus two hours of keyword research to find higher-volume topics", "One long piece published on all five platforms simultaneously"], "answer": 0, "why": "The module prescribes pillar plus repurposing - one substantial thing per week cut into three to five short posts, a newsletter section, clips and sales quotes - and says roughly half your content time belongs to distribution. Publishing to five platforms is a named beginner error: pick two, one long-form home and one distribution surface, because you will sustain none of five."}, {"q": "You want to test a Reddit strategy for a B2B tool. Which approach matches the module?", "options": ["Post a helpful comment with a link to your guide, then repeat across ten relevant subreddits", "Run two accounts - one to ask the question, one to answer it with your product", "Participate for weeks first, read the rules, disclose your affiliation plainly, and answer fully in the comment rather than linking away", "Skip Reddit; it is community-sensitive and the moderation risk outweighs the reach"], "answer": 2, "why": "The module's Reddit rules are participate for weeks before mentioning your product, read the subreddit rules, disclose affiliation plainly, answer fully in the comment rather than linking away, and never run multiple accounts. Skipping Reddit is wrong for a different reason: it is disproportionately read by both buyers and answer engines, so absence costs you."}, {"q": "You are choosing between a creator with 400,000 general followers and a newsletter with 4,000 subscribers who are precisely your buyer. What does the module say, and how would you de-risk it?", "options": ["Take the 400,000 for reach, then narrow with retargeting afterwards", "Take the 4,000 - audience match beats size - and start with a small paid test using a tracked link or code, planning repeat exposures rather than one-off", "Take the 4,000 and give them a full script so the message is controlled", "Run both once and compare cost per click across the two"], "answer": 1, "why": "The module says a 4,000-subscriber newsletter for exactly your buyer beats 400,000 general followers, and to de-risk by asking for a past campaign result or starting with a small paid test and a tracked link or code, with repeat over one-off. The scripting option contradicts the module directly - give a brief with message and constraints, not a script, because over-scripting is why most collaborations fail."}, {"q": "Your LinkedIn company page posts three times a week and gets almost no engagement. Nobody on the team posts personally. What is the module's diagnosis?", "options": ["The posting cadence is too low for the algorithm to establish reach", "LinkedIn is a poor fit for B2B and the budget should move to short video", "The posts need links to the blog so readers have somewhere to go", "Personal profiles outperform company pages by a wide margin, so the founder or a named employee should be posting"], "answer": 3, "why": "The module says personal profiles outperform company pages by a wide margin and names posting only from the company page while no named human posts as a common mistake. Adding links makes it worse: the module notes platforms suppress links, so post the content natively and put the link elsewhere."}, {"q": "Where does the module say AI belongs in a content workflow, and where does it not?", "options": ["Use it for outlines, transcription, repurposing, editing and headline variants - not for the argument, the data or the story", "Use it to draft the argument, then have a human fact-check the data", "Avoid it entirely, since generated content is penalised by search engines", "Use it to increase publishing volume, since supply still beats quality on most platforms"], "answer": 0, "why": "The module allows AI for assembly - outlines, transcription, repurposing, editing, headline variants - and forbids it for substance, because substance is the only scarce part now. The volume answer inverts the 2026 reality check: AI made competent content free, so the supply of adequate articles is effectively infinite and worth near zero."}], "cards": [{"front": "Capture vs creation content: name two formats of each and the metric problem they share.", "back": "Capture: comparison pages, alternatives-to-X, pricing, docs - low volume, high intent. Creation: opinion, original research, teardowns, video, newsletters. Both are measured wrongly by traffic; measure assisted conversions, signups, branded search lift, pipeline."}, {"front": "What one test decides whether a planned piece is worth writing?", "back": "Who is the reader, and what do they do next? If the honest answer is \"a student, and nothing,\" do not write it - whatever the search volume."}, {"front": "How would you recognise content-market fit?", "back": "People quote you back to yourself, competitors imitate the format, and sales calls open with \"I read your thing about X.\" You find it by publishing distinct bets and doubling down on disproportionate response."}, {"front": "Name four distribution actions that come after publishing.", "back": "Post natively where the audience is, email your list, send it directly to ten specific people who would care, answer the question in the community where it was asked, pitch newsletters, re-share months later."}, {"front": "Why does organic reach decline on every platform, and what does that imply?", "back": "Every platform gives generous reach to attract creators, then compresses it as inventory is monetised. Followers are access the platform rents you, so convert audience into email from day one."}, {"front": "What kind of content still earns links, citation and memory in 2026?", "back": "Only what nobody else could make: proprietary data from your operations, customer stories with real numbers, first-hand testing, genuine opinion. Competent explainers have no scarcity value."}], "elaborate": ["For your chosen business, name the one piece of proprietary content only you could produce - your data, your customers, your testing. Then write the reader and the next action in one sentence each, and say honestly whether you could produce that piece in your worst week of the quarter.", "M08 said third-party mentions now function like a ranking signal for answer engines. Pick one piece from your content plan and describe how you would make it citable rather than merely visitable - the specific claims, numbers and author credentials that would make an LLM name your brand in an answer."], "transfer": {"scenario": "A three-person accounting practice has published 84 blog posts over two years, all category explainers such as \"understanding VAT thresholds.\" They get 9,000 monthly organic sessions. In two years the blog has produced two client enquiries. The founder posts nothing personally; everything goes out from the company LinkedIn page and is cross-posted to X, Instagram and Facebook. They have no email list. The founder can commit four hours a week and wants to know whether to keep going.", "prompt": "Decide what to keep, what to kill, and what a sustainable four-hour week should look like.", "model": "Nine thousand sessions producing two enquiries is the exact failure the module describes: traffic reported as success while producing no demand. Kill the category explainers - middle content, capturing nothing because the reader is not buying and creating nothing memorable. Cut from four platforms to two: one long-form home, plus LinkedIn with the founder posting under his own name rather than the company page. Replace the backlog with capture content that meets people already looking - pricing, who we are wrong for, comparison against local competitors - and one proprietary piece built on anonymised numbers from their own client base. Four hours means one pillar a week or two, cut into derivatives, with half the time spent distributing: sending it to ten specific people and answering questions where they were actually asked. Start an email list, because organic reach is rented. Judge on enquiries and replies, never sessions."}}}, {"id": "M10", "num": 10, "part": "p2", "title": "Paid Search: Google Ads", "short": "Paid search", "meta": "120 minutes (55 read · 50 exercise · 15 recall)", "minutes": 120, "sections": [{"h": "Why this matters", "html": "<p>Paid search is the purest demand capture (M01). Someone types what they want; you pay to be the answer. That makes it the fastest channel to revenue and the easiest to measure — which is why it is where the most money is quietly wasted. It looks like it works because the conversions land in the report. Whether they would have happened anyway is a different question, and it is the one that gets people promoted or fired.<\/p>", "text": "Paid search is the purest demand capture (M01). Someone types what they want; you pay to be the answer. That makes it the fastest channel to revenue and the easiest to measure — which is why it is where the most money is quietly wasted. It looks like it works because the conversions land in the report. Whether they would have happened anyway is a different question, and it is the one that gets people promoted or fired."}, {"h": "Core concepts", "html": "<h3>The auction: you don't pay your bid<\/h3>\n<p><strong>Ad Rank<\/strong> ≈ bid × ad quality (expected CTR, ad relevance, landing page experience) + expected impact of assets, filtered by context and rank thresholds. You then pay roughly the minimum needed to beat the advertiser below you.<\/p>\n<p>Practically: a competitor with better ads and a better landing page outranks you while paying less. Quality is a discount, not a vanity score. <strong>Quality Score<\/strong> (1–10, keyword level) reports the same three components — treat it as a diagnostic. Low expected CTR means weak copy for that query; low ad relevance means query and ad don't match; low landing page experience usually means you dumped traffic on the homepage.<\/p>\n<h3>Match types as they actually behave in 2026<\/h3>\n<ul>\n<li><strong>Broad<\/strong> — matched on meaning, not words. With smart bidding and real conversion data it can outperform tight matching. Without conversion tracking it is an incinerator.<\/li>\n<li><strong>Phrase<\/strong> — the meaning of the phrase must be present. The workhorse.<\/li>\n<li><strong>Exact<\/strong> — no longer exact. It matches \"same meaning\": plurals, synonyms, reordering. <code>[running shoes]<\/code> can serve \"sneakers for jogging.\"<\/li>\n<\/ul>\n<p>Nothing you buy is literal anymore. This is the key correction for anyone learning from pre-2021 material.<\/p>\n<h3>Negatives are the real control surface<\/h3>\n<p>Because match types leak, <strong>negative keywords are how you steer<\/strong>. Three layers: an account-level list (free, jobs, torrent, competitor-review terms); campaign level (separate brand from non-brand so campaigns don't cannibalise); ad group level when intent splits (\"hire\" vs \"buy\").<\/p>\n<p>The <strong>search terms report<\/strong> shows the queries that actually triggered your ads. Weekly for the first month, then biweekly. For each meaningful term: promote it, block it, or ignore it. Google hides some low-volume terms, so you will never see 100% — read spend concentration, not just the top rows.<\/p>\n<h3>Structure in the automation era<\/h3>\n<p>Old advice: single-keyword ad groups, dozens of tiny campaigns. That is now harmful. Smart bidding needs conversion volume per campaign to learn, and splitting 40 conversions/month across 12 campaigns starves every one of them.<\/p>\n<p>Modern default: <strong>fewer, better-fed campaigns<\/strong>, split only where you need separate budget or separate targets — brand vs non-brand, different CPA/ROAS goals, different geographies or languages.<\/p>\n<h3>Responsive search ads and assets<\/h3>\n<p>RSAs are the only text format: up to 15 headlines, 4 descriptions, assembled by Google. Write <strong>distinct<\/strong> headlines, not 15 rewordings. Pin only for legal or brand requirements — heavy pinning cripples the system. Chase \"Good\"/\"Excellent\" Ad Strength but never trade away a strong claim for it; Ad Strength is a checklist, not a ranking factor. Run 2 RSAs per ad group.<\/p>\n<p><strong>Assets<\/strong> (formerly extensions) — sitelinks, callouts, structured snippets, call, lead form, image, price, promotion. More real estate and higher CTR at no extra cost. Missing sitelinks is the most common free money in a beginner account.<\/p>\n<h3>Message match<\/h3>\n<p>Query, ad, and landing page headline should read as one continuous sentence. Someone searching \"emergency plumber Dublin\" who lands on \"Welcome to our site\" is a click you already paid for and wasted. Message match usually beats another 10% off your CPC.<\/p>\n<h3>Bidding and the volume threshold<\/h3>\n<ul>\n<li><strong>Manual CPC<\/strong> — tiny accounts and diagnostics only.<\/li>\n<li><strong>Maximize clicks<\/strong> — cold-start traffic gathering; always cap max CPC.<\/li>\n<li><strong>Maximize conversions<\/strong> — no target, spends the budget hunting conversions. Sensible starting point.<\/li>\n<li><strong>Target CPA<\/strong> — you name the price per conversion.<\/li>\n<li><strong>Target ROAS<\/strong> — ecommerce, needs reliable revenue values.<\/li>\n<\/ul>\n<p>Smart bidding needs roughly <strong>30+ conversions per month per campaign<\/strong> to be stable; tROAS wants more. Below that, use maximize conversions, or move the conversion action earlier in the funnel (qualified lead rather than closed deal) so there is signal. Good B2B accounts solve this by importing offline conversions back into Google Ads.<\/p>\n<h3>Performance Max<\/h3>\n<p>PMax spans Search, Shopping, Display, YouTube, Gmail, Maps and Discover from one campaign. You supply budget, goal, asset groups, audience signals, and for ecommerce a product feed.<\/p>\n<p>It works with a healthy feed and real conversion volume. It fails with thin data, lead-gen where lead quality isn't fed back, or when it simply harvests branded search and claims credit. Reporting is opaque by design — asset insights, not clean placement data.<\/p>\n<p>Control it with: <strong>brand exclusions<\/strong> so it doesn't eat traffic you'd win free; <strong>account-level negative keywords<\/strong>; <strong>separate asset groups<\/strong> per category or persona so results are readable; <strong>audience signals<\/strong> (hints, not targeting — feed customer match and high-value site audiences); and <strong>feed quality<\/strong>, which for ecommerce <em>is<\/em> the targeting.<\/p>\n<h3>AI Max for Search<\/h3>\n<p>A toggle on a Search campaign, not a new type. It extends matching beyond your keyword list using semantic understanding of queries and your landing pages, and can generate ad text. It finds queries you'd never have thought of, and queries you'd never have bought. Enable it only with tight negatives and a weekly search terms review, and judge it incrementally rather than by in-platform CPA.<\/p>\n<h3>Branded search and the incrementality trap<\/h3>\n<p>Bidding on your own name shows a spectacular CPA. Most of it is not incremental — those people were arriving via the organic result below. Legitimate reasons: competitors bidding on you, a crowded SERP pushing you below the fold, message control, a fragile organic position. The test is easy and almost nobody runs it: pause brand in half your geographies for two weeks and watch <em>total<\/em> branded conversions, paid plus organic. Method in M15.<\/p>\n<h3>Shopping and budget pacing<\/h3>\n<p>Standard Shopping is still worth running beside PMax for control and cleaner data — there are no keywords, so optimisation means titles, images, price competitiveness and feed attributes.<\/p>\n<p>Daily budget × ~30.4 = the monthly cap; Google may overspend up to 2× on a day but not over the month. A campaign \"limited by budget\" while hitting target CPA is the easiest scaling decision in marketing. Raise budgets in 20–30% steps to avoid re-triggering learning.<\/p>", "text": "The auction: you don't pay your bid Ad Rank ≈ bid × ad quality (expected CTR, ad relevance, landing page experience) + expected impact of assets, filtered by context and rank thresholds. You then pay roughly the minimum needed to beat the advertiser below you. Practically: a competitor with better ads and a better landing page outranks you while paying less. Quality is a discount, not a vanity score. Quality Score (1–10, keyword level) reports the same three components — treat it as a diagnostic. Low expected CTR means weak copy for that query; low ad relevance means query and ad don't match; low landing page experience usually means you dumped traffic on the homepage. Match types as they actually behave in 2026 Broad — matched on meaning, not words. With smart bidding and real conversion data it can outperform tight matching. Without conversion tracking it is an incinerator. Phrase — the meaning of the phrase must be present. The workhorse. Exact — no longer exact. It matches \"same meaning\": plurals, synonyms, reordering. [running shoes] can serve \"sneakers for jogging.\" Nothing you buy is literal anymore. This is the key correction for anyone learning from pre-2021 material. Negatives are the real control surface Because match types leak, negative keywords are how you steer . Three layers: an account-level list (free, jobs, torrent, competitor-review terms); campaign level (separate brand from non-brand so campaigns don't cannibalise); ad group level when intent splits (\"hire\" vs \"buy\"). The search terms report shows the queries that actually triggered your ads. Weekly for the first month, then biweekly. For each meaningful term: promote it, block it, or ignore it. Google hides some low-volume terms, so you will never see 100% — read spend concentration, not just the top rows. Structure in the automation era Old advice: single-keyword ad groups, dozens of tiny campaigns. That is now harmful. Smart bidding needs conversion volume per campaign to learn, and splitting 40 conversions/month across 12 campaigns starves every one of them. Modern default: fewer, better-fed campaigns , split only where you need separate budget or separate targets — brand vs non-brand, "}, {"h": "How it works in practice", "html": "<p><strong>Computing max CPC.<\/strong> Work backwards from the money. Target CPA €50, landing page converts clicks to leads at 4%:<\/p>\n<p>Max CPC = target CPA × conversion rate = €50 × 0.04 = <strong>€2.00<\/strong><\/p>\n<p>If the auction demands €4, you have exactly three options: raise conversion rate (page, offer, form), raise what a conversion is worth (price, LTV, close rate), or don't run in this auction. There is no fourth, and \"improve the ad copy\" is a rounding error against a 2× gap. For ecommerce, extend one step: €2.00 CPC at 4% CVR means €50 cost per order, so contribution margin must exceed €50 before you even discuss ROAS targets.<\/p>\n<p><strong>The diagnostic ladder.<\/strong> When a campaign underperforms, go in order and stop at the first broken rung:<\/p>\n<ol>\n<li><strong>Impressions<\/strong> — showing at all? Budget, bids, approvals, targeting, search volume.<\/li>\n<li><strong>CTR<\/strong> — shown, not clicked. Copy, offer, position, intent mismatch.<\/li>\n<li><strong>CPC<\/strong> — clicked, too expensive. Quality Score, competition, match type, bid strategy.<\/li>\n<li><strong>Landing page CVR<\/strong> — clicks, no conversions. Message match, speed, form friction, trust (M07).<\/li>\n<li><strong>The offer<\/strong> — good page, still nothing. Price, proposition, or audience. Google Ads cannot fix this.<\/li>\n<\/ol>\n<p>Beginners spend their week on rung 2. Most real problems live on rungs 4 and 5.<\/p>", "text": "Computing max CPC. Work backwards from the money. Target CPA €50, landing page converts clicks to leads at 4%: Max CPC = target CPA × conversion rate = €50 × 0.04 = €2.00 If the auction demands €4, you have exactly three options: raise conversion rate (page, offer, form), raise what a conversion is worth (price, LTV, close rate), or don't run in this auction. There is no fourth, and \"improve the ad copy\" is a rounding error against a 2× gap. For ecommerce, extend one step: €2.00 CPC at 4% CVR means €50 cost per order, so contribution margin must exceed €50 before you even discuss ROAS targets. The diagnostic ladder. When a campaign underperforms, go in order and stop at the first broken rung: Impressions — showing at all? Budget, bids, approvals, targeting, search volume. CTR — shown, not clicked. Copy, offer, position, intent mismatch. CPC — clicked, too expensive. Quality Score, competition, match type, bid strategy. Landing page CVR — clicks, no conversions. Message match, speed, form friction, trust (M07). The offer — good page, still nothing. Price, proposition, or audience. Google Ads cannot fix this. Beginners spend their week on rung 2. Most real problems live on rungs 4 and 5."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Manual targeting is over; input quality is the job.<\/strong> Your leverage is the conversion action you choose, the first-party data you feed, asset quality, and your negatives.<\/li>\n<li><strong>The SERP is more answer-shaped.<\/strong> With ~60% of Google searches ending without a click and AI Overviews sharply cutting top-position organic CTR, paid results carry more of the click load — which argues for higher CPCs, not lower.<\/li>\n<li><strong>Chrome did not remove third-party cookies.<\/strong> April 2025 confirmed they stay; October 2025 Google announced retirement of most Privacy Sandbox tech (Topics, Protected Audience, Attribution Reporting), deprecated in Chrome 144 and targeted for removal in Chrome 150. Your real constraints are GDPR/ePrivacy consent, Safari ITP, ad blockers and iOS ATT. Enhanced conversions and Consent Mode v2 patch those gaps.<\/li>\n<li><strong>Assume in-platform CPA is optimistic.<\/strong> PMax and AI Max blur which query drove what. Validate with holdouts.<\/li>\n<\/ul>", "text": "Manual targeting is over; input quality is the job. Your leverage is the conversion action you choose, the first-party data you feed, asset quality, and your negatives. The SERP is more answer-shaped. With ~60% of Google searches ending without a click and AI Overviews sharply cutting top-position organic CTR, paid results carry more of the click load — which argues for higher CPCs, not lower. Chrome did not remove third-party cookies. April 2025 confirmed they stay; October 2025 Google announced retirement of most Privacy Sandbox tech (Topics, Protected Audience, Attribution Reporting), deprecated in Chrome 144 and targeted for removal in Chrome 150. Your real constraints are GDPR/ePrivacy consent, Safari ITP, ad blockers and iOS ATT. Enhanced conversions and Consent Mode v2 patch those gaps. Assume in-platform CPA is optimistic. PMax and AI Max blur which query drove what. Validate with holdouts."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Sending all traffic to the homepage.<\/strong> Kills message match and Quality Score at once.<\/li>\n<li><strong>Tracking the wrong event.<\/strong> Optimising to \"all form submits\" when half are spam teaches the algorithm to find more spam.<\/li>\n<li><strong>Over-segmenting into SKAGs.<\/strong> Starves smart bidding.<\/li>\n<li><strong>Ignoring the search terms report,<\/strong> then discovering 30% of spend went somewhere irrelevant.<\/li>\n<li><strong>Judging PMax by its own report.<\/strong> It grades its own homework.<\/li>\n<li><strong>Calling cheap branded CPA \"performance.\"<\/strong><\/li>\n<li><strong>Changing bids and budgets daily.<\/strong> Change one thing, then wait 1–2 weeks or ~30 conversions.<\/li>\n<\/ul>", "text": "Sending all traffic to the homepage. Kills message match and Quality Score at once. Tracking the wrong event. Optimising to \"all form submits\" when half are spam teaches the algorithm to find more spam. Over-segmenting into SKAGs. Starves smart bidding. Ignoring the search terms report, then discovering 30% of spend went somewhere irrelevant. Judging PMax by its own report. It grades its own homework. Calling cheap branded CPA \"performance.\" Changing bids and budgets daily. Change one thing, then wait 1–2 weeks or ~30 conversions."}, {"h": "Exercise (50 minutes)", "html": "<p>Build a full campaign plan for <strong>your chosen business<\/strong>. Spend nothing.<\/p>\n<ol>\n<li><strong>Structure.<\/strong> Name campaigns and ad groups. Justify each split by budget or target, not tidiness. Include a brand campaign and state whether you would actually run it.<\/li>\n<li><strong>20 keywords by intent.<\/strong> Label each transactional (\"buy\", \"near me\", \"pricing\"), commercial investigation (\"best\", \"vs\", \"alternatives\"), or informational. Assign a match type and say why. Use Keyword Planner for volume and bid estimates.<\/li>\n<li><strong>Negatives.<\/strong> At least 15 terms across account and campaign level, including three you'd only find by imagining how broad match misfires.<\/li>\n<li><strong>Three ad variants<\/strong> for your highest-intent ad group: 8 distinct headlines, 3 descriptions, 4 sitelinks, 4 callouts. Write the landing page headline beside them and check the three read as one sentence.<\/li>\n<li><strong>The math.<\/strong> Target CPA (derive it from your M05 CAC ceiling), estimated landing page conversion rate, computed max CPC. Compare to Keyword Planner's top-of-page bids. If your max CPC is below market, name the three things you'd change and which you'd try first.<\/li>\n<li><strong>Bidding plan.<\/strong> Strategy at launch, the trigger to switch to tCPA, and the conversion volume needed to get there.<\/li>\n<\/ol>", "text": "Build a full campaign plan for your chosen business . Spend nothing. Structure. Name campaigns and ad groups. Justify each split by budget or target, not tidiness. Include a brand campaign and state whether you would actually run it. 20 keywords by intent. Label each transactional (\"buy\", \"near me\", \"pricing\"), commercial investigation (\"best\", \"vs\", \"alternatives\"), or informational. Assign a match type and say why. Use Keyword Planner for volume and bid estimates. Negatives. At least 15 terms across account and campaign level, including three you'd only find by imagining how broad match misfires. Three ad variants for your highest-intent ad group: 8 distinct headlines, 3 descriptions, 4 sitelinks, 4 callouts. Write the landing page headline beside them and check the three read as one sentence. The math. Target CPA (derive it from your M05 CAC ceiling), estimated landing page conversion rate, computed max CPC. Compare to Keyword Planner's top-of-page bids. If your max CPC is below market, name the three things you'd change and which you'd try first. Bidding plan. Strategy at launch, the trigger to switch to tCPA, and the conversion volume needed to get there."}, {"h": "Recall (15 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Ad Rank in words, and why a competitor can rank above you while paying less.<\/li>\n<li>What \"exact match\" matches in 2026, and your main lever of control.<\/li>\n<li>Why granular SKAG structures now hurt performance.<\/li>\n<li>The max CPC formula, and your three options when market price exceeds it.<\/li>\n<li>The five rungs of the diagnostic ladder, in order.<\/li>\n<li>Two ways to control Performance Max.<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Ad Rank in words, and why a competitor can rank above you while paying less. What \"exact match\" matches in 2026, and your main lever of control. Why granular SKAG structures now hurt performance. The max CPC formula, and your three options when market price exceeds it. The five rungs of the diagnostic ladder, in order. Two ways to control Performance Max."}, {"h": "If you remember one thing", "html": "<p><strong>Paid search rewards arithmetic before cleverness.<\/strong> Compute the max CPC you can afford, decide whether the auction is winnable — and never let a channel's own report be your only evidence that it worked.<\/p>", "text": "Paid search rewards arithmetic before cleverness. Compute the max CPC you can afford, decide whether the auction is winnable — and never let a channel's own report be your only evidence that it worked."}], "suggest": [["Why is the easiest channel to measure the easiest to waste money in?", "How would I test whether those conversions would have happened anyway?", "What has to be true before paid search is worth trying for me?"], ["How does a competitor outrank me while paying less per click?", "Walk me through Ad Rank with two advertisers and real numbers", "My Quality Score is 4 — how do I find which component is broken?"], ["Why is max CPC target CPA times conversion rate, not divided by it?", "Redo the max CPC maths with a €200 target CPA and 2% conversion", "The auction wants double my max CPC — which of the three options first?"], ["What does 'input quality is the job' mean if I can't target manually?", "Why would AI Overviews argue for higher CPCs rather than lower?", "What first-party data can a small business actually feed Google?"], ["Why do granular SKAG structures starve smart bidding?", "Show me a search terms report where 30% of spend went astray", "How do I stop my account optimising towards spam form fills?"], ["How do I justify a campaign split by budget rather than by tidiness?", "Give me three negatives you'd only find by imagining broad match misfires", "How would I decide whether a brand campaign is worth running?"], ["What does exact match actually match in 2026?", "Say Ad Rank in plain words, with the cheaper advertiser winning", "Take my account through the five rungs of the diagnostic ladder"], ["What arithmetic tells me an auction is unwinnable before I spend?", "Show me the numbers where a winnable auction turns unwinnable", "What evidence beyond Google's own report proves the channel worked?"]], "assess": {"predict": "In a Google Ads auction, do you think the advertiser with the highest bid always wins and always pays the most? Guess why or why not.", "quiz": [{"q": "A competitor consistently appears above you and, you learn, pays less per click. What explains this?", "options": ["They are using exact match while you use phrase match", "Their daily budget is larger, which raises their position in the auction", "Ad Rank is roughly bid multiplied by ad quality plus expected asset impact, so better ads and a better landing page can outrank a higher bid at a lower price", "They have been running longer, and account age is a ranking component"], "answer": 2, "why": "Ad Rank combines bid with expected CTR, ad relevance and landing page experience plus expected asset impact, and you pay roughly the minimum needed to beat the advertiser below you - so quality functions as a discount. Budget size is not an Ad Rank component; it caps how long you can show, not where you rank."}, {"q": "An account has 40 conversions a month split across 12 campaigns. Smart bidding is underperforming. What is the first structural fix?", "options": ["Consolidate into fewer, better-fed campaigns, splitting only where separate budget or separate targets are genuinely needed", "Switch every campaign to target ROAS so the algorithm has a clearer goal", "Break out single-keyword ad groups so each keyword gets its own signal", "Move all keywords to exact match to reduce wasted spend"], "answer": 0, "why": "Smart bidding needs conversion volume per campaign to learn, and splitting 40 conversions across 12 campaigns starves every one of them; the modern default is fewer, better-fed campaigns split only by budget, target, geography or language. SKAGs are the named harmful old advice, and tROAS wants even more volume than the roughly 30 conversions a month smart bidding already needs."}, {"q": "Target CPA is 50 euros and the landing page converts clicks to leads at 4%. Keyword Planner shows top-of-page bids around 4 euros. What is your max CPC and what are your options?", "options": ["Max CPC is 12.50 euros; you have headroom, so raise bids and take more volume", "Max CPC is 2.00 euros; raise conversion rate, raise what a conversion is worth, or do not run in this auction", "Max CPC is 2.00 euros; rewrite the ad copy to close the gap", "Max CPC is 0.50 euros; the auction is unwinnable at any conversion rate"], "answer": 1, "why": "Max CPC equals target CPA multiplied by conversion rate: 50 euros times 0.04 equals 2.00 euros, and against a 4 euro market price the module gives exactly three options - raise conversion rate, raise conversion value, or do not run. Ad copy is the tempting fourth option, but the module calls it a rounding error against a 2x gap."}, {"q": "A campaign shows healthy impressions and a 6% CTR, CPC is in line with the category, but CPA is triple target. Using the diagnostic ladder, where do you look?", "options": ["Rung 1, impressions - check budget, bids and approvals", "Rung 2, CTR - test new headlines to lift click share", "Rung 3, CPC - review Quality Score and match types", "Rung 4 then rung 5 - landing page CVR first, then whether the offer itself is wrong"], "answer": 3, "why": "You go in order and stop at the first broken rung; impressions, CTR and CPC are all healthy here, so the break is at landing page conversion - message match, speed, form friction, trust - and if the page checks out, the offer. The module notes beginners spend their week on rung 2, but most real problems live on rungs 4 and 5."}, {"q": "Your brand campaign shows a 3 euro CPA against a 40 euro non-brand CPA and your manager wants to scale it. What is the honest position?", "options": ["Scale it - it is the most efficient campaign in the account", "Pause it permanently, since branded search is never incremental", "Most of it is probably not incremental, but there are legitimate reasons to run it - and the test is to pause brand in half your geographies for two weeks and watch total branded conversions, paid plus organic", "Move the brand terms into Performance Max so the budget is allocated automatically"], "answer": 2, "why": "The module says a spectacular branded CPA is mostly non-incremental because those people were arriving via the organic result below, but names legitimate reasons - competitors bidding on you, a crowded SERP, message control, a fragile organic position - and gives the geo holdout as the test almost nobody runs. Pausing permanently overshoots; moving brand into PMax is worse, since PMax harvesting branded search and claiming credit is a named failure mode."}, {"q": "Someone advises you to build tightly controlled exact-match keyword lists so you only pay for the literal query. What is wrong with that in 2026?", "options": ["Exact match no longer means exact - it matches the same meaning including plurals, synonyms and reordering, so negatives are the real control surface", "Exact match has been retired; only broad and phrase remain", "Exact match still works literally, but it is too expensive for most accounts", "Exact match prevents smart bidding from functioning at all"], "answer": 0, "why": "The module states that exact match now matches the same meaning - running shoes can serve sneakers for jogging - and that because match types leak, negative keywords are how you steer, across account, campaign and ad group layers. The retirement claim is false: all three match types still exist, they just behave semantically."}], "cards": [{"front": "State Ad Rank in words and explain what Quality Score is for.", "back": "Roughly bid times ad quality (expected CTR, ad relevance, landing page experience) plus expected asset impact, filtered by context and thresholds. Quality Score reports the same three components as a diagnostic, not a vanity score."}, {"front": "What is the max CPC formula, and the three options when market price exceeds it?", "back": "Max CPC equals target CPA times landing page conversion rate. Options: raise conversion rate, raise what a conversion is worth, or do not run in this auction. There is no fourth."}, {"front": "List the five rungs of the paid search diagnostic ladder in order.", "back": "Impressions, CTR, CPC, landing page conversion rate, the offer. Go in order and stop at the first broken rung; most real problems sit on rungs four and five."}, {"front": "How much conversion volume does smart bidding need, and what do you do below it?", "back": "Roughly 30 or more conversions per campaign per month; tROAS wants more. Below that use maximize conversions, or move the conversion action earlier in the funnel so there is signal."}, {"front": "Name four ways to control Performance Max.", "back": "Brand exclusions so it does not eat free traffic, account-level negative keywords, separate asset groups per category or persona for readable results, audience signals as hints, and feed quality - which for ecommerce is the targeting."}, {"front": "How do you set a monthly budget cap in Google Ads, and how should you scale it?", "back": "Daily budget times about 30.4 is the monthly cap; Google may overspend up to 2x on a day but not over the month. Raise budgets in 20-30% steps to avoid re-triggering learning."}], "elaborate": ["Derive a target CPA for your chosen business from the CAC ceiling you set in M05, estimate your landing page conversion rate honestly, and compute your max CPC. Compare it to what Keyword Planner shows for your top three terms, then state which of the three levers you would pull first and what would have to be true for it to work.", "M07 argued that message match is the most common fixable defect in paid campaigns. Write the query, the ad headline and the landing page headline for your highest-intent ad group so the three read as one continuous sentence, then explain which rung of the diagnostic ladder that fix is operating on."], "transfer": {"scenario": "A home services company spends 9,000 euros a month on Google Ads. Performance Max takes 6,000 of it and reports a 22 euro CPA; the non-brand Search campaign spends 3,000 at a 78 euro CPA. There is no brand exclusion on PMax and no account-level negative keyword list. The search terms report on the Search campaign shows 31% of spend on queries containing \"jobs,\" \"salary\" and \"how to.\" Conversion tracking fires on all form submits, and the office manager says roughly half the forms are spam or job applicants. Target CPA is 60 euros.", "prompt": "Diagnose what the 22 euro PMax CPA actually represents and set out your first four changes in priority order.", "model": "The 22 euro CPA is not trustworthy. With no brand exclusion, PMax is almost certainly harvesting branded search and claiming credit for people arriving anyway, and it grades its own homework - reporting is opaque by design. Worse, the conversion action is corrupt: optimising to all form submits when half are spam or job applicants teaches both campaigns to find more of the same, so every CPA here is understated. In order. First, fix the conversion action - qualified leads only, or import offline conversions - because everything downstream optimises on that signal. Second, add brand exclusions plus an account-level negative list covering jobs, salary and how-to, which addresses the 31% of Search spend going to non-buyers. Third, review the search terms report weekly for a month: promote, block or ignore each term. Fourth, validate PMax with a geo holdout rather than its own report."}}}, {"id": "M11", "num": 11, "part": "p2", "title": "Paid Social and Creative", "short": "Paid social & creative", "meta": "120 minutes (55 read · 50 exercise · 15 recall)", "minutes": 120, "sections": [{"h": "Why this matters", "html": "<p>Search waits for intent. Paid social interrupts people who weren't looking for you, which makes it the main scalable way to <em>create<\/em> demand (M01) rather than harvest it. It is also the channel where the platform has taken almost every decision away from you except one: what the ad says and shows. If you learn only one skill here, learn to brief and judge creative — that is now the actual targeting mechanism.<\/p>", "text": "Search waits for intent. Paid social interrupts people who weren't looking for you, which makes it the main scalable way to create demand (M01) rather than harvest it. It is also the channel where the platform has taken almost every decision away from you except one: what the ad says and shows. If you learn only one skill here, learn to brief and judge creative — that is now the actual targeting mechanism."}, {"h": "Core concepts", "html": "<h3>Interruption vs. intent<\/h3>\n<p>On Google you buy a query. On Meta, TikTok, or YouTube you buy attention from someone mid-scroll. Consequences: conversion rates are lower, CPMs are cheaper, and the ad has to do the work that the search query did for free — establish that a problem exists, that it's theirs, and that you solve it. This is why paid social copy is longer and more emotional than search copy, and why \"we ran ads and nobody converted\" is usually a creative failure, not a targeting failure.<\/p>\n<h3>Creative is the targeting<\/h3>\n<p>Meta's Advantage+ Audience and broad targeting mean the delivery system decides who sees the ad. It decides largely by watching who responds to <em>this specific creative<\/em>. A founder-to-camera ad about back pain finds people with back pain. A slick brand film finds people who like slick brand films.<\/p>\n<p>The practical rule: you no longer narrow the audience with checkboxes, you narrow it with the hook. Detailed interest targeting still exists but in many verticals it now underperforms broad, and Meta has consolidated much of it away.<\/p>\n<h3>Meta campaign structure<\/h3>\n<p>Three levels:<\/p>\n<ul>\n<li><strong>Campaign<\/strong> — objective and budget strategy. The objective choice is the single highest-leverage setting in the account. Choosing \"Traffic\" when you want purchases tells the system to find cheap clickers, and it will. Pick the objective that matches the outcome you actually want (Sales, Leads, App Promotion, Awareness, Engagement).<\/li>\n<li><strong>Ad set<\/strong> — budget, audience, placements, optimisation event. Optimise for the deepest event you have enough volume for.<\/li>\n<li><strong>Ad<\/strong> — the creative.<\/li>\n<\/ul>\n<p><strong>Advantage+ Shopping Campaigns<\/strong> (now largely folded into the standard Sales objective as Advantage+ features) automate audience, placement, and creative permutation. For most ecommerce accounts, one broad, well-fed campaign beats a hand-built structure.<\/p>\n<h3>The learning phase<\/h3>\n<p>A new ad set enters learning and needs roughly <strong>50 optimisation events in 7 days<\/strong> to exit. Under that it stays in \"Learning limited\" and delivery is erratic and expensive. This is why over-segmenting kills performance: four ad sets at €25/day each will each fail to reach 50 events, where one ad set at €100/day would. Significant edits (budget change over ~20%, new creative, changed optimisation event) restart learning. Consolidate budget; use Advantage campaign budget rather than per-ad-set budgets unless you have a reason.<\/p>\n<h3>Signal quality: CAPI and first-party data<\/h3>\n<p>The browser pixel alone loses a large share of events to ad blockers, Safari's ITP, and iOS ATT opt-outs. The <strong>Conversions API<\/strong> sends events server-side from your backend, matched to users by hashed email, phone, click ID and other parameters. Better matching means better attribution <em>and<\/em> better optimisation, because the algorithm learns from more complete data.<\/p>\n<p>What to do: run pixel + CAPI together with deduplication via a shared <code>event_id<\/code>; pass rich customer parameters; upload customer lists for Advantage+ and exclusions; watch the Event Match Quality score. Signal quality is now a bigger performance lever than bid tinkering.<\/p>\n<h3>Creative strategy<\/h3>\n<p><strong>The first 2 seconds decide everything.<\/strong> If the hook fails, nothing else in the ad exists. Hooks that work: a specific claim, a visible problem, a pattern interrupt, a direct callout of who it's for (\"If you rent in Dublin…\").<\/p>\n<p>Formats that consistently perform:<\/p>\n<ul>\n<li><strong>UGC / creator-style<\/strong> — feels native, cheap to produce, works cold.<\/li>\n<li><strong>Testimonial<\/strong> — someone like the viewer saying it worked.<\/li>\n<li><strong>Demo<\/strong> — the product doing the thing, filmed plainly.<\/li>\n<li><strong>Founder-to-camera<\/strong> — credibility and specificity; strong for new brands.<\/li>\n<li><strong>Problem–agitate–solve<\/strong> — the reliable direct-response skeleton.<\/li>\n<li><strong>Listicle / \"3 reasons\"<\/strong> — high information density, holds attention.<\/li>\n<li><strong>Static image and carousel<\/strong> — cheap, fast to iterate, still wins in many B2B and considered-purchase categories. Do not assume video always beats static; test it.<\/li>\n<\/ul>\n<p><strong>Test concepts, not colours.<\/strong> The hierarchy is <strong>concept → angle → format → variation<\/strong>. A concept is a whole idea (\"the ad is a customer complaint about our competitor\"). An angle is the argument (speed vs. price vs. status). A format is the execution (UGC vs. demo). A variation is the thumbnail, the caption, the button. Variations produce small differences; concepts produce the outliers that carry the account. Spend your testing budget high in the hierarchy.<\/p>\n<p><strong>Fatigue and refresh.<\/strong> Performance decays as frequency climbs within a saturating audience. Watch for rising CPM and falling CTR on the same ad. At small budgets a winner can last months; at high spend, plan a meaningful new concept every 2–4 weeks and treat 3–5 fresh concepts per month as a baseline production rate.<\/p>\n<p><strong>Briefing creative properly.<\/strong> A usable brief names: the audience and their belief before seeing the ad, the one thing they should believe after, the hook line, the proof, the offer, the call to action, format and duration, and the specific thing being tested. \"Make it pop\" is not a brief.<\/p>\n<h3>Platforms in brief<\/h3>\n<ul>\n<li><strong>Meta<\/strong> — broadest reach, best optimisation, the default starting point for most B2C and much SMB B2B.<\/li>\n<li><strong>TikTok<\/strong> — creative-led discovery; native, unpolished content wins; production speed matters more than production value.<\/li>\n<li><strong>YouTube<\/strong> — reach and demand creation at scale, strong for explaining a considered product; buy through Google Ads, often alongside PMax.<\/li>\n<li><strong>LinkedIn<\/strong> — expensive CPMs but precise firmographic targeting (title, seniority, company size, company list). Worth it only where deal value is high; lead gen forms convert well.<\/li>\n<li><strong>Reddit<\/strong> — cheap attention, community-sensitive, works when the ad reads like a participant rather than a brand.<\/li>\n<\/ul>\n<h3>Retargeting, frequency, and incrementality<\/h3>\n<p>Retargeting reports beautiful ROAS and is the most over-credited spend in most accounts: you are paying to reach people who already visited, many of whom would have returned anyway. It is where non-incremental spend hides, alongside branded search. Keep it, cap it, and size it honestly — a common failure is a retargeting budget large enough that the same 4,000 people see the ad ten times a week.<\/p>\n<p>Sensible frequency: roughly 1–3 per week for prospecting; retargeting windows tightened to the actual consideration cycle (7 days for impulse purchases, 30–90 for considered ones). Prove the value with a geo or audience holdout (M15), not with the platform's ROAS column.<\/p>", "text": "Interruption vs. intent On Google you buy a query. On Meta, TikTok, or YouTube you buy attention from someone mid-scroll. Consequences: conversion rates are lower, CPMs are cheaper, and the ad has to do the work that the search query did for free — establish that a problem exists, that it's theirs, and that you solve it. This is why paid social copy is longer and more emotional than search copy, and why \"we ran ads and nobody converted\" is usually a creative failure, not a targeting failure. Creative is the targeting Meta's Advantage+ Audience and broad targeting mean the delivery system decides who sees the ad. It decides largely by watching who responds to this specific creative . A founder-to-camera ad about back pain finds people with back pain. A slick brand film finds people who like slick brand films. The practical rule: you no longer narrow the audience with checkboxes, you narrow it with the hook. Detailed interest targeting still exists but in many verticals it now underperforms broad, and Meta has consolidated much of it away. Meta campaign structure Three levels: Campaign — objective and budget strategy. The objective choice is the single highest-leverage setting in the account. Choosing \"Traffic\" when you want purchases tells the system to find cheap clickers, and it will. Pick the objective that matches the outcome you actually want (Sales, Leads, App Promotion, Awareness, Engagement). Ad set — budget, audience, placements, optimisation event. Optimise for the deepest event you have enough volume for. Ad — the creative. Advantage+ Shopping Campaigns (now largely folded into the standard Sales objective as Advantage+ features) automate audience, placement, and creative permutation. For most ecommerce accounts, one broad, well-fed campaign beats a hand-built structure. The learning phase A new ad set enters learning and needs roughly 50 optimisation events in 7 days to exit. Under that it stays in \"Learning limited\" and delivery is erratic and expensive. This is why over-segmenting kills performance: four ad sets at €25/day each will each fail to reach 50 events, where one ad set at €100/day would. Significant edits (budget change over ~20%, new crea"}, {"h": "How it works in practice", "html": "<p><strong>How CPM × CTR × CVR determines CPA.<\/strong> Only three numbers matter, and every optimisation is one of them.<\/p>\n<ul>\n<li>CPM €10 → 1,000 impressions cost €10.<\/li>\n<li>CTR 1% → 10 clicks, so CPC = €1.00.<\/li>\n<li>Landing page CVR 3% → 0.3 conversions from those 10 clicks.<\/li>\n<li>CPA = €10 / 0.3 = <strong>€33<\/strong>.<\/li>\n<\/ul>\n<p>Now double CTR to 2% — better creative, nothing else changes: 20 clicks, 0.6 conversions, CPA = <strong>€17<\/strong>. Creative quality halved your customer acquisition cost without touching targeting or bids.<\/p>\n<p>Alternatively hold CTR and lift landing page CVR from 3% to 5%: 0.5 conversions, CPA = <strong>€20<\/strong>. This is why M07 (CRO) and M11 are the same problem viewed from two ends.<\/p>\n<p><strong>Reading the funnel metrics.<\/strong> CPM tells you how expensive the audience and how competitive the auction. CTR tells you whether the creative earns the click. CVR tells you whether the page and offer deliver. For video, three more: <strong>hook rate<\/strong> (3-second views ÷ impressions — did the opening stop them), <strong>hold rate<\/strong> (thru-plays or 15-second views ÷ 3-second views — did it keep them), and <strong>thumbstop<\/strong>, used loosely for the same stopping power. A high hook rate with low hold rate means a clickbait opening the ad can't pay off. A low hook rate means the first frame failed and nothing downstream is diagnosable yet.<\/p>", "text": "How CPM × CTR × CVR determines CPA. Only three numbers matter, and every optimisation is one of them. CPM €10 → 1,000 impressions cost €10. CTR 1% → 10 clicks, so CPC = €1.00. Landing page CVR 3% → 0.3 conversions from those 10 clicks. CPA = €10 / 0.3 = €33 . Now double CTR to 2% — better creative, nothing else changes: 20 clicks, 0.6 conversions, CPA = €17 . Creative quality halved your customer acquisition cost without touching targeting or bids. Alternatively hold CTR and lift landing page CVR from 3% to 5%: 0.5 conversions, CPA = €20 . This is why M07 (CRO) and M11 are the same problem viewed from two ends. Reading the funnel metrics. CPM tells you how expensive the audience and how competitive the auction. CTR tells you whether t
