<title>Marketing Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f1; --surface:#ffffff; --surface-2:#f1eee8; --surface-3:#e9e5dd;
  --text:#191817; --text-2:#4a4744; --muted:#7a756e; --line:#e2ddd4; --line-2:#cfc8bb;
  --accent:#0f6b60; --accent-2:#0b544b; --accent-soft:#dcefec; --accent-ink:#0a4f47;
  --warm:#b45309; --warm-soft:#fdf1e0;
  --ok:#137a4a; --ok-soft:#dff2e6; --bad:#a32b2b; --bad-soft:#fbe6e4;
  --shadow:0 1px 2px rgba(25,24,23,.05),0 8px 24px rgba(25,24,23,.06);
  --shadow-lg:0 2px 6px rgba(25,24,23,.07),0 24px 60px rgba(25,24,23,.13);
  --radius:14px; --radius-sm:9px;
  --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131518; --surface:#1a1d21; --surface-2:#22262b; --surface-3:#2b3037;
    --text:#eceae7; --text-2:#c3c0bb; --muted:#8f8b85; --line:#2b2f35; --line-2:#3a4048;
    --accent:#4fd1c0; --accent-2:#6fe0d1; --accent-soft:#16302d; --accent-ink:#8ceadd;
    --warm:#e0a458; --warm-soft:#2e2415;
    --ok:#5cc98d; --ok-soft:#14301f; --bad:#f08b84; --bad-soft:#33191a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.30);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#131518; --surface:#1a1d21; --surface-2:#22262b; --surface-3:#2b3037;
  --text:#eceae7; --text-2:#c3c0bb; --muted:#8f8b85; --line:#2b2f35; --line-2:#3a4048;
  --accent:#4fd1c0; --accent-2:#6fe0d1; --accent-soft:#16302d; --accent-ink:#8ceadd;
  --warm:#e0a458; --warm-soft:#2e2415;
  --ok:#5cc98d; --ok-soft:#14301f; --bad:#f08b84; --bad-soft:#33191a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.30);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink);text-underline-offset:3px}
::selection{background:var(--accent-soft)}
.hidden{display:none !important}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
#sidebar{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain}
#main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;padding:10px 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.view{padding:26px 22px 100px;flex:1}
.wrap{max-width:780px;margin:0 auto}
.wrap-wide{max-width:1080px;margin:0 auto}

/* ---------- sidebar ---------- */
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--serif);font-size:19px;margin:0;letter-spacing:-.2px;font-weight:600}
.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.ringwrap:hover{background:var(--surface-2)}
.ring{width:46px;height:46px;flex:none}
.ringtxt{font-size:12px;color:var(--muted);line-height:1.35}
.ringtxt b{display:block;font-size:15px;color:var(--text);font-weight:600}
.navsec{padding:14px 12px 4px}
.navsec h2{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 8px;font-weight:600}
.navlink{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:none;border-radius:8px;font-size:13.5px;color:var(--text-2);text-align:left}
.navlink:hover{background:var(--surface-2);color:var(--text)}
.navlink.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navlink .ico{width:16px;flex:none;opacity:.8;display:flex}
.pill{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warm-soft);color:var(--warm)}
.partgroup{margin:0 0 2px}
.parthead{display:flex;align-items:baseline;gap:8px;padding:12px 20px 5px}
.parthead .pn{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.parthead .ph{font-size:10.5px;color:var(--line-2);margin-left:auto}
.mrow{display:flex;align-items:center;gap:9px;width:100%;padding:6px 12px 6px 20px;border:0;background:none;text-align:left;font-size:13.5px;color:var(--text-2);border-left:2px solid transparent}
.mrow:hover{background:var(--surface-2);color:var(--text)}
.mrow.active{background:var(--accent-soft);color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
.mrow .code{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;width:26px}
.mrow.active .code{color:var(--accent-ink)}
.mrow .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.dot.part{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.done{background:var(--accent);border-color:var(--accent)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:500;transition:.13s}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0b1a18}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.searchbtn{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.searchbtn:hover{border-color:var(--line-2)}
.searchbtn kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:10.5px;padding:1.5px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

/* ---------- cards & type ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.tight{padding:15px}
h2.big{font-family:var(--serif);font-size:27px;line-height:1.2;margin:0 0 6px;font-weight:600;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .n{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warm-soft);color:var(--warm)}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- reading ---------- */
.readhead{margin-bottom:18px}
.readhead .crumb{font-size:12px;color:var(--muted);margin-bottom:7px}
.readhead h2{font-family:var(--serif);font-size:32px;line-height:1.15;margin:0 0 8px;font-weight:600;letter-spacing:-.6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 22px;padding-bottom:2px}
.step{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);font-weight:500}
.step:hover{border-color:var(--line-2);color:var(--text)}
.step.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .step.on{color:#0b1a18}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .step.on{color:#0b1a18}}
.step .num{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--surface-3);font-size:10.5px;font-weight:700}
.step.on .num{background:rgba(255,255,255,.25)}
.step.did{border-color:var(--accent);color:var(--accent-ink)}
.step.did .num{background:var(--accent-soft);color:var(--accent-ink)}

.sec{border-top:1px solid var(--line);padding:20px 0 4px}
.sec:first-child{border-top:0}
.sechead{display:flex;align-items:flex-start;gap:11px;margin-bottom:2px}
.check{flex:none;width:21px;height:21px;margin-top:5px;border-radius:6px;border:1.5px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{opacity:0;width:12px;height:12px}
.check.on svg{opacity:1}
.sechead h3{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;letter-spacing:-.3px;flex:1}
.sec.done .prose{opacity:.62}
.prose{font-size:16.5px;line-height:1.72;color:var(--text-2);padding-left:32px}
.prose h3{font-size:17px;font-weight:700;color:var(--text);margin:26px 0 8px;font-family:var(--sans);letter-spacing:-.1px}
.prose h4{font-size:15px;font-weight:700;color:var(--text);margin:20px 0 6px}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 15px;padding-left:22px}
.prose li{margin:0 0 7px}
.prose strong{color:var(--text);font-weight:650}
.prose blockquote{margin:18px 0;padding:13px 18px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;color:var(--text);font-size:16px}
.prose blockquote p:last-child{margin:0}
.prose code{font-family:var(--mono);font-size:.87em;background:var(--surface-2);padding:1.5px 5px;border-radius:5px;color:var(--text)}
.prose pre{background:var(--surface-2);padding:14px;border-radius:10px;overflow-x:auto;border:1px solid var(--line)}
.prose pre code{background:none;padding:0}
.prose table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14.5px;display:block;overflow-x:auto}
.prose th{text-align:left;padding:9px 11px;background:var(--surface-2);border-bottom:1px solid var(--line-2);font-size:12.5px;letter-spacing:.02em;color:var(--text);white-space:nowrap}
.prose td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.prose hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.prose a{color:var(--accent-ink)}
.toc{position:sticky;top:78px;font-size:12.5px;line-height:1.5}
.toc a{display:block;padding:5px 10px;color:var(--muted);text-decoration:none;border-left:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a:hover{color:var(--text)}
.toc a.on{color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}

/* ---------- quiz ---------- */
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);margin-bottom:9px;transition:.12s;font-size:15px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.why{margin-top:12px;padding:14px 16px;border-radius:11px;background:var(--surface-2);border-left:3px solid var(--accent);font-size:14.5px;color:var(--text-2)}
.conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2)}
.qmeta{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.qmeta .bar{flex:1;max-width:180px}

/* ---------- flashcards ---------- */
.flash{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:34px 26px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);cursor:pointer}
.flash .front{font-family:var(--serif);font-size:23px;line-height:1.35;font-weight:600;letter-spacing:-.3px}
.flash .back{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:16px;color:var(--text-2);max-width:560px}
.gradebar{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.gradebar button{padding:11px 6px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center}
.gradebar button:hover{border-color:var(--accent);background:var(--accent-soft)}
.gradebar small{font-weight:400;font-size:10.5px;color:var(--muted)}

/* ---------- palette ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,14,13,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px 20px}
.palette{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;max-height:70vh;display:flex;flex-direction:column}
.palette input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 18px;font-size:16px;background:transparent}
.palette input:focus{outline:0}
.results{overflow-y:auto;padding:7px}
.res{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:9px}
.res:hover,.res.on{background:var(--accent-soft)}
.res .t{font-size:14px;font-weight:600;color:var(--text)}
.res .c{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg);padding:24px;max-height:76vh;overflow-y:auto}

/* ---------- misc ---------- */
.glossrow{padding:11px 0;border-bottom:1px solid var(--line)}
.glossrow b{color:var(--text);font-weight:650}
.star{color:var(--warm);font-weight:700}
.modelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s}
.modelcard:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.modelcard h3{font-family:var(--serif);font-size:18px;margin:0 0 4px;font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-family:var(--serif);font-size:22px;color:var(--text);margin-bottom:6px}
.calrow{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;padding:8px 0;font-size:13.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:500;z-index:200;opacity:0;transition:.28s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.footnav{display:flex;gap:10px;justify-content:space-between;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;padding:11px 14px;background:var(--surface-2);border-radius:10px;line-height:1.5}
.hint .i{flex:none;font-weight:700;color:var(--accent)}
.readbar{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:60;transition:width .12s}
#menubtn{display:none}

/* ---------- marks, ask ---------- */
mark.hl{background:var(--warm-soft);box-shadow:inset 0 -2px 0 var(--warm);color:inherit;padding:1px 0;cursor:pointer;border-radius:2px}
mark.hl:hover{background:var(--warm);color:#fff}
mark.hl.q{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
mark.hl.q:hover{background:var(--accent);color:#fff}
mark.hl.answered{background:var(--ok-soft);box-shadow:inset 0 -2px 0 var(--ok)}
.selbar{position:absolute;z-index:75;display:flex;gap:2px;background:var(--text);border-radius:11px;padding:4px;box-shadow:var(--shadow-lg);transform:translate(-50%,-100%)}
.selbar button{color:var(--bg);background:transparent;border:0;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;display:flex;gap:5px;align-items:center;white-space:nowrap}
.selbar button:hover{background:rgba(127,127,127,.35)}
.selbar .div{width:1px;background:rgba(127,127,127,.4);margin:4px 2px}
.askbtn{flex:none;width:24px;height:24px;margin-top:4px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;transition:.15s}
.sechead:hover .askbtn,.askbtn.has{opacity:1}
.askbtn:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.askbtn.has{color:var(--accent);border-color:var(--line-2)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line-2);z-index:96;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.panel header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel header h3{font-family:var(--serif);font-size:18px;margin:0;font-weight:600;flex:1}
.panel .body{flex:1;overflow-y:auto;padding:18px}
.panel .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
.quote{background:var(--surface-2);border-left:3px solid var(--warm);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;line-height:1.6;color:var(--text-2);max-height:190px;overflow-y:auto}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;color:var(--text-2)}

/* ---------- chat rail ---------- */

<script>
const DATA = {"parts": [{"id": "p1", "name": "Foundations", "hours": 8, "blurb": "The part that does not expire. Channels change every 18 months; this does not."}, {"id": "p2", "name": "Digital core", "hours": 14, "blurb": "The channels. This is where your money and your hours actually go."}, {"id": "p3", "name": "Expert layer", "hours": 8, "blurb": "What separates a junior who runs campaigns from a senior who allocates budget."}], "modules": [{"id": "M01", "num": 1, "part": "p1", "title": "What Marketing Actually Is", "short": "What marketing actually is", "meta": "60 minutes (25 read · 25 exercise · 10 recall)", "minutes": 60, "sections": [{"h": "Why this matters", "html": "<p>Most people think marketing means advertising and promotion. That belief is the reason most marketing money is wasted. If you internalize the correct definition in the next 25 minutes, you will already be ahead of a meaningful share of people who do this professionally.<\/p>", "text": "Most people think marketing means advertising and promotion. That belief is the reason most marketing money is wasted. If you internalize the correct definition in the next 25 minutes, you will already be ahead of a meaningful share of people who do this professionally."}, {"h": "Core concepts", "html": "<h3>The definition worth memorizing<\/h3>\n<blockquote>\n<p>Marketing is the work of understanding a group of people well enough to build, price, place, and describe something they will choose over the alternatives — profitably and repeatedly.<\/p>\n<\/blockquote>\n<p>Four things to notice:<\/p>\n<ol>\n<li><strong>Understanding comes first.<\/strong> Research is not a nice-to-have that precedes the real work; it is the work.<\/li>\n<li><strong>It includes the product itself.<\/strong> What you build and what you charge are marketing decisions, not just engineering and finance ones.<\/li>\n<li><strong>\"Over the alternatives.\"<\/strong> Marketing is always comparative. The alternative is often \"do nothing,\" which is the toughest competitor you will ever face.<\/li>\n<li><strong>Profitably and repeatedly.<\/strong> Buying customers at a loss is not marketing. It is a subsidy.<\/li>\n<\/ol>\n<p>Advertising is one tactic inside this. Roughly the last 10%.<\/p>\n<h3>Demand capture vs. demand creation<\/h3>\n<p>This distinction organizes almost everything in digital marketing.<\/p>\n<p><strong>Demand capture<\/strong> — someone already wants the thing and is looking. You intercept them.\nChannels: search ads, SEO, marketplaces, comparison sites, review sites.\nEconomics: high conversion rates, high cost per click, capped by how many people are searching. You cannot grow beyond existing demand.<\/p>\n<p><strong>Demand creation<\/strong> — nobody was looking. You make them aware of a problem or a possibility.\nChannels: paid social, video, content, PR, influencers, events, brand campaigns.\nEconomics: low conversion rates, cheap attention, hard to measure, but it is the only way to expand your market.<\/p>\n<p>Nearly every \"our marketing stopped working\" story is a company that only did capture, saturated the existing demand, and had built no creation engine to refill it.<\/p>\n<h3>The 4 Ps (and why they still matter in 2026)<\/h3>\n<p>Product, Price, Place, Promotion. Devised in the 1960s, still correct, because they simply enumerate the levers you control. Most beginners obsess over Promotion, which is the weakest of the four.<\/p>\n<ul>\n<li><strong>Product<\/strong> wrong → no promotion saves you.<\/li>\n<li><strong>Price<\/strong> wrong → you either bleed margin or repel your best customers.<\/li>\n<li><strong>Place<\/strong> (distribution — where it can be bought, how it gets there) wrong → nobody can act on the demand you generated. Historically, distribution beats promotion more often than not.<\/li>\n<li><strong>Promotion<\/strong> → what everyone calls \"marketing.\"<\/li>\n<\/ul>\n<p>For services and software the extended 7 Ps add People, Process, Physical evidence (proof: reviews, case studies, certifications, a credible-looking website). For anything sold online, physical evidence is disproportionately important — trust is the actual conversion bottleneck.<\/p>\n<h3>Marketing vs. sales vs. growth vs. brand<\/h3>\n<ul>\n<li><strong>Brand<\/strong> — what people believe about you before you speak. It is a memory structure, and it lowers the cost of everything else you do.<\/li>\n<li><strong>Marketing<\/strong> — creating and capturing demand at a system level.<\/li>\n<li><strong>Growth<\/strong> — usually means the experimental, data-heavy subset focused on the funnel and the product loop.<\/li>\n<li><strong>Sales<\/strong> — converting individual identified humans, one at a time.<\/li>\n<\/ul>\n<p>These fight over budget in every company. Understanding which is being argued for is a survival skill.<\/p>\n<h3>The uncomfortable truth about how it works<\/h3>\n<p>Marketing effects are mostly <strong>slow, cumulative, and hard to attribute<\/strong>. A large share of the effect of an ad is on people who buy months later through a channel that gets the credit. This mismatch — real long-run effects, weak short-run measurability — is why marketing has so much confidently-stated nonsense in it, and why the measurement modules (M13, M15) matter more than the tactics modules.<\/p>", "text": "The definition worth memorizing Marketing is the work of understanding a group of people well enough to build, price, place, and describe something they will choose over the alternatives — profitably and repeatedly. Four things to notice: Understanding comes first. Research is not a nice-to-have that precedes the real work; it is the work. It includes the product itself. What you build and what you charge are marketing decisions, not just engineering and finance ones. \"Over the alternatives.\" Marketing is always comparative. The alternative is often \"do nothing,\" which is the toughest competitor you will ever face. Profitably and repeatedly. Buying customers at a loss is not marketing. It is a subsidy. Advertising is one tactic inside this. Roughly the last 10%. Demand capture vs. demand creation This distinction organizes almost everything in digital marketing. Demand capture — someone already wants the thing and is looking. You intercept them. Channels: search ads, SEO, marketplaces, comparison sites, review sites. Economics: high conversion rates, high cost per click, capped by how many people are searching. You cannot grow beyond existing demand. Demand creation — nobody was looking. You make them aware of a problem or a possibility. Channels: paid social, video, content, PR, influencers, events, brand campaigns. Economics: low conversion rates, cheap attention, hard to measure, but it is the only way to expand your market. Nearly every \"our marketing stopped working\" story is a company that only did capture, saturated the existing demand, and had built no creation engine to refill it. The 4 Ps (and why they still matter in 2026) Product, Price, Place, Promotion. Devised in the 1960s, still correct, because they simply enumerate the levers you control. Most beginners obsess over Promotion, which is the weakest of the four. Product wrong → no promotion saves you. Price wrong → you either bleed margin or repel your best customers. Place (distribution — where it can be bought, how it gets there) wrong → nobody can act on the demand you generated. Historically, distribution beats promotion more often than not. Promotion → what everyone calls \"marketing.\" For ser"}, {"h": "How it works in practice", "html": "<p>A marketer's actual week looks roughly like:<\/p>\n<ul>\n<li>20% talking to customers or reading what they wrote (support tickets, reviews, sales calls)<\/li>\n<li>20% making things (copy, ads, pages, emails)<\/li>\n<li>20% looking at numbers and deciding what to change<\/li>\n<li>20% coordinating with sales, product, and finance<\/li>\n<li>20% arguing about priorities<\/li>\n<\/ul>\n<p>Not one minute of it is \"coming up with creative ideas\" in the way films depict. Ideas are the cheap part.<\/p>", "text": "A marketer's actual week looks roughly like: 20% talking to customers or reading what they wrote (support tickets, reviews, sales calls) 20% making things (copy, ads, pages, emails) 20% looking at numbers and deciding what to change 20% coordinating with sales, product, and finance 20% arguing about priorities Not one minute of it is \"coming up with creative ideas\" in the way films depict. Ideas are the cheap part."}, {"h": "2026 reality check", "html": "<p>Three shifts that make the fundamentals <em>more<\/em> valuable, not less:<\/p>\n<ol>\n<li><strong>AI collapsed the cost of production.<\/strong> Anyone can produce a thousand competent blog posts and a hundred ad variants. That means execution volume is no longer a moat. Judgment, positioning, and knowing what is worth saying are the moat.<\/li>\n<li><strong>Distribution surfaces are consolidating into answer engines.<\/strong> Roughly 60% of Google searches now end without a click to any website, and when an AI Overview appears, the click-through rate of the top organic result drops by more than half. Whole categories of \"just rank and get traffic\" strategies quietly died. Being <em>the brand the AI names<\/em> is the new fight.<\/li>\n<li><strong>The ad platforms became black boxes.<\/strong> Google's Performance Max and Meta's Advantage+ took targeting decisions away from marketers. Your inputs — offer, creative, customer data, and what you tell the algorithm to optimize toward — are now the job. Which means the fundamentals in Part 1 <em>are<\/em> the paid media skill now.<\/li>\n<\/ol>", "text": "Three shifts that make the fundamentals more valuable, not less: AI collapsed the cost of production. Anyone can produce a thousand competent blog posts and a hundred ad variants. That means execution volume is no longer a moat. Judgment, positioning, and knowing what is worth saying are the moat. Distribution surfaces are consolidating into answer engines. Roughly 60% of Google searches now end without a click to any website, and when an AI Overview appears, the click-through rate of the top organic result drops by more than half. Whole categories of \"just rank and get traffic\" strategies quietly died. Being the brand the AI names is the new fight. The ad platforms became black boxes. Google's Performance Max and Meta's Advantage+ took targeting decisions away from marketers. Your inputs — offer, creative, customer data, and what you tell the algorithm to optimize toward — are now the job. Which means the fundamentals in Part 1 are the paid media skill now."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Confusing marketing with promotion.<\/strong> Leads to fixing an ad when the problem is the price.<\/li>\n<li><strong>Copying tactics from companies in a different situation.<\/strong> What works for a brand with existing awareness will not work for you. Always ask: what was true for them that isn't true for me?<\/li>\n<li><strong>Optimizing what is easy to measure.<\/strong> Search ads are measurable and often not incremental (see M15) — people would have found you anyway. Brand-building is barely measurable and often decisive.<\/li>\n<li><strong>Treating \"the market\" as one thing.<\/strong> There is no general audience. There are segments (M02).<\/li>\n<li><strong>Believing the funnel is orderly.<\/strong> Real buying journeys loop, stall, and involve other people. The funnel is a useful accounting fiction, not a description of reality.<\/li>\n<\/ul>", "text": "Confusing marketing with promotion. Leads to fixing an ad when the problem is the price. Copying tactics from companies in a different situation. What works for a brand with existing awareness will not work for you. Always ask: what was true for them that isn't true for me? Optimizing what is easy to measure. Search ads are measurable and often not incremental (see M15) — people would have found you anyway. Brand-building is barely measurable and often decisive. Treating \"the market\" as one thing. There is no general audience. There are segments (M02). Believing the funnel is orderly. Real buying journeys loop, stall, and involve other people. The funnel is a useful accounting fiction, not a description of reality."}, {"h": "Exercise (25 minutes)", "html": "<p>Take out <code>templates/business-brief.md<\/code> and fill it in for <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li>In one sentence, what is sold, to whom, and instead of what?<\/li>\n<li>List the real alternatives your buyer considers — include \"do nothing\" and \"hire someone / do it manually.\"<\/li>\n<li>Classify your current marketing efforts (or a competitor's, if you have none) into <strong>demand capture<\/strong> vs <strong>demand creation<\/strong>. What is the split?<\/li>\n<li>For each of the 4 Ps, write one sentence about your business. Which of the four is weakest? Be honest — that is where the leverage is.<\/li>\n<li>Write down: what would have to be true for this business to double? Name it as a constraint, not a wish. (\"We have no way to reach owners of X\" is a constraint. \"More sales\" is a wish.)<\/li>\n<\/ol>", "text": "Take out templates/business-brief.md and fill it in for your chosen business : In one sentence, what is sold, to whom, and instead of what? List the real alternatives your buyer considers — include \"do nothing\" and \"hire someone / do it manually.\" Classify your current marketing efforts (or a competitor's, if you have none) into demand capture vs demand creation . What is the split? For each of the 4 Ps, write one sentence about your business. Which of the four is weakest? Be honest — that is where the leverage is. Write down: what would have to be true for this business to double? Name it as a constraint, not a wish. (\"We have no way to reach owners of X\" is a constraint. \"More sales\" is a wish.)"}, {"h": "Recall (10 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>The definition of marketing<\/li>\n<li>Demand capture vs. creation, and one channel of each<\/li>\n<li>The 4 Ps and which one beginners over-weight<\/li>\n<li>Two reasons marketing is hard to measure<\/li>\n<\/ol>", "text": "Close everything. Write from memory: The definition of marketing Demand capture vs. creation, and one channel of each The 4 Ps and which one beginners over-weight Two reasons marketing is hard to measure"}, {"h": "If you remember one thing", "html": "<p><strong>Marketing is the whole system of understanding, building, pricing, distributing, and describing an offer — not the promotion at the end.<\/strong> When something is not working, check the offer before you check the ad.<\/p>", "text": "Marketing is the whole system of understanding, building, pricing, distributing, and describing an offer — not the promotion at the end. When something is not working, check the offer before you check the ad."}], "suggest": [["What does 'most marketing money is wasted' actually look like?", "Give me an example of spend wasted by treating marketing as ads", "How do I tell if my own business is making this mistake right now?"], ["Why is 'do nothing' called the toughest competitor to beat?", "Apply that definition to a small local business for me", "How do I list the alternatives my buyers actually compare me against?"], ["Why is 'coming up with ideas' missing from that 20% breakdown?", "What does the 20% spent on numbers involve day to day?", "I only have 4 hours a week, so how should I split them?"], ["Why does cheap AI production make judgment the moat instead?", "What does the 60% zero-click figure mean for a small site like mine?", "If 'rank and get traffic' is dying, where should my effort go?"], ["Why is a measurable search ad often not actually incremental?", "Show me a case where the ad was fixed but the price was the problem", "How do I audit which of these five mistakes I am making?"], ["How do I tell demand capture from demand creation in my own work?", "Walk me through a filled-in version of the one-sentence brief", "Which of the 4 Ps is usually weakest for a new business, and why?"], ["Which of the 4 Ps do beginners over-weight, and what does it cost?", "Give me one channel each for demand capture and demand creation", "How should I test myself on this so it actually sticks?"], ["What counts as the offer versus the ad when sales stall?", "Show me a business where the ad was fine and the offer was broken", "In what order should I check things when sales drop this month?"]], "assess": {"predict": "Before reading: if marketing is not the same thing as advertising, what else do you think it includes? Write one sentence with your best guess.", "quiz": [{"q": "According to the module's definition, which activity is LEAST likely to be counted as marketing work?", "options": ["Deciding what price to charge for the product", "Deciding where the product can be bought and how it gets there", "Choosing which group of people the product is built for", "Negotiating the payment schedule with the company that prints the packaging"], "answer": 3, "why": "The definition covers understanding a group of people and then building, pricing, placing and describing something for them, so price and place are explicitly marketing decisions. Pricing is the most tempting answer to exclude because it feels like a finance job, but the module says directly that what you build and what you charge are marketing decisions, not just engineering and finance ones."}, {"q": "A tool company has spent two years exclusively on search ads and SEO. Revenue grew, then flattened for six months even though rankings and ad positions held. The most likely cause is:", "options": ["The ads have creative fatigue and need new copy", "They have saturated existing demand and built no demand creation engine to refill it", "Their conversion rate has quietly collapsed", "Competitors have outbid them on the same keywords"], "answer": 1, "why": "Search ads and SEO are demand capture, which is capped by how many people are already searching, so growth stops once that pool is worked out. Competitor bidding is tempting but the question states positions held, and capture channels stall on the demand ceiling even when nothing else changes."}, {"q": "Which pairing correctly matches a channel to its category and its expected economics?", "options": ["Comparison sites, demand creation, cheap attention and low conversion", "Paid social, demand capture, high conversion and high cost per click", "Review sites, demand capture, high conversion rates but capped by how many people are searching", "SEO, demand creation, expands the size of the market"], "answer": 2, "why": "Review sites are listed as capture, and capture is described as high conversion, high cost per click, capped by existing search volume. Paid social is the tempting mismatch because it is expensive, but the module classes it as creation with low conversion and cheap attention."}, {"q": "The module says beginners over-weight Promotion among the 4 Ps. What is the argument for why Place deserves more attention than it gets?", "options": ["Place is cheaper to change than Product or Price", "Place is the only P that platforms still let you control in 2026", "If Place is wrong, nobody can act on the demand you generated, and distribution historically beats promotion more often than not", "Place determines the physical evidence buyers use to judge trust"], "answer": 2, "why": "The module states that with Place wrong nobody can act on generated demand, and that distribution beats promotion more often than not. Physical evidence is the tempting confusion, but that belongs to the extended 7 Ps for services and software, not to Place."}, {"q": "A founder says: our brand is strong, so we do not need to spend on brand any more. Using the module's definitions, the flaw is that:", "options": ["Brand is a memory structure that lowers the cost of everything else you do, so letting it decay raises the cost of all other activity", "Brand and growth are the same budget line, so cutting one cuts the other", "Brand cannot be measured, so no claim about its strength can be made at all", "Brand only matters for companies that also run a sales team"], "answer": 0, "why": "The module defines brand as what people believe about you before you speak, a memory structure that lowers the cost of everything else. The measurement answer is tempting because the module does say marketing is hard to measure, but weak measurability is a reason it gets underfunded, not a reason the claim is meaningless."}, {"q": "Which statement best captures why the module says the 2026 shifts make fundamentals more valuable rather than less?", "options": ["AI writing tools produce worse copy than humans, so the human skill premium rose", "Answer engines reward whoever publishes the highest volume of content", "Ad platforms restored manual targeting, so marketers must relearn segmentation", "Execution volume is no longer a moat now that AI made production cheap, and black-box ad platforms leave offer, creative and optimisation targets as the only inputs you control"], "answer": 3, "why": "The module argues that cheap production removes volume as a moat and that Performance Max and Advantage plus took targeting away, leaving your inputs as the job. The volume answer inverts the argument, since higher output is exactly what stopped being a differentiator."}], "cards": [{"front": "State the module's definition of marketing in one sentence.", "back": "The work of understanding a group of people well enough to build, price, place and describe something they will choose over the alternatives, profitably and repeatedly."}, {"front": "Why does a business that only runs demand capture eventually stall?", "back": "Capture intercepts people already searching, so it is capped by existing demand. Once that pool is saturated there is no creation engine refilling it, and growth flattens."}, {"front": "Name the toughest competitor most offers face, and why it counts as a competitor.", "back": "Doing nothing. Marketing is always comparative, and the status quo is a real alternative the buyer can choose over you."}, {"front": "Which of the 4 Ps do beginners over-weight, and which one historically beats it?", "back": "Beginners over-weight Promotion. Place, meaning distribution, beats promotion more often than not, because without it nobody can act on the demand you generate."}, {"front": "What do the extended 7 Ps add, and which addition matters most online?", "back": "People, Process and Physical evidence. Online, physical evidence dominates: reviews, case studies, certifications and a credible site, because trust is the real conversion bottleneck."}, {"front": "Why is marketing full of confidently-stated nonsense, per the module?", "back": "Its effects are slow, cumulative and hard to attribute. Real long-run effects paired with weak short-run measurability leave room for unfalsifiable claims."}], "elaborate": ["In two sentences, explain to a friend why buying customers at a loss is a subsidy rather than marketing, using a real product you or they have bought recently.", "Take the business you chose for the exercises and split its current activity into demand capture and demand creation. In three sentences, say what the split is and what would break first if the capture side saturated."], "transfer": {"scenario": "A two-person company sells a paid scheduling app for dental practices. All of their acquisition is Google search ads on terms like dental scheduling software, which convert at 4% and cost them roughly the same per customer every month. They have been flat at about 40 new customers a month for five months, and adding budget just raised cost per click without raising volume. The founder wants to hire a copywriter to rewrite the ads.", "prompt": "Diagnose what is actually constraining this business and say whether the copywriter is the right next hire.", "model": "The plateau has the signature of a saturated capture channel, not weak ads. Search ads are demand capture, capped by how many practice managers type that query each month, so extra budget buys the same finite clicks at a higher price rather than more customers. Rewriting the ads optimises the last ten percent of marketing while the constraint sits upstream. One check comes first: is the offer or price wrong for the practices who saw the ad and did not buy, since an offer problem looks like an ad problem from the dashboard. If the offer holds up, the missing piece is demand creation, aimed at practices who have not yet framed their scheduling pain as something software fixes. That work converts worse and measures badly, but it is the only thing that expands the pool the search ads later harvest."}}}, {"id": "M02", "num": 2, "part": "p1", "title": "Customers: Segments, ICP, Jobs-to-be-Done", "short": "Customers, ICP & JTBD", "meta": "90 minutes (35 read · 45 exercise · 10 recall)", "minutes": 90, "sections": [{"h": "Why this matters", "html": "<p>Positioning, price, channel and copy are guesses until you know who you are for and what they are trying to get done. This is the cheapest skill to acquire and the one most professionals do worst, because it requires talking to strangers instead of opening a dashboard.<\/p>", "text": "Positioning, price, channel and copy are guesses until you know who you are for and what they are trying to get done. This is the cheapest skill to acquire and the one most professionals do worst, because it requires talking to strangers instead of opening a dashboard."}, {"h": "Core concepts", "html": "<h3>Segmentation, and why demographics are usually the worst basis<\/h3>\n<p>Segmentation is splitting a market into groups that behave differently and should therefore be marketed to differently. The test of a real segment is not \"are these people similar?\" but <strong>\"would I say something different to this group?\"<\/strong> If no, it is a label, not a segment.<\/p>\n<table>\n<thead>\n<tr>\n<th>Basis<\/th>\n<th>Example<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Demographic<\/td>\n<td>Women 25–34<\/td>\n<td>Same age and income, entirely different reasons to buy.<\/td>\n<\/tr>\n<tr>\n<td>Firmographic (B2B)<\/td>\n<td>50–200 employees, SaaS<\/td>\n<td>Correlates with budget, but is not a reason to buy.<\/td>\n<\/tr>\n<tr>\n<td>Psychographic<\/td>\n<td>\"Health-conscious\"<\/td>\n<td>Feels insightful, rarely actionable.<\/td>\n<\/tr>\n<tr>\n<td>Behavioural<\/td>\n<td>Bought twice in 90 days<\/td>\n<td>Predictive, and you own the data already.<\/td>\n<\/tr>\n<tr>\n<td>Situation / need<\/td>\n<td>Moving house within 60 days<\/td>\n<td>Strongest — the situation creates the purchase.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Demographics persist because ad platforms used to sell targeting that way and because they look tidy on a slide. In 2026 the platforms largely ignore your demographic inputs anyway. Segment on situation and behaviour.<\/p>\n<h3>Targeting means excluding<\/h3>\n<p>Targeting is choosing which segments you serve — judged on size, ability to pay, reachability, urgency, and your right to win. On a small budget, a narrow segment with an urgent problem and an obvious watering hole beats a large indifferent one. If naming your target does not make you slightly nervous about the business you are refusing, you have not targeted.<\/p>\n<h3>ICP, and why personas fail<\/h3>\n<p>The ICP describes the <strong>account or household type<\/strong> that gets most value and is cheapest to serve — not a person. Keep it observable: trigger, size/budget, what they use today, what must be true for them to succeed, and disqualifiers. The disqualifiers are the most valuable lines in it; they stop a sales team burning a quarter on a deal that would have churned. Build v1 from your best existing customers — fastest to buy, least support, renewed, referred.<\/p>\n<p>Personas — a fictional individual standing in for a segment — fail three ways: <strong>decoration<\/strong> (\"Marketing Mary, 34, likes yoga\" changes no decision), <strong>invention<\/strong> (assumed in a workshop, then quoted as fact for three years), and <strong>proliferation<\/strong> (nine personas means no focus). One earns its place only if it carries the trigger, the current alternative, the decision criteria, the objections, and the customer's own words. If time is short, write the ICP and skip personas.<\/p>\n<h3>Jobs-to-be-Done: progress, not attributes<\/h3>\n<p>People do not buy products, they <strong>hire<\/strong> something to make progress in a situation. The classic example: a fast-food chain found milkshakes selling at 7am to lone commuters. The job was not \"dessert\" — it was \"make a dull 30-minute drive tolerable one-handed and keep me full until lunch.\" The competitors were bagels, bananas and doughnuts.<\/p>\n<p>So <strong>your competitive set is defined by the job, not the category<\/strong> — a gym competes with a running app and with doing nothing — and <strong>every purchase is a switch<\/strong>, even if the previous option was putting up with it.<\/p>\n<p>Write jobs as: <em>When [situation], I want to [motivation], so I can [outcome].<\/em><\/p>\n<h3>Buying triggers<\/h3>\n<p>A trigger is the event that moves someone from passive to active: new job, funding round, failed audit, a competitor's price rise, a baby, a house move, one bad month. People carry a problem for years and buy in a narrow window afterwards. Much of what looks like a targeting problem is timing.<\/p>\n<h3>The four forces of progress<\/h3>\n<p>Every switch is a tug-of-war between <strong>push<\/strong> (dissatisfaction with today), <strong>pull<\/strong> (attraction of the new), <strong>anxiety<\/strong> (will it work, will I look stupid, how painful is migration) and <strong>habit<\/strong> (inertia, sunk cost).<\/p>\n<p>Push and pull create demand; anxiety and habit block it. Beginners spend everything on pull — more features, louder claims — when deals are usually lost to the other two. Guarantees, trials, migration help, and proof from someone recognisably similar move conversion more than another benefit claim.<\/p>\n<h3>How to run a customer interview<\/h3>\n<p>The one rule, from Rob Fitzpatrick's <em>The Mom Test<\/em>: <strong>ask about specific past behaviour, never hypothetical future interest.<\/strong> People are unreliable about what they will do and reliable about what they did.<\/p>\n<p>Bad: \"Would you use a tool that did X?\" \"Would you pay $50?\"\nGood: \"Walk me through the last time you dealt with X.\" \"What did you do?\" \"What did it cost you?\" \"What else did you look at, and why didn't you pick it?\"<\/p>\n<p>Thirty minutes, 5–8 people per segment; the fifth rarely adds much. Never pitch — the moment you pitch, they get polite and the data dies. Chase specifics: \"it's expensive\" → \"compared with what, and what did you actually pay?\" Record and transcribe; the phrasing becomes your ad copy.<\/p>\n<h3>Cheap qualitative data<\/h3>\n<ul>\n<li><strong>Reviews<\/strong>, yours and competitors' — read the 3-star ones. 1- and 5-star reviews are emotional; 3-star reviews are analytical.<\/li>\n<li><strong>Reddit and niche forums<\/strong> — search \"[category] recommendation\" and \"[competitor] alternative.\"<\/li>\n<li><strong>Support tickets and chat logs<\/strong> — the most underused asset in most companies.<\/li>\n<li><strong>Sales call recordings<\/strong> — objections in the buyer's own words.<\/li>\n<li><strong>Search queries<\/strong> — your site search box and search-suggest. Typed questions are jobs stated plainly.<\/li>\n<li><strong>Churn and lost-deal reasons<\/strong> — why people left beats why they stayed.<\/li>\n<\/ul>\n<p>Thirty mined reviews beat a persona workshop.<\/p>\n<h3>B2B buying committees, briefly<\/h3>\n<p>The buyer is rarely one person: <strong>user<\/strong>, <strong>champion<\/strong> (sells it internally), <strong>economic buyer<\/strong> (signs), <strong>security gatekeeper<\/strong> (vetoes), <strong>procurement<\/strong> (squeezes). Six to ten people is common on larger purchases. The champion's real fear is \"do not look foolish for recommending this,\" so an internal business case they can forward is a marketing deliverable. More in M16.<\/p>", "text": "Segmentation, and why demographics are usually the worst basis Segmentation is splitting a market into groups that behave differently and should therefore be marketed to differently. The test of a real segment is not \"are these people similar?\" but \"would I say something different to this group?\" If no, it is a label, not a segment. Basis Example Verdict Demographic Women 25–34 Same age and income, entirely different reasons to buy. Firmographic (B2B) 50–200 employees, SaaS Correlates with budget, but is not a reason to buy. Psychographic \"Health-conscious\" Feels insightful, rarely actionable. Behavioural Bought twice in 90 days Predictive, and you own the data already. Situation / need Moving house within 60 days Strongest — the situation creates the purchase. Demographics persist because ad platforms used to sell targeting that way and because they look tidy on a slide. In 2026 the platforms largely ignore your demographic inputs anyway. Segment on situation and behaviour. Targeting means excluding Targeting is choosing which segments you serve — judged on size, ability to pay, reachability, urgency, and your right to win. On a small budget, a narrow segment with an urgent problem and an obvious watering hole beats a large indifferent one. If naming your target does not make you slightly nervous about the business you are refusing, you have not targeted. ICP, and why personas fail The ICP describes the account or household type that gets most value and is cheapest to serve — not a person. Keep it observable: trigger, size/budget, what they use today, what must be true for them to succeed, and disqualifiers. The disqualifiers are the most valuable lines in it; they stop a sales team burning a quarter on a deal that would have churned. Build v1 from your best existing customers — fastest to buy, least support, renewed, referred. Personas — a fictional individual standing in for a segment — fail three ways: decoration (\"Marketing Mary, 34, likes yoga\" changes no decision), invention (assumed in a workshop, then quoted as fact for three years), and proliferation (nine personas means no focus). One earns its place only if it carries the trigger, the current alterna"}, {"h": "How it works in practice", "html": "<p>A first pass takes about a week of spare hours: find what your 20 best customers share; read 30 competitor reviews and tag recurring phrases; run 5 interviews; write one page — ICP, three jobs, top trigger, top anxiety, ten quotes. Re-run twice a year, or whenever a campaign fails and nobody can say why.<\/p>", "text": "A first pass takes about a week of spare hours: find what your 20 best customers share; read 30 competitor reviews and tag recurring phrases; run 5 interviews; write one page — ICP, three jobs, top trigger, top anxiety, ten quotes. Re-run twice a year, or whenever a campaign fails and nobody can say why."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>AI makes synthesis cheap and fabrication easy.<\/strong> Clustering 20 transcripts takes minutes now. But \"synthetic personas\" and AI-generated survey respondents reproduce plausible averages and cannot surface the odd trigger that explains your best customers. Use AI on real data, never instead of it.<\/li>\n<li><strong>Platform targeting is dying; audience understanding is not.<\/strong> You no longer hand-pick an interest list — you supply creative and conversion signals. What you say, and who you exclude, are the remaining levers.<\/li>\n<li><strong>Privacy changes shrank behavioural data<\/strong>, putting more weight on qualitative evidence you gather yourself.<\/li>\n<\/ul>", "text": "AI makes synthesis cheap and fabrication easy. Clustering 20 transcripts takes minutes now. But \"synthetic personas\" and AI-generated survey respondents reproduce plausible averages and cannot surface the odd trigger that explains your best customers. Use AI on real data, never instead of it. Platform targeting is dying; audience understanding is not. You no longer hand-pick an interest list — you supply creative and conversion signals. What you say, and who you exclude, are the remaining levers. Privacy changes shrank behavioural data , putting more weight on qualitative evidence you gather yourself."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Hypothetical questions<\/strong>, then treating politeness as demand. The leading cause of launching something nobody buys.<\/li>\n<li><strong>Interviewing only current customers.<\/strong> They already chose you; the growth is in those who did not.<\/li>\n<li><strong>Segmenting by who people are instead of what happened to them.<\/strong><\/li>\n<li><strong>Averaging.<\/strong> Two segments averaged together produce a product for neither.<\/li>\n<li><strong>Confusing user with buyer<\/strong> — common in B2B and anything bought for children or teams.<\/li>\n<\/ul>", "text": "Hypothetical questions , then treating politeness as demand. The leading cause of launching something nobody buys. Interviewing only current customers. They already chose you; the growth is in those who did not. Segmenting by who people are instead of what happened to them. Averaging. Two segments averaged together produce a product for neither. Confusing user with buyer — common in B2B and anything bought for children or teams."}, {"h": "Exercise (45 minutes)", "html": "<p>For <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li><strong>Draft the ICP<\/strong> (15 min): trigger, situation, size/budget, current alternative, success conditions, three disqualifiers.<\/li>\n<li><strong>Write three jobs<\/strong> in the <em>When… I want to… so I can…<\/em> format. At least one emotional or social.<\/li>\n<li><strong>Get real data<\/strong> (25 min) — either 5 interviews using only past-behaviour questions (write the five first, none hypothetical), or 30 reviews weighted toward 3-star, tagged into trigger / job / objection / delight / deal-breaker.<\/li>\n<li><strong>Tally the four forces<\/strong> (5 min): two of each. Circle the biggest blocker — that is your next messaging or offer change.<\/li>\n<li>Capture <strong>10 verbatim quotes<\/strong>. Do not paraphrase. You will use them in M03.<\/li>\n<\/ol>", "text": "For your chosen business : Draft the ICP (15 min): trigger, situation, size/budget, current alternative, success conditions, three disqualifiers. Write three jobs in the When… I want to… so I can… format. At least one emotional or social. Get real data (25 min) — either 5 interviews using only past-behaviour questions (write the five first, none hypothetical), or 30 reviews weighted toward 3-star, tagged into trigger / job / objection / delight / deal-breaker. Tally the four forces (5 min): two of each. Circle the biggest blocker — that is your next messaging or offer change. Capture 10 verbatim quotes . Do not paraphrase. You will use them in M03."}, {"h": "Recall (10 minutes)", "html": "<p>From memory:<\/p>\n<ol>\n<li>Why demographics are a weak segmentation basis, and two better bases<\/li>\n<li>What distinguishes an ICP from a persona<\/li>\n<li>The JTBD sentence format<\/li>\n<li>The four forces, and which two beginners neglect<\/li>\n<li>The Mom Test rule in one sentence<\/li>\n<li>Four cheap sources of qualitative data<\/li>\n<\/ol>", "text": "From memory: Why demographics are a weak segmentation basis, and two better bases What distinguishes an ICP from a persona The JTBD sentence format The four forces, and which two beginners neglect The Mom Test rule in one sentence Four cheap sources of qualitative data"}, {"h": "If you remember one thing", "html": "<p><strong>Ask what they did, not what they would do.<\/strong> Define your customer by the situation that made them look, and your competitors by the job, not the category.<\/p>", "text": "Ask what they did, not what they would do. Define your customer by the situation that made them look, and your competitors by the job, not the category."}], "suggest": [["Why does knowing the customer have to come before choosing a channel?", "What does 'talking to strangers' look like with only 10 customers?", "Who should I talk to first, and how do I actually reach them?"], ["Why is 'would I say something different?' the real test of a segment?", "Show me a demographic label rewritten as a real segment", "How do I find behavioural segments when I have almost no data?"], ["Why are 5 interviews and 30 reviews enough to be worth trusting?", "What does the finished one-page ICP actually look like?", "I do not have 20 customers yet, so what do I do instead?"], ["Why can synthetic personas not surface the odd trigger that matters?", "How would I use AI on 20 real transcripts without faking the data?", "With interest targeting gone, which levers do I still control?"], ["Why does averaging two segments produce a product for neither?", "What is a hypothetical question, and how would I rewrite it?", "How do I get interviews with people who did not buy from me?"], ["What are the four forces, and which two am I likely to neglect?", "Write a When / I want to / so I can job for a small service business", "Why weight the 30 reviews toward the 3-star ones?"], ["What actually separates an ICP from a persona?", "Name the four cheap sources of qualitative data with an example each", "Give me the Mom Test rule in one line I can use in my next call"], ["Why define competitors by the job rather than the category?", "How do I restate 'small business owners' as a situation instead?", "Turn 'what did you do' into three questions I can ask tomorrow"]], "assess": {"predict": "Before reading: what is the single question you would ask a stranger to find out whether they would actually buy your product? Write it down, then see how the module judges questions like it.", "quiz": [{"q": "A team splits its market into Women 25 to 34 and Women 35 to 50 and calls them segments. By the module's test, what is wrong?", "options": ["The groups are too large to serve on a small budget", "There is no evidence they would say anything different to the two groups, so these are labels rather than segments", "Age is illegal to target on most ad platforms in 2026", "Two segments is too few to cover a market"], "answer": 1, "why": "The module's test for a real segment is whether you would say something different to the group, not whether the people resemble each other. Size is a targeting criterion rather than the definition of a segment, so the large-groups answer confuses the later concept with the current one."}, {"q": "Which segmentation basis does the module rank strongest, and why?", "options": ["Behavioural, because you already own the data", "Psychographic, because it explains motivation rather than surface traits", "Situation or need, because the situation itself creates the purchase", "Firmographic, because it correlates with budget"], "answer": 2, "why": "The table rates situation or need strongest on the grounds that the situation creates the purchase. Behavioural is the tempting answer because it is rated highly as predictive and cheaply available, but it sits below situation in the module's ranking."}, {"q": "Which line would earn a persona its place, per the module?", "options": ["Marketing Mary, 34, enjoys yoga and podcasts on her commute", "Mid-market operations lead, typically reports to the COO", "Skews female, urban, household income above average", "Currently tracks this in a spreadsheet a former employee built, and says I am terrified we are already reporting the wrong numbers"], "answer": 3, "why": "A persona earns its place only if it carries the trigger, the current alternative, the decision criteria, the objections and the customer's own words, and this option gives the current alternative plus verbatim anxiety. The reporting-line option feels more businesslike than the yoga cliche but is still decoration, since it changes no decision."}, {"q": "A gym owner benchmarks pricing and features against the three other gyms in town and cannot work out why sign-ups are flat. Applying jobs-to-be-done, the most likely blind spot is:", "options": ["The competitive set is defined by the job, so a running app and doing nothing are also competitors", "The gym has not segmented by demographics finely enough", "The gym is priced below the category norm and reads as low quality", "Members buy on habit, so no messaging change will move them"], "answer": 0, "why": "The module says your competitive set is defined by the job rather than the category, so the real alternatives include a running app and putting up with things. Finer demographic segmentation is tempting as a research fix, but the module treats demographics as the weakest basis and the problem here is the frame of comparison."}, {"q": "A B2B product has strong push and pull: users complain constantly about their current tool and love the demo. Deals still stall for months. The module predicts the block is:", "options": ["Insufficient differentiation on features against the incumbent", "The wrong economic buyer was targeted from the start", "Anxiety and habit, which beginners neglect because they keep adding to pull", "Weak triggers, meaning nobody in the market is in a buying window"], "answer": 2, "why": "The four forces say push and pull create demand while anxiety and habit block it, and deals are usually lost to the latter two. More features is exactly the pull-side response the module warns against, since the demo already lands and the friction is migration risk and inertia."}, {"q": "Which pair of research moves is most consistent with the module's guidance?", "options": ["Survey 500 prospects on willingness to pay, then read 5-star reviews for language", "Run a persona workshop with the sales team, then validate it with a synthetic AI panel", "Interview 20 current customers about desired features, then average the findings", "Interview 5 to 8 people per segment about specific past behaviour, then mine 3-star reviews for analytical detail"], "answer": 3, "why": "The module prescribes 5 to 8 interviews per segment using past-behaviour questions, and singles out 3-star reviews as the analytical ones while 1 and 5-star reviews are emotional. The willingness-to-pay survey is the tempting near-miss, because asking what someone would pay is precisely the hypothetical the Mom Test rules out."}], "cards": [{"front": "What single test tells you whether a group is a real segment or just a label?", "back": "Would you say something different to this group? If not, it is a label. Similarity between people is not the test; different marketing treatment is."}, {"front": "What distinguishes an ICP from a persona, and which lines in an ICP are most valuable?", "back": "An ICP describes the account or household type that gets most value and is cheapest to serve, kept observable. Its disqualifiers are the most valuable lines, stopping teams chasing deals that would churn."}, {"front": "State the Mom Test rule in one sentence, and why it holds.", "back": "Ask about specific past behaviour, never hypothetical future interest. People are unreliable about what they will do and reliable about what they did."}, {"front": "Give the jobs-to-be-done sentence format and what it implies about competitors.", "back": "When situation, I want to motivation, so I can outcome. The job defines the competitive set, so a gym competes with a running app and with doing nothing."}, {"front": "Name the four forces of progress and say which two beginners neglect.", "back": "Push, pull, anxiety, habit. Push and pull create demand; anxiety and habit block it. Beginners overspend on pull through more features and louder claims."}, {"front": "Why does the module say much of what looks like a targeting problem is really timing?", "back": "A trigger, such as a new job, funding round, failed audit or house move, moves people from passive to active. People carry a problem for years and buy in a narrow window afterwards."}], "elaborate": ["Write one job for your chosen business in the When, I want to, so I can format, then explain in two sentences how it changes who you consider a competitor compared with your category view.", "Connect this module to M01: in three sentences, explain how segmenting on situation rather than demographics changes which of the 4 Ps you would work on first for your business."], "transfer": {"scenario": "A company sells backup software to small accountancy firms. Their marketing runs on a persona built in a workshop three years ago: Cautious Colin, 48, a partner who values reliability. Trials start at a decent rate but only 8% convert, and sales calls stall after the technical evaluation. The three closed deals last quarter all came from firms that had just failed a client data audit. Nobody on the team has spoken to a lost prospect this year.", "prompt": "Diagnose the research gap and specify what you would do in the next two weeks, and what you expect it to change.", "model": "Three faults compound here. Colin is an invented persona, assumed in a workshop and quoted as fact since, carrying no trigger, no current alternative and no objections, so he changes no decision. Second, the only real signal is being ignored: all three wins share a situation, a failed client data audit, which is the strongest segmentation basis available. Third, research covers only people who already chose them, while the growth sits with the trials that stalled. In two weeks I would run five to eight interviews with trial abandoners and lost deals using past-behaviour questions only: walk me through the last time you worried about losing client files, what did you do, what else did you look at. Stalling after technical evaluation suggests anxiety and habit rather than weak pull, so I expect the fix to be proof and migration help, not another feature."}}}, {"id": "M03", "num": 3, "part": "p1", "title": "Positioning, Brand, Messaging", "short": "Positioning & messaging", "meta": "90 minutes (35 read · 45 exercise · 10 recall)", "minutes": 90, "sections": [{"h": "Why this matters", "html": "<p>Positioning is the decision that makes every later decision easier or impossible. Weak positioning shows up as ads that need three sentences to explain what you are, a sales team inventing its own pitch, and a price you cannot defend. You cannot fix it downstream with better copy.<\/p>", "text": "Positioning is the decision that makes every later decision easier or impossible. Weak positioning shows up as ads that need three sentences to explain what you are, a sales team inventing its own pitch, and a price you cannot defend. You cannot fix it downstream with better copy."}, {"h": "Core concepts", "html": "<h3>Positioning is context, not a slogan<\/h3>\n<p>Positioning is the context you place your product in so its value is obvious to the right person. A hammer is unremarkable in a hardware store and remarkable on a desert island.<\/p>\n<h3>April Dunford's five components<\/h3>\n<p>The most usable framework in the discipline. Work it in this order — the order <em>is<\/em> the method:<\/p>\n<ol>\n<li><strong>Competitive alternatives.<\/strong> What would customers do if you did not exist? Include spreadsheets, an intern, an agency, and doing nothing — taken from M02 interviews, not a competitor grid.<\/li>\n<li><strong>Unique attributes.<\/strong> What do you have that the alternatives do not? Facts only, no adjectives.<\/li>\n<li><strong>Value.<\/strong> So what? Translate each attribute into an outcome. If an attribute maps to no value, drop it.<\/li>\n<li><strong>Who cares most.<\/strong> Which customers care intensely about that value? Their shared characteristics are your best-fit segment, usually narrower than you want.<\/li>\n<li><strong>Market category.<\/strong> What context makes your value obvious fast?<\/li>\n<\/ol>\n<p>Most positioning work fails because people start at step 5 — picking a category they like — and reverse-engineer the rest.<\/p>\n<h3>Category entry vs. category design<\/h3>\n<p><strong>Entry<\/strong>: compete inside a category buyers already understand (\"project management tool\"). Cheap, because the buyer needs no education, but you must be visibly different on something they already care about.<\/p>\n<p><strong>Design<\/strong>: name and teach a new category. Enormous upside, enormous cost — you fund the education of the market and competitors then enter for free. Sensible only when the existing category misprices you or attracts the wrong buyer.<\/p>\n<p>Default to entry with a sharp sub-segment. Beginners reach for category design because it sounds ambitious; usually it avoids the harder work of being genuinely different inside a category people already search for.<\/p>\n<h3>The positioning statement template<\/h3>\n<p>For <strong>[best-fit segment]<\/strong> who <strong>[trigger]<\/strong>, <strong>[product]<\/strong> is the <strong>[category]<\/strong> that <strong>[key value]<\/strong>, unlike <strong>[primary alternative]<\/strong>, because <strong>[unique attribute]<\/strong>.<\/p>\n<p>An internal alignment tool, not a headline. If it does not fit on one line, the positioning is not decided yet.<\/p>\n<h3>Differentiation vs. distinctiveness<\/h3>\n<p><strong>Differentiation<\/strong> is being meaningfully different on something buyers value. It affects choice.<\/p>\n<p><strong>Distinctiveness<\/strong> — Byron Sharp's contribution — is being <em>recognisable<\/em>: colours, logo, characters, sonic cues, a format, a phrase. It affects whether you are noticed and correctly attributed at all.<\/p>\n<p>Sharp's work shows that in most categories buyers do not perceive brands as very different, and buy largely out of habit and availability. Growth comes from <strong>mental availability<\/strong> (coming to mind in a buying situation) and <strong>physical availability<\/strong> (being easy to buy). Distinctive assets build the first.<\/p>\n<p>The uncomfortable implication: <strong>being noticed and remembered usually beats being cleverly different.<\/strong> Consistency beats novelty, and most brands change their campaign long before customers have registered it.<\/p>\n<p>Do not over-apply this. Sharp's evidence is strongest in large, low-involvement, repeat-purchase consumer categories. In B2B, small niches, and expensive considered purchases, real differentiation and a specific ICP matter more. Use both: differentiate on substance, then repeat your distinctive assets relentlessly.<\/p>\n<h3>Message hierarchy<\/h3>\n<ul>\n<li><strong>One core message<\/strong> — the single thing you want remembered. If you have three, you have none.<\/li>\n<li><strong>Three supporting pillars<\/strong> — the reasons the core message is true.<\/li>\n<li><strong>Proof under each pillar<\/strong> — numbers, named customers, demos, certifications, guarantees, screenshots.<\/li>\n<\/ul>\n<p>Proof is the layer almost always missing. A claim with no proof reads as noise; a claim with a number and a named customer reads as fact. Every asset then draws from the hierarchy — an ad uses the core message and one pillar, a landing page all three — which is how consistency happens without everyone writing the same page.<\/p>\n<h3>Features, benefits, outcomes<\/h3>\n<ul>\n<li><strong>Feature:<\/strong> automatic bank-feed reconciliation.<\/li>\n<li><strong>Benefit:<\/strong> your books stay accurate without manual entry.<\/li>\n<li><strong>Outcome:<\/strong> you close the month in a day instead of a week.<\/li>\n<\/ul>\n<p>Outcomes sell; features prove. Beginners list features. Over-corrected marketers write outcome fluff with nothing concrete and become indistinguishable from every competitor. Pair them: <em>outcome, then the feature that makes it believable.<\/em><\/p>\n<h3>\"We're the best\" is not positioning<\/h3>\n<p>Superiority claims without a comparison set, a segment, or proof are noise: best-in-class, world-class, innovative, seamless, next-generation. Test any line by asking whether a competitor could put it on their site. If yes, delete it. Positioning must be falsifiable — it must exclude someone.<\/p>\n<h3>Naming, taglines, and brand as memory<\/h3>\n<p>A name must be pronounceable, spellable after one hearing, and searchable. Descriptive names help early discovery; abstract names give room later. Neither is a moat. A tagline either states the position or carries the feeling; what it must not be is a riddle. If a customer cannot say what you do after reading your homepage headline, it has failed however nice it sounds.<\/p>\n<p>A brand is not a logo or a personality document. It is the set of associations that fire when a buying situation arises — built by repeating consistent, distinctive cues, decaying when you stop. A strong one lowers acquisition cost, raises acceptable price and shortens sales cycles, which is why cutting brand spend looks free for two quarters and expensive in year two.<\/p>", "text": "Positioning is context, not a slogan Positioning is the context you place your product in so its value is obvious to the right person. A hammer is unremarkable in a hardware store and remarkable on a desert island. April Dunford's five components The most usable framework in the discipline. Work it in this order — the order is the method: Competitive alternatives. What would customers do if you did not exist? Include spreadsheets, an intern, an agency, and doing nothing — taken from M02 interviews, not a competitor grid. Unique attributes. What do you have that the alternatives do not? Facts only, no adjectives. Value. So what? Tr
