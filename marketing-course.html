 assistants your category's buying questions to record whether and how you are named.<\/p>\n<h3>Disclosure and quality control<\/h3>\n<ul>\n<li><strong>Disclose where the audience would otherwise feel misled<\/strong> — synthetic people, AI imagery presented as photography, AI voices, testimonials not from real customers. Fabricated endorsements are a legal problem in many jurisdictions, not merely an ethical one.<\/li>\n<li><strong>No disclosure obligation for AI as a drafting tool,<\/strong> any more than for a spellchecker — but a byline means that person is accountable for every claim under it.<\/li>\n<li><strong>Never generate fake reviews, testimonials or personas presented as real people.<\/strong> Check your platforms' rules, which vary and change.<\/li>\n<li><strong>Quality gate before publishing:<\/strong> every factual claim verified; sounds like us, not like a model; contains at least one thing only we could have said; a human willing to put their name on it.<\/li>\n<\/ul>\n<h3>The skill that appreciates<\/h3>\n<p>As production becomes free, value moves to what stays scarce: <strong>taste<\/strong> (telling the good option from the plausible one, fast, among fifty); <strong>judgment<\/strong> (which problem to work on, what to measure, when data is too thin to conclude anything — M14, M15); <strong>customer understanding<\/strong> from conversations you had yourself; <strong>original information<\/strong>; <strong>distribution and relationships<\/strong>; and <strong>accountability<\/strong> — being the person who signs off, explains the number, and takes the consequence.<\/p>\n<p>None of these are prompting skills. Prompting is a temporary advantage that erodes as models improve; the list above appreciates for the same reason.<\/p>", "text": "Where AI genuinely creates leverage Research synthesis. Reading 60 competitor pages, 200 reviews or a market report and returning a structured summary. The bottleneck was reading time, and that is what a model removes. Verify claims that matter. First drafts, never final ones. A draft is faster to fix than a blank page is to fill; the value is in the editing that follows. Creative variant production. Ten headline angles, six hooks, five image concepts for one offer. In an Advantage+ / Performance Max world, creative volume and diversity is the main input you control (M11, M15) — the clearest ROI use in paid media. Ad copy at scale. Hundreds of ad-group-specific descriptions, or per-SKU copy for thousands of products, generated from structured data. Manually infeasible; mechanically straightforward. Data analysis and the annoying technical layer. SQL, spreadsheet formulas, regex, cleaning a messy export. This quietly removes the biggest tax on a non-technical marketer. Customer feedback clustering. Group 3,000 reviews, tickets or survey responses into themes with representative quotes. A week of someone's life becomes an afternoon, and it feeds positioning (M03) and hypothesis generation (M14) directly. Personalisation at scale. Segment-specific landing pages, industry-specific case-study framings, per-persona emails. Personalisation was always limited by production capacity, and that limit is gone. Campaign QA. Checking hundreds of links for correct UTMs, verifying tracking parameters, cross-checking copy against character limits and brand rules. Translation and localisation first passes, with a native speaker reviewing anything customer-facing. The pattern: AI is strongest where work is high-volume, structured, verifiable, and bounded by production capacity rather than by judgment. Where AI destroys value Commodity content. Generic articles restating what is already on page one. Answer engines already synthesise that, and with ~60% of Google searches ending click-free, the marginal generic article earns close to nothing. This is where most AI marketing spend is currently wasted. Generic brand voice. Default output converges on the same smooth, hedged, faintly e"}, {"h": "How it works in practice", "html": "<p>A realistic week:<\/p>\n<ul>\n<li><strong>Monday.<\/strong> The agent-assembled weekly report is in your inbox; you spend 20 minutes interpreting it rather than building it. An anomaly flag catches a landing page's conversion tag that stopped firing on Thursday.<\/li>\n<li><strong>Tuesday.<\/strong> Two customer interviews, done by you. Afterwards, transcripts clustered against the last twenty with verbatim quotes pulled.<\/li>\n<li><strong>Wednesday.<\/strong> Creative sprint. Context file plus three winning ads plus this month's angle → 40 headline variants. You cut to six worth testing, rewriting four yourself.<\/li>\n<li><strong>Thursday.<\/strong> Analysis: SQL written with AI help, cohort retention pulled by acquisition channel (M17), reallocation memo drafted for the budget meeting.<\/li>\n<li><strong>Friday.<\/strong> The original piece — the one asset this quarter built from your own data, which no model could produce and which answer engines have a reason to cite.<\/li>\n<\/ul>\n<p>Note the ratio. AI touched most of the week and decided none of it.<\/p>", "text": "A realistic week: Monday. The agent-assembled weekly report is in your inbox; you spend 20 minutes interpreting it rather than building it. An anomaly flag catches a landing page's conversion tag that stopped firing on Thursday. Tuesday. Two customer interviews, done by you. Afterwards, transcripts clustered against the last twenty with verbatim quotes pulled. Wednesday. Creative sprint. Context file plus three winning ads plus this month's angle → 40 headline variants. You cut to six worth testing, rewriting four yourself. Thursday. Analysis: SQL written with AI help, cohort retention pulled by acquisition channel (M17), reallocation memo drafted for the budget meeting. Friday. The original piece — the one asset this quarter built from your own data, which no model could produce and which answer engines have a reason to cite. Note the ratio. AI touched most of the week and decided none of it."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>The ad platforms are already AI, and that is where most of the impact is.<\/strong> Performance Max, AI Max for Search and Advantage+ made buying input-driven. Your leverage is offer, creative, first-party data and the optimisation goal you choose (M15). Getting good at feeding those systems matters more than any content tool.<\/li>\n<li><strong>Content abundance made distribution the constraint.<\/strong> Everyone can produce; almost nobody can reach. Owned audiences (M17), partnerships and genuine authority are worth more than before, not less.<\/li>\n<li><strong>AEO/GEO is real and immature.<\/strong> Treat vendor claims sceptically — there is little settled evidence about what causes model citation, and anyone selling certainty is selling ahead of the science. Do what is defensible regardless: be findable, be factual, be mentioned by third parties, publish something original.<\/li>\n<li><strong>The market is repricing.<\/strong> Roles built purely on production volume are under pressure; roles built on strategy, measurement and accountability for spend are not. Part 3 of this course is deliberately the part that does not commoditise.<\/li>\n<\/ul>", "text": "The ad platforms are already AI, and that is where most of the impact is. Performance Max, AI Max for Search and Advantage+ made buying input-driven. Your leverage is offer, creative, first-party data and the optimisation goal you choose (M15). Getting good at feeding those systems matters more than any content tool. Content abundance made distribution the constraint. Everyone can produce; almost nobody can reach. Owned audiences (M17), partnerships and genuine authority are worth more than before, not less. AEO/GEO is real and immature. Treat vendor claims sceptically — there is little settled evidence about what causes model citation, and anyone selling certainty is selling ahead of the science. Do what is defensible regardless: be findable, be factual, be mentioned by third parties, publish something original. The market is repricing. Roles built purely on production volume are under pressure; roles built on strategy, measurement and accountability for spend are not. Part 3 of this course is deliberately the part that does not commoditise."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Publishing AI drafts unedited.<\/strong> Detectable, generic, and it teaches your audience to skip you.<\/li>\n<li><strong>No context file,<\/strong> so every output is average-of-the-internet.<\/li>\n<li><strong>Trusting statistics the model produced.<\/strong> Every number needs a source.<\/li>\n<li><strong>Outsourcing the customer contact<\/strong> and losing the texture that makes copy specific.<\/li>\n<li><strong>Volume as a strategy.<\/strong> 400 posts nobody needed.<\/li>\n<li><strong>Prompting for polish instead of range.<\/strong> Ask for wider options, then choose.<\/li>\n<li><strong>Automating reporting interpretation,<\/strong> not just assembly.<\/li>\n<li><strong>Fake reviews, testimonials or synthetic customers presented as real.<\/strong> Legally dangerous and brand-fatal.<\/li>\n<li><strong>Learning prompt tricks instead of marketing.<\/strong> The tricks expire; the fundamentals do not.<\/li>\n<\/ul>", "text": "Publishing AI drafts unedited. Detectable, generic, and it teaches your audience to skip you. No context file, so every output is average-of-the-internet. Trusting statistics the model produced. Every number needs a source. Outsourcing the customer contact and losing the texture that makes copy specific. Volume as a strategy. 400 posts nobody needed. Prompting for polish instead of range. Ask for wider options, then choose. Automating reporting interpretation, not just assembly. Fake reviews, testimonials or synthetic customers presented as real. Legally dangerous and brand-fatal. Learning prompt tricks instead of marketing. The tricks expire; the fundamentals do not."}, {"h": "Exercise (25 minutes)", "html": "<p>For <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li><strong>Build the context file<\/strong> (15 minutes — the bulk of this exercise). One to two pages: company, ICP, positioning, message hierarchy, voice rules with at least three \"never say\" items, real proof assets, forbidden claims, two on-brand examples. Save it where you will reuse it.<\/li>\n<li><strong>Run one real task with it.<\/strong> Generate ten ad headlines or five subject lines using the context file plus the five-component prompt structure. Cut to two and rewrite them in your own words. Note what the model got wrong — that gap is what you know and it does not.<\/li>\n<li><strong>Draw your leverage/destruction line.<\/strong> Two columns: five tasks you will delegate to AI, five you will not, one sentence of reasoning each.<\/li>\n<li><strong>Design the quality gate<\/strong> — a four- to six-item checklist anything AI-assisted must pass before it goes out, including who is accountable.<\/li>\n<li><strong>The answer-engine check.<\/strong> Ask two AI assistants the buying question your customer would ask (\"best X for Y\"). Record whether you are named, who is, and what is said about you. Write down one action.<\/li>\n<li><strong>The original asset.<\/strong> Name the one piece of information only your business could publish — your own data, results, or an experiment you could run. Write its headline and the three data points it would contain.<\/li>\n<\/ol>", "text": "For your chosen business : Build the context file (15 minutes — the bulk of this exercise). One to two pages: company, ICP, positioning, message hierarchy, voice rules with at least three \"never say\" items, real proof assets, forbidden claims, two on-brand examples. Save it where you will reuse it. Run one real task with it. Generate ten ad headlines or five subject lines using the context file plus the five-component prompt structure. Cut to two and rewrite them in your own words. Note what the model got wrong — that gap is what you know and it does not. Draw your leverage/destruction line. Two columns: five tasks you will delegate to AI, five you will not, one sentence of reasoning each. Design the quality gate — a four- to six-item checklist anything AI-assisted must pass before it goes out, including who is accountable. The answer-engine check. Ask two AI assistants the buying question your customer would ask (\"best X for Y\"). Record whether you are named, who is, and what is said about you. Write down one action. The original asset. Name the one piece of information only your business could publish — your own data, results, or an experiment you could run. Write its headline and the three data points it would contain."}, {"h": "Recall (10 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Four places AI creates genuine leverage, and what they have in common.<\/li>\n<li>Four ways AI destroys value, including the subtle one about customer contact.<\/li>\n<li>The three-step workflow and what breaks if you skip each human step.<\/li>\n<li>The five components of a strong marketing prompt.<\/li>\n<li>What goes in a context file.<\/li>\n<li>Why answer-engine visibility argues for original content rather than more AI content.<\/li>\n<li>Four skills that appreciate as production is commoditised.<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Four places AI creates genuine leverage, and what they have in common. Four ways AI destroys value, including the subtle one about customer contact. The three-step workflow and what breaks if you skip each human step. The five components of a strong marketing prompt. What goes in a context file. Why answer-engine visibility argues for original content rather than more AI content. Four skills that appreciate as production is commoditised."}, {"h": "If you remember one thing", "html": "<p><strong>AI removed the cost of production, not the cost of being worth attention.<\/strong> Use it for volume, structure and speed; keep strategy, customer contact and the final judgment yourself — because that is the part that is now scarce, and therefore the part that gets paid.<\/p>", "text": "AI removed the cost of production, not the cost of being worth attention. Use it for volume, structure and speed; keep strategy, customer contact and the final judgment yourself — because that is the part that is now scarce, and therefore the part that gets paid."}], "suggest": [["What does 'production was never the scarce resource' mean in practice?", "What does the output gap between an AI-fluent and a manual peer look like?", "Where am I most at risk of treating AI as a strategy?"], ["Which model claims must I verify, and which can I let ride?", "How would AI turn 200 reviews into something I can act on?", "How much creative variety does Advantage+ actually need from me?"], ["Why are the two customer interviews the part I must still do myself?", "How do I get from 40 headline variants down to six worth testing?", "What would this week look like if I only had five hours?"], ["What does feeding the ad systems mean beyond uploading creative?", "Which AEO and GEO vendor claims deserve the most scepticism now?", "If distribution is the constraint, where do I build reach first?"], ["What does average-of-the-internet output actually look like on the page?", "Show me prompting for range versus prompting for polish, side by side", "Where would automating report interpretation go wrong in my setup?"], ["What belongs in the 'never say' rules of my context file?", "Show a filled-in context file for a small service business", "How do I read the gap between the model's draft and my rewrite?"], ["What breaks if I skip each human step in the three-step workflow?", "Name the five prompt components and show one worked example", "Which four skills appreciate as production gets commoditised?"], ["What counts as the final judgment I should never hand over?", "What does keeping customer contact look like in a normal month?", "How do I make that scarce judgment visible in work people can see?"]], "assess": {"predict": "If AI can write a hundred articles a week for almost nothing, guess why that might make a company's marketing worse rather than better.", "quiz": [{"q": "In an Advantage+ and Performance Max world where the algorithm allocates to keywords and placements, which use of AI is the clearest return in paid media?", "options": ["Publishing 40 SEO articles a month so the algorithm has more landing pages to work with.", "Letting the model decide the budget split between campaigns each week.", "Creative variant production: ten headline angles, six hooks, five image concepts for one offer.", "Generating the audience segments the platform should target."], "answer": 2, "why": "Creative volume and diversity is the main input you still control when buying is automated, which makes variant production the clearest ROI use in paid media. Audience generation is the tempting wrong answer because it feels like the sophisticated task, but targeting is precisely the part the black box has taken over."}, {"q": "A B2B company has published 120 AI-written articles restating what already sits on page one. Traffic is flat and demo requests are unchanged. What is the diagnosis?", "options": ["Publish more; volume compounds once there is enough of it to be picked up in AI Overviews.", "The prompts are the problem; better prompts would make the same articles rank.", "Gate the articles so at least they produce leads while the traffic builds.", "With around 60 percent of searches ending click-free, the marginal generic article earns close to nothing; what answer engines have reason to cite is original research and first-hand data, which is exactly what AI cannot generate."], "answer": 3, "why": "Commodity content is where most AI marketing spend is currently wasted, because answer engines already synthesise that material. Blaming prompt quality is the seductive error: no prompt turns a restatement of page one into new information, and the correct response to AI-abundant content is original research and named expert opinion."}, {"q": "In the human strategy, AI production, human editing workflow, what breaks if you skip each human step?", "options": ["Skip strategy and you produce fluent nonsense; skip editing and you produce fluent averageness.", "Skip strategy and output slows down; skip editing and you risk copyright problems.", "Skip strategy and the brand voice drifts; skip editing and the volume falls.", "Skip strategy and you cannot measure results; skip editing and you breach disclosure rules."], "answer": 0, "why": "Strategy - what we are saying, to whom, why it beats the alternative - cannot be delegated because a model has no access to your customers or margins. Editing is where the specific claim, the number and the customer quote get added, so skipping it leaves output that is smooth, hedged and indistinguishable from a competitor's."}, {"q": "Your AI-assisted ads are fluent but sound exactly like your competitor's. What is the fix?", "options": ["Switch to a different model, since voice differences come from the model.", "Write a context file with ICP, positioning, message hierarchy, five to eight concrete voice rules, real proof assets and forbidden claims, attach it to every task, and prompt for range rather than polish.", "Generate many more variants and pick the best one.", "Add stronger calls to action and more vivid adjectives to the prompt."], "answer": 1, "why": "Default output converges on the same smooth, hedged register, and the context file is what converts a generic writer into something that sounds like your company; the proof assets are also what stops it inventing numbers. Generating more variants is tempting but only produces more of the same average, because the missing input is context, not volume."}, {"q": "A draft report contains a compelling market statistic the model supplied, and the deadline is today. What is the standard?", "options": ["Publish it with a hedge such as 'industry estimates suggest', which covers the uncertainty.", "Publish it; the model is usually right about widely quoted figures.", "Every figure, citation, price and capability claim needs a source before publication, and the byline owns the claim regardless of what produced it.", "Ask the model to verify its own statistic and publish if it confirms it."], "answer": 2, "why": "Models invent statistics, studies, quotes and product features with complete confidence, and one published fabrication can cost more credibility than the content earns in a year. Asking the model to check itself fails the standing rule: AI is reliable at organising information you give it and unreliable at recalling information it was not given."}, {"q": "When does AI use require disclosure?", "options": ["On everything AI touched, including drafts, so the audience can judge for itself.", "Where the audience would otherwise feel misled - synthetic people, AI imagery presented as photography, AI voices, testimonials not from real customers - but not for AI as a drafting tool.", "Never; it is a tool like a spellchecker and disclosure only invites scepticism.", "Only where a specific platform's terms happen to require it."], "answer": 1, "why": "The line is whether the audience would feel misled, and fabricated endorsements are a legal problem in many jurisdictions rather than merely an ethical one. Disclosing every draft is the over-correction: using AI to draft carries no more obligation than using a spellchecker, though a byline still means that person is accountable for every claim."}], "cards": [{"front": "What do AI's genuine leverage cases have in common?", "back": "They are high-volume, structured, verifiable, and bounded by production capacity rather than judgment: research synthesis, first drafts, creative variants, ad copy at scale, data and SQL work, feedback clustering, personalisation, campaign QA."}, {"front": "State the three-step workflow and what breaks at each end.", "back": "Human sets strategy, AI produces, human edits with taste. Skip the strategy and you produce fluent nonsense; skip the editing and you produce fluent averageness."}, {"front": "What are the five components of a strong marketing prompt?", "back": "Role and task stated specifically; the ICP with situation, trigger and language; the positioning with differentiator and proof; two or three good examples and one bad with reasons; constraints on length, format, forbidden claims and the action."}, {"front": "What goes in a context file?", "back": "Company and product in three sentences, ICP with trigger and budget reality, positioning and proof, message hierarchy, five to eight concrete voice rules, real proof assets and quotes, forbidden claims, two on-brand examples. Under two pages, versioned."}, {"front": "What is the standing rule about what AI can be trusted with?", "back": "It is reliable at organising information you give it and unreliable at recalling information it was not given. Structure every research use around that boundary and verify the claims that matter."}, {"front": "Which skills appreciate as production is commoditised?", "back": "Taste, judgment, customer understanding from conversations you had yourself, original information, distribution and relationships, and accountability. Prompting is a temporary advantage that erodes as models improve."}], "elaborate": ["Draw your own leverage and destruction line for your chosen business: five tasks you will delegate to AI and five you will not, with one sentence of reasoning for each. Then name the single piece of information only your business could publish, and write its headline and the three data points it would contain.", "M14 noted that AI made variant production nearly free while your traffic did not multiply by fifty. Explain what that means for how many hypotheses you actually need versus how many variants you can produce, and where those extra variants are better spent."], "transfer": {"scenario": "A five-person agency has a marketing lead who spent three days a week writing blog posts. The founder buys an AI writing tool, sets a target of 30 posts a month, and drops the lead's two weekly customer interviews to free up the time. Three months in, organic traffic is up 8 percent, demo requests are flat, the posts read like every competitor's, and one post cited a statistic that does not exist - a prospect noticed and mentioned it on a call.", "prompt": "Redesign how that marketing lead spends the week.", "model": "Two errors compounded: volume treated as a strategy, and outsourcing the customer contact that made the copy specific. Reinstate the two interviews a week, done by the lead, with AI clustering the transcripts afterwards and pulling verbatim quotes rather than paraphrases. Drop the 30-post target entirely. Build the context file - ICP, positioning, message hierarchy, five to eight voice rules with real never-say items, and real proof assets and quotes, which is what stops the model inventing statistics. Add a quality gate: every factual claim sourced, sounds like us, contains at least one thing only we could have said, and a named human accountable. Then move the freed time to where AI genuinely pays: creative variants for the ad account, an agent-assembled weekly report the lead spends twenty minutes interpreting, and one original asset a quarter built from the agency's own client data."}}}, {"id": "M19", "num": 19, "part": "p3", "title": "Capstone: A Complete Go-to-Market Plan", "short": "Capstone: GTM plan", "meta": "120 minutes (15 setup · 90 writing · 15 self-assessment)", "minutes": 120, "sections": [{"h": "Why this matters", "html": "<p>Nobody can see what you know. They can only see what you produce.<\/p>\n<p>Eighteen modules of understanding are worth very little in a job interview, a client conversation, or a bank meeting until they are compressed into a document that shows judgment. This module produces that document — a go-to-market plan for one real business, written to the standard a hiring manager, a client, or a co-founder would take seriously.<\/p>\n<p>Writing also forces integration. You will discover in the next two hours that your positioning does not survive contact with your channel choice, or that your unit economics rule out the channel you assumed you would use. That collision is the point, and it is exactly the thinking that separates someone who runs campaigns from someone who decides what the campaigns should be.<\/p>\n<p>Use the same business you have used throughout. If you have been switching, pick one now and commit.<\/p>", "text": "Nobody can see what you know. They can only see what you produce. Eighteen modules of understanding are worth very little in a job interview, a client conversation, or a bank meeting until they are compressed into a document that shows judgment. This module produces that document — a go-to-market plan for one real business, written to the standard a hiring manager, a client, or a co-founder would take seriously. Writing also forces integration. You will discover in the next two hours that your positioning does not survive contact with your channel choice, or that your unit economics rule out the channel you assumed you would use. That collision is the point, and it is exactly the thinking that separates someone who runs campaigns from someone who decides what the campaigns should be. Use the same business you have used throughout. If you have been switching, pick one now and commit."}, {"h": "What you are producing", "html": "<p><strong>A 6–10 page go-to-market plan<\/strong> for one business, written for a reader who is smart, busy, and not a marketer — a CEO, an investor, a client, or an interviewer.<\/p>\n<p>Standards:<\/p>\n<ul>\n<li><strong>Decisions, not options.<\/strong> \"We will do X because Y\" beats \"we could consider X, Y or Z.\" A plan that refuses to choose is not a plan.<\/li>\n<li><strong>Numbers everywhere they belong.<\/strong> Prices, conversion rates, CAC, CPA ceilings, budget lines, targets. Estimates are fine; unlabelled estimates are not. Mark each assumption as measured, benchmarked, or guessed.<\/li>\n<li><strong>Explicit exclusions.<\/strong> What you are not doing, and why, is the strongest signal of judgment in the document.<\/li>\n<li><strong>Uncertainty stated, not hidden.<\/strong> Name what you do not know and what would change your mind. Confident vagueness is what experienced readers screen for.<\/li>\n<li><strong>Plain language.<\/strong> No jargon that does not earn its place.<\/li>\n<\/ul>\n<p>Length is a constraint, not a target. If it runs to 15 pages, cut — the discipline of fitting it into 10 is part of the exercise.<\/p>", "text": "A 6–10 page go-to-market plan for one business, written for a reader who is smart, busy, and not a marketer — a CEO, an investor, a client, or an interviewer. Standards: Decisions, not options. \"We will do X because Y\" beats \"we could consider X, Y or Z.\" A plan that refuses to choose is not a plan. Numbers everywhere they belong. Prices, conversion rates, CAC, CPA ceilings, budget lines, targets. Estimates are fine; unlabelled estimates are not. Mark each assumption as measured, benchmarked, or guessed. Explicit exclusions. What you are not doing, and why, is the strongest signal of judgment in the document. Uncertainty stated, not hidden. Name what you do not know and what would change your mind. Confident vagueness is what experienced readers screen for. Plain language. No jargon that does not earn its place. Length is a constraint, not a target. If it runs to 15 pages, cut — the discipline of fitting it into 10 is part of the exercise."}, {"h": "The deliverable, section by section", "html": "<h3>1. Situation and diagnosis (~1 page)<\/h3>\n<p>What the business is, what it sells, to whom, at what price, and how it makes money today. Then the diagnosis: <strong>the single most important constraint on growth<\/strong>, stated as a constraint rather than a wish (M01, M06).<\/p>\n<p>\"We need more sales\" is not a diagnosis. \"We convert 4% of demo requests to paid, against a 12% category norm, and we have no idea why\" is. \"Nobody in our category knows we exist and 90% of our leads come from one referral partner\" is. Everything downstream should follow from this sentence — if a later section does not address the constraint, ask why it is in the plan.<\/p>\n<p>Include a short competitive picture: the three real alternatives your buyer considers, including doing nothing and doing it manually.<\/p>\n<h3>2. ICP and jobs-to-be-done (~1 page)<\/h3>\n<p>Who exactly you are for, and who you are explicitly not for (M02). Firmographics or demographics, but more importantly the <strong>situation<\/strong> they are in, the <strong>trigger<\/strong> that starts them looking, what they have already tried, and the job they are hiring your product to do.<\/p>\n<p>Include at least three verbatim or realistically-reconstructed customer phrases. If you have run interviews, quote them; if not, say so and mark it as an assumption to validate. That honesty scores higher than invented certainty.<\/p>\n<p>For B2B, add the buying committee: who else is in the room and what each needs (M16).<\/p>\n<h3>3. Positioning and message hierarchy (~1 page)<\/h3>\n<p>A positioning statement in a fixed structure (M03):<\/p>\n<blockquote>\n<p>For [ICP] who [situation/trigger], [product] is the [category] that [primary differentiated benefit], unlike [primary competitive alternative], because [proof].<\/p>\n<\/blockquote>\n<p>Then the message hierarchy: one primary message, three supporting messages, and the proof point under each. Add a short \"what we do not say\" list — claims you are deliberately leaving to competitors.<\/p>\n<p>Test it before moving on: could a competitor put their name in your positioning statement and have it still read true? If yes, it says nothing.<\/p>\n<h3>4. Offer and pricing (~0.5–1 page)<\/h3>\n<p>What is sold and at what price, with a rationale (M04): price points, packaging or tiers, what is included, the entry offer, and the guarantee or risk-reversal. State the pricing logic — cost-plus, competitive, or value-based — and include gross margin, because every economic decision later depends on it.<\/p>\n<h3>5. Funnel model, unit economics, and max CPA (~1 page)<\/h3>\n<p>A funnel with real or estimated rates at each step, from first touch to paying customer (M05). Then:<\/p>\n<ul>\n<li><strong>AOV or ACV<\/strong>, and gross margin<\/li>\n<li><strong>LTV<\/strong> on gross profit, with the retention or repeat-rate assumption behind it, capped at a defensible horizon (M17)<\/li>\n<li><strong>Max CAC<\/strong> at your chosen LTV:CAC ratio, and the reasoning for that ratio<\/li>\n<li><strong>Payback period<\/strong>, and whether your cash position tolerates it<\/li>\n<li><strong>Max CPA per funnel step<\/strong>, worked backwards — the number you will actually bid against<\/li>\n<\/ul>\n<p>Worked, with the arithmetic visible. This is the section that most separates strong plans from weak ones, and the one interviewers probe hardest.<\/p>\n<h3>6. Channel strategy (~1–1.5 pages)<\/h3>\n<p><strong>Two or three channels. Not five.<\/strong> For each: why this channel for this ICP, what role it plays (creation or capture, M01), what the first campaign looks like concretely, the expected cost per outcome against your max CPA, and how long before you would know if it works.<\/p>\n<p>Then the section that demonstrates seniority: <strong>exclusions.<\/strong> Name at least three channels you are not using, with the specific reason — the audience is not there, the unit economics do not support the CPC, you lack the volume to make it work, the cycle is too long, you cannot produce the creative it demands. Vague dismissal does not count.<\/p>\n<p>Reference 2026 conditions where they bear on the choice: black-box buying means creative and offer are your levers (M11, M15); ~60% of searches ending click-free means organic strategy must include being named in answers, not only ranking (M08, M18).<\/p>\n<h3>7. The 90-day plan (~1–1.5 pages)<\/h3>\n<p>Weeks 1–12 in a table, with a named owner and a deliverable per week, grouped into phases — typically foundations and tracking, then launch, then optimise.<\/p>\n<p>Be concrete. \"Improve SEO\" is not a week's work; \"publish three comparison pages targeting [terms] and add schema markup\" is. Include the unglamorous foundations — analytics and key events, UTM convention, CRM stages, consent banner — and what has to be true before each phase can start.<\/p>\n<h3>8. Budget allocation (~0.5 page)<\/h3>\n<p>A table: channel, monthly spend, purpose (creation or capture), expected outcome, confidence, evidence type (M15). Built objective-and-task, from the target backwards, not as a percentage. Include a line for creative production and one for tools. State what you would cut first at −20% and where the money would go at +50%; both answers reveal how well you understand marginal returns.<\/p>\n<h3>9. Measurement plan (~1 page)<\/h3>\n<ul>\n<li><strong>The one metric that matters,<\/strong> decomposed two levels into a metric tree with leading and lagging nodes marked (M13)<\/li>\n<li><strong>Key events<\/strong> with values, and which single one is the optimisation target you feed the ad platforms<\/li>\n<li><strong>UTM convention<\/strong> — a closed list of <code>medium<\/code> values, campaign naming pattern with dates, casing rule, owner<\/li>\n<li><strong>Reporting cadence<\/strong> — daily, weekly, monthly, quarterly<\/li>\n<li><strong>Attribution stance<\/strong> — three or four sentences on what you will and will not trust, and the one incrementality test you run first (branded search or retargeting is usually the right answer)<\/li>\n<li><strong>Self-reported attribution<\/strong> — the exact \"how did you hear about us\" question you will add<\/li>\n<\/ul>\n<h3>10. Experiment backlog (~0.5 page)<\/h3>\n<p>Five to eight hypotheses in the because / we expect / measured by format (M14), ICE-scored and ranked.<\/p>\n<p>For the top one, add the sample size reality check: baseline rate, MDE, traffic required, weeks needed. If you cannot test it, say so and state the alternative method. <strong>A plan that admits it lacks the traffic to A/B test scores higher than one that pretends otherwise.<\/strong><\/p>\n<h3>11. Risks and what would change course (~0.5 page)<\/h3>\n<p>Four to six risks, each with a mitigation and — critically — a <strong>trip-wire<\/strong>: the observable condition that would make you change the plan. \"If CPA on Meta prospecting exceeds £X for three consecutive weeks with acceptable creative volume, we stop and shift budget to Y.\" \"If month-3 cohort retention stays below 30%, we pause acquisition scaling and work on onboarding.\" Include at least one external risk (platform change, competitor, regulation) and one internal one (capacity, cash, key-person dependency).<\/p>", "text": "1. Situation and diagnosis (~1 page) What the business is, what it sells, to whom, at what price, and how it makes money today. Then the diagnosis: the single most important constraint on growth , stated as a constraint rather than a wish (M01, M06). \"We need more sales\" is not a diagnosis. \"We convert 4% of demo requests to paid, against a 12% category norm, and we have no idea why\" is. \"Nobody in our category knows we exist and 90% of our leads come from one referral partner\" is. Everything downstream should follow from this sentence — if a later section does not address the constraint, ask why it is in the plan. Include a short competitive picture: the three real alternatives your buyer considers, including doing nothing and doing it manually. 2. ICP and jobs-to-be-done (~1 page) Who exactly you are for, and who you are explicitly not for (M02). Firmographics or demographics, but more importantly the situation they are in, the trigger that starts them looking, what they have already tried, and the job they are hiring your product to do. Include at least three verbatim or realistically-reconstructed customer phrases. If you have run interviews, quote them; if not, say so and mark it as an assumption to validate. That honesty scores higher than invented certainty. For B2B, add the buying committee: who else is in the room and what each needs (M16). 3. Positioning and message hierarchy (~1 page) A positioning statement in a fixed structure (M03): For [ICP] who [situation/trigger], [product] is the [category] that [primary differentiated benefit], unlike [primary competitive alternative], because [proof]. Then the message hierarchy: one primary message, three supporting messages, and the proof point under each. Add a short \"what we do not say\" list — claims you are deliberately leaving to competitors. Test it before moving on: could a competitor put their name in your positioning statement and have it still read true? If yes, it says nothing. 4. Offer and pricing (~0.5–1 page) What is sold and at what price, with a rationale (M04): price points, packaging or tiers, what is included, the entry offer, and the guarantee or risk-reversal. State the pricing logic — co"}, {"h": "Time breakdown", "html": "<table>\n<thead>\n<tr>\n<th>Minutes<\/th>\n<th>Task<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–15<\/td>\n<td><strong>Setup.<\/strong> Pick the business, reread your M01, M03, M05 and M13 notes, and write section 1's diagnosis sentence. Do not proceed until it is good — everything hangs on it.<\/td>\n<\/tr>\n<tr>\n<td>15–35<\/td>\n<td>Sections 2 and 3 — ICP and positioning. Pull from existing exercises rather than starting fresh.<\/td>\n<\/tr>\n<tr>\n<td>35–50<\/td>\n<td>Sections 4 and 5 — offer, pricing, unit economics, max CPA. Do the arithmetic properly.<\/td>\n<\/tr>\n<tr>\n<td>50–70<\/td>\n<td>Sections 6 and 7 — channels with exclusions, and the 90-day plan.<\/td>\n<\/tr>\n<tr>\n<td>70–85<\/td>\n<td>Sections 8 and 9 — budget and measurement.<\/td>\n<\/tr>\n<tr>\n<td>85–100<\/td>\n<td>Sections 10 and 11 — experiment backlog and risks.<\/td>\n<\/tr>\n<tr>\n<td>100–105<\/td>\n<td><strong>Coherence pass.<\/strong> Read it start to finish checking one thing: does every section serve the constraint in section 1? Cut what does not.<\/td>\n<\/tr>\n<tr>\n<td>105–120<\/td>\n<td><strong>Self-assessment<\/strong> against the rubric below, plus the improvement list.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>If you run short, protect sections 1, 3, 5 and 9. A plan with a sharp diagnosis, real positioning, honest economics and a measurement stance is more impressive at six pages than a padded ten.<\/p>", "text": "Minutes Task 0–15 Setup. Pick the business, reread your M01, M03, M05 and M13 notes, and write section 1's diagnosis sentence. Do not proceed until it is good — everything hangs on it. 15–35 Sections 2 and 3 — ICP and positioning. Pull from existing exercises rather than starting fresh. 35–50 Sections 4 and 5 — offer, pricing, unit economics, max CPA. Do the arithmetic properly. 50–70 Sections 6 and 7 — channels with exclusions, and the 90-day plan. 70–85 Sections 8 and 9 — budget and measurement. 85–100 Sections 10 and 11 — experiment backlog and risks. 100–105 Coherence pass. Read it start to finish checking one thing: does every section serve the constraint in section 1? Cut what does not. 105–120 Self-assessment against the rubric below, plus the improvement list. If you run short, protect sections 1, 3, 5 and 9. A plan with a sharp diagnosis, real positioning, honest economics and a measurement stance is more impressive at six pages than a padded ten."}, {"h": "Self-assessment rubric", "html": "<p>Score each row 1–3. Be harsh; the score is for you.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Section<\/th>\n<th>1 — Weak<\/th>\n<th>2 — Competent<\/th>\n<th>3 — Strong<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Situation &amp; diagnosis<\/td>\n<td>Describes the business; no constraint named<\/td>\n<td>Constraint named but generic<\/td>\n<td>One specific constraint, evidenced, and every later section traces back to it<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>ICP &amp; JTBD<\/td>\n<td>Broad demographics; \"small businesses\"<\/td>\n<td>Clear segment with a trigger<\/td>\n<td>Segment, situation, trigger, exclusions, and real customer language<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Positioning<\/td>\n<td>Generic benefit claim<\/td>\n<td>Fills the template correctly<\/td>\n<td>A competitor could not substitute their name; proof is specific and real<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Offer &amp; pricing<\/td>\n<td>Price stated with no rationale<\/td>\n<td>Price with logic and margin<\/td>\n<td>Packaging, entry offer, risk-reversal, and margin that supports the plan<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Unit economics<\/td>\n<td>Missing or hand-waved<\/td>\n<td>CAC and LTV computed<\/td>\n<td>Full chain to max CPA per step, on gross profit, assumptions labelled, payback addressed<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Channel strategy<\/td>\n<td>Lists every channel<\/td>\n<td>2–3 chosen with reasons<\/td>\n<td>Chosen with reasons, roles assigned, CPA-tested, and three exclusions justified specifically<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>90-day plan<\/td>\n<td>Vague themes<\/td>\n<td>Weekly actions<\/td>\n<td>Weekly actions with owners, dependencies, phases, and foundations included<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Budget<\/td>\n<td>A percentage or a round number<\/td>\n<td>Allocated by channel<\/td>\n<td>Objective-and-task, with confidence per line and answers for −20% and +50%<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Measurement<\/td>\n<td>Lists tools<\/td>\n<td>Metric tree and key events<\/td>\n<td>Metric tree, UTM convention, cadence, honest attribution stance, first incrementality test named<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Experiments<\/td>\n<td>Ideas listed<\/td>\n<td>Hypotheses in correct format, prioritised<\/td>\n<td>Sample size reality check done, and an honest alternative where testing is not possible<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Risks<\/td>\n<td>Generic risks<\/td>\n<td>Risks with mitigations<\/td>\n<td>Risks with observable trip-wires and a stated course change<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Coherence<\/td>\n<td>Sections contradict each other<\/td>\n<td>Internally consistent<\/td>\n<td>Reads as one argument; the diagnosis drives every choice<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Under 24:<\/strong> the plan is a description, not a strategy. Rework sections 1, 3 and 5 first.\n<strong>24–30:<\/strong> solid working plan. Pick your three lowest rows and improve them.\n<strong>31–36:<\/strong> portfolio-grade. Have someone who knows the business challenge it, and make sure you can defend every number out loud.<\/p>\n<p>Then write your <strong>improvement list<\/strong>: the three lowest-scoring rows, one concrete action each, and a date.<\/p>", "text": "Score each row 1–3. Be harsh; the score is for you. # Section 1 — Weak 2 — Competent 3 — Strong 1 Situation &amp; diagnosis Describes the business; no constraint named Constraint named but generic One specific constraint, evidenced, and every later section traces back to it 2 ICP &amp; JTBD Broad demographics; \"small businesses\" Clear segment with a trigger Segment, situation, trigger, exclusions, and real customer language 3 Positioning Generic benefit claim Fills the template correctly A competitor could not substitute their name; proof is specific and real 4 Offer &amp; pricing Price stated with no rationale Price with logic and margin Packaging, entry offer, risk-reversal, and margin that supports the plan 5 Unit economics Missing or hand-waved CAC and LTV computed Full chain to max CPA per step, on gross profit, assumptions labelled, payback addressed 6 Channel strategy Lists every channel 2–3 chosen with reasons Chosen with reasons, roles assigned, CPA-tested, and three exclusions justified specifically 7 90-day plan Vague themes Weekly actions Weekly actions with owners, dependencies, phases, and foundations included 8 Budget A percentage or a round number Allocated by channel Objective-and-task, with confidence per line and answers for −20% and +50% 9 Measurement Lists tools Metric tree and key events Metric tree, UTM convention, cadence, honest attribution stance, first incrementality test named 10 Experiments Ideas listed Hypotheses in correct format, prioritised Sample size reality check done, and an honest alternative where testing is not possible 11 Risks Generic risks Risks with mitigations Risks with observable trip-wires and a stated course change 12 Coherence Sections contradict each other Internally consistent Reads as one argument; the diagnosis drives every choice Under 24: the plan is a description, not a strategy. Rework sections 1, 3 and 5 first. 24–30: solid working plan. Pick your three lowest rows and improve them. 31–36: portfolio-grade. Have someone who knows the business challenge it, and make sure you can defend every number out loud. Then write your improvement list : the three lowest-scoring rows, one concrete action each, and a d"}, {"h": "How to use this artifact", "html": "<p><strong>As a portfolio piece.<\/strong> Strip anything confidential, put it in a clean PDF, and make it the thing you send when someone asks what you can do. One well-reasoned plan beats a list of courses you have taken.<\/p>\n<p><strong>In job interviews.<\/strong> You will be asked \"how would you approach marketing for us?\" Do not answer generically — answer with your method, demonstrated: \"Here is a plan I built end to end; let me walk you through how I diagnosed the constraint and why I excluded three channels.\" Then be ready for the pressure test — where the numbers came from, what you would do at half the budget, how you would know in 90 days if you were wrong. Sections 5, 8 and 9 are where interviews are won.<\/p>\n<p><strong>In client proposals.<\/strong> Sections 1, 2, 3 and 7 are the shape of a paid discovery deliverable. The fastest route to freelance credibility is to do this unpaid for one prospect's business, present it, and let the quality of the diagnosis sell the engagement.<\/p>\n<p><strong>Running your own business.<\/strong> Print sections 7, 8 and 9 and work from them, then revisit every quarter: update the funnel rates with real data, retire assumptions that turned out wrong, rescore the rubric. A plan that is never revised was never a plan.<\/p>", "text": "As a portfolio piece. Strip anything confidential, put it in a clean PDF, and make it the thing you send when someone asks what you can do. One well-reasoned plan beats a list of courses you have taken. In job interviews. You will be asked \"how would you approach marketing for us?\" Do not answer generically — answer with your method, demonstrated: \"Here is a plan I built end to end; let me walk you through how I diagnosed the constraint and why I excluded three channels.\" Then be ready for the pressure test — where the numbers came from, what you would do at half the budget, how you would know in 90 days if you were wrong. Sections 5, 8 and 9 are where interviews are won. In client proposals. Sections 1, 2, 3 and 7 are the shape of a paid discovery deliverable. The fastest route to freelance credibility is to do this unpaid for one prospect's business, present it, and let the quality of the diagnosis sell the engagement. Running your own business. Print sections 7, 8 and 9 and work from them, then revisit every quarter: update the funnel rates with real data, retire assumptions that turned out wrong, rescore the rubric. A plan that is never revised was never a plan."}, {"h": "What comes after hour 30", "html": "<p>You are now, genuinely, more useful than most people who list marketing on their CV — because you can do the arithmetic, you know what attribution cannot tell you, and you know what you do not know.<\/p>\n<p>What you do not have is reps. Judgment comes from having been wrong in specific, memorable ways, and thirty hours cannot manufacture that.<\/p>\n<p>The next step is one real thing, run for one quarter, measured honestly: a small budget you actually spend, a landing page you actually ship, an email flow that actually sends, a holdout you actually run. Then write down what surprised you. That log is worth more than the next thirty hours of reading.<\/p>\n<p>For what to study next, in what order, and how to build the reps: <strong><em>Path to expert<\/em><\/strong>.<\/p>", "text": "You are now, genuinely, more useful than most people who list marketing on their CV — because you can do the arithmetic, you know what attribution cannot tell you, and you know what you do not know. What you do not have is reps. Judgment comes from having been wrong in specific, memorable ways, and thirty hours cannot manufacture that. The next step is one real thing, run for one quarter, measured honestly: a small budget you actually spend, a landing page you actually ship, an email flow that actually sends, a holdout you actually run. Then write down what surprised you. That log is worth more than the next thirty hours of reading. For what to study next, in what order, and how to build the reps: Path to expert ."}, {"h": "A closing note", "html": "<p>Thirty hours gave you literacy and a working set of models: demand creation versus capture, positioning against alternatives including doing nothing, unit economics that constrain what you can spend, the direction each measurement method lies in, and the fact that only a holdout answers the causal question. Those do not expire when the channels change.<\/p>\n<p>Thirty hours did not give you craft. You have not written 200 ads and watched most of them fail. You have not sat through a quarter where the numbers went the wrong way and had to explain it. You have not developed the instinct for when a customer is telling you what they think you want to hear. That takes years, and no version of this course shortcuts it.<\/p>\n<p>What you have is the thing that makes those years pay off faster: you will know what you are looking at. Most people never get that, because they start with tactics and never go back for the foundations. You did it the right way round.<\/p>\n<p>Go run something.<\/p>", "text": "Thirty hours gave you literacy and a working set of models: demand creation versus capture, positioning against alternatives including doing nothing, unit economics that constrain what you can spend, the direction each measurement method lies in, and the fact that only a holdout answers the causal question. Those do not expire when the channels change. Thirty hours did not give you craft. You have not written 200 ads and watched most of them fail. You have not sat through a quarter where the numbers went the wrong way and had to explain it. You have not developed the instinct for when a customer is telling you what they think you want to hear. That takes years, and no version of this course shortcuts it. What you have is the thing that makes those years pay off faster: you will know what you are looking at. Most people never get that, because they start with tactics and never go back for the foundations. You did it the right way round. Go run something."}], "suggest": [["What does showing judgment look like on the page, concretely?", "What usually breaks first when positioning meets channel choice?", "How do I choose which business to write this plan about?"], ["How do I label an assumption as benchmarked rather than guessed?", "Show one paragraph rewritten from options into a real decision", "How many exclusions are enough before it reads as dodging the work?"], ["How do I turn 'we need more sales' into a real constraint sentence?", "Give me two diagnosis sentences for a small service business", "How do I find my constraint when I have almost no funnel data?"], ["How do I know my diagnosis sentence is good enough to move on?", "What should the coherence pass check, section by section?", "Which parts should I cut if I only have an hour, not two?"], ["What separates a 2 from a 3 on the positioning row?", "How would you score an ICP section that just says 'small businesses'?", "Which rubric rows matter most to a hiring manager reading fast?"], ["What does a good answer to 'where did these numbers come from' sound like?", "How should I answer 'what would you do at half the budget'?", "What must I strip out before this plan is safe to send publicly?"], ["Which 'one real thing' gives the most learning per hour spent?", "What should go into the log of what surprised me each week?", "How do I run a real holdout on a tiny budget without wrecking sales?"], ["Which of these models should I pressure-test against reality first?", "How do I build craft faster without 200 failed ads behind me?", "What would count as evidence that my judgment is actually improving?"]], "assess": {"predict": "If you had to judge two go-to-market plans for the same business, guess one thing that would tell you which author has more judgment.", "quiz": [{"q": "Which of these is a diagnosis rather than a wish?", "options": ["We need more sales, and faster than last year.", "We want to be the recognised category leader within eighteen months.", "We convert 4 percent of demo requests to paid against a 12 percent category norm, and we have no idea why.", "Our marketing budget is too small for the goals we have been given."], "answer": 2, "why": "A diagnosis names the single most important constraint on growth, stated as a constraint and backed by evidence, and everything downstream should follow from that sentence. The budget complaint is the most tempting wrong answer because it sounds specific and analytical, but it is a wish for more resource rather than a named, evidenced constraint you can act on."}, {"q": "A plan's channel section lists five channels with a paragraph of justification for each and no exclusions. How does it score on the rubric?", "options": ["Weak. Level 1 is 'lists every channel'; a 3 requires two or three channels chosen with roles assigned, expected cost per outcome tested against max CPA, and at least three exclusions justified specifically.", "Competent. Reasons were given for each channel, which is what level 2 asks for.", "Strong. Five reasoned channels shows breadth of understanding.", "It cannot be scored until the budget section is read alongside it."], "answer": 0, "why": "The rubric's level 2 is two or three channels chosen with reasons, so listing five fails even that bar regardless of how good the paragraphs are. Explicit exclusions - what you are not doing and why - are described as the strongest signal of judgment in the document, and vague dismissal does not count."}, {"q": "Your plan states an £80 AOV, 45 percent gross margin, an average 1.8 purchases per customer over a 24-month horizon, a 3:1 LTV:CAC target, and a 3 percent landing page conversion rate. What is the most you can pay per click?", "options": ["About £1.44, since LTV is £80 x 1.8 = £144, divided by three and multiplied by the conversion rate.", "About £21.60, which is what you can afford per customer.", "About £0.65: LTV on gross profit is £64.80, max CAC at 3:1 is £21.60, and each click is worth 3 percent of that.", "About £2.16, being max CAC divided by ten."], "answer": 2, "why": "The chain runs AOV to gross profit to LTV at a capped horizon to max CAC to max CPA per funnel step, and £80 x 0.45 x 1.8 is £64.80, so max CAC is £21.60 and a click at 3 percent conversion is worth about £0.65. The £1.44 answer computes LTV on revenue instead of gross profit, which more than doubles what you would bid."}, {"q": "Section 9 asks for an attribution stance and the one incrementality test you run first. Which version belongs in a strong plan?", "options": ["A commitment to build a media mix model within the first 90 days as the source of truth.", "Three or four sentences on what you will and will not trust, naming branded search or retargeting as the first holdout.", "A commitment to GA4's data-driven model as the source of truth, as the most advanced of its three models.", "A statement that once tracking is fixed, attribution will show which channels cause sales."], "answer": 1, "why": "Branded search or retargeting is usually the right first incrementality test because that is where non-incremental spend hides. Naming GA4's data-driven model is the plausible-sounding trap: GA4 does retain three attribution models, but no attribution model establishes causation, which is the point the stance has to make."}, {"q": "Your experiment backlog's top hypothesis needs 90,000 sessions and you get 4,000 a week. How should the plan handle it?", "options": ["Include only hypotheses you can test to 95 percent confidence, and cut this one from the backlog.", "Leave the sample size check out, because it makes the plan look pessimistic to a reader.", "ICE-score the hypotheses but leave them unranked, so you stay flexible about what to run.", "State the sample size reality check openly and name the alternative method, since a plan that admits it lacks the traffic to A/B test scores higher than one that pretends otherwise."], "answer": 3, "why": "The rubric's level 3 for experiments is the sample size reality check done and an honest alternative where testing is not possible, and confident vagueness is exactly what experienced readers screen for. Cutting the hypothesis is tempting but wrong: the idea may still be the right thing to do, just not by A/B test."}, {"q": "Which risk entry earns a 3 on the rubric?", "options": ["If CPA on Meta prospecting exceeds £45 for three consecutive weeks with acceptable creative volume, we stop and shift the budget to partnerships.", "Rising advertising costs could make acquisition harder over time; we will monitor performance closely.", "Competitors may copy our positioning; we will mitigate this by continuing to differentiate.", "Platform algorithm changes are a risk, which we mitigate by diversifying across channels."], "answer": 0, "why": "A 3 requires an observable trip-wire and a stated course change: the specific condition that would make you change the plan. The other three are risks with mitigations, which is level 2 at best, because none of them names a number or a moment at which you would actually do something differently."}], "cards": [{"front": "What is the capstone deliverable, and who is it written for?", "back": "A six to ten page go-to-market plan for one real business, written for a smart, busy non-marketer: a CEO, investor, client or interviewer. Length is a constraint, not a target."}, {"front": "Name the standards a strong plan meets.", "back": "Decisions rather than options; numbers everywhere they belong, with each assumption labelled measured, benchmarked or guessed; explicit exclusions; uncertainty stated rather than hidden; plain language with no unearned jargon."}, {"front": "What makes a diagnosis rather than a wish?", "back": "One specific evidenced constraint on growth - not 'we need more sales' but '4 percent of demo requests convert against a 12 percent category norm'. Every later section should trace back to it."}, {"front": "Which four sections do you protect if you run short of time?", "back": "Situation and diagnosis, positioning, unit economics, and measurement. A sharp diagnosis, real positioning, honest economics and a measurement stance beat a padded ten pages."}, {"front": "What must the unit economics section contain to score a 3?", "back": "The full chain to max CPA per funnel step, computed on gross profit, with the retention assumption and a capped horizon, the LTV:CAC ratio reasoning, payback addressed, and every assumption labelled."}, {"front": "What separates a level-2 risk from a level-3 risk?", "back": "A trip-wire: the observable condition that would make you change the plan, plus the stated course change. Include at least one external risk and one internal one."}], "elaborate": ["Write the diagnosis sentence for your chosen business in one line: the single most important constraint on growth, stated as a constraint with evidence attached. Then take three sections you have already drafted across earlier modules and say honestly, for each, whether it addresses that constraint or is simply in the plan out of habit.", "Score your own plan against the twelve-row rubric and be harsh about it. Take your three lowest rows, write one concrete action and a date for each, and name which earlier module you would reread first before attempting the rewrite."], "transfer": {"scenario": "You are handed a nine-page go-to-market plan for a £120 per month B2B tool. The ICP section is genuinely good, with a clear trigger and three verbatim customer quotes, and the positioning statement fills the template correctly. The channel section covers SEO, paid search, paid social, LinkedIn organic, podcasts, events and partnerships with a paragraph each, and the budget is stated as 10 percent of forecast revenue. The measurement section lists GA4, HubSpot and Looker Studio, and four generic risks each have a mitigation. The diagnosis reads 'we need to grow faster', and there is no unit economics section at all.", "prompt": "Identify the weakest rows and say what you would send back first.", "model": "Rows 1, 5, 6 and 8 are ones, and the total lands well under 24, which means this is a description rather than a strategy. Three things go back first. The diagnosis: 'we need to grow faster' is a wish, so name one specific evidenced constraint, then check every section traces to it. The unit economics, which are missing entirely: ACV, gross margin, LTV on gross profit at a capped horizon, max CAC at a stated ratio with the reasoning, payback against the cash position, and max CPA per funnel step worked backwards. The channels: cut seven to two or three, assign creation or capture roles, test expected cost per outcome against max CPA, and justify at least three exclusions specifically. Rebuild the budget objective-and-task, not as a percentage, with answers for minus 20 percent and plus 50 percent. The ICP section is already strong; leave it."}}}], "library": {"glossary": [{"term": "A/B test", "star": true, "def": "Splitting traffic between two versions to see which performs better; only meaningful if you have enough volume to detect a real difference."}, {"term": "Above the fold", "star": false, "def": "What is visible before scrolling. Less sacred than it used to be, but still where clarity has to happen."}, {"term": "Account-based marketing (ABM)", "star": false, "def": "B2B approach that targets a named list of companies rather than a broad audience, treating each account as a market of one."}, {"term": "Ad rank", "star": false, "def": "Google's internal score deciding whether and where your ad shows; roughly bid times quality times expected impact of extras."}, {"term": "Advantage+", "star": true, "def": "Meta's automated campaign products that take most targeting and placement decisions away from you and hand them to the algorithm; your inputs become creative, offer, and data."}, {"term": "AEO (Answer Engine Optimization)", "star": true, "def": "Optimising so that AI assistants and answer boxes give your answer and name you, rather than optimising for a blue link."}, {"term": "Affiliate marketing", "star": false, "def": "Paying third parties a commission per sale they refer; cheap-looking but frequently pays for demand you already had."}, {"term": "AOV (Average Order Value)", "star": true, "def": "Revenue divided by number of orders. Raising it is often easier than getting more orders."}, {"term": "Assisted conversion", "star": false, "def": "A touchpoint that appeared somewhere in the path but was not the last click; useful directionally, dangerous if you add them up."}, {"term": "Attribution", "star": true, "def": "Assigning credit for a conversion to marketing touchpoints. It is a modelling choice, not a measurement, and every model is wrong in a different direction."}, {"term": "Attribution window", "star": true, "def": "How long after seeing or clicking an ad a conversion still gets credited (e.g. 7-day click, 1-day view). Changing the window changes every number in your report, so always state it."}, {"term": "Audience exclusion", "star": false, "def": "Deliberately removing people from targeting (existing customers, recent converters, bad-fit segments). Underused and free."}, {"term": "Awareness", "star": false, "def": "Whether people know you exist. Cheap to buy, slow to build, and the precondition for everything downstream."}, {"term": "Backlink", "star": false, "def": "A link from another site to yours. Still a meaningful ranking factor; still mostly obtained by having something worth linking to."}, {"term": "Bid strategy", "star": false, "def": "The rule an ad platform uses to set your bids (manual CPC, target CPA, target ROAS, maximise conversions). Choosing the wrong one is a common way to waste a month."}, {"term": "Blended CAC", "star": false, "def": "Total marketing and sales spend divided by all new customers, including organic ones. Flatters paid channels; useful as a business-level number, misleading as a channel-level one."}, {"term": "Bottom of funnel (BOFU)", "star": false, "def": "Content or campaigns aimed at people close to deciding: pricing, comparisons, demos, reviews."}, {"term": "Bounce rate", "star": false, "def": "Share of visits with no further interaction. Redefined in GA4 as the inverse of engaged sessions, so old benchmarks do not transfer."}, {"term": "Brand", "star": true, "def": "What people believe about you before you say anything. A memory structure that lowers the cost of every other marketing activity."}, {"term": "Brand lift study", "star": false, "def": "A survey-based test measuring whether ads changed awareness or perception. Offered free by large platforms above certain spend levels."}, {"term": "Branded search", "star": true, "def": "People searching your name. The most reliable free indicator that demand creation is working; watch it monthly."}, {"term": "Broad match", "star": false, "def": "Google Ads match type that shows your ad on loosely related queries. Powerful with good conversion data, a money incinerator without it."}, {"term": "Buying committee", "star": false, "def": "Everyone involved in a B2B purchase (typically 6-10 people). In B2C the equivalent is a spouse or a group chat, and it is just as real."}, {"term": "CAC (Customer Acquisition Cost)", "star": true, "def": "Total acquisition spend divided by new customers acquired. Include people costs or you are lying to yourself."}, {"term": "CAC payback", "star": true, "def": "Months of contribution margin needed to earn back CAC. The number that decides whether you can afford to grow."}, {"term": "Canonical tag", "star": true, "def": "HTML tag telling search engines which URL is the real version of a page. Prevents duplicate-content problems, especially from URL parameters."}, {"term": "Category entry point", "star": false, "def": "The situation or cue that makes someone think of a category (\"the boiler broke\", \"we just hired our tenth person\"). You want to be the brand attached to as many of these as possible."}, {"term": "Churn", "star": true, "def": "The rate at which customers leave. Small changes here move LTV more than almost anything you can do in an ad account."}, {"term": "Click-through rate (CTR)", "star": true, "def": "Clicks divided by impressions. Diagnostic of relevance; easy to optimise in ways that hurt revenue."}, {"term": "Cohort", "star": true, "def": "A group defined by when they joined, tracked over time. The only honest way to see whether retention is improving."}, {"term": "Content-market fit", "star": false, "def": "When your content reaches and resonates with the people who could actually buy from you, rather than with a general audience or with other marketers."}, {"term": "Contribution margin", "star": true, "def": "Revenue minus variable costs. The money actually available to pay for acquisition. Use it, never revenue, when calculating LTV."}, {"term": "Conversion rate (CVR)", "star": true, "def": "Share of visitors or leads who take the target action. Always state which two steps you mean."}, {"term": "Core Web Vitals", "star": true, "def": "Google's page experience metrics: LCP (loading, target under 2.5s), INP (responsiveness, under 200ms), CLS (visual stability, under 0.1)."}, {"term": "CPA (Cost Per Acquisition/Action)", "star": true, "def": "Spend divided by actions. Meaningless until you say which action."}, {"term": "CPC (Cost Per Click)", "star": true, "def": "What you pay per click. Set by auction competition, not by you."}, {"term": "CPL (Cost Per Lead)", "star": false, "def": "Spend divided by leads. Falls easily by lowering lead quality, so never report it without a downstream metric."}, {"term": "CPM (Cost Per Mille)", "star": true, "def": "Cost per thousand impressions. The currency of awareness buying, and a useful proxy for how competitive an audience is."}, {"term": "Creative fatigue", "star": false, "def": "Performance decay as an audience sees the same ad repeatedly. Shows up first as rising CPMs and falling CTR at flat spend."}, {"term": "CRM", "star": false, "def": "The system holding your customer and deal records. Whatever it says is what the business will believe, so it is a marketing responsibility whether you like it or not."}, {"term": "CRO (Conversion Rate Optimization)", "star": true, "def": "Improving the share of visitors who act. Mostly clarity, message match, proof, and removing friction; only occasionally button colours."}, {"term": "Customer journey", "star": false, "def": "The real path from unaware to purchase. Loops, stalls, involves other people, and never looks like the funnel diagram."}, {"term": "Dark funnel", "star": false, "def": "Influence that happens where you cannot see it: WhatsApp groups, podcasts, private Slack, DMs. Real, large, and permanently unattributable."}, {"term": "Dayparting", "star": false, "def": "Scheduling ads for particular hours or days. Usually a small lever; occasionally decisive for businesses that answer the phone."}, {"term": "Demand capture", "star": true, "def": "Reaching people who already want the thing and are looking. High conversion, high cost, capped by existing demand."}, {"term": "Demand creation", "star": true, "def": "Making people aware of a problem or possibility they were not thinking about. Low conversion, cheap attention, the only way to grow the market."}, {"term": "Deliverability", "star": false, "def": "Whether your email reaches the inbox rather than spam. Governed by authentication, sending reputation, engagement, and complaint rates."}, {"term": "DKIM", "star": true, "def": "Email authentication that cryptographically signs your messages so receiving servers can verify they were not altered and came from you."}, {"term": "DMARC", "star": true, "def": "Email policy record that tells receiving servers what to do with mail failing SPF and DKIM, and sends you reports. Required by major mailbox providers for bulk senders."}, {"term": "Double opt-in", "star": false, "def": "Requiring a confirmation click before adding someone to a list. Smaller list, dramatically better deliverability and engagement."}, {"term": "Dynamic search ads", "star": false, "def": "Google Ads that generate headlines and targeting from your website content. Good for coverage, poor for control."}, {"term": "E-E-A-T", "star": true, "def": "Experience, Expertise, Authoritativeness, Trustworthiness. Google's quality framework. The first E — demonstrable first-hand experience — is the hardest to fake and the most valuable in an era of generated content."}, {"term": "Engagement rate", "star": false, "def": "Interactions divided by reach or impressions. Definition varies by platform; almost always a vanity metric unless tied to an outcome."}, {"term": "Enhanced conversions", "star": false, "def": "Sending hashed first-party data (email, phone) back to ad platforms to improve conversion measurement after cookie loss."}, {"term": "Entity (SEO)", "star": false, "def": "A thing search engines recognise as distinct — a person, brand, product, place. Being a recognised entity is increasingly what gets you named in AI answers."}, {"term": "Event (GA4)", "star": true, "def": "GA4's unit of measurement. Everything is an event; some events are marked as key events (the old \"goals\")."}, {"term": "Exact match", "star": false, "def": "Match type showing your ad only for the specified query and close variants. Control at the cost of volume."}, {"term": "Exit rate", "star": false, "def": "Share of sessions that end on a given page. Useful for finding the leak in a multi-step flow."}, {"term": "First-party data", "star": true, "def": "Data you collected directly from your own customers. The most durable asset in marketing as third-party tracking degrades."}, {"term": "Flywheel", "star": false, "def": "A loop where each turn makes the next one easier (customers bring referrals, content brings links). The alternative to renting growth from ad platforms."}, {"term": "Frequency", "star": true, "def": "Average number of times a person saw your ad. Too low and nothing lands; too high and you are annoying people you already convinced."}, {"term": "Funnel", "star": true, "def": "The model of awareness to purchase. A useful accounting fiction for spotting where people drop out, not a description of how anyone actually buys."}, {"term": "GA4 (Google Analytics 4)", "star": true, "def": "The current Google Analytics: event-based, session-secondary, different from Universal Analytics in ways that break every old benchmark."}, {"term": "GEO (Generative Engine Optimization)", "star": true, "def": "Making your brand the one AI models cite and recommend. Overlaps heavily with AEO; the industry has not settled on which term wins."}, {"term": "Gross margin", "star": false, "def": "Revenue minus cost of goods sold, as a percentage. Sets the ceiling on what you can ever spend to acquire a customer."}, {"term": "Guardrail metric", "star": false, "def": "A metric that must not get worse while you optimise something else. The thing that stops a conversion-rate win from destroying lead quality."}, {"term": "Hard bounce", "star": false, "def": "A permanently failed email delivery. Remove these immediately; leaving them in wrecks your sending reputation."}, {"term": "Holdout", "star": true, "def": "A randomly chosen group deliberately excluded from marketing so you can compare them to the treated group. The cleanest way to know if anything you do is incremental."}, {"term": "Hreflang", "star": false, "def": "Tag telling search engines which language and region version of a page to serve. Relevant the moment you sell in more than one country."}, {"term": "ICP (Ideal Customer Profile)", "star": true, "def": "A description of the situation in which someone buys from you, including who to disqualify. Not a persona with a stock photo."}, {"term": "Impression", "star": false, "def": "One display of your ad or listing. Cheap, abundant, and only meaningful in ratios."}, {"term": "Impression share", "star": false, "def": "Share of available impressions you received. Tells you how much room is left in a channel before you have to bid up."}, {"term": "Incrementality", "star": true, "def": "Whether an activity caused sales that would not have happened otherwise. The only honest question in measurement, and answerable only through experiments, not dashboards."}, {"term": "Index (search)", "star": false, "def": "Whether search engines have stored your page at all. Check in Search Console before diagnosing anything else about rankings."}, {"term": "Intent", "star": true, "def": "What the person is actually trying to do. Usually classed as informational, commercial investigation, transactional, or navigational."}, {"term": "Internal link", "star": false, "def": "A link from one page of your site to another. The cheapest SEO lever there is, and consistently neglected."}, {"term": "IP warming", "star": false, "def": "Gradually increasing email volume from a new sending IP or domain so mailbox providers learn to trust it."}, {"term": "JTBD (Jobs To Be Done)", "star": true, "def": "The framing that people \"hire\" products to make progress in a situation. Written as: when [situation], I want to [motivation], so I can [outcome]."}, {"term": "Key event (GA4)", "star": true, "def": "GA4's name for a conversion: an event you have flagged as one that matters. Renamed from \"conversion\" to reduce confusion with ad platform conversions, which count differently."}, {"term": "Keyword", "star": false, "def": "A query you want to appear for. Increasingly a planning abstraction rather than a literal targeting unit."}, {"term": "Keyword cannibalization", "star": false, "def": "Multiple pages of yours competing for the same query, so none of them wins. Fix by consolidating, not by writing more."}, {"term": "KPI (Key Performance Indicator)", "star": false, "def": "A metric someone has decided to be judged on. Choose few, define them exactly, and expect people to optimise whatever you pick."}, {"term": "Landing page", "star": false, "def": "The page traffic arrives on. Its job is to continue the sentence the ad started."}, {"term": "Last-click attribution", "star": true, "def": "Giving all credit to the final touchpoint. Simple, universal, and systematically over-credits demand capture while under-crediting everything that created the demand."}, {"term": "Learning phase", "star": true, "def": "The period after launching or editing a campaign while the platform gathers conversion data. Performance is unstable and unrepresentative; editing resets it, which is why the do-not-touch window exists."
