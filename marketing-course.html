anslate each attribute into an outcome. If an attribute maps to no value, drop it. Who cares most. Which customers care intensely about that value? Their shared characteristics are your best-fit segment, usually narrower than you want. Market category. What context makes your value obvious fast? Most positioning work fails because people start at step 5 — picking a category they like — and reverse-engineer the rest. Category entry vs. category design Entry : compete inside a category buyers already understand (\"project management tool\"). Cheap, because the buyer needs no education, but you must be visibly different on something they already care about. Design : name and teach a new category. Enormous upside, enormous cost — you fund the education of the market and competitors then enter for free. Sensible only when the existing category misprices you or attracts the wrong buyer. Default to entry with a sharp sub-segment. Beginners reach for category design because it sounds ambitious; usually it avoids the harder work of being genuinely different inside a category people already search for. The positioning statement template For [best-fit segment] who [trigger] , [product] is the [category] that [key value] , unlike [primary alternative] , because [unique attribute] . An internal alignment tool, not a headline. If it does not fit on one line, the positioning is not decided yet. Differentiation vs. distinctiveness Differentiation is being meaningfully different on something buyers value. It affects choice. Distinctiveness — Byron Sharp's"}, {"h": "How it works in practice", "html": "<p>Positioning is a two-week job, not a two-hour one: interviews (M02), a session running Dunford's five steps, a draft, then testing it on five people who do not work for you — ideally recent buyers and recent losses. The test is comprehension, not applause: ask them to explain back what you do and who it is for. Then roll it into website, deck, ads and onboarding in the same month, or you will run three positions at once.<\/p>", "text": "Positioning is a two-week job, not a two-hour one: interviews (M02), a session running Dunford's five steps, a draft, then testing it on five people who do not work for you — ideally recent buyers and recent losses. The test is comprehension, not applause: ask them to explain back what you do and who it is for. Then roll it into website, deck, ads and onboarding in the same month, or you will run three positions at once."}, {"h": "2026 reality check", "html": "<p>Discovery increasingly runs through AI answer engines that summarise a category and name a handful of options. Those summaries are assembled from how you <em>and others<\/em> describe you: your site, review sites, forums, comparison articles, press.<\/p>\n<ul>\n<li><strong>Ambiguous positioning is now a retrieval failure, not only a comprehension failure.<\/strong> If your site never plainly states \"X is a [category] for [segment],\" a model has nothing unambiguous to lift.<\/li>\n<li><strong>Repetition across sources beats clever phrasing on your homepage.<\/strong> The brand that gets named is the one described the same way in many places, so third-party corroboration — reviews, directories, comparison pages — is leverage.<\/li>\n<li><strong>Category choice is higher-stakes.<\/strong> A category nobody asks about means you never appear in the answer.<\/li>\n<\/ul>\n<p>Say the same unambiguous thing everywhere, for longer than feels necessary. Which is also Sharp's advice for humans.<\/p>", "text": "Discovery increasingly runs through AI answer engines that summarise a category and name a handful of options. Those summaries are assembled from how you and others describe you: your site, review sites, forums, comparison articles, press. Ambiguous positioning is now a retrieval failure, not only a comprehension failure. If your site never plainly states \"X is a [category] for [segment],\" a model has nothing unambiguous to lift. Repetition across sources beats clever phrasing on your homepage. The brand that gets named is the one described the same way in many places, so third-party corroboration — reviews, directories, comparison pages — is leverage. Category choice is higher-stakes. A category nobody asks about means you never appear in the answer. Say the same unambiguous thing everywhere, for longer than feels necessary. Which is also Sharp's advice for humans."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Positioning against a competitor instead of the real alternative<\/strong>, which is usually the status quo.<\/li>\n<li><strong>Choosing the category you want<\/strong> rather than the one buyers search in.<\/li>\n<li><strong>Changing the message because you are bored of it.<\/strong> Internal fatigue arrives long before customer awareness.<\/li>\n<li><strong>Claiming three things at once.<\/strong> Nothing lands.<\/li>\n<li><strong>Feature lists with no outcome, or outcome fluff with no proof.<\/strong><\/li>\n<li><strong>Positioning by committee<\/strong> — a statement true of everyone and exciting to nobody.<\/li>\n<\/ul>", "text": "Positioning against a competitor instead of the real alternative , which is usually the status quo. Choosing the category you want rather than the one buyers search in. Changing the message because you are bored of it. Internal fatigue arrives long before customer awareness. Claiming three things at once. Nothing lands. Feature lists with no outcome, or outcome fluff with no proof. Positioning by committee — a statement true of everyone and exciting to nobody."}, {"h": "Exercise (45 minutes)", "html": "<p>For <strong>your chosen business<\/strong>, using the M02 quotes:<\/p>\n<ol>\n<li><strong>Run Dunford's five steps in order<\/strong> (20 min): alternatives (include \"do nothing\") → unique attributes (facts only) → value → who cares most → category. Write the honest version, not the flattering one.<\/li>\n<li><strong>Fill the positioning statement template<\/strong> (5 min). One line. Rewrite until it fits.<\/li>\n<li><strong>Build the message hierarchy<\/strong> (15 min): one core message, three pillars, concrete proof under each. If a pillar has no proof, find proof or cut the pillar.<\/li>\n<li><strong>Delete test<\/strong> (5 min): take your homepage (or a competitor's) and strike every line a competitor could also claim. What survives is your real differentiation. If nothing survives, that is the finding.<\/li>\n<li>Name <strong>three distinctive assets<\/strong> you will repeat for at least a year — colour, shape, phrase, format, character, sound.<\/li>\n<\/ol>", "text": "For your chosen business , using the M02 quotes: Run Dunford's five steps in order (20 min): alternatives (include \"do nothing\") → unique attributes (facts only) → value → who cares most → category. Write the honest version, not the flattering one. Fill the positioning statement template (5 min). One line. Rewrite until it fits. Build the message hierarchy (15 min): one core message, three pillars, concrete proof under each. If a pillar has no proof, find proof or cut the pillar. Delete test (5 min): take your homepage (or a competitor's) and strike every line a competitor could also claim. What survives is your real differentiation. If nothing survives, that is the finding. Name three distinctive assets you will repeat for at least a year — colour, shape, phrase, format, character, sound."}, {"h": "Recall (10 minutes)", "html": "<p>From memory:<\/p>\n<ol>\n<li>Dunford's five components, in order<\/li>\n<li>The positioning statement template<\/li>\n<li>Differentiation vs. distinctiveness, and what mental availability means<\/li>\n<li>The three layers of a message hierarchy<\/li>\n<li>Feature vs. benefit vs. outcome, with your own example<\/li>\n<li>Why \"we're the best\" fails the test<\/li>\n<\/ol>", "text": "From memory: Dunford's five components, in order The positioning statement template Differentiation vs. distinctiveness, and what mental availability means The three layers of a message hierarchy Feature vs. benefit vs. outcome, with your own example Why \"we're the best\" fails the test"}, {"h": "If you remember one thing", "html": "<p><strong>Positioning is a decision about context and exclusion, not a slogan.<\/strong> Decide who you are not for, state it the same way everywhere, and repeat it long past the point where you are sick of it.<\/p>", "text": "Positioning is a decision about context and exclusion, not a slogan. Decide who you are not for, state it the same way everywhere, and repeat it long past the point where you are sick of it."}], "suggest": [["Why can better copy not rescue weak positioning downstream?", "What do those three symptoms look like in a real small business?", "How do I tell whether my positioning or my ads are the problem?"], ["Why does the order of Dunford's five steps matter so much?", "What counts as a unique attribute versus a claim I cannot back?", "How do I pick the category buyers already search in?"], ["Why is comprehension the test rather than whether people like it?", "What exactly should I ask the five outsiders I test it on?", "What breaks if I update the website but not the deck and ads?"], ["What does it mean that vague positioning is now a retrieval failure?", "Write the 'X is a category for segment' line for a small business", "How do I get third parties describing me the same way I do?"], ["Why should I position against the status quo instead of a rival?", "What does positioning by committee sound like on a homepage?", "How do I know it is my own fatigue and not a real reason to change?"], ["What makes proof under a pillar strong enough to keep the pillar?", "Run the delete test on a sample homepage so I can see it work", "What if everything, or nothing, survives my delete test?"], ["How is distinctiveness different from differentiation?", "Take one feature and turn it into a benefit, then an outcome", "How do I build mental availability on a very small budget?"], ["Why is deciding who you are not for part of positioning?", "How do I state who I am not for without sounding dismissive?", "How long is 'past the point you are sick of it' in real months?"]], "assess": {"predict": "Before reading: what do you think is the difference between a company being different from its rivals and a company being recognisable? Guess in one sentence.", "quiz": [{"q": "Dunford's five components must be worked in order. Which failure does the module say most positioning work suffers from?", "options": ["Starting at competitive alternatives, which anchors everything to rivals rather than customers", "Starting at unique attributes, which produces feature lists", "Starting at market category, choosing one they like and reverse-engineering the rest", "Starting at who cares most, which narrows the segment too early"], "answer": 2, "why": "The module says most positioning work fails because people start at step 5, picking a category they like, then reverse-engineer everything else. Starting at alternatives is actually the correct first step, which makes that option a trap for anyone who remembers the list but not the order."}, {"q": "A B2B software firm with 40 customers copies a soft-drink brand's approach: one distinctive colour, one repeated phrase, no claims of substantive difference. What does the module say about this?", "options": ["Correct, since Sharp shows buyers do not perceive brands as very different in any category", "Incorrect, because distinctiveness only works when paired with a category design play", "Correct, because mental availability is the sole driver of growth", "Incorrect, because Sharp's evidence is strongest in large, low-involvement, repeat-purchase consumer categories, while B2B and considered purchases need real differentiation and a specific ICP"], "answer": 3, "why": "The module explicitly warns against over-applying Sharp, limiting the strongest evidence to large low-involvement repeat-purchase categories and calling for real differentiation in B2B, niches and expensive considered purchases. Option A is tempting because it quotes Sharp accurately, but drops the scope condition that makes the advice wrong here."}, {"q": "Which line survives the module's delete test?", "options": ["Cuts month-end close from a week to a day for firms running Xero across more than five entities, evidenced by three named clients", "The world-class platform for modern finance teams", "Seamless, next-generation reconciliation built for scale", "We are the best at what we do, and our customers agree"], "answer": 0, "why": "The delete test strikes every line a competitor could also claim, and only the specific outcome with a named segment and proof would be false in a rival's mouth. The other options are superiority claims without a comparison set, segment or proof, which the module classes as noise."}, {"q": "A startup's homepage claims speed, security and low price with equal weight. Bounce rate is fine but nobody in user tests can say what the product does. The message hierarchy diagnosis is:", "options": ["The pillars lack proof, so the claims read as noise", "There are three core messages instead of one, and if you have three you have none", "The category label is wrong for the segment being targeted", "The tagline is carrying feeling rather than stating the position"], "answer": 1, "why": "A hierarchy has one core message with three supporting pillars underneath it; three co-equal claims means nothing lands. Missing proof is the module's other favourite diagnosis and is genuinely common, but the symptom described is failure to recall what the product is, which points to competing core messages."}, {"q": "Which correctly orders feature, benefit and outcome as the module defines them?", "options": ["Feature: you close the month in a day. Benefit: automatic bank-feed reconciliation. Outcome: your books stay accurate.", "Feature: your books stay accurate. Benefit: you close the month in a day. Outcome: automatic bank-feed reconciliation.", "Feature: automatic bank-feed reconciliation. Benefit: your books stay accurate without manual entry. Outcome: you close the month in a day instead of a week.", "Feature: automatic bank-feed reconciliation. Benefit: you close the month in a day. Outcome: your books stay accurate."], "answer": 2, "why": "The module gives exactly this chain: the mechanism is the feature, the direct effect on the work is the benefit, and the change in the buyer's world is the outcome. The last option is the tempting near-miss because it starts correctly but swaps benefit and outcome, treating accuracy as the end state rather than the step that produces the faster close."}, {"q": "Why does the module say ambiguous positioning has become more costly in 2026?", "options": ["AI-generated homepage copy is penalised by search engines", "Answer engines assemble summaries from how you and others describe you, so a site that never plainly states X is a category for segment gives a model nothing unambiguous to lift", "Buyers now read more comparison articles than homepages, so homepages matter less", "Category design has become cheaper, so entry positions are less defensible"], "answer": 1, "why": "The module frames ambiguity as a retrieval failure, not only a comprehension failure, because models lift a plain category-and-segment statement from your site and third-party sources. The comparison-article option is tempting since the module does stress third-party corroboration, but its point is repetition across sources, not that homepages stopped mattering."}], "cards": [{"front": "List Dunford's five positioning components in order.", "back": "Competitive alternatives, unique attributes, value, who cares most, market category. The order is the method; starting at category and reverse-engineering is the classic failure."}, {"front": "Fill in the positioning statement template.", "back": "For best-fit segment who trigger, product is the category that key value, unlike primary alternative, because unique attribute. An internal alignment tool; if it does not fit one line, positioning is undecided."}, {"front": "Differentiation versus distinctiveness: which affects what?", "back": "Differentiation is being meaningfully different on something buyers value, affecting choice. Distinctiveness is being recognisable through colours, logos, phrases or formats, affecting whether you are noticed and correctly attributed."}, {"front": "What is mental availability, and what builds it?", "back": "Coming to mind in a buying situation. Distinctive assets repeated consistently build it; its partner is physical availability, being easy to buy. Sharp attributes growth to both."}, {"front": "Name the three layers of a message hierarchy and the one usually missing.", "back": "One core message, three supporting pillars, proof under each. Proof is almost always missing; a claim with a number and a named customer reads as fact rather than noise."}, {"front": "Why does We are the best fail as positioning?", "back": "It has no comparison set, segment or proof, and any competitor could claim it. Positioning must be falsifiable, which means it must exclude someone."}], "elaborate": ["Take your own business or one you know well, run the delete test on its homepage headline, and explain in two sentences what survived and why a competitor could not say it.", "Using the customer quotes or language you gathered in M02, write your one-line positioning statement, then say in two sentences which Dunford step was hardest and what that reveals about the business."], "transfer": {"scenario": "A four-year-old company sells a tool that reconciles supplier invoices for independent restaurants. The homepage says The next-generation operating system for hospitality. Sales reps each pitch it differently: one as accounting software, one as an inventory tool, one as a cost-control platform. Prospects who convert almost always mention they were drowning in paper invoices after opening a second site. Marketing wants to launch a new campaign every quarter because the team gets bored of the message.", "prompt": "Diagnose the positioning problem and set out what you would decide and in what order.", "model": "This is a positioning failure being treated as a copy problem. Three reps inventing three pitches, and a headline nobody can decode, are the textbook symptoms; no campaign fixes them downstream. I would run Dunford's steps in order rather than picking a category. Alternatives first, drawn from buyers: paper and a shoebox, a part-time bookkeeper, doing nothing. Then unique attributes as facts, then the value each produces, then who cares most, which the data already suggests is independents opening a second site, since that is the trigger converts keep naming. Category comes last, and it should be the one buyers search in and that an answer engine can lift, not an operating system for hospitality. Then one core message, three pillars, proof under each. Finally, kill the quarterly campaign churn: internal fatigue arrives long before customer awareness, so the same unambiguous line must run everywhere for far longer than feels comfortable."}}}, {"id": "M04", "num": 4, "part": "p1", "title": "Product, Price, Place: The Offer", "short": "Offer, price, place", "meta": "60 minutes (25 read · 25 exercise · 10 recall)", "minutes": 60, "sections": [{"h": "Why this matters", "html": "<p>Price is the only lever that drops straight to profit — no production cost, no media cost. Most businesses set it by copying a competitor or adding a markup to cost, the two worst methods available. Meanwhile the offer wrapped around the product, and the places it can be bought, move sales more than any campaign.<\/p>", "text": "Price is the only lever that drops straight to profit — no production cost, no media cost. Most businesses set it by copying a competitor or adding a markup to cost, the two worst methods available. Meanwhile the offer wrapped around the product, and the places it can be bought, move sales more than any campaign."}, {"h": "Core concepts", "html": "<h3>A product is not an offer<\/h3>\n<p>The product is what you make. The <strong>offer<\/strong> is everything weighed at the moment of decision: the product, <strong>price and payment terms<\/strong>, <strong>risk reversal<\/strong> (guarantee, free returns, pilot, easy cancellation), the <strong>bundle<\/strong>, <strong>onboarding and support<\/strong>, real urgency, and <strong>proof<\/strong>.<\/p>\n<p>Two businesses can sell an identical product at very different conversion rates because one has an offer and the other has a price list. If you cannot change the product you can nearly always change the offer — faster and cheaper than a new campaign. Most offer components are anxiety-reducers (M02), not new benefits.<\/p>\n<h3>Three ways to price, one of which is good<\/h3>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Problem<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cost-plus<\/strong> (cost × markup)<\/td>\n<td>Your costs are irrelevant to the buyer. Penalises efficiency, caps you at your own cost structure.<\/td>\n<\/tr>\n<tr>\n<td><strong>Competitor-based<\/strong> (match or undercut)<\/td>\n<td>Outsources strategy to a rival whose costs and segment you do not know. Races to the bottom.<\/td>\n<\/tr>\n<tr>\n<td><strong>Value-based<\/strong> (price against the buyer's alternative)<\/td>\n<td>Needs research. Almost always a higher, more defensible number.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Value-based pricing asks: <em>what does the buyer's next-best option cost in money, time and risk, and what is our improvement worth?<\/em> If your tool saves a bookkeeper six hours a month, the reference is six hours of a bookkeeper — not your server bill. Cost sets the floor and your contribution margin (M05); it should not set the price.<\/p>\n<h3>Price is a positioning signal<\/h3>\n<p>Buyers read price as quality information, especially when they cannot evaluate beforehand — services, health, B2B software, anything bought rarely. A price far below the category norm reads as \"something is wrong,\" not \"bargain.\"<\/p>\n<p>So <strong>cheap is a position, and a hard one.<\/strong> It requires a real structural cost advantage — scale, automation, a cheaper channel. Without one, low price is a smaller margin funding the same work, and it attracts the least loyal, highest-support customers.<\/p>\n<h3>Elasticity, intuitively<\/h3>\n<p>You rarely need to compute elasticity, only to know which side you are on. <strong>Inelastic:<\/strong> urgent problems, small share of budget, few substitutes, high switching cost, someone else paying. <strong>Elastic:<\/strong> easy comparison, many substitutes, discretionary, price-visible marketplaces. Small businesses under-price because they imagine an elastic market when their buyers are actually choosing on trust and availability. If nobody ever objects to your price, it is too low.<\/p>\n<h3>The arithmetic of discounting<\/h3>\n<p>A discount comes entirely out of margin. Sell at $100 with a $60 cost — gross margin $40.<\/p>\n<ul>\n<li><strong>20% off<\/strong> → price $80, margin $20. You need <strong>twice the volume<\/strong> for the same gross profit.<\/li>\n<li><strong>10% off<\/strong> → price $90, margin $30. You need <strong>33% more volume<\/strong>.<\/li>\n<\/ul>\n<p>Run this on your own numbers once and you will discount less. Discounts also train buyers to wait, and habitual sales permanently reset the reference price. If you must move volume, prefer bonuses and bundles — they cost you at <em>your<\/em> cost, not at retail, and leave the price intact.<\/p>\n<h3>Freemium, trials, tiers<\/h3>\n<p><strong>Free trial:<\/strong> best when value is obvious fast and the product is self-serve; time-limited usually beats feature-limited. <strong>Freemium:<\/strong> a permanent free tier is a distribution strategy, not a pricing one — it works only when free users generate referrals, network effects or data <em>and<\/em> serving them is nearly free. Otherwise you have bought a support obligation. <strong>Tiers:<\/strong> three is the usual sweet spot; tier on a value metric that grows with the customer (seats, volume, revenue) so revenue rises without a renegotiation.<\/p>\n<h3>Anchoring and decoys, done honestly<\/h3>\n<p>The first number seen frames every judgement after it, so showing a premium tier first makes the middle tier feel reasonable. A decoy is a deliberately weaker option that flatters the target one. Both are real effects, and legitimate <strong>only if every option is genuinely purchasable and honestly described<\/strong>. Fake \"was\" prices and permanent countdown timers are illegal in many jurisdictions and burn the trust you need for the second sale. The honest version: order options so the best-value one is easy to recognise.<\/p>\n<h3>Place: distribution<\/h3>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>Strength<\/th>\n<th>Cost<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Owned site or shop<\/td>\n<td>Full margin, own the customer data<\/td>\n<td>You generate all demand yourself<\/td>\n<\/tr>\n<tr>\n<td>Marketplaces<\/td>\n<td>Existing demand, built-in trust<\/td>\n<td>Fees, no relationship, platform risk<\/td>\n<\/tr>\n<tr>\n<td>Partners and affiliates<\/td>\n<td>Borrowed audience and credibility<\/td>\n<td>Margin share, less message control<\/td>\n<\/tr>\n<tr>\n<td>Retail / wholesale<\/td>\n<td>Reach and physical availability<\/td>\n<td>Deep discounts, slow payment, listing fees<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Being easy to buy beats being loudly advertised. A shelf at eye level, a listing where the category is searched, an integration inside software the buyer already uses — these convert demand promotion would otherwise have to create. That is Sharp's physical availability, and it is why fixing distribution before raising ad spend usually wins.<\/p>\n<p>The trade-off is control: someone else's channel means their rules and fees, and their right to change both. Marketplace-only businesses rent a customer base — build an owned channel in parallel from day one.<\/p>", "text": "A product is not an offer The product is what you make. The offer is everything weighed at the moment of decision: the product, price and payment terms , risk reversal (guarantee, free returns, pilot, easy cancellation), the bundle , onboarding and support , real urgency, and proof . Two businesses can sell an identical product at very different conversion rates because one has an offer and the other has a price list. If you cannot change the product you can nearly always change the offer — faster and cheaper than a new campaign. Most offer components are anxiety-reducers (M02), not new benefits. Three ways to price, one of which is good Method Problem Cost-plus (cost × markup) Your costs are irrelevant to the buyer. Penalises efficiency, caps you at your own cost structure. Competitor-based (match or undercut) Outsources strategy to a rival whose costs and segment you do not know. Races to the bottom. Value-based (price against the buyer's alternative) Needs research. Almost always a higher, more defensible number. Value-based pricing asks: what does the buyer's next-best option cost in money, time and risk, and what is our improvement worth? If your tool saves a bookkeeper six hours a month, the reference is six hours of a bookkeeper — not your server bill. Cost sets the floor and your contribution margin (M05); it should not set the price. Price is a positioning signal Buyers read price as quality information, especially when they cannot evaluate beforehand — services, health, B2B software, anything bought rarely. A price far below the category norm reads as \"something is wrong,\" not \"bargain.\" So cheap is a position, and a hard one. It requires a real structural cost advantage — scale, automation, a cheaper channel. Without one, low price is a smaller margin funding the same work, and it attracts the least loyal, highest-support customers. Elasticity, intuitively You rarely need to compute elasticity, only to know which side you are on. Inelastic: urgent problems, small share of budget, few substitutes, high switching cost, someone else paying. Elastic: easy comparison, many substitutes, discretionary, price-visible marketplaces. Small businesses under-price"}, {"h": "How it works in practice", "html": "<p>Price gets revisited far too rarely, usually only in a panic. Healthier: review annually and after any material change in cost, competitor set or value delivered. Test increases on new customers first, grandfather existing ones for a period, and announce with a reason and notice. Price rises lose fewer customers than founders fear, and the ones lost are the least profitable.<\/p>", "text": "Price gets revisited far too rarely, usually only in a panic. Healthier: review annually and after any material change in cost, competitor set or value delivered. Test increases on new customers first, grandfather existing ones for a period, and announce with a reason and notice. Price rises lose fewer customers than founders fear, and the ones lost are the least profitable."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Comparison is instant and conversational.<\/strong> AI assistants line up prices and alternatives side by side, raising elasticity in commodity categories and rewarding clear published pricing. Hiding price behind \"contact us\" increasingly means being left out of the comparison.<\/li>\n<li><strong>Rising ad costs make margin decisive.<\/strong> Only businesses whose contribution margin can fund a CAC (M05) survive paid acquisition. A price increase is often the fastest way to make a channel affordable.<\/li>\n<li><strong>Platform dependence is a live risk.<\/strong> Fee changes and algorithm shifts have killed otherwise healthy businesses. An owned email list is cheap insurance.<\/li>\n<\/ul>", "text": "Comparison is instant and conversational. AI assistants line up prices and alternatives side by side, raising elasticity in commodity categories and rewarding clear published pricing. Hiding price behind \"contact us\" increasingly means being left out of the comparison. Rising ad costs make margin decisive. Only businesses whose contribution margin can fund a CAC (M05) survive paid acquisition. A price increase is often the fastest way to make a channel affordable. Platform dependence is a live risk. Fee changes and algorithm shifts have killed otherwise healthy businesses. An owned email list is cheap insurance."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Pricing from cost.<\/strong> Your costs are your business, not the buyer's concern.<\/li>\n<li><strong>Competing on price with no cost advantage.<\/strong> A slow retreat, not a strategy.<\/li>\n<li><strong>Discounting instead of improving the offer.<\/strong> Guarantees and bundles cost less and do more.<\/li>\n<li><strong>Never raising prices<\/strong> while costs rise, then needing a painful 30% correction.<\/li>\n<li><strong>One price for everyone<\/strong> when two segments value you very differently.<\/li>\n<li><strong>Treating distribution as logistics.<\/strong> It is a marketing decision with the largest multiplier.<\/li>\n<\/ul>", "text": "Pricing from cost. Your costs are your business, not the buyer's concern. Competing on price with no cost advantage. A slow retreat, not a strategy. Discounting instead of improving the offer. Guarantees and bundles cost less and do more. Never raising prices while costs rise, then needing a painful 30% correction. One price for everyone when two segments value you very differently. Treating distribution as logistics. It is a marketing decision with the largest multiplier."}, {"h": "Exercise (25 minutes)", "html": "<p>For <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li><strong>Write the current offer in full<\/strong> (5 min) — product, price, terms, guarantee, bundle, onboarding, proof. Note what is missing.<\/li>\n<li><strong>Rewrite it<\/strong> (10 min), strengthening at least two components — ideally a risk reversal aimed at the biggest anxiety from M02.<\/li>\n<li><strong>Set a price with written rationale<\/strong> (5 min): buyer's next-best alternative and its cost, value delivered, your cost floor, the position the price signals. One paragraph.<\/li>\n<li><strong>Run the discount math<\/strong> (2 min) on your real margin: what volume does a 20% discount require?<\/li>\n<li><strong>List every place you can be bought<\/strong> (3 min), plus one you are not in. What would entry cost in margin?<\/li>\n<\/ol>", "text": "For your chosen business : Write the current offer in full (5 min) — product, price, terms, guarantee, bundle, onboarding, proof. Note what is missing. Rewrite it (10 min), strengthening at least two components — ideally a risk reversal aimed at the biggest anxiety from M02. Set a price with written rationale (5 min): buyer's next-best alternative and its cost, value delivered, your cost floor, the position the price signals. One paragraph. Run the discount math (2 min) on your real margin: what volume does a 20% discount require? List every place you can be bought (3 min), plus one you are not in. What would entry cost in margin?"}, {"h": "Recall (10 minutes)", "html": "<p>From memory:<\/p>\n<ol>\n<li>Six components of an offer beyond the product<\/li>\n<li>The three pricing methods and why two are bad<\/li>\n<li>What a 20% discount does at 40% gross margin<\/li>\n<li>Two signs a market is inelastic<\/li>\n<li>When freemium makes sense<\/li>\n<li>One reason distribution beats promotion<\/li>\n<\/ol>", "text": "From memory: Six components of an offer beyond the product The three pricing methods and why two are bad What a 20% discount does at 40% gross margin Two signs a market is inelastic When freemium makes sense One reason distribution beats promotion"}, {"h": "If you remember one thing", "html": "<p><strong>Fix the offer before you fix the ad, and price against the buyer's alternative rather than your own costs.<\/strong> Then make sure it is genuinely easy to buy.<\/p>", "text": "Fix the offer before you fix the ad, and price against the buyer's alternative rather than your own costs. Then make sure it is genuinely easy to buy."}], "suggest": [["Why does price drop straight to profit when other levers do not?", "How much profit does a 10% price rise add on a typical margin?", "If not cost-plus or copying a rival, what should I price against?"], ["Why are most offer components anxiety-reducers, not new benefits?", "Show the same product sold as a price list and then as an offer", "Which offer component should I add first with no extra budget?"], ["Why are the customers lost to a price rise the least profitable ones?", "What does a good price-increase announcement actually say?", "How long should I grandfather existing customers for?"], ["Why does hiding price behind 'contact us' now cost me visibility?", "Which businesses still get away with not publishing their prices?", "How do I cut platform dependence starting this month?"], ["Why is competing on price with no cost advantage a slow retreat?", "Give me a guarantee that beats a discount, with the math", "How do I run two prices for two segments without upsetting anyone?"], ["What belongs in the written rationale behind a price?", "Work the 20% discount volume math on a 40% margin for me", "How do I spot the one place I am not sold but should be?"], ["What are the three pricing methods, and why are two of them bad?", "What are two signs that my market is inelastic?", "When does freemium make sense for a business my size?"], ["What is the buyer's alternative when I have no direct competitor?", "Show me an offer fix that outperformed a new campaign", "What makes a business genuinely easy to buy from?"]], "assess": {"predict": "Before reading: if you had to raise profit without selling more units or cutting costs, what lever would you pull? Guess in one sentence.", "quiz": [{"q": "Two firms sell the identical product at the same price, but one converts far better. The module's explanation is that:", "options": ["One has an offer and the other has a price list, since the offer includes terms, risk reversal, bundle, onboarding, urgency and proof", "One has a stronger brand, which lowers acquisition cost", "One has a real structural cost advantage and can therefore price cheaply", "One is on more marketplaces, so it has greater physical availability"], "answer": 0, "why": "The module states plainly that two businesses can sell an identical product at very different conversion rates because one has an offer and the other has a price list. Distribution is a real lever but changes where you are bought rather than the conversion rate at an identical decision point."}, {"q": "A consultancy charges 40% less than every rival and finds its enquiries are low-quality and support-heavy. The module's reading is:", "options": ["Their elasticity assumption was right but their targeting was wrong", "Buyers read price as quality information, a price far below the norm reads as something is wrong, and cheap without a structural cost advantage attracts the least loyal, highest-support customers", "They should discount further to build volume and reach scale", "They should switch from value-based to competitor-based pricing"], "answer": 1, "why": "Price is a positioning signal, especially for services which buyers cannot evaluate beforehand, and cheap without a cost advantage is a smaller margin funding the same work while drawing the worst customers. Deeper discounting compounds the problem, since discounts come entirely out of margin and train buyers to wait."}, {"q": "A product sells at $100 with a $60 cost. Management proposes 20% off. What does the module say this requires?", "options": ["33% more volume, because margin falls from $40 to $30", "The same volume, since the discount is funded by the marketing budget", "Twice the volume, because margin falls from $40 to $20", "50% more volume, because price falls from $100 to $80"], "answer": 2, "why": "A discount comes entirely out of margin: at $80 the margin is $20, half of $40, so you need double the units for the same gross profit. The 33% answer is the module's other worked figure, but that is the 10% discount case where margin falls to $30."}, {"q": "Which situation best matches the module's description of an inelastic market?", "options": ["A price-visible marketplace listing many near-identical suppliers", "A discretionary consumer good with many substitutes and easy comparison", "An emergency plumbing call-out, a small share of the household budget, with few available substitutes", "A subscription with a low monthly fee and easy cancellation"], "answer": 2, "why": "Inelastic conditions are urgent problems, a small share of budget, few substitutes, high switching cost or someone else paying, and the call-out hits three of these. The cheap easy-cancel subscription is tempting because low price feels insensitive, but easy cancellation lowers switching cost, which pushes toward elastic."}, {"q": "When does the module say a permanent free tier makes sense?", "options": ["When the product is self-serve and its value is obvious within a short window", "When free users generate referrals, network effects or data and serving them is nearly free", "When you need to undercut a competitor who has no free tier", "When you have three paid tiers and need an entry point below the cheapest"], "answer": 1, "why": "Freemium is described as a distribution strategy, not a pricing one, working only when free users generate referrals, network effects or data and cost almost nothing to serve; otherwise you have bought a support obligation. Obvious fast value and self-serve is the condition for a time-limited free trial, which is the tempting confusion."}, {"q": "A brand sells only through a large marketplace, has healthy margins and no email list. What risk does the module flag, and what does it prescribe?", "options": ["Fee and algorithm risk, so raise prices to offset future fee increases", "Loss of message control, so invest in partner and affiliate channels instead", "Listing fees and slow payment, so move to retail and wholesale", "They rent a customer base and carry live platform risk, so build an owned channel in parallel from day one; an owned email list is cheap insurance"], "answer": 3, "why": "Marketplaces bring existing demand and trust but cost fees, the customer relationship and platform risk, so the module says marketplace-only businesses rent a customer base and must build an owned channel in parallel. Switching to another intermediated channel like retail or affiliates does not fix ownership, it just changes whose rules you live under."}], "cards": [{"front": "Name six offer components beyond the product itself.", "back": "Price and payment terms, risk reversal such as a guarantee or easy cancellation, the bundle, onboarding and support, real urgency, and proof. Most are anxiety-reducers rather than new benefits."}, {"front": "Why are cost-plus and competitor-based pricing both bad, in one line each?", "back": "Cost-plus: your costs are irrelevant to the buyer, it penalises efficiency and caps you at your own cost structure. Competitor-based: it outsources strategy to a rival whose costs and segment you do not know."}, {"front": "What question does value-based pricing actually ask?", "back": "What does the buyer's next-best option cost in money, time and risk, and what is our improvement worth? Cost sets the floor and contribution margin, never the price."}, {"front": "At a $100 price and $60 cost, what does a 20% discount cost you in volume terms?", "back": "Margin drops from $40 to $20, so you need twice the volume for the same gross profit. A 10% discount leaves $30 and needs 33% more volume."}, {"front": "Why prefer bonuses and bundles over discounts when moving volume?", "back": "They cost you at your cost, not at retail, and leave the price intact. Discounts train buyers to wait and habitual sales permanently reset the reference price."}, {"front": "Why does fixing distribution usually beat raising ad spend?", "back": "Being easy to buy beats being loudly advertised. Eye-level shelf space, a listing where the category is searched, or an integration inside software the buyer uses converts demand promotion would otherwise have to create."}], "elaborate": ["Run the discount arithmetic on your own real or estimated margin, then explain to a colleague in two sentences why a 20% off promotion is or is not affordable for you.", "Using the biggest anxiety you identified in M02, design one risk-reversal component for your offer and explain in two sentences why it should outperform a price cut of equivalent perceived value."], "transfer": {"scenario": "A studio sells a six-week online course at $400. Variable cost per student is $80. Sales stalled at about 25 students per cohort, so the founder ran a 25% off launch week, which filled the cohort to 40 but produced no better completion or referrals. She now wants to make the discount permanent and add a free forever tier so people can sample lesson one. There is no guarantee, no payment plan, and testimonials sit on a page nobody visits.", "prompt": "Evaluate her two proposals and recommend what to change instead, showing the arithmetic that supports your view.", "model": "Take the discount first. At $400 with $80 variable cost the margin is $320. At 25% off the price is $300 and the margin $220, so 40 discounted students yield $8,800 against 25 full-price students at $8,000. The uplift is marginal and carries a permanent cost, because habitual discounting resets the reference price and trains buyers to wait for launch week. Making it permanent is a price cut with no structural cost advantage, which invites the least committed students. The free tier is a distribution strategy, not a pricing one, and only pays if free users generate referrals, network effects or data at near-zero serving cost, which is not established here. The real gap is that she has a price list rather than an offer. Add risk reversal, a payment plan and visible proof, which reduce anxiety at her cost rather than at retail and leave the price intact."}}}, {"id": "M05", "num": 5, "part": "p1", "title": "Funnels, Journeys, and Unit Economics", "short": "Funnels & unit economics", "meta": "90 minutes (35 read · 45 exercise · 10 recall)", "minutes": 90, "sections": [{"h": "Why this matters", "html": "<p><strong>This is the most important module in Part 1.<\/strong> Everything else is judgement you build over years. This is arithmetic you can learn in ninety minutes, and it decides whether a business survives.<\/p>\n<p>Marketers who cannot do this arithmetic get fired, because they cannot answer the only question a CFO ever asks: <em>what did we get for the money, and can we afford more of it?<\/em><\/p>", "text": "This is the most important module in Part 1. Everything else is judgement you build over years. This is arithmetic you can learn in ninety minutes, and it decides whether a business survives. Marketers who cannot do this arithmetic get fired, because they cannot answer the only question a CFO ever asks: what did we get for the money, and can we afford more of it?"}, {"h": "Core concepts", "html": "<h3>AIDA and the modern lifecycle<\/h3>\n<p>AIDA — Attention, Interest, Desire, Action — dates from the 1890s and still describes the sequence of persuasion. The modern version adds what happens after the sale: <strong>Awareness → Consideration → Conversion → Retention → Advocacy.<\/strong> Retention and advocacy are where profit lives. Acquisition usually loses money on the first purchase; the business is made on the second and the tenth.<\/p>\n<h3>The funnel is an accounting fiction<\/h3>\n<p>Real journeys are not funnels. People enter in the middle, leave, return months later, ask a friend, read reviews, forget, see an ad, then search your brand name — at which point search ads take credit for a decision made elsewhere. Google's researchers call this loop of exploration and evaluation the <strong>messy middle<\/strong>.<\/p>\n<p>So why use a funnel? Because it is a <strong>measurement device<\/strong>, not a description of behaviour. It locates where people are lost and sizes the opportunity. Use it for arithmetic; never use it to claim you know the journey.<\/p>\n<h3>Conversion math, and where the leverage is<\/h3>\n<p>A funnel multiplies. Small changes at each step compound.<\/p>\n<p><strong>Worked example 1 — where to spend your effort<\/strong><\/p>\n<p>An e-commerce store, one month:<\/p>\n<table>\n<thead>\n<tr>\n<th>Step<\/th>\n<th>Rate<\/th>\n<th>Count<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Visitors<\/td>\n<td>—<\/td>\n<td>10,000<\/td>\n<\/tr>\n<tr>\n<td>Add to cart<\/td>\n<td>6%<\/td>\n<td>600<\/td>\n<\/tr>\n<tr>\n<td>Begin checkout<\/td>\n<td>50%<\/td>\n<td>300<\/td>\n<\/tr>\n<tr>\n<td>Complete purchase<\/td>\n<td>60%<\/td>\n<td>180<\/td>\n<\/tr>\n<tr>\n<td>Average order value<\/td>\n<td>—<\/td>\n<td>$80<\/td>\n<\/tr>\n<tr>\n<td><strong>Revenue<\/strong><\/td>\n<td><\/td>\n<td><strong>$14,400<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Two options:<\/p>\n<ul>\n<li><strong>Double traffic<\/strong> to 20,000 → revenue $28,800. Cost: double the ad spend, and the second batch of traffic is usually worse than the first, so realistically less than double.<\/li>\n<li><strong>Fix checkout completion from 60% to 75%<\/strong> — a plausible result of removing forced account creation. 225 purchases, $18,000. That is +25% for a one-off engineering change with no ongoing cost.<\/li>\n<\/ul>\n<p>Compound them: cart 6%→7% <em>and<\/em> checkout 60%→75% gives 262 purchases and $20,960 — a 46% lift, permanent, which also makes every future ad dollar 46% more efficient.<\/p>\n<p>The rule: <strong>percentage gains deep in the funnel are cheap and permanent; traffic gains are linear and rented.<\/strong> Fix the leakiest step first; the last step before payment is usually the most fixable.<\/p>\n<p>The counter-case: with 200 visitors a month, no conversion improvement will save you and you could not measure one anyway (M14). Then traffic genuinely is the constraint. Diagnose which world you are in first.<\/p>\n<h3>CAC, blended vs paid<\/h3>\n<p><strong>CAC<\/strong> = total acquisition cost ÷ new customers. Include media, agency fees, tools and the salaries of people doing acquisition — not just ad spend.<\/p>\n<p><strong>Paid CAC<\/strong> = paid spend ÷ customers attributed to paid. <strong>Blended CAC<\/strong> = all acquisition spend ÷ <em>all<\/em> new customers, organic and word of mouth included.<\/p>\n<p>Blended always looks better, because organic customers dilute it. It answers \"can this business afford to grow,\" but hides whether paid is working. Watch the gap: if blended stays flat while paid CAC rises, organic is carrying you and paid is quietly failing.<\/p>\n<h3>LTV, and why it is usually overstated<\/h3>\n<p>Lifetime value is the <strong>gross profit<\/strong> a customer generates, not the revenue. Three common inflations:<\/p>\n<ol>\n<li><strong>Revenue instead of contribution margin.<\/strong> A $100 customer at 30% margin is worth $30.<\/li>\n<li><strong>Optimistic lifetimes.<\/strong> \"Customers stay 5 years,\" from a company 18 months old, is a projection.<\/li>\n<li><strong>Ignoring time.<\/strong> Money in year four is worth less than money now, and you may not survive to collect it.<\/li>\n<\/ol>\n<p>Use a conservative window — 12 or 24 months of contribution margin — and call it LTV24. It is what a lender or investor will model anyway.<\/p>\n<h3>LTV:CAC and payback<\/h3>\n<p><strong>LTV:CAC of 3:1<\/strong> is the standard rule of thumb: below it you probably cannot fund acquisition plus overhead; well above it you are probably under-investing.<\/p>\n<p>It is a heuristic, not a law. It came from SaaS benchmarking, assumes predictable subscription retention, and says nothing about <em>when<\/em> the money arrives. A business with 5:1 LTV:CAC and a 30-month payback can go bankrupt while growing.<\/p>\n<p><strong>CAC payback period<\/strong> = CAC ÷ monthly contribution margin per customer. This is the number that matters when you cannot raise capital freely, because it says how long your cash is locked up. Under 12 months is comfortable; over 18 means every new customer worsens your cash position before improving it.<\/p>\n<p><strong>Worked example 2 — a subscription business<\/strong><\/p>\n<ul>\n<li>Price: $50/month. Gross margin 80% → <strong>$40 contribution per month<\/strong><\/li>\n<li>Average retained life: 20 months → <strong>LTV = $800<\/strong> (contribution, not revenue)<\/li>\n<li>CAC: $200<\/li>\n<\/ul>\n<p>LTV:CAC = <strong>4:1<\/strong>. Payback = $200 ÷ $40 = <strong>5 months<\/strong>. Healthy on both counts.<\/p>\n<p>Now the acquisition chain. Target CAC is $200, and:<\/p>\n<ul>\n<li>Lead → customer conversion: <strong>10%<\/strong> → max cost per lead = $200 × 0.10 = <strong>$20<\/strong><\/li>\n<li>Click → lead conversion: <strong>5%<\/strong> → max cost per click = $20 × 0.05 = <strong>$1.00<\/strong><\/li>\n<\/ul>\n<p>So $1.00 is your ceiling CPC at break-even on CAC. If the keyword costs $3.50, the channel is unaffordable <em>at your current conversion rates and price<\/em>, and you have exactly four ways out: raise the price, improve lead conversion, improve click-to-lead conversion, or find cheaper traffic. Three of the four are not \"bid less.\"<\/p>\n<p>Run this backwards for every channel before you launch it. Five minutes, and it prevents most wasted budget.<\/p>\n<h3>Contribution margin and cohorts<\/h3>\n<p><strong>Contribution margin<\/strong> = revenue − variable costs (COGS, payment fees, shipping, support). It is the money available to fund acquisition and overhead. Make marketing decisions in contribution margin, never revenue.<\/p>\n<p><strong>Cohort thinking<\/strong> groups customers by when they joined and tracks them over time. Aggregates lie: total revenue can rise while every cohort worsens, masked by growing volume. A cohort table is the only reliable way to see whether retention is improving and whether a channel's customers are as good as the ones you had.<\/p>", "text": "AIDA and the modern lifecycle AIDA — Attention, Interest, Desire, Action — dates from the 1890s and still describes the sequence of persuasion. The modern version adds what happens after the sale: Awareness → Consideration → Conversion → Retention → Advocacy. Retention and advocacy are where profit lives. Acquisition usually loses money on the first purchase; the business is made on the second and the tenth. The funnel is an accounting fiction Real journeys are not funnels. People enter in the middle, leave, return months later, ask a friend, read reviews, forget, see an ad, then search your brand name — at which point search ads take credit for a decision made elsewhere. Google's researchers call this loop of exploration and evaluation the messy middle . So why use a funnel? Because it is a measurement device , not a description of behaviour. It locates where people are lost and sizes the opportunity. Use it for arithmetic; never use it to claim you know the journey. Conversion math, and where the leverage is A funnel multiplies. Small changes at each step compound. Worked example 1 — where to spend your effort An e-commerce store, one month: Step Rate Count Visitors — 10,000 Add to cart 6% 600 Begin checkout 50% 300 Complete purchase 60% 180 Average order value — $80 Revenue $14,400 Two options: Double traffic to 20,000 → revenue $28,800. Cost: double the ad spend, and the second batch of traffic is usually worse than the first, so realistically less than double. Fix checkout completion from 60% to 75% — a plausible result of removing forced account creation. 225 purchases, $18,000. That is +25% for a one-off engineering change with no ongoing cost. Compound them: cart 6%→7% and checkout 60%→75% gives 262 purchases and $20,960 — a 46% lift, permanent, which also makes every future ad dollar 46% more efficient. The rule: percentage gains deep in the funnel are cheap and permanent; traffic gains are linear and rented. Fix the leakiest step first; the last step before payment is usually the most fixable. The counter-case: with 200 visitors a month, no conversion improvement will save you and you could not measure one anyway (M14). Then traffic genuinely is the co"}, {"h": "How it works in practice", "html": "<p>Build one spreadsheet: traffic, step conversion rates, AOV or ARPU, margin, CAC by channel, retention curve, payback. Update it monthly. Most \"should we do X?\" questions are answered by changing one cell. When a channel underperforms, diagnose in order — traffic volume, step conversion, order value, margin — and check the model before the creative.<\/p>", "text": "Build one spreadsheet: traffic, step conversion rates, AOV or ARPU, margin, CAC by channel, retention curve, payback. Update it monthly. Most \"should we do X?\" questions are answered by changing one cell. When a channel underperforms, diagnose in order — traffic volume, step conversion, order value, margin — and check the model before the creative."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Attribution is much weaker than it was.<\/strong> Privacy changes, cookie loss and platform black boxes make channel-level CAC an estimate. That raises the value of blended CAC, media-mix modelling and holdout tests (M15) over dashboard attribution (M13).<\/li>\n<li><strong>Platform-reported conversions are inflated.<\/strong> Ad platforms count every conversion they had a plausible claim to, so summing platform reports usually exceeds actual sales. Reconcile against your own order data.<\/li>\n<li><strong>Paid acquisition costs keep rising<\/strong> faster than most price increases, widening the gap between businesses with retention loops (M17) and those renting demand.<\/li>\n<\/ul>", "text": "Attribution is much weaker than it was. Privacy changes, cookie loss and platform black boxes make channel-level CAC an estimate. That raises the value of blended CAC, media-mix modelling and holdout tests (M15) over dashboard attribution (M13). Platform-reported conversions are inflated. Ad platforms count every conversion they had a plausible claim to, so summing platform reports usually exceeds actual sales. Reconcile against your own order data. Paid acquisition costs keep rising faster than most price increases, widening the gap between businesses with retention loops (M17) and those renting demand."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Using revenue as LTV.<\/strong> The most common error, and it inflates everything downstream.<\/li>\n<li><strong>Chasing traffic when the constraint is conversion<\/strong> — or optimising conversion on 200 visitors.<\/li>\n<li><strong>Ignoring payback<\/strong> because LTV:CAC looks good.<\/li>\n<li><strong>Excluding salaries and tools from CAC<\/strong>, then wondering why the P&amp;L disagrees with the dashboard.<\/li>\n<li><strong>Averaging across segments.<\/strong> One profitable cohort can hide three unprofitable ones.<\/li>\n<\/ul>", "text": "Using revenue as LTV. The most common error, and it inflates everything downstream. Chasing traffic when the constraint is conversion — or optimising conversion on 200 visitors. Ignoring payback because LTV:CAC looks good. Excluding salaries and tools from CAC , then wondering why the P&amp;L disagrees with the dashboard. Averaging across segments. One profitable cohort can hide three unprofitable ones."}, {"h": "Exercise (45 minutes)", "html": "<p>For <strong>your chosen business<\/strong> — real numbers if you have them, honest estimates labelled as estimates if not:<\/p>\n<ol>\n<li><strong>Build the funnel<\/strong> (15 min): traffic → key intermediate step → conversion → repeat purchase, with a rate on every arrow.<\/li>\n<li><strong>Contribution margin per customer<\/strong> (5 min): price minus every variable cost.<\/li>\n<li><strong>LTV24<\/strong> (5 min): contribution per month or per order × a conservative 24-month retention assumption.<\/li>\n<li><strong>Max affordable CPA<\/strong> (10 min), backwards as in example 2: target CAC → max cost per lead → max cost per click. Compare with real CPCs in your category. Is any paid channel affordable today?<\/li>\n<li><strong>CAC payback<\/strong> (5 min). Over 18 months? Note which of the four levers you would pull.<\/li>\n<li><strong>Find the leverage<\/strong> (5 min): which single step, improved 20% relative, produces the biggest revenue change?<\/li>\n<\/ol>", "text": "For your chosen business — real numbers if you have them, honest estimates labelled as estimates if not: Build the funnel (15 min): traffic → key intermediate step → conversion → repeat purchase, with a rate on every arrow. Contribution margin per customer (5 min): price minus every variable cost. LTV24 (5 min): contribution per month or per order × a conservative 24-month retention assumption. Max affordable CPA (10 min), backwards as in example 2: target CAC → max cost per lead → max cost per click. Compare with real CPCs in your category. Is any paid channel affordable today? CAC payback (5 min). Over 18 months? Note which of the four levers you would pull. Find the leverage (5 min): which single step, improved 20% relative, produces the biggest revenue change?"}, {"h": "Recall (10 minutes)", "html": "<p>From memory:<\/p>\n<ol>\n<li>The five lifecycle stages<\/li>\n<li>Why the funnel is a fiction but still useful<\/li>\n<li>CAC, blended vs paid, and why blended flatters<\/li>\n<li>Two ways LTV gets overstated<\/li>\n<li>Why payback period can matter more than LTV:CAC<\/li>\n<li>The chain from target CAC to maximum cost per click<\/li>\n<\/ol>", "text": "From memory: The five lifecycle stages Why the funnel is a fiction but still useful CAC, blended vs paid, and why blended flatters Two ways LTV gets overstated Why payback period can matter more than LTV:CAC The chain from target CAC to maximum cost per click"}, {"h": "If you remember one thing", "html": "<p><strong>Work backwards from what a customer is worth in contribution margin to what you can afford to pay for a click.<\/strong> If the answer is below the market price of traffic, no amount of creative or optimisation fixes it — change the price, the conversion rate, or the channel.<\/p>", "text": "Work backwards from what a customer is worth in contribution margin to what you can afford to pay for a click. If the answer is below the market price of traffic, no amount of creative or optimisation fixes it — change the price, the conversion rate, or the channel."}], "suggest": [["Why is arithmetic, not judgement, what decides whether a business lives?", "What does a strong answer to 'what did we get for the money' sound like?", "Which numbers should I gather before I start this module?"], ["If the funnel is an accounting fiction, why keep using it at all?", "Show with numbers why the second and tenth purchase make the business", "How do I map the messy real journey my own customers take?"], ["Why diagnose in that order: traffic, conversion, order value, margin?", "What columns should the first version of this spreadsheet have?", "Which 'should we do X?' question could one cell in my model answer?"], ["Why do platform-reported conversions add up to more than my sales?", "How do I reconcile ad platform numbers against my own order data?", "What is a holdout test, and can I run one at my small scale?"], ["Why does using revenue as LTV inflate everything downstream?", "Show LTV:CAC looking healthy while the payback period is dangerous", "How should I treat my own unpaid time when I calculate CAC?"], ["Why LTV24 and a conservative retention figure instead of a lifetime?", "Walk the chain from target CAC back to a maximum cost per click", "What do I do if no paid channel is affordable for me today?"], ["Why does blended CAC flatter my results compared with paid CAC?", "Name the two ways LTV most often gets overstated", "When should I judge a channel on payback instead of LTV:CAC?"], ["Why can better creative not fix a max CPC below market rates?", "Run the backwards math for a business selling a 50 dollar product", "Of price, conversion and channel, which is fastest for me to change?"]], "assess": {"predict": "Before reading: if you knew a customer was worth $600 to you, how would you work out the most you could afford to pay for one click on an ad? Sketch your guess in one sentence.", "quiz": [{"q": "A store gets 10,000 visitors, 6% add to cart, 50% begin checkout, 60% complete, at $80 average order value. Which action produces the larger revenue gain, and why?", "options": ["Doubling traffic to 20,000, because a linear gain is more reliable than a conversion gain", "Raising checkout completion from 60% to 75%, worth 45 extra purchases against the 180 baseline, and it also makes every future ad dollar more efficient", "Raising add-to-cart from 6% to 7%, because the top of the funnel multiplies through every later step", "Raising average order value from $80 to $100, because it needs no engineering work"], "answer": 1, "why": "The worked example gives 180 purchases and $14,400 at baseline; lifting checkout completion to 75% gives 225 purchases and $18,000, a 25% gain from a one-off change with no ongoing cost, and the module notes it makes future ad spend more efficient. Doubling traffic yields more absolute revenue but costs double the ad spend, and the second batch of traffic is usually worse, so it is rented rather than permanent."}, {"q": "A subscription charges $50 a month at 80% gross margin, retains customers 20 months, and has a CAC of $200. Which reading is correct?", "options": ["LTV is $1,000, LTV to CAC is 5 to 1, payback is 4 months", "LTV is $800, LTV to CAC is 4 to 1, payback is 5 months", "LTV is $800, LTV to CAC is 4 to 1, payback is 20 months", "LTV is $1,000, LTV to CAC is 4 to 1, payback is 5 months"], "answer": 1, "why": "Contribution is $40 a month, so LTV over 20 months is $800 in contribution, giving 4 to 1 against a $200 CAC, and payback is $200 divided by $40, which is 5 months. The $1,000 answers use revenue rather than contribution margin, which the module calls the most common error in the discipline."}, {"q": "Target CAC is $200, lead-to-customer conversion is 10%, and click-to-lead conversion is 5%. The maximum affordable cost per click is:", "options": ["$10.00", "$4.00", "$1.00", "$0.10"], "answer": 2, "why": "Max cost per lead is $200 times 10%, which is $20, and max cost per click is $20 times 5%, which is $1.00. The $10 answer comes from applying only one conversion step, which is the usual mistake when people stop the chain one link early."}, {"q": "A founder reports blended CAC flat at $90 for a year while paid CAC has climbed from $110 to $260. What is happening?", "options": ["Attribution is undercounting paid conversions and the paid figure should be ignored", "Organic and word-of-mouth customers are diluting the blended figure and carrying the business while paid quietly fails", "The business is healthy, because blended CAC is the figure that determines whether growth is affordable", "Contribution margin must have improved, offsetting the paid increase"], "answer": 1, "why": "The module says blended always looks better because organic customers dilute it, and tells you to watch exactly this gap: flat blended with rising paid CAC means organic is carrying you. Blended does answer whether the business can afford to grow, but that does not make a widening gap benign, it hides which engine is failing."}, {"q": "Which business is in the more dangerous cash position, per the module?", "options": ["LTV to CAC of 5 to 1 with a 30-month payback period", "LTV to CAC of 3 to 1 with an 8-month payback period", "LTV to CAC of 3 to 1 with a 12-month payback period", "LTV to CAC of 4 to 1 with a 6-month payback period"], "answer": 0, "why": "The module says outright that a business with 5 to 1 LTV to CAC and a 30-month payback can go bankrupt while growing, because payback says how long cash is locked up and over 18 months means every new customer worsens cash first. The 3 to 1 options look weaker on the headline ratio, but both sit inside the comfortable payback window."}, {"q": "Total revenue is rising month on month, yet the head of growth insists retention is deteriorating. Which analysis would settle it?", "options": ["Comparing blended CAC across the same months", "Summing platform-reported conversions across ad accounts", "Recalculating LTV using a 24-month window instead of 12", "A cohort table grouping customers by join month and tracking each over time"], "answer": 3, "why": "The module warns that aggregates lie: total revenue can rise while every cohort worsens, masked by growing volume, and a cohort table is the only reliable way to see it. Extending the LTV window changes the assumption rather than testing it, and would make a deteriorating base look better, not clearer."}], "cards": [{"front": "Name the five modern lifecycle stages and say where profit lives.", "back": "Awareness, consideration, conversion, retention, advocacy. Profit lives in retention and advocacy; acquisition usually loses money on the first purchase and the business is made on the second and the tenth."}, {"front": "Why is the funnel a fiction, and why keep using it?", "back": "Real journeys loop through Google's messy middle, entering mid-way and returning months later. Keep it as a measurement device: it locates where people are lost and sizes the opportunity."}, {"front": "Why does blended CAC flatter a business?", "back": "It divides all acquisition spend by all new customers, so organic and word-of-mouth customers dilute it. It answers whether the business can afford growth but hides whether paid is working."}, {"front": "Name three ways LTV gets overstated.", "back": "Using revenue instead of contribution margin, assuming optimistic lifetimes a young company cannot evidence, and ignoring time value. Use a conservative 12 or 24-month contribution window."}, {"front": "Give the chain from target CAC to maximum cost per click.", "back": "Max cost per lead equals target CAC times lead-to-customer rate. Max cost per click equals max cost per lead times click-to-lead rate. Run it backwards before launching any channel."}, {"front": "If your ceiling CPC is below the market price of traffic, what are your four options?", "back": "Raise the price, improve lead conversion, improve click-to-lead conversion, or find cheaper traffic. Three of the four are not bidding less; no creative fixes broken arithmetic."}], "elaborate": ["Work out the contribution margin per customer for your chosen business and explain to a friend in two sentences why marketing decisions must be made in that number rather than revenue.", "Connect this to M04: run your max affordable cost per click, then explain in three sentences whether a price increase or a conversion-rate fix would make your best channel affordable faster."], "transfer": {"scenario": "A B2B tool charges $200 a month with a 75% gross margin and average retained life of 18 months. CAC is $1,800. Trials convert to paid at 8%, and 4% of clicks become trials. The team has been running search ads at $6 a click and wants to double the budget because LTV to CAC looks acceptable. The company has nine months of cash and cannot raise more.", "prompt": "Work the arithmetic, judge whether doubling the budget is defensible, and name the levers you would pull.", "model": "Contribution is $150 a month, so LTV over 18 months is $2,700 and LTV to CAC is 1.5 to 1, well under the 3 to 1 rule of thumb. Payback is $1,800 divided by $150, which is 12 months, against nine months of cash. So every new customer worsens the cash position for a full year and the company runs out before payback lands. Doubling spend accelerates the failure rather than growth. The channel arithmetic confirms it: at a $1,800 target CAC, max cost per trial is $1,800 times 8%, which is $144, and max cost per click is $144 times 4%, which is $5.76. Traffic costs $6, so the channel is already unaffordable at break-even, before overhead. Bidding less is not one of the four ways out. Raise the price, lift trial-to-paid conversion, lift click-to-trial conversion, or find cheaper traffic. Given the cash clock, price and trial conversion move fastest."}}}, {"id": "M06", "num": 6, "part": "p1", "title": "Writing a Marketing Strategy", "short": "Marketing strategy", "meta": "90 minutes (35 read · 45 exercise · 10 recall)", "minutes": 90, "sections": [{"h": "Why this matters", "html": "<p>Almost everything called a marketing strategy is a list of tactics with a budget attached. It cannot be argued with, because it makes no claim about why those tactics will work. This module gives you the structure that makes a plan defensible — and the artifact you show an employer or a client to prove you can think, not just execute.<\/p>", "text": "Almost everything called a marketing strategy is a list of tactics with a budget attached. It cannot be argued with, because it makes no claim about why those tactics will work. This module gives you the structure that makes a plan defensible — and the artifact you show an employer or a client to prove you can think, not just execute."}, {"h": "Core concepts", "html": "<h3>Rumelt's kernel: what a strategy actually is<\/h3>\n<p>Richard Rumelt's <em>Good Strategy / Bad Strategy<\/em> defines a strategy as three parts:<\/p>\n<ol>\n<li><strong>Diagnosis<\/strong> — what is actually going on. The critical obstacle, named. Not \"we need more leads\" but \"we generate enough leads, and 70% of them are outside our ICP because our only channel rewards volume.\"<\/li>\n<li><strong>Guiding policy<\/strong> — the approach chosen to deal with that obstacle, which necessarily rules out other approaches. \"Move spend from broad paid social to intent-based search and partnerships in one vertical.\"<\/li>\n<li><strong>Coherent actions<\/strong> — a small set of steps that support each other rather than pull in different directions.<\/li>\n<\/ol>\n<p>Bad strategy has recognisable symptoms: fluff (impressive words with no content), failure to face the problem, mistaking goals for strategy (\"grow revenue 40%\" is a goal, not a plan), and a scatter of unrelated objectives that quietly compete for the same people and money.<\/p>\n<p>The test: <strong>does your strategy say what you will not do?<\/strong> If not, it is a wish list.<\/p>\n<h3>Objectives, goals, KPIs<\/h3>\n<p>Sloppy vocabulary here causes real confusion in meetings.<\/p>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>What it is<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Objective<\/td>\n<td>The qualitative outcome you want<\/td>\n<td>Become the default choice for independent physio clinics<\/td>\n<\/tr>\n<tr>\n<td>Goal<\/td>\n<td>The measurable version, with a number and a date<\/td>\n<td>120 new clinic customers by 31 December<\/td>\n<\/tr>\n<tr>\n<td>KPI<\/td>\n<td>The ongoing metric you steer by<\/td>\n<td>CAC payback, qualified leads/week<\/td>\n<\/tr>\n<tr>\n<td>Metric<\/td>\n<td>Anything you can count<\/td>\n<td>Impressions, sessions, followers<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Most KPIs are metrics with ambition. A real KPI changes a decision when it moves; impressions almost never do. Pick three at most, including one <strong>leading<\/strong> indicator you can influence this month (qualified leads, trial starts) and one <strong>lagging<\/strong> one that proves it worked (revenue, retention).<\/p>\n<h3>Channel focus beats channel spread<\/h3>\n<p>The commonest failure in small-budget marketing is doing eight channels badly. Every channel carries a fixed learning cost: time to understand it, creative to build, a minimum spend before the data means anything. Split a small budget eight ways and you pay eight learning costs and clear no thresholds.<\/p>\n<p>Pick <strong>one or two channels<\/strong> and go deep until they genuinely work, then add a third. Choose on where your buyers already are (M02), whether the channel captures or creates demand (M01), and whether your unit economics can afford it (M05).<\/p>\n<p>The exception is dependence risk: a business drawing 90% of revenue from one channel is one algorithm change from a crisis. Once a channel works, build a second deliberately — not by scattering.<\/p>\n<h3>Budget heuristics: 70/20/10 and 60/40<\/h3>\n<p><strong>70/20/10<\/strong>: 70% to what is proven, 20% to promising things being scaled, 10% to genuine experiments. It blocks two failure modes at once — over-investing in unproven ideas, and never testing anything until the proven channel decays. On a small budget the 10% may be time rather than money.<\/p>\n<p><strong>60/40<\/strong> comes from Les Binet and Peter Field's work on the IPA effectiveness databank: roughly 60% of budget to long-term brand building and 40% to short-term activation maximises effectiveness over time. Brand builds slowly and lifts everything; activation converts demand that already exists without creating more.<\/p>\n<p>Caveats, because this gets quoted as gospel:<\/p>\n<ul>\n<li>It is an <em>average across many campaigns<\/em>. B2B and considered purchases sit nearer 50/50 in Binet and Field's later work.<\/li>\n<li>It assumes enough budget for brand work to reach anyone. Below a certain scale, splitting achieves neither.<\/li>\n<li>Early-stage businesses need a working acquisition loop first; brand-heavy spend before product-market fit buys awareness for something people do not yet want.<\/li>\n<\/ul>\n<p>Use it as a corrective against the pull toward 100% activation, which is what happens when only measurable things get funded.<\/p>\n<h3>Seasonality and planning cycles<\/h3>\n<p>Map demand across the year before allocating. Most categories have a shape: tax season, back to school, January fitness, Q4 retail, B2B budgets closing at year-end. Two rules follow. <strong>Advertise into the season, not during it<\/strong> — awareness needs lead time, and launching in the peak week means highest costs and finished consideration. And <strong>never diagnose a channel on a seasonal trough<\/strong>; compare year on year.<\/p>\n<p>Plan annually for objectives and budget, quarterly for campaigns and experiments, and leave 10–20% unallocated for opportunities and mistakes.<\/p>\n<h3>How to say no<\/h3>\n<p>Most requests arrive with sincerity and no numbers. Three useful responses:<\/p>\n<ul>\n<li><strong>\"What would we stop to do this?\"<\/strong> Makes the trade-off visible instead of extending an infinite list.<\/li>\n<li><strong>\"Which objective does this serve, and what would we see if it worked?\"<\/strong> Filters out activity that exists to look busy.<\/li>\n<li><strong>\"Can we test it inside the 10%?\"<\/strong> Converts an argument into an experiment with a budget cap.<\/li>\n<\/ul>\n<p>Write down what you declined and why. That list is your strategy's evidence, and it stops you re-litigating the same argument quarterly.<\/p>\n<h3>Presenting it to a boss or client<\/h3>\n<p>Lead with the diagnosis, not the tactics:<\/p>\n<ol>\n<li>What is happening and why (diagnosis, evidence from M02 and M05)<\/li>\n<li>The one thing we are betting on (guiding policy)<\/li>\n<li>What we will do — and what we are deliberately not doing<\/li>\n<li>What it costs and what we expect back, arithmetic shown<\/li>\n<li>How we will know in 90 days, and what would make us stop<\/li>\n<\/ol>\n<p>Point 5 buys more credibility than any projection: naming a kill condition in advance signals you are not asking for open-ended faith.<\/p>", "text": "Rumelt's kernel: what a strategy actually is Richard Rumelt's Good Strategy / Bad Strategy defines a strategy as three parts: Diagnosis — what is actually going on. The critical obstacle, named. Not \"we need more leads\" but \"we generate enough leads, and 70% of them are outside our ICP because our only channel rewards volume.\" Guiding policy — the approach chosen to deal with that obstacle, which necessarily rules out other approaches. \"Move spend from broad paid social to intent-based search and partnerships in one vertical.\" Coherent actions — a small set of steps that support each other rather than pull in different directions. Bad strategy has recognisable symptoms: fluff (impressive words with no content), failure to face the problem, mistaking goals for strategy (\"grow revenue 40%\" is a goal, not a plan), and a scatter of unrelated objectives that quietly compete for the same people and money. The test: does your strategy say what you will not do? If not, it is a wish list. Objectives, goals, KPIs Sloppy vocabulary here causes real confusion in meetings. Term What it is Example Objective The qualitative outcome you want Become the default choice for independent physio clinics Goal The measurable version, with a number and a date 120 new clinic customers by 31 December KPI The ongoing metric you steer by CAC payback, qualified leads/week Metric Anything you can count Impressions, sessions, followers Most KPIs are metrics with ambition. A real KPI changes a decision when it moves; impressions almost never do. Pick three at most, including one leading indicator you can influence this month (qualified leads, trial starts) and one lagging one that proves it worked (revenue, retention). Channel focus beats channel spread The commonest failure in small-budget marketing is doing eight channels badly. Every channel carries a fixed learning cost: time to understand it, creative to build, a minimum spend before the data means anything. Split a small budget eight ways and you pay eight learning costs and clear no thres
