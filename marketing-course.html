holds. Pick one or two channels and go deep until they genuinely work, then add a third. Choose on where your buyers already are (M02), whether the chan"}, {"h": "How it works in practice", "html": "<p>A real strategy document is one to three pages. Longer does not get read, and length correlates with vagueness rather than rigour. The annual version takes a week of thinking and an afternoon of writing; the quarterly refresh takes an hour. The time goes into the arithmetic and the arguments about what to drop.<\/p>", "text": "A real strategy document is one to three pages. Longer does not get read, and length correlates with vagueness rather than rigour. The annual version takes a week of thinking and an afternoon of writing; the quarterly refresh takes an hour. The time goes into the arithmetic and the arguments about what to drop."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Tactics expire faster than ever; the kernel does not.<\/strong> Channel-specific plans go stale within a year — an argument for a diagnosis-led plan whose actions can be swapped without rewriting the logic.<\/li>\n<li><strong>AI removes the excuse for a thin diagnosis.<\/strong> Synthesising reviews, transcripts and competitor messaging is cheap now, so a plan opening with generic market claims looks lazier than it did three years ago.<\/li>\n<li><strong>Attribution weakness changes planning.<\/strong> With channel-level measurement degraded (M13, M15), good plans commit to a budget split and a holdout test rather than promising per-channel ROI.<\/li>\n<\/ul>", "text": "Tactics expire faster than ever; the kernel does not. Channel-specific plans go stale within a year — an argument for a diagnosis-led plan whose actions can be swapped without rewriting the logic. AI removes the excuse for a thin diagnosis. Synthesising reviews, transcripts and competitor messaging is cheap now, so a plan opening with generic market claims looks lazier than it did three years ago. Attribution weakness changes planning. With channel-level measurement degraded (M13, M15), good plans commit to a budget split and a holdout test rather than promising per-channel ROI."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>A tactics list with a budget<\/strong> and no diagnosis.<\/li>\n<li><strong>Goals presented as strategy.<\/strong> \"Grow 40%\" tells nobody what to do on Monday.<\/li>\n<li><strong>Too many objectives.<\/strong> Three or more priorities means none.<\/li>\n<li><strong>Eight channels, no depth.<\/strong><\/li>\n<li><strong>All activation, no brand<\/strong> — profitable for two quarters, then acquisition costs climb and nobody knows why.<\/li>\n<li><strong>No kill criteria<\/strong>, so failing initiatives run until someone loses patience.<\/li>\n<\/ul>", "text": "A tactics list with a budget and no diagnosis. Goals presented as strategy. \"Grow 40%\" tells nobody what to do on Monday. Too many objectives. Three or more priorities means none. Eight channels, no depth. All activation, no brand — profitable for two quarters, then acquisition costs climb and nobody knows why. No kill criteria , so failing initiatives run until someone loses patience."}, {"h": "Exercise (45 minutes)", "html": "<p>Write the one-page strategy for <strong>your chosen business<\/strong> using <code>templates/marketing-plan-1pager.md<\/code>, pulling from M02–M05.<\/p>\n<ol>\n<li><strong>Diagnosis<\/strong> (10 min). One paragraph naming the single critical obstacle, with evidence. Ban \"increase,\" \"improve\" and \"grow\" here — they describe outcomes, not problems.<\/li>\n<li><strong>Guiding policy<\/strong> (5 min). One or two sentences, stated so that it excludes something.<\/li>\n<li><strong>Coherent actions<\/strong> (10 min). Three to five that support each other. Owner and date on each.<\/li>\n<li><strong>Objectives, goals, KPIs<\/strong> (5 min). One objective, two goals with numbers and dates, three KPIs including one leading and one lagging.<\/li>\n<li><strong>Budget<\/strong> (5 min). Split by channel and by 70/20/10. Check every channel against your max affordable CPA from M05.<\/li>\n<li><strong>Not doing<\/strong> (5 min). Five things you are declining, one line of reasoning each.<\/li>\n<li><strong>Kill criteria<\/strong> (5 min). Per action: what should be visible by day 90, and what result would stop it?<\/li>\n<\/ol>", "text": "Write the one-page strategy for your chosen business using templates/marketing-plan-1pager.md , pulling from M02–M05. Diagnosis (10 min). One paragraph naming the single critical obstacle, with evidence. Ban \"increase,\" \"improve\" and \"grow\" here — they describe outcomes, not problems. Guiding policy (5 min). One or two sentences, stated so that it excludes something. Coherent actions (10 min). Three to five that support each other. Owner and date on each. Objectives, goals, KPIs (5 min). One objective, two goals with numbers and dates, three KPIs including one leading and one lagging. Budget (5 min). Split by channel and by 70/20/10. Check every channel against your max affordable CPA from M05. Not doing (5 min). Five things you are declining, one line of reasoning each. Kill criteria (5 min). Per action: what should be visible by day 90, and what result would stop it?"}, {"h": "Recall (10 minutes)", "html": "<p>From memory:<\/p>\n<ol>\n<li>Rumelt's three parts of a strategy<\/li>\n<li>Three symptoms of bad strategy<\/li>\n<li>Objective vs goal vs KPI<\/li>\n<li>Why channel focus beats channel spread on a small budget<\/li>\n<li>70/20/10 and 60/40, and one caveat on each<\/li>\n<li>Two questions that let you say no well<\/li>\n<\/ol>", "text": "From memory: Rumelt's three parts of a strategy Three symptoms of bad strategy Objective vs goal vs KPI Why channel focus beats channel spread on a small budget 70/20/10 and 60/40, and one caveat on each Two questions that let you say no well"}, {"h": "If you remember one thing", "html": "<p><strong>A strategy is a diagnosis, a guiding policy, and coherent actions — and it must say what you will not do.<\/strong> A list of tactics with a budget is not a strategy, however confident the deck looks.<\/p>", "text": "A strategy is a diagnosis, a guiding policy, and coherent actions — and it must say what you will not do. A list of tactics with a budget is not a strategy, however confident the deck looks."}], "suggest": [["What makes a plan arguable rather than just a list of things to do?", "Put a tactics list with a budget next to a real strategy for me", "How do I use this one-pager as a portfolio piece for employers?"], ["How is a guiding policy different from a goal or an objective?", "Write a Rumelt-style diagnosis for a small business", "How do I pick one critical obstacle when several look equally bad?"], ["Why does length correlate with vagueness rather than rigour here?", "What goes into the arithmetic part of that week of thinking?", "In the quarterly refresh, what should change and what should not?"], ["Why commit to a budget split and a holdout instead of channel ROI?", "What does a diagnosis built from reviews and transcripts contain?", "How do I swap tactics without rewriting the logic of the plan?"], ["Why is all activation and no brand profitable for only two quarters?", "What do written kill criteria look like for one initiative?", "How do I cut six priorities down to two without losing something real?"], ["Why ban the words increase, improve and grow from the diagnosis?", "Show a guiding policy phrased so that it clearly excludes something", "How do I choose one leading and one lagging KPI for my business?"], ["What is the real difference between an objective, a goal and a KPI?", "What do 70/20/10 and 60/40 mean, and where does each break down?", "Which two questions help me say no to a tactic someone is pushing?"], ["Why must a strategy state what you will not do?", "Give me a one-line example of each of the three kernel parts", "How do I defend my plan when someone asks why not this other channel?"]], "assess": {"predict": "Before reading: what is the difference between a marketing strategy and a list of things you plan to do? Write your best one-sentence guess.", "quiz": [{"q": "Which of these is a diagnosis in Rumelt's sense rather than a goal or a guiding policy?", "options": ["Move spend from broad paid social into intent-based search and partnerships in one vertical", "We generate enough leads, but 70% are outside our ICP because our only channel rewards volume", "Grow revenue 40% by the end of the financial year", "Become the default choice for independent physio clinics"], "answer": 1, "why": "Diagnosis names what is actually going on and identifies the critical obstacle, which the lead-quality statement does with evidence and a cause. The spend-shift line is the module's own example of a guiding policy, and it is tempting because it sounds decisive, but it is the response to a diagnosis rather than the diagnosis itself."}, {"q": "A plan lists eleven initiatives across eight channels, opens with market-leading ambition and states a 40% growth target. Which bad-strategy symptoms apply?", "options": ["Fluff and mistaking goals for strategy only", "A scatter of unrelated objectives only", "Fluff, mistaking goals for strategy, and a scatter of unrelated objectives competing for the same people and money", "Failure to face the problem only"], "answer": 2, "why": "The module lists fluff, failure to face the problem, mistaking goals for strategy, and a scatter of unrelated objectives, and this plan displays at least three of them at once. Picking a single symptom is tempting because each is individually visible, but the module's point is that bad strategy usually shows several together."}, {"q": "Which item qualifies as a KPI rather than a metric, using the module's distinction?", "options": ["Impressions delivered this month", "Follower growth on the main social account", "Total sessions on the website", "CAC payback period"], "answer": 3, "why": "A real KPI changes a decision when it moves, and CAC payback directly governs whether you can afford more acquisition. Sessions and impressions are countable and often reported, but the module says impressions almost never change a decision, which makes them metrics with ambition."}, {"q": "A business with a small budget spreads it across eight channels and reports that none is working. The module's explanation is:", "options": ["Every channel carries a fixed learning cost, so splitting a small budget eight ways pays eight learning costs and clears no minimum spend thresholds", "Eight channels create attribution conflicts that make results unreadable", "The budget was allocated 70/20/10 instead of 60/40", "Channel dependence risk requires at least two channels, so eight is merely excessive rather than wrong"], "answer": 0, "why": "The module identifies the fixed learning cost per channel, time to understand it, creative to build, and a minimum spend before data means anything, as the reason spread fails on a small budget. Dependence risk is real but is the module's argument for adding a deliberate second channel once the first works, not for starting with eight."}, {"q": "An early-stage company with no working acquisition loop proposes putting 60% of its small budget into brand building, citing Binet and Field. What is the strongest objection from the module?", "options": ["The 60/40 split applies only to B2C, and this is a B2B company", "Brand spend cannot be measured, so it should never be funded before revenue exists", "The 60/40 finding is an average across many campaigns, assumes enough budget for brand work to reach anyone, and early-stage businesses need a working acquisition loop first", "70/20/10 should be used instead, since the two heuristics are alternatives"], "answer": 2, "why": "The module gives three caveats: it is an average, it presumes enough scale for brand work to reach anyone, and brand-heavy spend before product-market fit buys awareness for something people do not yet want. The B2C claim is a distortion of a real caveat, since the module says B2B sits nearer 50/50 in later work rather than being excluded."}, {"q": "A seasonal retailer sees weak channel performance in its trough month and plans to cut that channel, then launch its big campaign in the peak week. What does the module advise?", "options": ["Cut the channel now and reinvest in the peak week, since peak-week traffic converts best", "Keep the channel but shift it into the peak week, where costs are justified by intent", "Cut the channel and replace it with a brand campaign in the trough", "Never diagnose a channel on a seasonal trough, compare year on year, and advertise into the season rather than during it, since awareness needs lead time and peak week means highest costs against finished consideration"], "answer": 3, "why": "The module gives two seasonality rules exactly: advertise into the season rather than during it, and never diagnose a channel on a trough, comparing year on year instead. The peak-week options are tempting because intent genuinely is highest then, but by that point consideration is finished and costs are at their worst."}], "cards": [{"front": "Name Rumelt's three parts of a strategy and the test that separates strategy from a wish list.", "back": "Diagnosis, guiding policy, coherent actions. The test: does your strategy say what you will not do? If not, it is a wish list."}, {"front": "Give three recognisable symptoms of bad strategy.", "back": "Fluff, impressive words with no content; failure to face the problem; mistaking goals for strategy; and a scatter of unrelated objectives quietly competing for the same people and money."}, {"front": "Distinguish objective, goal and KPI with one example each.", "back": "Objective: the qualitative outcome, become the default for independent physio clinics. Goal: measurable with a number and date, 120 clinics by 31 December. KPI: the metric you steer by, CAC payback."}, {"front": "What does 70/20/10 allocate, and which two failure modes does it block?", "back": "70% proven, 20% promising things being scaled, 10% genuine experiments. It blocks over-investing in unproven ideas and never testing anything until the proven channel decays."}, {"front": "What is 60/40, where does it come from, and what is one caveat?", "back": "Roughly 60% long-term brand, 40% short-term activation, from Binet and Field's IPA effectiveness databank. Caveat: it is an average, and B2B and considered purchases sit nearer 50/50."}, {"front": "Give two questions that let you decline a request well.", "back": "What would we stop to do this? And which objective does this serve, and what would we see if it worked? A third converts the argument into a capped experiment: can we test it inside the 10%?"}], "elaborate": ["Write the one-paragraph diagnosis for your chosen business without using the words increase, improve or grow, then explain in two sentences what your guiding policy therefore excludes.", "Pick one action from your plan and connect it back to M05: state the kill criterion in numbers, what should be visible by day 90, and what result would make you stop."], "transfer": {"scenario": "You have been handed the marketing plan of a company selling scheduling software to independent physio clinics. It opens with We will become the leading innovator in clinic technology, sets a target of growing revenue 40%, and lists eleven activities across eight channels with the annual budget split evenly between them. There are no KPIs beyond impressions and followers, no statement of what the company will not do, and nothing about when an initiative should be stopped. The company has 200 customers and a small budget.", "prompt": "Rewrite this as a defensible strategy in outline: say what you would cut, what structure you would impose, and how you would present it to the board.", "model": "This is a tactics list with a budget attached, showing most bad-strategy symptoms at once: fluff in the opening line, a goal presented as strategy in the 40% target, a scatter of eleven initiatives, and no kill criteria. I would start over with the kernel. Diagnosis first, naming the single critical obstacle with evidence, banning the words increase, improve and grow because they describe outcomes rather than problems. Then a guiding policy stated so it excludes something, and three to five coherent actions with an owner and date each. Eight channels on a small budget pays eight learning costs and clears no thresholds, so I would concentrate on one or two where clinic owners already are, checked against the max affordable CPA. Impressions and followers go; three KPIs replace them, one leading and one lagging. To the board, lead with the diagnosis, show the arithmetic, list what we decline, and name day-90 kill conditions."}}}, {"id": "M07", "num": 7, "part": "p2", "title": "The Digital Ecosystem, Websites & CRO", "short": "Websites & CRO", "meta": "120 minutes (50 read · 50 exercise · 20 recall)", "minutes": 120, "sections": [{"h": "Why this matters", "html": "<p>Every channel in Part 2 ends at a page. If that page converts at 1% instead of 3%, you pay triple for every customer, and no amount of ad optimization recovers it. Conversion work is also the cheapest lever you own — no budget approval, no algorithm's cooperation required — which makes it the highest-leverage skill in this course relative to the time it takes to learn.<\/p>", "text": "Every channel in Part 2 ends at a page. If that page converts at 1% instead of 3%, you pay triple for every customer, and no amount of ad optimization recovers it. Conversion work is also the cheapest lever you own — no budget approval, no algorithm's cooperation required — which makes it the highest-leverage skill in this course relative to the time it takes to learn."}, {"h": "Core concepts", "html": "<h3>Owned, earned, paid — and why the distinction is strategic<\/h3>\n<ul>\n<li><strong>Owned<\/strong> — website, email list, product, customer database. You control it, it survives platform policy changes, and it appreciates.<\/li>\n<li><strong>Earned<\/strong> — press, reviews, word of mouth, Reddit mentions, being cited by an AI answer engine. Credible, free, not directly controllable.<\/li>\n<li><strong>Paid<\/strong> — ads. Instant, scalable, and it stops the moment you stop paying. You are renting attention.<\/li>\n<\/ul>\n<p>The rule: <strong>paid and earned should feed owned.<\/strong> A campaign that generates sales but no email addresses, no reviews, and no returning-visitor cohort bought revenue without building an asset. Your social followers are not owned — platforms can throttle your reach to them tomorrow and repeatedly have. Your email list is.<\/p>\n<h3>The website's actual job<\/h3>\n<p>A website is not a brochure. Three jobs, in order: <strong>convert<\/strong> the people you already paid to bring there; <strong>answer<\/strong> the questions that block a purchase — including for the AI answer engines that read your site to describe you to buyers (M08); and <strong>prove<\/strong> you are real, since trust, not persuasion, is usually the binding constraint.<\/p>\n<h3>Site vs. landing page<\/h3>\n<p>A <strong>website<\/strong> serves many intents — browsing, research, support, credibility checks. Navigation is a feature. A <strong>landing page<\/strong> serves one intent from one traffic source with one action; navigation is usually a bug, because every extra link is an exit.<\/p>\n<p>Use a <strong>landing page<\/strong> for paid traffic, a specific offer, message match with an ad, or testing variants without touching the main site. Use <strong>site pages<\/strong> when intent is exploratory or the traffic is organic search that expects depth — sending SEO traffic to a stripped landing page fails, because it has no internal links and nothing to rank for.<\/p>\n<p>The common error is the reverse: sending cold paid traffic to a homepage. A homepage serves everyone, which means it persuades no one in particular.<\/p>\n<h3>Anatomy of a landing page that converts<\/h3>\n<p><strong>Above the fold<\/strong>, a visitor must answer three questions in about five seconds: what is this, is it for me, what do I do next.<\/p>\n<ul>\n<li><strong>Headline<\/strong> — the outcome or specific claim, not a slogan. \"Bookkeeping for UK contractors, done in 48 hours\" beats \"Financial clarity, delivered.\"<\/li>\n<li><strong>Subhead<\/strong> — who it is for, and the one differentiator.<\/li>\n<li><strong>Visual<\/strong> — the product in use or the result, not a stock photo of someone smiling at a laptop.<\/li>\n<li><strong>One primary action.<\/strong> One. A second equally-weighted CTA reduces action on both; secondary options should look secondary.<\/li>\n<\/ul>\n<p><strong>Message match and scent.<\/strong> The ad promised something; the page must repeat that promise in near-identical words. \"Information scent\" is the visitor's confidence they are still on the trail toward what they wanted — break it and they bounce. Five ad angles need five headline variants, not one generic page. This is the most common fixable defect in paid campaigns.<\/p>\n<p><strong>Social proof placement.<\/strong> Proof works next to the doubt it answers, not in a carousel at the bottom nobody reaches. A quote about easy setup belongs beside the signup form; logos belong near the pricing. Specific and slightly awkward beats polished: \"cut our close time from 9 days to 3\" outperforms \"Great service, highly recommend!\"<\/p>\n<p><strong>Objection handling.<\/strong> List the real reasons people do not buy — price, switching cost, contract length, \"will this work for my case\", data security, refunds — and answer each on the page. An FAQ is not filler; it is the objection list. Read support tickets to get the real ones.<\/p>\n<p><strong>Friction removal and form length.<\/strong> Every field, forced account, and unexpected cost is a leak. Ask only for what you use <em>now<\/em>. Shorter forms raise conversion rate and lower lead quality, so the right length depends on your bottleneck: if reps are idle, shorten; if they are drowning in junk, add one qualifying question. If sales demands more fields, convert first and qualify on the next screen.<\/p>\n<h3>Speed, Core Web Vitals, and mobile<\/h3>\n<p>Core Web Vitals are Google's three page-experience metrics: <strong>LCP<\/strong> (largest contentful paint — when main content appears, target under 2.5s), <strong>INP<\/strong> (interaction to next paint — responsiveness, under 200ms), <strong>CLS<\/strong> (cumulative layout shift — visual stability, under 0.1). A modest ranking factor and a large conversion factor: slow pages lose people before they read anything, and mobile ad traffic is the most impatient traffic you will buy.<\/p>\n<p>Practical wins in order of payoff: compress and size images correctly (WebP/AVIF), lazy-load below-the-fold media, remove unused third-party scripts (chat widgets and tag managers are the usual offenders), preload the hero image and font. Measure with <strong>PageSpeed Insights<\/strong> using field data from real users, not only the lab score.<\/p>\n<p>Most traffic is mobile. Design the mobile layout first. Check the CTA is thumb-reachable, the form does not trigger zoom, and the sticky header does not eat a third of the screen.<\/p>\n<h3>Trust signals<\/h3>\n<p>Real address and a named human. Working phone or chat. Recognizable payment logos. HTTPS. Third-party reviews (G2, Trustpilot, Google) rather than only self-hosted quotes. Refund terms stated plainly. Compliance badges only if genuine. For anything strangers pay for upfront, trust signals are often worth more than copy improvements.<\/p>\n<h3>Diagnosing conversion, in order<\/h3>\n<p>Do not redesign. Diagnose.<\/p>\n<ol>\n<li><strong>Where do people leave?<\/strong> In GA4, build a funnel exploration across the real path (landing → key page → form start → submit). Segment by device and traffic source — a \"site problem\" is often a mobile-only or single-campaign problem.<\/li>\n<li><strong>What are they doing on the page?<\/strong> Session replay and scroll/click heatmaps. <strong>Microsoft Clarity<\/strong> is free with no traffic cap and flags rage clicks and dead clicks; <strong>Hotjar<\/strong> and <strong>PostHog<\/strong> do the same with product analytics attached. Watch 15 replays of abandoned sessions — more informative than a week of dashboards.<\/li>\n<li><strong>Where does the form die?<\/strong> Form analytics: the last field touched before abandonment. It is nearly always one field — a phone number, a required company size, a bad validation error.<\/li>\n<li><strong>What do the words say?<\/strong> Read it as a first-time visitor and mark every sentence a skeptic would challenge.<\/li>\n<\/ol>\n<p>Only then form a hypothesis and change one thing.<\/p>\n<h3>Benchmarks, honestly<\/h3>\n<p>Published \"average conversion rates\" are close to useless as targets: they mix branded with cold traffic, wildly different price points, incompatible definitions of \"conversion,\" and self-selected survey samples. Use them only to notice when you are wildly off — a 0.1% rate signals something broken. <strong>Your real benchmark is your own page last month.<\/strong><\/p>", "text": "Owned, earned, paid — and why the distinction is strategic Owned — website, email list, product, customer database. You control it, it survives platform policy changes, and it appreciates. Earned — press, reviews, word of mouth, Reddit mentions, being cited by an AI answer engine. Credible, free, not directly controllable. Paid — ads. Instant, scalable, and it stops the moment you stop paying. You are renting attention. The rule: paid and earned should feed owned. A campaign that generates sales but no email addresses, no reviews, and no returning-visitor cohort bought revenue without building an asset. Your social followers are not owned — platforms can throttle your reach to them tomorrow and repeatedly have. Your email list is. The website's actual job A website is not a brochure. Three jobs, in order: convert the people you already paid to bring there; answer the questions that block a purchase — including for the AI answer engines that read your site to describe you to buyers (M08); and prove you are real, since trust, not persuasion, is usually the binding constraint. Site vs. landing page A website serves many intents — browsing, research, support, credibility checks. Navigation is a feature. A landing page serves one intent from one traffic source with one action; navigation is usually a bug, because every extra link is an exit. Use a landing page for paid traffic, a specific offer, message match with an ad, or testing variants without touching the main site. Use site pages when intent is exploratory or the traffic is organic search that expects depth — sending SEO traffic to a stripped landing page fails, because it has no internal links and nothing to rank for. The common error is the reverse: sending cold paid traffic to a homepage. A homepage serves everyone, which means it persuades no one in particular. Anatomy of a landing page that converts Above the fold , a visitor must answer three questions in about five seconds: what is this, is it for me, what do I do next. Headline — the outcome or specific claim, not a slogan. \"Bookkeeping for UK contractors, done in 48 hours\" beats \"Financial clarity, delivered.\" Subhead — who it is for, and the one diff"}, {"h": "How it works in practice", "html": "<p>A CRO cycle on a small site:<\/p>\n<ol>\n<li>Pick the page with the most traffic × the worst conversion rate. You cannot learn from a page with 40 visits a month.<\/li>\n<li>Watch replays and read the heatmap. Write down three specific observations.<\/li>\n<li>Write hypotheses as: <em>Because [evidence], I believe [change] will [effect] measured by [metric].<\/em><\/li>\n<li>Rank by impact × confidence ÷ effort. Ship the top one.<\/li>\n<li>If traffic is too low for a valid A/B test (M14 — usually true under a few hundred conversions a month), make the change and compare periods, accepting weaker evidence. Do not run a test you cannot power; you will read noise as truth.<\/li>\n<\/ol>", "text": "A CRO cycle on a small site: Pick the page with the most traffic × the worst conversion rate. You cannot learn from a page with 40 visits a month. Watch replays and read the heatmap. Write down three specific observations. Write hypotheses as: Because [evidence], I believe [change] will [effect] measured by [metric]. Rank by impact × confidence ÷ effort. Ship the top one. If traffic is too low for a valid A/B test (M14 — usually true under a few hundred conversions a month), make the change and compare periods, accepting weaker evidence. Do not run a test you cannot power; you will read noise as truth."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Your analytics undercount, permanently.<\/strong> Google did <em>not<\/em> remove third-party cookies from Chrome — it confirmed in April 2025 they stay, then in October 2025 announced it was retiring most Privacy Sandbox technologies (Topics, Protected Audience, Attribution Reporting), deprecated in Chrome 144 (January 2026) and targeted for removal in Chrome 150 (July 2026). Ignore the 2023-era \"cookieless future\" advice. The real constraints are unchanged: <strong>consent<\/strong> (GDPR/ePrivacy) means a share of EU visitors is never measured, <strong>Safari's ITP<\/strong> truncates cookie lifetimes, and <strong>ad blockers<\/strong> remove more. Server-side tagging and consent mode help; nothing makes it exact.<\/li>\n<li><strong>AI answer engines read your pages.<\/strong> Clear headings, plain answers, and structured data now affect how you are described to a buyer who never visits (M08).<\/li>\n<li><strong>AI makes page production nearly free<\/strong>, so the differentiator is a specific offer and real proof, not more pages. Generated pages full of generic reassurance convert badly and always have.<\/li>\n<\/ul>", "text": "Your analytics undercount, permanently. Google did not remove third-party cookies from Chrome — it confirmed in April 2025 they stay, then in October 2025 announced it was retiring most Privacy Sandbox technologies (Topics, Protected Audience, Attribution Reporting), deprecated in Chrome 144 (January 2026) and targeted for removal in Chrome 150 (July 2026). Ignore the 2023-era \"cookieless future\" advice. The real constraints are unchanged: consent (GDPR/ePrivacy) means a share of EU visitors is never measured, Safari's ITP truncates cookie lifetimes, and ad blockers remove more. Server-side tagging and consent mode help; nothing makes it exact. AI answer engines read your pages. Clear headings, plain answers, and structured data now affect how you are described to a buyer who never visits (M08). AI makes page production nearly free , so the differentiator is a specific offer and real proof, not more pages. Generated pages full of generic reassurance convert badly and always have."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Redesigning instead of diagnosing.<\/strong> A redesign changes 50 variables at once, so you learn nothing and often lose conversions you had.<\/li>\n<li><strong>Testing button colors.<\/strong> Micro-tests on low-traffic sites waste months. Test offers, headlines, page structure, form length — things big enough to detect.<\/li>\n<li><strong>Homepage as landing page<\/strong> for cold paid traffic.<\/li>\n<li><strong>Stacking a chat widget, popup, cookie banner, and review carousel<\/strong>, then wondering why mobile LCP is 6 seconds.<\/li>\n<li><strong>Optimizing the page when the offer is wrong.<\/strong> If nobody wants it at that price, no layout fixes it (M01, M04).<\/li>\n<li><strong>Trusting a \"winning\" test that ran four days.<\/strong> Weekday and weekend buyers differ; run full weeks.<\/li>\n<li><strong>Copying a competitor's page.<\/strong> You cannot see their conversion rate. They may be losing money elegantly.<\/li>\n<\/ul>", "text": "Redesigning instead of diagnosing. A redesign changes 50 variables at once, so you learn nothing and often lose conversions you had. Testing button colors. Micro-tests on low-traffic sites waste months. Test offers, headlines, page structure, form length — things big enough to detect. Homepage as landing page for cold paid traffic. Stacking a chat widget, popup, cookie banner, and review carousel , then wondering why mobile LCP is 6 seconds. Optimizing the page when the offer is wrong. If nobody wants it at that price, no layout fixes it (M01, M04). Trusting a \"winning\" test that ran four days. Weekday and weekend buyers differ; run full weeks. Copying a competitor's page. You cannot see their conversion rate. They may be losing money elegantly."}, {"h": "Exercise (50 minutes)", "html": "<p>Pick a real landing page for <strong>your chosen business<\/strong> — yours, or a direct competitor's if you have none. Open it on a phone as well as a desktop.<\/p>\n<p><strong>Part A — audit (25 min).<\/strong> Score each item Pass / Weak / Fail, with one sentence of evidence:<\/p>\n<ol>\n<li>Can you tell what it is, who it is for, and what to do in five seconds?<\/li>\n<li>Is there exactly one primary action?<\/li>\n<li>Does the headline match the promise of the ad or link that would send traffic here?<\/li>\n<li>Is there proof, and is it placed next to the relevant doubt?<\/li>\n<li>Are the top three buyer objections answered on the page?<\/li>\n<li>How many form fields, and is each one used immediately?<\/li>\n<li>Are pricing and terms findable without contacting anyone?<\/li>\n<li>Run PageSpeed Insights on the mobile URL. Record LCP, INP, CLS.<\/li>\n<li>On mobile, is the primary CTA visible without scrolling past two screens?<\/li>\n<li>What trust signals exist? What would a suspicious first-time buyer still be worried about?<\/li>\n<\/ol>\n<p><strong>Part B — five prioritized fixes (25 min).<\/strong> Write five fixes, each with:\n- The evidence from your audit\n- The hypothesis in the format: <em>Because [evidence], I believe [change] will [effect] measured by [metric]<\/em>\n- Effort (hours) and your confidence (low/med/high)<\/p>\n<p>Then rank them. If you have access to the site, install <strong>Microsoft Clarity<\/strong> (free) before you change anything, so you have a baseline of replays.<\/p>", "text": "Pick a real landing page for your chosen business — yours, or a direct competitor's if you have none. Open it on a phone as well as a desktop. Part A — audit (25 min). Score each item Pass / Weak / Fail, with one sentence of evidence: Can you tell what it is, who it is for, and what to do in five seconds? Is there exactly one primary action? Does the headline match the promise of the ad or link that would send traffic here? Is there proof, and is it placed next to the relevant doubt? Are the top three buyer objections answered on the page? How many form fields, and is each one used immediately? Are pricing and terms findable without contacting anyone? Run PageSpeed Insights on the mobile URL. Record LCP, INP, CLS. On mobile, is the primary CTA visible without scrolling past two screens? What trust signals exist? What would a suspicious first-time buyer still be worried about? Part B — five prioritized fixes (25 min). Write five fixes, each with: - The evidence from your audit - The hypothesis in the format: Because [evidence], I believe [change] will [effect] measured by [metric] - Effort (hours) and your confidence (low/med/high) Then rank them. If you have access to the site, install Microsoft Clarity (free) before you change anything, so you have a baseline of replays."}, {"h": "Recall (20 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Owned vs. earned vs. paid, with two examples of each, and the rule connecting them<\/li>\n<li>Three situations that call for a landing page rather than a site page<\/li>\n<li>The three questions a visitor must answer above the fold<\/li>\n<li>What \"message match\" means and why it breaks paid campaigns<\/li>\n<li>The three Core Web Vitals and roughly what each measures<\/li>\n<li>The four-step conversion diagnosis order<\/li>\n<li>Why published conversion benchmarks are close to useless<\/li>\n<li>The form-length trade-off, and what determines the right answer<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Owned vs. earned vs. paid, with two examples of each, and the rule connecting them Three situations that call for a landing page rather than a site page The three questions a visitor must answer above the fold What \"message match\" means and why it breaks paid campaigns The three Core Web Vitals and roughly what each measures The four-step conversion diagnosis order Why published conversion benchmarks are close to useless The form-length trade-off, and what determines the right answer"}, {"h": "If you remember one thing", "html": "<p><strong>Diagnose before you change, and change the biggest thing you can measure.<\/strong> Watch ten session replays before you touch a pixel — the problem is almost never the one you assumed, and it is usually the offer, the message match, or the form, not the design.<\/p>", "text": "Diagnose before you change, and change the biggest thing you can measure. Watch ten session replays before you touch a pixel — the problem is almost never the one you assumed, and it is usually the offer, the message match, or the form, not the design."}], "suggest": [["Why can't better ad optimisation rescue a page that converts at 1%?", "Work the maths: 1% vs 3% conversion on 1,000 visits a month", "How do I find my current conversion rate to know which lever I own?"], ["Where does an AI answer engine citing me sit — earned or owned?", "Give an example of a paid campaign that actually feeds owned assets", "How do I get email addresses out of my ads without hurting sales?"], ["Why can't I learn anything from a page with 40 visits a month?", "Write me a hypothesis in the Because / I believe / measured by format", "My traffic is too low to A/B test — how do I compare periods safely?"], ["What actually changed when Google retired most Privacy Sandbox tech?", "Roughly how much traffic do consent, ITP and ad blockers hide from me?", "Do I need server-side tracking, or can I live with undercounting?"], ["Why does a redesign teach me nothing about what caused a change?", "Which stacked widgets push mobile LCP to 6 seconds, and by how much?", "How do I tell whether my offer is wrong before I touch the layout?"], ["What counts as proof placed next to the relevant doubt?", "Score a real page for me on the five-second test: pass, weak or fail", "How do I cut form fields when every field has someone defending it?"], ["Why are published conversion benchmarks close to useless to me?", "Name the three Core Web Vitals and what a failing score looks like", "When should I build a landing page instead of using a site page?"], ["Why is the culprit usually message match rather than the design?", "What should I be writing down across ten session replays?", "Where do I get session replays for my site without paying for a tool?"]], "assess": {"predict": "If a landing page converts at 1% instead of 3%, what happens to what you pay for each customer, and can better ad targeting fix it?", "quiz": [{"q": "A campaign generates 400 sales in a month but collects no email addresses, no reviews, and produces no returning-visitor cohort. What is the strategic criticism the module makes of this outcome?", "options": ["The campaign's attribution was almost certainly broken", "Paid spend should never exceed earned media spend", "It bought revenue without building an owned asset, because paid and earned are supposed to feed owned", "Social followers should have been counted as an owned asset"], "answer": 2, "why": "The rule in the module is that paid and earned should feed owned; revenue with no list, reviews or returning cohort leaves nothing behind when spending stops. The tempting wrong answer about followers fails because the module explicitly says followers are not owned - platforms can throttle reach to them and repeatedly have."}, {"q": "You run a blog post ranking on page one for an informational query. Someone suggests replacing it with a stripped-down landing page to lift conversion. Why is that a mistake?", "options": ["Landing pages cannot carry structured data", "Organic search traffic expects depth, and a stripped landing page has no internal links and nothing to rank for", "Landing pages always load slower than site pages", "Google penalises landing pages that carry navigation"], "answer": 1, "why": "The module says to use site pages when intent is exploratory or the traffic is organic search that expects depth, precisely because a landing page has no internal links and nothing to rank for. The speed answer is tempting but the module never claims landing pages are inherently slower - stacked third-party scripts are the speed culprit."}, {"q": "Paid traffic to a page is 12,000 sessions a month, LCP on mobile is 6.1 seconds, and the page carries a chat widget, a popup, a cookie banner and a review carousel. According to the module's order of payoff, which fix comes first?", "options": ["Rewrite the headline for better message match", "Move the page to a new design system", "Add a sticky mobile CTA bar", "Compress and correctly size images, then strip unused third-party scripts"], "answer": 3, "why": "The module lists practical speed wins in order of payoff - compress and size images correctly, lazy-load below-the-fold media, remove unused third-party scripts - and names chat widgets and tag managers as the usual offenders. Rewriting the headline is valuable work but the module says slow pages lose people before they read anything, so at 6.1 second LCP the copy is not yet the binding constraint."}, {"q": "Your sales reps are idle and complaining they have nothing to call. Your lead form asks for name, email, company, phone, company size, budget and timeline. What does the module's form-length logic say to do?", "options": ["Shorten the form, accepting lower lead quality, because the bottleneck is volume not rep capacity", "Keep the form and increase ad spend, since form length is not a conversion factor", "Add a qualifying question so reps only speak to good fits", "Split the form across three steps but keep all seven fields"], "answer": 0, "why": "The module states the trade-off directly: shorter forms raise conversion rate and lower lead quality, so the right length depends on your bottleneck - if reps are idle, shorten. Adding a qualifying question is the correct move for the opposite situation, when reps are drowning in junk."}, {"q": "A colleague says you should stop worrying about analytics gaps because third-party cookies are being deprecated and everything is moving cookieless anyway. What is the accurate correction?", "options": ["Third-party cookies were removed from Chrome in 2025, so the gaps are now permanent and unfixable", "Privacy Sandbox replaced cookies successfully, so measurement is more accurate than before", "Chrome kept third-party cookies; the real, unchanged constraints are consent, Safari's ITP and ad blockers", "Server-side tagging eliminates measurement gaps entirely"], "answer": 2, "why": "Google confirmed in April 2025 that third-party cookies stay and in October 2025 announced it was retiring most Privacy Sandbox technologies; the real constraints named are consent under GDPR and ePrivacy, Safari's ITP and ad blockers. The server-side tagging option is tempting because the module does say it helps, but it explicitly adds that nothing makes measurement exact."}, {"q": "A page gets 40 visits a month and converts at 1.5%. Your manager wants an A/B test of two headline variants. What does the module say to do?", "options": ["Run the test but extend it to four days to gather enough data", "Run the test at 50/50 and call the winner once one variant leads", "Pick this page for testing because low-converting pages have the most upside", "Do not test - the page has too little traffic to learn from; make the change and compare periods, accepting weaker evidence"], "answer": 3, "why": "The module says you cannot learn from a page with 40 visits a month, and that below roughly a few hundred conversions a month you should make the change and compare periods rather than run a test you cannot power. The upside answer is tempting but the module's selection rule is most traffic multiplied by worst conversion rate, not worst rate alone."}], "cards": [{"front": "What is the rule connecting owned, earned and paid media?", "back": "Paid and earned should feed owned. A campaign producing revenue but no email addresses, reviews or returning-visitor cohort bought revenue without building an asset."}, {"front": "What three questions must a visitor answer above the fold in about five seconds?", "back": "What is this, is it for me, and what do I do next."}, {"front": "What is information scent, and what breaks it?", "back": "The visitor's confidence they are still on the trail toward what they wanted. It breaks when the page does not repeat the ad's promise in near-identical words - the message-match defect."}, {"front": "Name the three Core Web Vitals, what each measures, and its target.", "back": "LCP, when main content appears, under 2.5s. INP, responsiveness to interaction, under 200ms. CLS, visual stability, under 0.1."}, {"front": "What is the four-step order for diagnosing conversion?", "back": "Where do people leave (GA4 funnel, segmented by device and source); what are they doing on the page (replays, heatmaps); where does the form die (last field touched); what do the words say."}, {"front": "Why are published average conversion rates close to useless as targets?", "back": "They mix branded with cold traffic, wildly different price points, incompatible conversion definitions and self-selected samples. Use them only to spot being wildly off; your benchmark is your own page last month."}], "elaborate": ["Take the landing page you would actually send paid traffic to for your chosen business. Write down the three questions a visitor must answer above the fold, then answer each one using only words that appear on the page today. Where you cannot, name what is missing and whether it is a headline, a visual or a proof problem.", "M01 and M04 argued that the offer can be wrong at any price. Describe one scenario in your chosen business where every CRO fix in this module would fail, explain how you would tell that from the diagnosis data rather than from opinion, and say what you would change instead."], "transfer": {"scenario": "A B2B software company spends 18,000 euros a month on Google Ads across five ad angles, all pointing at the homepage. Desktop converts visitors to demo requests at 2.8%; mobile converts at 0.4%, and mobile is 64% of paid sessions. Mobile LCP measured in PageSpeed Insights field data is 5.8 seconds, with a chat widget, a cookie banner and a review carousel loading above the fold. The demo form has nine fields including phone number and company size. The sales team says leads are good quality but there are not enough of them.", "prompt": "Diagnose in the module's order and name the first three changes you would make, with the evidence behind each and the metric you would judge it by.", "model": "The segment split does the diagnosis: this is a mobile problem, not a site problem, so the first move is to segment the GA4 funnel by device and source rather than redesign. Three changes follow. First, stop sending five ad angles to a homepage: build five landing pages with headlines that repeat each ad's promise in near-identical words, judged by paid mobile conversion rate. Second, strip the chat widget, carousel and unneeded scripts and compress the hero image; 5.8 second LCP loses people before they read anything, judged by field LCP and mobile bounce. Third, cut the form, because sales reports good quality and insufficient volume - the bottleneck is volume, so shorten and qualify on the next screen, judged by form completion and last-field-abandoned data. Install Clarity first for a replay baseline, then change one thing at a time."}}}, {"id": "M08", "num": 8, "part": "p2", "title": "SEO and AI Search (GEO/AEO)", "short": "SEO & AI search", "meta": "150 minutes (60 read · 60 exercise · 30 recall)", "minutes": 150, "sections": [{"h": "Why this matters", "html": "<p>SEO has the best long-run economics and the worst patience requirements: no cost per click, compounding results, and six to twelve months before you know if it worked. It is also being restructured underneath you. Roughly 60% of Google searches now end without a click to any external site, and when an AI Overview appears the click-through rate of the top organic result drops sharply — roughly halved, per SISTRIX data reported in 2026. Ranking first is no longer the same as getting the visit.<\/p>\n<p>That does not make search less valuable. It moves the prize from <em>ranking<\/em> to <em>being the brand the answer names<\/em>.<\/p>", "text": "SEO has the best long-run economics and the worst patience requirements: no cost per click, compounding results, and six to twelve months before you know if it worked. It is also being restructured underneath you. Roughly 60% of Google searches now end without a click to any external site, and when an AI Overview appears the click-through rate of the top organic result drops sharply — roughly halved, per SISTRIX data reported in 2026. Ranking first is no longer the same as getting the visit. That does not make search less valuable. It moves the prize from ranking to being the brand the answer names ."}, {"h": "Core concepts", "html": "<h3>How search engines work<\/h3>\n<p>Three stages, each a separate failure point.<\/p>\n<ol>\n<li><strong>Crawl<\/strong> — a bot fetches pages, following links and your sitemap. If it cannot reach a page, nothing else matters.<\/li>\n<li><strong>Index<\/strong> — the page is parsed, rendered, and stored. Google may crawl and decline to index (\"Crawled – currently not indexed\" in Search Console), usually judging the page low-value or duplicative.<\/li>\n<li><strong>Rank<\/strong> — indexed pages are ordered by hundreds of signals, dominated by relevance to intent, content quality, and off-site authority.<\/li>\n<\/ol>\n<h3>How answer engines differ<\/h3>\n<p>ChatGPT, Perplexity, Gemini, Copilot, and Google's AI Overviews work as <strong>retrieval + synthesis + citation<\/strong>: the system pulls candidate passages (from an index, a live fetch, or training data), writes one answer, and cites a few sources. Three consequences:<\/p>\n<ul>\n<li><strong>Passages compete, not pages.<\/strong> A well-structured 80-word answer inside your page can be lifted even if the page does not rank first.<\/li>\n<li><strong>One answer, not ten links.<\/strong> Positions 2-10 lose most of their value; rewards became far more winner-take-all.<\/li>\n<li><strong>Citation is the unit.<\/strong> Brands cited inside an AI Overview get materially more clicks than uncited competitors on the same query, and the citation carries brand value even with no click.<\/li>\n<\/ul>\n<h3>The four pillars<\/h3>\n<ul>\n<li><strong>Technical<\/strong> — can it be crawled, indexed, rendered, and loaded fast.<\/li>\n<li><strong>Content<\/strong> — does it satisfy the intent better than what currently ranks.<\/li>\n<li><strong>On-page<\/strong> — is it structured so a machine can tell what it is about.<\/li>\n<li><strong>Off-page / authority<\/strong> — do credible third parties link to and talk about you.<\/li>\n<\/ul>\n<p>Beginners spend all their time on on-page because it is the only pillar you can complete in an afternoon. Authority is the hardest and usually the binding constraint.<\/p>\n<h3>Keyword research done properly<\/h3>\n<p>Start with <strong>intent classification<\/strong>, because intent determines what page type can possibly rank:<\/p>\n<ul>\n<li><strong>Informational<\/strong> — \"how does payroll tax work.\" Wants an explanation; a product page cannot rank. Increasingly answered without a click.<\/li>\n<li><strong>Commercial investigation<\/strong> — \"best payroll software for contractors\", \"X vs Y\", \"X pricing\". <strong>The highest-value SEO territory in 2026<\/strong>: high purchase intent, and answer engines lean heavily on comparison and review content.<\/li>\n<li><strong>Transactional<\/strong> — \"buy X\", \"X free trial\". Wants to act.<\/li>\n<li><strong>Navigational<\/strong> — \"Xero login\". Belongs to that brand; ignore.<\/li>\n<\/ul>\n<p>Then evaluate on three axes, not one:<\/p>\n<ul>\n<li><strong>Volume<\/strong> — tools estimate this badly. Treat it as an order of magnitude, not a number.<\/li>\n<li><strong>Difficulty<\/strong> — who ranks now, and can you plausibly beat them. Judge from the actual SERP, not the tool's score.<\/li>\n<li><strong>Business value<\/strong> — would this searcher ever buy? A 20,000-volume term that brings students is worth less than a 60-volume term that brings buyers.<\/li>\n<\/ul>\n<p><strong>Long tail:<\/strong> specific, multi-word, low-volume, high-intent queries. For a new site they are the entire viable strategy — twenty terms at 40 searches a month converting at 8% beat one term at 5,000 you will never rank for.<\/p>\n<h3>SERP analysis and intent matching<\/h3>\n<p>Before writing anything, search the term and look at what Google is already rewarding: page type (listicle, product, forum, video), content depth, whether Reddit or YouTube dominates, whether an AI Overview appears and who it cites. <strong>The SERP tells you what Google believes the intent is.<\/strong> If nine results are comparison listicles, your product page will not rank there no matter how good it is. Match the format or pick a different query.<\/p>\n<h3>On-page fundamentals<\/h3>\n<ul>\n<li><strong>Title tag<\/strong> — the strongest on-page element. Primary term near the front, written for a human to click.<\/li>\n<li><strong>One H1<\/strong> matching the page's promise; H2/H3 mirroring the sub-questions people actually ask.<\/li>\n<li><strong>Internal links<\/strong> — the most underused lever. Link from strong pages to the pages you want to rank, with descriptive anchor text. Free, fully under your control, and the fastest fix on most sites.<\/li>\n<li><strong>Structured data (schema.org)<\/strong> — Organization, Product, FAQPage, Article, LocalBusiness, Review. No direct ranking boost, but it makes your entity and facts machine-readable, which matters more now that machines write the answer. Validate with Google's Rich Results Test.<\/li>\n<li><strong>Answer-first writing<\/strong> — a direct, self-contained 40-80 word answer immediately under the heading that asks the question, then elaborate. That is what gets extracted.<\/li>\n<\/ul>\n<h3>Technical basics<\/h3>\n<p>Indexation (Search Console's Pages report shows what is excluded and why), an accurate XML sitemap, a <code>robots.txt<\/code> blocking nothing important, correct canonicals on duplicate and parameterized URLs, a shallow structure putting important pages within three clicks of the homepage, and speed/Core Web Vitals (M07). Crawl with <strong>Screaming Frog<\/strong> (free to 500 URLs) for broken links, redirect chains, missing titles, and orphan pages.<\/p>\n<p>Technical SEO is a floor, not a growth lever. Fix what is broken, then stop.<\/p>\n<h3>Authority: links, PR, and why buying links is a bad trade<\/h3>\n<p>Backlinks from credible, topically relevant sites remain a strong signal. What earns them: original data, genuinely useful free tools, expert commentary journalists can quote, partnerships, and being the source others cite.<\/p>\n<p><strong>Do not buy links<\/strong> — the trade is bad economically, not just ethically. You pay recurring money for an asset one algorithm update can devalue, from networks selling to everyone including your competitors, with detectable footprints, and a manual action can remove your entire organic channel overnight. Negative expected value for any business planning to exist in three years. Guest posts on real publications with real audiences are a different thing; that is PR.<\/p>\n<h3>E-E-A-T and entities<\/h3>\n<p>Experience, Expertise, Authoritativeness, Trustworthiness. Not a score Google assigns, but a description of what quality raters — and increasingly retrieval systems — look for. It matters most for money-and-health topics and, now, for whether an LLM treats you as a reliable entity.<\/p>\n<p>Practically: named authors with real credentials, an About page saying who is behind the business, first-hand experience visible in the content (\"we tested this on 40 accounts\"), citations to primary sources, and <strong>consistent entity information everywhere<\/strong> — same business name, description, and founder names on your site, LinkedIn, Crunchbase, and directories. Answer engines assemble their picture of you from many sources; inconsistency makes you a fuzzy entity, and fuzzy entities do not get cited.<\/p>\n<h3>Local SEO, briefly<\/h3>\n<p>If you serve a geography, <strong>Google Business Profile<\/strong> is the highest-return hour in this module. Complete every field, pick correct categories, post real photos, gather reviews steadily and reply to them. Keep NAP (name, address, phone) identical across your site and directories. Local pack rankings turn mostly on proximity, relevance, and review volume/recency.<\/p>\n<h3>GEO / AEO: getting cited by answer engines<\/h3>\n<p>Answer/generative engine optimization is now a distinct discipline. What the evidence and practice point to:<\/p>\n<ul>\n<li><strong>Extractable answers.<\/strong> Clear question-shaped headings with immediate, self-contained answers. Bulleted specifics. No 300-word preamble before the point.<\/li>\n<li><strong>Structured content and data.<\/strong> Tables of specs, comparison tables, defined terms, schema markup. Synthesizers prefer content they can parse without inference.<\/li>\n<li><strong>Third-party mentions.<\/strong> This is the big shift: <strong>being talked about off-site now functions like a ranking signal.<\/strong> LLMs assemble answers from a wide corpus, so mentions in listicles, review sites, industry publications, and directories affect whether you appear — even without a link. \"Best X for Y\" roundups that include you are now direct distribution.<\/li>\n<li><strong>Reviews and comparison content.<\/strong> Answer engines lean on G2, Trustpilot, Capterra, and independent comparisons when a query has commercial intent. Being absent from those is being absent from the answer.<\/li>\n<li><strong>Reddit and YouTube.<\/strong> Both are disproportionately retrieved. Reddit because it reads as authentic human experience; YouTube because it is transcribed and indexed. Genuine participation matters (M09); astroturfing gets you removed and does not survive moderation.<\/li>\n<li><strong>Consistent entity data<\/strong>, as above.<\/li>\n<\/ul>\n<p><strong>Measuring AI visibility.<\/strong> Imperfect, but do it: pick 20-30 buyer queries, run them monthly across ChatGPT, Perplexity, Gemini, and Google AI Overviews, and log whether you are mentioned, cited with a link, or absent — and which competitors appear. That is your <strong>share of answer<\/strong>. In GA4 and Search Console, watch for the pattern of stable or rising impressions with falling clicks, which is the signature of answer-engine displacement. Referral traffic from <code>chatgpt.com<\/code> and <code>perplexity.ai<\/code> is small in volume and often high in intent; segment it.<\/p>\n<p><strong>The strategic implication:<\/strong> traffic-based SEO KPIs are dying. \"Organic sessions\" as a headline metric will keep falling for informational content even when your visibility improves. Report share of answer, branded search volume, and conversions from organic instead — and stop investing in thin informational content whose only job was to catch a click that no longer happens.<\/p>", "text": "How search engines work Three stages, each a separate failure point. Crawl — a bot fetches pages, following links and your sitemap. If it cannot reach a page, nothing else matters. Index — the page is parsed, rendered, and stored. Google may crawl and decline to index (\"Crawled – currently not indexed\" in Search Console), usually judging the page low-value or duplicative. Rank — indexed pages are ordered by hundreds of signals, dominated by relevance to intent, content quality, and off-site authority. How answer engines differ ChatGPT, Perplexity, Gemini, Copilot, and Google's AI Overviews work as retrieval + synthesis + citation : the system pulls candidate passages (from an index, a live fetch, or training data), writes one answer, and cites a few sources. Three consequences: Passages compete, not pages. A well-structured 80-word answer inside your page can be lifted even if the page does not rank first. One answer, not ten links. Positions 2-10 lose most of their value; rewards became far more winner-take-all. Citation is the unit. Brands cited inside an AI Overview get materially more clicks than uncited competitors on the same query, and the citation carries brand value even with no click. The four pillars Technical — can it be crawled, indexed, rendered, and loaded fast. Content — does it satisfy the intent better than what currently ranks. On-page — is it structured so a machine can tell what it is about. Off-page / authority — do credible third parties link to and talk about you. Beginners spend all their time on on-page because it is the only pillar you can complete in an afternoon. Authority is the hardest and usually the binding constraint. Keyword research done properly Start with intent classification , because intent determines what page type can possibly rank: Informational — \"how does payroll tax work.\" Wants an explanation; a product page cannot rank. Increasingly answered without a click. Commercial investigation — \"best payroll software for contractors\", \"X vs Y\", \"X pricing\". The highest-value SEO territory in 2026 : high purchase intent, and answer engines lean heavily on comparison and review content. Transactional — \"buy X\", \"X free trial\""}, {"h": "How it works in practice", "html": "<p>A realistic first 90 days on a small site:<\/p>\n<ol>\n<li><strong>Week 1<\/strong> — Set up and verify Google Search Console (free, non-negotiable). Crawl with Screaming Frog. Fix indexation blockers, broken links, missing titles.<\/li>\n<li><strong>Weeks 2-3<\/strong> — Build a keyword map: 20-40 terms grouped into topics, each with an intent, a target URL, and a page type taken from the SERP.<\/li>\n<li><strong>Weeks 4-10<\/strong> — Publish against commercial-intent terms first. Improve existing pages before writing new ones; moving a page from position 8 is faster than starting at zero.<\/li>\n<li><strong>Ongoing<\/strong> — Internal links from every new page to your money pages. Pursue mentions: directories, review platforms, roundups, podcasts, original data.<\/li>\n<li><strong>Monthly<\/strong> — Search Console query report plus your share-of-answer log.<\/li>\n<\/ol>\n<p>Nothing meaningful happens before month three. Budget for that or do not start.<\/p>", "text": "A realistic first 90 days on a small site: Week 1 — Set up and verify Google Search Console (free, non-negotiable). Crawl with Screaming Frog. Fix indexation blockers, broken links, missing titles. Weeks 2-3 — Build a keyword map: 20-40 terms grouped into topics, each with an intent, a target URL, and a page type taken from the SERP. Weeks 4-10 — Publish against commercial-intent terms first. Improve existing pages before writing new ones; moving a page from position 8 is faster than starting at zero. Ongoing — Internal links from every new page to your money pages. Pursue mentions: directories, review platforms, roundups, podcasts, original data. Monthly — Search Console query report plus your share-of-answer log. Nothing meaningful happens before month three. Budget for that or do not start."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Publishing volume is not a strategy.<\/strong> AI made competent content free, so the supply of adequate articles is effectively infinite and worth near zero. Only content containing something unavailable elsewhere — proprietary data, real testing, named expertise, an actual opinion — earns links, citations, or trust.<\/li>\n<li><strong>Informational traffic is structurally declining.<\/strong> If your model depended on ad revenue from \"what is X\" articles, it is in trouble. If it depended on reaching buyers, shift to commercial-intent and product-adjacent content.<\/li>\n<li><strong>SEO and PR merged.<\/strong> The work that gets you cited by an LLM is the work that gets you mentioned by humans.<\/li>\n<li><strong>Do not buy an \"AI SEO\" tool before Search Console is configured and the keyword map exists.<\/strong> The fundamentals did not change; the scoreboard did.<\/li>\n<\/ul>", "text": "Publishing volume is not a strategy. AI made competent content free, so the supply of adequate articles is effectively infinite and worth near zero. Only content containing something unavailable elsewhere — proprietary data, real testing, named expertise, an actual opinion — earns links, citations, or trust. Informational traffic is structurally declining. If your model depended on ad revenue from \"what is X\" articles, it is in trouble. If it depended on reaching buyers, shift to commercial-intent and product-adjacent content. SEO and PR merged. The work that gets you cited by an LLM is the work that gets you mentioned by humans. Do not buy an \"AI SEO\" tool before Search Console is configured and the keyword map exists. The fundamentals did not change; the scoreboard did."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Chasing volume over intent.<\/strong> Ranking for terms whose searchers will never buy.<\/li>\n<li><strong>Ignoring the SERP.<\/strong> Writing a product page for a query where Google only shows listicles.<\/li>\n<li><strong>Publishing new pages while existing ones rot.<\/strong> Refreshing usually beats creating.<\/li>\n<li><strong>Treating technical SEO as the whole job.<\/strong> A perfectly crawlable site with nothing worth reading ranks for nothing.<\/li>\n<li><strong>Expecting results in six weeks<\/strong>, then quitting at week ten, right before compounding starts.<\/li>\n<li><strong>Stuffing FAQ schema everywhere to \"optimize for AI Overviews.\"<\/strong> Citation follows genuine authority and clear answers, not markup tricks.<\/li>\n<li><strong>Reporting organic sessions in 2026<\/strong> without explaining why the number falls while performance improves.<\/li>\n<\/ul>", "text": "Chasing volume over intent. Ranking for terms whose searchers will never buy. Ignoring the SERP. Writing a product page for a query where Google only shows listicles. Publishing new pages while existing ones rot. Refreshing usually beats creating. Treating technical SEO as the whole job. A perfectly crawlable site with nothing worth reading ranks for nothing. Expecting results in six weeks , then quitting at week ten, right before compounding starts. Stuffing FAQ schema everywhere to \"optimize for AI Overviews.\" Citation follows genuine authority and clear answers, not markup tricks. Reporting organic sessions in 2026 without explaining why the number falls while performance improves."}, {"h": "Exercise (60 minutes)", "html": "<p><strong>Part A — a 20-keyword map (35 min).<\/strong> For <strong>your chosen business<\/strong>, build a table with these columns:<\/p>\n<p><code>Keyword | Intent (I/C/T/N) | Est. volume | Difficulty (from the actual SERP) | Business value 1-5 | SERP page type | AI Overview present? Who is cited? | Target URL | Have/Need<\/code><\/p>\n<p>Rules: at least 8 commercial-investigation terms, at least 8 long-tail terms, no navigational terms for other brands. Take volume from Google Keyword Planner or the free tiers of Ahrefs/Semrush, but verify every SERP by actually searching it. Sort by business value and rank the top five you would attack first, one line each on why you can win.<\/p>\n<p><strong>Part B — one content brief (25 min).<\/strong> For your top keyword, write a brief containing:<\/p>\n<ul>\n<li>Target keyword, intent, and the searcher's question in their own words<\/li>\n<li>What the top three ranking pages do, and what is missing from all of them<\/li>\n<li>Your angle — what only you can say (data, experience, customer stories)<\/li>\n<li>H1 and 5-8 H2s, each phrased as a question a buyer asks<\/li>\n<li>The 60-word answer-first paragraph for the top H2, written out in full<\/li>\n<li>Internal links in (which existing pages link here) and out (which money page this links to)<\/li>\n<li>Schema type, plus the proof elements: quotes, screenshots, numbers, author and credential<\/li>\n<li>What would make an answer engine cite this instead of the incumbent<\/li>\n<\/ul>", "text": "Part A — a 20-keyword map (35 min). For your chosen business , build a table with these columns: Keyword | Intent (I/C/T/N) | Est. volume | Difficulty (from the actual SERP) | Business value 1-5 | SERP page type | AI Overview present? Who is cited? | Target URL | Have/Need Rules: at least 8 commercial-investigation terms, at least 8 long-tail terms, no navigational terms for other brands. Take volume from Google Keyword Planner or the free tiers of Ahrefs/Semrush, but verify every SERP by actually searching it. Sort by business value and rank the top five you would attack first, one line each on why you can win. Part B — one content brief (25 min). For your top keyword, write a brief containing: Target keyword, intent, and the searcher's question in their own words What the top three ranking pages do, and what is missing from all of them Your angle — what only you can say (data, experience, customer stories) H1 and 5-8 H2s, each phrased as a question a buyer asks The 60-word answer-first paragraph for the top H2, written out in full Internal links in (which existing pages link here) and out (which money page this links to) Schema type, plus the proof elements: quotes, screenshots, numbers, author and credential What would make an answer engine cite this instead of the incumbent"}, {"h": "Recall (30 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Crawl / index / rank — and one failure mode for each<\/li>\n<li>How answer engines differ from search engines, and the three consequences<\/li>\n<li>The four SEO pillars, and which one is usually the constraint<\/li>\n<li>The four intent types, and which one is most commercially valuable now<\/li>\n<li>The three axes for evaluating a keyword<\/li>\n<li>Why you read the SERP before writing<\/li>\n<li>Four things that increase your odds of being cited by an AI answer engine<\/li>\n<li>Why buying links is a bad trade, in economic rather than moral terms<\/li>\n<li>What \"share of answer\" is and how you would measure it this month<\/li>\n<li>The Search Console pattern that indicates answer-engine displacement<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Crawl / index / rank — and one failure mode for each How answer engines differ from search engines, and the three consequences The four SEO pillars, and which one is usually the constraint The four intent types, and which one is most commercially valuable now The three axes for evaluating a keyword Why you read the SERP before writing Four things that increase your odds of being cited by an AI answer engine Why buying links is a bad trade, in economic rather than moral terms What \"share of answer\" is and how you would measure it this month The Search Console pattern that indicates answer-engine displacement"}, {"h": "If you remember one thing", "html": "<p><strong>Ranking was the goal; being the cited answer is the goal now.<\/strong> Write clear, extractable answers on commercial-intent topics, make your entity consistent and visible across the third-party sources machines read, and measure share of answer — not sessions.<\/p>", "text": "Ranking was the goal; being the cited answer is the goal now. Write clear, extractable answers on commercial-intent topics, make your entity consistent and visible across the third-party sources machines read, and measure share of answer — not sessions."}], "suggest": [["Why is search still worth it if 60% of queries end without a click?", "How much of my click-through goes when an AI Overview appears?", "How do I become the brand the answer cites in my own niche?"], ["What does 'Crawled – currently not indexed' say I got wrong?", "Give an example of a page Google crawls but decides not to index", "How do I check crawl, index and rank separately on my own site?"], ["What goes in each column of a keyword map, and why intent first?", "What would week 1 look like in Search Console for a small shop?", "Why improve a page sitting at position 8 before writing a new one?"], ["What counts as content 'unavailable elsewhere' for a tiny business?", "What proprietary data could I publish from my own operations?", "Informational traffic is falling — what do I do with my how-to posts?"], ["Why doesn't FAQ schema get me quoted in AI Overviews?", "Show me a high-volume keyword I should refuse to chase, and why", "How do I decide between refreshing an old page and writing a new one?"], ["How do I judge difficulty from the SERP rather than a tool's score?", "Fill in one example row of the 20-keyword map for my business", "Where do I find 8 long-tail terms when Keyword Planner shows nothing?"], ["What is 'share of answer' and how would I measure it this month?", "Give me the four intent types with one example query each", "Why is buying links a bad trade in purely economic terms?"], ["What makes an answer 'extractable' to a machine reading my page?", "Show me a paragraph rewritten into a clearly extractable answer", "How do I make my entity consistent across the third-party sites?"]], "assess": {"predict": "If roughly 60% of Google searches now end without anyone clicking a result, what do you think the goal of SEO becomes instead of ranking first?", "quiz": [{"q": "Search Console shows a page as \"Crawled - currently not indexed.\" Which stage failed, and what does it usually mean?", "options": ["Ranking failed; the page is indexed but too weak to compete", "Indexing failed; Google fetched the page and judged it low-value or duplicative", "Crawling failed; robots.txt is blocking the URL", "Rendering failed; the page relies on JavaScript Google cannot execute"], "answer": 1, "why": "The module names crawl, index and rank as three separate failure points and gives this exact status as the signature of the index stage failing, usually because Google judged the page low-value or duplicative. The crawl answer is tempting but the word \"crawled\" in the status confirms the bot reached it - robots.txt was not the blocker."}, {"q": "You are choosing where to spend 90 days of SEO effort for a new site. Which keyword set does the module's business-value logic favour?", "options": ["One term at 5,000 monthly searches that dominates the category", "A navigational term for the market-leading competitor's login page", "The 20,000-volume informational term that brings students to the site", "Twenty long-tail terms at roughly 40 searches a month converting at 8%"], "answer": 3, "why": "The module states that twenty terms at 40 searches a month converting at 8% beat one term at 5,000 you will never rank for, and that long tail is the entire viable strategy for a new site. The 20,000-volume term fails the business-value axis - a high-volume term that brings students is worth less than a low-volume term that brings buyers."}, {"q": "You search your target term and nine of the ten results are comparison listicles. You have written a product page. What does the module tell you to do?", "options": ["Match the format or pick a different query, because the SERP tells you what Google believes the intent is", "Add FAQ schema to the product page so it can be extracted into an AI Overview", "Build more backlinks to the product page until it outranks the listicles", "Publish the product page anyway and refresh it monthly until it climbs"], "answer": 0, "why": "The module is explicit: if nine results are comparison listicles your product page will not rank there no matter how good it is, so match the format or pick a different query. The schema answer is a named common mistake - stuffing FAQ schema to optimise for AI Overviews, when citation follows genuine authority and clear answers, not markup tricks."}, {"q": "Over six months, Search Console shows impressions stable-to-rising while clicks fall steadily. What is the most likely reading?", "options": ["A manual action has suppressed the site's organic visibility", "Core Web Vitals have degraded and Google is demoting the pages", "The signature of answer-engine displacement - you are still visible but the answer absorbs the click", "Keyword cannibalisation is splitting rankings across duplicate pages"], "answer": 2, "why": "The module names this exact pattern - stable or rising impressions with falling clicks - as the Search Console signature of answer-engine displacement. The manual action option is tempting because it also produces falling clicks, but a manual action removes the organic channel outright and would take impressions down with it."}, {"q": "An agency offers a package of 40 backlinks a month from its network for a fixed monthly fee. What is the module's economic objection?", "options": ["Guest posting on real publications is always cheaper per link", "Links are no longer a ranking signal, so any spend on them is wasted", "Google will ignore the links, so the money produces nothing either way", "You pay recurring money for an asset one algorithm update can devalue, from networks selling to your competitors, with detectable footprints and manual-action risk to your whole organic channel"], "answer": 3, "why": "The module frames buying links as a bad trade economically rather than morally: recurring cost, an asset one update can devalue, networks selling to everyone including competitors, detectable footprints, and a manual action that can remove your entire organic channel overnight. The claim that links no longer matter is wrong - backlinks from credible, topically relevant sites remain a strong signal."}, {"q": "You want to be cited when a buyer asks an answer engine about your category. Which combination does the module actually support?", "options": ["Deep 300-word introductions before the answer, so the passage has context to be understood", "Extractable 40-80 word answers under question-shaped headings, plus presence on review sites and third-party mentions off-site", "FAQ schema applied site-wide, plus a higher publishing cadence of category explainers", "Consistent entity data on your own site only, since third-party pages are outside your control"], "answer": 1, "why": "The module calls for answer-first writing of 40-80 self-contained words directly under the question heading, and names third-party mentions - listicles, review sites, directories - as functioning like a ranking signal for LLM retrieval even without a link. Restricting entity consistency to your own site is wrong: answer engines assemble their picture from many sources, and inconsistency makes you a fuzzy entity that does not get cited."}], "cards": [{"front": "How do answer engines work mechanically, and what are the three consequences for SEO?", "back": "Retrieval plus synthesis plus citation. Passages compete rather than pages; one answer replaces ten links s
