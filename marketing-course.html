icate purchase events as the most common cause of impossible-looking ROAS, alongside filtering internal traffic and adding referral exclusions for payment gateways. The cookie-deprecation answer is doubly wrong: Chrome kept third-party cookies, and deprecation would suppress measured conversions rather than inflate them."}, {"q": "A CFO asks which measurement evidence he should weight most heavily when deciding next year's allocation. What does the module say about the three legs of triangulation?", "options": ["Platform attribution, because it is closest to the actual buying event", "Media mix modelling, because it is the only method that includes offline spend", "GA4 data-driven attribution, because it is modelled rather than rules-based", "Independent incrementality testing - senior decision-makers trust it more than MMM or in-platform reporting, so a clean holdout carries more credibility than the prettiest dashboard"], "answer": 3, "why": "The module names three lenses - MMM for the portfolio view including offline, incrementality testing for causal ground truth, and platform attribution for tactical in-flight signal - and states that senior decision-makers trust independent incrementality testing most. MMM is tempting because of its offline coverage, but the module ranks it below incrementality on trust."}], "cards": [{"front": "What is a metric tree and what does it let you say that a raw metric cannot?", "back": "The one metric that matters decomposed into inputs you control - e.g. Revenue = Sessions x Conversion rate x AOV. It tells you where a change came from, turning \"revenue down 20%\" into a ticket someone can pick up."}, {"front": "Name three ways GA4's model differs from Universal Analytics.", "back": "Everything is an event with parameters, and some are key events. There is no old bounce rate - engagement rate instead, from engaged sessions (10+ seconds, a key event, or 2+ pageviews). Sessions are counted differently and will not reconcile."}, {"front": "What does last-click over-credit, and what does view-through over-credit?", "back": "Last-click over-credits capture channels - branded search, retargeting, anything catching people already on their way in. View-through over-credits display and video, where an unseen impression counts as influence."}, {"front": "Name two UTM rules that prevent broken data.", "back": "Lowercase everything, because UTMs are case-sensitive. Never UTM-tag internal links - it starts a new session and destroys attribution. Also: keep a shared list of allowed source and medium values, and auto-tag Google Ads with GCLID."}, {"front": "What is self-reported attribution, what does it catch, and how is it biased?", "back": "A \"How did you hear about us?\" field at checkout or on the lead form. It catches podcast, word-of-mouth and offline exposure no pixel sees, and is biased toward the most recent memorable touch."}, {"front": "What are the six sections of a monthly report a non-marketer can act on?", "back": "Headline number vs target and last month in currency; three cause-and-effect bullets; a channel table with spend, outcomes, cost per outcome and change; what we learned; what we are changing; a confidence note naming where the numbers are shaky."}], "elaborate": ["Build the metric tree for your chosen business two levels deep, mark each node leading or lagging, and circle the two nodes you could actually influence next month. Then write the one sentence you would say in a budget review if the top number fell 20%.", "M10 and M11 both warned that platform-reported numbers overstate branded search and retargeting. Write the confidence note you would append to next month's report for your chosen business, naming the specific places your numbers are shaky and the one test you would run next quarter to shrink that uncertainty."], "transfer": {"scenario": "A subscription box company reports 1,240 orders in Shopify for the month. Meta claims 610 conversions, Google Ads claims 520, and TikTok claims 290 - a total of 1,420. Half of paid traffic in GA4 sits under (other) because campaign links were tagged by three different people with no shared convention. The finance director wants to cut the channel with the worst ROAS, and TikTok's platform ROAS is lowest at 1.4 against Meta's 4.2. The company has never run a holdout test and has no self-reported attribution question at checkout.", "prompt": "Explain to the finance director what the numbers can and cannot prove, and recommend what to do before cutting anything.", "model": "The 1,420 claimed conversions against 1,240 actual orders is not a bug to fix - it is a property of walled gardens self-reporting, each claiming the same conversion. The platform ROAS figures are therefore not comparable, and cutting TikTok on 1.4 versus Meta's 4.2 compares two numbers computed by interested parties on overlapping credit. Meta's is the flattered one, capturing more retargeting and last-click-style credit, which over-credits capture channels. Before cutting: fix the UTM convention - one owner, a closed medium list, lowercase, a shared spreadsheet - because with half of paid traffic in (other) nothing can be reconstructed later. Add the \"How did you hear about us?\" question at checkout; it takes an afternoon and catches what no pixel sees. Then run a geo holdout on TikTok, because incrementality is the only causal evidence here and what senior decision-makers trust most."}}}, {"id": "M14", "num": 14, "part": "p3", "title": "Experimentation and Testing", "short": "Experimentation", "meta": "90 minutes (35 read · 40 exercise · 15 recall)", "minutes": 90, "sections": [{"h": "Why this matters", "html": "<p>M13 ended on an uncomfortable note: no measurement method is true. Experimentation is the exception. A properly randomised test is the only tool in marketing that produces a causal answer rather than a correlational story.<\/p>\n<p>It is also the tool most often used badly. Most \"A/B tests\" in industry are underpowered, stopped early, judged on the wrong metric, or not randomised at all — producing confident conclusions that are noise. Knowing when a test can answer your question, and when you do not have the traffic to run one at all, is a senior skill few people acquire.<\/p>", "text": "M13 ended on an uncomfortable note: no measurement method is true. Experimentation is the exception. A properly randomised test is the only tool in marketing that produces a causal answer rather than a correlational story. It is also the tool most often used badly. Most \"A/B tests\" in industry are underpowered, stopped early, judged on the wrong metric, or not randomised at all — producing confident conclusions that are noise. Knowing when a test can answer your question, and when you do not have the traffic to run one at all, is a senior skill few people acquire."}, {"h": "Core concepts", "html": "<h3>A hypothesis is a sentence with four parts<\/h3>\n<p>Not \"let's try a green button.\" A usable hypothesis reads:<\/p>\n<blockquote>\n<p><strong>Because<\/strong> [evidence], <strong>we expect<\/strong> [specific change] <strong>to cause<\/strong> [effect on one metric], <strong>measured by<\/strong> [metric, over what period].<\/p>\n<\/blockquote>\n<p>Worked: <em>Because 61% of session recordings show users scrolling past the pricing table without stopping, we expect a three-tier comparison with a recommended plan to increase trial starts, measured by trial-start rate per session over four weeks.<\/em><\/p>\n<p>The \"because\" is the part that matters. Tests grounded in evidence — recordings, interviews, support tickets, funnel drop-off — win far more often than tests grounded in an opinion voiced in a meeting. The evidence also tells you what to do next when the test loses.<\/p>\n<h3>Decide the primary metric before you run it<\/h3>\n<p>One primary metric, chosen in writing before launch. Everything else is secondary and cannot, by itself, declare a winner. The reason is arithmetic: if you track ten metrics and accept any one reaching significance, your real false-positive rate is nowhere near 5%. Deciding afterward which metric \"won\" is how organisations accumulate confident falsehoods.<\/p>\n<p>Choose the metric closest to money that the test can plausibly move. A homepage test usually cannot move revenue detectably — the effect is diluted by everything downstream — so the honest primary metric may be click-through to the next step.<\/p>\n<p>Always name <strong>guardrail metrics<\/strong>: things that must not get worse. Refund rate, unsubscribe rate, lead quality, page speed, AOV. A checkout test that lifts conversion 8% while raising refunds 20% is a loss.<\/p>\n<h3>A/B vs multivariate vs before-after<\/h3>\n<p><strong>A/B (and A/B/n)<\/strong> — split traffic randomly between control and variants at the same time. The default, and almost always right.<\/p>\n<p><strong>Multivariate (MVT)<\/strong> — test combinations of several elements at once (headline × image × button) to learn interaction effects. Traffic required multiplies by the number of cells: four elements with two versions each is sixteen. Almost nobody outside large ecommerce has the volume. Use A/B with bolder variants instead.<\/p>\n<p><strong>Before-after<\/strong> — change the page on Tuesday, compare this week to last week. Usually invalid, and the most common thing companies actually do. It is contaminated by everything else that changed: day of week, seasonality, a competitor's promotion, a press mention, a payday. You are measuring your change plus the world. Acceptable only for things that cannot be split — a rebrand, a price change — and then only with a long baseline, an explicit note that the result is not causal, and ideally a geographic control.<\/p>\n<h3>Randomisation is the whole trick<\/h3>\n<p>Random assignment makes the two groups identical in expectation on everything, including things you never thought to measure. Break it and you have nothing. People break it by assigning by day (Mondays get A), by device or geography, by letting the variant load slower so impatient users bounce from one side, or by not persisting assignment so a returning user lands in both groups. On mailing lists, randomise recipients rather than sending A first and B an hour later.<\/p>\n<h3>Sample size and minimum detectable effect<\/h3>\n<p>This is the calculation that kills most test plans, which is why it comes first, not last. Three inputs: <strong>baseline conversion rate<\/strong>, <strong>minimum detectable effect (MDE)<\/strong> — the smallest lift worth detecting — and tolerance for error (conventionally 95% confidence, 80% power).<\/p>\n<p>A rule of thumb for a 50/50 test at those settings:<\/p>\n<pre><code>n per variant ≈ 16 × p × (1 − p) / (MDE in absolute terms)²\n<\/code><\/pre>\n<p><strong>Worked example.<\/strong> Baseline conversion 3%. You want to detect a 10% relative lift, i.e. 3.0% → 3.3%, so the absolute MDE is 0.003.<\/p>\n<pre><code>n ≈ 16 × 0.03 × 0.97 / (0.003)²\n  ≈ 16 × 0.0291 / 0.000009\n  ≈ 0.4656 / 0.000009\n  ≈ 51,700 per variant\n<\/code><\/pre>\n<p>Roughly <strong>103,000 sessions total<\/strong> — and about 3,100 conversions. At 5,000 sessions a week that is twenty weeks. The test is not feasible.<\/p>\n<p>Now notice the shape of the curve. A 20% lift needs about a quarter of that traffic (~26,000 total). A 5% lift needs four times more (~414,000). <strong>Halving the effect you want to detect quadruples the traffic required.<\/strong> This single fact should govern your testing strategy: if you have modest traffic, only test changes big enough to produce big effects.<\/p>\n<h3>Significance and p-values, in plain language<\/h3>\n<p>A p-value is: <em>if the variant made no difference at all, how often would chance alone produce a gap at least this large?<\/em> p = 0.03 means \"a fluke this big happens 3% of the time.\" Below 0.05 is the convention.<\/p>\n<p>What it is not: the probability the variant is better, or a measure of how big the effect is. A significant 0.4% lift can be commercially worthless; a non-significant 15% lift on thin traffic can be worth pursuing.<\/p>\n<p>Report the <strong>confidence interval<\/strong>, not just the verdict. \"Lift +7%, 95% CI −2% to +16%\" tells a decision-maker the truth: probably positive, possibly nothing, worth another look. And <strong>absence of significance is not evidence of no difference<\/strong> — it usually means the test was too small.<\/p>\n<h3>Peeking, and stopping rules<\/h3>\n<p>Checking a running test daily and stopping the moment it crosses 95% is the most common way marketers manufacture false wins: under repeated looks a null test will <em>eventually<\/em> cross the threshold by chance. The significance maths assumes one look at a pre-committed sample size.<\/p>\n<p>Write the stopping rule before launch: run to the calculated sample size, and for at least two full business cycles (whole weeks, never partial ones) so weekday/weekend mix is balanced. Then look once and decide. If you must monitor continuously, use sequential or Bayesian methods designed for it — you are choosing that method, not peeking at a fixed-horizon test. Stopping early for a <em>loss<\/em> that is damaging revenue is a business decision, and fine; just do not record it as a finding.<\/p>\n<h3>Many tests, many false positives<\/h3>\n<p>At 95% confidence, one in twenty null tests reads as a winner. Run forty tests a year with no real effects and expect two celebrated wins that are pure noise — usually the most surprising ones, since surprise correlates with fluke. So replicate anything surprising or strategically important before rolling it out, and distrust segment findings (\"it worked for mobile users in Spain\") that were not pre-specified.<\/p>\n<h3>What to do when you cannot test<\/h3>\n<p>Most companies cannot run valid A/B tests. Under roughly 1,000 conversions a month, almost nothing but a very large effect is detectable. Do not fake it — substitute:<\/p>\n<ul>\n<li><strong>Bigger swings.<\/strong> Test a different offer, page or positioning — not a button colour. Large changes produce detectable effects and teach more per test.<\/li>\n<li><strong>Painted-door and smoke tests.<\/strong> Add the button for the plan that does not exist yet; count clicks; show an honest \"coming soon, want early access?\" You measure demand without building anything.<\/li>\n<li><strong>Qualitative research.<\/strong> Five user tests or five customer interviews find your top three conversion killers faster than any underpowered test. Recordings tell you <em>where<\/em> people fail; interviews tell you <em>why<\/em>.<\/li>\n<li><strong>Best-practice priors.<\/strong> Page speed, a clear value proposition above the fold, fewer form fields, visible pricing, credible social proof. Just implement them.<\/li>\n<li><strong>Holdouts at the account level.<\/strong> For ads, hold out a region or an audience rather than splitting a page (M15).<\/li>\n<\/ul>\n<p>Saying \"we don't have the traffic to test this, so I'm deciding on evidence and judgment, and here's what would change my mind\" is a senior answer. Running the test anyway and reporting a fake 95% is a junior one.<\/p>", "text": "A hypothesis is a sentence with four parts Not \"let's try a green button.\" A usable hypothesis reads: Because [evidence], we expect [specific change] to cause [effect on one metric], measured by [metric, over what period]. Worked: Because 61% of session recordings show users scrolling past the pricing table without stopping, we expect a three-tier comparison with a recommended plan to increase trial starts, measured by trial-start rate per session over four weeks. The \"because\" is the part that matters. Tests grounded in evidence — recordings, interviews, support tickets, funnel drop-off — win far more often than tests grounded in an opinion voiced in a meeting. The evidence also tells you what to do next when the test loses. Decide the primary metric before you run it One primary metric, chosen in writing before launch. Everything else is secondary and cannot, by itself, declare a winner. The reason is arithmetic: if you track ten metrics and accept any one reaching significance, your real false-positive rate is nowhere near 5%. Deciding afterward which metric \"won\" is how organisations accumulate confident falsehoods. Choose the metric closest to money that the test can plausibly move. A homepage test usually cannot move revenue detectably — the effect is diluted by everything downstream — so the honest primary metric may be click-through to the next step. Always name guardrail metrics : things that must not get worse. Refund rate, unsubscribe rate, lead quality, page speed, AOV. A checkout test that lifts conversion 8% while raising refunds 20% is a loss. A/B vs multivariate vs before-after A/B (and A/B/n) — split traffic randomly between control and variants at the same time. The default, and almost always right. Multivariate (MVT) — test combinations of several elements at once (headline × image × button) to learn interaction effects. Traffic required multiplies by the number of cells: four elements with two versions each is sixteen. Almost nobody outside large ecommerce has the volume. Use A/B with bolder variants instead. Before-after — change the page on Tuesday, compare this week to last week. Usually invalid, and the most common thing companies actuall"}, {"h": "How it works in practice", "html": "<p><strong>The test log.<\/strong> Organisations fail to learn from testing because results live in a screenshot in someone's Slack. Keep one shared table, one row per test, permanently:<\/p>\n<table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Date<\/th>\n<th>Area<\/th>\n<th>Hypothesis<\/th>\n<th>Primary metric<\/th>\n<th>MDE<\/th>\n<th>Sample<\/th>\n<th>Result &amp; CI<\/th>\n<th>Decision<\/th>\n<th>What we now believe<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The last column makes it an asset. Not \"variant B won,\" but \"customers respond to risk-reversal more than to discounting — third time we've seen it.\" Losses are entries too; a documented loss stops the same idea being re-proposed every year.<\/p>\n<p><strong>Velocity vs quality.<\/strong> Both fail alone. High velocity with sloppy method produces a fast stream of noise that you then act on — worse than not testing. High quality at four tests a year is too slow to compound. A realistic aim for a small team is a handful of well-formed tests a quarter, plus judgment-based improvements that were never going to be testable.<\/p>\n<p><strong>Prioritise a backlog<\/strong> with ICE (Impact, Confidence, Ease, 1–5, ranked by the product). The scoring is a discussion device, not a formula — its value is forcing you to say how confident you actually are.<\/p>", "text": "The test log. Organisations fail to learn from testing because results live in a screenshot in someone's Slack. Keep one shared table, one row per test, permanently: ID Date Area Hypothesis Primary metric MDE Sample Result &amp; CI Decision What we now believe The last column makes it an asset. Not \"variant B won,\" but \"customers respond to risk-reversal more than to discounting — third time we've seen it.\" Losses are entries too; a documented loss stops the same idea being re-proposed every year. Velocity vs quality. Both fail alone. High velocity with sloppy method produces a fast stream of noise that you then act on — worse than not testing. High quality at four tests a year is too slow to compound. A realistic aim for a small team is a handful of well-formed tests a quarter, plus judgment-based improvements that were never going to be testable. Prioritise a backlog with ICE (Impact, Confidence, Ease, 1–5, ranked by the product). The scoring is a discussion device, not a formula — its value is forcing you to say how confident you actually are."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Platform-side testing is the norm for ads.<\/strong> Meta's A/B tool and Google's experiments handle randomisation, but inherit black-box optimisation: Advantage+ and Performance Max reallocate delivery mid-test, and the platform judges on its own attributed conversions. Treat platform experiments as directional; treat geo holdouts and conversion lift studies as evidence (M15).<\/li>\n<li><strong>AI made variant production nearly free and hypothesis quality the bottleneck.<\/strong> You can generate fifty ad variations in a morning; your traffic did not multiply by fifty. Testing capacity is unchanged — but there is no longer any excuse for a thin creative pipeline.<\/li>\n<li><strong>Personalisation claims deserve the same scrutiny.<\/strong> \"AI-personalised experiences lifted conversion 30%\" is a before-after claim unless there was a holdout. Ask for the holdout.<\/li>\n<li><strong>Measurement gaps affect tests too.<\/strong> Cookies survived, but consent rejection, ad blockers and ITP mean your test population is the measurable subset. Fine for comparing variants — both arms lose data the same way — unless the change itself affects tracking.<\/li>\n<\/ul>", "text": "Platform-side testing is the norm for ads. Meta's A/B tool and Google's experiments handle randomisation, but inherit black-box optimisation: Advantage+ and Performance Max reallocate delivery mid-test, and the platform judges on its own attributed conversions. Treat platform experiments as directional; treat geo holdouts and conversion lift studies as evidence (M15). AI made variant production nearly free and hypothesis quality the bottleneck. You can generate fifty ad variations in a morning; your traffic did not multiply by fifty. Testing capacity is unchanged — but there is no longer any excuse for a thin creative pipeline. Personalisation claims deserve the same scrutiny. \"AI-personalised experiences lifted conversion 30%\" is a before-after claim unless there was a holdout. Ask for the holdout. Measurement gaps affect tests too. Cookies survived, but consent rejection, ad blockers and ITP mean your test population is the measurable subset. Fine for comparing variants — both arms lose data the same way — unless the change itself affects tracking."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>No pre-registered primary metric,<\/strong> so the winner is chosen after the fact from whichever number looks best.<\/li>\n<li><strong>Stopping the moment it hits 95%.<\/strong> Manufactured wins.<\/li>\n<li><strong>Testing trivia.<\/strong> Button colours on 400 sessions a week.<\/li>\n<li><strong>Ignoring MDE<\/strong>, running a test that could never have detected the effect, and concluding \"no difference.\"<\/li>\n<li><strong>Running partial weeks,<\/strong> so Tuesday-heavy traffic decides the outcome.<\/li>\n<li><strong>Not checking the guardrails<\/strong> — lifting leads while destroying lead quality.<\/li>\n<li><strong>Never re-testing a big winner<\/strong> and building strategy on a fluke.<\/li>\n<li><strong>No test log,<\/strong> so the same idea is retested every eighteen months as staff turn over.<\/li>\n<\/ul>", "text": "No pre-registered primary metric, so the winner is chosen after the fact from whichever number looks best. Stopping the moment it hits 95%. Manufactured wins. Testing trivia. Button colours on 400 sessions a week. Ignoring MDE , running a test that could never have detected the effect, and concluding \"no difference.\" Running partial weeks, so Tuesday-heavy traffic decides the outcome. Not checking the guardrails — lifting leads while destroying lead quality. Never re-testing a big winner and building strategy on a fluke. No test log, so the same idea is retested every eighteen months as staff turn over."}, {"h": "Exercise (40 minutes)", "html": "<p>For <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li><strong>Three hypotheses<\/strong> in the because/we-expect/measured-by format, each grounded in a specific piece of evidence you can name. If you have no evidence, your first task is not a test — write down how you would get it.<\/li>\n<li><strong>Sample size reality check.<\/strong> Take your top hypothesis. Write down your real baseline conversion rate and weekly traffic. Compute the sample needed for a 10% relative lift, then for a 25% lift. State how many weeks each would take, and conclude honestly whether you can test at all.<\/li>\n<li><strong>If you cannot test<\/strong>, write the alternative plan: which two of bigger swings / painted door / five user tests / best-practice priors you will use, and what evidence would change your mind afterward.<\/li>\n<li><strong>Design one full test<\/strong>: variant, primary metric, two guardrails, randomisation unit, sample size, duration in whole weeks, stopping rule. One page.<\/li>\n<li><strong>Build the test log<\/strong> with the columns above and enter this test as row one.<\/li>\n<li><strong>Prioritise.<\/strong> Score all three hypotheses on ICE and write one sentence on why the top one is worth the traffic it will consume.<\/li>\n<\/ol>", "text": "For your chosen business : Three hypotheses in the because/we-expect/measured-by format, each grounded in a specific piece of evidence you can name. If you have no evidence, your first task is not a test — write down how you would get it. Sample size reality check. Take your top hypothesis. Write down your real baseline conversion rate and weekly traffic. Compute the sample needed for a 10% relative lift, then for a 25% lift. State how many weeks each would take, and conclude honestly whether you can test at all. If you cannot test , write the alternative plan: which two of bigger swings / painted door / five user tests / best-practice priors you will use, and what evidence would change your mind afterward. Design one full test : variant, primary metric, two guardrails, randomisation unit, sample size, duration in whole weeks, stopping rule. One page. Build the test log with the columns above and enter this test as row one. Prioritise. Score all three hypotheses on ICE and write one sentence on why the top one is worth the traffic it will consume."}, {"h": "Recall (15 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>The four parts of a hypothesis.<\/li>\n<li>Why before-after comparisons are usually invalid, and the two cases where they are acceptable.<\/li>\n<li>What happens to required sample size when you halve the effect you want to detect.<\/li>\n<li>What a p-value of 0.04 does and does not mean.<\/li>\n<li>What peeking does to a test, and what a stopping rule contains.<\/li>\n<li>Four things to do when you lack the traffic to test.<\/li>\n<\/ol>", "text": "Close everything. Write from memory: The four parts of a hypothesis. Why before-after comparisons are usually invalid, and the two cases where they are acceptable. What happens to required sample size when you halve the effect you want to detect. What a p-value of 0.04 does and does not mean. What peeking does to a test, and what a stopping rule contains. Four things to do when you lack the traffic to test."}, {"h": "If you remember one thing", "html": "<p><strong>Run the sample size calculation before you design the test, not after.<\/strong> It tells you whether the question can be answered at all — and if it cannot, the honest move is a bigger change, a qualitative method, or a decision made on judgment with the reasoning written down.<\/p>", "text": "Run the sample size calculation before you design the test, not after. It tells you whether the question can be answered at all — and if it cannot, the honest move is a bigger change, a qualitative method, or a decision made on judgment with the reasoning written down."}], "suggest": [["Why does randomisation give a causal answer when nothing else does?", "How much weekly traffic makes testing possible at all?", "What replaces a test when my numbers are far too small?"], ["Why is the because clause the part that decides a test's worth?", "Turn my checkout drop-off into the four-part hypothesis format", "What counts as evidence if I have no session recordings?"], ["What belongs in the what-we-now-believe column?", "Show me a filled-in test log row for a test that lost", "How do I keep velocity high without the method going sloppy?"], ["Why are Meta's A/B results directional rather than evidence?", "What does PMax reallocating delivery mid-test do to my result?", "Variants are free now: how do I decide which ideas to skip?"], ["Why is stopping the moment it hits 95% a manufactured win?", "Which guardrail metrics should I watch beside lead volume?", "How do I check upfront that a test could detect my effect?"], ["How is the sample size for a 10% relative lift calculated?", "Baseline 2%, 500 visits a week: what can I realistically test?", "The maths says forty weeks. What are my honest options?"], ["What does a p-value of 0.04 specifically not mean?", "In which two cases is a before-after comparison acceptable?", "What has to be inside a stopping rule written in advance?"], ["How do I actually run the sample size calc before designing?", "What does a bigger swing look like instead of a small test?", "How do I write up a judgment call so it stays defensible later?"]], "assess": {"predict": "If a website gets only 400 visitors a week, do you think it can run a useful A/B test? Guess why or why not.", "quiz": [{"q": "Your landing page converts at 4% and gets 6,000 sessions a week. You want to detect a 10 percent relative lift (4.0% to 4.4%) at 95% confidence and 80% power, using n per variant of roughly 16 x p x (1 - p) divided by the absolute MDE squared. What does the calculation say?", "options": ["About 3,840 sessions per variant, roughly a week and a half of traffic.", "About 19,200 sessions per variant, roughly six weeks of traffic.", "About 38,400 sessions per variant, roughly thirteen weeks of total traffic.", "About 153,000 sessions per variant, roughly fifty weeks of traffic."], "answer": 2, "why": "The absolute MDE is 0.004, so n is 16 x 0.04 x 0.96 divided by 0.000016, about 38,400 per variant and roughly 77,000 sessions in total, or about thirteen weeks at 6,000 a week. The tempting error is using the relative 10% figure as the MDE, which gives an absurdly small 3,840 and makes an unfeasible test look like a week's work."}, {"q": "You planned a test at a 20 percent MDE needing about 26,000 sessions in total. Your CMO asks you to make it sensitive enough to catch a 10 percent lift instead. What happens to the traffic requirement?", "options": ["It roughly quadruples, to about 103,000 sessions.", "It roughly doubles, to about 52,000 sessions.", "It is unchanged; MDE affects only how wide the confidence interval ends up being.", "It roughly halves, because a smaller effect is easier to reach significance on."], "answer": 0, "why": "Sample size scales with one over the MDE squared, so halving the effect you want to detect quadruples the traffic required. Doubling feels intuitive because the effect halved, but the relationship is quadratic, and this single fact should govern testing strategy on modest traffic."}, {"q": "A test was planned for four weeks and 40,000 sessions. On day nine the variant is at plus 12 percent with p = 0.04, and the head of growth wants to ship it now. What is the right call?", "options": ["Ship it. A p-value of 0.04 is below 0.05, so the result is valid whenever you looked at it.", "Ship it, then re-run the same test on the other half of traffic to confirm.", "Stop and rebuild it as a multivariate test to find which element drove the lift.", "Keep it running to the pre-committed sample size and at least two whole weeks, then look once and decide."], "answer": 3, "why": "The significance maths assumes one look at a pre-committed sample size; under repeated daily looks a null test will eventually cross 95% by chance, which is how marketers manufacture false wins. Shipping because 0.04 is below 0.05 ignores that the threshold was reached during peeking, not at the planned horizon."}, {"q": "A test reports a 15 percent lift with p = 0.09 and a 95% confidence interval running from minus 3 percent to plus 33 percent. What should you conclude?", "options": ["There is a 9 percent chance the variant is better than the control.", "The data are consistent with anything from a small loss to a large gain, so this is worth pursuing rather than filing as no difference.", "The variant has been shown to make no difference, so drop the idea.", "The effect is real but too small to be commercially interesting."], "answer": 1, "why": "The interval is the honest report: probably positive, possibly nothing, worth another look. Absence of significance is not evidence of no difference and usually means the test was too small, so treating p = 0.09 as proof the variant does nothing throws away a potentially valuable finding."}, {"q": "You ran a checkout test with conversion rate as the pre-registered primary metric and refund rate and AOV as named guardrails. Conversion is up 8 percent and significant, refunds are up 20 percent, and AOV is up 3 percent but not significant. What do you do?", "options": ["Ship it. Conversion was the primary metric and it won.", "Ship it and lead the report with the AOV improvement.", "Record it as a loss, investigate the refunds, and do not ship until you understand them.", "Re-analyse with AOV as the primary metric, since AOV is closer to money."], "answer": 2, "why": "A guardrail is a thing that must not get worse, and a conversion lift bought with a 20 percent rise in refunds is a loss for the business. Shipping on the primary metric alone is the common error, and switching the primary metric after the fact is exactly how organisations accumulate confident falsehoods."}, {"q": "Your business produces about 300 conversions a month and the team wants to build an A/B testing programme. What is the senior response?", "options": ["Below roughly 1,000 conversions a month almost nothing but a very large effect is detectable, so use bigger swings, painted-door tests, five user interviews and best-practice priors, and write down the reasoning.", "Run the tests anyway at 90 percent confidence instead of 95 percent to compensate for the low volume.", "Run tests for six months each so the sample accumulates to a valid size.", "Switch to multivariate testing so each visitor contributes information about several elements at once."], "answer": 0, "why": "Saying you lack the traffic, deciding on evidence and judgment, and stating what would change your mind is the senior answer; running the test anyway and reporting a fake 95 percent is the junior one. Multivariate is the worst option here because required traffic multiplies by the number of cells."}], "cards": [{"front": "What are the four parts of a usable hypothesis?", "back": "Because [evidence], we expect [specific change] to cause [effect on one metric], measured by [metric, over what period]. The because is the part that matters, and it tells you what to do when the test loses."}, {"front": "What happens to required sample size when you halve the effect you want to detect?", "back": "It roughly quadruples, because sample size scales with one over MDE squared. On modest traffic this means only testing changes big enough to produce big effects."}, {"front": "Why are before-after comparisons usually invalid, and when are they acceptable?", "back": "They measure your change plus the world: weekday mix, seasonality, competitor promotions, press. Acceptable only for unsplittable changes such as a rebrand or price change, with a long baseline, an explicit non-causal note and ideally a geographic control."}, {"front": "What does peeking do to a test, and what does a stopping rule contain?", "back": "Repeated looks let a null test eventually cross 95 percent by chance. The rule fixes the sample size, whole business cycles rather than partial weeks, and one look at the end."}, {"front": "You have 400 sessions a week. Name four substitutes for A/B testing.", "back": "Bigger swings in offer, page or positioning; painted-door and smoke tests; five user tests or customer interviews; best-practice priors; account-level holdouts for ads."}, {"front": "What does a p-value of 0.04 mean, and what does it not mean?", "back": "If the variant made no difference, a gap this large would arise by chance 4 percent of the time. It is not the probability the variant is better, and it says nothing about effect size."}], "elaborate": ["Take the single biggest change you would like to make to your chosen business's main page. Write it as a four-part hypothesis grounded in a specific piece of evidence you can name, then compute the sample size for a 10 percent and a 25 percent relative lift using your real baseline rate and weekly traffic. Conclude honestly whether you can test it at all.", "M13 argued that no measurement method is true. Explain in your own words why a randomised test is the exception, then name one decision in your chosen business you will have to make on judgment because the test is not feasible, and write down exactly what evidence would change your mind."], "transfer": {"scenario": "A direct-to-consumer skincare brand gets 5,000 sessions a week and converts at 2.5 percent. The founder wants to test a new homepage hero image and thinks it might produce a 5 percent relative lift. She has generated 40 hero variants with AI, plans to run them all this month, check the dashboard every morning, and ship the first one that crosses 95 percent confidence.", "prompt": "Tell her what the sample size arithmetic says about this plan, and what you would do with the month instead.", "model": "The arithmetic kills the plan. At a 2.5 percent baseline and a 5 percent relative lift the absolute MDE is 0.00125, so n is about 16 x 0.025 x 0.975 divided by 0.00125 squared, roughly 250,000 sessions per variant, half a million in total, or around two years at 5,000 sessions a week. Forty variants make it worse, not better, and shipping the first to cross 95 percent while checking daily manufactures a winner out of noise. So do not run it. Spend the month on a bolder swing, a different offer or hero proposition rather than an image, plus five user tests and a painted-door test for the product she has not built. Put the AI variants where volume actually exists, in the ad account. Record the decision and the evidence that would change it in the test log."}}}, {"id": "M15", "num": 15, "part": "p3", "title": "Budgets, Media Mix, and Incrementality", "short": "Budget & incrementality", "meta": "90 minutes (35 read · 40 exercise · 15 recall)", "minutes": 90, "sections": [{"h": "Why this matters", "html": "<p>This is the module that changes what you are worth. Anyone can run a campaign; the person who decides where the money goes, and defends it to a CFO, is doing the senior job.<\/p>\n<p>The central idea is one sentence: <strong>attribution tells you what happened after a click; it cannot tell you what would have happened without the ad.<\/strong> That gap is where most marketing budgets quietly leak.<\/p>", "text": "This is the module that changes what you are worth. Anyone can run a campaign; the person who decides where the money goes, and defends it to a CFO, is doing the senior job. The central idea is one sentence: attribution tells you what happened after a click; it cannot tell you what would have happened without the ad. That gap is where most marketing budgets quietly leak."}, {"h": "Core concepts", "html": "<h3>How budgets actually get set<\/h3>\n<p><strong>Percent of revenue.<\/strong> A fixed share of last year's or forecast revenue — commonly 5–12% depending on category and margin. Easy, stable, and backwards: it cuts spend exactly when sales fall and you most need demand. A sanity constraint, never a rationale.<\/p>\n<p><strong>Competitive parity.<\/strong> Match a competitor's share of voice. Its merit is that share of voice and share of market track each other over time, so sustained under-investment tends to cost share. Its flaw is assuming your competitor knows what they are doing and shares your objectives, margins and awareness.<\/p>\n<p><strong>Objective-and-task.<\/strong> State the objective, enumerate the tasks, cost each, sum. \"We need 240 new customers per quarter. At a 4% landing page conversion rate and £1.80 CPC, that is 6,000 clicks a month at £10,800, plus £4,000 of creative production, plus £3,000 of brand video to keep the top of the funnel filled.\"<\/p>\n<p><strong>Only objective-and-task survives a hostile question,<\/strong> because every line traces to an assumption you can name and revise. Build the number that way, then sanity-check against the other two. Add a <strong>floor and ceiling<\/strong>: what you would still spend if things went badly, and where you stop even if they go well.<\/p>\n<h3>Allocating across creation and capture<\/h3>\n<p>Capture harvests existing demand; creation makes new demand (M01). Capture is capped — if 4,000 people a month search for what you sell and you already appear for all of it, more money buys higher prices on the same clicks. Creation is uncapped but slow, hard to measure, and the first thing cut in a bad quarter.<\/p>\n<p>The failure pattern is universal enough to name: a company scales capture, hits the ceiling, sees CPA rise, cuts the creation spend that was refilling the pool because it \"doesn't show ROAS,\" and enters a two-quarter decline whose cause is invisible in the attribution report. Watch <strong>branded search volume<\/strong> and <strong>direct traffic<\/strong> as a proxy for the size of the pool; flat or falling while you push harder on capture means you are harvesting a shrinking field.<\/p>\n<h3>Marginal returns and why \"scale what works\" fails<\/h3>\n<p>Every channel has a <strong>saturation curve<\/strong>: strong returns early, diminishing returns as the cheap high-intent audience is exhausted, then flat or negative.<\/p>\n<p>The mistake is reasoning from averages. \"Google Ads returns 4× — put more in.\" But that 4× is the average across all spend, including the first, cheapest, most incremental pounds.<\/p>\n<pre><code>Spend/mo   Total revenue   Marginal revenue on last £2k\n£2,000     £14,000         £14,000  (7.0×)\n£4,000     £22,000         £8,000   (4.0×)\n£6,000     £27,000         £5,000   (2.5×)\n£8,000     £29,500         £2,500   (1.25×)\n<\/code><\/pre>\n<p>Average ROAS at £8k is 3.7× — healthy-looking. The last £2,000 returned 1.25×, likely below break-even on margin. <strong>The right allocation equalises marginal return across channels<\/strong>, not average return. You approximate it by stepping spend up or down and watching what the increment does — which requires holdouts, because attribution will credit incremental spend with conversions that were coming anyway.<\/p>\n<h3>Incrementality<\/h3>\n<p><strong>Incremental conversions are the ones that would not have happened without the ad.<\/strong> Everything else is spend you would have got for free. The only reliable way to know is to withhold advertising from a comparable group.<\/p>\n<p><strong>Geo holdouts.<\/strong> Split regions into treatment and control matched on baseline sales — many small regions randomised, not \"the North vs the South.\" Advertise normally in treatment, not at all in control, for four to eight weeks, and compare total sales from your own books. The workhorse: platform-independent, works for offline and multi-channel businesses, and legible to a CFO because it is just \"these towns got ads, those didn't.\"<\/p>\n<p><strong>PSA and ghost ads.<\/strong> The control group sees a public-service ad, or — better — has the ad withheld while the platform records that it would have been shown. Ghost ads avoid the PSA's bias, since a PSA still occupies the impression, but need platform support.<\/p>\n<p><strong>Conversion lift studies.<\/strong> The platforms' own randomised experiments. Far better than attribution, but the platform grades its own homework, tests are restricted to its inventory, minimum spends are meaningful, and results use its own conversion definitions.<\/p>\n<p><strong>Switch-back tests.<\/strong> Alternate weeks on and off. Cheap, but weak: confounded by seasonality, and carryover contaminates the off weeks.<\/p>\n<p><strong>A cheap holdout anyone can run.<\/strong> Take your smallest plausibly-representative slice — one region, 10% of your email list, one retargeting audience — and turn the spend off for four full weeks. Track conversions from that slice in your own database, comparing to its share over the prior twelve weeks and to the rest of the business over the same four weeks, which controls for seasonality. Not publishable; it will still catch the largest waste in your account. Be honest about power (M14): a holdout on 30 conversions a month proves nothing.<\/p>\n<h3>Where non-incremental spend hides<\/h3>\n<p><strong>Branded search.<\/strong> Someone types your brand, clicks the ad, buys, and last-click credits the ad with the full sale — but most of those people were coming regardless. They typed your name.<\/p>\n<p>Worked illustration: £3,000/month on branded search reports 400 conversions, a £7.50 CPA that looks like the best line in the account. A four-week geo holdout pauses it, and conversions in the holdout regions fall 12%, not 100%. Incremental conversions are ~48, not 400, so true incremental CPA is ~£62.50. That is a different decision.<\/p>\n<p>It does not follow that you switch it off. Defensible reasons to keep it: competitors bidding on your name, control of the message and sitelinks, marketplaces outranking you. But you are now buying insurance at a known price rather than \"the best CPA in the account.\"<\/p>\n<p><strong>Retargeting.<\/strong> Same logic, sharper — you advertise to people who already visited and were already likely to return. It produces the most flattering number in digital marketing and is often among the least incremental. Test these two first.<\/p>\n<h3>Media mix modelling<\/h3>\n<p><strong>MMM<\/strong> is a statistical model — typically regression on weekly aggregated data — relating sales to spend by channel plus controls for price, promotions, seasonality and competitor activity. It estimates each channel's contribution plus adstock (carryover) and saturation curves.<\/p>\n<p><strong>It needs<\/strong> two to three years of weekly data, real variation in spend by channel (spend identically every week and it learns nothing), and clean records of promotions and price changes. Most small businesses fail that requirement, and no software fixes it.<\/p>\n<p><strong>Good at:<\/strong> the portfolio view including offline, TV and PR; long-term effects; working without user-level tracking, so it is immune to cookies, consent and iOS; answering \"what if we move £200k from X to Y.\" <strong>Bad at:<\/strong> anything tactical, highly correlated channels (always run TV and YouTube together and it cannot separate them), new channels, and small businesses. It overfits easily into a confident wrong answer.<\/p>\n<p>Open-source options — <strong>Google's Meridian<\/strong> and <strong>Meta's Robyn<\/strong> — lower the cost but not the data requirement or the analytical skill. Calibrating an MMM with incrementality results is standard practice and materially improves trust in it.<\/p>\n<h3>Triangulation: the 2026 standard<\/h3>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Answers<\/th>\n<th>Cadence<\/th>\n<th>Weakness<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MMM<\/strong><\/td>\n<td>How the whole portfolio contributes, including offline<\/td>\n<td>Quarterly<\/td>\n<td>Needs years of data; not tactical<\/td>\n<\/tr>\n<tr>\n<td><strong>Incrementality tests<\/strong><\/td>\n<td>Is this spend causing anything?<\/td>\n<td>A few per year<\/td>\n<td>Costs volume; narrow scope<\/td>\n<\/tr>\n<tr>\n<td><strong>Platform attribution<\/strong><\/td>\n<td>Which creative or audience to change now<\/td>\n<td>Daily/weekly<\/td>\n<td>Systematically over-claims<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Senior decision-makers trust independent incrementality testing most, MMM second, in-platform reporting least. Order your own confidence the same way. When the three disagree, that tells you where to run the next test.<\/p>\n<h3>Short and long term<\/h3>\n<p>Advertising produces an immediate sales response and a slower accumulation of memory that makes future marketing cheaper. Activation without brand shows good short-term numbers and quietly rising CPAs; brand without activation looks unaccountable and gets cut.<\/p>\n<p>The widely-cited heuristic is roughly <strong>60% brand / 40% activation<\/strong> for established consumer brands — a reference point, not a law. It shifts toward activation for B2B (commonly cited nearer 50/50), for small companies needing cash this quarter, and in a crisis; toward brand when you have distribution but low awareness, when CPAs climb at flat volume, or when building pricing power. The split is a decision you argue for, not a number you inherit.<\/p>", "text": "How budgets actually get set Percent of revenue. A fixed share of last year's or forecast revenue — commonly 5–12% depending on category and margin. Easy, stable, and backwards: it cuts spend exactly when sales fall and you most need demand. A sanity constraint, never a rationale. Competitive parity. Match a competitor's share of voice. Its merit is that share of voice and share of market track each other over time, so sustained under-investment tends to cost share. Its flaw is assuming your competitor knows what they are doing and shares your objectives, margins and awareness. Objective-and-task. State the objective, enumerate the tasks, cost each, sum. \"We need 240 new customers per quarter. At a 4% landing page conversion rate and £1.80 CPC, that is 6,000 clicks a month at £10,800, plus £4,000 of creative production, plus £3,000 of brand video to keep the top of the funnel filled.\" Only objective-and-task survives a hostile question, because every line traces to an assumption you can name and revise. Build the number that way, then sanity-check against the other two. Add a floor and ceiling : what you would still spend if things went badly, and where you stop even if they go well. Allocating across creation and capture Capture harvests existing demand; creation makes new demand (M01). Capture is capped — if 4,000 people a month search for what you sell and you already appear for all of it, more money buys higher prices on the same clicks. Creation is uncapped but slow, hard to measure, and the first thing cut in a bad quarter. The failure pattern is universal enough to name: a company scales capture, hits the ceiling, sees CPA rise, cuts the creation spend that was refilling the pool because it \"doesn't show ROAS,\" and enters a two-quarter decline whose cause is invisible in the attribution report. Watch branded search volume and direct traffic as a proxy for the size of the pool; flat or falling while you push harder on capture means you are harvesting a shrinking field. Marginal returns and why \"scale what works\" fails Every channel has a saturation curve : strong returns early, diminishing returns as the cheap high-intent audience is exhausted, then flat o"}, {"h": "How it works in practice", "html": "<h3>A worked reallocation<\/h3>\n<p>Ecommerce, £40,000/month, 60% gross margin, break-even ROAS 1.67×.<\/p>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>Spend<\/th>\n<th>Reported ROAS<\/th>\n<th>Evidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Branded search<\/td>\n<td>£4,000<\/td>\n<td>9.0×<\/td>\n<td>No holdout ever run<\/td>\n<\/tr>\n<tr>\n<td>Non-brand search<\/td>\n<td>£12,000<\/td>\n<td>3.1×<\/td>\n<td>Marginal ROAS on last £3k: 1.9×<\/td>\n<\/tr>\n<tr>\n<td>Meta prospecting<\/td>\n<td>£14,000<\/td>\n<td>1.8×<\/td>\n<td>Geo holdout showed real lift<\/td>\n<\/tr>\n<tr>\n<td>Retargeting<\/td>\n<td>£6,000<\/td>\n<td>6.5×<\/td>\n<td>No holdout ever run<\/td>\n<\/tr>\n<tr>\n<td>Creative production<\/td>\n<td>£2,000<\/td>\n<td>—<\/td>\n<td>Two new concepts/month<\/td>\n<\/tr>\n<tr>\n<td>Brand video<\/td>\n<td>£2,000<\/td>\n<td>—<\/td>\n<td>Cut last quarter, being restored<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol>\n<li><strong>Run the cheap holdouts first.<\/strong> Four weeks: retargeting off in one matched region, branded search off in another. Suppose retargeting comes back 30% incremental, branded search 15%.<\/li>\n<li><strong>Re-price the flattering lines.<\/strong> Retargeting's true ROAS is ~1.95× (6.5 × 0.30), barely above break-even. Branded search's is ~1.35× — below it, but partly insurance.<\/li>\n<li><strong>Reallocate.<\/strong> Retargeting £6,000 → £3,000 (tighter window, exclude recent purchasers); branded search £4,000 → £2,500, keeping defensive coverage on the highest-risk terms. That frees £4,500.<\/li>\n<li><strong>Do not put it all in the best-looking channel.<\/strong> Non-brand search is already at 1.9× marginal. Put £1,500 into Meta prospecting, where the holdout showed real lift and the curve is not yet flat; £1,500 into creative production, the main lever left in an Advantage+/PMax world; £1,500 into brand video, which refills the pool branded search harvests.<\/li>\n<li><strong>Commit to the check.<\/strong> Watch total revenue and blended CAC — total spend divided by all new customers — for eight weeks. Blended CAC cannot be gamed by reallocating credit.<\/li>\n<\/ol>\n<p>Note what happened: reported total ROAS <em>fell<\/em>, because you moved money out of the channels best at claiming credit. If you cannot explain that in advance, do not make the move — you will be blamed for the dashboard.<\/p>\n<p><strong>Defending it.<\/strong> A CFO wants four things: the objective the money buys, the assumptions behind each line, what you cut first at −20%, and how you will know if it worked. Bring a one-page table — channel, spend, purpose, expected outcome, confidence, evidence type — and state uncertainty explicitly. \"Meta prospecting: £15,500, demand creation, ~340 new customers, medium confidence, based on a geo holdout in May\" earns more trust than a precise-looking forecast with no provenance.<\/p>", "text": "A worked reallocation Ecommerce, £40,000/month, 60% gross margin, break-even ROAS 1.67×. Channel Spend Reported ROAS Evidence Branded search £4,000 9.0× No holdout ever run Non-brand search £12,000 3.1× Marginal ROAS on last £3k: 1.9× Meta prospecting £14,000 1.8× Geo holdout showed real lift Retargeting £6,000 6.5× No holdout ever run Creative production £2,000 — Two new concepts/month Brand video £2,000 — Cut last quarter, being restored Run the cheap holdouts first. Four weeks: retargeting off in one matched region, branded search off in another. Suppose retargeting comes back 30% incremental, branded search 15%. Re-price the flattering lines. Retargeting's true ROAS is ~1.95× (6.5 × 0.30), barely above break-even. Branded search's is ~1.35× — below it, but partly insurance. Reallocate. Retargeting £6,000 → £3,000 (tighter window, exclude recent purchasers); branded search £4,000 → £2,500, keeping defensive coverage on the highest-risk terms. That frees £4,500. Do not put it all in the best-looking channel. Non-brand search is already at 1.9× marginal. Put £1,500 into Meta prospecting, where the holdout showed real lift and the curve is not yet flat; £1,500 into creative production, the main lever left in an Advantage+/PMax world; £1,500 into brand video, which refills the pool branded search harvests. Commit to the check. Watch total revenue and blended CAC — total spend divided by all new customers — for eight weeks. Blended CAC cannot be gamed by reallocating credit. Note what happened: reported total ROAS fell , because you moved money out of the channels best at claiming credit. If you cannot explain that in advance, do not make the move — you will be blamed for the dashboard. Defending it. A CFO wants four things: the objective the money buys, the assumptions behind each line, what you cut first at −20%, and how you will know if it worked. Bring a one-page table — channel, spend, purpose, expected outcome, confidence, evidence type — and state uncertainty explicitly. \"Meta prospecting: £15,500, demand creation, ~340 new customers, medium confidence, based on a geo holdout in May\" earns more trust than a precise-looking forecast with no provenance."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Cookies did not die.<\/strong> Chrome kept third-party cookies (confirmed April 2025), and most Privacy Sandbox technologies were retired in October 2025 — deprecated in Chrome 144 (January 2026), removal targeted for Chrome 150 (July 2026). GDPR and ePrivacy obligations are unchanged. The measurement gap comes from consent rejection, ITP, ad blockers and ATT — strengthening the case for geo tests and MMM, neither of which needs user-level data.<\/li>\n<li><strong>Black-box buying moved the budget question up a level.<\/strong> With Performance Max and Advantage+ the algorithm allocates to keywords and placements, not you. You still control how much each campaign gets, what conversion it optimises toward, which first-party data it learns from, and the creative and offer — so allocation and incrementality are a <em>larger<\/em> share of the job than five years ago.<\/li>\n<li><strong>Zero-click search lowers the capture ceiling.<\/strong> With ~60% of Google searches ending without a click and AI Overviews cutting top-position organic CTR sharply, the harvestable pool is shrinking — pushing sensible allocation toward creation and toward being the brand people search for by name.<\/li>\n<\/ul>", "text": "Cookies did not die. Chrome kept third-party cookies (confirmed April 2025), and most Privacy Sandbox technologies were retired in October 2025 — deprecated in Chrome 144 (January 2026), removal targeted for Chrome 150 (July 2026). GDPR and ePrivacy obligations are unchanged. The measurement gap comes from consent rejection, ITP, ad blockers and ATT — strengthening the case for geo tests and MMM, neither of which needs user-level data. Black-box buying moved the budget question up a level. With Performance Max and Advantage+ the algorithm allocates to keywords and placements, not you. You still control how much each campaign gets, what conversion it optimises toward, which first-party data it learns from, and the creative and offer — so allocation and incrementality are a larger share of the job than five years ago. Zero-click search lowers the capture ceiling. With ~60% of Google searches ending without a click and AI Overviews cutting top-position organic CTR sharply, the harvestable pool is shrinking — pushing sensible allocation toward creation and toward being the brand people search for by name."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Allocating on average ROAS<\/strong> instead of marginal return.<\/li>\n<li><strong>Scaling the channel with the best reported number,<\/strong> usually the least incremental one.<\/li>\n<li><strong>Never running a single holdout,<\/strong> then arguing about attribution models for years.<\/li>\n<li><strong>Cutting brand spend in a downturn<\/strong> and mistaking the following two quarters' decline for a market problem.<\/li>\n<li><strong>Setting the budget as a percentage<\/strong> and having no argument when asked why.<\/li>\n<li><strong>Judging an MMM by how good the numbers look<\/strong> rather than whether spend varied enough for it to learn.<\/li>\n<li><strong>Reallocating and then judging it on channel ROAS,<\/strong> which will get worse by construction.<\/li>\n<\/ul>", "text": "Allocating on average ROAS instead of marginal return. Scaling the channel with the best reported number, usually the least incremental one. Never running a single holdout, then arguing about attribution models for years. Cutting brand spend in a downturn and mistaking the following two quarters' decline for a market problem. Setting the budget as a percentage and having no argument when asked why. Judging an MMM by how good the numbers look rather than whether spend varied enough for it to learn. Reallocating and then judging it on channel ROAS, which will get worse by construction."}, {"h": "Exercise (40 minutes)", "html": "<p>For <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li><strong>Build the budget objective-and-task style.<\/strong> From a customer or revenue target, back through your M05 funnel rates, costing each line. Compare the total to a percent-of-revenue sanity check.<\/li>\n<li><strong>Split creation vs capture<\/strong> and justify the ratio in two sentences, given your awareness level, category and cash position.<\/li>\n<li><strong>Sketch the saturation curve<\/strong> for your largest channel and mark where marginal return crosses break-even ROAS or max CPA.<\/li>\n<li><strong>Design one cheap holdout:<\/strong> which slice, how long, what you measure from your own data, what result would change your allocation, and what it costs in forgone sales. Pick branded search or retargeting if you run either.<\/li>\n<li><strong>Do a reallocation.<\/strong> Move at least 10% of the budget in a before/after table with reasoning per line and the expected effect on total revenue and blended CAC — including whether reported ROAS will fall.<\/li>\n<li><strong>Write the CFO page:<\/strong> objective, allocation table with purpose and confidence per line, what you cut first at −20%, and how you will know in 90 days.<\/li>\n<\/ol>", "text": "For your chosen business : Build the budget objective-and-task style. From a customer or revenue target, back through your M05 funnel rates, costing each line. Compare the total to a percent-of-revenue sanity check. Split creation vs capture and justify the ratio in two sentences, given your awareness level, category and cash position. Sketch the saturation curve for your largest channel and mark where marginal return crosses break-even ROAS or max CPA. Design one cheap holdout: which slice, how long, what you measure from your own data, what result would change your allocation, and what it costs in forgone sales. Pick branded search or retargeting if you run either. Do a reallocation. Move at least 10% of the budget in a before/after table with reasoning per line and the expected effect on total revenue and blended CAC — including whether reported ROAS will fall. Write the CFO page: objective, allocation table with purpose and confidence per line, what you cut first at −20%, and how you will know in 90 days."}, {"h": "Recall (15 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Three ways budgets get set, and which is defensible.<\/li>\n<li>Why \"scale what works\" fails, in terms of average vs marginal return.<\/li>\n<li>What an incremental conversion is, and three ways to measure it.<\/li>\n<li>The two places non-incremental spend hides, and why.<\/li>\n<li>What MMM needs, one thing it is good at, one it is bad at.<\/li>\n<li>The three legs of triangulation, ranked by trust.<\/li>\n<li>The 60/40 heuristic and two conditions that shift it.<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Three ways budgets get set, and which is defensible. Why \"scale what works\" fails, in terms of average vs marginal return. What an incremental conversion is, and three ways to measure it. The two places non-incremental spend hides, and why. What MMM needs, one thing it is good at, one it is bad at. The three legs of triangulation, ranked by trust. The 60/40 heuristic and two conditions that shift it."}, {"h": "If you remember one thing", "html": "<p><strong>Attribution tells you what happened after a click; only a holdout tells you what would have happened without the ad.<\/strong> Before you scale the channel with the best reported return, turn it off somewhere and find out what you actually bought.<\/p>", "text": "Attribution tells you what happened after a click; only a holdout tells you what would have happened without the ad. Before you scale the channel with the best reported return, turn it off somewhere and find out what you actually bought."}], "suggest": [["What exactly is the gap between attribution and the counterfactual?", "Show me a case where attribution looked great but the ad added nothing", "How do I defend a budget to a CFO when I have no holdout yet?"], ["Why is percent-of-revenue a sanity constraint and not a rationale?", "Walk me through building a budget objective-and-task style, with numbers", "When does share-of-voice parity mislead a business much smaller than rivals?"], ["How was the break-even ROAS of 1.67x derived from a 60% gross margin?", "If retargeting is only 30% incremental, where should that £6k go?", "How would this reallocation change on a £3,000/month budget like mine?"], ["Why do geo tests and MMM survive consent rejection, ITP and ATT?", "What does a geo holdout look like when PMax controls the placements?", "How big must my consent-rejection gap get before it distorts decisions?"], ["Why does channel ROAS get worse by construction after a good reallocation?", "Give me numbers where average ROAS hides a terrible marginal return", "How do I spot non-incremental spend hiding in my own account?"], ["How do I sketch a saturation curve without much historical spend data?", "What creation vs capture split fits a low-awareness new category?", "Help me design one cheap holdout I could actually run in four weeks"], ["Rank the three legs of triangulation by trust, and tell me why", "Which two conditions shift the 60/40 creation-capture heuristic?", "Quiz me on the two places non-incremental spend hides"], ["What counts as a valid 'somewhere' to switch a channel off?", "What would turning off branded search for four weeks actually cost me?", "How do I persuade a boss to switch off a 9x reported-ROAS channel?"]], "assess": {"predict": "Your ad report says the ads on your own brand name deliver your cheapest cost per sale. Guess one reason that number might be misleading.", "quiz": [{"q": "A channel returns £27,000 of revenue at £6,000 of monthly spend and £29,500 at £8,000. Your gross margin is 40 percent, so break-even ROAS is 2.5x. Do you keep the last £2,000?", "options": ["Yes. Average ROAS at £8,000 is 3.7x, comfortably above break-even.", "No. The last £2,000 returned £2,500, a marginal 1.25x, well below the 2.5x break-even.", "Yes. Total revenue still rose, so the increment added money to the business.", "You cannot tell without an MMM, because marginal return is not observable."], "answer": 1, "why": "Allocation decisions are made on marginal return, not average. The 3.7x average includes the first, cheapest, most incremental pounds, so it hides the fact that the last increment lost money on margin; and you approximate marginal return by stepping spend up and down and watching, not by commissioning a model."}, {"q": "Branded search takes £3,000 a month and reports 400 conversions, a £7.50 CPA that looks like the best line in the account. A four-week geo holdout pauses it and conversions in the holdout regions fall 12 percent, not 100 percent. What follows?", "options": ["About 48 conversions were incremental, so the true incremental CPA is around £62.50 and keeping it becomes an insurance decision at a known price.", "About 352 conversions were incremental, so the CPA is around £8.50 and nothing changes.", "The holdout proves branded search is worthless and it should be switched off.", "A 12 percent drop is within noise, so the reported £7.50 CPA stands."], "answer": 0, "why": "Twelve percent of 400 is about 48 incremental conversions, so £3,000 divided by 48 is roughly £62.50, an entirely different decision from £7.50. Switching it off does not follow: competitors bidding on your name, control of message and sitelinks, and marketplaces outranking you are defensible reasons to keep buying it, now priced honestly."}, {"q": "MMM, incrementality tests and platform attribution disagree about a channel. How should you rank your confidence?", "options": ["Platform attribution first, because it is closest to the daily decisions and updates fastest.", "MMM first, because it sees the whole portfolio including offline.", "Independent incrementality testing first, MMM second, in-platform reporting last.", "All three equally, averaging their estimates to get a balanced view."], "answer": 2, "why": "Senior decision-makers trust independent incrementality testing most, MMM second and in-platform reporting least, because platform attribution systematically over-claims. MMM sounds like the most authoritative choice, but it is not tactical and overfits easily; when the three disagree, that disagreement tells you where to run the next test."}, {"q": "An ecommerce business has two years of weekly data and has spent almost exactly £5,000 on Meta and £3,000 on Google every single week throughout. It wants to commission an MMM. What do you tell them?", "options": ["Two years of weekly data clears the bar, so the model will work.", "Meridian or Robyn will handle it, because open-source models cope with thin variation.", "It will work for the online channels but not for anything offline.", "It will learn very little, because MMM needs real variation in spend by channel and identical weekly spend gives the model nothing to separate."], "answer": 3, "why": "MMM needs two to three years of weekly data, real variation in spend by channel, and clean records of promotions and price changes; spend identically every week and it learns nothing. The data-length requirement is met here, which is why this case is tempting, but no software fixes missing variation, and judging an MMM on how good the numbers look rather than whether spend varied is a listed mistake."}, {"q": "You are about to move £4,500 out of retargeting and branded search into Meta prospecting, creative production and brand video. What must you tell the CFO before you do it?", "options": ["That reported total ROAS should rise within four weeks as the money goes to better channels.", "That reported total ROAS will fall by construction, and that the decision will be judged on total revenue and blended CAC over eight weeks.", "That you will judge each destination channel on its own reported ROAS from now on.", "That attribution will become more accurate once the flattering channels are smaller."], "answer": 1, "why": "Reported ROAS falls because you moved money out of the channels best at claiming credit; if you cannot explain that in advance you will be blamed for the dashboard. Blended CAC, total spend divided by all new customers, is the check that cannot be gamed by reallocating credit."}, {"q": "A consumer brand has flat sales volume, rising CPAs and falling branded search volume. The growth lead proposes cutting all brand video to fund more non-brand search. What is the judgment?", "options": ["Correct. Brand spend has no measurable ROAS, so it should be the first line cut.", "Correct. The 60/40 heuristic applies only to large established brands, so activation should take everything.", "Wrong. Rising CPAs at flat volume with falling branded search suggest the demand pool is shrinking, which argues for shifting toward brand, not away from it.", "Neither. Freeze the budget at a percentage of revenue until CPAs stabilise."], "answer": 2, "why": "Branded search volume and direct traffic are the proxy for the size of the demand pool; flat or falling while you push harder on capture means you are harvesting a shrinking field. This is the named failure pattern - cut creation, then blame the market for the two-quarter decline - and the 60/40 split shifts toward brand when CPAs climb at flat volume."}], "cards": [{"front": "Why does scaling the channel with the best reported return fail?", "back": "It reasons from average ROAS, which includes the first and most incremental pounds. Correct allocation equalises marginal return across channels, and marginal return only becomes visible through holdouts."}, {"front": "What is an incremental conversion, and name three ways to measure incrementality?", "back": "One that would not have happened without the ad. Geo holdouts, PSA or ghost ads, platform conversion lift studies, and switch-back tests, which are cheap but weak."}, {"front": "Where does non-incremental spend hide, and why?", "back": "Branded search and retargeting. Both advertise to people already coming: one typed your name, the other already visited. They produce the most flattering reported numbers in the account, so test them first."}, {"front": "What does MMM need, and name one thing it is good at and one it is bad at?", "back": "Two to three years of weekly data, real variation in spend by channel, clean promotion and price records. Good at the portfolio view including offline and long-term effects; bad at tactical questions, correlated channels and small businesses."}, {"front": "Which budget-setting method survives a hostile question, and why?", "back": "Objective-and-task. State the objective, enumerate the tasks, cost each, sum. Every line traces to a named assumption you can revise. Sanity-check against percent of revenue and competitive parity, then set a floor and ceiling."}, {"front": "What are the three legs of triangulation and what does each answer?", "back": "MMM: how the whole portfolio contributes, quarterly. Incrementality tests: is this spend causing anything, a few per year. Platform attribution: what to change now, daily, and it over-claims systematically."}], "elaborate": ["Pick the most flattering line in your chosen business's ad account, the one with the best reported return. Design the cheapest holdout that could test it: which slice, how many weeks, what you will measure from your own records rather than the platform's, what result would change your allocation, and what it costs in forgone sales.", "M14 argued you probably lack the traffic for a valid A/B test. Explain why a geo holdout can still be a workable method for the same business, and what M14's power argument implies about running a holdout on a slice that produces 30 conversions a month."], "transfer": {"scenario": "An ecommerce account spends £25,000 a month at 55 percent gross margin, so break-even ROAS is about 1.8x. Retargeting takes £5,000 at a reported 7.0x with no holdout ever run. Non-brand search takes £12,000 at a reported 3.0x, with marginal ROAS on the last £3,000 measured at 1.9x, and Meta prospecting takes £6,000 at a reported 1.6x with a May geo holdout showing real lift. Creative production takes the remaining £2,000. The CEO wants to move £3,000 out of Meta prospecting into retargeting because retargeting is the best channel.", "prompt": "Decide whether to make the move, and write what you would say to the CEO.", "model": "I would not make that move. Retargeting's 7.0x is reported, not incremental, and it advertises to people who already visited, which is exactly where non-incremental spend hides. Before any money moves toward it, run a four-week holdout in one matched region. If it returns 30 percent incremental, a common result, its true return is about 2.1x against a 1.8x break-even, barely worth the spend, and money should be leaving it rather than arriving. Meta prospecting is the only line with holdout evidence of real lift, and non-brand search is already at 1.9x on its last £3,000, so it cannot absorb more either. I would tell the CEO in advance that if we reallocate correctly the reported total ROAS will fall by construction, and that we will judge the decision on total revenue and blended CAC over eight weeks."}}}, {"id": "M16", "num": 16, "part": "p3", "title": "B2B vs B2C and Sales Alignment", "short": "B2B vs B2C", "meta": "60 minutes (25 read · 25 exercise · 10 recall)", "minutes": 60, "sections": [{"h": "Why this matters", "html": "<p>Everything in Parts 1 and 2 applies to both, but the <em>shape<\/em> of the problem differs enough that applying B2C instincts to a B2B business — or the reverse — reliably wastes a year.<\/p>\n<p>There is also a practical reason. Most well-paid marketing jobs are in B2B, and most beginners arrive with only the consumer intuitions they have from being consumers. Talking fluently about buying committees, pipeline math and an MQL SLA is a large share of what makes a junior candidate sound credible.<\/p>", "text": "Everything in Parts 1 and 2 applies to both, but the shape of the problem differs enough that applying B2C instincts to a B2B business — or the reverse — reliably wastes a year. There is also a practical reason. Most well-paid marketing jobs are in B2B, and most beginners arrive with only the consumer intuitions they have from being consumers. Talking fluently about buying committees, pipeline math and an MQL SLA is a large share of what makes a junior candidate sound credible."}, {"h": "Core concepts", "html": "<h3>Buying committees: nobody buys alone<\/h3>\n<p>In consumer marketing you persuade one person. In B2B, any purchase of size involves a group — commonly cited research on complex B2B buying puts typical committees in the range of six to eleven people, more for enterprise. Each has a different question:<\/p>\n<ul>\n<li><strong>Economic buyer:<\/strong> what is the return, and what is the risk to me?<\/li>\n<li><strong>User / champion:<\/strong> does this improve my daily work, and can I sell it internally?<\/li>\n<li><strong>Technical evaluator:<\/strong> does it integrate, and is it secure?<\/li>\n<li><strong>Procurement:<\/strong> price, terms, contract risk.<\/li>\n<li><strong>Security / legal:<\/strong> what could go wrong?<\/li>\n<li><strong>The blocker:<\/strong> often whoever owns the process you are replacing.<\/li>\n<\/ul>\n<p>Two consequences. <strong>One message cannot serve all of them<\/strong> — you need a message hierarchy (M03) with a per-role layer, plus assets the champion can forward. And <strong>the most common outcome is not losing to a competitor; it is no decision.<\/strong> Committees default to inaction because inaction is safe. Marketing that only differentiates against competitors, never against doing nothing, loses most of the time.<\/p>\n<p>Consensus is the constraint: the more people who must agree, the more risk-reduction material you need — case studies from similar companies, security documentation, implementation timelines, references.<\/p>\n<h3>Long cycles change what marketing is for<\/h3>\n<p>A 3-, 6- or 18-month cycle means months of forgetting sit between first contact and purchase. Marketing's job becomes <strong>being remembered and being findable when the trigger fires<\/strong>, not converting today.<\/p>\n<p>This is what the <strong>95-5 rule<\/strong> describes: at any moment only a small share of potential buyers — the commonly cited figure is around 5% — are in-market. It is a heuristic from B2B advertising research, not a constant, and the true share depends on cycle length. The implications hold regardless:<\/p>\n<ul>\n<li>Most advertising reaches people who cannot buy now. That is not waste; it is the only way to be in memory later.<\/li>\n<li>Response-rate metrics systematically undervalue that work, because the 95% cannot respond.<\/li>\n<li>Brand-building in B2B is not a luxury. It is how you get onto the shortlist that forms <em>before<\/em> anyone runs a formal evaluation.<\/li>\n<li>Top-of-funnel work should be measured on memory-linked indicators: branded search volume, direct traffic, share of the \"how did you hear about us\" field, inbound requests naming you specifically.<\/li>\n<\/ul>\n<h3>Lead gen vs demand gen<\/h3>\n<p><strong>Lead generation<\/strong> optimises for captured contact details: gate an ebook, run ads to the form, count MQLs, hand them to s
