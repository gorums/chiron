/* Repair text that was already stored after being decoded with the wrong code page:
   UTF-8 bytes read as Windows-1252 turn "—" into "â€”". Only runs when that signature
   is present and the bytes really do form valid UTF-8, so correct text is never touched. */
const CP1252_HIGH = { "€": 128, "‚": 130, "ƒ": 131, "„": 132, "…": 133, "†": 134, "‡": 135, "ˆ": 136, "‰": 137, "Š": 138, "‹": 139, "Œ": 140, "Ž": 142, "‘": 145, "’": 146, "“": 147, "”": 148, "•": 149, "–": 150, "—": 151, "˜": 152, "™": 153, "š": 154, "›": 155, "œ": 156, "ž": 158, "Ÿ": 159 };
function unmojibake(s) {
  if (!s || !/Ã.|â€|Â./.test(s)) return s;
  try {
    const bytes = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) {
      const ch = s[i], code = ch.charCodeAt(0);
      if (code <= 0xFF) bytes[i] = code;
      else if (CP1252_HIGH[ch] != null) bytes[i] = CP1252_HIGH[ch];
      else return s;                       // not representable — leave it alone
    }
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  } catch (e) { return s; }
}

function mdLite(src) {
  let t = esc(unmojibake(src));
  t = t.replace(/```([\s\S]*?)```/g, (m, c) => "<pre style='white-space:pre-wrap;background:var(--surface-3);padding:9px;border-radius:8px;font-size:12.5px'>" + c.trim() + "</pre>");
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|\n)#{1,4}\s*([^\n]+)/g, "$1<h4>$2</h4>");
  const lines = t.split("\n");
  let out = "", list = null;
  lines.forEach(l => {
    const ul = l.match(/^\s*[-*]\s+(.*)$/), ol = l.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if (ul) { if (list !== "ul") { out += (list ? "</" + list + ">" : "") + "<ul>"; list = "ul"; } out += "<li>" + ul[1] + "</li>"; }
    else if (ol) { if (list !== "ol") { out += (list ? "</" + list + ">" : "") + "<ol>"; list = "ol"; } out += "<li>" + ol[2] + "</li>"; }
    else {
      if (list) { out += "</" + list + ">"; list = null; }
      if (l.trim()) out += l.startsWith("<h4>") || l.startsWith("<pre") ? l : "<p>" + l + "</p>";
    }
  });
  if (list) out += "</" + list + ">";
  return out;
}

function marksOf(mid) { if (!S.marks) S.marks = {}; if (!S.marks[mid]) S.marks[mid] = []; return S.marks[mid]; }
function allMarks() {
  const out = [];
  Object.keys(S.marks || {}).forEach(mid => marksOf(mid).forEach(m => out.push(Object.assign({ mid }, m))));
  return out.sort((a, b) => b.ts - a.ts);
}

function addMark(mid, sec, text, status) {
  const m = { id: "k" + Date.now().toString(36) + Math.floor(Math.random() * 999), sec, text, note: "", q: "", ans: "", status: status || "hl", ts: Date.now() };
  marksOf(mid).push(m); save(); return m;
}

function markClass(m) { return m.status === "open" ? "q" : m.status === "answered" ? "answered" : ""; }

function applyMarks(mid) {
  marksOf(mid).forEach(mk => {
    const host = document.querySelector("#sec" + mk.sec + " .prose");
    if (!host) return;

function wrapText(el, text, cls, id) {
  if (!text) return false;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let full = "";
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n.parentElement && n.parentElement.closest("mark")) continue;
    nodes.push([n, full.length]); full += n.textContent;
  }
  if (!nodes.length) return false;
  // whitespace-tolerant match: normalise, keep a map back to raw offsets
  let norm = "", map = [], prevSp = false;
  for (let k = 0; k < full.length; k++) {
    const c = full[k];
    if (c === " " || c === "\n" || c === "\t" || c === "\r") {
      if (prevSp) continue;
      norm += " "; map.push(k); prevSp = true;
    } else { norm += c; map.push(k); prevSp = false; }
  }
  const needle = String(text).replace(/\s+/g, " ").trim();
  if (!needle) return false;
  const ni = norm.indexOf(needle);
  if (ni < 0) return false;
  const i = map[ni], j = map[ni + needle.length - 1] + 1;
  let sN = null, sO = 0, eN = null, eO = 0;
  for (const [n, off] of nodes) {
    const len = n.textContent.length;
    if (sN === null && i >= off && i < off + len) { sN = n; sO = i - off; }
    if (eN === null && j > off && j <= off + len) { eN = n; eO = j - off; }
  }
  if (!sN || !eN) return false;
  try {
    const r = document.createRange(); r.setStart(sN, sO); r.setEnd(eN, eO);
    const mk = document.createElement("mark");
    mk.className = "hl " + cls; mk.dataset.k = id;
    mk.appendChild(r.extractContents()); r.insertNode(mk);
    return true;
  } catch (e) { return false; }
}

/* ---- questions built from the passage itself, instantly and for free ---- */
function termsIn(text) {
  const low = " " + text.toLowerCase().replace(/[^a-z0-9%$€£. ]+/g, " ") + " ";
  const hits = [];
  (DATA.library.glossary || []).forEach(g => {
    const t = g.term.toLowerCase().replace(/\s*\(.*?\)\s*/g, " ").trim();
    if (t.length < 4 || t.length > 34) return;
    if (low.indexOf(" " + t + " ") >= 0 || low.indexOf(" " + t + "s ") >= 0)
      hits.push({ t: g.term.replace(/\s*\(.*?\)\s*/g, "").trim(), star: g.star, len: t.length });
  });
  hits.sort((a, b) => (b.star - a.star) || (b.len - a.len));
  const out = [];
  hits.forEach(h => { if (!out.some(o => o.toLowerCase().includes(h.t.toLowerCase()) || h.t.toLowerCase().includes(o.toLowerCase()))) out.push(h.t); });
  return out.slice(0, 3);
}
function localQuestions(text, hints) {
  const seen = [];
  (hints || []).forEach(hStr => {
    const h = String(hStr).replace(/[.,;:]$/, "").trim();
    if (h.length >= 4 && h.length <= 44 && !seen.some(x => x.toLowerCase() === h.toLowerCase())) seen.push(h);
  });
  termsIn(text).forEach(t => { if (!seen.some(x => x.toLowerCase().includes(t.toLowerCase()))) seen.push(t); });
  const terms = seen.slice(0, 3);
  const num = (text.match(/\b\d+(\.\d+)?\s?(%|x\b|:1\b)|[$€£]\s?\d[\d,.]*/) || [])[0];
  const qs = [];
  qs.push(terms[0] ? `What does "${terms[0]}" actually mean here?` : "Say this back to me in plain language.");
  if (terms[1]) qs.push(`How is ${terms[1]} different from ${terms[0]}?`);
  else qs.push("Give me a concrete example of this.");
  if (num) qs.push(`Where does the ${num} come from?`);
  qs.push(`How would I apply this to ${S.biz || "my own business"}?`);
  qs.push("When does this stop being true?");
  return qs.slice(0, 5);
}
async function genQuestions() {
  if (!pinned || genning) return;
  if (connMode() === "none") { toast("Not connected — open Settings"); return; }
  genning = true; renderSuggest();
  try {
    const sys = "You write study questions. Given a passage from a marketing course, return the 5 questions a smart beginner should be asking about it. One per line, no numbering, no preamble, each under 90 characters, each answerable from thinking about this passage. Make them specific to this passage's actual content, not generic.";
    const reply = await askBridge(sys, [{ role: "user", content: pinned.text + (S.biz ? "\n\n(The reader's practice business: " + S.biz + ")" : "") }]);
    const lines = reply.split("\n").map(l => l.replace(/^\s*[-*\d.)]+\s*/, "").trim())
      .filter(l => l.length > 12 && l.length < 140 && l.indexOf("?") > 0).slice(0, 6);
    if (lines.length) { pinnedQs = lines; toast("Questions generated"); }
    else toast("Could not read the reply — keeping the current suggestions");
  } catch (e) { toast((e && e.message) || "Could not generate questions"); }
  genning = false; renderSuggest();
}

function renderSuggest() {
  const box = document.getElementById("railsuggest");
  if (box) {
    box.innerHTML = railSuggestions().map(q =>
      `<button class="chip" onclick="askThis(this)" data-q="${esc(q)}">${esc(q)}</button>`).join("")
      + (pinned ? `<button class="chip gen" onclick="genQuestions()" ${genning ? "disabled" : ""}>
          ${genning ? "Thinking of better questions…" : "✦ Ask Claude for sharper questions"}</button>` : "");
  }
  const lead = document.getElementById("raillead2");
  if (lead) lead.innerHTML = `<p class="sub" style="font-size:12px;margin:0 0 8px">${pinned
    ? "Questions about <b>the passage you picked</b>:"
    : "Questions worth asking about <b>" + esc(railCtxLabel()) + "</b>:"}</p>`;
}
function askThis(el) {
  const inp = document.getElementById("railin");
  inp.value = el.dataset.q;
  railSend();
}
async function railSend() {
  const m = byId(route.id); if (!m) return;
  const inp = document.getElementById("railin"), btn = document.getElementById("railsend");
  const text = (inp.value || "").trim();
  if (!text) return;
  if (connMode() === "none") {
    const ok = await checkBridge(true);
    if (!ok) { toast("Not connected — open Settings"); go("#/settings"); return; }
  }
  const c = activeConvo(m.id);
  c.msgs.push({ r: "u", t: text, ts: Date.now(), sec: pinned ? pinned.sec : curSec, quote: pinned ? pinned.text : "" });
  c.updated = Date.now();
  save(); markDay();
  inp.value = ""; inp.style.height = "auto";
  menuOpen = false;
  renderRailBody(); renderSidebar();
  btn.disabled = true; inp.disabled = true;
  const pend = document.getElementById("railpending");
  if (pend) pend.innerHTML = `<div class="msg a typing"><i></i><i></i><i></i></div>`;
  const body = document.getElementById("railbody"); if (body) body.scrollTop = body.scrollHeight;
  try {
    const msgs = c.msgs.filter(x => x.r !== "e").slice(-12).map(x => ({ role: x.r === "u" ? "user" : "assistant", content: x.t }));
    const reply = await askBridge(systemForRail(), msgs);
    c.msgs.push({ r: "a", t: reply, ts: Date.now() });
  } catch (e) {
    c.msgs.push({ r: "e", t: (e && e.message) || "Something went wrong.", ts: Date.now() });
  }
  c.updated = Date.now(); save();
  btn.disabled = false; inp.disabled = false;
  renderRail();
  const i2 = document.getElementById("railin"); if (i2) i2.focus();
}

function continueConvo(id) {
  const c = CV()[id]; if (!c) return;
  ACT()[c.mid] = id; save();

  go("#/m/" + c.mid + "/1");
}
async function compactFromList(id) {
  const c = CV()[id]; if (!c) return;

  if (fresh) continueConvo(fresh.id);
}
function exportChat(id) {
  const c = CV()[id]; if (!c) return;
  const mod = byId(c.mid);
  const head = "Marketing Mastery — " + mod.id + " " + mod.title + "\n" + convoTitle(c) + "\n";
  const carried = c.summary ? "\nCARRIED OVER FROM AN EARLIER CHAT:\n" + c.summary + "\n" : "";
  const txt = c.msgs.map(x => (x.r === "u" ? "ME: " : x.r === "e" ? "ERROR: " : "CLAUDE: ") + x.t).join("\n\n");
  toast(clip(head + carried + "\n" + txt) ? "Transcript copied" : "Could not copy");
}
function clip(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}

    <p class="eyebrow">Why the key sits in the browser</p>
    <p style="color:var(--text-2);margin:0 0 10px">Anthropic allows a page to call the API directly, as long as it says it means to. That is what this does — so there is no proxy, no Python and no window to leave open. The cost is that your key lives in this browser's storage for this file.</p>
    <p style="color:var(--text-2);margin:0">That is fine here because this page is a file on your own computer that only you open. It would <b>not</b> be fine in a page you put on the internet — anyone visiting could read the key. So do not host this file publicly with a key saved in it, and press <b>Forget it</b> on a shared machine.</p>
  </div></div>`;
  $("#view").innerHTML = h;
}

async function connectClaude() {
  const btn = document.getElementById("connectbtn"), log = document.getElementById("connectlog");
  const field = document.getElementById("mainkey");
  const b = BR();
  const key = ((field && field.value.trim()) || b.key || "").trim();
  const show = html => { const l = document.getElementById("connectlog") || log; if (l) l.innerHTML = html; };

  if (!key) {
    // no key typed — see whether the optional bridge is running instead
    show(`<div class="hint"><span class="i">…</span>No key given, checking for the local bridge.</div>`);
    b.route = "bridge";
    const ok = await checkBridge(true);
    if (!ok) { b.route = "direct"; save(); }
    show(ok
      ? `<div class="hint" style="background:var(--ok-soft);color:var(--ok)"><span class="i">✓</span>Connected through the local bridge.</div>`
      : `<div class="hint" style="background:var(--warm-soft);color:var(--warm)"><span class="i">!</span>Paste an API key above, or start the bridge if you would rather use Claude Code.</div>`);
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = "Checking…"; }
  show(`<div class="hint"><span class="i">…</span>Sending one tiny request to check the key.</div>`);
  const res = await verifyKey(key);
  if (res.ok) {
    b.key = key; b.route = "direct"; b.mode = "direct"; save();
    bridgeOk = true;
    renderSidebar(); viewSettings();
    show(`<div class="hint" style="background:var(--ok-soft);color:var(--ok)"><span class="i">✓</span>
      <div><b>Connected.</b> The key is saved in this browser — you will not be asked again. Go and read; select any sentence to ask about it.</div></div>`);
    toast("Connected to Claude");
  } else {
    if (btn) { btn.disabled = false; btn.textContent = "Connect"; }
    show(`<div class="hint" style="background:var(--bad-soft);color:var(--bad)"><span class="i">✕</span>
      <div><b>Did not work.</b> ${esc(res.why || "")}</div></div>`);
  }
}
async function testDirect() {
  const box = document.getElementById("diagbox");
  if (box) box.innerHTML = `<div class="hint"><span class="i">…</span>Checking.</div>`;
  const res = await verifyKey(BR().key);
  if (box) box.innerHTML = res.ok
    ? `<div class="hint" style="background:var(--ok-soft);color:var(--ok)"><span class="i">✓</span>The key works.</div>`
    : `<div class="hint" style="background:var(--bad-soft);color:var(--bad)"><span class="i">✕</span>${esc(res.why || "")}</div>`;
}
function disconnect() {
  BR().key = ""; BR().mode = "none"; bridgeOk = false; save();
  renderSidebar(); viewSettings(); toast("Key removed from this browser");
}
function useDirect() { BR().route = "direct"; save(); checkBridge(); }
async function useBridge() {
  const u = document.getElementById("seturl");
  if (u) BR().url = u.value.trim().replace(/\/$/, "");
  BR().route = "bridge"; save();
  const log = () => document.getElementById("connectlog");
  const l0 = log(); if (l0) l0.innerHTML = `<div class="hint"><span class="i">…</span>Looking for the bridge, then for Claude Code.</div>`;
  const up = await checkBridge(true);
  if (!up) {
    BR().route = "direct"; save(); renderSidebar(); viewSettings();
    const l = log(); if (l) l.innerHTML = `<div class="hint" style="background:var(--bad-soft);color:var(--bad)"><span class="i">✕</span>
      <div>The bridge is not running. Double-click <b>start-bridge.bat</b> in your <b>bridge</b> folder, leave that window open, then press this again.</div></div>`;
    return;
  }
  try {
    const j = await bridgePost("/connect", {});
    await checkBridge(true);
    const l = log();
    if (l) l.innerHTML = j.ok
      ? `<div class="hint" style="background:var(--ok-soft);color:var(--ok)"><span class="i">✓</span>
         <div><b>Connected — ${esc(j.source || "")}.</b> ${esc(j.note || "")}</div></div>`
      : `<div class="hint" style="background:var(--warm-soft);color:var(--warm)"><span class="i">!</span>
         <div><b>The bridge is running, but Claude Code did not answer.</b> ${j.cli
           ? "It is installed — run <code>claude</code> once in a terminal to sign in, then press this again."
           : "It does not appear to be installed. Install Claude Code and sign in, or use an API key instead."}</div></div>`;
    if (j.ok) toast("Connected — no API charges");
  } catch (e) {
    const l = log(); if (l) l.innerHTML = `<div class="hint" style="background:var(--bad-soft);color:var(--bad)"><span class="i">✕</span>${esc(e.message || "Could not reach the bridge")}</div>`;
  }
  renderSidebar();
}
async function bridgePost(path, payload) {
  const r = await fetch(BR().url.replace(/\/$/, "") + path, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify(payload || {})
  });
  return r.json();
}
function saveSettings() {
  const m = document.getElementById("setmodel");
  if (m) BR().model = m.value;
  const u = document.getElementById("seturl");
  if (u) BR().url = u.value.trim().replace(/\/$/, "");
  save(); toast("Saved");
}

/* ---------- keys ---------- */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea";
  if (e.key === "Escape") { closeModal(); closePanel(); clearSel(); $("#sidebar").classList.remove("open"); return; }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); return; }
  if (e.key === "?") { openHelp(); return; }
  if (e.key === "t") { cycleTheme(); return; }
  if (e.key === "a" && route.v === "m") { toggleRail(); return; }
  if (e.key === "i" && route.v === "m") { const el = document.getElementById("railin"); if (el) { el.focus(); e.preventDefault(); } return; }
  if ($("#modalhost").innerHTML) return;
  if (route.v === "review" && session) {
    if (e.key === " ") { e.preventDefault(); if (!session.flipped) flip(); return; }
    if (session.flipped && ["1", "2", "3", "4"].includes(e.key)) { rate(+e.key - 1); return; }
  }
  if (route.v === "m") {
    const m = byId(route.id), p = P(route.id);
    if (route.step === 2 && p.quiz && !p.quiz.finished) {
      const st = p.quiz.a[p.quiz.i];
      if (!st || st.pick == null) {
        const i = "abcd".indexOf(e.key.toLowerCase());
        if (i >= 0 || ["1", "2", "3", "4"].includes(e.key)) { pick(route.id, i >= 0 ? i : +e.key - 1); return; }
      } else if (!st.answered && ["1", "2", "3"].includes(e.key)) { answer(route.id, +e.key); return; }
      else if (st.answered && e.key === "Enter") { nextQ(route.id); return; }
    }
    const i = mIndex(route.id);
    if (e.key === "j" && MODS[i + 1]) go("#/m/" + MODS[i + 1].id);
    if (e.key === "k" && MODS[i - 1]) go("#/m/" + MODS[i - 1].id);
  } else {
    if (e.key === "j" || e.key === "k") go("#/m/" + MODS[0].id);
  }
});
window.addEventListener("scroll", () => {
  const h = document.body.scrollHeight - window.innerHeight;
  $("#readbar").style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + "%";
});
window.addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

/* ---------- boot ---------- */
function render() {
  if (route.v !== "m") stopTimer();
  closePanel(); clearSel();
  if (route.v !== "m") pinned = null;
  renderSidebar();
  const v = route.v;
  if (v === "m") viewModule();
  else if (v === "review") viewReview();
  else if (v === "stats") viewStats();
  else if (v === "marks") viewMarks();
  else if (v === "settings") viewSettings();
  else if (v === "library") viewLibrary();
  else if (v === "plan") viewPlan();
  else viewHome();
  $("#sidebar").classList.remove("open");
  applyRail();
  const tg = document.getElementById("railtoggle");
  if (tg) tg.classList.toggle("show", route.v === "m");
  if (route.v === "m" && railOpen()) renderRail();
}
$("#opensearch").onclick = openPalette;
$("#themebtn").onclick = cycleTheme;
$("#helpbtn").onclick = openHelp;
$("#menubtn").onclick = () => $("#sidebar").classList.toggle("open");
migrateChats();
parseHash(); render();
setTimeout(() => checkBridge(true), 250);
</script>
