}, {"term": "Lead magnet", "star": false, "def": "Something of value given in exchange for contact details. Works when it solves a real problem on its own, fails when it is a brochure with a form."}, {"term": "Lead scoring", "star": false, "def": "Ranking leads by fit and behaviour so sales works the best ones first. Worth doing once you have enough volume to be wrong about priorities."}, {"term": "Lift", "star": false, "def": "The difference between treated and untreated groups. The measurement that matters, as opposed to the raw number."}, {"term": "List hygiene", "star": false, "def": "Regularly removing inactive and bouncing subscribers. Shrinks the list, raises revenue."}, {"term": "Lookalike audience", "star": true, "def": "An audience the platform builds to resemble a source list you provide. Quality depends entirely on the quality of the seed list."}, {"term": "LTV (Lifetime Value)", "star": true, "def": "Total contribution margin from a customer over a stated horizon. Use contribution, not revenue, and cap the horizon at something you have actually observed."}, {"term": "LTV:CAC", "star": true, "def": "Ratio of lifetime value to acquisition cost. Around 3:1 is healthy; well above it usually means you are underinvesting, not winning."}, {"term": "MMM (Marketing Mix Modeling)", "star": true, "def": "Statistical modelling of how spend across channels relates to sales, using aggregate data. Privacy-durable, needs years of data, has come back into fashion as tracking degraded."}, {"term": "MQL (Marketing Qualified Lead)", "star": true, "def": "A lead marketing believes is worth sales' time. The definition is negotiated between teams, and the negotiation matters more than the acronym."}, {"term": "Media mix", "star": false, "def": "How budget is distributed across channels. The senior marketer's actual job."}, {"term": "MER (Marketing Efficiency Ratio)", "star": true, "def": "Total revenue divided by total marketing spend. Blunt, un-gameable, and a useful sanity check when channel-level ROAS numbers add up to more revenue than the company made."}, {"term": "MDE (Minimum Detectable Effect)", "star": false, "def": "The smallest change a test can reliably detect at your traffic level. Halving it roughly quadruples the sample you need."}, {"term": "Mental availability", "star": true, "def": "How readily your brand comes to mind in a buying situation. Built by consistent, distinctive, broad reach over time."}, {"term": "Modeled conversions", "star": false, "def": "Conversions the platform estimates rather than observes, filling gaps left by consent and tracking loss. Increasingly a large share of reported numbers."}, {"term": "Multi-touch attribution", "star": false, "def": "Distributing credit across touchpoints by rule or model. More sophisticated-looking than last click and still not causal."}, {"term": "Negative keyword", "star": true, "def": "A query you block your ads from showing on. The single highest-return maintenance task in a Google Ads account."}, {"term": "NPS (Net Promoter Score)", "star": false, "def": "Survey score from \"how likely are you to recommend us\". Weak as a metric, useful for the free-text comment that follows."}, {"term": "NRR (Net Revenue Retention)", "star": false, "def": "Revenue from existing customers this period versus last, including expansion and churn. Above 100% means you grow without acquiring anyone."}, {"term": "Noindex", "star": false, "def": "Instruction telling search engines not to include a page in results. Use on thin, duplicate, or paid-only pages."}, {"term": "Offer", "star": true, "def": "What someone gets, what they must give, and why now. Changing the offer beats changing the ad, reliably and repeatedly."}, {"term": "Organic search", "star": false, "def": "Unpaid search traffic. Increasingly reduced by AI answers, and increasingly about being cited rather than clicked."}, {"term": "Owned, earned, paid media", "star": true, "def": "Channels you control (site, list), coverage you earn (press, word of mouth), and attention you rent (ads). Owned compounds; paid stops the day you stop paying."}, {"term": "P-value", "star": false, "def": "Probability of seeing a result this extreme if there were no real difference. Below 0.05 is the usual bar; it is not the probability that you are right."}, {"term": "Paid search", "star": false, "def": "Ads on search results. The purest demand capture channel, and often the least incremental."}, {"term": "Payback period", "star": true, "def": "See CAC payback. The cash constraint that usually binds before the profitability constraint does."}, {"term": "Performance Max (PMax)", "star": true, "def": "Google's automated campaign type running across all its inventory with minimal manual control. Your levers are budget, feed quality, creative assets, conversion goals, and exclusions."}, {"term": "Personalization", "star": false, "def": "Varying content by segment or individual. Usually delivers less than promised and costs more than expected; do the segment level first."}, {"term": "Physical availability", "star": true, "def": "How easy you are to buy: distribution, shelf space, listings, payment methods, opening hours. Historically beats promotion more often than not."}, {"term": "Pipeline", "star": false, "def": "Total value of open deals. The B2B marketing team's real output, since revenue arrives quarters later."}, {"term": "Positioning", "star": true, "def": "The deliberate choice of what you want to be compared to, and why you win that comparison. Always relative to alternatives, including doing nothing."}, {"term": "Post-click / post-impression", "star": false, "def": "Conversions after a click versus after a view. View-through numbers are far softer and should never be added to click-through numbers without saying so."}, {"term": "Programmatic", "star": false, "def": "Automated buying of display and video inventory through exchanges. Efficient at scale, an excellent way to waste a small budget invisibly."}, {"term": "Proof", "star": false, "def": "Evidence a claim is true. Ranked by power: the customer's own numbers, third-party data, named quotes, demonstration, your own claim."}, {"term": "Quality Score", "star": false, "def": "Google's 1-10 diagnostic of ad relevance, expected CTR, and landing page experience. Not a lever itself; a readout of things you should fix."}, {"term": "Query", "star": false, "def": "What someone actually typed. Different from a keyword, which is what you targeted."}, {"term": "Reach", "star": false, "def": "Number of unique people who saw something. The denominator of frequency."}, {"term": "Regression to the mean", "star": true, "def": "Extreme results tend to be followed by more average ones. The reason your \"winning\" week was probably partly luck, and why interventions after a bad month look effective."}, {"term": "Retargeting (remarketing)", "star": true, "def": "Advertising to people who already visited. Cheap and impressive-looking on last-click reports; often the least incremental spend in the account, because many would have returned anyway."}, {"term": "Retention", "star": true, "def": "Keeping customers. It multiplies the value of every acquisition euro you will ever spend, and it is where the leverage usually is."}, {"term": "Rich results", "star": false, "def": "Enhanced search listings (stars, FAQs, prices) driven by structured data."}, {"term": "ROAS (Return On Ad Spend)", "star": true, "def": "Revenue divided by ad spend. Platform-reported ROAS is measured by the platform grading its own homework; treat it as directional."}, {"term": "ROI (Return On Investment)", "star": false, "def": "Profit relative to cost. Distinct from ROAS because it accounts for margin and all other costs, which is why it is usually much less flattering."}, {"term": "SQL (Sales Qualified Lead)", "star": true, "def": "A lead sales has accepted as worth pursuing. The MQL-to-SQL rate is the honest measure of whether marketing's leads are real."}, {"term": "Schema markup", "star": true, "def": "Structured data in your HTML that tells machines what a page is about. Increasingly relevant to being parsed and cited by AI systems."}, {"term": "Search intent", "star": false, "def": "See Intent."}, {"term": "Segment", "star": true, "def": "A group of buyers who share a situation and behave similarly. There is no \"general audience\"; there are only segments."}, {"term": "SERP", "star": false, "def": "The search engine results page. Look at the actual SERP before targeting a query; what is on it decides whether ranking is even worth anything."}, {"term": "Share of search", "star": false, "def": "Your brand's share of category-related searches. A cheap, surprisingly predictive proxy for market share."}, {"term": "SOV (Share of Voice)", "star": true, "def": "Your share of category advertising. The classic rule of thumb: hold SOV above your market share to grow, below it to shrink."}, {"term": "Signal loss", "star": false, "def": "The ongoing degradation of tracking from consent rules, browser restrictions, and app privacy changes. The reason experiments and MMM came back."}, {"term": "Single-minded proposition", "star": false, "def": "The one thing a campaign says. If there are two, there is no proposition."}, {"term": "Sitemap", "star": false, "def": "A file listing your URLs for search engines. Basic hygiene, submitted in Search Console."}, {"term": "SPF", "star": true, "def": "DNS record listing which servers may send email for your domain. One third of the SPF/DKIM/DMARC trio required to reach inboxes reliably."}, {"term": "Statistical significance", "star": true, "def": "Confidence that a difference is not noise. Necessary but not sufficient: a significant result on a trivial effect is still worthless."}, {"term": "Survivorship bias", "star": true, "def": "Studying only the winners. It is why case studies, \"how we grew to 10k customers\" posts, and most marketing advice generalise badly — the identical strategy that failed for a hundred others was never written up."}, {"term": "Test-and-learn", "star": false, "def": "Running deliberate experiments rather than arguing from opinion. Requires pre-committed criteria to be anything other than a slogan."}, {"term": "Time to value", "star": false, "def": "How long before a new customer gets the thing they bought it for. Shortening it is usually the highest-return retention work available."}, {"term": "Top of funnel (TOFU)", "star": false, "def": "Activity aimed at people who do not yet know they have a problem."}, {"term": "Trigger", "star": true, "def": "The event that starts someone looking for a solution. Find it, and you know when and where to be present."}, {"term": "Trust signals", "star": false, "def": "Reviews, guarantees, certifications, real photos, a physical address. For anything sold online, trust is usually the actual conversion bottleneck."}, {"term": "Unit economics", "star": true, "def": "The profit and loss of a single customer or order. If they do not work, no amount of marketing volume fixes it; it just loses money faster."}, {"term": "USP (Unique Selling Proposition)", "star": false, "def": "The one claim only you can make. Frequently asserted, rarely true; test it against what a competitor could say tomorrow."}, {"term": "Upsell / cross-sell", "star": false, "def": "Selling more to an existing customer. Cheaper than acquisition by roughly an order of magnitude, and consistently under-resourced."}, {"term": "UTM parameters", "star": true, "def": "Tags appended to URLs (source, medium, campaign, content, term) so analytics can identify where traffic came from. Agree a naming convention on day one and enforce it, or your data becomes unreadable within a quarter."}, {"term": "Value proposition", "star": true, "def": "What the customer gets, for whom, and why it beats the alternative. Distinct from a slogan, which is how it is said."}, {"term": "Vanity metric", "star": true, "def": "A number that rises reliably and changes no decision: impressions, followers, reach, engagement rate in isolation."}, {"term": "View-through conversion", "star": true, "def": "A conversion credited to someone who saw but did not click an ad. The softest currency in advertising; never combine with click conversions in one total."}, {"term": "Viewability", "star": false, "def": "Whether an ad was actually visible on screen. A large share of bought impressions never are."}, {"term": "Win rate", "star": false, "def": "Share of opportunities that close. A marketing metric as much as a sales one, because lead quality drives it."}, {"term": "Word of mouth", "star": false, "def": "The most effective and least controllable channel. Mostly earned through product and time-to-value, not through campaigns."}, {"term": "Zero-click search", "star": true, "def": "A search that ends without a click to any site, because the answer appeared on the results page. Now roughly 60% of Google searches, and the central strategic fact of SEO in 2026."}], "models": [{"title": "Demand capture vs. demand creation", "html": "<p>Some marketing intercepts people who are already looking; some makes people aware of a problem they were not thinking about. Capture converts well, costs a lot per click, and is capped by how many people are searching. Creation converts poorly, buys cheap attention, and is the only way to expand the market. Nearly every \"our marketing stopped working\" story is a company that only did capture, drained the pond, and had built nothing to refill it.<\/p>\n<p><strong>Use it when:<\/strong> results are flat despite rising spend, or when someone proposes a channel and you need to know what job it is doing.<\/p>"}, {"title": "The 95-5 rule", "html": "<p>At any moment roughly 5% of a market is actively in the buying process and 95% is not. Advertising aimed at the 5% is a fight over existing demand at high prices; advertising aimed at the 95% is memory-building for a purchase that happens months or years later. Both are necessary, but only the first is measurable this quarter, which is why the second is chronically underfunded.<\/p>\n<p><strong>Use it when:<\/strong> someone asks why a brand campaign has no leads attached to it, or when short-term ROAS is being used to justify cutting everything that is not search.<\/p>"}, {"title": "Mental and physical availability", "html": "<p>Brands grow by being easy to think of in a buying situation and easy to buy. Mental availability comes from broad, consistent, distinctive presence attached to the situations where people need the category. Physical availability is distribution: listings, shelf space, payment methods, opening hours, whether a person can complete the purchase at 11pm from a phone. Most brands overinvest in persuasion and underinvest in both.<\/p>\n<p><strong>Use it when:<\/strong> you are tempted to make the message cleverer. Ask instead whether more people could think of you, or whether more people could buy you.<\/p>"}, {"title": "Positioning is relative to alternatives", "html": "<p>Positioning is not a description of you; it is a decision about what you want to be compared to. The same product is expensive next to one alternative and cheap next to another. Choosing the comparison set is the highest-leverage decision in marketing, and if you do not make it deliberately, the customer makes it for you, usually badly. The most common unchosen comparison is \"doing nothing,\" which is the toughest competitor there is.<\/p>\n<p><strong>Use it when:<\/strong> you are writing a homepage, a pricing page, or a sales deck, and especially when losing deals to no decision.<\/p>"}, {"title": "The offer beats the ad", "html": "<p>A mediocre ad for a strong offer outperforms a brilliant ad for a weak one, consistently. The offer is what someone gets, what they must give, and why now. Marketers spend disproportionate effort on the expression and almost none on the proposition, because changing the offer requires the permission of people outside marketing.<\/p>\n<p><strong>Use it when:<\/strong> a campaign underperforms. Check the offer before the creative, and the creative before the targeting.<\/p>"}, {"title": "Distribution beats promotion", "html": "<p>Getting the product to where people already are usually beats convincing people to come to you. Historically this meant shelf space and retail; now it also means marketplaces, integrations, app stores, partners, and being present in the surfaces where your buyer already spends attention. Promotion generates demand that bad distribution then fails to absorb.<\/p>\n<p><strong>Use it when:<\/strong> demand exists but does not convert, or when planning a launch. Ask \"where can this be bought\" before \"how will people hear about it.\"<\/p>"}, {"title": "Unit economics are the constraint", "html": "<p>The arithmetic of a single customer decides which channels are open to you. If contribution margin is thin, expensive channels are simply unavailable, no matter how good the creative. If payback is long, you need cash, not cleverness. Marketing cannot outrun bad unit economics; it can only lose money faster.<\/p>\n<p><strong>Use it when:<\/strong> anyone proposes a channel. First question: what is our max affordable CPA, and does this channel clear it?<\/p>"}, {"title": "Leverage lives in the weakest funnel step", "html": "<p>A funnel multiplies its step conversion rates, so a fix at the worst step moves the outcome far more than an equivalent fix at a healthy one. People optimise the step they enjoy or the step they control, which is rarely the weakest. Model each step, change one at a time on paper, and look at what actually moves CAC before deciding where the month goes.<\/p>\n<p><strong>Use it when:<\/strong> planning a month of work, and every time someone proposes optimising bids on a page that converts at 1%.<\/p>"}, {"title": "Attribution measures correlation, not cause", "html": "<p>Attribution assigns credit by a rule. It does not establish that anything caused anything. Last-click systematically over-credits whoever was standing closest to the purchase — branded search, retargeting — and under-credits everything that created the demand in the first place. All models are wrong; they are wrong in different directions, which is why changing the model changes your budget without changing reality.<\/p>\n<p><strong>Use it when:<\/strong> a dashboard is about to decide a budget. Ask what the attribution window is and what the model would say if it were changed.<\/p>"}, {"title": "Incrementality is the only honest question", "html": "<p>The question is never \"how many conversions did this channel report.\" It is \"how many of these would have happened anyway.\" The only reliable way to answer it is to withhold the activity from a randomly chosen group and compare. This is uncomfortable because it often reveals that a well-liked channel is buying customers you already had.<\/p>\n<p><strong>Use it when:<\/strong> a channel looks too good, particularly retargeting, branded search, and affiliates. And before any large budget increase — a holdout costs a slice of a month and prevents a year of wrong.<\/p>"}, {"title": "The messy middle", "html": "<p>Real buying journeys are not a funnel. People loop between exploring options and evaluating them, stall for months, involve other people, revisit, and are influenced in places you cannot see. The funnel is a useful accounting fiction for finding leaks, not a description of behaviour. Planning as if buyers move linearly produces campaigns that only work on the small minority who happen to.<\/p>\n<p><strong>Use it when:<\/strong> designing a journey or explaining why a long sales cycle does not show up in weekly reports. Design to be present and consistent over time, not to push people down a sequence.<\/p>"}, {"title": "Regression to the mean", "html": "<p>Extreme results tend to be followed by more ordinary ones, for no reason other than that extremes involve luck. A great week is usually partly luck, so the next one looks worse; a terrible month is usually partly luck, so whatever you did afterwards looks effective. This mechanism manufactures false confidence in interventions, especially interventions launched in a crisis.<\/p>\n<p><strong>Use it when:<\/strong> judging a change made after an unusual period, or when a \"fix\" is being credited with a recovery. Compare to a control or to a longer baseline, not to the outlier.<\/p>"}, {"title": "Survivorship bias in case studies", "html": "<p>You read about the companies whose strategy worked. The hundred that ran the same playbook and failed were never written up, so the evidence you see is filtered to the winners before you begin reasoning about it. This makes case studies systematically misleading as instruction, and it is why \"copy what worked for them\" fails so reliably.<\/p>\n<p><strong>Use it when:<\/strong> someone cites a company as proof a tactic works. Ask what was true for them that is not true for us, and what the failure rate of this approach is.<\/p>"}, {"title": "Local maxima in optimisation", "html": "<p>Incremental testing climbs the hill you are standing on. It cannot tell you there is a higher hill, because every step toward the new one looks like a loss. Programmes that only run small tests converge on the best version of a mediocre idea and then stall. Escaping requires deliberately testing whole concepts, which is riskier, slower, and the only way to find a step change.<\/p>\n<p><strong>Use it when:<\/strong> your tests keep producing 2% lifts, or when a conversion rate has plateaued for two quarters. Budget for occasional big swings alongside the small ones.<\/p>"}, {"title": "A strategy is not a list of tactics", "html": "<p>A strategy is a diagnosis of the obstacle, a guiding policy for dealing with it, and a coherent set of actions that follow. A list of channels with budgets and dates is a plan of activity, not a strategy — it makes no choice, so it rules nothing out. The test is simple: if it does not tell you what you will refuse to do, it is not a strategy.<\/p>\n<p><strong>Use it when:<\/strong> reviewing any marketing plan, including your own. Look for the sentence that eliminates an option.<\/p>"}, {"title": "Content-market fit", "html": "<p>Content works when it reaches the people who could buy and says something they cannot get elsewhere. Most content fails one of those two: it reaches a general audience, or it repeats what already ranks. In an era where a competent draft costs nothing to produce, distinctiveness and distribution are the entire game and production volume is worth almost nothing.<\/p>\n<p><strong>Use it when:<\/strong> deciding whether to publish. If you cannot say what only you can say, and cannot name five people who would care, do not write it.<\/p>"}, {"title": "Retention multiplies everything", "html": "<p>Retention sets LTV, LTV sets what you can afford to pay for a customer, and that sets which channels exist for you. A business that cuts churn meaningfully has quietly raised its acquisition budget across every channel at once, without spending anything. Retention work is unglamorous, rarely owned by marketing, and usually the highest-return work available.<\/p>\n<p><strong>Use it when:<\/strong> the plan is to grow by acquiring more. Check the leak first — filling a bucket faster is a poor substitute for a smaller hole.<\/p>"}, {"title": "Creative is the targeting", "html": "<p>Platforms took targeting decisions away from marketers and gave them to algorithms. What remains under your control is the offer, the data you feed the system, what you tell it to optimise for, and above all the creative. The ad itself now selects the audience: the people who lean in define who the algorithm goes and finds more of. Creative is not decoration on top of a media plan; it is the media plan.<\/p>\n<p><strong>Use it when:<\/strong> working in Performance Max or Advantage+ and feeling you have lost control. Invest the hours in distinct creative angles, not in targeting settings you no longer own.<\/p>"}, {"title": "Owned audiences compound", "html": "<p>Paid attention stops the day you stop paying, and rented platforms change the rules without asking. An email list, a customer base, a community, and first-party data are assets that accumulate, cannot be taken away, and cost nothing marginal to reach. Every campaign should ask what durable asset it leaves behind, not only what it converts this month.<\/p>\n<p><strong>Use it when:<\/strong> allocating between channels, and when designing any campaign. If it produces nothing but this month's conversions, it is rent, not investment.<\/p>"}, {"title": "Taste is the scarce input", "html": "<p>When anyone can produce a thousand competent assets, competence stops being a differentiator and judgment becomes the constraint. Knowing what is worth saying, which of forty generated options is the good one, when to stop optimising and when to change direction — none of that is automated, and all of it comes from having seen many real outcomes. This is why reps with real money matter more than more courses.<\/p>\n<p><strong>Use it when:<\/strong> you are tempted to solve a problem by producing more. Ask whether the shortage is output or judgment. It is almost always judgment.<\/p>"}], "models_note": "<h3>How to actually memorise these<\/h3><p>Cover the page and write the twenty names from memory. Then, for each, write the \"use it when\" line. Do this once a week for three weeks and they will stick permanently.<\/p>\n<p>Then use them out loud. A model you have never applied to a real decision is trivia; a model you have used once to argue against spending money is a skill.<\/p>", "templates": [{"slug": "ab-test-plan", "title": "A/B Test Plan", "blurb": "Use with: M14 — Experimentation and testing", "html": "<h1>A/B Test Plan<\/h1>\n<p><strong>Use with:<\/strong> M14 — Experimentation and testing\n<strong>Time to fill:<\/strong> 30 minutes\n<strong>Rule:<\/strong> if you cannot fill in the sample size section, you cannot run the test. That is a real answer, and it is the most common one.<\/p>\n<p>Most small businesses do not have enough traffic to A/B test anything. Discovering that here, in thirty minutes, saves you from three months of running tests that will tell you nothing while feeling scientific.<\/p>\n<hr />\n<h2>Header<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Test name<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Owner<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Surface (page / email / ad)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Traffic source(s) included<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Planned start<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Planned end<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Status<\/td>\n<td>Planned / Running / Concluded / Abandoned<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>1. Hypothesis<\/h2>\n<p>Use this format. All four parts are required.<\/p>\n<blockquote>\n<p><strong>Because<\/strong> [evidence you already have],\n<strong>we believe that<\/strong> [change],\n<strong>will cause<\/strong> [effect on the primary metric],\n<strong>and we will know we are right when<\/strong> [observable result].<\/p>\n<\/blockquote>\n<p><strong>Your hypothesis:<\/strong><\/p>\n<pre><code>Because ______________________________________________________\nwe believe that ______________________________________________\nwill cause ___________________________________________________\nand we will know we are right when ___________________________\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong><\/p>\n<pre><code>Because Clarity recordings show 61% of mobile visitors scroll past the form\nwithout stopping, and 7 of 12 exit-survey responses asked what it costs,\nwe believe that showing a starting price above the form\nwill cause more form submissions per session on mobile paid traffic,\nand we will know we are right when mobile CVR rises from 3.1% to at least\n3.9% over the test window with the lead-quality guardrail intact.\n<\/code><\/pre>\n<p><strong>A failing hypothesis:<\/strong> \"We think a green button will work better.\" No evidence, no mechanism, no threshold. Even if it wins you learn nothing transferable, which is the point of testing at all.<\/p>\n<p><strong>What is the belief being tested?<\/strong> Write the general principle, because the specific result is worth less than the principle: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/p>\n<hr />\n<h2>2. Variants<\/h2>\n<table>\n<thead>\n<tr>\n<th>Variant<\/th>\n<th>Description<\/th>\n<th>What exactly differs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A (control)<\/td>\n<td><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>C (only if traffic allows)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Change one thing at a time<\/strong> unless you are deliberately testing a whole new concept against the old one. A five-change redesign test tells you the new page won, not why, and you cannot carry the lesson anywhere else. Both are legitimate; know which you are doing:<\/p>\n<ul>\n<li>[ ] Isolated variable (learn a principle, smaller effect, needs more traffic)<\/li>\n<li>[ ] Whole-concept test (bigger effect, faster, learn less)<\/li>\n<\/ul>\n<hr />\n<h2>3. Primary metric<\/h2>\n<p><strong>One.<\/strong> Chosen before launch. If you have two primary metrics you have none.<\/p>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Primary metric<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Exact definition<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Where it is measured<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Current baseline<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Baseline measured over<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Choose the metric closest to money that you have enough volume to measure. Click-through rate is easy to move and often does not move revenue. Prefer the downstream metric unless volume forbids it, and if you must use an upstream proxy, say so explicitly here: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/p>\n<hr />\n<h2>4. MDE and required sample size<\/h2>\n<p><strong>MDE<\/strong> (minimum detectable effect) is the smallest improvement you care about. Set it by what is worth the effort, not by what would be nice.<\/p>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Baseline conversion rate<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>MDE (relative, e.g. +15%)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>MDE (absolute)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Statistical significance (use 95%)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Statistical power (use 80%)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One-tailed or two-tailed<\/td>\n<td>Two-tailed<\/td>\n<\/tr>\n<tr>\n<td><strong>Required sample per variant<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Required total sample<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Use any free A/B test sample size calculator. Do not estimate this in your head; the relationship is not intuitive.<\/p>\n<p><strong>Rules of thumb to sanity-check the calculator's answer:<\/strong><\/p>\n<ul>\n<li>Halving the MDE roughly <strong>quadruples<\/strong> the required sample.<\/li>\n<li>At a 3% baseline, detecting a relative +10% lift needs on the order of tens of thousands of visitors per variant.<\/li>\n<li>At a 3% baseline, detecting a relative +30% lift needs on the order of a few thousand per variant.<\/li>\n<li>Under ~200 conversions per variant, do not bother. The result will not be trustworthy no matter what the tool's confidence number says.<\/li>\n<\/ul>\n<p><strong>Worked example:<\/strong><\/p>\n<pre><code>Baseline CVR              3.1%\nMDE (relative)            +25%  → absolute target 3.875%\nSignificance / power      95% / 80%, two-tailed\nRequired per variant      ~7,400 sessions\nRequired total            ~14,800 sessions\nCurrent mobile paid traffic  2,100 sessions/month\nTime to reach sample      ~7 months\nVerdict                   Do not run this as an A/B test.\n<\/code><\/pre>\n<p>That verdict is a success, not a failure. It took twenty minutes and it saved seven months.<\/p>\n<p><strong>If you do not have the traffic, use one of these instead:<\/strong><\/p>\n<ul>\n<li><strong>Just ship it.<\/strong> If the change is cheap, low-risk, and supported by qualitative evidence, make it and move on. Most page copy falls here.<\/li>\n<li><strong>Before/after with a long window and no other changes.<\/strong> Weak evidence, honest about being weak. Freeze everything else, compare 8 weeks to 8 weeks, and do not claim causality.<\/li>\n<li><strong>Qualitative research.<\/strong> Five user tests, session recordings, an exit survey. Lower confidence per unit of evidence, dramatically higher information per hour at low traffic.<\/li>\n<li><strong>Test bigger things.<\/strong> You cannot detect a +5% button change, but you may be able to detect a +60% new offer. If you lack traffic, only test changes big enough to be visible.<\/li>\n<li><strong>Test upstream.<\/strong> Ad creative usually has far more volume than the landing page and larger effect sizes.<\/li>\n<\/ul>\n<hr />\n<h2>5. Duration<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Expected traffic per week (total)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Weeks to reach required sample<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Minimum run length<\/strong><\/td>\n<td>At least 2 full weeks, and always whole weeks<\/td>\n<\/tr>\n<tr>\n<td>Planned end date<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Anything scheduled in the window that could distort it<\/td>\n<td>Holidays, promotions, PR, seasonality, a competitor's sale<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Run whole weeks. Tuesday behaves differently from Sunday, and a test stopped mid-week is weighted toward whichever days it happened to include.<\/p>\n<p>Also consider the <strong>business cycle<\/strong>: if your median time from click to purchase is 18 days, a 14-day test measures the front of the funnel only, and you must either extend it or accept you are testing a proxy.<\/p>\n<ul>\n<li>Median time from exposure to conversion: ______ days<\/li>\n<li>Test window covers it? Yes / No / Using a proxy metric because:<\/li>\n<\/ul>\n<hr />\n<h2>6. Guardrail metrics<\/h2>\n<p>Metrics that must not get worse, even if the primary metric improves. Volume wins that destroy quality are the most common self-inflicted injury in CRO.<\/p>\n<table>\n<thead>\n<tr>\n<th>Guardrail<\/th>\n<th>Why it matters<\/th>\n<th>Acceptable range<\/th>\n<th>Action if breached<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Guardrail<\/th>\n<th>Why<\/th>\n<th>Acceptable<\/th>\n<th>If breached<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lead-to-customer rate<\/td>\n<td>Showing price may attract browsers<\/td>\n<td>Not below 6.5% (baseline 7.9%)<\/td>\n<td>Declare no-win even if CVR rose; net customers is what matters<\/td>\n<\/tr>\n<tr>\n<td>Average deal size<\/td>\n<td>Anchoring low could shrink deals<\/td>\n<td>Within 10% of baseline<\/td>\n<td>Investigate before rolling out<\/td>\n<\/tr>\n<tr>\n<td>Page load (LCP)<\/td>\n<td>The variant adds an element<\/td>\n<td>Under 2.5s<\/td>\n<td>Fix before continuing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Always include a downstream guardrail.<\/strong> If your primary metric is a form fill, at least one guardrail must be about what happens to those leads afterwards.<\/p>\n<hr />\n<h2>7. Stopping rule<\/h2>\n<p>Agreed before launch, in writing.<\/p>\n<ul>\n<li><strong>We will not look at results before:<\/strong> ______ (date)<\/li>\n<li><strong>We will stop when:<\/strong> the required sample is reached OR the end date arrives, whichever is later.<\/li>\n<li><strong>We will stop early only if:<\/strong> a guardrail is breached beyond its range, or something is technically broken.<\/li>\n<li><strong>We will NOT stop early because a variant looks like it is winning.<\/strong><\/li>\n<\/ul>\n<p><strong>Why this matters:<\/strong> peeking at a running test and stopping when it looks significant inflates your false-positive rate badly — checking daily and stopping at the first significant reading can push a nominal 5% error rate to well over 20%. Early \"winners\" that evaporate are the single most common reason organisations lose faith in testing.<\/p>\n<p><strong>Pre-committed decision table:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Outcome<\/th>\n<th>Decision<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>B wins, significant, guardrails intact<\/td>\n<td>Ship B. Record the principle learned.<\/td>\n<\/tr>\n<tr>\n<td>B wins, significant, guardrail breached<\/td>\n<td>Do not ship. Investigate the trade-off.<\/td>\n<\/tr>\n<tr>\n<td>No significant difference<\/td>\n<td>Ship whichever is cheaper to maintain. Record that the variable does not matter at this magnitude — that is a real finding.<\/td>\n<\/tr>\n<tr>\n<td>A wins significantly<\/td>\n<td>Keep A. Ask what the result implies about the belief in section 1.<\/td>\n<\/tr>\n<tr>\n<td>Test invalid (tracking broke, traffic mix changed, sample not reached)<\/td>\n<td>Discard. Do not report the number. Fix and rerun or abandon.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Fill this in before launch and you will never have the \"well, if we squint...\" conversation.<\/p>\n<hr />\n<h2>8. Result log<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Actual start / end<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Sample achieved (A / B)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Conversions (A / B)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Conversion rate (A / B)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Relative lift<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Confidence / p-value<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Guardrails held?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Decision taken<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Date shipped or reverted<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>What we learned (the principle, not the pixel):<\/strong><\/p>\n<pre><code>\n<\/code><\/pre>\n<p><strong>What we would do differently in the next test:<\/strong><\/p>\n<pre><code>\n<\/code><\/pre>\n<p><strong>Did the shipped winner hold up 30 days later?<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/p>\n<p>That last question is worth asking every time. A meaningful share of shipped \"winners\" do not show up in the aggregate numbers afterwards. Checking is how you find out whether your testing programme is producing real value or a scrapbook of noise.<\/p>\n<hr />\n<h2>Running test index<\/h2>\n<p>Keep one row per test, forever. This log becomes your most valuable asset as a marketer: it is evidence you can reason about outcomes, and it is portfolio material.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Date<\/th>\n<th>Surface<\/th>\n<th>Hypothesis (short)<\/th>\n<th>Result<\/th>\n<th>Lift<\/th>\n<th>Shipped?<\/th>\n<th>Principle learned<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What good looks like<\/h2>\n<p>The sample size was calculated before the test was built, and roughly a third of planned tests get cancelled at that step — correctly. The hypothesis names the evidence that prompted it. There is a downstream guardrail. The stopping rule and the decision table were written before launch and were honoured even when the early numbers were exciting. The log records the transferable principle, not just which variant won.<\/p>\n<h2>Common failure<\/h2>\n<p>Peeking and stopping early. It feels like diligence and it is the fastest way to fill your site with changes that do nothing. The close second is testing trivial variables at low traffic — button colours, headline synonyms — where the true effect is smaller than the noise, so every result is a coin flip dressed up as a finding. If your traffic is thin, do not test small things more carefully; test bigger things, or stop testing and go talk to five customers instead.<\/p>"}, {"slug": "business-brief", "title": "Business Brief", "blurb": "Use with: M01 — What marketing actually is", "html": "<h1>Business Brief<\/h1>\n<p><strong>Use with:<\/strong> M01 — What marketing actually is\n<strong>Time to fill:<\/strong> 25 minutes\n<strong>Refill:<\/strong> whenever the business changes materially, or every 6 months<\/p>\n<p>This is the sheet you fill before you do anything else. Every later template assumes this one exists and is honest.<\/p>\n<p>Duplicate this file, rename it <code>business-brief-&lt;business&gt;.md<\/code>, and fill it in. Delete the example text as you go.<\/p>\n<hr />\n<h2>1. The one-sentence definition<\/h2>\n<blockquote>\n<p>We sell <strong>[what]<\/strong> to <strong>[whom]<\/strong> instead of <strong>[what they would otherwise do]<\/strong>.<\/p>\n<\/blockquote>\n<p>Write it as one sentence. If you need two, your business is either two businesses or you have not decided yet.<\/p>\n<p><strong>Your answer:<\/strong><\/p>\n<pre><code>We sell ______________ to ______________ instead of ______________.\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong><\/p>\n<pre><code>We sell a fixed-price monthly bookkeeping service to owner-operated trades\nbusinesses in Spain doing 100k-500k EUR revenue, instead of them doing it in\na spreadsheet at 11pm on Sundays or paying a traditional gestoria who only\ntalks to them once a quarter.\n<\/code><\/pre>\n<p>Notice what the example does: it names a specific buyer, a revenue band, and <em>two<\/em> named alternatives, one of which is \"do it yourself badly.\"<\/p>\n<hr />\n<h2>2. Real alternatives<\/h2>\n<p>List everything the buyer could do with the money and the problem. You must include \"do nothing\" and \"do it manually / in-house.\"<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Alternative<\/th>\n<th>Why a buyer picks it<\/th>\n<th>Why they don't<\/th>\n<th>How often we lose to it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Do nothing<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Do it manually / in-house<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example (rows 1-3):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Alternative<\/th>\n<th>Why a buyer picks it<\/th>\n<th>Why they don't<\/th>\n<th>How often we lose to it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Do nothing, keep the spreadsheet<\/td>\n<td>Free, they already know how, no decision required<\/td>\n<td>It breaks at tax time and they lose a weekend<\/td>\n<td>~50% of lost deals<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Local gestoria<\/td>\n<td>Cheap, personal, \"my father used them\"<\/td>\n<td>Slow, no visibility between quarters, no advice<\/td>\n<td>~30%<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Cloud accounting software (self-serve)<\/td>\n<td>30 EUR/month, modern UI<\/td>\n<td>Still requires them to do the work<\/td>\n<td>~20%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The most important row is row 1.<\/strong> Most businesses lose more deals to inertia than to named competitors. If you cannot say why someone changes from doing nothing, you do not have a marketing problem, you have a proposition problem.<\/p>\n<hr />\n<h2>3. Demand capture vs. demand creation audit<\/h2>\n<p>List every marketing activity currently running (yours, or a competitor's if you have none). Classify each.<\/p>\n<table>\n<thead>\n<tr>\n<th>Activity<\/th>\n<th>Capture or creation<\/th>\n<th>Monthly spend / hours<\/th>\n<th>What it produces<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Totals:<\/strong><\/p>\n<ul>\n<li>Capture: <strong><em>_<\/em>_ % of spend, <\/strong>____ % of hours<\/li>\n<li>Creation: <strong><em>_<\/em>_ % of spend, <\/strong>____ % of hours<\/li>\n<\/ul>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Activity<\/th>\n<th>Capture or creation<\/th>\n<th>Monthly spend / hours<\/th>\n<th>What it produces<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google Ads on \"bookkeeping for tradesmen\"<\/td>\n<td>Capture<\/td>\n<td>900 EUR<\/td>\n<td>12 leads/mo, 3 close<\/td>\n<\/tr>\n<tr>\n<td>SEO articles on tax deadlines<\/td>\n<td>Capture<\/td>\n<td>6 h<\/td>\n<td>400 visits/mo, 1 lead<\/td>\n<\/tr>\n<tr>\n<td>LinkedIn posts about trades business finances<\/td>\n<td>Creation<\/td>\n<td>8 h<\/td>\n<td>No direct leads, 2 inbound \"I've been reading you\" per quarter<\/td>\n<\/tr>\n<tr>\n<td>Referral ask in onboarding email<\/td>\n<td>Neither (retention/loop)<\/td>\n<td>0<\/td>\n<td>2 referrals/mo<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Totals: capture 100% of spend, ~60% of hours. Creation ~40% of hours, 0% of spend.<\/p>\n<p><strong>Now answer:<\/strong><\/p>\n<ul>\n<li>If existing demand doubled tomorrow, could we capture it? <strong><em>_<\/em><\/strong><\/li>\n<li>If we saturated existing demand, what would refill the top? <strong><em>_<\/em><\/strong><\/li>\n<li>Is our split defensible, or is it just what was easiest to measure? <strong><em>_<\/em><\/strong><\/li>\n<\/ul>\n<hr />\n<h2>4. The 4 Ps assessment<\/h2>\n<p>One honest sentence per P. Then score each 1-5 (1 = actively losing us business, 5 = a genuine advantage).<\/p>\n<table>\n<thead>\n<tr>\n<th>P<\/th>\n<th>Your one sentence<\/th>\n<th>Score 1-5<\/th>\n<th>Evidence for the score<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Product<\/strong> — what it is, what job it does<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Price<\/strong> — the number, and the rationale for the number<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Place<\/strong> — where and how it can be bought<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Promotion<\/strong> — how people find out<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>For services and software, add:<\/p>\n<table>\n<thead>\n<tr>\n<th>P<\/th>\n<th>Your one sentence<\/th>\n<th>Score 1-5<\/th>\n<th>Evidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>People<\/strong> — who the buyer interacts with<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Process<\/strong> — what buying and onboarding feels like<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Physical evidence<\/strong> — reviews, cases, credibility signals<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Weakest P:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/p>\n<p><strong>Filled example of a good \"weakest P\" answer:<\/strong><\/p>\n<pre><code>Weakest P: Place (2/5). We are only buyable by booking a 45-minute call with\nthe founder, which happens 6 days out. Roughly 40% of people who book do not\nshow. There is no way to buy without talking to a human, and no self-serve\nstarter tier. Our promotion is generating demand our distribution cannot absorb.\n<\/code><\/pre>\n<p>That is a useful answer because it names a mechanism and a number. \"Our promotion is weak\" is not an answer.<\/p>\n<hr />\n<h2>5. The constraint blocking a doubling<\/h2>\n<p>Complete this sentence. It must be a constraint, not a wish.<\/p>\n<blockquote>\n<p>For this business to double in the next 12 months, the thing that would have to change is: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/p>\n<\/blockquote>\n<p><strong>Test your answer against these:<\/strong><\/p>\n<ul>\n<li>A wish: \"more sales\", \"more traffic\", \"better brand awareness\", \"more leads\"<\/li>\n<li>A constraint: \"We have no way to reach the ~4,000 trades businesses in this revenue band who are not searching for bookkeeping, because they don't know it can be outsourced.\"<\/li>\n<li>A constraint: \"Our close rate is 25% and every additional lead costs 180 EUR, so at current margin we cannot buy our way to double.\"<\/li>\n<li>A constraint: \"One person delivers the service and is at capacity in March, June, September and December.\"<\/li>\n<\/ul>\n<p><strong>Your answer:<\/strong><\/p>\n<pre><code>\n<\/code><\/pre>\n<p><strong>Then:<\/strong> is that constraint on the demand side, the conversion side, the delivery side, or the money side? Circle one. If it is not on the demand side, marketing is not your bottleneck right now and you should say so out loud.<\/p>\n<ul>\n<li>[ ] Demand (not enough of the right people know / want)<\/li>\n<li>[ ] Conversion (enough want, not enough buy)<\/li>\n<li>[ ] Delivery (they buy, we cannot serve them)<\/li>\n<li>[ ] Money (unit economics do not allow buying growth)<\/li>\n<\/ul>\n<hr />\n<h2>What good looks like<\/h2>\n<p>A finished brief is specific enough that a stranger could read it and correctly guess what your next three marketing decisions should be. Every claim has a number or a named example behind it. The alternatives section names \"do nothing\" as a real competitor with a real share of losses. The constraint is one sentence, mechanical, and uncomfortable to read.<\/p>\n<h2>Common failure<\/h2>\n<p>Writing the brief as marketing copy instead of a diagnosis. If your 4 Ps section says everything is a 4 or a 5, and your constraint is \"brand awareness,\" you have written an advertisement for yourself and learned nothing. The brief is only useful when it is unflattering. Force yourself to give at least one P a score of 2 or lower and to justify it with evidence.<\/p>"}, {"slug": "campaign-brief", "title": "Campaign Brief", "blurb": "Use with: M09-M11 (content, paid search, paid social), M19 capstone", "html": "<h1>Campaign Brief<\/h1>\n<p><strong>Use with:<\/strong> M09-M11 (content, paid search, paid social), M19 capstone\n<strong>Time to fill:<\/strong> 45 minutes\n<strong>Rule:<\/strong> no campaign launches without one of these signed, including the success and kill criteria.<\/p>\n<p>A campaign brief exists to force the arguments to happen <em>before<\/em> the money is spent. Half the value of this document is the fights it causes in the first 45 minutes.<\/p>\n<p>One brief per campaign. If you cannot fit it on two pages, it is two campaigns.<\/p>\n<hr />\n<h2>Header<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Campaign name<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Owner<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Launch date<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>End date (or review date)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Total budget<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Status<\/td>\n<td>Draft / Approved / Live / Ended<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>1. Objective<\/h2>\n<p>One objective. Not three. State it as a number and a date.<\/p>\n<pre><code>Objective:\n<\/code><\/pre>\n<p><strong>Also state which stage of demand this serves:<\/strong><\/p>\n<ul>\n<li>[ ] Demand creation (people who were not looking)<\/li>\n<li>[ ] Demand capture (people already searching)<\/li>\n<li>[ ] Conversion / reactivation (people who already know us)<\/li>\n<\/ul>\n<p><strong>Filled example:<\/strong> \"Acquire 60 new trial signups from trades-business owners in Andalusia between 1 Oct and 30 Nov at a cost per signup under 45 EUR. This is demand creation: the audience is not searching for us.\"<\/p>\n<p><strong>Failing example:<\/strong> \"Increase brand awareness and drive engagement while generating qualified leads.\" That is three objectives and no number, so nothing can be judged.<\/p>\n<hr />\n<h2>2. Audience<\/h2>\n<p>Pull from <code>icp-and-jtbd.md<\/code>. Do not re-derive it here; do narrow it.<\/p>\n<ul>\n<li><strong>Segment:<\/strong><\/li>\n<li><strong>The situation they are in when they see this:<\/strong><\/li>\n<li><strong>What they currently believe:<\/strong><\/li>\n<li><strong>What they must believe after seeing it:<\/strong><\/li>\n<li><strong>Explicitly excluded from targeting:<\/strong><\/li>\n<li><strong>Estimated reachable size:<\/strong><\/li>\n<\/ul>\n<p>The gap between \"currently believe\" and \"must believe\" is the actual job of the campaign. If those two lines are the same, there is no campaign.<\/p>\n<hr />\n<h2>3. Insight<\/h2>\n<p>One non-obvious true thing about this audience, ideally from an interview or a support ticket, that the campaign is built on. It should make someone say \"huh.\"<\/p>\n<pre><code>Insight:\nSource of the insight:\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong><\/p>\n<pre><code>Insight: Trades owners do not avoid bookkeeping because it is hard. They avoid\nit because opening the folder means confronting how much of last quarter they\ncannot account for, and they would rather not know. Three of five interviewees\ndescribed a feeling of dread, not of difficulty.\nSource: interviews 2, 3 and 5, plus 14 support tickets tagged &quot;catch-up&quot;.\n<\/code><\/pre>\n<p>Note what this unlocks: the campaign should promise relief from dread and explicitly forgive the mess, not promise \"easy accounting.\" A whole category of competitor messaging is now wrong for this audience.<\/p>\n<p><strong>A failing insight:<\/strong> \"Our audience is busy and values convenience.\" True of everyone, so it directs nothing.<\/p>\n<hr />\n<h2>4. Single-minded proposition<\/h2>\n<p>One sentence. The one thing you would say if you could say only one thing. Everything in the campaign supports it or is cut.<\/p>\n<pre><code>SMP:\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong> \"Hand over the mess exactly as it is — we have seen worse and we do not care.\"<\/p>\n<p><strong>Test it:<\/strong><\/p>\n<ul>\n<li>[ ] Is it one idea, not two joined with \"and\"?<\/li>\n<li>[ ] Could a competitor say it? (If yes, it is not yours.)<\/li>\n<li>[ ] Does it follow from the insight?<\/li>\n<li>[ ] Would the audience find it surprising or relieving?<\/li>\n<\/ul>\n<hr />\n<h2>5. Offer<\/h2>\n<p>The offer is the thing the person gets and what they must do to get it. <strong>The offer beats the ad<\/strong>: a mediocre ad for a strong offer outperforms a brilliant ad for a weak one, reliably.<\/p>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Instruction<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What they get<\/td>\n<td>Concrete, nameable<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What they give<\/td>\n<td>Money, an email, 20 minutes, a phone number<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Why now<\/td>\n<td>Deadline, seasonality, scarcity — must be real<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Risk reversal<\/td>\n<td>Guarantee, free first month, no card, cancel anytime<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Price / cost to them<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What makes this better than our standing offer<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What they get<\/td>\n<td>A free \"catch-up assessment\": we look at last quarter's mess and tell you exactly what is missing and what it will cost to fix. Written, one page, yours to keep even if you never hire us.<\/td>\n<\/tr>\n<tr>\n<td>What they give<\/td>\n<td>20 minutes and read access to their bank export<\/td>\n<\/tr>\n<tr>\n<td>Why now<\/td>\n<td>The Q4 filing deadline is 20 January; after 10 January we cannot take catch-up work<\/td>\n<\/tr>\n<tr>\n<td>Risk reversal<\/td>\n<td>No card, no call required to receive the document, no follow-up if they say no<\/td>\n<\/tr>\n<tr>\n<td>Price<\/td>\n<td>Free<\/td>\n<\/tr>\n<tr>\n<td>Better than standing offer<\/td>\n<td>The standing offer is \"book a demo,\" which requires them to already have decided. This one gets value into their hands before any decision.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>6. Channels<\/h2>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>Role<\/th>\n<th>Budget<\/th>\n<th>Format / placement<\/th>\n<th>Why this channel for this audience<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Channels considered and rejected for this campaign:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>Why not<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>7. Creative angles<\/h2>\n<p>At least four genuinely different angles, not four rewrites of one. In an AI-targeting era the creative <em>is<\/em> the targeting: the ad decides who leans in, more than the audience settings do.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Angle<\/th>\n<th>Hook line<\/th>\n<th>Format<\/th>\n<th>Which force it addresses (push/pull/anxiety/habit)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Angle<\/th>\n<th>Hook line<\/th>\n<th>Format<\/th>\n<th>Force<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Absolution<\/td>\n<td>\"We have seen a shoebox of receipts and a bank app. We were not shocked.\"<\/td>\n<td>Static, plain text on brand colour<\/td>\n<td>Anxiety<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>The dread, named<\/td>\n<td>\"You're not bad at admin. You just don't want to open the folder.\"<\/td>\n<td>20s talking-head, founder<\/td>\n<td>Push<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Deadline arithmetic<\/td>\n<td>\"20 January. Here's how long catch-up actually takes.\"<\/td>\n<td>Carousel, 5 frames<\/td>\n<td>Push<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Peer proof<\/td>\n<td>Electrician on camera: \"I sent them eleven months of chaos in one WhatsApp.\"<\/td>\n<td>35s customer video<\/td>\n<td>Habit / anxiety<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Demonstration<\/td>\n<td>The actual one-page summary, on screen, 15 seconds<\/td>\n<td>Screen recording<\/td>\n<td>Pull<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>8. Assets needed<\/h2>\n<table>\n<thead>\n<tr>\n<th>Asset<\/th>\n<th>Spec<\/th>\n<th>Owner<\/th>\n<th>Due<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Do not forget the unglamorous ones: the landing page, the thank-you page, the confirmation email, the UTM sheet, the conversion event, the internal notification, the sales follow-up script, and whatever the sales or delivery side needs so the leads do not rot.<\/p>\n<hr />\n<h2>9. Budget<\/h2>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<th>%<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Media<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Production<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tools / landing page<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Reserve for scaling a winner<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td><\/td>\n<td>100%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Cost per result we can afford (from <code>unit-economics-model.md<\/code>): ______<\/li>\n<li>Break-even cost per result: ______<\/li>\n<\/ul>\n<p>Always keep a scaling reserve. The most expensive mistake in campaign budgeting is finding a winner in week two with no money left to feed it.<\/p>\n<hr />\n<h2>10. Timeline<\/h2>\n<table>\n<thead>\n<tr>\n<th>Date<\/th>\n<th>Milestone<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td>Assets complete<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Tracking verified end to end (test conversion fired and visible)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Launch<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>First read (no changes before this date)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Mid-point review<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>End / decision<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Do-not-touch window:<\/strong> ______ days from launch. Nobody changes budgets, creative, or targeting inside this window. Algorithmic channels need a learning period, and edits reset it.<\/p>\n<hr />\n<h2>11. Success criteria — written BEFORE launch<\/h2>\n<p>Fill this in before a single euro is spent. Signed by whoever holds the budget.<\/p>\n<table>\n<thead>\n<tr>\n<th>Metric<\/th>\n<th>Definition<\/th>\n<th>Target<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Primary<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Secondary<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Guardrail 1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Guardrail 2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>We will call this campaign a success if:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>\n<strong>We will call it a failure if:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>\n<strong>A result between those two means:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/p>\n<p><strong>Filled example:<\/strong><\/p>\n<ul>\n<li>Success: 60+ assessments delivered at ≤45 EUR each, and ≥20% of them convert to a paid client within 60 days.<\/li>\n<li>Failure: fewer than 25 assessments, or cost per assessment above 90 EUR, or assessment-to-client conversion below 8%.<\/li>\n<li>In between: extend 30 days at the same budget with the two best angles only, then decide.<\/li>\n<\/ul>\n<p>Writing the failure line before launch is the entire point. Afterwards, everyone becomes a genius at explaining why the number they got was the number they wanted.<\/p>\n<hr />\n<h2>12. Kill criteria<\/h2>\n<p>Conditions under which the campaign stops early, agreed in advance, checked on a schedule.<\/p>\n<table>\n<thead>\n<tr>\n<th>Condition<\/th>\n<th>Threshold<\/th>\n<th>Check when<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cost per result far above ceiling<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>No conversions after N clicks/spend<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Guardrail breached<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Qualitative<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Condition<\/th>\n<th>Threshold<\/th>\n<th>Check when<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cost per assessment<\/td>\n<td>&gt; 130 EUR<\/td>\n<td>Day 10, after do-not-touch window<\/td>\n<td>Pause, rebuild landing page before relaunching<\/td>\n<\/tr>\n<tr>\n<td>Zero conversions<\/td>\n<td>0 after 400 clicks<\/td>\n<td>Continuous<\/td>\n<td>Pause that ad set; the issue is the page or the offer, not the bid<\/td>\n<\/tr>\n<tr>\n<td>Lead quality<\/td>\n<td>&gt; 50% outside ICP<\/td>\n<td>Day 14<\/td>\n<td>Tighten offer wording, not targeting<\/td>\n<\/tr>\n<tr>\n<td>Brand risk<\/td>\n<td>Any comment thread turning hostile<\/td>\n<td>Continuous<\/td>\n<td>Owner reviews within 24h<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Note the \"check when\" column. A kill criterion with no scheduled check is a wish.<\/p>\n<hr />\n<h2>What good looks like<\/h2>\n<p>The insight came from a real customer and would surprise a competitor. The single-minded proposition is one idea that only you could credibly say. The success and failure numbers were written before launch and the person who owns the budget agreed to them in writing. Creative angles address push and anxiety, not just pull. There is money left over to scale the winner.<\/p>\n<h2>Common failure<\/h2>\n<p>Defining success after the results arrive. Every campaign produces some metric that went up, and a brief without pre-committed criteria will always be reported as a partial success, which means you learn nothing and repeat it. The second failure is a brief with five objectives — it produces creative that says everything, which reads as saying nothing.<\/p>"}, {"slug": "content-brief", "title": "Content Brief", "blurb": "Use with: M08 (SEO and AI search) and M09 (content and organic social)", "html": "<h1>Content Brief<\/h1>\n<p><strong>Use with:<\/strong> M08 (SEO and AI search) and M09 (content and organic social)\n<strong>Time to fill:<\/strong> 30 minutes\n<strong>Rule:<\/strong> no piece gets written without one. The brief is where the thinking happens; the writing is execution.<\/p>\n<p>In 2026 a competent draft costs almost nothing to produce. That means the draft is not the valuable part. The valuable part is deciding what is worth saying, and having something to say that nobody else can say. This brief is built around that constraint.<\/p>\n<hr />\n<h2>Header<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Working title<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Owner / writer<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Format<\/td>\n<td>Article / guide / comparison / calculator / video / teardown<\/td>\n<\/tr>\n<tr>\n<td>Target publish date<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Word count target<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Status<\/td>\n<td>Brief / Draft / Review / Published<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>1. Target query and intent<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Instruction<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Primary query<\/td>\n<td>The exact phrase, in the searcher's words<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Monthly volume<\/td>\n<td>From Keyword Planner or Search Console; \"low but qualified\" is a valid answer<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Secondary queries<\/td>\n<td>3-8 close variants this should also serve<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Intent type<\/td>\n<td>Informational / commercial investigation / transactional / navigational<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What currently ranks<\/td>\n<td>Top 3 results and what format they are<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Does an AI Overview appear?<\/td>\n<td>Yes / No — and what does it currently say<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Realistic outcome<\/td>\n<td>Rank, be cited by AI answers, or neither (published for another reason)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Primary query<\/td>\n<td>\"how much does a gestoria cost for an autonomo\"<\/td>\n<\/tr>\n<tr>\n<td>Volume<\/td>\n<td>1,300/mo<\/td>\n<\/tr>\n<tr>\n<td>Secondary<\/td>\n<td>\"precio gestoria autonomo 2026\", \"cuanto cobra una gestoria\", \"gestoria online precio\"<\/td>\n<\/tr>\n<tr>\n<td>Intent<\/td>\n<td>Commercial investigation — they are pricing an alternative, not learning a concept<\/td>\n<\/tr>\n<tr>\n<td>What ranks<\/td>\n<td>Two comparison-site listicles with no real numbers, one competitor's pricing page<\/td>\n<\/tr>\n<tr>\n<td>AI Overview<\/td>\n<td>Yes. It currently gives a vague 40-100 EUR/month range with no conditions attached.<\/td>\n<\/tr>\n<tr>\n<td>Realistic outcome<\/td>\n<td>Being the source with actual ranges by business type is the opening. Cite-ability matters more than position 1 here.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Reality check before proceeding:<\/strong> roughly 60% of searches now end without a click, and when an AI Overview is present the top organic result loses more than half its click-through. If the only value of this piece is traffic from this query, and an AI Overview already answers it well, the piece may not be worth writing. Say so and pick something else. This is the most useful decision this brief can produce.<\/p>\n<p><strong>Why is this piece worth writing anyway?<\/strong><\/p>\n<ul>\n<li>[ ] The AI answer is currently wrong or vague and we can be the correction<\/li>\n<li>[ ] It serves people who will click because they need to evaluate <em>us<\/em><\/li>\n<li>[ ] It is not for search at all — it is for sales enablement, email, or social<\/li>\n<li>[ ] It builds the entity/topic authority we need for a cluster<\/li>\n<li>[ ] It is a genuine differentiator that will get referenced by others<\/li>\n<\/ul>\n<hr />\n<h2>2. The searcher's actual question<\/h2>\n<p>Behind the keyword there is a person with a real question, usually messier and more specific than the query string. Write the question they would ask a knowledgeable friend, in their words.<\/p>\n<pre><code>\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong> \"I'm a self-employed electrician doing about 90k. Am I being ripped off paying 120 a month, and what should I actually be getting for that?\"<\/p>\n<p><strong>And the question behind that one:<\/strong><\/p>\n<pre><code>\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong> \"Am I the kind of business that needs to worry about this, or am I overthinking it?\"<\/p>\n<p>The second question is usually the one the best content answers. It is also the one nobody writes about, because it does not look like a keyword.<\/p>\n<hr />\n<h2>3. Angle<\/h2>\n<p>The point of view. What this piece argues that the existing results do not.<\/p>\n<pre><code>Angle:\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong> \"Price is the wrong question. The variable that decides your cost is how much of the bookkeeping arrives already organised, and nobody tells you that, so here are real ranges by how messy your inputs are.\"<\/p>\n<p><strong>Test:<\/strong> could the top-ranking article have this angle? If yes, you are writing the eleventh version of an existing page and you will lose on domain authority alone.<\/p>\n<hr />\n<h2>4. What only we can say<\/h2>\n<p>The single most important box on this sheet. List the assets that make this piece impossible for a competitor to copy in an afternoon.<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>What we have<\/th>\n<th>How we will use it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Proprietary data<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Direct experience<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Access to people<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A contrarian, defensible position<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Something we built<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>What we have<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Proprietary data<\/td>\n<td>Actual monthly fees paid by 340 trades clients before they moved to us, by revenue band<\/td>\n<td>The core table of the article — real ranges, n stated<\/td>\n<\/tr>\n<tr>\n<td>Direct experience<\/td>\n<td>We have done catch-up work on 60 messy accounts and know the hours it takes<\/td>\n<td>The \"what makes it expensive\" section, with hours<\/td>\n<\/tr>\n<tr>\n<td>Access to people<\/td>\n<td>Two gestores who will speak candidly off the record<\/td>\n<td>One quote each on how pricing is really set<\/td>\n<\/tr>\n<tr>\n<td>Contrarian position<\/td>\n<td>Cheap monthly fees are usually repriced upward once the mess is visible<\/td>\n<td>The argument the listicles will never make<\/td>\n<\/tr>\n<tr>\n<td>Something we built<\/td>\n<td>A 6-field cost estimator<\/td>\n<td>Embedded, and the reason people link to this page<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>If this box is empty, do not write the piece.<\/strong> A brief with an empty \"what only we can say\" is a request for generic content, and generic content in 2026 is a rounding error: nobody links to it, no model cites it, and it does not move anybody toward buying. Go and get an asset — run an analysis on your own data, interview two customers, or build a small tool — and come back.<\/p>\n<hr />\n<h2>5. Outline<\/h2>\n<p>H2/H3 level. Answer the primary question in the first 100 words; do not make people scroll for it.<\/p>\n<pre><code>H1:\n\nOpening (answer the question immediately, in 2-3 sentences):\n\nH2:\n  - point\n  - point\nH2:\n  - point\n  - point\nH2:\n  - point\nH2:\n  - point\nClose / next step:\n<\/code><\/pre>\n<p><strong>Structural rules:<\/strong><\/p>\n<ul>\n<li>Answer first, then justify. The inverted pyramid works for both humans who are scanning and for models that extract.<\/li>\n<li>One idea per H2, and write H2s as the questions people actually ask.<\/li>\n<li>Tables and lists for anything comparative — they are easier for a human to scan and far more likely to be extracted as an answer.<\/li>\n<li>No throat-clearing. Delete every sentence before the answer that begins \"In today's fast-paced business environment.\"<\/li>\n<\/ul>\n<hr />\n<h2>6. Structured answer block (for AI citation)<\/h2>\n<p>Include a self-contained block that answers the primary question completely in 40-80 words, near the top, without pronouns that depend on earlier context and without \"as we mentioned above.\" This is what gets lifted into an answer engine, and it needs to make sense standing alone.<\/p>\n<pre><code>Question:\n\nAnswer (40-80 words, self-contained, includes the specific numbers or conditions):\n\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong><\/p>\n<pre><code>Question: How much does a gestoria cost for a self-employed worker in Spain?\n\nAnswer: A gestoria for a self-employed worker in Spain typically costs 40-90\nEUR per month for basic quarterly filings, and 90-180 EUR per month if you\ninvoice more than about 15 times a month or need payroll. In 2026, prices rose\nroughly 8% year on year. The main cost driver is not your revenue but how\norganised your records arrive; unsorted receipts typically add 30-60 EUR per\nmonth.\n<\/code><\/pre>\n<p><strong>Checklist for the block:<\/strong><\/p>\n<ul>\n<li>[ ] Answers the question in the first sentence<\/li>\n<li>[ ] Contains specific numbers, ranges, or conditions<\/li>\n<li>[ ] Makes sense with zero surrounding context<\/li>\n<li>[ ] Names the entity (brand, place, year) so the citation is attributable<\/li>\n<li>[ ] Stated as fact, dated, and true — a model that cites you and is wrong is worse than not being cited<\/li>\n<\/ul>\n<p><strong>Supporting technical items:<\/strong><\/p>\n<ul>\n<li>[ ] FAQ section with 3-6 real questions, each answered in under 60 words<\/li>\n<li>[ ] Appropriate schema markup (Article, FAQPage, HowTo, Product — pick honestly)<\/li>\n<li>[ ] Author byline with real credentials and a real bio page (E-E-A-T: the experience part is the part most sites fake and it is the part that matters)<\/li>\n<li>[ ] Date of publication and last update, visible<\/li>\n<li>[ ] Sources cited with links where claims are external<\/li>\n<li>[ ] Canonical tag correct; the page is not a near-duplicate of an existing one<\/li>\n<\/ul>\n<hr />\n<h2>7. Internal links<\/h2>\n<table>\n<thead>\n<tr>\n<th>Link to<\/th>\n<th>Anchor text<\/th>\n<th>Why (what journey step does this serve)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Pages that should link TO this one:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>From<\/th>\n<th>Anchor text<\/th>\n<th>Who will add it<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Do not publish orphans. A page with no inbound internal links is a page you have decided does not matter.<\/p>\n<hr />\n<h2>8. Proof and data to include<\/h2>\n<table>\n<thead>\n<tr>\n<th>Claim to be made<\/th>\n<th>Evidence<\/th>\n<th>Source<\/th>\n<th>Verified<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Every number in the piece gets a row. Uncited numbers are how you lose the trust that makes the piece worth writing, and how you eventually get cited for something that turns out to be wrong.<\/p>\n<hr />\n<h2>9. Distribution plan<\/h2>\n<p>Publishing is not distribution. <strong>Distribution beats promotion, and both beat production.<\/strong> Plan the distribution before the writing starts, because it changes what you write.<\/p>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>What gets posted<\/th>\n<th>Who<\/th>\n<th>When<\/th>\n<th>Reformatted how<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Email list<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>LinkedIn / social<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Communities (name them)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Outreach to specific people<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Paid amplification<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Sales team use<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Named people or places this will be sent to:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>Why they would care<\/th>\n<th>Sent<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>If you cannot name five specific people or places that would care about this piece, it is probably not distinct enough to be worth writing. That is a useful test to apply while it is still a brief.<\/p>\n<hr />\n<h2>10. Success metric<\/h2>\n<p>One primary. Chosen for the actual purpose of the piece, not the default.<\/p>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Primary metric<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Target<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Check date<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Secondary signals<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What we do
