he creative earns the click. CVR tells you whether the page and offer deliver. For video, three more: hook rate (3-second views ÷ impressions — did the opening stop them), hold rate (thru-plays or 15-second views ÷ 3-second views — did it keep them), and thumbstop , used loosely for the same stopping power. A high hook rate with low hold rate means a clickbait opening the ad can't pay off. A low hook rate means the first frame failed and nothing downstream is diagnosable yet."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Advantage+ made manual detailed targeting largely obsolete<\/strong> in many verticals. Your job moved upstream: creative, offer, first-party data signals, and the optimisation goal you choose.<\/li>\n<li><strong>Chrome kept third-party cookies<\/strong> (confirmed April 2025), and Google retired most Privacy Sandbox technologies in October 2025. The constraints that actually degrade your social tracking are consent requirements, Safari ITP, ad blockers, and iOS ATT — which is exactly why server-side CAPI matters and why it isn't going away.<\/li>\n<li><strong>AI generation collapsed production cost, not judgment cost.<\/strong> You can produce fifty variations in an afternoon. Deciding which five concepts are worth producing is the skill that still pays.<\/li>\n<li><strong>Attribution windows lie in your favour.<\/strong> Platform-reported ROAS is self-reported and double-counted across platforms. Triangulate (M15).<\/li>\n<\/ul>", "text": "Advantage+ made manual detailed targeting largely obsolete in many verticals. Your job moved upstream: creative, offer, first-party data signals, and the optimisation goal you choose. Chrome kept third-party cookies (confirmed April 2025), and Google retired most Privacy Sandbox technologies in October 2025. The constraints that actually degrade your social tracking are consent requirements, Safari ITP, ad blockers, and iOS ATT — which is exactly why server-side CAPI matters and why it isn't going away. AI generation collapsed production cost, not judgment cost. You can produce fifty variations in an afternoon. Deciding which five concepts are worth producing is the skill that still pays. Attribution windows lie in your favour. Platform-reported ROAS is self-reported and double-counted across platforms. Triangulate (M15)."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Choosing the wrong objective<\/strong> and then blaming the creative.<\/li>\n<li><strong>Splitting budget across many small ad sets,<\/strong> guaranteeing permanent learning limited status.<\/li>\n<li><strong>Testing colours and button text<\/strong> while never testing a genuinely different idea.<\/li>\n<li><strong>Killing ads after one day.<\/strong> You need enough conversions to distinguish signal from noise (M14).<\/li>\n<li><strong>Judging creative by internal taste.<\/strong> The team hates the ad that works. This happens constantly.<\/li>\n<li><strong>Running pixel only, no CAPI.<\/strong> You are optimising on partial data and blaming the algorithm.<\/li>\n<li><strong>Uncapped retargeting<\/strong> — high reported ROAS, low real incrementality, annoyed audience.<\/li>\n<li><strong>Reusing your TV-style brand film as a performance ad.<\/strong> Wrong pacing, no hook, no offer.<\/li>\n<\/ul>", "text": "Choosing the wrong objective and then blaming the creative. Splitting budget across many small ad sets, guaranteeing permanent learning limited status. Testing colours and button text while never testing a genuinely different idea. Killing ads after one day. You need enough conversions to distinguish signal from noise (M14). Judging creative by internal taste. The team hates the ad that works. This happens constantly. Running pixel only, no CAPI. You are optimising on partial data and blaming the algorithm. Uncapped retargeting — high reported ROAS, low real incrementality, annoyed audience. Reusing your TV-style brand film as a performance ad. Wrong pacing, no hook, no offer."}, {"h": "Exercise (50 minutes)", "html": "<p>For <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li><strong>Five creative concepts, genuinely distinct angles.<\/strong> For each, write: the audience, the belief before, the belief after, the hook line (the literal first sentence or first visual), the format, the proof element, and the CTA. Concepts must differ at the idea level — five UGC videos with different scripts is one concept, not five.<\/li>\n<li><strong>The test plan.<\/strong> Which concept is the control, what budget and duration, what optimisation event, and what minimum number of conversions you need before you'll judge anything. State in advance the metric that decides the winner, and the kill criterion for a loser.<\/li>\n<li><strong>The math.<\/strong> Estimate CPM, CTR and landing page CVR for your category, compute expected CPA, and compare it to your CAC ceiling from M05. If the math doesn't work, write which of the three numbers has to move and by how much.<\/li>\n<li><strong>One brief.<\/strong> Write the full creative brief for your strongest concept, in the format above, as if handing it to someone else to produce.<\/li>\n<li><strong>Signal setup.<\/strong> List the events you would send server-side and the customer parameters you would pass. Note what you cannot collect under consent rules.<\/li>\n<\/ol>", "text": "For your chosen business : Five creative concepts, genuinely distinct angles. For each, write: the audience, the belief before, the belief after, the hook line (the literal first sentence or first visual), the format, the proof element, and the CTA. Concepts must differ at the idea level — five UGC videos with different scripts is one concept, not five. The test plan. Which concept is the control, what budget and duration, what optimisation event, and what minimum number of conversions you need before you'll judge anything. State in advance the metric that decides the winner, and the kill criterion for a loser. The math. Estimate CPM, CTR and landing page CVR for your category, compute expected CPA, and compare it to your CAC ceiling from M05. If the math doesn't work, write which of the three numbers has to move and by how much. One brief. Write the full creative brief for your strongest concept, in the format above, as if handing it to someone else to produce. Signal setup. List the events you would send server-side and the customer parameters you would pass. Note what you cannot collect under consent rules."}, {"h": "Recall (15 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Why creative is now the targeting mechanism.<\/li>\n<li>The learning phase threshold and why over-segmenting budget breaks it.<\/li>\n<li>The concept/angle/format/variation hierarchy, and where testing budget belongs.<\/li>\n<li>The CPM × CTR × CVR chain, and what doubling CTR does to CPA.<\/li>\n<li>Hook rate vs. hold rate, and what a high hook / low hold pattern tells you.<\/li>\n<li>Why retargeting ROAS overstates its value.<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Why creative is now the targeting mechanism. The learning phase threshold and why over-segmenting budget breaks it. The concept/angle/format/variation hierarchy, and where testing budget belongs. The CPM × CTR × CVR chain, and what doubling CTR does to CPA. Hook rate vs. hold rate, and what a high hook / low hold pattern tells you. Why retargeting ROAS overstates its value."}, {"h": "If you remember one thing", "html": "<p><strong>On paid social you are not buying an audience, you are buying attention with an idea — and the idea decides who shows up.<\/strong> Fix the hook before you touch the targeting.<\/p>", "text": "On paid social you are not buying an audience, you are buying attention with an idea — and the idea decides who shows up. Fix the hook before you touch the targeting."}], "suggest": [["Why is creating demand harder than harvesting existing intent?", "What does creative-as-targeting look like for a tiny business?", "When is paid social simply the wrong channel for me?"], ["Why does interruption force longer copy than a search ad needs?", "Show me a hook that proves the problem before it sells anything", "If Advantage+ decides delivery, when should I still narrow targeting?"], ["Walk me through the CPM to CPA chain more slowly", "Run that CPA maths with a EUR 15 CPM and 0.8% CTR", "Chase a cheaper CPM or a better CTR first, and why?"], ["What does server-side CAPI capture that the pixel misses?", "Which first-party signals can I send with only 200 customers?", "How do I judge fifty AI-made variants without burning budget?"], ["Why does splitting budget across ad sets cause learning limited?", "How many conversions before I am allowed to kill an ad?", "My team hates the ad that works: how do I defend it?"], ["What makes a concept genuinely distinct, not just a new script?", "Give me a belief-before and belief-after for a local service", "How do I write a kill criterion I cannot argue myself out of?"], ["What does a high hook rate with a low hold rate tell me?", "Quiz me on the concept, angle, format, variation hierarchy", "Why does retargeting ROAS overstate what retargeting earned?"], ["What does the idea deciding who shows up mean in practice?", "How do I tell whether my hook or my landing page is the problem?", "When is targeting, rather than the hook, the actually broken part?"]], "assess": {"predict": "On Meta, if the platform decides who sees your ad, what is left for you to control that still determines who actually shows up?", "quiz": [{"q": "A brand runs four Meta ad sets at 25 euros a day each, optimising for purchase. All four sit in \"Learning limited\" and CPA is erratic. What is the fix and why?", "options": ["Switch the optimisation event to link clicks so there is enough volume to exit learning", "Consolidate into one ad set at 100 euros a day, because an ad set needs roughly 50 optimisation events in 7 days to exit learning", "Add more creative to each ad set so the algorithm has more to test", "Lower bids in each ad set to stretch the budget across more impressions"], "answer": 1, "why": "The learning phase needs roughly 50 optimisation events in 7 days, and four ad sets at 25 euros each will each fail to reach it where one at 100 euros would - consolidation is the module's explicit prescription. Switching to link clicks is the tempting shortcut but it tells the system to find cheap clickers rather than buyers, which is the objective error the module warns about."}, {"q": "CPM is 10 euros, CTR is 1%, and landing page CVR is 3%. What is CPA, and what happens if better creative doubles CTR to 2%?", "options": ["CPA is 33 euros, falling to 17 euros", "CPA is 33 euros, falling to 20 euros", "CPA is 100 euros, falling to 50 euros", "CPA is 30 euros, falling to 15 euros"], "answer": 0, "why": "1,000 impressions cost 10 euros; 1% CTR gives 10 clicks; 3% CVR gives 0.3 conversions, so CPA is 10 divided by 0.3, or about 33 euros. Doubling CTR gives 20 clicks and 0.6 conversions, so CPA halves to about 17 euros - 20 euros is what you get instead by lifting landing page CVR from 3% to 5%, which is the other lever."}, {"q": "A video ad has a hook rate of 41% and a hold rate of 6%. What does that pattern tell you?", "options": ["The first frame failed and nothing downstream is diagnosable yet", "The audience is saturated and frequency needs capping", "The opening stops people but the ad cannot pay off what it promised - a clickbait opening", "The optimisation event is set too deep in the funnel"], "answer": 2, "why": "Hook rate is 3-second views over impressions and hold rate is thru-plays over 3-second views; a high hook with a low hold means a clickbait opening the ad cannot pay off. A low hook rate would mean the first frame failed and nothing downstream is diagnosable - the opposite pattern to this one."}, {"q": "Your testing roadmap for next month is: three thumbnail variants, four caption rewrites, and two button texts. What does the module say about this plan?", "options": ["It is the correct place to start, since small tests are cheap and compound", "It is testing variations at the bottom of the hierarchy; concepts produce the outliers that carry the account, so spend testing budget high in the hierarchy", "It is fine provided each test reaches 50 conversions", "It should be reordered to test formats first, then variations, then concepts"], "answer": 1, "why": "The hierarchy is concept, then angle, then format, then variation - variations produce small differences while concepts produce the outliers that carry the account, so testing budget belongs high in the hierarchy. Reaching 50 conversions does not rescue a variation test; you would be measuring a difference too small to matter regardless of sample."}, {"q": "An account reports a 9.4 ROAS on retargeting and a 1.8 ROAS on prospecting, and the team wants to shift budget into retargeting. What is the module's position?", "options": ["Shift the budget - retargeting is measurably more efficient", "Shift the budget but cap frequency at 10 exposures per week", "Retargeting ROAS is fabricated by the platform and should be ignored entirely", "Retargeting is the most over-credited spend in most accounts; keep it, cap it, size it honestly, and prove its value with a geo or audience holdout rather than the platform's ROAS column"], "answer": 3, "why": "The module calls retargeting the most over-credited spend in most accounts because you are paying to reach people who already visited, many of whom would have returned anyway - so keep it, cap it, size it honestly and prove value with a holdout. Saying the number is fabricated overstates it: the conversions are real, they are just largely not incremental."}, {"q": "A B2B software brand assumes video always beats static and refuses to produce carousels or images. What does the module say?", "options": ["Correct for B2C, but B2B should use LinkedIn lead gen forms instead of any Meta creative", "Correct - static formats no longer earn distribution on any major platform", "Static images and carousels are cheap and fast to iterate and still win in many B2B and considered-purchase categories; do not assume video always beats static, test it", "Video wins only when hook rate exceeds 30%, otherwise static is preferable"], "answer": 2, "why": "The module lists static image and carousel among formats that consistently perform, notes they are cheap and fast to iterate and still win in many B2B and considered-purchase categories, and says explicitly not to assume video always beats static. The hook rate threshold is invented - the module gives no such rule."}], "cards": [{"front": "Why is creative now the targeting mechanism on Meta?", "back": "Advantage+ and broad targeting hand audience selection to the delivery system, which decides largely by watching who responds to this specific creative. You narrow with the hook, not with checkboxes."}, {"front": "What is the learning phase threshold, and what restarts learning?", "back": "Roughly 50 optimisation events in 7 days per ad set. Significant edits restart it: budget changes over about 20%, new creative, or a changed optimisation event."}, {"front": "Distinguish concept, angle, format and variation with an example of each.", "back": "Concept is a whole idea (the ad is a customer complaint about a competitor). Angle is the argument (speed vs price vs status). Format is the execution (UGC vs demo). Variation is thumbnail, caption, button."}, {"front": "What does the Conversions API do, and why does it improve performance as well as reporting?", "back": "It sends events server-side from your backend, matched by hashed email, phone and click ID. Better matching means better attribution and better optimisation, because the algorithm learns from more complete data. Run pixel plus CAPI, deduplicated by shared event_id."}, {"front": "What does a usable creative brief name?", "back": "The audience and their belief before the ad, the one thing they should believe after, the hook line, the proof, the offer, the call to action, format and duration, and the specific thing being tested."}, {"front": "What are the signs of creative fatigue and the refresh cadence at high spend?", "back": "Rising CPM with falling CTR on the same ad as frequency climbs in a saturating audience. At high spend, plan a meaningful new concept every 2-4 weeks, with 3-5 fresh concepts a month as a baseline production rate."}], "elaborate": ["Estimate CPM, CTR and landing page CVR for your chosen business's category, compute the expected CPA, and compare it to your CAC ceiling from M05. If the math does not work, name which of the three numbers has to move, by how much, and whether creative or the landing page is the cheaper place to move it.", "Write two genuinely different concepts for your chosen business - different at the idea level, not two scripts of the same idea. For each, state the belief before and the belief after, then explain how M07's CRO work would need to change to keep message match with each one."], "transfer": {"scenario": "A direct-to-consumer sleep brand spends 40,000 euros a month on Meta. Prospecting sits at 25,000 with a 2.1 reported ROAS; retargeting takes 15,000 with a 11.4 reported ROAS against an audience of roughly 4,000 monthly site visitors. Every prospecting ad is a version of the same 30-second brand film cut to different lengths. CPM has risen from 12 to 19 euros over six weeks while CTR fell from 1.4% to 0.7%. The pixel is installed but there is no CAPI. The team's plan is to move 10,000 euros from prospecting into retargeting.", "prompt": "Assess the plan and set out what you would do instead, in order.", "model": "Reject the plan. Fifteen thousand euros against roughly 4,000 monthly visitors already means the same small pool sees the ads many times a week; the 11.4 ROAS is the most over-credited number in the account, since those people had already visited and many would have returned anyway. More budget inflates the reported figure while buying almost no incremental revenue. In order: first, treat rising CPM with falling CTR as textbook fatigue - cuts of one brand film are one concept, not several, and a TV-style film has the wrong pacing, no hook and no offer, so brief three to five genuinely distinct concepts at the idea level. Second, install CAPI alongside the pixel with event_id deduplication; you are optimising on partial data. Third, cap retargeting frequency and tighten the window. Fourth, prove retargeting's value with a geo or audience holdout before sizing it."}}}, {"id": "M12", "num": 12, "part": "p2", "title": "Email and Lifecycle Marketing", "short": "Email & lifecycle", "meta": "90 minutes (40 read · 40 exercise · 10 recall)", "minutes": 90, "sections": [{"h": "Why this matters", "html": "<p>Every other channel is rented. Google changes the SERP, Meta changes the algorithm, TikTok changes what it promotes, and your traffic halves through no decision of yours. An email list is the only audience you own outright — a set of addresses you can reach without paying an intermediary for permission. For most ecommerce and subscription businesses, automated email flows produce a disproportionate share of channel revenue from a small fraction of sends. It is the highest-margin work in marketing and the least glamorous, which is why it is so often neglected.<\/p>", "text": "Every other channel is rented. Google changes the SERP, Meta changes the algorithm, TikTok changes what it promotes, and your traffic halves through no decision of yours. An email list is the only audience you own outright — a set of addresses you can reach without paying an intermediary for permission. For most ecommerce and subscription businesses, automated email flows produce a disproportionate share of channel revenue from a small fraction of sends. It is the highest-margin work in marketing and the least glamorous, which is why it is so often neglected."}, {"h": "Core concepts", "html": "<h3>Building the list without poisoning it<\/h3>\n<p>A list is only an asset if the people on it want to hear from you. Buying lists, pre-ticked consent boxes, and scraped addresses destroy deliverability for everyone on your domain, permanently.<\/p>\n<p>The lead magnet rule that matters: <strong>the magnet must be adjacent to the purchase, not merely popular.<\/strong> A €50 Amazon voucher builds a list of people who want vouchers. A \"20-point roof inspection checklist\" builds a list of people who own roofs and are worried about them. Generic magnets produce big lists with near-zero revenue per recipient, and then the unengaged majority drags your sender reputation down. Optimise the magnet for buyer adjacency, then for volume.<\/p>\n<p>Collection points that work: exit-intent and scroll-triggered popups with a real offer, checkout opt-in, post-purchase, content upgrades inside articles, webinars, and waitlists. Always capture the source in a field so you can segment by it later.<\/p>\n<h3>The five flows that make most of the money<\/h3>\n<p>Automated <strong>flows<\/strong> (triggered by behaviour) beat <strong>campaigns<\/strong> (one-off broadcasts) on revenue per recipient because they arrive at the moment of relevance.<\/p>\n<ol>\n<li><strong>Welcome / indoctrination<\/strong> (3–5 emails). Deliver the promised thing immediately, then: who you are and why you exist, the strongest proof you have, the objection handler, and a first-purchase offer. This flow typically earns the most per recipient of anything you send.<\/li>\n<li><strong>Abandoned cart and abandoned browse.<\/strong> Cart: 3 emails at roughly 1 hour, 24 hours, 72 hours — remind, handle the objection (shipping, returns, sizing), then incentivise only if margin allows. Browse abandonment is softer and lower intent; treat it as a nudge, not a chase.<\/li>\n<li><strong>Post-purchase / onboarding.<\/strong> Order confirmation and shipping updates are the highest-open emails you will ever send — use them. For software, onboarding is where churn is decided: drive to the activation action, not to a feature tour.<\/li>\n<li><strong>Winback.<\/strong> Triggered at a defined lapse point (e.g. 2× the median purchase interval). Ask what changed, offer a reason to return, and set a hard exit: if they don't engage after 3 emails, suppress them. Sending forever to the dead is how you lose the inbox.<\/li>\n<li><strong>Replenishment or upgrade.<\/strong> Consumables: time the email to just before the product runs out. SaaS or services: trigger on usage thresholds that signal readiness for the next tier.<\/li>\n<\/ol>\n<h3>Segmentation and RFM<\/h3>\n<p>Sending everything to everyone is what kills lists. The simplest durable framework is <strong>RFM<\/strong>: Recency, Frequency, Monetary value. Score customers on each, then treat the groups differently — champions get early access and referral asks, at-risk high-value customers get personal attention, one-time low-value buyers get a repeat-purchase nudge, and the never-engaged get a sunset sequence.<\/p>\n<p>For non-transactional lists, segment by source, by engagement recency (opened or clicked in 30/60/90 days), and by declared interest.<\/p>\n<h3>Personalisation that helps vs. creepy merge tags<\/h3>\n<p>Useful personalisation changes the <em>content<\/em>: showing the size they bought, the plan they're on, the city they're in when it affects delivery. Cosmetic personalisation — a first name pasted into a subject line — is neutral at best and actively unsettling when it's obviously automated (\"Hi {FIRSTNAME},\"). Personalise on behaviour you legitimately hold, and never demonstrate knowledge that will make someone uncomfortable about how you got it.<\/p>\n<h3>Subject lines and preview text<\/h3>\n<p>Subject line and preview text are one unit — the preview should extend the subject, not repeat it or show \"View in browser.\" Specific beats clever. Short and plain beats punctuation-heavy. Avoid full-caps, excessive emoji, and words that look like a shouting sale; they read as spam to humans and to filters. Test subject lines only when your list is large enough for the difference to be measurable (M14).<\/p>\n<h3>Metrics, and which ones are now broken<\/h3>\n<ul>\n<li><strong>Delivery rate<\/strong> — accepted by the receiving server. Watch bounces; over ~2% hard bounces means a hygiene problem.<\/li>\n<li><strong>Open rate — unreliable since Apple Mail Privacy Protection.<\/strong> MPP pre-fetches images for Apple Mail users, inflating opens and making them useless as an absolute measure and dangerous as an optimisation target. Use trend and relative comparison only, never as your headline number.<\/li>\n<li><strong>Click rate and click-to-open<\/strong> — the first honest engagement signal.<\/li>\n<li><strong>Conversion rate and revenue per recipient (RPR)<\/strong> — RPR is the number that lets you compare a flow to a campaign to a segment fairly. Make it your default.<\/li>\n<li><strong>Unsubscribe rate and spam complaint rate<\/strong> — the real health metrics. A campaign with great revenue and a rising complaint rate is borrowing from next quarter.<\/li>\n<\/ul>\n<h3>Deliverability fundamentals<\/h3>\n<p>Authentication is no longer optional. Gmail and Yahoo's bulk sender requirements (in force since 2024) mean you need:<\/p>\n<ul>\n<li><strong>SPF<\/strong> — DNS record listing who may send for your domain.<\/li>\n<li><strong>DKIM<\/strong> — cryptographic signature proving the message wasn't altered.<\/li>\n<li><strong>DMARC<\/strong> — a published policy telling receivers what to do when SPF/DKIM fail, plus reporting. Effectively mandatory for bulk senders to Gmail and Yahoo.<\/li>\n<li><strong>One-click unsubscribe<\/strong> in the header, honoured within two days.<\/li>\n<li><strong>Spam complaint rate kept under 0.3%<\/strong>, ideally under 0.1%. Cross it and delivery collapses.<\/li>\n<\/ul>\n<p>Beyond that: send from a subdomain (<code>mail.yourdomain.com<\/code>) so a mistake doesn't burn your corporate mail; warm new domains and IPs gradually; clean the list — remove hard bounces immediately and sunset subscribers with no opens or clicks in 6+ months even though it shrinks a number you like reporting. Reputation is behavioural: consistent volume, high engagement, low complaints.<\/p>\n<h3>Consent and law<\/h3>\n<p>Under <strong>GDPR/ePrivacy<\/strong> you need freely given, specific, informed consent for marketing email in the EU/UK, with a record of when and how it was given, and easy withdrawal. Under <strong>CAN-SPAM<\/strong> (US) the bar is lower — accurate headers and sender identity, a physical postal address, a working unsubscribe honoured within 10 business days — but the deliverability consequences of behaving as if consent were optional are worse than the legal ones. Legitimate interest can cover some B2B sending in some jurisdictions; check locally rather than assuming.<\/p>\n<h3>SMS and push<\/h3>\n<p>Higher open and response rates, far higher intrusiveness cost, and stricter consent rules (separate explicit opt-in, no implied consent from an email signup). Use SMS for time-critical, high-value moments only: delivery updates, appointment reminders, an abandoned cart at high basket value, a genuine deadline. One irrelevant 9pm text costs you the subscriber and possibly the customer. Push notifications follow the same logic with a lower cost per annoyance and a lower ceiling.<\/p>\n<h3>Lifecycle mapping<\/h3>\n<p>Lifecycle marketing is simply: define the stages a customer moves through, define the transition you want at each stage, and put a triggered message at each transition. Stages for most businesses: unaware → subscriber → first purchase → repeat → advocate, with lapse and churn as exits. For each stage write the desired next action, the trigger, the message, and the suppression rule that stops someone receiving two competing sequences at once.<\/p>", "text": "Building the list without poisoning it A list is only an asset if the people on it want to hear from you. Buying lists, pre-ticked consent boxes, and scraped addresses destroy deliverability for everyone on your domain, permanently. The lead magnet rule that matters: the magnet must be adjacent to the purchase, not merely popular. A €50 Amazon voucher builds a list of people who want vouchers. A \"20-point roof inspection checklist\" builds a list of people who own roofs and are worried about them. Generic magnets produce big lists with near-zero revenue per recipient, and then the unengaged majority drags your sender reputation down. Optimise the magnet for buyer adjacency, then for volume. Collection points that work: exit-intent and scroll-triggered popups with a real offer, checkout opt-in, post-purchase, content upgrades inside articles, webinars, and waitlists. Always capture the source in a field so you can segment by it later. The five flows that make most of the money Automated flows (triggered by behaviour) beat campaigns (one-off broadcasts) on revenue per recipient because they arrive at the moment of relevance. Welcome / indoctrination (3–5 emails). Deliver the promised thing immediately, then: who you are and why you exist, the strongest proof you have, the objection handler, and a first-purchase offer. This flow typically earns the most per recipient of anything you send. Abandoned cart and abandoned browse. Cart: 3 emails at roughly 1 hour, 24 hours, 72 hours — remind, handle the objection (shipping, returns, sizing), then incentivise only if margin allows. Browse abandonment is softer and lower intent; treat it as a nudge, not a chase. Post-purchase / onboarding. Order confirmation and shipping updates are the highest-open emails you will ever send — use them. For software, onboarding is where churn is decided: drive to the activation action, not to a feature tour. Winback. Triggered at a defined lapse point (e.g. 2× the median purchase interval). Ask what changed, offer a reason to return, and set a hard exit: if they don't engage after 3 emails, suppress them. Sending forever to the dead is how you lose the inbox. Replenishment or upgrade. Consu"}, {"h": "How it works in practice", "html": "<p>A weekly rhythm for a small business, roughly 2 hours:<\/p>\n<ul>\n<li><strong>Monday<\/strong> — check the previous week's flows: revenue per recipient by flow, unsubscribes, complaint rate, bounce rate. Fix anything trending wrong before you write anything new.<\/li>\n<li><strong>Midweek<\/strong> — build one campaign to a <em>segment<\/em>, not the whole list. Segment first, then write to that segment as if you were writing to one person in it.<\/li>\n<li><strong>Monthly<\/strong> — one flow improvement. Add an email, rewrite the weakest one, change a delay, or fix a suppression rule. Flows compound; campaigns don't.<\/li>\n<li><strong>Quarterly<\/strong> — list hygiene and a sunset sequence for the unengaged.<\/li>\n<\/ul>\n<p>Tooling is mostly interchangeable: Klaviyo for ecommerce, Mailchimp or Brevo for small general lists, HubSpot or Customer.io for B2B lifecycle. Pick on the strength of segmentation and flow builders, not on template galleries.<\/p>", "text": "A weekly rhythm for a small business, roughly 2 hours: Monday — check the previous week's flows: revenue per recipient by flow, unsubscribes, complaint rate, bounce rate. Fix anything trending wrong before you write anything new. Midweek — build one campaign to a segment , not the whole list. Segment first, then write to that segment as if you were writing to one person in it. Monthly — one flow improvement. Add an email, rewrite the weakest one, change a delay, or fix a suppression rule. Flows compound; campaigns don't. Quarterly — list hygiene and a sunset sequence for the unengaged. Tooling is mostly interchangeable: Klaviyo for ecommerce, Mailchimp or Brevo for small general lists, HubSpot or Customer.io for B2B lifecycle. Pick on the strength of segmentation and flow builders, not on template galleries."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Open rates are decoration.<\/strong> Apple Mail Privacy Protection broke them years ago and they have not recovered. Any advice, agency report, or tool that leads with open rate is out of date — judge on clicks, conversions and revenue per recipient.<\/li>\n<li><strong>Authentication is enforced, not advised.<\/strong> Without SPF, DKIM and DMARC aligned, bulk mail to Gmail and Yahoo simply doesn't arrive reliably.<\/li>\n<li><strong>First-party email data got more valuable, not less.<\/strong> As ad platforms lose browser signal to consent rules, Safari ITP, ad blockers and iOS ATT, hashed email is the identifier that still works — for customer match audiences, for CAPI matching, and for suppression lists. Your list is now an advertising asset as well as a channel.<\/li>\n<li><strong>AI writes competent email at zero cost,<\/strong> which means competent email no longer stands out. Specificity, real customer language and a genuine offer do.<\/li>\n<\/ul>", "text": "Open rates are decoration. Apple Mail Privacy Protection broke them years ago and they have not recovered. Any advice, agency report, or tool that leads with open rate is out of date — judge on clicks, conversions and revenue per recipient. Authentication is enforced, not advised. Without SPF, DKIM and DMARC aligned, bulk mail to Gmail and Yahoo simply doesn't arrive reliably. First-party email data got more valuable, not less. As ad platforms lose browser signal to consent rules, Safari ITP, ad blockers and iOS ATT, hashed email is the identifier that still works — for customer match audiences, for CAPI matching, and for suppression lists. Your list is now an advertising asset as well as a channel. AI writes competent email at zero cost, which means competent email no longer stands out. Specificity, real customer language and a genuine offer do."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>A generic lead magnet.<\/strong> Big list, no buyers, degraded reputation.<\/li>\n<li><strong>Campaigns but no flows.<\/strong> The flows are where the money is.<\/li>\n<li><strong>Blasting the whole list every time<\/strong> because segmenting shrinks the send count.<\/li>\n<li><strong>Never removing anyone.<\/strong> Unengaged subscribers actively suppress delivery to engaged ones.<\/li>\n<li><strong>Optimising subject lines for opens.<\/strong> You are optimising a broken metric, and clickbait subject lines raise complaints.<\/li>\n<li><strong>No plain-text alternative, image-only emails.<\/strong> They break, they look like spam, and they fail accessibility.<\/li>\n<li><strong>Treating unsubscribes as failure.<\/strong> An unsubscribe is far better than a spam complaint. Make it easy.<\/li>\n<li><strong>Ignoring transactional emails.<\/strong> The highest-attention messages you send, usually left at the platform default.<\/li>\n<\/ul>", "text": "A generic lead magnet. Big list, no buyers, degraded reputation. Campaigns but no flows. The flows are where the money is. Blasting the whole list every time because segmenting shrinks the send count. Never removing anyone. Unengaged subscribers actively suppress delivery to engaged ones. Optimising subject lines for opens. You are optimising a broken metric, and clickbait subject lines raise complaints. No plain-text alternative, image-only emails. They break, they look like spam, and they fail accessibility. Treating unsubscribes as failure. An unsubscribe is far better than a spam complaint. Make it easy. Ignoring transactional emails. The highest-attention messages you send, usually left at the platform default."}, {"h": "Exercise (40 minutes)", "html": "<p>For <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li><strong>Lead magnet.<\/strong> Write the magnet and one sentence explaining why it is adjacent to the purchase. Then write the alternative generic version, and state exactly what the difference would do to revenue per recipient.<\/li>\n<li><strong>The welcome flow — 3 emails, written in full.<\/strong> For each: trigger, delay, subject line, preview text, body, one call to action. Email 1 delivers the promise. Email 2 carries the strongest proof you actually have. Email 3 handles the biggest objection and makes the offer. Keep them shorter than feels comfortable.<\/li>\n<li><strong>Lifecycle map.<\/strong> Table it: stage, desired next action, trigger, message, suppression rule. Cover subscriber → first purchase → repeat → lapse, and mark which of the five flows sits at each transition.<\/li>\n<li><strong>Metrics and health.<\/strong> Define the three numbers you will report monthly (one of them revenue per recipient) and the two health limits that would make you stop sending — including your complaint-rate threshold.<\/li>\n<li><strong>Deliverability check.<\/strong> List whether SPF, DKIM and DMARC exist for the domain you'd send from, and what you'd fix first. If you don't have a domain yet, write the plan for the sending subdomain.<\/li>\n<\/ol>", "text": "For your chosen business : Lead magnet. Write the magnet and one sentence explaining why it is adjacent to the purchase. Then write the alternative generic version, and state exactly what the difference would do to revenue per recipient. The welcome flow — 3 emails, written in full. For each: trigger, delay, subject line, preview text, body, one call to action. Email 1 delivers the promise. Email 2 carries the strongest proof you actually have. Email 3 handles the biggest objection and makes the offer. Keep them shorter than feels comfortable. Lifecycle map. Table it: stage, desired next action, trigger, message, suppression rule. Cover subscriber → first purchase → repeat → lapse, and mark which of the five flows sits at each transition. Metrics and health. Define the three numbers you will report monthly (one of them revenue per recipient) and the two health limits that would make you stop sending — including your complaint-rate threshold. Deliverability check. List whether SPF, DKIM and DMARC exist for the domain you'd send from, and what you'd fix first. If you don't have a domain yet, write the plan for the sending subdomain."}, {"h": "Recall (10 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Why a lead magnet must be adjacent to the purchase.<\/li>\n<li>The five flows and what each contains.<\/li>\n<li>Why open rate is unreliable and what you use instead.<\/li>\n<li>SPF, DKIM, DMARC — what each does, and the spam complaint threshold.<\/li>\n<li>RFM, and one action for each of two RFM segments.<\/li>\n<li>Why an unsubscribe is better than a spam complaint.<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Why a lead magnet must be adjacent to the purchase. The five flows and what each contains. Why open rate is unreliable and what you use instead. SPF, DKIM, DMARC — what each does, and the spam complaint threshold. RFM, and one action for each of two RFM segments. Why an unsubscribe is better than a spam complaint."}, {"h": "If you remember one thing", "html": "<p><strong>The list is the only audience you own — and you keep it by sending less to fewer people, more relevantly.<\/strong> Flows beat campaigns; revenue per recipient beats open rate; complaint rate beats both as a warning.<\/p>", "text": "The list is the only audience you own — and you keep it by sending less to fewer people, more relevantly. Flows beat campaigns; revenue per recipient beats open rate; complaint rate beats both as a warning."}], "suggest": [["Why do a handful of automated flows out-earn all my campaigns?", "How small can a list be and still be worth the work?", "What could still take an owned email list away from me?"], ["Why does a voucher magnet wreck revenue per recipient?", "What would an adjacent lead magnet be for a service business?", "How does one bought list damage my whole sending domain?"], ["Why does one flow improvement beat one extra campaign?", "What does the Monday check look like with real numbers?", "I only have 90 minutes a week: what do I drop from this rhythm?"], ["What do SPF, DKIM and DMARC each actually do for me?", "Which numbers replace open rate on my weekly report?", "How is hashed email used for customer match audiences?"], ["Why do unengaged subscribers suppress delivery to engaged ones?", "What complaint rate should make me stop and investigate?", "Segmenting shrinks my send count: how do I check revenue held up?"], ["How short should each of the three welcome emails really be?", "What counts as my strongest proof for email two?", "I do not know my biggest objection yet: how do I find it?"], ["Remind me of the five flows and what belongs in each", "Give me one action each for a lapsed and a champion RFM segment", "Why is an unsubscribe better news than a spam complaint?"], ["How can sending less to fewer people raise total revenue?", "Show me revenue per recipient beating open rate on real figures", "When do campaigns matter more than flows for a business like mine?"]], "assess": {"predict": "Why might an email list be worth more to a business than a social following of the same size?", "quiz": [{"q": "A roofing company is choosing a lead magnet. Which one does the module's logic favour, and why?", "options": ["A 50 euro Amazon voucher, because it maximises signup volume at the lowest friction", "A monthly newsletter signup, because it sets expectations honestly from the start", "A 20-point roof inspection checklist, because it is adjacent to the purchase and builds a list of people who own roofs and are worried about them", "A prize draw for a free roof survey, because it combines volume with category relevance"], "answer": 2, "why": "The rule is that the magnet must be adjacent to the purchase, not merely popular - the voucher builds a list of people who want vouchers, and generic magnets produce big lists with near-zero revenue per recipient whose unengaged majority drags sender reputation down. The voucher option is tempting precisely because it wins on the metric the module says to optimise second, volume, rather than first, buyer adjacency."}, {"q": "Your monthly report leads with a 52% open rate, up from 41%. What is wrong with that headline number?", "options": ["Apple Mail Privacy Protection pre-fetches images and inflates opens, making them useless as an absolute measure and dangerous as an optimisation target", "Open rate is accurate but lags clicks by roughly 48 hours", "Open rate only counts HTML emails, so plain-text recipients are missing", "Open rate is fine as a headline provided you exclude bounced sends"], "answer": 0, "why": "MPP pre-fetches images for Apple Mail users, so opens are inflated and can only be used for trend and relative comparison, never as a headline number or an optimisation target. The module goes further in Common mistakes: optimising subject lines for opens means optimising a broken metric, and clickbait subject lines raise complaints."}, {"q": "Your spam complaint rate has climbed to 0.38% and hard bounces are running at 2.4%. What is the situation and what do you do?", "options": ["Both are within normal ranges; monitor for another month", "Complaints are fine but bounces mean you should send more often to re-warm the list", "Both thresholds are breached - complaints should stay under 0.3% and ideally under 0.1%, and over about 2% hard bounces signals a hygiene problem; clean the list and suppress the unengaged", "Add a double opt-in to future signups, which retroactively resolves both numbers"], "answer": 2, "why": "The module sets the complaint ceiling at 0.3%, ideally under 0.1%, and says crossing it collapses delivery; over roughly 2% hard bounces indicates a hygiene problem. Sending more often to a list in this state accelerates the collapse - the prescribed moves are removing hard bounces immediately and sunsetting subscribers with no opens or clicks in 6 or more months."}, {"q": "An ecommerce brand runs weekly campaigns to its whole list and has no automated flows. Where does the module say the money is, and what is the first flow to build?", "options": ["Campaigns and flows earn similarly; the first priority is a higher send frequency", "Flows beat campaigns on revenue per recipient; build the welcome flow first, as it typically earns the most per recipient of anything you send", "Flows beat campaigns; build the winback flow first, since lapsed customers are the largest segment", "Campaigns are where the money is for ecommerce; flows matter mainly for SaaS onboarding"], "answer": 1, "why": "Flows beat campaigns on revenue per recipient because they arrive at the moment of relevance, and the module says the welcome or indoctrination flow typically earns the most per recipient of anything you send. Winback matters but sits at the lapse point, and its defining feature is a hard exit after three unengaged emails, not first priority."}, {"q": "A subscriber has a basket worth 380 euros abandoned at 9pm. Which contact does the module support?", "options": ["An SMS at 9pm, since abandoned cart windows close fast and SMS has the highest open rate", "A push notification plus SMS plus email, to cover every channel while intent is live", "Nothing until they return to the site, since any outreach at that hour risks a complaint", "The cart flow's first email at roughly one hour, and SMS only if they gave separate explicit consent for it, given the high basket value"], "answer": 3, "why": "The cart sequence is three emails at roughly 1 hour, 24 hours and 72 hours, and SMS is reserved for time-critical, high-value moments such as an abandoned cart at high basket value - but it requires separate explicit opt-in, since an email signup gives no implied SMS consent. The 9pm SMS option ignores both the consent rule and the module's warning that one irrelevant 9pm text costs you the subscriber and possibly the customer."}, {"q": "Which authentication set does the module describe as effectively mandatory for bulk sending to Gmail and Yahoo, and what does each element do?", "options": ["SPF lists who may send for your domain, DKIM cryptographically proves the message was not altered, DMARC publishes what receivers should do when SPF or DKIM fail - plus one-click unsubscribe honoured within two days", "SPF encrypts the message body, DKIM lists authorised senders, DMARC handles unsubscribe requests", "DMARC alone is sufficient if you send from a dedicated subdomain", "SPF and DKIM are required; DMARC is advisory and only affects reporting"], "answer": 0, "why": "The module defines SPF as the DNS record of who may send, DKIM as the cryptographic signature proving the message was not altered, and DMARC as the published policy plus reporting - all effectively mandatory under Gmail and Yahoo bulk sender requirements, alongside one-click unsubscribe honoured within two days. Treating DMARC as advisory is the outdated position the module explicitly corrects: without all three aligned, bulk mail does not arrive reliably."}], "cards": [{"front": "Name the five flows that make most of the money.", "back": "Welcome/indoctrination, abandoned cart and browse, post-purchase/onboarding, winback, and replenishment or upgrade. Flows beat campaigns on revenue per recipient because they arrive at the moment of relevance."}, {"front": "What is the abandoned cart timing and content sequence?", "back": "Three emails at roughly 1 hour, 24 hours and 72 hours: remind, handle the objection (shipping, returns, sizing), then incentivise only if margin allows. Browse abandonment is a softer nudge, not a chase."}, {"front": "What does RFM stand for and how do you act on two of its segments?", "back": "Recency, Frequency, Monetary value. Champions get early access and referral asks; at-risk high-value customers get personal attention; one-time low-value buyers get a repeat-purchase nudge; never-engaged get a sunset sequence."}, {"front": "Which email metric should be your default for comparing a flow to a campaign to a segment?", "back": "Revenue per recipient. It is the number that lets you compare them fairly. Click rate and click-to-open are the first honest engagement signals; open rate is unreliable since Apple MPP."}, {"front": "What separates useful personalisation from creepy merge tags?", "back": "Useful personalisation changes the content - the size they bought, the plan they are on, the city when it affects delivery. A first name pasted into a subject line is neutral at best and unsettling when obviously automated."}, {"front": "Why is an unsubscribe better than a spam complaint?", "back": "Complaints damage sender reputation and delivery for everyone on the domain; cross 0.3% and delivery collapses. Unsubscribes just shrink a number you like reporting. Make unsubscribing easy."}], "elaborate": ["Write the lead magnet you would actually use for your chosen business and one sentence on why it is adjacent to the purchase. Then write the generic version someone would propose instead, and state concretely what the difference would do to revenue per recipient and to your sender reputation over a year.", "M09 argued that organic reach declines on every platform because followers are access the platform rents you. Map how someone in your chosen business travels from a platform where you have no control to your email list, naming the collection point, the source field you would capture, and the first flow they enter."], "transfer": {"scenario": "A skincare ecommerce brand has 62,000 subscribers, built largely from a 100 euro gift-card prize draw run last year. They send three campaigns a week to the entire list. Reported open rate is 47%, click rate is 0.3%, unsubscribes are running at 1.1% per send and spam complaints at 0.34%. They have no automated flows at all. SPF and DKIM are configured; there is no DMARC record. Revenue from email is flat year on year despite the list tripling in size.", "prompt": "Diagnose why a tripled list produced flat revenue and set out the first four actions in order.", "model": "The list tripled with people who wanted a gift card, not skincare - a generic magnet producing a big list with near-zero revenue per recipient, which is exactly what a 0.3% click rate shows. The 47% open rate is decoration inflated by Apple MPP; the honest numbers are the click rate and the health metrics, and both are alarming. A 0.34% complaint rate is above the 0.3% ceiling where delivery collapses, so the unengaged majority is now suppressing delivery to the people who do buy. In order: stop blasting the whole list three times a week and segment by engagement recency; publish a DMARC record, since without all three aligned bulk mail to Gmail and Yahoo does not arrive reliably; build the welcome and abandoned cart flows, where the revenue per recipient is; then sunset the six-month unengaged and replace the prize draw with a purchase-adjacent magnet."}}}, {"id": "M13", "num": 13, "part": "p2", "title": "Analytics and Measurement", "short": "Analytics & measurement", "meta": "120 minutes (50 read · 55 exercise · 15 recall)", "minutes": 120, "sections": [{"h": "Why this matters", "html": "<p>This is the module that separates people who keep their jobs from people who don't.<\/p>\n<p>Anyone can run a campaign. The person who survives the budget review is the one who can say what happened, what it cost, what it produced, and how confident they are — in language a CFO accepts. Marketers get fired for two things: not being able to explain their numbers, and confidently explaining numbers that turn out to be wrong. Both are measurement failures, not campaign failures.<\/p>", "text": "This is the module that separates people who keep their jobs from people who don't. Anyone can run a campaign. The person who survives the budget review is the one who can say what happened, what it cost, what it produced, and how confident they are — in language a CFO accepts. Marketers get fired for two things: not being able to explain their numbers, and confidently explaining numbers that turn out to be wrong. Both are measurement failures, not campaign failures."}, {"h": "Core concepts", "html": "<h3>One metric that matters, and the tree beneath it<\/h3>\n<p>Pick a single number that, if it moves, means the business is working. Then decompose it into the inputs you actually control. That decomposition is the <strong>metric tree<\/strong>, and it is the whole job.<\/p>\n<p>Ecommerce: Revenue = Sessions × Conversion rate × Average order value. Each branch splits again — sessions by channel, conversion rate by device and landing page.<\/p>\n<p>B2B: Pipeline = Leads × Qualification rate × Average deal size, with Leads = Traffic × Form conversion rate.<\/p>\n<p>The tree tells you where a change came from. Revenue down 20% is not actionable. Revenue down 20% because mobile conversion rate fell from 2.1% to 1.4% after a checkout release is a ticket someone can pick up.<\/p>\n<p><strong>Leading vs. lagging.<\/strong> Revenue is lagging — it tells you about decisions already made. Leading indicators move first: trial starts, demo requests, add-to-carts, email signups, branded search volume. Manage on leading indicators, report on lagging ones.<\/p>\n<p><strong>Vanity metrics<\/strong> are numbers that only go up and connect to nothing: impressions, followers, page views, \"reach.\" The test is simple — if the number doubled, would you do anything differently? If not, stop reporting it.<\/p>\n<h3>The GA4 event model<\/h3>\n<p>Universal Analytics counted sessions and pageviews. GA4 counts <strong>events<\/strong>, each carrying <strong>parameters<\/strong>, and some events are marked as <strong>key events<\/strong> (previously \"conversions\"). A pageview is an event. A click is an event. A purchase is an event with parameters for value, currency and items.<\/p>\n<p>Three things confuse newcomers:<\/p>\n<ul>\n<li><strong>There is no bounce rate as you knew it.<\/strong> GA4 has engagement rate — its inverse, defined by engaged sessions (10+ seconds, a key event, or 2+ pageviews).<\/li>\n<li><strong>Sessions are counted differently<\/strong> and GA4 numbers rarely match old UA numbers or your ad platforms. Stop trying to reconcile; use each tool for what it's good at.<\/li>\n<li><strong>Custom dimensions must be registered<\/strong> before parameters show up in reports, and data can take 24–48 hours to appear.<\/li>\n<\/ul>\n<p>Set up: define your key events explicitly (purchase, lead submit, qualified signup), assign values where you can, and build Explorations rather than fighting the standard reports. Link Google Ads and Search Console.<\/p>\n<h3>Tag management, conceptually<\/h3>\n<p><strong>Google Tag Manager<\/strong> is a container you install once. Inside it: <strong>tags<\/strong> (things that fire — GA4 events, ad pixels), <strong>triggers<\/strong> (when they fire — a click, a page view, a form submit), and <strong>variables<\/strong> (values they use — order total, page path). The point is that you can add and change tracking without a developer deploying code, and preview before publishing.<\/p>\n<p><strong>Server-side tagging<\/strong> moves the container to a server you control. Requests go to your domain, then on to Google, Meta and others. Benefits: fewer losses to ad blockers and browser restrictions, better control over what data leaves, faster pages. Costs: hosting, complexity, and a real ability to break things silently. Worth it above meaningful spend; premature below it.<\/p>\n<h3>UTM parameters — discipline beats tooling<\/h3>\n<p>UTMs are query parameters on inbound links that tell your analytics where a visit came from. Nothing you buy compensates for using them sloppily.<\/p>\n<pre><code>?utm_source=facebook&amp;utm_medium=paid_social&amp;utm_campaign=2026-q3-spring-sale&amp;utm_content=ugc-testimonial-v2&amp;utm_term=broad-women-25-45\n<\/code><\/pre>\n<ul>\n<li><strong>source<\/strong> — the platform: <code>google<\/code>, <code>facebook<\/code>, <code>newsletter<\/code>, <code>partner-name<\/code>.<\/li>\n<li><strong>medium<\/strong> — the channel type, from a fixed list: <code>cpc<\/code>, <code>paid_social<\/code>, <code>email<\/code>, <code>organic_social<\/code>, <code>affiliate<\/code>, <code>referral<\/code>, <code>display<\/code>.<\/li>\n<li><strong>campaign<\/strong> — a named initiative with a date convention: <code>2026-q3-spring-sale<\/code>.<\/li>\n<li><strong>content<\/strong> — the specific creative or link position.<\/li>\n<li><strong>term<\/strong> — keyword or audience.<\/li>\n<\/ul>\n<p>Rules that save you: <strong>lowercase everything<\/strong> (UTMs are case-sensitive, so <code>Facebook<\/code> and <code>facebook<\/code> become two rows); never UTM-tag internal links (it starts a new session and destroys attribution); keep a shared spreadsheet of allowed source/medium values; auto-tag Google Ads with GCLID rather than hand-writing UTMs. One person owning the convention is worth more than any attribution tool.<\/p>\n<h3>The attribution problem, honestly<\/h3>\n<p>Attribution assigns credit for a conversion to touchpoints. Every method is wrong in a knowable direction:<\/p>\n<ul>\n<li><strong>Last-click<\/strong> over-credits capture channels — branded search, retargeting, and anything that catches people already on their way in.<\/li>\n<li><strong>First-click<\/strong> over-credits discovery and ignores what closed the deal.<\/li>\n<li><strong>View-through<\/strong> over-credits display and video; an unseen impression counts as influence.<\/li>\n<li><strong>Walled gardens self-report.<\/strong> Meta, Google and TikTok each claim the same conversion. Sum their reported conversions and you will exceed your actual order count, often substantially.<\/li>\n<\/ul>\n<p><strong>GA4 now retains only three models:<\/strong> data-driven attribution plus two last-click variants. First-click, linear, time-decay and position-based were removed in November 2023 and are not coming back. Anyone offering you a \"position-based model in GA4\" is working from stale material.<\/p>\n<p><strong>Platform-reported conversions never sum to actual revenue.<\/strong> This is not a bug to fix, it is a property of the system. The correct response is to treat platform numbers as <em>tactical signal<\/em> — useful for deciding which creative to kill — and never as the source of truth for what the channel earned.<\/p>\n<p><strong>Self-reported attribution.<\/strong> Add \"How did you hear about us?\" as an open or lightly-optioned field at checkout or on the lead form. It is directionally useful, catches podcast, word-of-mouth and offline exposure that no pixel sees, and takes an afternoon to implement. It is biased toward the most recent memorable touch, so use it alongside the platforms rather than instead of them. It is the most underrated measurement tool available to a small business.<\/p>\n<h3>Data hygiene and noise<\/h3>\n<p>Filter internal traffic and known bots. Exclude your own IPs and staging domains. Add referral exclusions for payment gateways so a Stripe redirect doesn't reset the session source. Check that a key event fires exactly once per conversion — duplicate purchase events are the most common cause of impossible-looking ROAS.<\/p>\n<p>Then: <strong>do not react to noise.<\/strong> A 15% week-on-week swing on 40 conversions is nothing. Before you change anything, ask how many conversions the difference is based on and whether a coin flip could have produced it (M14). Weekly numbers are for spotting breakage; monthly numbers are for decisions.<\/p>\n<h3>Privacy and consent<\/h3>\n<p>You need a consent banner in the EU/UK, and <strong>Consent Mode v2<\/strong> to tell Google whether ad and analytics storage is permitted; without it, Google Ads audiences and conversion modelling degrade. Note what did <em>not<\/em> happen: Chrome kept third-party cookies (confirmed April 2025), and in October 2025 Google announced retirement of most Privacy Sandbox technologies — Topics, Protected Audience, Attribution Reporting — deprecated in Chrome 144 (January 2026) and targeted for removal in Chrome 150 (July 2026). GDPR and ePrivacy consent requirements are unchanged. So your data gaps come from consent rejections, Safari ITP, ad blockers and iOS ATT — not from a Chrome deprecation that never arrived. Plan for permanently incomplete data and measure accordingly.<\/p>", "text": "One metric that matters, and the tree beneath it Pick a single number that, if it moves, means the business is working. Then decompose it into the inputs you actually control. That decomposition is the metric tree , and it is the whole job. Ecommerce: Revenue = Sessions × Conversion rate × Average order value. Each branch splits again — sessions by channel, conversion rate by device and landing page. B2B: Pipeline = Leads × Qualification rate × Average deal size, with Leads = Traffic × Form conversion rate. The tree tells you where a change came from. Revenue down 20% is not actionable. Revenue down 20% because mobile conversion rate fell from 2.1% to 1.4% after a checkout release is a ticket someone can pick up. Leading vs. lagging. Revenue is lagging — it tells you about decisions already made. Leading indicators move first: trial starts, demo requests, add-to-carts, email signups, branded search volume. Manage on leading indicators, report on lagging ones. Vanity metrics are numbers that only go up and connect to nothing: impressions, followers, page views, \"reach.\" The test is simple — if the number doubled, would you do anything differently? If not, stop reporting it. The GA4 event model Universal Analytics counted sessions and pageviews. GA4 counts events , each carrying parameters , and some events are marked as key events (previously \"conversions\"). A pageview is an event. A click is an event. A purchase is an event with parameters for value, currency and items. Three things confuse newcomers: There is no bounce rate as you knew it. GA4 has engagement rate — its inverse, defined by engaged sessions (10+ seconds, a key event, or 2+ pageviews). Sessions are counted differently and GA4 numbers rarely match old UA numbers or your ad platforms. Stop trying to reconcile; use each tool for what it's good at. Custom dimensions must be registered before parameters show up in reports, and data can take 24–48 hours to appear. Set up: define your key events explicitly (purchase, lead submit, qualified signup), assign values where you can, and build Explorations rather than fighting the standard reports. Link Google Ads and Search Console. Tag management, conceptuall"}, {"h": "How it works in practice", "html": "<p><strong>Reporting cadence.<\/strong><\/p>\n<ul>\n<li><strong>Daily<\/strong> — only anomaly checks. Did tracking break? Is spend pacing?<\/li>\n<li><strong>Weekly<\/strong> — channel-level spend, leads or orders, cost per outcome. Look for breakage and trends, not verdicts.<\/li>\n<li><strong>Monthly<\/strong> — the decision meeting. What we spent, what it produced, what we learned, what changes.<\/li>\n<li><strong>Quarterly<\/strong> — allocation and incrementality (M15).<\/li>\n<\/ul>\n<p><strong>Writing a monthly report a non-marketer can act on.<\/strong> One page, in this order:<\/p>\n<ol>\n<li><strong>The headline number<\/strong> vs. target and vs. last month, in currency.<\/li>\n<li><strong>Three bullets: what happened and why.<\/strong> Written in cause-and-effect sentences, not metric dumps.<\/li>\n<li><strong>A channel table:<\/strong> spend, outcomes, cost per outcome, change vs. last month.<\/li>\n<li><strong>What we learned<\/strong> — one or two things now known that weren't before.<\/li>\n<li><strong>What we're changing next month,<\/strong> with the expected effect.<\/li>\n<li><strong>Confidence note<\/strong> — where the numbers are shaky and why (platform double-counting, small sample, tracking gap).<\/li>\n<\/ol>\n<p>If the reader cannot make a decision from page one, it is not a report, it is a data dump. Never present platform-reported ROAS without stating that the platforms collectively over-claim.<\/p>", "text": "Reporting cadence. Daily — only anomaly checks. Did tracking break? Is spend pacing? Weekly — channel-level spend, leads or orders, cost per outcome. Look for breakage and trends, not verdicts. Monthly — the decision meeting. What we spent, what it produced, what we learned, what changes. Quarterly — allocation and incrementality (M15). Writing a monthly report a non-marketer can act on. One page, in this order: The headline number vs. target and vs. last month, in currency. Three bullets: what happened and why. Written in cause-and-effect sentences, not metric dumps. A channel table: spend, outcomes, cost per outcome, change vs. last month. What we learned — one or two things now known that weren't before. What we're changing next month, with the expected effect. Confidence note — where the numbers are shaky and why (platform double-counting, small sample, tracking gap). If the reader cannot make a decision from page one, it is not a report, it is a data dump. Never present platform-reported ROAS without stating that the platforms collectively over-claim."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Triangulation is the standard.<\/strong> Three independent lenses: <strong>MMM<\/strong> for the portfolio view across all spend including offline, <strong>incrementality testing<\/strong> for causal ground truth, and <strong>platform attribution<\/strong> for tactical, in-flight signal. Senior decision-makers trust independent incrementality testing more than MMM or in-platform reporting — so the marketer who can run a clean holdout has more credibility than the one with the prettiest dashboard.<\/li>\n<li><strong>Branded search and retargeting are where non-incremental spend hides.<\/strong> If you only ever check one thing for incrementality, check those two.<\/li>\n<li><strong>Attribution got simpler and less flexible.<\/strong> Three GA4 models, more modelled data, more black boxes. Arguing about models is now a lower-value activity than running an experiment.<\/li>\n<li><strong>~60% of Google searches end without a click,<\/strong> so a growing share of your influence is invisible to any click-based measurement. Zero-click exposure, AI Overviews and AI assistants all create demand that arrives later as direct or branded traffic. Watch branded search volume as a proxy.<\/li>\n<\/ul>", "text": "Triangulation is the standard. Three independent lenses: MMM for the portfolio view across all spend including offline, incrementality testing for causal ground truth, and platform attribution for tactical, in-flight signal. Senior decision-makers trust independent incrementality testing more than MMM or in-platform reporting — so the marketer who can run a clean holdout has more credibility than the one with the prettiest dashboard. Branded search and retargeting are where non-incremental spend hides. If you only ever check one thing for incrementality, check those two. Attribution got simpler and less flexible. Three GA4 models, more modelled data, more black boxes. Arguing about models is now a lower-value activity than running an experiment. ~60% of Google searches end without a click, so a growing share of your influence is invisible to any click-based measurement. Zero-click exposure, AI Overviews and AI assistants all create demand that arrives later as direct or branded traffic. Watch branded search volume as a proxy."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Reporting metrics instead of decisions.<\/strong> Nobody wants your dashboard; they want to know what to do.<\/li>\n<li><strong>Summing platform-reported conversions.<\/strong> You will report more sales than the company made.<\/li>\n<li><strong>Reacting to weekly noise<\/strong> and restarting learning phases every Monday.<\/li>\n<li><strong>No UTM convention,<\/strong> so half your traffic sits in <code>(other)<\/code> and nothing can be reconstructed later.<\/li>\n<li><strong>Tracking everything and defining nothing.<\/strong> Two hundred events, no agreed key event.<\/li>\n<li><strong>Confusing correlation with cause.<\/strong> Spend went up, revenue went up — in Q4, when revenue always goes up.<\/li>\n<li><strong>Trusting last-click<\/strong> and defunding the demand-creation channels that fed it.<\/li>\n<li><strong>Never checking that tracking still works.<\/strong> A silently broken tag can cost a quarter.<\/li>\n<\/ul>", "text": "Reporting metrics instead of decisions. Nobody wants your dashboard; they want to know what to do. Summing platform-reported conversions. You will report more sales than the company made. Reacting to weekly noise and restarting learning phases every Monday. No UTM convention, so half your traffic sits in (other) and nothing can be reconstructed later. Tracking everything and defining nothing. Two hundred events, no agreed key event. Confusing correlation with cause. Spend went up, revenue went up — in Q4, when revenue always goes up. Trusting last-click and defunding the demand-creation channels that fed it. Never checking that tracking still works. A silently broken tag can cost a quarter."}, {"h": "Exercise (55 minutes)", "html": "<p>For <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li><strong>Metric tree.<\/strong> Define the one metric that matters, then decompose it two levels down. Mark each node leading or lagging, and circle the two nodes you can actually influence next month.<\/li>\n<li><strong>Key events.<\/strong> List the 3–6 events you would track in GA4, with parameters and assigned values. State which single one is the primary key event for optimisation, and why the others are not.<\/li>\n<li><strong>UTM convention.<\/strong> Write it as a one-page standard: allowed <code>medium<\/code> values (a closed list), the <code>campaign<\/code> naming pattern with a date convention, casing rules, and who owns the spreadsheet. Then write three correctly-formed example URLs — one paid social, one email, one partner link.<\/li>\n<li><strong>Monthly report template.<\/strong> Build the one-page format above and fill it with real numbers if you have them, plausible estimates if you don't. Include the confidence note — it is the part that makes people trust you.<\/li>\n<li><strong>Self-reported attribution.<\/strong> Write the exact question and answer options you would add at checkout or on the lead form. Keep it to one question.<\/li>\n<li><strong>The honest paragraph.<\/strong> Write, in five sentences a non-marketer would understand, what you can and cannot prove about your marketing, and what you would need to do to prove more.<\/li>\n<\/ol>", "text": "For your chosen business : Metric tree. Define the one metric that matters, then decompose it two levels down. Mark each node leading or lagging, and circle the two nodes you can actually influence next month. Key events. List the 3–6 events you would track in GA4, with parameters and assigned values. State which single one is the primary key event for optimisation, and why the others are not. UTM convention. Write it as a one-page standard: allowed medium values (a closed list), the campaign naming pattern with a date convention, casing rules, and who owns the spreadsheet. Then write three correctly-formed example URLs — one paid social, one email, one partner link. Monthly report template. Build the one-page format above and fill it with real numbers if you have them, plausible estimates if you don't. Include the confidence note — it is the part that makes people trust you. Self-reported attribution. Write the exact question and answer options you would add at checkout or on the lead form. Keep it to one question. The honest paragraph. Write, in five sentences a non-marketer would understand, what you can and cannot prove about your marketing, and what you would need to do to prove more."}, {"h": "Recall (15 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>The metric tree for your business, two levels deep.<\/li>\n<li>Three ways GA4's model differs from Universal Analytics.<\/li>\n<li>The five UTM parameters and two rules that prevent broken data.<\/li>\n<li>What last-click over-credits, what view-through over-credits, and how many attribution models GA4 retains.<\/li>\n<li>Why platform conversions never sum to actual revenue.<\/li>\n<li>The three legs of measurement triangulation, and which one senior decision-makers trust most.<\/li>\n<\/ol>", "text": "Close everything. Write from memory: The metric tree for your business, two levels deep. Three ways GA4's model differs from Universal Analytics. The five UTM parameters and two rules that prevent broken data. What last-click over-credits, what view-through over-credits, and how many attribution models GA4 retains. Why platform conversions never sum to actual revenue. The three legs of measurement triangulation, and which one senior decision-makers trust most."}, {"h": "If you remember one thing", "html": "<p><strong>No single measurement method is true; the skill is knowing the direction each one lies in.<\/strong> Report decisions rather than metrics, state your confidence out loud, and treat platform numbers as signal rather than truth.<\/p>\n<p>Part 2 gave you the channels. Part 3 gives you the judgment to allocate across them — starting with how to run a test that will not lie to you, then M15, where incrementality testing and media mix modelling turn the honest uncertainty above into a defensible budget.<\/p>", "text": "No single measurement method is true; the skill is knowing the direction each one lies in. Report decisions rather than metrics, state your confidence out loud, and treat platform numbers as signal rather than truth. Part 2 gave you the channels. Part 3 gives you the judgment to allocate across them — starting with how to run a test that will not lie to you, then M15, where incrementality testing and media mix modelling turn the honest uncertainty above into a defensible budget."}], "suggest": [["What does stating your confidence sound like to a CFO?", "Show me one sentence answering what the spend produced", "Why is a confidently wrong number worse than no number?"], ["How do I choose the one metric that matters for my business?", "Build me a metric tree for a small ecommerce shop", "What if my tree branches into things I cannot influence?"], ["Why are weekly numbers for trends rather than verdicts?", "What goes in the three cause-and-effect bullets?", "How do I stop daily anomaly checks becoming daily panic?"], ["What is media mix modelling, in plain terms, at my size?", "How would a clean holdout test look for my business?", "Why does non-incremental spend hide in branded search?"], ["Why can I not add up conversions reported by each platform?", "What does traffic dumped into (other) cost me later?", "How do I stop last-click defunding my demand-creation channels?"], ["How do I tell a leading node from a lagging one in my tree?", "Which three to six GA4 events fit a small service business?", "Why must allowed utm_medium values be a closed list?"], ["What are the five UTM parameters and the two protective rules?", "How does GA4's event model differ from Universal Analytics?", "What does view-through over-credit, and at whose expense?"], ["Which direction does each lens lie in: platform, MMM, holdout?", "Rewrite one of my metrics as a decision a manager can act on", "How do I admit uncertainty without losing budget over it?"]], "assess": {"predict": "If Meta, Google and TikTok each report the conversions they think they caused, what would happen if you added those numbers together?", "quiz": [{"q": "Revenue is down 20% month on month. Which statement is actionable in the module's sense, and why?", "options": ["Revenue is down 20% and paid social ROAS declined", "Revenue is down 20% because mobile conversion rate fell from 2.1% to 1.4% after a checkout release", "Revenue is down 20% while impressions and reach both grew", "Revenue is down 20% and last-click attribution shows organic weakening"], "answer": 1, "why": "The metric tree exists so you can say where a change came from; the checkout-release sentence names the branch, the magnitude and a plausible cause, so someone can pick it up as a ticket. The impressions and reach option is the trap - those are vanity metrics that only go up and connect to nothing, failing the test of whether you would do anything differently if they doubled."}, {"q": "A vendor proposes configuring a position-based attribution model in your GA4 property so demand-creation channels get fair credit. What is the correct response?", "options": ["Approve it, but pair it with a data-driven model for comparison", "Approve it only if server-side tagging is already in place", "GA4 retains only three models - data-driven attribution plus two last-click variants - so position-based does not exist there; the vendor is working from stale material", "Position-based is available but only in GA4 360, so check your licence tier"], "answer": 2, "why": "GA4 retains data-driven attribution plus two last-click variants; first-click, linear, time-decay and position-based were removed in November 2023 and are not coming back. The licence-tier answer is plausible-sounding but invented - the removal was not a paywall, and the module says anyone offering a position-based model in GA4 is working from stale material."}, {"q": "Your paid social row in GA4 splits across \"Facebook / paid_social\" and \"facebook / Paid_Social,\" and a third of traffic sits in (other). What went wrong?", "options": ["GA4's channel groupings changed and need remapping in the admin settings", "UTMs are case-sensitive, so inconsistent casing created duplicate rows, and there is no shared convention for allowed source and medium values", "The GTM container is firing the GA4 tag twice per pageview", "Referral exclusions are missing for the payment gateway"], "answer": 1, "why": "The module says to lowercase everything because UTMs are case-sensitive - Facebook and facebook become two rows - and names having no UTM convention as the reason half your traffic sits in (other) and nothing can be reconstructed later. Duplicate tag firing is a real problem but it inflates event counts rather than splitting source and medium rows."}, {"q": "A weekly report shows conversions down 15% versus last week, on a base of 40 conversions. The team wants to pause the worst-performing ad set immediately. What does the module say?", "options": ["Pause it - a 15% decline sustained for a week is a reliable signal", "Pause it and restart it Monday to re-enter the learning phase cleanly", "Do not react - ask how many conversions the difference is based on and whether a coin flip could have produced it; weekly numbers are for spotting breakage, monthly numbers are for decisions", "Do not react, but increase the budget instead, since low volume is the underlying cause"], "answer": 2, "why": "The module states that a 15% week-on-week swing on 40 conversions is nothing and warns against reacting to noise and restarting learning phases every Monday - weekly numbers spot breakage, monthly numbers drive decisions. Increasing budget is equally a reaction to noise, just in the opposite direction."}, {"q": "Your ROAS report shows impossible numbers - one campaign at 41x with a modest spend. Before blaming attribution, what does the module say to check?", "options": ["Whether the key event fires exactly once per conversion, since duplicate purchase events are the most common cause of impossible-looking ROAS", "Whether Consent Mode v2 is misconfigured and inflating modelled conversions", "Whether the campaign is benefiting from view-through credit on display placements", "Whether third-party cookie deprecation has broken the conversion path"], "answer": 0, "why": "Under data hygiene the module names dupl
