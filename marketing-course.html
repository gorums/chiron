 if it misses<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Pick the metric that matches the job:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>If the piece is for...<\/th>\n<th>Measure<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Search demand capture<\/td>\n<td>Impressions and clicks in Search Console for the target cluster, then assisted conversions<\/td>\n<\/tr>\n<tr>\n<td>AI answer presence<\/td>\n<td>Whether you are named/cited in answers to the target question, checked manually monthly across two or three assistants<\/td>\n<\/tr>\n<tr>\n<td>Sales enablement<\/td>\n<td>Times sent by sales, and deal progression after sending<\/td>\n<\/tr>\n<tr>\n<td>Demand creation<\/td>\n<td>Branded search volume and direct traffic, over quarters, not weeks<\/td>\n<\/tr>\n<tr>\n<td>Link acquisition<\/td>\n<td>Referring domains gained in 90 days<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Note that only the first of those is measurable in the first month, which is why most content programmes are judged on the wrong thing and killed too early.<\/p>\n<hr />\n<h2>What good looks like<\/h2>\n<p>The \"what only we can say\" section contains an asset that took real effort to obtain — original data, a built tool, or genuine first-hand experience. The structured answer block is accurate, dated, and would stand alone if a model lifted it verbatim. The distribution plan names five real people. The success metric matches the actual purpose of the piece, and the check date is realistic rather than optimistic.<\/p>\n<h2>Common failure<\/h2>\n<p>Writing the eleventh version of a page that already exists, at slightly better quality, and calling it a content strategy. Production is no longer the bottleneck; distinctiveness and distribution are. The second failure is judging a demand-creation piece by first-month traffic and killing it in week six, which is how organisations end up with an archive full of things that would have compounded had anyone waited.<\/p>"}, {"slug": "icp-and-jtbd", "title": "ICP and Jobs-To-Be-Done", "blurb": "Use with: M02 — Customers: segments, ICP, jobs-to-be-done", "html": "<h1>ICP and Jobs-To-Be-Done<\/h1>\n<p><strong>Use with:<\/strong> M02 — Customers: segments, ICP, jobs-to-be-done\n<strong>Time to fill:<\/strong> 45 minutes for the definition, plus 5 interviews of ~30 minutes each\n<strong>Refill:<\/strong> after every 5 new interviews, or when close rates shift<\/p>\n<p>An ICP is not a demographic sketch of a person. It is a description of the <em>situation<\/em> in which someone buys. \"Marketing Mary, 34, drinks oat milk lattes\" is a persona, and personas mostly produce bad copy. Situations produce good copy.<\/p>\n<hr />\n<h2>Part 1 — ICP definition<\/h2>\n<p>Fill this in for <strong>one<\/strong> segment. If you want two segments, copy the file twice. A single ICP that describes three segments is not an ICP.<\/p>\n<h3>Firmographics (B2B) or demographics (B2C)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Instruction<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Industry / category<\/td>\n<td>Be narrow enough to name 20 real examples<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Size<\/td>\n<td>Revenue, headcount, or household income band<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Geography<\/td>\n<td>Where they are, and why that matters<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Role / who signs<\/td>\n<td>The person with budget, not the person who feels the pain<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who else is in the room<\/td>\n<td>Influencers, blockers, the person who will say \"we already pay for something like that\"<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tech / tools they already use<\/td>\n<td>Adjacent tools tell you what they believe<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Industry<\/td>\n<td>Independent plumbing, electrical and HVAC firms<\/td>\n<\/tr>\n<tr>\n<td>Size<\/td>\n<td>100k-500k EUR revenue, 2-8 employees<\/td>\n<\/tr>\n<tr>\n<td>Geography<\/td>\n<td>Spain, urban and peri-urban; matters because the quarterly IVA cycle drives the trigger<\/td>\n<\/tr>\n<tr>\n<td>Role / who signs<\/td>\n<td>The owner-operator. Always. There is no procurement.<\/td>\n<\/tr>\n<tr>\n<td>Who else is in the room<\/td>\n<td>The owner's spouse, who usually does the current bookkeeping and may feel replaced<\/td>\n<\/tr>\n<tr>\n<td>Tools they use<\/td>\n<td>WhatsApp for everything, Excel, sometimes Holded or a paper ledger<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Situation<\/h3>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Instruction<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What is true about their world right now<\/td>\n<td>The stable background conditions<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What they are currently doing about the problem<\/td>\n<td>Name the actual workflow<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What that costs them<\/td>\n<td>Time, money, risk, or emotion — with a number if possible<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Why they have tolerated it so far<\/td>\n<td>This is the most important field on this sheet<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Trigger<\/h3>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Instruction<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The event that starts the search<\/td>\n<td>A date, a failure, a hire, a fine, a new rule, a person leaving<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>How much time passes between trigger and purchase<\/td>\n<td>Days? Months?<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What they search or ask when triggered<\/td>\n<td>Their words, not yours<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>How predictable / seasonal the trigger is<\/td>\n<td>Determines whether you can be present in advance<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong> Trigger is receiving a notice from the Agencia Tributaria, or a quarterly filing they miss. Trigger to purchase: 5-20 days. They search \"asesoria fiscal autonomos [city]\" or ask in a WhatsApp trade group. Highly seasonal: January, April, July, October.<\/p>\n<h3>Current solution<\/h3>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Instruction<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What they use today<\/td>\n<td>Including \"nothing\" and \"a spreadsheet\"<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What they like about it<\/td>\n<td>You must be able to name this honestly<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What breaks<\/td>\n<td>The specific moment it fails<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Switching cost<\/td>\n<td>Contract, data migration, habit, embarrassment<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Budget<\/h3>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Instruction<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What they already spend on this problem<\/td>\n<td>Existing budget line is easier than new budget<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Whose budget it comes out of<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Price they would call \"expensive\"<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Price they would call \"suspiciously cheap\"<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Disqualifiers<\/h3>\n<p>List the signals that mean <strong>do not sell to this person<\/strong>. Being able to say no is what makes an ICP useful.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Disqualifier<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Disqualifier<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Under 60k EUR revenue<\/td>\n<td>Cannot afford it; churn within 3 months; support cost identical<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Currently in a dispute with the tax authority<\/td>\n<td>We become the scapegoat for a pre-existing problem<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Spouse does the books and is not in the conversation<\/td>\n<td>Deal dies silently at signature<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Wants \"just the filing, cheapest possible\"<\/td>\n<td>Price-only buyers churn at the first competitor email<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Multi-entity structure<\/td>\n<td>Out of scope for delivery; we do it badly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Part 2 — Jobs-to-be-done statement<\/h2>\n<p>The format:<\/p>\n<blockquote>\n<p><strong>When<\/strong> [situation], <strong>I want to<\/strong> [motivation / what they are trying to do], <strong>so I can<\/strong> [expected outcome].<\/p>\n<\/blockquote>\n<p>Rules that make this work:<\/p>\n<ul>\n<li>The \"when\" is a situation with a time and a place, not a demographic.<\/li>\n<li>The \"I want to\" is in the customer's language and does not mention your product.<\/li>\n<li>The \"so I can\" is the outcome they would describe to a friend, which is usually emotional or social, not functional.<\/li>\n<\/ul>\n<p><strong>Write three.<\/strong> One functional, one emotional, one social. The one that makes you slightly uncomfortable is usually the true one.<\/p>\n<pre><code>1. When ______________________________________,\n   I want to ____________________________________,\n   so I can _____________________________________.\n\n2. When ______________________________________,\n   I want to ____________________________________,\n   so I can _____________________________________.\n\n3. When ______________________________________,\n   I want to ____________________________________,\n   so I can _____________________________________.\n<\/code><\/pre>\n<p><strong>Filled examples:<\/strong><\/p>\n<pre><code>Functional:\nWhen the quarterly filing deadline is two weeks out and my invoices are in\nthree different places,\nI want to hand the whole mess to someone who will not judge me,\nso I can stop losing a Sunday every quarter.\n\nEmotional:\nWhen my accountant sends me a document I don't understand and I have to\npretend I do,\nI want to be spoken to like a competent adult who just isn't an accountant,\nso I can stop feeling stupid about my own business.\n\nSocial:\nWhen another owner in the trade group mentions their books are handled,\nI want to be the kind of business that has this sorted,\nso I can look like I'm running a real company, not a van with a phone.\n<\/code><\/pre>\n<p>The emotional and social statements are where the ad copy comes from. The functional one is where the landing page headline comes from.<\/p>\n<hr />\n<h2>Part 3 — The four forces<\/h2>\n<p>Every switch is a tug of war between four forces. Two push toward the new thing, two hold the customer in place. You need all four written down before you write any copy.<\/p>\n<table>\n<thead>\n<tr>\n<th>Force<\/th>\n<th>What it is<\/th>\n<th>Your answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Push<\/strong> (of the current situation)<\/td>\n<td>What is making the present intolerable<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Pull<\/strong> (of the new solution)<\/td>\n<td>What is attractive about the new way<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Anxiety<\/strong> (about the new solution)<\/td>\n<td>What could go wrong if they switch<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Habit<\/strong> (of the present)<\/td>\n<td>What is comfortable about staying, including sunk cost and identity<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Force<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Push<\/td>\n<td>Lost a Sunday to reconciliation three quarters in a row; got a 200 EUR late-filing penalty in April<\/td>\n<\/tr>\n<tr>\n<td>Pull<\/td>\n<td>\"Never think about this again\"; a monthly one-page summary they actually understand<\/td>\n<\/tr>\n<tr>\n<td>Anxiety<\/td>\n<td>\"Will they need me to organise the receipts anyway?\"; \"What if they miss something and I'm liable?\"; \"Am I locked in?\"<\/td>\n<\/tr>\n<tr>\n<td>Habit<\/td>\n<td>The spreadsheet is <em>theirs<\/em>; they know where everything is; handing it over means admitting they were doing it badly; their spouse currently does it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The rule:<\/strong> Most marketing only addresses Pull. Pull is the least effective of the four. Push and Anxiety usually decide the sale. Your best copy names the push in the customer's words and dissolves the top anxiety before it is asked.<\/p>\n<p><strong>Now write:<\/strong><\/p>\n<ul>\n<li>Our headline should amplify this push: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<li>Our page must defuse this anxiety in the first screen: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<li>The habit we are competing with is: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<\/ul>\n<hr />\n<h2>Part 4 — Customer interview script<\/h2>\n<p>Ten questions. Every one is about <strong>past behaviour<\/strong>, not hypotheticals. People are unreliable narrators of their future and reliable narrators of their last Tuesday.<\/p>\n<p>Rules before you start:<\/p>\n<ul>\n<li>Never pitch. If you pitch, the interview is over and you got nothing.<\/li>\n<li>Never ask \"would you buy\" or \"how much would you pay.\" Both answers are worthless.<\/li>\n<li>Ask about the last time, not about times in general.<\/li>\n<li>After every answer, say \"tell me more about that\" at least once. The second answer is the true one.<\/li>\n<li>Shut up. Aim to talk less than 20% of the time.<\/li>\n<li>Record if they consent; otherwise take notes in their words, verbatim, not paraphrased.<\/li>\n<\/ul>\n<h3>The script<\/h3>\n<ol>\n<li>\n<p><strong>Walk me through the last time you dealt with [the problem]. Start from the morning it happened.<\/strong>\n   (Timeline, not summary. Keep them in the specific instance.)<\/p>\n<\/li>\n<li>\n<p><strong>What was going on in the business that week that made it come up then, and not a month earlier?<\/strong>\n   (This is the trigger question. It is the highest-value question on the sheet.)<\/p>\n<\/li>\n<li>\n<p><strong>What did you do first?<\/strong>\n   (Reveals where they actually look: WhatsApp group, Google, a friend, nothing.)<\/p>\n<\/li>\n<li>\n<p><strong>Who else did you talk to about it?<\/strong>\n   (Buying committee, even in B2C. The spouse is a buying committee.)<\/p>\n<\/li>\n<li>\n<p><strong>What else did you look at or consider? Including doing nothing.<\/strong>\n   (Real competitive set. Almost never the set you assumed.)<\/p>\n<\/li>\n<li>\n<p><strong>What made you rule those out?<\/strong>\n   (Disqualifying criteria in their language. Becomes your comparison copy.)<\/p>\n<\/li>\n<li>\n<p><strong>What almost stopped you from going ahead?<\/strong>\n   (Anxiety, unfiltered. Write this down word for word.)<\/p>\n<\/li>\n<li>\n<p><strong>What did you expect to happen after you bought, and what actually happened?<\/strong>\n   (Gap between promise and delivery. Where churn and referrals are made.)<\/p>\n<\/li>\n<li>\n<p><strong>Show me how you do it now — can you walk me through the actual steps or share your screen?<\/strong>\n   (Observed behaviour beats reported behaviour every time.)<\/p>\n<\/li>\n<li>\n<p><strong>Who else do you know with this same problem, and what would you tell them?<\/strong>\n    (Referral mechanics, plus the natural-language description of your product that you should probably be using in your ads.)<\/p>\n<\/li>\n<\/ol>\n<p><strong>Closing:<\/strong> \"Is there anything I should have asked and didn't?\" Then ask for one introduction.<\/p>\n<hr />\n<h2>Part 5 — Interview log<\/h2>\n<p>Do five. Five is not statistically significant and that is fine; you are looking for patterns and language, not proof.<\/p>\n<h3>Interview 1<\/h3>\n<ul>\n<li>Date:<\/li>\n<li>Name / role / company:<\/li>\n<li>Segment fits ICP? (yes / partly / no):<\/li>\n<li><strong>Trigger event (their words):<\/strong><\/li>\n<li><strong>Alternatives they considered:<\/strong><\/li>\n<li><strong>What almost stopped them:<\/strong><\/li>\n<li><strong>Verbatim quote worth using in copy:<\/strong><\/li>\n<li><strong>Surprise (something that contradicted my assumption):<\/strong><\/li>\n<\/ul>\n<h3>Interview 2<\/h3>\n<ul>\n<li>Date:<\/li>\n<li>Name / role / company:<\/li>\n<li>Segment fits ICP?:<\/li>\n<li><strong>Trigger event:<\/strong><\/li>\n<li><strong>Alternatives considered:<\/strong><\/li>\n<li><strong>What almost stopped them:<\/strong><\/li>\n<li><strong>Verbatim quote:<\/strong><\/li>\n<li><strong>Surprise:<\/strong><\/li>\n<\/ul>\n<h3>Interview 3<\/h3>\n<ul>\n<li>Date:<\/li>\n<li>Name / role / company:<\/li>\n<li>Segment fits ICP?:<\/li>\n<li><strong>Trigger event:<\/strong><\/li>\n<li><strong>Alternatives considered:<\/strong><\/li>\n<li><strong>What almost stopped them:<\/strong><\/li>\n<li><strong>Verbatim quote:<\/strong><\/li>\n<li><strong>Surprise:<\/strong><\/li>\n<\/ul>\n<h3>Interview 4<\/h3>\n<ul>\n<li>Date:<\/li>\n<li>Name / role / company:<\/li>\n<li>Segment fits ICP?:<\/li>\n<li><strong>Trigger event:<\/strong><\/li>\n<li><strong>Alternatives considered:<\/strong><\/li>\n<li><strong>What almost stopped them:<\/strong><\/li>\n<li><strong>Verbatim quote:<\/strong><\/li>\n<li><strong>Surprise:<\/strong><\/li>\n<\/ul>\n<h3>Interview 5<\/h3>\n<ul>\n<li>Date:<\/li>\n<li>Name / role / company:<\/li>\n<li>Segment fits ICP?:<\/li>\n<li><strong>Trigger event:<\/strong><\/li>\n<li><strong>Alternatives considered:<\/strong><\/li>\n<li><strong>What almost stopped them:<\/strong><\/li>\n<li><strong>Verbatim quote:<\/strong><\/li>\n<li><strong>Surprise:<\/strong><\/li>\n<\/ul>\n<h3>Synthesis after five<\/h3>\n<ul>\n<li>Trigger that appeared in 3+ interviews:<\/li>\n<li>Alternative that appeared in 3+ interviews:<\/li>\n<li>Anxiety that appeared in 3+ interviews:<\/li>\n<li>Words they used that we do not use:<\/li>\n<li>Words we use that they never used:<\/li>\n<li>What I now believe that I did not believe before:<\/li>\n<li>Change I will make to the ICP above as a result:<\/li>\n<\/ul>\n<p>That last line is the point of the whole exercise. If nothing changed, you either interviewed badly or you were pitching.<\/p>\n<hr />\n<h2>What good looks like<\/h2>\n<p>The disqualifier list is real and it costs you money to honour. The JTBD statements contain no product words. The four forces sheet has more written under Anxiety and Habit than under Pull. The interview log contains at least three verbatim quotes you would put on a landing page unedited, and at least one entry in the \"Surprise\" field that made you change the ICP.<\/p>\n<h2>Common failure<\/h2>\n<p>Filling this in from imagination and calling it research. The second failure mode is interviewing people who are not in the ICP because they were easy to reach — friends, other marketers, people in your network — and then building a business for them. Log the \"fits ICP?\" field honestly; two useful interviews beat five polite ones.<\/p>"}, {"slug": "landing-page-audit", "title": "Landing Page Audit — 25 Points", "blurb": "Use with: M07 — The digital ecosystem, websites and CRO", "html": "<h1>Landing Page Audit — 25 Points<\/h1>\n<p><strong>Use with:<\/strong> M07 — The digital ecosystem, websites and CRO\n<strong>Time to run:<\/strong> 40 minutes per page\n<strong>Refill:<\/strong> before any campaign that sends paid traffic to a page, and quarterly on your top three pages<\/p>\n<p>Audit one page against one traffic source. The same page can be excellent for branded search and terrible for cold paid social, because message match is relative to where the visitor came from.<\/p>\n<p>Before you start, write down:<\/p>\n<ul>\n<li><strong>Page URL:<\/strong><\/li>\n<li><strong>Traffic source being audited:<\/strong><\/li>\n<li><strong>What the visitor just clicked (ad headline / query / link text):<\/strong><\/li>\n<li><strong>The one action we want:<\/strong><\/li>\n<li><strong>Current conversion rate for this source:<\/strong> <strong><em>_<\/em>_ % over <\/strong>____ sessions<\/li>\n<li><strong>Auditor and date:<\/strong><\/li>\n<\/ul>\n<hr />\n<h2>Scoring method<\/h2>\n<p>Score each of the 25 points from 0 to 4:<\/p>\n<table>\n<thead>\n<tr>\n<th>Score<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>Absent or actively harmful<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>Present but poor<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Adequate — a competent competitor does the same<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Good — clearly better than the category norm<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Excellent — a genuine advantage<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Maximum 100. Interpret as:<\/p>\n<table>\n<thead>\n<tr>\n<th>Total<\/th>\n<th>Read<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0-40<\/td>\n<td>The page is the constraint. Do not spend more on traffic until it is rebuilt.<\/td>\n<\/tr>\n<tr>\n<td>41-60<\/td>\n<td>Fixable. Expect 30-80% conversion lift from the top five fixes.<\/td>\n<\/tr>\n<tr>\n<td>61-80<\/td>\n<td>Solid. Gains now come from testing, not from obvious repair.<\/td>\n<\/tr>\n<tr>\n<td>81-100<\/td>\n<td>Rare. Your leverage is elsewhere in the funnel — check <code>unit-economics-model.md<\/code> Part 6.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Also record a <strong>section score<\/strong> (out of 20) per group. A page at 70/100 with Friction at 6/20 is not a \"good page with a weak area\"; it is a page with one broken thing that is costing you most of the conversions.<\/p>\n<p><strong>Important:<\/strong> the score is a diagnostic, not a target. Never optimise the score. Optimise the prioritised fixes it surfaces.<\/p>\n<hr />\n<h2>Group A — Clarity (20 points)<\/h2>\n<p>Can a stranger, in five seconds, say what this is and who it is for?<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Point<\/th>\n<th>What a 4 looks like<\/th>\n<th>Score<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A1<\/td>\n<td>The headline states what the thing is, not a mood<\/td>\n<td>Names the product category and the outcome in plain words. No metaphor, no \"Reimagine your workflow.\"<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A2<\/td>\n<td>The subhead says who it is for and what changes<\/td>\n<td>One sentence, names the segment or situation<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A3<\/td>\n<td>The primary action is obvious and singular<\/td>\n<td>One dominant button, repeated, same words each time<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A4<\/td>\n<td>The page passes the five-second test with real people<\/td>\n<td>3 of 5 strangers can say what it does and who it's for<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A5<\/td>\n<td>No unexplained jargon or internal product names above the fold<\/td>\n<td>A first-time visitor needs no glossary<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Section A score: ______ / 20<\/strong><\/p>\n<p><strong>The five-second test:<\/strong> show the page to five people who do not know the business, for five seconds, then ask \"what do they sell and who is it for.\" Do this before you argue about button colours. It is the highest information-per-minute activity in all of CRO.<\/p>\n<hr />\n<h2>Group B — Relevance and message match (20 points)<\/h2>\n<p>Does the page continue the sentence the ad or the query started?<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Point<\/th>\n<th>What a 4 looks like<\/th>\n<th>Score<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>B1<\/td>\n<td>Headline echoes the ad copy or the query<\/td>\n<td>Literal word overlap with what they clicked<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>B2<\/td>\n<td>Visual continuity with the ad<\/td>\n<td>Same image, colour, or person as the creative<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>B3<\/td>\n<td>The offer on the page is the offer in the ad<\/td>\n<td>No bait and switch, no surprise \"book a demo\"<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>B4<\/td>\n<td>Page addresses the specific stage of intent<\/td>\n<td>Cold traffic gets context; high-intent search gets the price and the button<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>B5<\/td>\n<td>One page per offer / audience where volume justifies it<\/td>\n<td>Not one generic page absorbing six different campaigns<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Section B score: ______ / 20<\/strong><\/p>\n<p>Message match is the cheapest conversion win that exists. Making the H1 match the ad headline routinely moves paid conversion rates by double-digit percentages and takes ten minutes.<\/p>\n<hr />\n<h2>Group C — Proof (20 points)<\/h2>\n<p>Trust is usually the real conversion bottleneck, especially for anything bought online without a conversation.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Point<\/th>\n<th>What a 4 looks like<\/th>\n<th>Score<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>C1<\/td>\n<td>Specific, attributed social proof<\/td>\n<td>Named customer, photo, role, and a number in the quote<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>C2<\/td>\n<td>Proof is near the decision points<\/td>\n<td>Testimonial beside the form and the pricing, not in a carousel at the bottom<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>C3<\/td>\n<td>Third-party credibility<\/td>\n<td>Review scores, certifications, press, membership bodies, real client logos<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>C4<\/td>\n<td>Objections are named and answered on the page<\/td>\n<td>The top three anxieties from <code>icp-and-jtbd.md<\/code> addressed explicitly<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>C5<\/td>\n<td>Demonstration, not description<\/td>\n<td>Screenshot, sample output, short video of the actual thing<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Section C score: ______ / 20<\/strong><\/p>\n<p>Ranked power of proof: the customer's own numbers &gt; third-party data &gt; named quote with photo &gt; demonstration &gt; your own claim with a statistic &gt; unattributed praise. Unattributed praise (\"Amazing service!\" — J.) scores 1 at best; visitors discount it entirely.<\/p>\n<hr />\n<h2>Group D — Friction (20 points)<\/h2>\n<p>Every field, click, and moment of doubt costs conversions.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Point<\/th>\n<th>What a 4 looks like<\/th>\n<th>Score<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>D1<\/td>\n<td>Form asks only for what is needed to take the next step<\/td>\n<td>Every field justified out loud; phone number optional or absent<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>D2<\/td>\n<td>Number of steps to complete the action<\/td>\n<td>Counted and minimised; no account creation before value<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>D3<\/td>\n<td>Price or cost is discoverable<\/td>\n<td>A number, a range, or an honest explanation of why there isn't one<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>D4<\/td>\n<td>Risk reversal is present and visible at the point of commitment<\/td>\n<td>Guarantee, no card required, cancel anytime, data-deletion promise<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>D5<\/td>\n<td>No unnecessary interruptions<\/td>\n<td>No exit popup on paid landing pages, no cookie wall covering the CTA, no chat widget obscuring the button on mobile<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Section D score: ______ / 20<\/strong><\/p>\n<p>Count your form fields right now and write the number here: ______. For a lead form, each field beyond the third typically costs conversions; the honest trade is fewer fields and more junk leads versus more fields and fewer, better leads. Decide deliberately with reference to your lead-to-customer rate, do not drift into it.<\/p>\n<hr />\n<h2>Group E — Speed and technical (20 points)<\/h2>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Point<\/th>\n<th>What a 4 looks like<\/th>\n<th>Score<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>E1<\/td>\n<td>Largest Contentful Paint on mobile<\/td>\n<td>Under 2.5s on a real 4G test, measured in field data (CrUX), not lab<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>E2<\/td>\n<td>Interaction to Next Paint / layout stability<\/td>\n<td>INP under 200ms, CLS under 0.1; nothing jumps as it loads<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>E3<\/td>\n<td>Mobile rendering and tap targets<\/td>\n<td>CTA reachable with a thumb, no horizontal scroll, form usable one-handed<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>E4<\/td>\n<td>Conversion tracking verified end to end<\/td>\n<td>A test submission produced a visible event in GA4 and in the ad platform, today<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>E5<\/td>\n<td>Correct indexing and URL hygiene<\/td>\n<td>Canonical set, UTMs do not create duplicate pages, paid-only pages noindexed if appropriate, no broken links<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Section E score: ______ / 20<\/strong><\/p>\n<p>Tools: PageSpeed Insights for field data, Microsoft Clarity for session recordings and rage clicks, Chrome DevTools with mobile throttling, and Google Search Console for indexing. All free.<\/p>\n<p>E4 fails more often than any other point on this sheet, and it is the only one that invalidates every other number in your account. Test it first, every time.<\/p>\n<hr />\n<h2>Score summary<\/h2>\n<table>\n<thead>\n<tr>\n<th>Group<\/th>\n<th>Score<\/th>\n<th>/20<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A — Clarity<\/td>\n<td><\/td>\n<td>20<\/td>\n<\/tr>\n<tr>\n<td>B — Relevance / message match<\/td>\n<td><\/td>\n<td>20<\/td>\n<\/tr>\n<tr>\n<td>C — Proof<\/td>\n<td><\/td>\n<td>20<\/td>\n<\/tr>\n<tr>\n<td>D — Friction<\/td>\n<td><\/td>\n<td>20<\/td>\n<\/tr>\n<tr>\n<td>E — Speed / technical<\/td>\n<td><\/td>\n<td>20<\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td><\/td>\n<td><strong>100<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Weakest group:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/p>\n<hr />\n<h2>Prioritised fixes<\/h2>\n<p>Sort by (expected impact ÷ effort). Do the top three before anything else. Do not queue twelve fixes; you will do none of them.<\/p>\n<table>\n<thead>\n<tr>\n<th>Rank<\/th>\n<th>Fix<\/th>\n<th>Point ref<\/th>\n<th>Effort (h)<\/th>\n<th>Expected impact<\/th>\n<th>Owner<\/th>\n<th>Due<\/th>\n<th>Result after<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Rank<\/th>\n<th>Fix<\/th>\n<th>Ref<\/th>\n<th>Effort<\/th>\n<th>Expected impact<\/th>\n<th>Owner<\/th>\n<th>Due<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Verify the form submission fires the GA4 key event and the Google Ads conversion; it currently fires on page load<\/td>\n<td>E4<\/td>\n<td>1h<\/td>\n<td>Unknown but every optimisation decision is currently based on a wrong number<\/td>\n<td>A.<\/td>\n<td>Today<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Rewrite H1 to match the ad headline (\"Hand over the mess exactly as it is\")<\/td>\n<td>B1<\/td>\n<td>0.5h<\/td>\n<td>10-25% CVR on paid traffic<\/td>\n<td>A.<\/td>\n<td>Thu<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Cut form from 7 fields to 3 (name, email, trade)<\/td>\n<td>D1<\/td>\n<td>2h<\/td>\n<td>20-40% more submissions; watch lead quality as a guardrail<\/td>\n<td>A.<\/td>\n<td>Fri<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Add the electrician video testimonial directly above the form<\/td>\n<td>C2<\/td>\n<td>3h<\/td>\n<td>5-15%<\/td>\n<td>A.<\/td>\n<td>Next week<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Publish a price range on the page<\/td>\n<td>D3<\/td>\n<td>1h + a decision<\/td>\n<td>Fewer, better leads; unknown net<\/td>\n<td>Founder<\/td>\n<td>Next week<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Note that rank 1 has unknown impact and is still first. Fix measurement before you fix anything you intend to measure.<\/p>\n<p>Note also that fixes 3 and 5 have guardrails attached. Any change that increases volume by lowering commitment must be watched downstream, or you will celebrate a conversion-rate win that produced fewer customers.<\/p>\n<hr />\n<h2>Re-audit<\/h2>\n<table>\n<thead>\n<tr>\n<th>Date<\/th>\n<th>Total score<\/th>\n<th>CVR before<\/th>\n<th>CVR after<\/th>\n<th>What actually moved it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What good looks like<\/h2>\n<p>The audit was done against one specific traffic source with the ad copy open in another tab. At least five strangers took the five-second test and their exact words are recorded in the notes column. Tracking was verified with a live test submission before anything else was judged. The output is three fixes with owners and dates, not a twenty-item wishlist, and the re-audit table gets filled in four weeks later with the actual conversion-rate change.<\/p>\n<h2>Common failure<\/h2>\n<p>Auditing on a desktop monitor at full width, on fast wifi, with an ad blocker on, while already knowing what the product does. That combination hides almost every real problem: mobile layout, load time, cookie walls, and above all the fact that a stranger cannot tell what you sell. Open the page on your phone, on mobile data, and hand it to someone who has never heard of the business. That takes four minutes and beats the other thirty-six.<\/p>"}, {"slug": "marketing-plan-1pager", "title": "Marketing Plan — One Page", "blurb": "Use with: M06 — Writing a marketing strategy", "html": "<h1>Marketing Plan — One Page<\/h1>\n<p><strong>Use with:<\/strong> M06 — Writing a marketing strategy\n<strong>Time to fill:<\/strong> 90 minutes if the earlier templates are done; a week if they are not\n<strong>Refill:<\/strong> quarterly. Rewrite fully once a year.<\/p>\n<p>A strategy is a diagnosis, a guiding policy, and a coherent set of actions. It is not a list of tactics with dates on them. If this document does not say what you are <strong>not<\/strong> doing and why, it is a to-do list wearing a suit.<\/p>\n<p><strong>Keep it to one page.<\/strong> If it does not fit, you have not decided.<\/p>\n<hr />\n<h2>1. Diagnosis<\/h2>\n<p>What is actually going on? The obstacle, in mechanical terms. One paragraph, maximum five sentences. Use numbers.<\/p>\n<pre><code>\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong><\/p>\n<pre><code>We acquire 14 customers a month, 11 of them from branded and high-intent\nsearch, which is already saturated: impression share on our core terms is 78%\nand CPCs rose 34% year on year while volume was flat. Nobody outside the ~900\nmonthly searchers knows the category of service exists, so there is no top of\nfunnel to feed capture. Retention is strong (7% annual churn, 3,400 EUR LTV),\nso the constraint is not the product; it is that we are fishing in a pond we\nhave already emptied.\n<\/code><\/pre>\n<p><strong>Bad diagnosis to avoid:<\/strong> \"We need to grow revenue by 40% and increase brand awareness in our market.\" That is a target and a wish, not a diagnosis.<\/p>\n<hr />\n<h2>2. Guiding policy<\/h2>\n<p>The overall approach that responds to the diagnosis. One or two sentences. It should rule things out.<\/p>\n<pre><code>\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong><\/p>\n<pre><code>Spend the next four quarters converting saturated capture into a creation\nengine: build recognition among trades owners before they have a tax problem,\nusing one channel where they already congregate, and accept flat paid-search\nvolume rather than bidding CPCs up to defend it.\n<\/code><\/pre>\n<p>A guiding policy is testable: someone should be able to bring you a proposal and you can say \"no, that contradicts the policy.\"<\/p>\n<hr />\n<h2>3. Objectives<\/h2>\n<p>Numbers and dates. Three at most. Each must be something you could be wrong about.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Objective<\/th>\n<th>Baseline today<\/th>\n<th>Target<\/th>\n<th>By when<\/th>\n<th>Owner<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Objective<\/th>\n<th>Baseline<\/th>\n<th>Target<\/th>\n<th>By when<\/th>\n<th>Owner<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>New customers per month<\/td>\n<td>14<\/td>\n<td>24<\/td>\n<td>30 Jun 2027<\/td>\n<td>A.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Share of new customers from non-search sources<\/td>\n<td>21%<\/td>\n<td>45%<\/td>\n<td>30 Jun 2027<\/td>\n<td>A.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Blended CAC<\/td>\n<td>310 EUR<\/td>\n<td>≤ 340 EUR<\/td>\n<td>30 Jun 2027<\/td>\n<td>A.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Objective 3 is a <em>constraint objective<\/em>: it stops objective 1 being achieved by simply overpaying. Every growth objective needs one.<\/p>\n<hr />\n<h2>4. Target segment<\/h2>\n<p>Who, precisely. Pull from <code>icp-and-jtbd.md<\/code>. Include who you are explicitly not serving this year.<\/p>\n<ul>\n<li><strong>Primary segment:<\/strong><\/li>\n<li><strong>Estimated size of that segment:<\/strong><\/li>\n<li><strong>Trigger we will be present for:<\/strong><\/li>\n<li><strong>Explicitly not targeting this year:<\/strong><\/li>\n<li><strong>Why not:<\/strong><\/li>\n<\/ul>\n<hr />\n<h2>5. Positioning<\/h2>\n<p>One line from <code>positioning-statement.md<\/code>, plus the single comparison you are trying to win.<\/p>\n<ul>\n<li><strong>Positioning line:<\/strong><\/li>\n<li><strong>The alternative we are taking share from:<\/strong><\/li>\n<li><strong>The one thing we must make people believe:<\/strong><\/li>\n<\/ul>\n<hr />\n<h2>6. Channels<\/h2>\n<h3>Channels we are running<\/h3>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>Capture or creation<\/th>\n<th>Role in the plan<\/th>\n<th>Monthly budget<\/th>\n<th>Monthly hours<\/th>\n<th>Success looks like<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Channels we are explicitly NOT running<\/h3>\n<p>This table is the most valuable part of the document. Fill it honestly.<\/p>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>Why not<\/th>\n<th>What would change our mind<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>Why not<\/th>\n<th>What would change our mind<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TikTok<\/td>\n<td>Our buyer is 38-58 and runs a van; we have no video capability and would be learning a format and an audience at the same time<\/td>\n<td>Evidence from 3+ interviews that our ICP uses it for business decisions<\/td>\n<\/tr>\n<tr>\n<td>Cold email<\/td>\n<td>Deliverability risk to a domain we depend on for client comms; also legally awkward under GDPR for this list<\/td>\n<td>A separate sending domain and a properly consented list<\/td>\n<\/tr>\n<tr>\n<td>Programmatic display<\/td>\n<td>Cannot measure incrementality at our budget; the classic way to spend 2k EUR/month and learn nothing<\/td>\n<td>Budget above ~15k EUR/month where a holdout test becomes possible<\/td>\n<\/tr>\n<tr>\n<td>Conferences<\/td>\n<td>4k EUR and three days for maybe 20 conversations; our trigger is seasonal and conferences are not<\/td>\n<td>A partner willing to split a stand at the regional trades fair<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>7. Budget split<\/h2>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Monthly<\/th>\n<th>% of total<\/th>\n<th>Capture / creation / infrastructure<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td><\/td>\n<td>100%<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rules of thumb worth stating explicitly so you can argue with them:<\/p>\n<ul>\n<li>Keep a named line for <strong>testing<\/strong> (10-20%) that is allowed to fail without anyone being blamed.<\/li>\n<li>If creation is under 20% of spend and you are demand-constrained, the plan contradicts the diagnosis.<\/li>\n<li>Infrastructure (tracking, tooling, site work) is real spend. Hiding it makes channel CAC look better than it is.<\/li>\n<\/ul>\n<p><strong>Test budget line:<\/strong> <strong><em>_<\/em>_ EUR/month. <strong>Owner of that line:<\/strong> <\/strong>____<\/p>\n<hr />\n<h2>8. Key metrics<\/h2>\n<p>Three to five. One per objective, plus guardrails. Name where each number comes from and who looks at it.<\/p>\n<table>\n<thead>\n<tr>\n<th>Metric<\/th>\n<th>Definition (exact)<\/th>\n<th>Source<\/th>\n<th>Frequency<\/th>\n<th>Current<\/th>\n<th>Target<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Also name the metrics you will deliberately <strong>ignore<\/strong>, so nobody panics about them in month two: <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/p>\n<hr />\n<h2>9. 90-day actions<\/h2>\n<p>The next 90 days only. Anything further out is a guess. Each action has one owner and a date.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Action<\/th>\n<th>Owner<\/th>\n<th>Due<\/th>\n<th>Done when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example of a well-specified row:<\/strong><\/p>\n<p>| 3 | Rebuild the pricing page with the fixed price above the fold and a downloadable sample monthly summary | A. | 14 Oct | Page live, sample downloadable without a form, GA4 key event firing on download |<\/p>\n<p>\"Done when\" must be observable by someone who was not involved.<\/p>\n<hr />\n<h2>10. Risks<\/h2>\n<table>\n<thead>\n<tr>\n<th>Risk<\/th>\n<th>Likelihood (L/M/H)<\/th>\n<th>Impact (L/M/H)<\/th>\n<th>Leading indicator we would see first<\/th>\n<th>What we do then<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Risk<\/th>\n<th>L<\/th>\n<th>I<\/th>\n<th>Leading indicator<\/th>\n<th>Response<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Creation channel produces awareness but no measurable pipeline for 6 months and we lose nerve<\/td>\n<td>H<\/td>\n<td>H<\/td>\n<td>Month 3 with zero attributable leads<\/td>\n<td>Pre-agree now: we judge it on branded search volume and direct traffic, not last-click leads, and we do not kill it before month 6<\/td>\n<\/tr>\n<tr>\n<td>Google Ads CPCs rise another 30%<\/td>\n<td>M<\/td>\n<td>M<\/td>\n<td>Weekly CPC trend on core terms<\/td>\n<td>Cap spend, shift the delta to the creation budget rather than defending impression share<\/td>\n<\/tr>\n<tr>\n<td>Founder capacity: this plan assumes 10 h/week of founder time<\/td>\n<td>H<\/td>\n<td>H<\/td>\n<td>Two consecutive weeks of missed actions<\/td>\n<td>Cut objective 2 scope, not objective 3's CAC guardrail<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The pre-commitment in row 1 is the most useful line in the document. Write your nerve-loss rule down while you are calm.<\/p>\n<hr />\n<h2>What good looks like<\/h2>\n<p>Someone who does not work with you can read this page and predict what you will say no to. The diagnosis contains at least three numbers. The excluded-channels table has a real reason and a real trigger for each row, not \"no budget.\" Every 90-day action has a \"done when\" that a stranger could verify. The plan is internally consistent: the budget split matches the guiding policy, and the metrics match the objectives.<\/p>\n<h2>Common failure<\/h2>\n<p>Writing a plan where every channel is included at low intensity. Doing eight channels badly is the single most common way small marketing teams waste a year: nothing gets enough budget to leave its learning phase, nothing gets enough hours to get good, and no result is clear enough to decide anything. A plan that funds two channels properly and names six it refuses to run is almost always the better document.<\/p>"}, {"slug": "monthly-report", "title": "Monthly Marketing Report — One Page", "blurb": "Use with: M13 (analytics) and M15 (budget and incrementality)", "html": "<h1>Monthly Marketing Report — One Page<\/h1>\n<p><strong>Use with:<\/strong> M13 (analytics) and M15 (budget and incrementality)\n<strong>Time to fill:<\/strong> 60 minutes, once you have done it twice\n<strong>Audience:<\/strong> a founder, a manager, or a client who is not a marketer<\/p>\n<p>The reader has ten minutes and a business to run. They need to know one thing: is this working, and what should they do. Everything on this page serves that.<\/p>\n<p><strong>Hard rules:<\/strong><\/p>\n<ul>\n<li>One page. If it does not fit, cut the charts, not the thinking.<\/li>\n<li>No metric appears without a comparison — to target, to last month, or to last year.<\/li>\n<li>Never present a number you cannot explain the cause of.<\/li>\n<li>Bad news goes at the top, not in an appendix.<\/li>\n<\/ul>\n<hr />\n<h2>Header<\/h2>\n<table>\n<thead>\n<tr>\n<th>Field<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Month<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Prepared by<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Date<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Spend this month<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Spend year to date vs. plan<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>1. Headline result vs. target<\/h2>\n<p>Three lines. This is the only part some readers will finish, so it must stand alone.<\/p>\n<pre><code>Result:\nTarget:\nVerdict: on track / behind / ahead / too early to say\n<\/code><\/pre>\n<p>Then one sentence explaining it in plain language, with the cause, not the number restated.<\/p>\n<pre><code>\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong><\/p>\n<pre><code>Result:  31 new customers, blended CAC 288 EUR\nTarget:  28 new customers, CAC under 340 EUR\nVerdict: Ahead on volume and cost.\n\nWe beat the target because the catch-up offer converted at nearly twice the\nrate of the old demo offer, not because we spent more or because traffic grew.\nTraffic was actually down 6%.\n<\/code><\/pre>\n<p>That last clause is what makes the report useful. It tells the reader which lever to pull next.<\/p>\n<p><strong>If you are behind, write it exactly as plainly:<\/strong><\/p>\n<pre><code>Result:  19 new customers, blended CAC 465 EUR\nTarget:  28 new customers, CAC under 340 EUR\nVerdict: Behind on both.\n\nPaid search volume fell 22% after a competitor entered the auction and pushed\nCPCs from 1.10 to 1.55 EUR. We held spend flat rather than bidding up, which\nwas the right call on the numbers but leaves a gap we have no second channel\nto fill yet.\n<\/code><\/pre>\n<hr />\n<h2>2. The metric tree<\/h2>\n<p>Show how the headline number is built. This is what lets a non-marketer see where the change actually happened rather than taking your word for it.<\/p>\n<table>\n<thead>\n<tr>\n<th>Level<\/th>\n<th>Metric<\/th>\n<th>This month<\/th>\n<th>Last month<\/th>\n<th>Change<\/th>\n<th>Target<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Outcome<\/td>\n<td>New customers<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Outcome<\/td>\n<td>Revenue from new customers<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Outcome<\/td>\n<td>Blended CAC<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Sessions<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Conversion rate to lead<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Leads<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Lead to customer rate<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Average deal / order value<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Health<\/td>\n<td>Churn / retention<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Health<\/td>\n<td>Branded search volume<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Level<\/th>\n<th>Metric<\/th>\n<th>This month<\/th>\n<th>Last month<\/th>\n<th>Change<\/th>\n<th>Target<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Outcome<\/td>\n<td>New customers<\/td>\n<td>31<\/td>\n<td>24<\/td>\n<td>+29%<\/td>\n<td>28<\/td>\n<\/tr>\n<tr>\n<td>Outcome<\/td>\n<td>Blended CAC<\/td>\n<td>288 EUR<\/td>\n<td>372 EUR<\/td>\n<td>-23%<\/td>\n<td>&lt;340<\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Sessions<\/td>\n<td>5,410<\/td>\n<td>5,760<\/td>\n<td>-6%<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Lead CVR<\/td>\n<td>5.2%<\/td>\n<td>3.4%<\/td>\n<td>+53%<\/td>\n<td>4.0%<\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Leads<\/td>\n<td>281<\/td>\n<td>196<\/td>\n<td>+43%<\/td>\n<td>230<\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Lead to customer<\/td>\n<td>11.0%<\/td>\n<td>12.2%<\/td>\n<td>-10%<\/td>\n<td>12%<\/td>\n<\/tr>\n<tr>\n<td>Health<\/td>\n<td>Monthly churn<\/td>\n<td>2.3%<\/td>\n<td>2.5%<\/td>\n<td>-0.2pp<\/td>\n<td>&lt;2.5%<\/td>\n<\/tr>\n<tr>\n<td>Health<\/td>\n<td>Branded search<\/td>\n<td>640<\/td>\n<td>590<\/td>\n<td>+8%<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Read the tree aloud: sessions fell, lead conversion rose sharply, lead quality dipped slightly, net result strongly positive. The story is visible without any commentary, which is the test of a good tree.<\/p>\n<p><strong>One rule:<\/strong> the drivers must multiply out to the outcome. If they do not, you have chosen decorative metrics rather than a tree.<\/p>\n<hr />\n<h2>3. What changed and why<\/h2>\n<p>Three to five bullets. Each one names a cause, not a coincidence, and states the confidence level honestly.<\/p>\n<table>\n<thead>\n<tr>\n<th>What moved<\/th>\n<th>Direction<\/th>\n<th>Why we think so<\/th>\n<th>Confidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>High / Medium / Low<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>What moved<\/th>\n<th>Direction<\/th>\n<th>Why<\/th>\n<th>Confidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lead conversion rate 3.4% → 5.2%<\/td>\n<td>Up<\/td>\n<td>New catch-up offer launched 4 Oct; the rate stepped on that exact date and holds across both traffic sources<\/td>\n<td>High<\/td>\n<\/tr>\n<tr>\n<td>Sessions -6%<\/td>\n<td>Down<\/td>\n<td>We cut the display line and let paid search run flat while CPCs rose<\/td>\n<td>High<\/td>\n<\/tr>\n<tr>\n<td>Lead-to-customer 12.2% → 11.0%<\/td>\n<td>Down<\/td>\n<td>A free assessment attracts more people who are just curious; this is the expected trade and we still net more customers<\/td>\n<td>Medium<\/td>\n<\/tr>\n<tr>\n<td>Branded search +8%<\/td>\n<td>Up<\/td>\n<td>Possibly the LinkedIn posts; possibly seasonal (October is a filing month). Cannot separate the two yet.<\/td>\n<td>Low<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The \"Low\" row is the most professionally credible line in the report.<\/strong> Naming what you cannot yet attribute is what separates a marketer from a person presenting a dashboard. Do not delete it to look more certain.<\/p>\n<hr />\n<h2>4. What we learned<\/h2>\n<p>Two or three things, stated as transferable knowledge rather than as events.<\/p>\n<pre><code>1.\n2.\n3.\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong><\/p>\n<pre><code>1. The offer was the constraint, not the traffic. We spent four months\n   optimising ads against a demo request nobody wanted. Changing what we asked\n   for beat every bid and creative change we made all year.\n2. Free assessments convert to paid at 21% — high enough to fund giving them\n   away, but each one costs 40 minutes of delivery time, so this scales to\n   about 45/month before it needs a process change.\n3. Our tracking was double-counting form submissions from returning visitors.\n   September's numbers were roughly 8% overstated. Fixed on 12 Oct; the tree\n   above uses corrected figures for both months.\n<\/code><\/pre>\n<p>Item 3 is the kind of thing people hide. Put it in. Reporting your own measurement errors is how a client comes to trust the numbers you do report.<\/p>\n<hr />\n<h2>5. What we are doing next month<\/h2>\n<p>Three to five actions. Each with an owner, a date, and the expected effect. Nothing vague.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Action<\/th>\n<th>Why (which finding it follows from)<\/th>\n<th>Owner<\/th>\n<th>By<\/th>\n<th>Expected effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Action<\/th>\n<th>Why<\/th>\n<th>Owner<\/th>\n<th>By<\/th>\n<th>Expected effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Roll the catch-up offer into paid social and the email list<\/td>\n<td>It is the only proven lever we have<\/td>\n<td>A.<\/td>\n<td>8 Nov<\/td>\n<td>+8-12 customers/mo<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Add a 3-question qualifier before the assessment booking<\/td>\n<td>Recover the lead-to-customer dip without losing volume<\/td>\n<td>A.<\/td>\n<td>12 Nov<\/td>\n<td>Lead-to-customer back to ~12%<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Build the assessment delivery template<\/td>\n<td>We hit the 45/month ceiling in December otherwise<\/td>\n<td>A. + delivery<\/td>\n<td>20 Nov<\/td>\n<td>Halves delivery time per assessment<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Hold a 15% geographic holdout on LinkedIn for 8 weeks<\/td>\n<td>We cannot currently tell if brand activity is doing anything<\/td>\n<td>A.<\/td>\n<td>Starts 1 Nov<\/td>\n<td>An honest read by January<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Every action traces back to a numbered finding above. If an action does not trace to a finding, ask why it is on the list.<\/p>\n<hr />\n<h2>6. What we need from you<\/h2>\n<p>The section most reports omit and every reader wants. Be specific about what is blocked and what it costs to stay blocked.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>What we need<\/th>\n<th>From whom<\/th>\n<th>By when<\/th>\n<th>What happens if we don't get it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Need<\/th>\n<th>From<\/th>\n<th>By<\/th>\n<th>If not<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Decision on publishing prices on the site<\/td>\n<td>Founder<\/td>\n<td>8 Nov<\/td>\n<td>The pricing page test is blocked; it is currently our highest-expected-value test<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>45 minutes with two recent customers for video testimonials<\/td>\n<td>Delivery lead<\/td>\n<td>20 Nov<\/td>\n<td>Paid social creative stays at four angles; we are seeing fatigue at ~8 days<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Agreement to hold the LinkedIn holdout for the full 8 weeks even if it looks quiet<\/td>\n<td>Founder<\/td>\n<td>Before 1 Nov<\/td>\n<td>We will never know whether the brand spend is incremental, and we will keep arguing about it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Number 3 pre-commits the reader to a decision while they are calm, which is the point of writing it down in a report rather than raising it during a bad week.<\/p>\n<hr />\n<h2>Optional appendix (not on the page)<\/h2>\n<p>Keep these out of the one page; link to them.<\/p>\n<ul>\n<li>Channel-by-channel detail table<\/li>\n<li>Creative performance<\/li>\n<li>Test results this month (link to <code>ab-test-plan.md<\/code> logs)<\/li>\n<li>Full metric definitions and data sources<\/li>\n<li>Known measurement caveats and attribution windows in use<\/li>\n<\/ul>\n<hr />\n<h2>What good looks like<\/h2>\n<p>A non-marketer can read it in ten minutes and correctly answer three questions: is this working, why, and what do I need to decide. The metric tree multiplies out. At least one item admits low confidence or an error. Every next-month action traces to a finding, and every \"need from you\" states the cost of inaction. Written the same way in a bad month as in a good one.<\/p>\n<h2>Common failure<\/h2>\n<p>The dashboard dump: twenty charts, no argument, and the reader left to decide for themselves what it means. Its close cousin is the good-news filter, where a bad month is reported through whichever metric happened to rise — impressions, reach, engagement rate. Both destroy trust, but slowly enough that you do not notice until the budget conversation. Lead with the number that matters, even when it is the wrong direction, and you will be believed the month you have something good to report.<\/p>"}, {"slug": "positioning-statement", "title": "Positioning Statement and Message Hierarchy", "blurb": "Use with: M03 — Positioning, brand, messaging", "html": "<h1>Positioning Statement and Message Hierarchy<\/h1>\n<p><strong>Use with:<\/strong> M03 — Positioning, brand, messaging\n<strong>Time to fill:<\/strong> 60 minutes\n<strong>Refill:<\/strong> annually, or when a new competitor changes what buyers compare you against<\/p>\n<p>Positioning is not a slogan. It is a decision about <strong>what you want to be compared to<\/strong>, made deliberately instead of by accident. If you do not choose, the customer chooses for you, usually badly.<\/p>\n<p>Work through parts 1-5 in order. Do not skip to the statement; the statement is the output, not the input.<\/p>\n<hr />\n<h2>Part 1 — Competitive alternatives<\/h2>\n<p>What would the customer do if you did not exist? Not \"who are our competitors\" — competitors are a category you invented. Alternatives are what actually happens.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Alternative<\/th>\n<th>Category the customer puts it in<\/th>\n<th>What it does well<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Do nothing / status quo<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Alternative<\/th>\n<th>Category<\/th>\n<th>What it does well<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Spreadsheet + do it yourself<\/td>\n<td>\"Being careful with money\"<\/td>\n<td>Free, total control, no trust required<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Local gestoria<\/td>\n<td>\"An accountant\"<\/td>\n<td>Personal relationship, cheap, culturally default<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Cloud accounting SaaS<\/td>\n<td>\"Software\"<\/td>\n<td>Cheap, modern, always available<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Hire a part-time bookkeeper<\/td>\n<td>\"Staff\"<\/td>\n<td>Dedicated, on your terms<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Note that these sit in <strong>four different categories<\/strong>. That is normal and it is exactly the problem positioning solves: you must decide which of these comparisons you want to win.<\/p>\n<hr />\n<h2>Part 2 — Unique attributes<\/h2>\n<p>What do you have that the alternatives do not? Facts only. Capabilities, assets, structural advantages. Not adjectives.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Attribute<\/th>\n<th>Which alternatives lack it<\/th>\n<th>How a skeptic could verify it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Test:<\/strong> could a competitor put the same words on their site tomorrow without lying? If yes, it is not an attribute, it is a platitude. \"Great customer service,\" \"innovative,\" \"trusted,\" \"passionate about our clients\" all fail this test.<\/p>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Attribute<\/th>\n<th>Which alternatives lack it<\/th>\n<th>Verifiable how<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>We only serve trades businesses; 340 of them<\/td>\n<td>Gestoria (serves everyone), SaaS (serves everyone)<\/td>\n<td>Client list, sector-specific case studies<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Fixed monthly price, no hourly billing, published on the site<\/td>\n<td>Gestoria, part-time bookkeeper<\/td>\n<td>The pricing page exists<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>WhatsApp is the primary support channel, replies inside 4 working hours<\/td>\n<td>Gestoria, SaaS<\/td>\n<td>Published SLA, screenshots, response-time report<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Monthly one-page plain-Spanish summary, not a P&amp;L<\/td>\n<td>All four<\/td>\n<td>Sample summary downloadable without a form<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Part 3 — Value they enable<\/h2>\n<p>For each attribute, what does the customer actually get? Push through two levels: attribute leads to a capability, capability leads to a life outcome.<\/p>\n<table>\n<thead>\n<tr>\n<th>Attribute<\/th>\n<th>So the customer can...<\/th>\n<th>Which means... (the outcome they'd tell a friend)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Attribute<\/th>\n<th>So the customer can...<\/th>\n<th>Which means...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Only serve trades businesses<\/td>\n<td>Skip explaining what a retention or a materials deposit is<\/td>\n<td>\"They already know how my business works\"<\/td>\n<\/tr>\n<tr>\n<td>Fixed published price<\/td>\n<td>Ask a question without wondering if it costs 90 EUR<\/td>\n<td>\"I actually talk to my accountant now\"<\/td>\n<\/tr>\n<tr>\n<td>WhatsApp, 4-hour SLA<\/td>\n<td>Get an answer from a van at 7am<\/td>\n<td>\"I don't have to be at a desk to run my finances\"<\/td>\n<\/tr>\n<tr>\n<td>One-page monthly summary<\/td>\n<td>Know if the last month was good in 30 seconds<\/td>\n<td>\"I finally understand my own numbers\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The third column is the copy. The first column is the proof.<\/p>\n<hr />\n<h2>Part 4 — Who cares most<\/h2>\n<p>Of everyone who could buy, who cares <em>disproportionately<\/em> about the value in Part 3? Describe them by characteristic, not by name.<\/p>\n<ul>\n<li><strong>They care most when:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<li><strong>Segment characteristics that predict caring:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<li><strong>Who explicitly does not care (and that is fine):<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<\/ul>\n<p><strong>Filled example:<\/strong><\/p>\n<ul>\n<li>They care most when: revenue is growing past what a spreadsheet handles (roughly 150k EUR) and the owner has just been penalised or scared once.<\/li>\n<li>Predicts caring: owner-operated, 2-8 staff, no office manager, growing, has had one tax scare in the last 18 months.<\/li>\n<li>Does not care: sub-60k solo autonomos (price-only), and firms over 1M EUR (they want an in-house finance person and a real advisor).<\/li>\n<\/ul>\n<p>If you cannot name a group that does not care, you have not positioned, you have described.<\/p>\n<hr />\n<h2>Part 5 — Market category<\/h2>\n<p>The category is the context you put yourself in so the buyer knows what to compare you to and what to expect. Choosing wrong is expensive: a category that is too big means you get compared to giants; too new means you must fund the education of the whole market.<\/p>\n<ul>\n<li><strong>Category we claim:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<li><strong>What that makes the buyer assume (good):<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<li><strong>What that makes the buyer assume (bad, and how we counter it):<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<li><strong>Categories we deliberately reject and why:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/li>\n<\/ul>\n<p><strong>Filled example:<\/strong><\/p>\n<ul>\n<li>Category we claim: \"Bookkeeping and tax service for trades businesses.\"<\/li>\n<li>Good assumptions: it is a service, there is a human, it is recurring, it replaces the gestoria.<\/li>\n<li>Bad assumptions: \"so it's expensive and slow like a gestoria.\" Countered by the published fixed price and the 4-hour SLA on the first screen.<\/li>\n<li>Rejected: \"accounting software\" (invites price comparison with a 30 EUR tool and makes the human the cost, not the value). Rejected: \"financial advisory\" (implies advice we do not give and a price we do not charge).<\/li>\n<\/ul>\n<hr />\n<h2>Part 6 — The assembled positioning statement<\/h2>\n<p>This is an internal document. It is not going on the website. Its job is to make the whole team make consistent decisions.<\/p>\n<blockquote>\n<p>For <strong>[who cares most]<\/strong>\nwho <strong>[situation / trigger]<\/strong>,\n<strong>[product name]<\/strong> is a <strong>[market category]<\/strong>\nthat <strong>[key value delivered]<\/strong>.\nUnlike <strong>[primary competitive alternative]<\/strong>,\nwe <strong>[the unique attribute that makes the value credible]<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>Your statement:<\/strong><\/p>\n<pre><code>For ______________________________________________\nwho ______________________________________________,\n______________ is a ______________________________\nthat _____________________________________________.\nUnlike ___________________________________________,\nwe _______________________________________________.\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong><\/p>\n<pre><code>For owner-operated trades businesses doing 150k-500k EUR\nwho have just been burned once by a filing they did themselves,\nCuentas Claras is a bookkeeping and tax service for trades businesses\nthat gives them a plain-Spanish picture of their money every month\nwithout them touching a spreadsheet.\nUnlike a traditional gestoria,\nwe work only with trades, publish a fixed monthly price, and answer on\nWhatsApp within four working hours.\n<\/code><\/pre>\n<p><strong>Sanity checks before you accept it:<\/strong><\/p>\n<ul>\n<li>[ ] Could a competitor sign their name under this statement unchanged? If yes, rewrite.<\/li>\n<li>[ ] Does it name a specific alternative you are trying to beat?<\/li>\n<li>[ ] Would the customers you interviewed recognise themselves in line 1 and 2?<\/li>\n<li>[ ] Is there anything in it you cannot prove today?<\/li>\n<\/ul>\n<hr />\n<h2>Part 7 — Message hierarchy<\/h2>\n<p>One core message. Three pillars. Proof under each. Everything you publish traces back to one of these or it does not get published.<\/p>\n<h3>Core message<\/h3>\n<p>One sentence, customer-facing, that you would be happy to have repeated back to you verbatim.<\/p>\n<pre><code>\n<\/code><\/pre>\n<p><strong>Filled example:<\/strong> \"Your books, handled by people who actually understand trades.\"<\/p>\n<h3>Pillar 1<\/h3>\n<ul>\n<li><strong>Pillar:<\/strong><\/li>\n<li><strong>Proof A:<\/strong><\/li>\n<li><strong>Proof B:<\/strong><\/li>\n<li><strong>Proof C:<\/strong><\/li>\n<\/ul>\n<h3>Pillar 2<\/h3>\n<ul>\n<li><strong>Pillar:<\/strong><\/li>\n<li><strong>Proof A:<\/strong><\/li>\n<li><strong>Proof B:<\/strong><\/li>\n<li><strong>Proof C:<\/strong><\/li>\n<\/ul>\n<h3>Pillar 3<\/h3>\n<ul>\n<li><strong>Pillar:<\/strong><\/li>\n<li><strong>Proof A:<\/strong><\/li>\n<li><strong>Proof B:<\/strong><\/li>\n<li><strong>Proof C:<\/strong><\/li>\n<\/ul>\n<p><strong>Filled example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Pillar<\/th>\n<th>Proof<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>They know my trade<\/strong><\/td>\n<td>340 trades clients; sector-specific guides on retentions and materials; case study of an electrical firm; the onboarding form asks about your trade, not your \"industry vertical\"<\/td>\n<\/tr>\n<tr>\n<td><strong>I always know what it costs<\/strong><\/td>\n<td>Price published on the site; no hourly billing; contract is one page; 47 clients on record saying they stopped avoiding questions<\/td>\n<\/tr>\n<tr>\n<td><strong>I get answers where I already am<\/strong><\/td>\n<td>WhatsApp-first; 4-hour SLA published with the actual measured median (1h 50m last quarter); no portal login required<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Proof types, in descending order of power: customer's own numbers, third-party data, named customer quote, demonstration, your own data, a claim. If a pillar has only claims under it, that pillar is aspiration, not messaging — either get proof or drop the pillar.<\/p>\n<h3>Message-to-channel map<\/h3>\n<table>\n<thead>\n<tr>\n<th>Channel<\/th>\n<th>Which pillar leads<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Homepage hero<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Search ads<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Paid social<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Sales first call<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Onboarding email<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>What good looks like<\/h2>\n<p>A stranger reading only Part 6 could tell you which of your four competitive alternatives you are attacking and what evidence you would show to win. Every pillar has at least one proof that is a number or a named customer. The statement excludes people on purpose, and you can name who it excludes without flinching.<\/p>\n<h2>Common failure<\/h2>\n<p>Writing the positioning statement as a superlative sandwich — \"the leading, most trusted, all-in-one platform for modern businesses.\" It contains no comparison, so it makes no decision, so it changes nothing about what you build or say. The second failure is positioning against a competitor the customer has never heard of, while the real alternative — doing nothing — goes unaddressed on every page you own.<\/p>"}, {"slug": "unit-economics-model", "title": "Unit Economics and Funnel Model", "blurb": "Use with: M05 — Funnels, journeys, and unit economics", "html": "<h1>Unit Economics and Funnel Model<\/h1>\n<p><strong>Use with:<\/strong> M05 — Funnels, journeys, and unit economics\n<strong>Time to fill:<\/strong> 60 minutes\n<strong>Refill:<\/strong> monthly. This is the single most-used sheet in the whole course.<\/p>\n<p>The arithmetic on this page decides whether a channel is allowed to exist. Marketers who cannot do it get fired; marketers who can do it get to allocate budget. There is no third option.<\/p>\n<p>Work in a spreadsheet if you prefer — the point is the structure, not the file format.<\/p>\n<hr />\n<h2>The formulas, written out<\/h2>\n<p>Learn these. They are all you need.<\/p>\n<pre><code>Step conversion rate     = outputs of step / inputs to step\nOverall conversion rate  = product of every step conversion rate\nCustomers               = traffic x overall conversion rate\n\nCAC                     = total acquisition spend / new customers acquired\n                          (spend must include ad spend + tools + agency/salary\n                           attributable to acquisition. Excluding people costs\n                           is the most common way CAC gets faked.)\n\nContribution margin     = revenue per order (or per month) - variable costs\n                          Variable = COGS, payment fees, shipping, delivery\n                          labour, support. NOT rent, NOT salaries of people who\n                          would be there anyway.\n\nContribution margin %   = contribution margin / revenue\n\nAverage lifetime (mo)   = 1 / monthly churn rate\nLTV                     = monthly contribution margin x average lifetime\n                          (subscription)\nLTV                     = AOV x contribution margin % x purchases per lifetime\n                          (transactional)\n\nLTV:CAC                 = LTV / CAC\nPayback (months)        = CAC / monthly contribution margin\n                          (transactional: CAC / contribution per order x orders\n                           per month)\n\nMax affordable CAC      = LTV / target LTV:CAC ratio\nMax affordable CPA      = max affordable CAC x (conversion rate from that step\n   (at any funnel step)    to customer)\nMax affordable CPC      = max affordable cost per lead x landing page CVR\nBreak-even CAC          = LTV  (i.e. LTV:CAC = 1:1 — you make nothing)\n<\/code><\/pre>\n<p>Two rules that stop most bad decisions:<\/p>\n<ol>\n<li><strong>LTV must be gross contribution, not revenue.<\/strong> If you use revenue, every ratio flatters you by roughly the size of your cost of delivery, and you will fund a channel that loses money on every sale.<\/li>\n<li><strong>Cap the lifetime horizon.<\/strong> An LTV built on 60 months of assumed retention is a work of fiction financed with real money. Use 12, 24, or at most 36 months and say which.<\/li>\n<\/ol>\n<hr />\n<h2>Part 1 — The funnel<\/h2>\n<p>Fill in the volume at each step; the rates compute from them. Add or remove rows to match your real funnel.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Step<\/th>\n<th>Volume<\/th>\n<th>Step CVR<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Impressions / reach<\/td>\n<td><\/td>\n<td>—<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Clicks / visits<\/td>\n<td><\/td>\n<td><\/td>\n<td>CTR<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Engaged sessions (or product views)<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Leads / add to cart<\/td>\n<td><\/td>\n<td><\/td>\n<td>Landing page CVR<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Qualified / checkout started<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Opportunity / call held<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>Customers<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Overall conversion rate (step 2 to step 7): ______ %<\/li>\n<li>Time from step 2 to step 7 (median days): ______<\/li>\n<\/ul>\n<h3>Worked example — a B2B service, one paid search channel, one month<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Step<\/th>\n<th>Volume<\/th>\n<th>Step CVR<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Impressions<\/td>\n<td>200,000<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Clicks<\/td>\n<td>2,400<\/td>\n<td>1.20% (CTR)<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Engaged sessions<\/td>\n<td>1,730<\/td>\n<td>72.1%<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Leads (form submits)<\/td>\n<td>96<\/td>\n<td>4.00% of clicks<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Calls booked<\/td>\n<td>43.2<\/td>\n<td>45.0%<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Calls held<\/td>\n<td>30.2<\/td>\n<td>70.0%<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Customers<\/td>\n<td>7.56<\/td>\n<td>25.0%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Overall click-to-customer rate: 7.56 / 2,400 = <strong>0.315%<\/strong>\nLead-to-customer rate: 7.56 / 96 = <strong>7.875%<\/strong><\/p>\n<hr />\n<h2>Part 2 — Cost side<\/h2>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<th>Note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Media spend<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tools attributable to acquisition<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Agency / freelancer<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Internal time (hours x loaded rate)<\/td>\n<td><\/td>\n<td>Do not skip this<\/td>\n<\/tr>\n<tr>\n<td><strong>Total acquisition spend<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>New customers acquired<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>CAC<\/strong><\/td>\n<td><\/td>\n<td>Total spend / new customers<\/td>\n<\/tr>\n<tr>\n<td>Cost per click<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Cost per lead<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Worked example:
