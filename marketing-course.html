<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Media spend<\/td>\n<td>2,640 EUR (2,400 clicks x 1.10 EUR CPC)<\/td>\n<\/tr>\n<tr>\n<td>Tools<\/td>\n<td>0 (shared, immaterial at this volume)<\/td>\n<\/tr>\n<tr>\n<td>Internal time<\/td>\n<td>Excluded here for simplicity — see note below<\/td>\n<\/tr>\n<tr>\n<td><strong>Total acquisition spend<\/strong><\/td>\n<td>2,640 EUR<\/td>\n<\/tr>\n<tr>\n<td>New customers<\/td>\n<td>7.56<\/td>\n<\/tr>\n<tr>\n<td><strong>CAC<\/strong><\/td>\n<td>2,640 / 7.56 = <strong>349 EUR<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Cost per click<\/td>\n<td>1.10 EUR<\/td>\n<\/tr>\n<tr>\n<td>Cost per lead<\/td>\n<td>2,640 / 96 = 27.50 EUR<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Note on internal time: if the founder spends 8 hours a month on this channel at a 40 EUR/h loaded rate, that is 320 EUR, and true CAC becomes 2,960 / 7.56 = <strong>392 EUR<\/strong>, 12% worse. Decide once whether you include it, write the decision down, and be consistent. Comparing a channel with people costs against one without is how bad allocations get made.<\/p>\n<hr />\n<h2>Part 3 — Value side<\/h2>\n<h3>If subscription / recurring<\/h3>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Price per month<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Variable delivery cost per month<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Monthly contribution margin<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Contribution margin %<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Monthly churn rate<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Implied average lifetime (1 / churn)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Horizon used<\/strong> (12 / 24 / 36 months)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>LTV<\/strong> (monthly contribution x horizon)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>If transactional / ecommerce<\/h3>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AOV<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>COGS per order<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Shipping + payment fees per order<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Contribution per order<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Contribution margin %<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Orders per customer per year<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Horizon used (years)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>LTV<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Worked example (subscription):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Price per month<\/td>\n<td>220 EUR<\/td>\n<\/tr>\n<tr>\n<td>Variable delivery cost<\/td>\n<td>90 EUR<\/td>\n<\/tr>\n<tr>\n<td><strong>Monthly contribution margin<\/strong><\/td>\n<td><strong>130 EUR<\/strong> (59.1%)<\/td>\n<\/tr>\n<tr>\n<td>Monthly churn<\/td>\n<td>2.5%<\/td>\n<\/tr>\n<tr>\n<td>Implied average lifetime<\/td>\n<td>1 / 0.025 = 40 months<\/td>\n<\/tr>\n<tr>\n<td><strong>Horizon used<\/strong><\/td>\n<td>24 months (deliberately shorter than implied — we have only 19 months of data)<\/td>\n<\/tr>\n<tr>\n<td><strong>LTV<\/strong><\/td>\n<td>130 x 24 = <strong>3,120 EUR<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Part 4 — The verdict<\/h2>\n<table>\n<thead>\n<tr>\n<th>Metric<\/th>\n<th>Your number<\/th>\n<th>Rough benchmark<\/th>\n<th>Verdict<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>LTV:CAC<\/td>\n<td><\/td>\n<td>3:1 healthy; under 1:1 you are paying for customers<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Payback (months)<\/td>\n<td><\/td>\n<td>Under 12 for SMB subscription; under 3 for ecommerce; under 18 tolerable for enterprise if funded<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Contribution margin %<\/td>\n<td><\/td>\n<td>Above 50% gives room to buy growth; under 25% means most channels are closed to you<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Overall CVR<\/td>\n<td><\/td>\n<td>Compare to yourself last month, not to a blog post<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Worked example:<\/strong><\/p>\n<ul>\n<li>LTV:CAC = 3,120 / 349 = <strong>8.9 : 1<\/strong><\/li>\n<li>Payback = 349 / 130 = <strong>2.7 months<\/strong><\/li>\n<li>Contribution margin = <strong>59%<\/strong><\/li>\n<\/ul>\n<p>Verdict: not \"we are doing great.\" A ratio of 8.9:1 with a 2.7-month payback usually means the channel is <strong>underfunded<\/strong>, not that it is efficient. There is room to bid CPCs up substantially, or to enter more expensive channels, and still be well inside a healthy range. Ratios that look too good are usually a sign of a volume ceiling, not a triumph.<\/p>\n<hr />\n<h2>Part 5 — Ceilings: max affordable CPA and CPC<\/h2>\n<p>This is where the sheet becomes operational. It tells you the number to type into an ad platform.<\/p>\n<pre><code>Target LTV:CAC ratio      = _____ (3:1 is the usual planning target)\nMax affordable CAC        = LTV / target ratio\nMax affordable cost/lead  = max CAC x lead-to-customer rate\nMax affordable CPC        = max cost per lead x landing page CVR\nBreak-even CPC            = LTV x lead-to-customer rate x landing page CVR\n<\/code><\/pre>\n<p><strong>Worked example:<\/strong><\/p>\n<pre><code>Target ratio            = 3 : 1\nMax affordable CAC      = 3,120 / 3            = 1,040 EUR\nLead-to-customer rate   = 7.875%\nMax cost per lead       = 1,040 x 0.07875      = 81.90 EUR\nLanding page CVR        = 4.0%\nMax affordable CPC      = 81.90 x 0.04         = 3.28 EUR\nBreak-even CPC          = 3,120 x 0.07875 x 0.04 = 9.83 EUR\n<\/code><\/pre>\n<p>Current CPC is 1.10 EUR against a max of 3.28 EUR at a 3:1 target. That is the answer to \"should we spend more on Google Ads.\" Yes, up to roughly 3x the current bid, as long as the conversion rates hold at higher volume — which they usually do not, because you buy less-qualified traffic as you widen. Re-measure at every 50% step up in spend.<\/p>\n<p><strong>Your numbers:<\/strong><\/p>\n<pre><code>Target ratio            = _____ : 1\nMax affordable CAC      = _____\nMax cost per lead       = _____\nMax affordable CPC      = _____\nBreak-even CPC          = _____\n<\/code><\/pre>\n<p>Also compute the payback ceiling, because it usually binds before the ratio does when cash is tight:<\/p>\n<pre><code>Max CAC by payback rule = monthly contribution x months of payback you can fund\nWorked example          = 130 x 12 = 1,560 EUR\n<\/code><\/pre>\n<p><strong>Your binding constraint is the lower of the two.<\/strong> In the example, 1,040 EUR (the ratio) binds before 1,560 EUR (payback). Which one binds tells you whether your problem is profitability or cash.<\/p>\n<hr />\n<h2>Part 6 — Where the leverage is<\/h2>\n<p>Recompute the funnel changing one step at a time by a realistic amount. The step with the biggest effect on CAC is where your next month of work goes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Step changed<\/th>\n<th>From<\/th>\n<th>To<\/th>\n<th>New customers<\/th>\n<th>New CAC<\/th>\n<th>CAC change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CTR<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Landing page CVR<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Lead to call booked<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Call held rate<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Close rate<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Price<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Worked example:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Step changed<\/th>\n<th>From<\/th>\n<th>To<\/th>\n<th>New customers<\/th>\n<th>New CAC<\/th>\n<th>CAC change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Landing page CVR<\/td>\n<td>4.0%<\/td>\n<td>5.0%<\/td>\n<td>9.45<\/td>\n<td>279 EUR<\/td>\n<td>-20%<\/td>\n<\/tr>\n<tr>\n<td>Call held rate<\/td>\n<td>70%<\/td>\n<td>85%<\/td>\n<td>9.18<\/td>\n<td>288 EUR<\/td>\n<td>-18%<\/td>\n<\/tr>\n<tr>\n<td>Close rate<\/td>\n<td>25%<\/td>\n<td>28%<\/td>\n<td>8.47<\/td>\n<td>312 EUR<\/td>\n<td>-11%<\/td>\n<\/tr>\n<tr>\n<td>CPC<\/td>\n<td>1.10<\/td>\n<td>0.95<\/td>\n<td>7.56 (spend 2,280)<\/td>\n<td>302 EUR<\/td>\n<td>-14%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The call-held fix is a reminder text and a shorter booking window. It is a day of work and it is worth as much as a 14% CPC reduction that would take a month of bid work. <strong>The weakest step in the funnel is almost never the one people are optimising.<\/strong> That is the whole point of building this sheet.<\/p>\n<p><strong>My weakest step:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>\n<strong>Cheapest realistic improvement to it:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong>\n<strong>Expected effect on CAC:<\/strong> <strong><em>_<\/em><\/strong><strong><em>_<\/em><\/strong><\/p>\n<hr />\n<h2>What good looks like<\/h2>\n<p>Every number on the sheet traces to a source you could open right now — the ad platform, the CRM, the invoice, the P&amp;L. LTV uses contribution, not revenue, and a stated horizon shorter than the implied lifetime. The max CPC figure is written on a sticky note next to whoever manages bids. Part 6 has been done, and the next month's work is aimed at the step it identified, not at the step that is most fun to optimise.<\/p>\n<h2>Common failure<\/h2>\n<p>LTV inflation. It happens three ways, often at once: using revenue instead of contribution margin, assuming a retention curve you have not observed for long enough, and excluding people costs from CAC. Each is individually defensible-sounding and together they can make a channel that loses money look like a 5:1 winner. If a model justifies a decision you already wanted to make, recompute it with revenue swapped for contribution and the horizon halved, and see if it survives.<\/p>"}], "resources": "<h1>Resources<\/h1>\n<p>Deliberately short. Everything here has earned its place; anything not here was left out on purpose.<\/p>\n<p><strong>Read this first.<\/strong> Most marketing content online is low value. Not fraudulent — just optimised for something other than teaching you. The economics are simple: marketing content is cheap to produce, ranks well, and converts to agency leads, course sales, and software trials. So the internet is full of confident, well-designed articles written by people who have never spent their own money on the thing they are describing.<\/p>\n<p>Three filters that will save you hundreds of hours:<\/p>\n<ol>\n<li><strong>Does the author have skin in the game?<\/strong> Have they spent real budget, and do they report the losses? A piece that names a failure and what it cost is worth ten that do not.<\/li>\n<li><strong>Are there numbers with denominators?<\/strong> \"We increased conversions 300%\" from 1 to 4 is not a finding. Look for sample sizes, time periods, and spend levels. Their absence is usually deliberate.<\/li>\n<li><strong>Would this have been written if the author had nothing to sell?<\/strong> Almost every \"ultimate guide to X\" exists to rank for X and sell a tool for X. That does not make it wrong, but it explains why it will never tell you that you probably do not need X.<\/li>\n<\/ol>\n<p>One more, harder rule: <strong>survivorship bias makes case studies nearly useless as instruction.<\/strong> The identical playbook failed for a hundred companies you will never read about. Read case studies for mechanisms and for what was true about their situation, never as a recipe.<\/p>\n<hr />\n<h2>Books worth the time<\/h2>\n<p>Six. Each with who it is for and roughly how long it takes.<\/p>\n<p><strong>Obviously Awesome<\/strong> — April Dunford\n<em>Positioning, done as a practical method rather than a philosophy.<\/em> The clearest book on the hardest topic in marketing. ~4 hours. <strong>For everyone. Read this first.<\/strong> If you read only one thing on this page, this is it.<\/p>\n<p><strong>How Brands Grow<\/strong> — Byron Sharp\n<em>What the evidence actually says about how brands grow: penetration over loyalty, mental and physical availability, reach over precision targeting.<\/em> Dry, repetitive, and corrective — it will contradict most of what you have absorbed from marketing content online, and it has the data. ~8 hours. <strong>For anyone who will ever argue about a budget.<\/strong><\/p>\n<p><strong>Building a StoryBrand<\/strong> — Donald Miller\n<em>A formula for clear messaging when you are staring at a blank page.<\/em> Thin as theory and genuinely useful as a tool; the \"customer is the hero, you are the guide\" frame fixes about 60% of bad website copy. ~3 hours. <strong>For anyone who has to write a homepage this month.<\/strong> Use it and then outgrow it.<\/p>\n<p><strong>Good Strategy Bad Strategy<\/strong> — Richard Rumelt\n<em>Not a marketing book. The best explanation of why most \"strategies\" are lists of goals, and what a real one looks like: diagnosis, guiding policy, coherent action.<\/em> ~7 hours. <strong>For anyone who wants to be more than a channel operator.<\/strong> This is the book behind the one-page plan template.<\/p>\n<p><strong>The Mom Test<\/strong> — Rob Fitzpatrick\n<em>How to talk to customers so they tell you the truth instead of being nice to you.<\/em> Short, blunt, immediately applicable. ~2.5 hours. <strong>For anyone about to run their first customer interviews.<\/strong> Read it before you do the M02 interviews, not after.<\/p>\n<p><strong>Alchemy<\/strong> — Rory Sutherland\n<em>The case for psychology and the non-obvious, as a counterweight to everything else on this list.<\/em> Undisciplined and occasionally infuriating; also the best available inoculation against thinking marketing is only arithmetic. ~6 hours. <strong>For after you have the fundamentals<\/strong>, not before — the ideas are dangerous without a grounding in measurement.<\/p>\n<p><strong>On not reading more:<\/strong> the marginal book after these six is worth much less than an hour spent running a real campaign with your own money. Books are for frameworks. Reps are for skill. Do not use reading as a way to avoid the uncomfortable part.<\/p>\n<hr />\n<h2>Free courses and certifications<\/h2>\n<p><strong>Be honest about what these are.<\/strong> Certifications are weak signals. No hiring manager has ever been impressed by a Google Ads certification, because everyone knows the exams are multiple-choice, repeatable, and gameable. What they are is a free, structured tour of a platform's own vocabulary and interface, which is genuinely useful when you have never opened the tool. Do them for the tour, list them in a footer line on your CV, and do not expect them to open doors.<\/p>\n<p><strong>Google Skillshop<\/strong> — free. Certifications for Google Ads (Search, Display, Video, Shopping, Measurement) and Google Analytics. Do <strong>Google Ads Search<\/strong> and <strong>GA4<\/strong> if you will touch either. Roughly 4-6 hours each. The GA4 material is the fastest way to stop being confused by events versus key events.<\/p>\n<p><strong>HubSpot Academy<\/strong> — free. Inbound marketing, email, content. The content is competent and quite general. The <strong>Email Marketing<\/strong> course is the most useful one; the inbound certification is mostly HubSpot's worldview, which is a worldview, not a fact.<\/p>\n<p><strong>Meta Blueprint<\/strong> — free courses, paid exams. The free courses are worth skimming for how Advantage+ and the ad structures actually work. Do not pay for the exam.<\/p>\n<p><strong>Google Digital Garage / Fundamentals of Digital Marketing<\/strong> — free, very broad, very shallow. Skip it if you are doing this course; it covers the same ground with less depth.<\/p>\n<p><strong>Microsoft Clarity and Search Console documentation<\/strong> — not courses, but the official docs for both are short, readable, and better than any third-party guide about them.<\/p>\n<p><strong>Where certifications do help:<\/strong> getting past an automated CV screen for junior in-house roles, and reassuring a small local business client that you are not making it up. Both are real. Neither is skill.<\/p>\n<hr />\n<h2>Free tools every marketer should have<\/h2>\n<p>You can do professional work with only these. Set them up before you buy anything.<\/p>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>What it is for<\/th>\n<th>Set up when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Google Search Console<\/strong><\/td>\n<td>What queries you appear for, what gets clicked, indexing problems, Core Web Vitals field data<\/td>\n<td>Day one, on every site you touch<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Analytics 4<\/strong><\/td>\n<td>Traffic, key events, funnels. Free and universal, however you feel about it<\/td>\n<td>Day one, and verify a test conversion end to end<\/td>\n<\/tr>\n<tr>\n<td><strong>Microsoft Clarity<\/strong><\/td>\n<td>Session recordings and heatmaps, genuinely free with no volume cap<\/td>\n<td>Before your first landing page audit<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Trends<\/strong><\/td>\n<td>Seasonality, relative interest, whether a category is growing or dying<\/td>\n<td>Before choosing a market or writing a plan<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Keyword Planner<\/strong><\/td>\n<td>Search volumes and CPC estimates. Volumes are bucketed and imprecise; the CPC estimates are the more useful half<\/td>\n<td>During keyword research; needs an Ads account<\/td>\n<\/tr>\n<tr>\n<td><strong>Ahrefs Webmaster Tools<\/strong><\/td>\n<td>Free tier for sites you verify: backlinks, site audit, some keyword data<\/td>\n<td>When you start doing SEO properly<\/td>\n<\/tr>\n<tr>\n<td><strong>PostHog<\/strong> (free tier)<\/td>\n<td>Product analytics, funnels, session replay, feature flags. Generous free tier<\/td>\n<td>If there is a product or app, not just a site<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Tag Manager<\/strong><\/td>\n<td>Deploying and debugging tracking without touching code<\/td>\n<td>The first time tracking breaks, which will be soon<\/td>\n<\/tr>\n<tr>\n<td><strong>PageSpeed Insights<\/strong><\/td>\n<td>Core Web Vitals, lab and field<\/td>\n<td>During any landing page audit<\/td>\n<\/tr>\n<tr>\n<td><strong>A sample size calculator<\/strong><\/td>\n<td>Deciding whether you can test at all<\/td>\n<td>Before every A/B test<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Two paid tools worth the money eventually, and not before: a real SEO suite (Ahrefs or Semrush, roughly 100-130 EUR/month) once SEO is a named part of your plan, and an email platform once your list is over a few hundred people. Everything else can wait longer than vendors would like you to believe.<\/p>\n<hr />\n<h2>Newsletters and blogs worth following<\/h2>\n<p>Keep this list small. A large reading list produces the feeling of learning and none of the substance.<\/p>\n<p><strong>Marketing strategy and general<\/strong><\/p>\n<ul>\n<li><strong>Marketing Week<\/strong> (Mark Ritson's columns in particular) — evidence-driven, combative, and a reliable antidote to fashion. Frequently paywalled and frequently worth it.<\/li>\n<li><strong>The Ehrenberg-Bass Institute<\/strong> publications — the research behind <em>How Brands Grow<\/em>. Dense; read the summaries.<\/li>\n<\/ul>\n<p><strong>Search and AI search<\/strong><\/p>\n<ul>\n<li><strong>Google Search Central Blog<\/strong> — the primary source. Read what Google actually says before you read anyone's interpretation of it.<\/li>\n<li><strong>Search Engine Land<\/strong> — reliable news, moderate signal-to-noise. Read the news, skip the guides.<\/li>\n<li><strong>Aleyda Solis (Crawling Mondays / SEOFOMO)<\/strong> — the best single filter on SEO news, including the AEO/GEO shift.<\/li>\n<\/ul>\n<p><strong>Paid media<\/strong><\/p>\n<ul>\n<li><strong>Google Ads and Meta official product announcements<\/strong> — again, primary source first. Platform changes are the main external force on your results.<\/li>\n<li><strong>Practitioner accounts on LinkedIn who post their own account screenshots with spend attached.<\/strong> Follow three or four. Unfollow anyone whose posts are engagement-bait formatted as one-sentence paragraphs down the page.<\/li>\n<\/ul>\n<p><strong>Analytics and measurement<\/strong><\/p>\n<ul>\n<li><strong>The GA4 and Google Ads help documentation.<\/strong> Unglamorous, primary, and where most measurement arguments get settled.<\/li>\n<\/ul>\n<p><strong>How to actually use this list:<\/strong> subscribe to four things maximum. Give each one a month. Cancel anything you have skimmed rather than read three times in a row. The correct number of marketing newsletters is the number you actually read.<\/p>\n<hr />\n<h2>Communities<\/h2>\n<p>Communities are for questions with no documentation and for finding out what is currently broken in a platform. They are bad for strategy, because the median answer is confident and wrong.<\/p>\n<ul>\n<li><strong>r/PPC<\/strong> — genuinely useful for Google and Meta ads operational problems. Practitioners, real accounts, low tolerance for nonsense.<\/li>\n<li><strong>r/SEO and r/bigseo<\/strong> — mixed. Useful for \"is this a bug or is it me\" questions; ignore all strategic advice.<\/li>\n<li><strong>Google Ads and Search Central help communities<\/strong> — official-adjacent, occasionally staffed by Google product experts.<\/li>\n<li><strong>A local business or trade community in your actual market<\/strong> — worth more than all of the above combined if you intend to freelance or run your own thing. That is where the clients and the real problems are.<\/li>\n<li><strong>One paid community, maybe, later.<\/strong> Some are excellent. Most are a subscription to a Slack you will mute in three weeks. Do not join one until you have a specific recurring question the free ones cannot answer.<\/li>\n<\/ul>\n<hr />\n<h2>Skip these<\/h2>\n<p>Time sinks that feel productive.<\/p>\n<p><strong>\"Growth hacking\" content.<\/strong> Almost entirely tactics that worked once, on a platform loophole, for a company in a situation unlike yours, and were then written up as principles.<\/p>\n<p><strong>Marketing content about marketing content.<\/strong> The largest low-value category on the internet. If the case study is about a marketing agency growing a marketing agency, the audience is people who sell to marketers, and the mechanism will not transfer to your plumbing client.<\/p>\n<p><strong>Most YouTube ads tutorials.<\/strong> The good ones are indistinguishable from the bad ones until you have enough knowledge not to need them. The business model is course sales, and the accounts shown are chosen after the fact.<\/p>\n<p><strong>Anything promising a template that \"did 7 figures.\"<\/strong> Survivorship bias with a price tag.<\/p>\n<p><strong>Tool-comparison listicles.<\/strong> Affiliate content, without exception. Go to the tools' own free tiers and use them for an hour instead.<\/p>\n<p><strong>Conferences, at your stage.<\/strong> Expensive, and the talks are usually the speaker's content strategy delivered aloud. Go later, for the people, not the sessions.<\/p>\n<p><strong>Long-form \"state of marketing\" reports from software vendors.<\/strong> They are surveys of the vendor's own customers, framed to justify buying the vendor's product. Occasionally a useful statistic; never a useful conclusion.<\/p>\n<p><strong>Endless course-taking.<\/strong> The most seductive time sink of all, because it is indistinguishable from progress from the inside. After this course, the next 30 hours should be spent running something, not studying something. See <code>path-to-expert.md<\/code>.<\/p>\n<hr />\n<h2>The whole filter, in one line<\/h2>\n<p>Prefer primary sources, people who spent their own money, and anything with a denominator. Everything else is entertainment, and there is a great deal of it.<\/p>", "plan": {"curriculum": "<h1>The 30-Hour Curriculum<\/h1>\n<p>Three parts. 19 modules. 30 hours. Each module is sized in minutes so you can fit it into whatever time you actually have.<\/p>\n<p><strong>Suggested pace:<\/strong> 2 hours/week → done in 15 weeks. 5 hours/week → done in 6 weeks. Do not do more than ~2.5 hours in one sitting; retention collapses after that.<\/p>\n<hr />\n<h2>PART 1 — FOUNDATIONS (8 hours)<\/h2>\n<p>The part that does not expire. Channels change every 18 months; this does not.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Module<\/th>\n<th>Time<\/th>\n<th>You will be able to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M01<\/td>\n<td><em>What marketing actually is<\/em><\/td>\n<td>60m<\/td>\n<td>Define marketing correctly, distinguish demand capture from demand creation<\/td>\n<\/tr>\n<tr>\n<td>M02<\/td>\n<td><em>Customers: segments, ICP, jobs-to-be-done<\/em><\/td>\n<td>90m<\/td>\n<td>Build an ICP, run 5 customer interviews, find a real buying trigger<\/td>\n<\/tr>\n<tr>\n<td>M03<\/td>\n<td><em>Positioning, brand, messaging<\/em><\/td>\n<td>90m<\/td>\n<td>Write a positioning statement and a message hierarchy that survives contact with a customer<\/td>\n<\/tr>\n<tr>\n<td>M04<\/td>\n<td><em>Product, price, place — the offer<\/em><\/td>\n<td>60m<\/td>\n<td>Set a price with a rationale, understand why distribution beats promotion<\/td>\n<\/tr>\n<tr>\n<td>M05<\/td>\n<td><em>Funnels, journeys, and unit economics<\/em><\/td>\n<td>90m<\/td>\n<td>Model a funnel, compute CAC, LTV, payback — and know when a channel is unaffordable<\/td>\n<\/tr>\n<tr>\n<td>M06<\/td>\n<td><em>Writing a marketing strategy<\/em><\/td>\n<td>90m<\/td>\n<td>Produce a one-page strategy that a CEO would sign<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>PART 2 — DIGITAL CORE (14 hours)<\/h2>\n<p>The channels. This is where your money and hours go.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Module<\/th>\n<th>Time<\/th>\n<th>You will be able to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M07<\/td>\n<td><em>The digital ecosystem, websites &amp; CRO<\/em><\/td>\n<td>120m<\/td>\n<td>Audit a landing page, fix the top conversion killers, structure a site for conversion<\/td>\n<\/tr>\n<tr>\n<td>M08<\/td>\n<td><em>SEO and AI search (GEO/AEO)<\/em><\/td>\n<td>150m<\/td>\n<td>Do keyword research, fix technical basics, and optimize for AI answers — not just blue links<\/td>\n<\/tr>\n<tr>\n<td>M09<\/td>\n<td><em>Content marketing and organic social<\/em><\/td>\n<td>120m<\/td>\n<td>Build a content engine that produces demand, not just traffic<\/td>\n<\/tr>\n<tr>\n<td>M10<\/td>\n<td><em>Paid search — Google Ads<\/em><\/td>\n<td>120m<\/td>\n<td>Structure, launch, and diagnose a search campaign; avoid the classic money pits<\/td>\n<\/tr>\n<tr>\n<td>M11<\/td>\n<td><em>Paid social and creative<\/em><\/td>\n<td>120m<\/td>\n<td>Brief and judge ad creative, run Meta campaigns in the AI-targeting era<\/td>\n<\/tr>\n<tr>\n<td>M12<\/td>\n<td><em>Email and lifecycle marketing<\/em><\/td>\n<td>90m<\/td>\n<td>Build the 5 automated flows that make most of the money<\/td>\n<\/tr>\n<tr>\n<td>M13<\/td>\n<td><em>Analytics and measurement<\/em><\/td>\n<td>120m<\/td>\n<td>Set up tracking, use UTMs, read GA4, and stop trusting attribution blindly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>PART 3 — EXPERT LAYER (8 hours)<\/h2>\n<p>What separates a junior who runs campaigns from a senior who allocates budget.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Module<\/th>\n<th>Time<\/th>\n<th>You will be able to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M14<\/td>\n<td><em>Experimentation and testing<\/em><\/td>\n<td>90m<\/td>\n<td>Design an A/B test that will not lie to you; know when you lack the traffic to test<\/td>\n<\/tr>\n<tr>\n<td>M15<\/td>\n<td><em>Budgets, media mix, incrementality<\/em><\/td>\n<td>90m<\/td>\n<td>Allocate a budget across channels and prove what is actually incremental<\/td>\n<\/tr>\n<tr>\n<td>M16<\/td>\n<td><em>B2B vs B2C, and sales alignment<\/em><\/td>\n<td>60m<\/td>\n<td>Adapt everything above to long sales cycles, buying committees, and pipeline targets<\/td>\n<\/tr>\n<tr>\n<td>M17<\/td>\n<td><em>Retention, growth loops, and LTV<\/em><\/td>\n<td>60m<\/td>\n<td>Find growth that compounds instead of growth you rent from ad platforms<\/td>\n<\/tr>\n<tr>\n<td>M18<\/td>\n<td><em>The AI-native marketing stack<\/em><\/td>\n<td>60m<\/td>\n<td>Use AI where it creates leverage and avoid where it destroys brand value<\/td>\n<\/tr>\n<tr>\n<td>M19<\/td>\n<td><em>Capstone: a complete go-to-market plan<\/em><\/td>\n<td>120m<\/td>\n<td>Produce the artifact you show people to prove you can do this<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Time summary<\/h2>\n<table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Hours<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Foundations<\/td>\n<td>8.0<\/td>\n<\/tr>\n<tr>\n<td>Digital core<\/td>\n<td>14.0<\/td>\n<\/tr>\n<tr>\n<td>Expert layer<\/td>\n<td>8.0<\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td><strong>30.0<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>If you have less than 30 hours<\/h2>\n<p><strong>The 10-hour emergency version<\/strong> (real literacy, no execution skill): M01, M02, M03, M05, M07, M08 (skim), M10, M13, M15.<\/p>\n<p><strong>The 15-hour operator version<\/strong> (you need to run something next month): all of Part 1 except M04, plus M07, M08, M10 or M11 (pick the one matching your business), M12, M13.<\/p>\n<p>Do not skip <strong>M05 (unit economics)<\/strong> or <strong>M13 (measurement)<\/strong> under any circumstances. Marketers who cannot do arithmetic are the ones who get fired.<\/p>", "how": "<h1>How to study this without wasting your 30 hours<\/h1>\n<p>Ten minutes here protects the other 29 hours and 50 minutes.<\/p>\n<h2>1. Pick your one business now<\/h2>\n<p>Every exercise applies to a single real business. Choose one and write it at the top of your notes file. Good choices:<\/p>\n<ul>\n<li>A business idea you actually have<\/li>\n<li>Your employer<\/li>\n<li>A local business you know well (the gym you go to, a friend's restaurant)<\/li>\n<\/ul>\n<p>Bad choice: \"a generic SaaS company.\" Abstraction is where learning goes to die.<\/p>\n<h2>2. The 3-pass method per module<\/h2>\n<p>For each module, in one sitting:<\/p>\n<ol>\n<li><strong>Read<\/strong> the module straight through without stopping (about a third of the module's time budget).<\/li>\n<li><strong>Do the exercise<\/strong> for your chosen business (about half). This is the part that creates skill. Reading without doing produces the illusion of competence — you will feel like you understand marketing and be unable to do any.<\/li>\n<li><strong>Write 5 lines from memory<\/strong> into your notes, no peeking (the rest). What were the key ideas? Retrieval practice is roughly twice as effective per minute as re-reading.<\/li>\n<\/ol>\n<h2>3. Rules that matter<\/h2>\n<p><strong>Never read two modules in a row without doing the exercise.<\/strong> The single biggest failure mode for self-taught marketers is consuming content and building nothing.<\/p>\n<p><strong>Timebox hard.<\/strong> If a module says 90 minutes, set a timer. Stop at 90 even if unfinished; note where you stopped. Perfectionism is how a 30-hour plan becomes a 200-hour plan you abandon at hour 40.<\/p>\n<p><strong>Keep one notes file.<\/strong> <code>my-notes.md<\/code> in this folder. One file, appended forever. Not per-module files you never reopen.<\/p>\n<p><strong>Spaced repetition, cheap version.<\/strong> At the start of each session, spend 3 minutes writing down what you remember from the <em>previous<\/em> session before opening anything. Painful, and it is most of why this will stick.<\/p>\n<h2>4. What to do when you disagree or don't understand<\/h2>\n<p>Marketing has more confidently-stated nonsense per square metre than almost any other field, because results are slow and attribution is murky, so bad ideas survive. When something in here feels wrong, write down why. Test it against your chosen business. Some of it <em>is<\/em> wrong for your context — the goal is judgment, not obedience.<\/p>\n<h2>5. Progress tracking<\/h2>\n<p>Open <code>progress-tracker.xlsx<\/code> and mark each module done with the date and a one-line takeaway. Seeing 19 rows fill in is a real motivator, and the takeaway column becomes your personal cheat sheet.<\/p>\n<h2>6. The failure mode to watch for<\/h2>\n<p>Around hour 8–12, once you know the vocabulary, you will feel much more competent than you are. This is the standard curve. The cure is Part 3 and the capstone, which will humble you productively. Push through it — this is where most self-learners stop and stay permanently mediocre.<\/p>", "expert": "<h1>Path to Expert — Hours 30 to 500<\/h1>\n<p>You finished the course. You now have literacy: you can follow any marketing conversation, spot most nonsense, and do the arithmetic that decides whether a channel is affordable. That is genuinely valuable and it is roughly what a good junior marketer knows on their first day.<\/p>\n<p>It is not expertise. This document is the honest version of what the next 470 hours look like.<\/p>\n<hr />\n<h2>Why expertise requires reps with real money<\/h2>\n<p>Marketing knowledge is cheap and marketing judgment is expensive, and the only known way to convert the first into the second is to make decisions that have consequences.<\/p>\n<p>Here is the specific reason. Every marketing decision is made under uncertainty, with incomplete data, against a competitor who is also moving. What you are building is a calibrated sense of <em>what usually happens<\/em> — how much a headline change typically moves a conversion rate, how long a Meta campaign really needs before its numbers mean anything, how often a promising channel quietly fails, what a lead that will never close looks like at day three. None of that is in a book, because it is distributional knowledge. It comes from having watched forty outcomes, most of them disappointing.<\/p>\n<p>Real money matters because it changes what you notice. When it is a case study you skim the losses. When it is 400 euros of your own you will remember, five years later, exactly which ad set spent it and why you let it. Consequence is what makes attention involuntary, and involuntary attention is what makes learning stick.<\/p>\n<p>The uncomfortable corollary: <strong>you cannot get good at this by reading more.<\/strong> After this course, more study has sharply diminishing returns and, worse, feels exactly like progress. If in three months you have read four more books and run nothing, you will know more and be able to do less than someone who read nothing and spent 300 euros badly.<\/p>\n<p>Budget for that. A few hundred euros spent learning what does not work is the cheapest professional education available in any field.<\/p>\n<hr />\n<h2>The four fastest paths to reps<\/h2>\n<p>Ranked by how quickly they produce real consequence, not by how comfortable they are. You will probably do two of them at once.<\/p>\n<h3>1. Run marketing for your own small project with a real budget<\/h3>\n<p><strong>What it is:<\/strong> anything you can actually sell — a service you can deliver, a small product, a niche information product, a local service business, even reselling something. It does not need to be a good business. It needs to be a real one, where a stranger gives you money.<\/p>\n<p><strong>Budget:<\/strong> 300-600 euros of media spend over three months. Enough to leave a learning phase and see real variance; small enough that losing it teaches rather than hurts.<\/p>\n<p><strong>Why it is first:<\/strong> it is the only path where you control every variable — offer, price, page, channel, creative — so you get to feel the difference between a marketing problem and an offer problem. That distinction is most of senior marketing judgment and it is nearly impossible to learn as an employee, because someone else owns the offer.<\/p>\n<p><strong>The trap:<\/strong> picking a project so small or so hypothetical that no decision has stakes. If nobody can buy it today, it is a hobby.<\/p>\n<h3>2. Free or cheap work for a local business, with a hard scope<\/h3>\n<p><strong>What it is:<\/strong> find a business you can walk to. A dentist, a gym, a trades firm, a restaurant, a driving school. Offer one specific thing, free or for 200-300 euros, with a written scope and an end date.<\/p>\n<p><strong>Why it works:<\/strong> you get a real budget that is not yours, a real client with real expectations, a category you know nothing about (which forces research), and — crucially — a result you can talk about in an interview. You also learn the part nobody teaches: managing a non-marketer's expectations, which is 40% of the job forever.<\/p>\n<p><strong>Scope it like this, in writing:<\/strong> \"Over four weeks I will audit your Google Ads account and rebuild the campaign structure. You will get a written audit, a rebuilt account, and a one-page monthly report. I will not manage it after 30 November. Success is cost per lead below X.\" Both of you sign it. Use <code>campaign-brief.md<\/code> and <code>monthly-report.md<\/code> as the deliverables.<\/p>\n<p><strong>The trap:<\/strong> unbounded free work. Without an end date it becomes an unpaid job you cannot leave, and the resentment on both sides destroys the reference you were doing it for. Also refuse anything you cannot measure — a business with no tracking and no phone-call attribution will judge you on vibes.<\/p>\n<h3>3. Take an in-house junior or associate role<\/h3>\n<p><strong>What it is:<\/strong> marketing associate, growth associate, performance marketing executive, marketing coordinator. In-house, not agency, for a first role if you can choose.<\/p>\n<p><strong>Why it is the highest-quality reps available:<\/strong> you get someone else's budget, a colleague who has done it before, exposure to the full loop from spend to revenue, and repetition over months. Agencies teach channel craft faster but insulate you from the offer, the price, the product, and the P&amp;L, which are where the important lessons live.<\/p>\n<p><strong>Realistic timeline:<\/strong> with this course, a self-run project, and one local client, you are a credible junior candidate. Expect the search to take 2-4 months and expect the portfolio (below) to matter more than the certifications.<\/p>\n<p><strong>The trap:<\/strong> waiting until you feel ready. Nobody feels ready. The bar for a junior role is: can do the arithmetic, can write clearly, has actually touched an ad account, is not going to lie about numbers. You will clear that bar before you believe you have.<\/p>\n<h3>4. Freelance small, scoped projects<\/h3>\n<p><strong>What it is:<\/strong> fixed-scope, fixed-price work with a clear deliverable. Not \"manage my marketing.\"<\/p>\n<p><strong>Projects that sell well at the start, roughly in order of how easy they are to close:<\/strong><\/p>\n<ul>\n<li>Landing page audit with prioritised fixes — 200-400 euros, 4-6 hours. Use <code>landing-page-audit.md<\/code> verbatim.<\/li>\n<li>Google Ads account audit — 300-500 euros. Wasted spend is easy to find in a neglected account and easy to show.<\/li>\n<li>Google Ads rebuild — 600-1,200 euros. The classic first real project.<\/li>\n<li>GA4 and conversion tracking setup, verified end to end — 300-600 euros. Unsexy, in constant demand, and almost every small business has it broken.<\/li>\n<li>Email flow build (welcome, abandoned cart, win-back) — 500-1,000 euros.<\/li>\n<\/ul>\n<p><strong>Why it works:<\/strong> fixed scope means you can price it before you understand the client's business, which is the only way to survive early freelancing. It also means you finish, which is what generates a testimonial.<\/p>\n<p><strong>The trap:<\/strong> retainers too early. A 500-euro/month retainer with an undefined scope is how freelancers end up working 30 hours for 500 euros and quitting the field. Sell projects until you know how long things take you.<\/p>\n<hr />\n<h2>A concrete six-month plan<\/h2>\n<p>Assumes 6-8 hours a week. Starting September 2026. Adjust the dates, keep the sequence.<\/p>\n<h3>Month 1 — September 2026: build the thing you will market<\/h3>\n<p>Pick the project. Something sellable in four weeks, not four months.<\/p>\n<ul>\n<li>Fill <code>business-brief.md<\/code>, <code>icp-and-jtbd.md<\/code> (with five real interviews — actual humans, not friends), <code>positioning-statement.md<\/code>.<\/li>\n<li>Build a one-page site with a real offer and a working payment or booking method.<\/li>\n<li>Set up GA4, Search Console, Clarity, and Tag Manager. Fire a test conversion and confirm you can see it in all the places it should appear.<\/li>\n<li>Fill <code>unit-economics-model.md<\/code>. Compute your max affordable CPA before you spend anything.<\/li>\n<\/ul>\n<p><strong>Milestone:<\/strong> a stranger could buy from you today, and you know the most you can afford to pay to acquire them.<\/p>\n<h3>Month 2 — October 2026: spend money badly<\/h3>\n<p>Launch one channel. One. Google Ads if you have demand to capture, Meta if you need to create it.<\/p>\n<ul>\n<li>Fill <code>campaign-brief.md<\/code>, including the success and kill criteria, before launching.<\/li>\n<li>Spend 150-250 euros. Respect a 10-day do-not-touch window.<\/li>\n<li>Write a <code>monthly-report.md<\/code> at the end of the month, to yourself, honestly.<\/li>\n<\/ul>\n<p><strong>Milestone:<\/strong> you have spent real money, and you can say in one sentence why it did or did not work. Most likely outcome: it did not work, the traffic was fine, and the page or the offer was the problem. That is the lesson.<\/p>\n<h3>Month 3 — November 2026: fix the funnel, get the first client<\/h3>\n<ul>\n<li>Run <code>landing-page-audit.md<\/code> on your own page. Ship the top three fixes. Re-measure.<\/li>\n<li>If you have the traffic, run one test with <code>ab-test-plan.md<\/code>. If you do not — the likely case — document that you calculated the sample size and correctly decided not to test. That decision is portfolio material in itself.<\/li>\n<li>Approach five local businesses with the scoped offer from path 2. Expect four to say nothing.<\/li>\n<\/ul>\n<p><strong>Milestone:<\/strong> one unpaid or cheap client with a signed one-paragraph scope, and a measurable improvement on your own funnel.<\/p>\n<h3>Month 4 — December 2026: deliver for someone else, and publish<\/h3>\n<ul>\n<li>Deliver the client work. Produce a written audit and a monthly report they can act on.<\/li>\n<li>Publish your first teardown or write-up: your own project's numbers, including what failed. Real numbers with denominators.<\/li>\n<li>Choose a specialisation (see below). Provisionally. You can change it.<\/li>\n<\/ul>\n<p><strong>Milestone:<\/strong> one delivered client project and one public piece of work with your name on it.<\/p>\n<h3>Month 5 — January 2027: go deep on the specialisation<\/h3>\n<ul>\n<li>20 focused hours on the chosen specialisation — the platform's own documentation first, then practitioners.<\/li>\n<li>Take the relevant free certification for the tour of the interface.<\/li>\n<li>Second client, this one paid. Price it at whatever feels slightly uncomfortable.<\/li>\n<li>Build the portfolio page (see below): three pieces of work, results stated honestly.<\/li>\n<\/ul>\n<p><strong>Milestone:<\/strong> a portfolio you would send to a stranger, and one paid invoice.<\/p>\n<h3>Month 6 — February 2027: decide the route<\/h3>\n<ul>\n<li>If job: apply to 20 junior roles with the portfolio, not the certifications, as the lead.<\/li>\n<li>If freelance: raise prices, ask both clients for a referral and a written testimonial, define your one repeatable offer.<\/li>\n<li>If own business: decide whether the project has legs, using <code>unit-economics-model.md<\/code>. Killing it is a legitimate and informative outcome.<\/li>\n<li>Write down what you now believe that you did not believe in September. Keep the list.<\/li>\n<\/ul>\n<p><strong>Milestone:<\/strong> roughly 150-200 hours in, one paid client, one live channel you have run for months, and a written record of your own reasoning improving.<\/p>\n<p><strong>Hours 200 to 500<\/strong> are the same loop, larger: bigger budgets, longer time horizons, more channels, and the shift from executing campaigns to allocating money between them. There is no shortcut and there is no separate curriculum for it. The loop is the curriculum.<\/p>\n<hr />\n<h2>The specialisation decision<\/h2>\n<p>Generalists are useful in small companies and freelancing; specialists get hired faster and paid more. Around month 4 you should pick one and be a competent generalist around it. Here is the honest description of each.<\/p>\n<h3>Paid media (Google Ads, Meta, and the rest)<\/h3>\n<p><strong>Day to day:<\/strong> monitoring spend and performance, building and restructuring campaigns, briefing and judging creative, writing and reading reports, arguing about attribution, managing budgets across accounts. Fast feedback, visible numbers, and constant platform change.<\/p>\n<p><strong>Who it suits:<\/strong> people who like arithmetic, tolerate ambiguity, and are comfortable being accountable for a number every week. It is the most measurable and therefore the most exposed job in marketing.<\/p>\n<p><strong>Demand in 2026:<\/strong> high and stable, but the nature of the work has changed. Automation took the manual optimisation — the bid tweaking that used to be the craft — and left creative strategy, offer design, measurement, and feeding the algorithm good data. Junior roles that were \"manage the keywords\" are shrinking; roles that are \"decide what we say and to whom, and prove it worked\" are not. Learn the strategy layer or the automation will do your job.<\/p>\n<h3>SEO and AEO/GEO<\/h3>\n<p><strong>Day to day:<\/strong> keyword and query research, technical audits, content briefs, internal linking, chasing links, and now checking what AI assistants say about your category and why. Long feedback loops — months, not days.<\/p>\n<p><strong>Who it suits:<\/strong> patient, systematic people who like puzzles and can defend work whose results arrive two quarters later.<\/p>\n<p><strong>Demand in 2026:<\/strong> genuinely unsettled, and be honest with yourself about that. Zero-click searches are around 60% and AI Overviews cut top-result click-through by more than half, so a large part of classic SEO — publish, rank, get traffic — has structurally shrunk. What is growing is the adjacent job: being the source that gets cited, building entity and brand recognition, and the technical work that makes a site legible to machines. If you enter SEO now, enter it as AEO/GEO with strong technical fundamentals. Do not enter it as a content-volume play; that market is being competed to zero.<\/p>\n<h3>Lifecycle and email<\/h3>\n<p><strong>Day to day:<\/strong> building automated flows, segmenting, writing campaigns, deliverability work (SPF, DKIM, DMARC, list hygiene), and analysing cohorts and retention.<\/p>\n<p><strong>Who it suits:<\/strong> people who like systems that compound and are happy to own an unglamorous channel that quietly makes a large share of the revenue.<\/p>\n<p><strong>Demand in 2026:<\/strong> steady and underrated. Because email is owned rather than rented, it became more valuable as tracking degraded and platform costs rose. Fewer people specialise in it than in paid media, so the ratio of demand to supply is favourable. Ecommerce and subscription businesses hire for this constantly. It is the most reliable specialisation for a freelancer who wants recurring work with a clear deliverable.<\/p>\n<h3>Content<\/h3>\n<p><strong>Day to day:<\/strong> research, interviewing internal experts, briefing and editing, publishing, distributing, and measuring things that take months to show up.<\/p>\n<p><strong>Who it suits:<\/strong> people who can write clearly and, more importantly, can decide what is worth saying. Writing is now the cheap part.<\/p>\n<p><strong>Demand in 2026:<\/strong> bifurcated, sharply. Demand for competent general content collapsed — generation costs went to nearly zero and so did the value of the output. Demand for content with an unfair advantage behind it (proprietary data, real practitioner expertise, genuine access, original research) is strong and rising, because it is now the only kind that gets read, linked, or cited. If you cannot bring an asset that a model cannot generate, this is a difficult market to enter. If you can, it is a good one.<\/p>\n<h3>Product marketing<\/h3>\n<p><strong>Day to day:<\/strong> positioning, messaging, launches, competitive research, sales enablement, pricing input, and a great deal of internal coordination. Closer to product and sales than to channels.<\/p>\n<p><strong>Who it suits:<\/strong> people who like talking to customers, synthesising messy input into a clear position, and influencing without authority. Requires more organisational patience than any other specialisation.<\/p>\n<p><strong>Demand in 2026:<\/strong> solid in B2B software, thin elsewhere, and rarely a first job. Most product marketers arrive from an adjacent role or from the industry itself. A realistic target for year two or three rather than month six — but the skills are exactly the Part 1 foundations of this course, so build toward it deliberately if it appeals.<\/p>\n<h3>Growth analytics<\/h3>\n<p><strong>Day to day:<\/strong> instrumenting tracking, building dashboards, designing experiments and holdouts, measuring incrementality, sometimes MMM, and telling people that their favourite channel is not working.<\/p>\n<p><strong>Who it suits:<\/strong> people comfortable with numbers, SQL, and being the person who delivers unwelcome findings. Requires more technical skill than the others — expect to learn SQL properly and probably some Python.<\/p>\n<p><strong>Demand in 2026:<\/strong> high and rising, with the least competition, precisely because most marketers avoid the technical part. Signal loss made honest measurement hard, which made people who can do it valuable. It is the specialisation with the clearest path to senior decision-making roles, because the person who can prove what is incremental ends up being the person who allocates the budget.<\/p>\n<p><strong>How to actually choose:<\/strong> pick the one where you would happily read the documentation on a Sunday. All six are viable. The wrong choice made in month 4 and corrected in month 10 costs you very little; not choosing at all costs you a year.<\/p>\n<hr />\n<h2>Building a portfolio without clients<\/h2>\n<p>You do not need permission to do marketing work. Four formats, in ascending order of effort and value.<\/p>\n<p><strong>1. Teardowns.<\/strong> Pick a real company's funnel — ad, landing page, email flow — and analyse it publicly using <code>landing-page-audit.md<\/code>. State what you would change, why, and what you would expect to happen. Two hours each. Do ten and the pattern-recognition alone is worth the time. Be constructive; do not build a reputation on dunking on small businesses.<\/p>\n<p><strong>2. Audits of real accounts.<\/strong> Offer free audits to five local businesses. Even if none becomes a client, you have seen inside five real accounts, which is five more than most junior candidates. Anonymise before publishing, always, and ask first.<\/p>\n<p><strong>3. Spec campaigns.<\/strong> Take a real brand and build the full artefact: brief, audience, positioning, creative angles, media plan, budget, success criteria. Say explicitly that it is speculative. It demonstrates thinking, which is exactly what the interview is testing.<\/p>\n<p><strong>4. Publish your own results.<\/strong> The strongest of the four, by a distance. Your own project, with real numbers: spend, CAC, conversion rate, what you predicted, what happened, what you got wrong. Small numbers are fine. \"I spent 340 euros, acquired 6 customers at 57 euros CAC, and here is why my first two weeks were wasted\" is more persuasive than any certification, because almost nobody publishes their own failures and everyone recognises that as credibility.<\/p>\n<p><strong>Package it as:<\/strong> one page, three to five pieces of work, each with the situation, what you did, what happened, and what you would do differently. Honest numbers. No case study that hides its denominator. Link it from your CV and your LinkedIn, and lead with it in applications.<\/p>\n<hr />\n<h2>How to keep learning without drowning<\/h2>\n<p>The failure mode from here is not laziness. It is consumption: subscribing to fifteen newsletters, taking six more courses, and mistaking the feeling of learning for the thing itself.<\/p>\n<p><strong>A small number of primary sources.<\/strong> Four maximum, and mostly first-party: the platform documentation for whatever you run, one strategist who argues from evidence, one filter for news in your specialisation. Cancel anything you skim three times in a row. See <code>reference/resources.md<\/code>.<\/p>\n<p><strong>One experiment a month.<\/strong> Not one test — one <em>experiment<\/em>, meaning a question you genuinely do not know the answer to, run on something real, with the answer written down before and after. Twelve a year. In three years that is thirty-six things you know from your own evidence rather than from a blog post, and that body of personal evidence is what expertise feels like from the inside.<\/p>\n<p><strong>A written test log.<\/strong> One row per experiment: date, what you predicted, what you did, what happened, what you now believe. Keep it forever. It does three jobs: it stops you from re-learning the same lesson, it makes you calibrate your predictions against reality, and it is the single most convincing document you can put in front of a hiring manager or a client. The log in <code>templates/ab-test-plan.md<\/code> is the format. Start it in month 2 and never stop.<\/p>\n<p><strong>A rule for new tactics.<\/strong> When something new appears — a platform, a format, an AI tool — do not learn it because it is new. Wait until you have a problem it solves, then learn it in the context of that problem. You will learn it faster and you will skip the majority that disappear within a year.<\/p>\n<hr />\n<h2>How to know when you are actually good<\/h2>\n<p>There are only two tests, and neither of them is a title or a certificate.<\/p>\n<p><strong>One: you can predict outcomes before you run the campaign.<\/strong><\/p>\n<p>Before launching, write down what you expect: the CPC, the conversion rate, the cost per lead, the close rate, the number of customers. Seal it. Compare afterwards. Early on you will be wrong by multiples. Over time your ranges tighten. When you are consistently inside a factor of about 1.5 on a channel and market you know, you have real judgment — because being able to predict a system means you have a working model of it, and a working model is exactly what expertise is.<\/p>\n<p>This is also the most valuable thing you can do in an interview or a pitch: state what you expect to happen, in numbers, before anyone asks. Almost nobody does it, and it is instantly recognisable as competence.<\/p>\n<p><strong>Two: you can say no to work that will not succeed.<\/strong><\/p>\n<p>The clearest marker of a good marketer is turning down a project because the offer is wrong, the unit economics do not permit paid acquisition, the expectations are impossible, or the client wants leads for a product nobody wants. Juniors take the work and hope. Seniors run the arithmetic, say \"this will not work, and here is what would have to change first,\" and walk away from money.<\/p>\n<p>It requires knowing enough to be sure, and having enough options to afford it. When you find yourself doing it for the first time — declining a paying client because you can show, on one page, that the maths does not work — you are past the point where this document is useful to you.<\/p>\n<hr />\n<h2>The short version<\/h2>\n<p>Read less than you think. Spend a few hundred euros of your own money on something real. Write down what you expect before you spend it. Keep a log of what happened. Publish the failures. Pick one specialisation by month four. Get someone else's budget in your hands as fast as possible, because consequence is the only teacher that works.<\/p>\n<p>Thirty hours made you literate. The next four hundred and seventy are reps, and there is no version of this where you skip them.<\/p>"}}};
</script>
<script>
/* ============================ state ============================ */
const KEY = "mm_course_v1";
const DAY = 86400000;
const todayNum = () => Math.floor(Date.now() / DAY);
const BRIDGE_DEFAULT = { url: "http://127.0.0.1:8787", key: "", model: "claude-sonnet-5", route: "direct", mode: "none" };
const blank = () => ({
  progress: {}, cards: {}, notes: {}, marks: {}, convos: {}, active: {}, biz: "",
  bridge: Object.assign({}, BRIDGE_DEFAULT),
  streak: { days: 0, last: null, seen: [] },
  theme: null, v: 1
});
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    return Object.assign(blank(), JSON.parse(raw));
  } catch (e) { return blank(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
function P(id) {
  if (!S.progress[id]) S.progress[id] = { secs: {}, predict: "", quiz: null, elab: {}, transfer: null, done: false, doneAt: null, time: 0, step: 0 };
  return S.progress[id];
}
function markDay() {
  const t = todayNum();
  if (S.streak.last === t) return;
  S.streak.days = (S.streak.last === t - 1) ? S.streak.days + 1 : 1;
  S.streak.last = t;
  if (!S.streak.seen.includes(t)) S.streak.seen.push(t);
  S.streak.seen = S.streak.seen.slice(-120);
  save();
}

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MODS = DATA.modules;
const byId = id => MODS.find(m => m.id === id);
const mIndex = id => MODS.findIndex(m => m.id === id);

function secTotal(m) { return m.sections.length; }
function secDone(m) { const p = P(m.id); return m.sections.filter((_, i) => p.secs[i]).length; }
function modPct(m) {
  const p = P(m.id);
  let n = 0, d = 5;
  n += secDone(m) / secTotal(m);
  if (p.predict.trim()) n++;
  if (p.quiz && p.quiz.finished) n++;
  if (Object.values(p.elab).some(v => (v || "").trim())) n++;
  if (p.transfer && p.transfer.score != null) n++;
  return Math.min(1, n / d);
}
function isDone(m) { return P(m.id).done; }
function doneCount() { return MODS.filter(isDone).length; }
function minutesDone() { return MODS.filter(isDone).reduce((a, m) => a + m.minutes, 0); }
function timeSpent() { return MODS.reduce((a, m) => a + (P(m.id).time || 0), 0); }

function quizStats() {
  let right = 0, total = 0;
  const conf = { 1: [0, 0], 2: [0, 0], 3: [0, 0] };
  MODS.forEach(m => {
    const q = P(m.id).quiz;
    if (!q || !q.a) return;
    q.a.forEach(x => {
      if (!x) return;
      total++; if (x.ok) right++;
      const c = conf[x.conf] || conf[2];
      c[1]++; if (x.ok) c[0]++;
    });
  });
  return { right, total, pct: total ? right / total : 0, conf };
}
function cardKey(mid, i) { return mid + ":" + i; }
function dueCards() {
  const t = todayNum(), out = [];
  MODS.forEach(m => {
    (m.assess.cards || []).forEach((c, i) => {
      const k = cardKey(m.id, i), st = S.cards[k];
      if (!st) return;
      if (st.due <= t) out.push({ k, mid: m.id, mtitle: m.title, c, st });
    });
  });
  return out;
}
function cardCount() { return Object.keys(S.cards).length; }
function seedCards(mid) {
  const m = byId(mid); let added = 0;
  (m.assess.cards || []).forEach((c, i) => {
    const k = cardKey(mid, i);
    if (!S.cards[k]) { S.cards[k] = { due: todayNum(), ease: 2.4, ivl: 0, reps: 0, lapses: 0 }; added++; }
  });
  save(); return added;
}
function grade(k, g) {
  const st = S.cards[k]; if (!st) return;
  if (g === 0) { st.ease = Math.max(1.3, st.ease - .2); st.ivl = 0; st.lapses++; st.due = todayNum(); }
  else if (g === 1) { st.ease = Math.max(1.3, st.ease - .15); st.ivl = st.ivl ? Math.max(1, Math.round(st.ivl * 1.2)) : 1; st.due = todayNum() + st.ivl; }
  else if (g === 2) { st.ivl = st.ivl === 0 ? 1 : (st.ivl === 1 ? 3 : Math.round(st.ivl * st.ease)); st.due = todayNum() + st.ivl; }
  else { st.ease = Math.min(2.8, st.ease + .12); st.ivl = st.ivl === 0 ? 3 : Math.round(st.ivl * st.ease * 1.25); st.due = todayNum() + st.ivl; }
  st.reps++; save();
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove("on"), 2100);
}
function fmtH(mins) { const h = mins / 60; return (h % 1 === 0 ? h : h.toFixed(1)) + "h"; }
function fmtClock(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

/* ============================ theme ============================ */
function applyTheme() {
  if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
function cycleTheme() {
  const cur = S.theme;
  S.theme = cur === null ? "light" : (cur === "light" ? "dark" : null);
  save(); applyTheme();
  toast("Theme: " + (S.theme || "system"));
}
applyTheme();

/* ============================ router ============================ */
let route = { v: "home", id: null, step: 0 };
function go(hash) { location.hash = hash; }
function parseHash() {
  const h = (location.hash || "#/home").slice(2).split("/");
  route = { v: h[0] || "home", id: h[1] || null, step: h[2] ? +h[2] : 0 };
}
window.addEventListener("hashchange", () => { parseHash(); render(); window.scrollTo(0, 0); });

/* ============================ sidebar ============================ */
const ICONS = {
  home: "◈", review: "↻", stats: "◔", library: "▤", plan: "✦"
};
function renderSidebar() {
  const pct = doneCount() / MODS.length;
  const due = dueCards().length;
  const R = 20, C = 2 * Math.PI * R;
  let h = `<div class="brand"><h1>Marketing Mastery</h1><p>30 hours · beginner to practitioner</p></div>
  <button class="ringwrap" onclick="go('#/stats')">
    <svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="4"/>
    <circle cx="23" cy="23" r="${R}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 23 23)"/></svg>
    <span class="ringtxt"><b>${doneCount()} of ${MODS.length} modules</b>${fmtH(minutesDone())} of 30h · ${Math.round(pct * 100)}%</span>
  </button>
  <div class="navsec">
    <button class="navlink ${route.v === "home" ? "active" : ""}" onclick="go('#/home')"><span class="ico">${ICONS.home}</span>Dashboard</button>
    <button class="navlink ${route.v === "review" ? "active" : ""}" onclick="go('#/review')"><span class="ico">${ICONS.review}</span>Review${due ? `<span class="pill">${due}</span>` : ""}</button>
    <button class="navlink ${route.v === "stats" ? "active" : ""}" onclick="go('#/stats')"><span class="ico">${ICONS.stats}</span>Progress &amp; stats</button>
    <button class="navlink ${route.v === "marks" ? "active" : ""}" onclick="go('#/marks')"><span class="ico">✎</span>Marks &amp; questions${openQs() ? `<span class="pill">${openQs()}</span>` : ""}</button>
    <button class="navlink ${route.v === "library" ? "active" : ""}" onclick="go('#/library')"><span class="ico">${ICONS.library}</span>Library</button>
  </div>`;
  DATA.parts.forEach(p => {
    const ms = MODS.filter(m => m.part === p.id);
    h += `<div class="partgroup"><div class="parthead"><span class="pn">${esc(p.name)}</span><span class="ph">${p.hours}h</span></div>`;
    ms.forEach(m => {
      const pc = modPct(m), dn = isDone(m);
      h += `<button class="mrow ${route.v === "m" && route.id === m.id ? "active" : ""}" onclick="go('#/m/${m.id}')">
        <span class="dot ${dn ? "done" : (pc > 0 ? "part" : "")}"></span>
        <span class="code">${m.id}</span><span class="t">${esc(m.short)}</span></button>`;
    });
    h += `</div>`;
  });
  h += `<div class="navsec" style="border-top:1px solid var(--line);margin-top:10px">
    <button class="navlink ${route.v === "settings" ? "active" : ""}" onclick="go('#/settings')"><span class="ico">⚙</span>Settings<span class="dotstat ${bridgeChecking ? "busy" : connMode() !== "none" ? "on" : ""}" style="margin-left:auto"></span></button>
    <button class="navlink" onclick="go('#/plan/curriculum')"><span class="ico">${ICONS.plan}</span>The plan</button>
    <button class="navlink" onclick="openData()"><span class="ico">⇅</span>Backup / restore</button>
  </div><div style="height:24px"></div>`;
  $("#sidebar").innerHTML = h;
  const rb = $("#reviewbtn");
  if (due) { rb.style.display = ""; rb.innerHTML = `↻ ${due} due`; rb.onclick = () => go("#/review"); }
  else rb.style.display = "none";
}

/* ============================ views ============================ */
function viewHome() {
  const done = doneCount(), due = dueCards().length, qs = quizStats();
  const next = MODS.find(m => !isDone(m)) || MODS[MODS.length - 1];
  const inprog = MODS.filter(m => !isDone(m) && modPct(m) > 0);
  const cont = inprog[0] || next;
  const weak = MODS.map(m => {
    const q = P(m.id).quiz;
    if (!q || !q.finished) return null;
    const t = q.a.filter(Boolean), r = t.filter(x => x.ok).length;
    return t.length ? { m, pct: r / t.length } : null;
  }).filter(x => x && x.pct < .7).sort((a, b) => a.pct - b.pct).slice(0, 3);

  let h = `<div class="wrap-wide">
  <p class="eyebrow">${greeting()}</p>
  <h2 class="big">${done === 0 ? "Start with Module 01." : done === MODS.length ? "You finished all 19 modules." : `You are ${Math.round(done / MODS.length * 100)}% through the course.`}</h2>
  <p class="sub" style="margin-bottom:22px">${S.biz ? "Working business: <b>" + esc(S.biz) + "</b>" : "Set your practice business below — every exercise applies to it."}</p>

  <div class="grid g4" style="margin-bottom:18px">
    <div class="stat"><div class="n">${done}<span style="font-size:15px;color:var(--muted)">/${MODS.length}</span></div><div class="l">modules complete</div></div>
    <div class="stat"><div class="n">${fmtH(minutesDone())}</div><div class="l">of 30h curriculum</div></div>
    <div class="stat"><div class="n">${qs.total ? Math.round(qs.pct * 100) + "%" : "—"}</div><div class="l">quiz accuracy (${qs.total} answered)</div></div>
    <div class="stat"><div class="n">${S.streak.days}</div><div class="l">day streak</div></div>
  </div>`;

  h += `<div class="grid g2" style="margin-bottom:18px">
    <div class="card">
      <p class="eyebrow">${inprog.length ? "Continue" : "Next up"}</p>
      <h3 style="font-family:var(--serif);font-size:22px;margin:0 0 6px;font-weight:600">${cont.id} · ${esc(cont.title)}</h3>
      <p class="sub" style="margin-bottom:14px">${cont.minutes} minutes · ${esc(partName(cont.part))}</p>
      <div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(modPct(cont) * 100)}%"></i></div>
      <button class="btn primary" onclick="go('#/m/${cont.id}')">${modPct(cont) > 0 ? "Resume" : "Begin"} →</button>
    </div>
    <div class="card">
      <p class="eyebrow">Retrieval practice</p>
      <h3 style="font-family:var(--serif);font-size:22px;margin:0 0 6px;font-weight:600">${due ? due + " card" + (due > 1 ? "s" : "") + " due today" : cardCount() ? "Nothing due today" : "No cards yet"}</h3>

/* ---------- module ---------- */

function viewModule() {

function stepDone(m, i) {

  if (i === 2) return !!(p.quiz && p.quiz.finished);

}

function jump(e, i) { e.preventDefault(); document.getElementById("sec" + i).scrollIntoView({ behavior: "smooth", block: "start" }); }
function setupToc() {
  const links = [...document.querySelectorAll("#toc a")];
  const secs = [...document.querySelectorAll(".sec")];
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(ents => {
    ents.forEach(en => {
      if (en.isIntersecting) {
        const i = secs.indexOf(en.target);
        links.forEach((l, j) => l.classList.toggle("on", j === i));
        if (i >= 0) setCurSec(i);
      }
    });
  }, { rootMargin: "-80px 0px -70% 0px" });
  secs.forEach(s => io.observe(s));
}
function savePredict(id) { P(id).predict = $("#predin").value; save(); go("#/m/" + id + "/1"); }
function saveNote(id) { S.notes[id] = $("#noteIn").value; save(); toast("Notes saved"); go("#/m/" + id + "/2"); }
function saveElab(id) {
  const p = P(id);
  document.querySelectorAll("[data-el]").forEach(t => p.elab[t.dataset.el] = t.value);
  save(); toast("Saved"); go("#/m/" + id + "/4");
}
function saveTransfer(id, score) {

  p.transfer = Object.assign({}, p.transfer, { answer: ta ? ta.value : (p.transfer || {}).answer || "" });
  if (score != null) p.transfer.score = score;

}
function revealModel(id) {

  p.transfer = Object.assign({}, p.transfer, { answer: ta.value, revealed: true }); save();

function tickSec(id, i) {

}
function allSecs(id, on) {

/* ---------- quiz ---------- */
function renderQuiz(m) {
  const p = P(m.id);
  if (!p.quiz) p.quiz = { i: 0, a: [], finished: false };
  const q = p.quiz, b = $("#stepbody");
  if (q.finished) return quizResults(m);
  const item = m.assess.quiz[q.i];
  const state = q.a[q.i];
  let h = `<div class="card">
    <div class="qmeta"><span>Question ${q.i + 1} of ${m.assess.quiz.length}</span>
      <span class="bar"><i style="width:${Math.round(q.i / m.assess.quiz.length * 100)}%"></i></span>
      <span style="margin-left:auto">${q.a.filter(x => x && x.ok).length} correct so far</span></div>
    <h3 style="font-family:var(--serif);font-size:21px;line-height:1.35;font-weight:600;margin:0 0 16px">${esc(item.q)}</h3>`;
  item.options.forEach((o, i) => {
    let cls = "";
    if (state && state.answered) {
      if (i === item.answer) cls = "right";
      else if (i === state.pick) cls = "wrong";
    } else if (state && state.pick === i) cls = "sel";
    h += `<button class="opt ${cls}" ${state && state.answered ? "disabled" : ""} onclick="pick('${m.id}',${i})">
      <span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;
  });
  if (state && state.pick != null && !state.answered) {
    h += `<div class="conf"><span style="font-size:13px;color:var(--muted)">How sure are you?</span>
      ${[["Guessing", 1], ["Fairly sure", 2], ["Certain", 3]].map(([l, v], i) =>
        `<button class="btn sm" onclick="answer('${m.id}',${v})"><kbd>${i + 1}</kbd> ${l}</button>`).join("")}</div>
      <p class="sub" style="margin-top:10px;font-size:12px">Rating your confidence trains calibration — knowing what you actually know is most of what separates a good marketer from a confident one.</p>`;
  }
  if (state && state.answered) {
    h += `<div class="why"><b style="color:${state.ok ? "var(--ok)" : "var(--bad)"};display:block;margin-bottom:6px">${state.ok ? "Correct" : "Not quite — the answer is " + "ABCD"[item.answer]}</b>${esc(item.why)}</div>
    <div style="display:flex;gap:9px;margin-top:16px"><button class="btn primary" onclick="nextQ('${m.id}')">${q.i === m.assess.quiz.length - 1 ? "See results →" : "Next question →"} <kbd>↵</kbd></button></div>`;
  }
  h += `</div>`;
  b.innerHTML = h;
}
function pick(id, i) {
  const q = P(id).quiz;
  if (q.a[q.i] && q.a[q.i].answered) return;
  q.a[q.i] = { pick: i, answered: false }; save(); renderQuiz(byId(id));
}
function answer(id, conf) {
  const m = byId(id), q = P(id).quiz, st = q.a[q.i];
  if (!st || st.pick == null || st.answered) return;
  st.conf = conf; st.answered = true; st.ok = st.pick === m.assess.quiz[q.i].answer;
  save(); markDay(); renderQuiz(m);
}
function nextQ(id) {
  const m = byId(id), q = P(id).quiz;
  if (q.i === m.assess.quiz.length - 1) { q.finished = true; save(); renderSidebar(); quizResults(m); }
  else { q.i++; save(); renderQuiz(m); }
}
function quizResults(m) {
  const q = P(m.id).quiz, items = m.assess.quiz;
  const ok = q.a.filter(x => x && x.ok).length, tot = items.length;
  const pct = Math.round(ok / tot * 100);
  const overconf = q.a.filter((x, i) => x && x.conf === 3 && !x.ok).length;
  let h = `<div class="card" style="text-align:center">
    <p class="eyebrow">Step 3 · Retrieve</p>
    <div style="font-family:var(--serif);font-size:52px;font-weight:600;line-height:1;margin:8px 0 4px;color:${pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--warm)" : "var(--bad)"}">${pct}%</div>
    <p class="sub" style="margin-bottom:16px">${ok} of ${tot} correct</p>
    <p style="max-width:520px;margin:0 auto 18px;color:var(--text-2)">${pct >= 85 ? "Strong. The material is in there. The flashcards will keep it there." : pct >= 60 ? "Reasonable first pass. Re-read the sections behind the ones you missed, then retake in a few days — the retake is where the learning happens." : "This is a normal first score and it is useful data. Go back to Read, work through the sections behind the misses, and retake. Nobody learns this in one pass."}</p>`;
  if (overconf) h += `<div class="hint" style="max-width:520px;margin:0 auto 18px;text-align:left"><span class="i">Calibration</span> You were "certain" and wrong ${overconf} time${overconf > 1 ? "s" : ""}. That is the most valuable signal on this page — those are the beliefs that will cost you money.</div>`;
  h += `<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
    <button class="btn" onclick="retake('${m.id}')">Retake</button>
    <button class="btn" onclick="go('#/m/${m.id}/1')">Back to reading</button>
    <button class="btn primary" onclick="go('#/m/${m.id}/3')">Continue →</button></div></div>`;
  h += `<div class="card" style="margin-top:16px"><p class="eyebrow">Every question, with the reasoning</p>`;
  items.forEach((it, i) => {
    const st = q.a[i] || {};
    h += `<div style="padding:14px 0;border-top:${i ? "1px solid var(--line)" : "0"}">
      <div style="display:flex;gap:9px;align-items:flex-start">
        <span class="tag ${st.ok ? "ok" : ""}" style="${st.ok ? "" : "background:var(--bad-soft);color:var(--bad)"}">${st.ok ? "✓" : "✗"}</span>
        <div><b style="font-size:15px">${esc(it.q)}</b>
        <div style="font-size:14px;color:var(--muted);margin-top:5px">Correct: ${esc(it.options[it.answer])}${st.pick != null && !st.ok ? " · you chose: " + esc(it.options[st.pick]) : ""}</div>
        <div style="font-size:14px;color:var(--text-2);margin-top:7px">${esc(it.why)}</div></div></div></div>`;
  });
  h += `</div>`;
  $("#stepbody").innerHTML = h;
}

        <p>${cardCount()} cards in the deck. Next batch: ${upcoming.next ? upcoming.next + " card(s) in " + upcoming.days + " day(s)" : "none scheduled"}.</p>
        <p style="max-width:460px;margin:12px auto">Reviewing early feels productive and is mostly wasted effort — the schedule is doing the work. Spend the time on a new module instead.</p>
        <button class="btn primary" style="margin-top:6px" onclick="go('#/home')">Dashboard</button>
        <button class="btn" style="margin-top:6px" onclick="cramAll()">Review everything anyway</button></div></div>`;
      return;
    }
    startSession(due);
  }
  drawCard();
}
function startSession(cards) {
  const q = cards.slice();
  for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[q[i], q[j]] = [q[j], q[i]]; }
  session = { queue: q, total: q.length, done: 0, flipped: false };
}
function cramAll() {
  const all = [];
  MODS.forEach(m => (m.assess.cards || []).forEach((c, i) => {
    const k = cardKey(m.id, i); if (S.cards[k]) all.push({ k, mid: m.id, mtitle: m.title, c, st: S.cards[k] });
  }));
  startSession(all); drawCard();
}
function drawCard() {
  const v = $("#view");
  if (!session || !session.queue.length) {
    const n = session ? session.done : 0; session = null;
    v.innerHTML = `<div class="wrap"><div class="empty"><div class="big">Session complete</div>
      <p>${n} card${n === 1 ? "" : "s"} reviewed. Each one is now scheduled further out.</p>
      <button class="btn primary" style="margin-top:12px" onclick="go('#/home')">Dashboard</button></div></div>`;
    renderSidebar(); return;
  }
  markDay();
  const cur = session.queue[0];
  const pct = Math.round(session.done / session.total * 100);
  v.innerHTML = `<div class="wrap">
    <div class="qmeta" style="margin-bottom:18px"><span>Review · interleaved</span><span class="bar"><i style="width:${pct}%"></i></span>
      <span style="margin-left:auto">${session.queue.length} left</span></div>
    <div class="flash" onclick="flip()">
      <span class="tag acc" style="margin-bottom:16px">${cur.mid} · ${esc(cur.mtitle)}</span>
      <div class="front">${esc(cur.c.front)}</div>
      ${session.flipped ? `<div class="back">${esc(cur.c.back)}</div>` : `<div class="back" style="border:0;color:var(--muted);font-size:13.5px">Answer out loud, then click or press <kbd>space</kbd></div>`}
    </div>
    ${session.flipped ? `<div class="gradebar">
      ${[["Again", "<1d", 0], ["Hard", "", 1], ["Good", "", 2], ["Easy", "", 3]].map(([l, s, g], i) =>
        `<button onclick="rate(${g})">${l}<small>${predictIvl(cur.k, g)}</small></button>`).join("")}
    </div><p class="sub" style="text-align:center;margin-top:12px;font-size:12px">Be honest. Marking "Good" on a card you fumbled is how a review deck becomes decoration. Keys <kbd>1</kbd>–<kbd>4</kbd>.</p>`
      : `<div style="text-align:center;margin-top:16px"><button class="btn primary" onclick="flip()">Show answer <kbd>space</kbd></button></div>`}
  </div>`;
}
function predictIvl(k, g) {
  const st = S.cards[k]; if (!st) return "";
  const save0 = JSON.stringify(st);
  let ivl;
  if (g === 0) ivl = 0;
  else if (g === 1) ivl = st.ivl ? Math.max(1, Math.round(st.ivl * 1.2)) : 1;
  else if (g === 2) ivl = st.ivl === 0 ? 1 : (st.ivl === 1 ? 3 : Math.round(st.ivl * st.ease));
  else ivl = st.ivl === 0 ? 3 : Math.round(st.ivl * st.ease * 1.25);
  JSON.parse(save0);
  return ivl === 0 ? "today" : ivl === 1 ? "1 day" : ivl < 30 ? ivl + " days" : Math.round(ivl / 30) + " mo";
}
function flip() { if (session) { session.flipped = true; drawCard(); } }
function rate(g) {
  if (!session || !session.flipped) return;
  const cur = session.queue.shift();
  grade(cur.k, g);
  if (g === 0) session.queue.push(cur); else session.done++;
  session.flipped = false; drawCard();
}
function forecast() {
  const t = todayNum(); let best = null;
  Object.values(S.cards).forEach(c => { if (c.due > t && (best === null || c.due < best)) best = c.due; });
  if (best === null) return { next: 0, days: 0 };
  const n = Object.values(S.cards).filter(c => c.due === best).length;
  return { next: n, days: best - t };
}

   Two routes, in order of preference:
     direct  — this page calls api.anthropic.com itself. Nothing to install, nothing to run.

const API_URL = "https://api.anthropic.com/v1/messages";
const API_VERSION = "2023-06-01";

async function callAnthropic(key, system, messages, model, maxTokens) {
  const body = {
    model: model || "claude-sonnet-5",
    max_tokens: maxTokens || 1400,
    messages: messages.slice(-20)
  };
  if (system) body.system = system;
  const r = await fetch(API_URL, {
    method: "POST",
