ales.<\/p>\n<p><strong>Demand generation<\/strong> optimises for genuine buying intent: publish ungated where the audience already is, build recognition, and let people raise their hand via a high-intent action — demo, pricing, trial.<\/p>\n<p>Why gated lead gen degrades: downloading a PDF is a curiosity signal, not a buying signal. Volume targets push the team toward cheaper, broader offers that attract people even further from purchase. Sales works the list, finds it junk, stops working it, and the two teams begin arguing about lead quality. Meanwhile the gate suppressed the content's reach — the thing that would have built the memory the 95% need.<\/p>\n<p>The mature position is not \"never gate.\" Gate things carrying real buying signal — an ROI calculator, a benchmark tool, a pricing guide, an assessment — and ungate thought leadership whose value is reach. Then be explicit about which programmes are demand <em>creation<\/em> (judged on brand and pipeline over quarters) and which are <em>capture<\/em> (judged on cost per opportunity now).<\/p>\n<h3>MQL, SQL, SAL — and the SLA<\/h3>\n<p>Definitions vary between companies; what matters is that yours are written down and agreed.<\/p>\n<ul>\n<li><strong>MQL<\/strong> — meets marketing's bar: right firmographics plus a defined behaviour (score threshold, demo request, pricing page visit).<\/li>\n<li><strong>SAL<\/strong> — Sales Accepted Lead. Sales has looked and agreed it is worth working. This stage exists purely to make rejection visible and measurable.<\/li>\n<li><strong>SQL<\/strong> — sales has spoken to them and confirmed need, authority, budget and timing well enough to work a deal.<\/li>\n<li><strong>Opportunity<\/strong> — a deal with a value and expected close date in the pipeline.<\/li>\n<\/ul>\n<p>The <strong>SLA<\/strong> is the contract between the teams, and it runs both ways:<\/p>\n<blockquote>\n<p>Marketing delivers 300 MQLs per month meeting the agreed definition. Sales contacts each within 4 business hours, makes at least 5 attempts across 10 business days, and dispositions every lead in the CRM with a reason code. Rejected leads are reviewed jointly, monthly.<\/p>\n<\/blockquote>\n<p>The reason codes are the valuable part. Without them, \"lead quality is bad\" is an opinion; with them you can see it is 40% wrong-company-size and fix the targeting. Speed matters too — responding in minutes rather than days materially changes contact and qualification rates, which is why routing and alerting deserve real attention.<\/p>\n<h3>Pipeline math<\/h3>\n<p>The calculation you should be able to do on a whiteboard. Target: <strong>£2,000,000<\/strong> new ARR. Average contract value <strong>£20,000<\/strong> → <strong>100 new customers<\/strong>. Work backwards through observed rates:<\/p>\n<table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th>Rate<\/th>\n<th>Volume needed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Closed-won<\/td>\n<td>—<\/td>\n<td>100<\/td>\n<\/tr>\n<tr>\n<td>Opportunities<\/td>\n<td>25% win<\/td>\n<td>400<\/td>\n<\/tr>\n<tr>\n<td>SQL → Opp<\/td>\n<td>50%<\/td>\n<td>800<\/td>\n<\/tr>\n<tr>\n<td>MQL → SQL<\/td>\n<td>30%<\/td>\n<td>2,667<\/td>\n<\/tr>\n<tr>\n<td>MQLs per year<\/td>\n<td>—<\/td>\n<td><strong>~2,700<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Per month<\/td>\n<td>—<\/td>\n<td><strong>~225<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Then add the parts everyone forgets:<\/p>\n<ul>\n<li><strong>Sales capacity.<\/strong> 400 opportunities a year at 60 per rep is ~7 reps. With 4 reps, 2,700 MQLs produce a queue and a lead-quality argument, not £2m.<\/li>\n<li><strong>Cycle length.<\/strong> A 5-month average cycle means leads generated in month 9 cannot close this year. Front-load.<\/li>\n<li><strong>Cost.<\/strong> At a £250 blended cost per MQL, that is £675,000 to generate £2m of first-year ARR. Whether that is acceptable depends on margin, retention and payback (M05, M17).<\/li>\n<li><strong>The mix.<\/strong> Not all 100 come from new MQLs — expansion, partners, referrals and outbound contribute. Marketing should own a number reflecting what it actually sources, defined separately from what it influences.<\/li>\n<\/ul>\n<p>Run this with your real rates and it will usually show the target is unreachable at current budget or headcount. Saying so early, with the arithmetic, is the most valuable thing a marketer does in annual planning.<\/p>\n<h3>ABM, briefly<\/h3>\n<p><strong>Account-based marketing<\/strong> inverts the funnel: pick a defined list of target accounts, then market to the committee inside each with tailored content and coordinated sales outreach. Tiers are common — 1:1 for a handful of strategic accounts, 1:few for clusters sharing a problem, 1:many programmatic for a few hundred.<\/p>\n<p>Worth it when deal sizes are large (roughly six figures up), the addressable market is small enough to enumerate, committees are complex, and sales and marketing can genuinely coordinate. Not worth it for low-value, high-volume, self-serve products. The metrics change too: account engagement, meetings with target accounts, in-list pipeline — not MQLs.<\/p>\n<h3>Sales enablement content<\/h3>\n<p>Most of the buying journey happens in conversations you are not in, so the content that travels through the deal matters as much as the content that starts it: one-pagers per persona and per objection, written to be forwarded; case studies segmented by industry and size, with numbers; competitive battlecards stating rivals' strengths honestly; ROI templates the champion uses to justify the spend internally; security and compliance packs so the deal does not stall in review; and a \"why now\" narrative aimed at the do-nothing default.<\/p>\n<p>A quick alignment test: ask three reps what they send after a first call. Wildly different answers, or \"whatever I made myself,\" means the enablement layer does not exist.<\/p>\n<h3>CRM and lifecycle stages<\/h3>\n<p>The CRM is the system of record: contacts, accounts, opportunities, activities. A single <strong>lifecycle stage<\/strong> field moves forward only — Subscriber → Lead → MQL → SAL → SQL → Opportunity → Customer — and is the backbone of every pipeline report you will build.<\/p>\n<p>Non-negotiables: one agreed definition per stage; timestamps on every change, so you can compute velocity and conversion rates; original source captured at creation and never overwritten; reason codes on every rejection and lost deal. Without disciplined stage data the CRM cannot answer \"which channel produces customers, not just leads\" — the question the whole department is judged on.<\/p>\n<h3>Attribution in long cycles<\/h3>\n<p>Everything hard about attribution (M13) is harder here. Cycles outlast cookie lifetimes, consent windows and often the buyer's job, and committee members touch you separately while only one fills the form.<\/p>\n<p>Practical stance: track touchpoints at <strong>contact and account level<\/strong> in the CRM, not just web sessions — account is the truer unit in B2B. Use multi-touch reporting as directional only, remembering GA4 retains three models (data-driven and two last-click variants), none of which see sales conversations. Lean harder on <strong>self-reported attribution<\/strong>, which catches podcasts, communities and events no pixel records. Judge demand-creation work on pipeline created over quarters, and run holdouts where you can (M15) — by geography, industry or account tier.<\/p>\n<h3>What transfers to B2C<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>B2B<\/th>\n<th>B2C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Decision unit<\/td>\n<td>Committee, 6–11 people<\/td>\n<td>One person<\/td>\n<\/tr>\n<tr>\n<td>Cycle<\/td>\n<td>Weeks to years<\/td>\n<td>Seconds to weeks<\/td>\n<\/tr>\n<tr>\n<td>Driver<\/td>\n<td>Risk reduction, consensus, career safety<\/td>\n<td>Emotion, identity, convenience, price<\/td>\n<\/tr>\n<tr>\n<td>Volume<\/td>\n<td>Hundreds of leads<\/td>\n<td>Thousands to millions of transactions<\/td>\n<\/tr>\n<tr>\n<td>Price sensitivity<\/td>\n<td>Lower per unit; procurement negotiates<\/td>\n<td>High; small differences move conversion<\/td>\n<\/tr>\n<tr>\n<td>Testing<\/td>\n<td>Rarely enough volume<\/td>\n<td>Often enough volume (M14)<\/td>\n<\/tr>\n<tr>\n<td>Seasonality<\/td>\n<td>Budget cycles, quarter-end, fiscal year<\/td>\n<td>Holidays, weather, paydays, culture<\/td>\n<\/tr>\n<tr>\n<td>Measurement<\/td>\n<td>Long lag, CRM-based, self-reported<\/td>\n<td>Fast, transactional, platform-inflated<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>What transfers both ways: positioning against alternatives including doing nothing; the primacy of the offer; retention economics; and the fact that people buy from brands they already recognise. What does not: cadence, creative register, and the assumption that a fast conversion rate says anything about long-cycle health.<\/p>\n<p>Note the blur. Product-led SaaS sells to an individual like B2C and expands into a contract like B2B; considered consumer purchases — mortgages, cars, universities — have committees (families), long cycles and enablement content. Ask about decision unit and cycle length rather than which label the company uses.<\/p>", "text": "Buying committees: nobody buys alone In consumer marketing you persuade one person. In B2B, any purchase of size involves a group — commonly cited research on complex B2B buying puts typical committees in the range of six to eleven people, more for enterprise. Each has a different question: Economic buyer: what is the return, and what is the risk to me? User / champion: does this improve my daily work, and can I sell it internally? Technical evaluator: does it integrate, and is it secure? Procurement: price, terms, contract risk. Security / legal: what could go wrong? The blocker: often whoever owns the process you are replacing. Two consequences. One message cannot serve all of them — you need a message hierarchy (M03) with a per-role layer, plus assets the champion can forward. And the most common outcome is not losing to a competitor; it is no decision. Committees default to inaction because inaction is safe. Marketing that only differentiates against competitors, never against doing nothing, loses most of the time. Consensus is the constraint: the more people who must agree, the more risk-reduction material you need — case studies from similar companies, security documentation, implementation timelines, references. Long cycles change what marketing is for A 3-, 6- or 18-month cycle means months of forgetting sit between first contact and purchase. Marketing's job becomes being remembered and being findable when the trigger fires , not converting today. This is what the 95-5 rule describes: at any moment only a small share of potential buyers — the commonly cited figure is around 5% — are in-market. It is a heuristic from B2B advertising research, not a constant, and the true share depends on cycle length. The implications hold regardless: Most advertising reaches people who cannot buy now. That is not waste; it is the only way to be in memory later. Response-rate metrics systematically undervalue that work, because the 95% cannot respond. Brand-building in B2B is not a luxury. It is how you get onto the shortlist that forms before anyone runs a formal evaluation. Top-of-funnel work should be measured on memory-linked indicators: branded search volume, direct"}, {"h": "How it works in practice", "html": "<p>A functioning B2B marketing–sales relationship has five artefacts, and you can audit any company by asking for them:<\/p>\n<ol>\n<li><strong>A written ICP<\/strong> and a target account list derived from it (M02).<\/li>\n<li><strong>Agreed stage definitions and an SLA<\/strong> with commitments both ways.<\/li>\n<li><strong>A pipeline model<\/strong> shared with sales and finance, updated with real rates each quarter.<\/li>\n<li><strong>A closed-loop report<\/strong>: which sources produced opportunities and revenue, not leads.<\/li>\n<li><strong>A recurring joint meeting<\/strong> reviewing rejected leads, lost-deal reasons, and what buyers actually said.<\/li>\n<\/ol>\n<p>The fifth is where the compounding happens. Marketers who sit in on sales calls write better copy than marketers who read dashboards. Two calls a week is enough to change everything you produce.<\/p>", "text": "A functioning B2B marketing–sales relationship has five artefacts, and you can audit any company by asking for them: A written ICP and a target account list derived from it (M02). Agreed stage definitions and an SLA with commitments both ways. A pipeline model shared with sales and finance, updated with real rates each quarter. A closed-loop report : which sources produced opportunities and revenue, not leads. A recurring joint meeting reviewing rejected leads, lost-deal reasons, and what buyers actually said. The fifth is where the compounding happens. Marketers who sit in on sales calls write better copy than marketers who read dashboards. Two calls a week is enough to change everything you produce."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Black-box ad platforms punish bad lead definitions.<\/strong> Performance Max and Advantage+ optimise toward whatever conversion you feed them: feed \"form fill\" and they find the cheapest form-fillers alive. Feed offline conversion imports back from the CRM — SQLs and closed-won, with values — and the same algorithms work in your favour. In B2B, <strong>the offline conversion feed is the highest-leverage technical task in paid media.<\/strong><\/li>\n<li><strong>AI search changed how committees research.<\/strong> With ~60% of Google searches ending click-free and AI Overviews cutting top-result CTR sharply, buyers arrive later and better informed, often having asked an assistant which vendors to consider. Being named in that answer is a distribution channel (M08, M18), which makes third-party mentions, review sites and comparison pages more valuable than another gated ebook.<\/li>\n<li><strong>Consent rules unchanged.<\/strong> GDPR and ePrivacy still govern how you collect and email B2B contacts in the EU/UK; legitimate interest is not blanket permission, and buying lists remains a bad idea legally and practically.<\/li>\n<\/ul>", "text": "Black-box ad platforms punish bad lead definitions. Performance Max and Advantage+ optimise toward whatever conversion you feed them: feed \"form fill\" and they find the cheapest form-fillers alive. Feed offline conversion imports back from the CRM — SQLs and closed-won, with values — and the same algorithms work in your favour. In B2B, the offline conversion feed is the highest-leverage technical task in paid media. AI search changed how committees research. With ~60% of Google searches ending click-free and AI Overviews cutting top-result CTR sharply, buyers arrive later and better informed, often having asked an assistant which vendors to consider. Being named in that answer is a distribution channel (M08, M18), which makes third-party mentions, review sites and comparison pages more valuable than another gated ebook. Consent rules unchanged. GDPR and ePrivacy still govern how you collect and email B2B contacts in the EU/UK; legitimate interest is not blanket permission, and buying lists remains a bad idea legally and practically."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Optimising for MQL volume<\/strong> with no visibility into what happens after the handoff.<\/li>\n<li><strong>One message for the whole committee,<\/strong> usually written for the user and useless to the CFO.<\/li>\n<li><strong>Ignoring \"do nothing\"<\/strong> as the main competitor.<\/li>\n<li><strong>Gating everything,<\/strong> suppressing reach and filling the CRM with curiosity.<\/li>\n<li><strong>No SLA,<\/strong> so lead quality is an argument rather than a measurable.<\/li>\n<li><strong>A pipeline model with no sales capacity check,<\/strong> then surprise that leads sat untouched.<\/li>\n<li><strong>Cutting brand spend in B2B<\/strong> because it does not produce this quarter's MQLs, then wondering why win rates fall.<\/li>\n<li><strong>Never listening to a sales call.<\/strong><\/li>\n<\/ul>", "text": "Optimising for MQL volume with no visibility into what happens after the handoff. One message for the whole committee, usually written for the user and useless to the CFO. Ignoring \"do nothing\" as the main competitor. Gating everything, suppressing reach and filling the CRM with curiosity. No SLA, so lead quality is an argument rather than a measurable. A pipeline model with no sales capacity check, then surprise that leads sat untouched. Cutting brand spend in B2B because it does not produce this quarter's MQLs, then wondering why win rates fall. Never listening to a sales call."}, {"h": "Exercise (25 minutes)", "html": "<p>For <strong>your chosen business<\/strong> (if it is B2C, do questions 1 and 6 for a plausible B2B version — this is a transferable-skill exercise):<\/p>\n<ol>\n<li><strong>Map the buying committee.<\/strong> Every role, the one question each asks, and the single asset that answers it. Mark the likeliest blocker.<\/li>\n<li><strong>Write your stage definitions<\/strong>: MQL, SAL, SQL, Opportunity — one sentence each, with the specific behaviour or firmographic that qualifies.<\/li>\n<li><strong>Draft the SLA<\/strong> in five lines: marketing's volume and quality commitment, sales' response time, attempts, disposition requirement, joint review cadence.<\/li>\n<li><strong>Do the pipeline math.<\/strong> From a revenue target, using your real or best-estimated rates, back to monthly MQLs. Add the two reality checks — sales capacity and cycle length — and state whether the target is achievable and what would have to change.<\/li>\n<li><strong>Classify your programmes<\/strong> into creation and capture, giving each the metric it will be judged on. Flag any gated asset that should be ungated.<\/li>\n<li><strong>The 95-5 test.<\/strong> Two sentences you would say to a sceptical CEO to justify spending on people who cannot buy this quarter, including the leading indicator you will report instead of MQLs.<\/li>\n<\/ol>", "text": "For your chosen business (if it is B2C, do questions 1 and 6 for a plausible B2B version — this is a transferable-skill exercise): Map the buying committee. Every role, the one question each asks, and the single asset that answers it. Mark the likeliest blocker. Write your stage definitions : MQL, SAL, SQL, Opportunity — one sentence each, with the specific behaviour or firmographic that qualifies. Draft the SLA in five lines: marketing's volume and quality commitment, sales' response time, attempts, disposition requirement, joint review cadence. Do the pipeline math. From a revenue target, using your real or best-estimated rates, back to monthly MQLs. Add the two reality checks — sales capacity and cycle length — and state whether the target is achievable and what would have to change. Classify your programmes into creation and capture, giving each the metric it will be judged on. Flag any gated asset that should be ungated. The 95-5 test. Two sentences you would say to a sceptical CEO to justify spending on people who cannot buy this quarter, including the leading indicator you will report instead of MQLs."}, {"h": "Recall (10 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Four roles on a buying committee and what each cares about.<\/li>\n<li>The 95-5 rule and its two implications for how you spend and how you measure.<\/li>\n<li>Lead gen vs demand gen, and why gated lead gen degrades.<\/li>\n<li>MQL, SAL, SQL — and what the SAL stage exists for.<\/li>\n<li>The pipeline math backwards from a revenue target, and the two constraints people forget.<\/li>\n<li>When ABM is worth it and when it is not.<\/li>\n<li>Three things that differ between B2B and B2C, and two that transfer.<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Four roles on a buying committee and what each cares about. The 95-5 rule and its two implications for how you spend and how you measure. Lead gen vs demand gen, and why gated lead gen degrades. MQL, SAL, SQL — and what the SAL stage exists for. The pipeline math backwards from a revenue target, and the two constraints people forget. When ABM is worth it and when it is not. Three things that differ between B2B and B2C, and two that transfer."}, {"h": "If you remember one thing", "html": "<p><strong>In B2B you are selling to a committee that is mostly not in the market, whose default is to do nothing.<\/strong> So the work is being remembered until the trigger fires, and giving your champion the material to win an internal argument you will never attend.<\/p>", "text": "In B2B you are selling to a committee that is mostly not in the market, whose default is to do nothing. So the work is being remembered until the trigger fires, and giving your champion the material to win an internal argument you will never attend."}], "suggest": [["Which B2C instincts most reliably waste a year in a B2B business?", "What does fluency about an MQL SLA sound like in an interview?", "My business sells to consumers, so how much of this transfers?"], ["How do I find out who the real blocker is before a deal stalls?", "What single asset answers the economic buyer's question about risk?", "How does committee logic shrink for a two-person buying decision?"], ["Why is the recurring joint meeting where the compounding happens?", "Show me a closed-loop report built on opportunities, not leads", "Which of the five artefacts should a solo founder build first?"], ["How does an offline conversion import actually get from CRM to Google?", "What value do I attach to an SQL import if deals close months later?", "If buyers arrive later and better informed, what changes on my site?"], ["Why does gating everything fill the CRM with curiosity?", "How do I write the same offer for a CFO instead of the daily user?", "How would I check my pipeline model against real sales capacity?"], ["What behaviour should separate an MQL from an SQL in my case?", "Give me a five-line SLA I could take to a sales lead tomorrow", "How do I do the pipeline math with no historical win rate to use?"], ["What does the SAL stage actually exist for, in one sentence?", "Explain the 95-5 rule's two implications for how I measure", "When is ABM not worth the effort for a business my size?"], ["What does being remembered until the trigger fires cost each month?", "What material genuinely helps a champion win an argument I never attend?", "How do I market to buyers who are mostly not in the market yet?"]], "assess": {"predict": "A B2B software company generates 300 leads a month and the sales team says they are all rubbish. Guess what is most likely wrong.", "quiz": [{"q": "Target £3,000,000 of new ARR at a £30,000 average contract value. Observed rates: 25 percent of opportunities close, 50 percent of SQLs become opportunities, 25 percent of MQLs become SQLs. How many MQLs per month does the plan need?", "options": ["About 267.", "About 133.", "About 67.", "About 800."], "answer": 0, "why": "£3m at £30k is 100 customers; at a 25 percent win rate that is 400 opportunities, at 50 percent that is 800 SQLs, at 25 percent that is 3,200 MQLs a year, about 267 a month. The 133 answer comes from dropping one stage of the chain, which is the most common arithmetic slip in pipeline modelling."}, {"q": "That same plan needs 400 opportunities a year. The company has four sales reps, each of whom works about 60 opportunities a year. What should the marketer say in the planning meeting?", "options": ["Nothing yet. Reps typically work harder in the fourth quarter.", "Nothing. Marketing owns MQLs, so a queue of unworked leads is a sales problem.", "Capacity is 240 opportunities against 400 needed, so the target is unreachable without roughly three more reps or a lower target, and saying so now is the valuable move.", "Raise the MQL target further to compensate for the low win rate."], "answer": 2, "why": "Without the capacity check, 2,700 or 3,200 MQLs produce a queue and a lead-quality argument rather than revenue. Raising MQL volume is the tempting answer because it is the lever marketing controls, but it makes the bottleneck worse, and stating the arithmetic early is described as the most valuable thing a marketer does in annual planning."}, {"q": "A CEO wants to cut a LinkedIn thought-leadership programme because it produces very few MQLs per pound. What is the strongest response?", "options": ["Agree. If it does not produce MQLs at an acceptable cost it is not working.", "Gate it, so it starts producing MQLs and can be measured on the same basis.", "Keep it but move its budget into retargeting so the clicks convert.", "Most of the audience cannot buy now, so response metrics structurally undervalue the work; judge it on branded search volume, direct traffic, how-did-you-hear-about-us share and inbound requests naming you, plus pipeline over quarters."], "answer": 3, "why": "The 95-5 rule says only a small share of buyers are in-market at any moment, so advertising that reaches the rest is memory-building, not waste, and the 95 percent cannot respond to a response metric. Gating it is the seductive wrong answer: it makes the programme measurable by suppressing exactly the reach that was doing the work."}, {"q": "You have two assets ready: an ROI calculator and an essay on where the category is heading. What is the mature gating decision?", "options": ["Gate both. Every asset should earn contact details.", "Gate the ROI calculator, which carries real buying signal, and ungate the essay, whose value is reach and memory.", "Ungate both. Gating always degrades lead quality.", "Gate the essay, since it is the more valuable content, and ungate the calculator as a free tool."], "answer": 1, "why": "Gate things carrying genuine buying signal - ROI calculators, benchmark tools, pricing guides, assessments - and ungate thought leadership whose value is reach. Never gating is not the position either; the failure of gated lead gen is gating curiosity, which fills the CRM with people who downloaded a PDF."}, {"q": "Sales says lead quality is bad. Marketing says sales does not work the leads. Which single element of an SLA settles the argument?", "options": ["A higher MQL scoring threshold, so fewer and better leads are handed over.", "A monthly MQL volume commitment from marketing.", "Mandatory disposition of every lead in the CRM with a reason code, reviewed jointly each month.", "A four-business-hour first-response commitment from sales."], "answer": 2, "why": "Reason codes turn lead quality from an opinion into a measurable: you can see it is 40 percent wrong-company-size and fix the targeting. The response-time commitment is a real and important part of the SLA and materially changes contact rates, but it does not tell you why leads were rejected."}, {"q": "Your Performance Max campaign is being fed form fill as its conversion event, and the resulting leads are mostly unqualified. What is the highest-leverage fix?", "options": ["Add negative keywords and tighten the audience signals so the algorithm looks at better people.", "Import SQLs and closed-won deals with values back from the CRM as offline conversions, so the algorithm optimises toward revenue rather than forms.", "Move the budget to manual campaigns where you control targeting directly.", "Raise the form's friction by adding qualifying questions until volume falls."], "answer": 1, "why": "Black-box platforms optimise toward whatever conversion you feed them, so feed form fill and they find the cheapest form-fillers alive; the offline conversion feed is described as the highest-leverage technical task in B2B paid media. Tightening targeting is the instinctive answer, but with Performance Max the algorithm, not you, allocates to keywords and placements."}], "cards": [{"front": "Name four buying committee roles and the question each asks.", "back": "Economic buyer: what is the return and the risk to me. Champion or user: does this improve my work and can I sell it internally. Technical evaluator: does it integrate and is it secure. Procurement: price, terms, contract risk."}, {"front": "What is the most common outcome of a B2B deal, and what does that imply?", "back": "No decision. Committees default to inaction because inaction is safe, so you must differentiate against doing nothing as well as against competitors, and supply risk-reduction material for consensus."}, {"front": "State the 95-5 rule and its two implications.", "back": "Only around 5 percent of potential buyers are in-market at any moment. So most advertising reaches people who cannot buy, which is memory rather than waste, and response-rate metrics systematically undervalue that work."}, {"front": "What does the SAL stage exist for?", "back": "Sales Accepted Lead exists purely to make rejection visible and measurable. Without it you cannot see what sales refused to work or why, and lead quality stays an argument instead of a number."}, {"front": "When is ABM worth it, and when is it not?", "back": "Worth it for large deals, roughly six figures up, an enumerable market, complex committees and real sales coordination. Not for low-value, high-volume, self-serve products. Metrics become account engagement, meetings and in-list pipeline."}, {"front": "What is the practical attribution stance for long B2B cycles?", "back": "Track touchpoints at contact and account level in the CRM, treat multi-touch reporting as directional only, lean harder on self-reported attribution, judge demand creation on pipeline over quarters, and run holdouts by geography, industry or account tier."}], "elaborate": ["Map the buying committee for your chosen business, or for a plausible B2B version of it if it is B2C: every role, the one question each asks, and the single asset that answers it. Mark the likeliest blocker and say exactly what you would put in your champion's hands to win the internal argument you will never attend.", "Run the pipeline math backwards from a revenue target using your real or best-estimated rates, then apply the two constraints people forget, sales capacity and cycle length. State whether the target is achievable and what specifically would have to change - and connect this to M15's point that only objective-and-task budgeting survives a hostile question."], "transfer": {"scenario": "A B2B SaaS company has been given a target of £1,600,000 in new ARR next year at a £16,000 average contract value. Observed rates: 20 percent of opportunities close, 50 percent of SQLs become opportunities, 20 percent of MQLs become SQLs. Blended cost per MQL is £200. The company has three sales reps who each work about 60 opportunities a year, and the average sales cycle is five months. The CMO has been given a £600,000 budget.", "prompt": "Say whether the target is achievable, and write what you would tell the CEO in the planning meeting.", "model": "The target is not achievable, and I would say so with the arithmetic in front of me. £1.6m at £16,000 is 100 customers; at a 20 percent win rate that is 500 opportunities, 1,000 SQLs and 5,000 MQLs, about 417 a month. Three things break it. Cost: 5,000 MQLs at £200 is £1,000,000 against a £600,000 budget. Capacity: three reps at 60 opportunities each is 180, not 500, so most of the pipeline sits untouched and we get a lead-quality argument instead of revenue. Cycle: a five-month average means anything generated after month seven cannot close this year, so the plan must be front-loaded. On current headcount and budget the defensible sourced number is around £600,000. To move it, we need reps hired now, a tighter MQL definition to lift the 20 percent MQL-to-SQL rate, and offline conversion imports so the ad platforms optimise toward SQLs."}}}, {"id": "M17", "num": 17, "part": "p3", "title": "Retention, Growth Loops, and LTV", "short": "Retention & growth loops", "meta": "60 minutes (25 read · 25 exercise · 10 recall)", "minutes": 60, "sections": [{"h": "Why this matters", "html": "<p>Acquisition is rented. Every customer you buy, you buy again next month at a slightly higher price, because auctions get more competitive and the easy audience is exhausted first.<\/p>\n<p>Retention is owned. A customer who stays gives you revenue with no acquisition cost, which raises LTV, which raises the CAC you can afford, which lets you outbid competitors for the same click. That is the whole strategic argument, and it is why the highest-leverage marketing work in most companies is not in the ad account.<\/p>\n<p>It is also the argument nobody makes in the budget meeting, because retention improvements are slow, invisible to attribution, and belong to no single team.<\/p>", "text": "Acquisition is rented. Every customer you buy, you buy again next month at a slightly higher price, because auctions get more competitive and the easy audience is exhausted first. Retention is owned. A customer who stays gives you revenue with no acquisition cost, which raises LTV, which raises the CAC you can afford, which lets you outbid competitors for the same click. That is the whole strategic argument, and it is why the highest-leverage marketing work in most companies is not in the ad account. It is also the argument nobody makes in the budget meeting, because retention improvements are slow, invisible to attribution, and belong to no single team."}, {"h": "Core concepts", "html": "<h3>Retention multiplies everything<\/h3>\n<p>Take a subscription at £50/month with 60% gross margin.<\/p>\n<ul>\n<li><strong>8% monthly churn<\/strong> → lifetime 1 / 0.08 = <strong>12.5 months<\/strong> → LTV (gross profit) = £50 × 0.60 × 12.5 = <strong>£375<\/strong><\/li>\n<li><strong>5% churn<\/strong> → <strong>20 months<\/strong> → <strong>£600<\/strong><\/li>\n<li><strong>3% churn<\/strong> → <strong>33.3 months<\/strong> → <strong>£1,000<\/strong><\/li>\n<\/ul>\n<p>Cutting churn from 8% to 5% raised LTV by 60%. From 8% to 3% it nearly tripled it.<\/p>\n<p><strong>Now convert that into acquisition power.<\/strong> At a 3:1 LTV:CAC target, max CAC goes £125 → £200 → £333. At £375 LTV you cannot profitably buy a customer at £150; at £1,000 you can outbid almost everyone in your category, run channels competitors find unaffordable, and still hit payback. <strong>A retention improvement is a weapon in the ad auction.<\/strong><\/p>\n<p>Payback moves too. At 8% churn and £125 CAC, payback is £125 / £30 monthly gross profit = <strong>4.2 months<\/strong>. Halve churn and you can spend £250 and accept 8.3 months, if cash allows — which is now a financing question, not a marketing one.<\/p>\n<p>Two cautions. <code>1 / churn<\/code> assumes a constant rate, which is wrong: churn is highest early and falls as cohorts mature, so simple LTV overstates for young cohorts. Use cohort curves for anything important. And LTV is only real if computed on <strong>gross profit<\/strong>, not revenue, and capped at a defensible horizon (24 or 36 months) rather than projected to infinity.<\/p>\n<h3>Logo churn vs revenue churn<\/h3>\n<p><strong>Logo churn<\/strong> counts customers lost; <strong>revenue churn<\/strong> counts money lost. The gap tells you which problem you have. Losing 5% of customers who were all on your cheapest plan might be 2% of revenue — a mix issue. Losing 2% who were your largest accounts might be 9%.<\/p>\n<p><strong>Net revenue retention (NRR)<\/strong> = (starting revenue − churn − contraction + expansion) / starting revenue. Above 100% means the existing base grows on its own: customers who stay and upgrade more than replace those who leave, so the business grows even acquiring nobody. Report gross retention alongside it, because expansion from a few big accounts can hide a leaky base.<\/p>\n<p>For ecommerce the equivalents are <strong>repeat purchase rate<\/strong> and time between orders — same logic, different arithmetic.<\/p>\n<h3>Cohort curves and what flattening means<\/h3>\n<p>Group customers by joining month and track what share is still active at months 1, 3, 6, 12. Never average across all customers; a growing company's average is dominated by new joiners, which hides everything.<\/p>\n<p><strong>Does the curve flatten?<\/strong> A curve that drops steeply then levels at, say, 35% means you have a durable core who genuinely need the product. That plateau is the real business, and growth compounds on top of it. A curve declining toward zero means there is no core — everyone eventually leaves, so you must acquire forever, faster, to stand still. <strong>Finding out whether your curve flattens is the single most informative analysis in this module.<\/strong><\/p>\n<p><strong>Are later cohorts above earlier ones?<\/strong> January at month 3 at 30% and June at 42% means product or onboarding is improving. The reverse means something you did — a channel change, a promotion, a pricing move — is bringing in worse customers. Retention curves are also a channel-quality signal: cheap CAC with terrible month-3 retention is more expensive than it looks.<\/p>\n<h3>Onboarding, time-to-value, activation<\/h3>\n<p>Most churn is decided in the first days, before any lifecycle email fires, because the customer never got the thing they came for.<\/p>\n<p><strong>Time-to-value<\/strong> is elapsed time from signup to first real benefit. Shortening it does more for retention than almost anything else: strip setup steps, provide templates and sample data, defer configuration, do the first bit of work for them.<\/p>\n<p><strong>An activation metric<\/strong> is the observable behaviour that predicts retention — imported contacts, invited a teammate, placed a second order. Find it by comparing what retained customers did in week one that churned ones did not. It must be causally plausible, not merely correlated; if the behaviour is a symptom of already-motivated users, pushing everyone toward it changes nothing.<\/p>\n<p>Once you have it, activation rate becomes a leading indicator you can manage weekly, and it belongs at the top of your metric tree beside acquisition — exactly where most companies never put it.<\/p>\n<h3>Growth loops vs funnels<\/h3>\n<p>A <strong>funnel<\/strong> is linear: money in the top, customers out the bottom. Output does not feed input, so when you stop spending, growth stops. A <strong>loop<\/strong> is circular: the output of one cycle becomes the input of the next, and each turn makes the next cheaper or larger.<\/p>\n<ul>\n<li><strong>Viral / referral loop.<\/strong> Customer uses product → invites or shares → some convert → they invite others. Native where the product is shared (file sharing, collaboration, payment requests). Measured by the <strong>viral coefficient (k)<\/strong> = invites per user × conversion per invite. k above 1 is self-sustaining and rare; k of 0.3 is not viral but cuts effective CAC by roughly 30%, which is a serious result.<\/li>\n<li><strong>Content loop.<\/strong> Publish → rank or get shared → attract users → users generate questions, reviews or data → that becomes more publishable material. Review platforms and marketplaces run on this.<\/li>\n<li><strong>Paid loop.<\/strong> Spend → acquire customer → margin funds the next acquisition. It only compounds if payback is short enough that cash recycles inside your working-capital cycle. Most ecommerce runs on this, and its speed limit is payback period, not ROAS.<\/li>\n<li><strong>UGC loop.<\/strong> Customers post → their audiences discover you → some buy and post. Fuelled by making the product remarkable, prompting at the right moment (post-delivery, post-result), and reposting contributors so posting is rewarded.<\/li>\n<li><strong>B2B word-of-mouth loop.<\/strong> A customer succeeds → becomes a reference and case study → shortens the next deal's cycle and raises win rate.<\/li>\n<\/ul>\n<p>Loops are slower to build and harder to attribute than campaigns. That is precisely why they are underbuilt, and why they are durable when they exist.<\/p>\n<h3>Network effects are not the same as loops<\/h3>\n<p>A <strong>loop<\/strong> is a growth mechanism: usage produces more users. A <strong>network effect<\/strong> is a value mechanism: the product gets <em>better<\/em> for each user as more join (marketplaces, messaging, standards). Network effects usually create loops, but plenty of loops have no network effect — a content loop makes you bigger, not more useful per user. The distinction matters because network effects create defensibility while loops merely create efficiency. Do not claim one when you have the other.<\/p>\n<h3>Referral programmes: what makes them work<\/h3>\n<ul>\n<li><strong>The product is worth talking about.<\/strong> A referral programme amplifies word of mouth; it cannot create it. If nobody recommends you unprompted, fix that first.<\/li>\n<li><strong>Double-sided reward,<\/strong> so the sharer is doing a favour rather than collecting a bounty.<\/li>\n<li><strong>The reward matches the product's value.<\/strong> Account credit works when the product is used repeatedly. Cash bounties attract people who want cash and produce customers who churn.<\/li>\n<li><strong>Asked at the moment of realised value<\/strong> — after a good result or a successful delivery — not at signup, when the customer has nothing to vouch for.<\/li>\n<li><strong>Frictionless mechanics:<\/strong> prefilled message, one link, works on mobile, credit applied automatically and visibly.<\/li>\n<li><strong>Measured on retained referred customers,<\/strong> not shares. Referred customers frequently retain better than paid-acquired ones; that difference is the real return, and averaging hides it.<\/li>\n<\/ul>\n<h3>Owned audiences compound<\/h3>\n<p>Email lists, SMS lists and communities are the assets you keep when a platform changes its algorithm or its prices. Reach is not free — deliverability, hygiene and consent all cost work (M12) — but it is not auctioned against competitors every time you use it. A list of 20,000 engaged subscribers can be activated for the cost of a send, repeatedly, for years; the same audience rented through paid social costs money every single time. Every acquisition campaign should therefore be judged not only on the sale but on whether it added someone to an audience you own.<\/p>\n<h3>When retention beats acquisition<\/h3>\n<p><strong>Almost always, for subscription and repeat-purchase businesses.<\/strong> If the cohort curve does not flatten, acquisition spend pours into a bucket with a hole; more spend just makes the hole busier.<\/p>\n<p><strong>Less so for genuinely one-off, high-ticket purchases<\/strong> — a wedding venue, a loft conversion. Nobody buys a second loft. There, \"retention\" is redefined as referrals, reviews, reputation and adjacent services, and acquisition remains the main engine.<\/p>\n<p><strong>A rough decision rule.<\/strong> Estimate the revenue effect of a realistic 20% relative churn improvement, and compare it to a realistic 20% increase in acquisition spend at current marginal returns (M15). For most subscription businesses past their first year, retention wins by a wide margin — and costs less, because it usually means product and onboarding work rather than media spend.<\/p>", "text": "Retention multiplies everything Take a subscription at £50/month with 60% gross margin. 8% monthly churn → lifetime 1 / 0.08 = 12.5 months → LTV (gross profit) = £50 × 0.60 × 12.5 = £375 5% churn → 20 months → £600 3% churn → 33.3 months → £1,000 Cutting churn from 8% to 5% raised LTV by 60%. From 8% to 3% it nearly tripled it. Now convert that into acquisition power. At a 3:1 LTV:CAC target, max CAC goes £125 → £200 → £333. At £375 LTV you cannot profitably buy a customer at £150; at £1,000 you can outbid almost everyone in your category, run channels competitors find unaffordable, and still hit payback. A retention improvement is a weapon in the ad auction. Payback moves too. At 8% churn and £125 CAC, payback is £125 / £30 monthly gross profit = 4.2 months . Halve churn and you can spend £250 and accept 8.3 months, if cash allows — which is now a financing question, not a marketing one. Two cautions. 1 / churn assumes a constant rate, which is wrong: churn is highest early and falls as cohorts mature, so simple LTV overstates for young cohorts. Use cohort curves for anything important. And LTV is only real if computed on gross profit , not revenue, and capped at a defensible horizon (24 or 36 months) rather than projected to infinity. Logo churn vs revenue churn Logo churn counts customers lost; revenue churn counts money lost. The gap tells you which problem you have. Losing 5% of customers who were all on your cheapest plan might be 2% of revenue — a mix issue. Losing 2% who were your largest accounts might be 9%. Net revenue retention (NRR) = (starting revenue − churn − contraction + expansion) / starting revenue. Above 100% means the existing base grows on its own: customers who stay and upgrade more than replace those who leave, so the business grows even acquiring nobody. Report gross retention alongside it, because expansion from a few big accounts can hide a leaky base. For ecommerce the equivalents are repeat purchase rate and time between orders — same logic, different arithmetic. Cohort curves and what flattening means Group customers by joining month and track what share is still active at months 1, 3, 6, 12. Never average across all customers; a g"}, {"h": "How it works in practice", "html": "<p><strong>Worked example.<\/strong> A £45/month subscription, 65% gross margin, 7% monthly churn, CAC £160.<\/p>\n<ul>\n<li>Lifetime 14.3 months. LTV = £45 × 0.65 × 14.3 = <strong>£418<\/strong>. LTV:CAC = 2.6:1. Payback = £160 / £29.25 = <strong>5.5 months<\/strong>. Workable, not comfortable.<\/li>\n<li>Diagnosis: cohort analysis shows 41% of churn happens in the first 60 days, and customers who connect their calendar in week one retain at nearly twice the rate. Activation metric: calendar connected within 7 days. Current rate: 38%.<\/li>\n<li>Interventions: move the connection into the signup flow, add a one-click integration, send a day-2 nudge with a 90-second video, give human onboarding above a threshold. Activation reaches 55% over a quarter; churn falls 7% → 5.5%.<\/li>\n<li>New numbers: lifetime 18.2 months, LTV <strong>£532<\/strong> (+27%). At the same 2.6:1 ratio, affordable CAC rises to <strong>£204<\/strong>, with payback at that CAC of 7.0 months.<\/li>\n<li>What that buys: £204 CAC opens channels that were unaffordable at £160 — broader prospecting, higher-CPC keywords, sponsorships — while total customers grow both from lower churn and from more addressable acquisition. And it compounds, because every future cohort inherits it, which no ad optimisation ever does.<\/li>\n<\/ul>\n<p>Nobody in the ad account produced that result. It came from one cohort analysis, one activation metric and three product changes.<\/p>", "text": "Worked example. A £45/month subscription, 65% gross margin, 7% monthly churn, CAC £160. Lifetime 14.3 months. LTV = £45 × 0.65 × 14.3 = £418 . LTV:CAC = 2.6:1. Payback = £160 / £29.25 = 5.5 months . Workable, not comfortable. Diagnosis: cohort analysis shows 41% of churn happens in the first 60 days, and customers who connect their calendar in week one retain at nearly twice the rate. Activation metric: calendar connected within 7 days. Current rate: 38%. Interventions: move the connection into the signup flow, add a one-click integration, send a day-2 nudge with a 90-second video, give human onboarding above a threshold. Activation reaches 55% over a quarter; churn falls 7% → 5.5%. New numbers: lifetime 18.2 months, LTV £532 (+27%). At the same 2.6:1 ratio, affordable CAC rises to £204 , with payback at that CAC of 7.0 months. What that buys: £204 CAC opens channels that were unaffordable at £160 — broader prospecting, higher-CPC keywords, sponsorships — while total customers grow both from lower churn and from more addressable acquisition. And it compounds, because every future cohort inherits it, which no ad optimisation ever does. Nobody in the ad account produced that result. It came from one cohort analysis, one activation metric and three product changes."}, {"h": "2026 reality check", "html": "<ul>\n<li><strong>Rising acquisition costs make retention the arbitrage.<\/strong> With buying automated (Performance Max, Advantage+), most competitors run similar algorithms against similar audiences, so targeting cleverness is largely gone as an edge. Being able to pay more per customer than your competitor is one of the few remaining structural advantages.<\/li>\n<li><strong>First-party data is now an input to the ad platforms, not just a mailing list.<\/strong> Customer lists, offline conversion imports and value-based bidding signals are how you steer black boxes, so a well-maintained owned audience improves acquisition performance directly.<\/li>\n<li><strong>Zero-click search rewards direct relationships.<\/strong> With ~60% of Google searches ending without a click and AI Overviews compressing organic CTR, audiences you can reach without an intermediary are worth more relative to rented reach than they were.<\/li>\n<li><strong>AI shortens time-to-value.<\/strong> In-product assistance, automated setup and generated starting configurations genuinely reduce the gap between signup and first benefit — one of the clearer non-hype applications of AI to a growth problem (M18).<\/li>\n<\/ul>", "text": "Rising acquisition costs make retention the arbitrage. With buying automated (Performance Max, Advantage+), most competitors run similar algorithms against similar audiences, so targeting cleverness is largely gone as an edge. Being able to pay more per customer than your competitor is one of the few remaining structural advantages. First-party data is now an input to the ad platforms, not just a mailing list. Customer lists, offline conversion imports and value-based bidding signals are how you steer black boxes, so a well-maintained owned audience improves acquisition performance directly. Zero-click search rewards direct relationships. With ~60% of Google searches ending without a click and AI Overviews compressing organic CTR, audiences you can reach without an intermediary are worth more relative to rented reach than they were. AI shortens time-to-value. In-product assistance, automated setup and generated starting configurations genuinely reduce the gap between signup and first benefit — one of the clearer non-hype applications of AI to a growth problem (M18)."}, {"h": "Common mistakes", "html": "<ul>\n<li><strong>Reporting an average retention rate<\/strong> instead of cohort curves, hiding every trend that matters.<\/li>\n<li><strong>Computing LTV on revenue instead of gross profit,<\/strong> then over-spending on the strength of a number 40% too high.<\/li>\n<li><strong>Projecting LTV to infinity<\/strong> on a constant-churn assumption.<\/li>\n<li><strong>Confusing logo and revenue churn<\/strong> and misdiagnosing which customers you are losing.<\/li>\n<li><strong>Chasing a correlated activation metric<\/strong> and pushing users toward a behaviour that never caused anything.<\/li>\n<li><strong>Launching a referral programme to fix bad word of mouth.<\/strong><\/li>\n<li><strong>Calling a referral programme a network effect.<\/strong><\/li>\n<li><strong>Discounting to reduce churn,<\/strong> which retains price-sensitive customers and trains everyone to wait for the offer.<\/li>\n<li><strong>Treating retention as the product team's problem<\/strong> and never bringing it to the budget meeting.<\/li>\n<li><strong>Ignoring payback in a paid loop<\/strong> and running out of cash while profitable on paper.<\/li>\n<\/ul>", "text": "Reporting an average retention rate instead of cohort curves, hiding every trend that matters. Computing LTV on revenue instead of gross profit, then over-spending on the strength of a number 40% too high. Projecting LTV to infinity on a constant-churn assumption. Confusing logo and revenue churn and misdiagnosing which customers you are losing. Chasing a correlated activation metric and pushing users toward a behaviour that never caused anything. Launching a referral programme to fix bad word of mouth. Calling a referral programme a network effect. Discounting to reduce churn, which retains price-sensitive customers and trains everyone to wait for the offer. Treating retention as the product team's problem and never bringing it to the budget meeting. Ignoring payback in a paid loop and running out of cash while profitable on paper."}, {"h": "Exercise (25 minutes)", "html": "<p>For <strong>your chosen business<\/strong>:<\/p>\n<ol>\n<li><strong>Build a cohort table.<\/strong> Six monthly cohorts, retention at months 1, 3 and 6 — real numbers if you have them, estimates if not. Answer in one sentence: does the curve flatten, and at what level?<\/li>\n<li><strong>Churn to LTV to max CAC.<\/strong> Compute current churn, average lifetime, LTV on gross profit, and max CAC at your chosen ratio. Recompute with a 25% relative churn improvement and state the change in max CAC and payback.<\/li>\n<li><strong>Name your activation metric<\/strong> — the specific first-week or first-order behaviour you believe predicts retention — and how you would test whether it is causal rather than correlated.<\/li>\n<li><strong>Time-to-value audit.<\/strong> List every step between signup and first real benefit. Cross out the unnecessary ones. Estimate the time saved.<\/li>\n<li><strong>Design one loop<\/strong> (viral, content, paid or UGC) as a numbered cycle where the last step feeds the first, and state the one number that determines whether it compounds — k, publishing rate, payback period or posting rate.<\/li>\n<li><strong>The comparison.<\/strong> In three sentences, argue which is worth more next quarter — a 20% churn improvement or 20% more acquisition spend — using your numbers from questions 2 and 5, and what would have to be true for the answer to flip.<\/li>\n<\/ol>", "text": "For your chosen business : Build a cohort table. Six monthly cohorts, retention at months 1, 3 and 6 — real numbers if you have them, estimates if not. Answer in one sentence: does the curve flatten, and at what level? Churn to LTV to max CAC. Compute current churn, average lifetime, LTV on gross profit, and max CAC at your chosen ratio. Recompute with a 25% relative churn improvement and state the change in max CAC and payback. Name your activation metric — the specific first-week or first-order behaviour you believe predicts retention — and how you would test whether it is causal rather than correlated. Time-to-value audit. List every step between signup and first real benefit. Cross out the unnecessary ones. Estimate the time saved. Design one loop (viral, content, paid or UGC) as a numbered cycle where the last step feeds the first, and state the one number that determines whether it compounds — k, publishing rate, payback period or posting rate. The comparison. In three sentences, argue which is worth more next quarter — a 20% churn improvement or 20% more acquisition spend — using your numbers from questions 2 and 5, and what would have to be true for the answer to flip."}, {"h": "Recall (10 minutes)", "html": "<p>Close everything. Write from memory:<\/p>\n<ol>\n<li>Why a churn improvement raises the CAC you can afford, with the arithmetic.<\/li>\n<li>Logo churn vs revenue churn, and what NRR above 100% means.<\/li>\n<li>What a flattening cohort curve tells you and what a non-flattening one tells you.<\/li>\n<li>Time-to-value and activation metric, and the trap in choosing an activation metric.<\/li>\n<li>Four growth loops with one concrete example each.<\/li>\n<li>A loop vs a network effect.<\/li>\n<li>Three features of referral programmes that work.<\/li>\n<\/ol>", "text": "Close everything. Write from memory: Why a churn improvement raises the CAC you can afford, with the arithmetic. Logo churn vs revenue churn, and what NRR above 100% means. What a flattening cohort curve tells you and what a non-flattening one tells you. Time-to-value and activation metric, and the trap in choosing an activation metric. Four growth loops with one concrete example each. A loop vs a network effect. Three features of referral programmes that work."}, {"h": "If you remember one thing", "html": "<p><strong>Retention sets the price you can afford to pay for a customer.<\/strong> Every point of churn you remove raises max CAC, opens channels your competitors cannot afford, and compounds across every future cohort — which no ad optimisation ever does.<\/p>", "text": "Retention sets the price you can afford to pay for a customer. Every point of churn you remove raises max CAC, opens channels your competitors cannot afford, and compounds across every future cohort — which no ad optimisation ever does."}], "suggest": [["Why does buying the same customer get more expensive each month?", "Trace the chain from retention to LTV to outbidding a competitor", "Why is retention the argument nobody makes in the budget meeting?"], ["Where does lifetime equals one divided by churn come from?", "Redo this LTV arithmetic at £20/month with a 40% gross margin", "How do I compute LTV when my business has no subscription?"], ["How do I tell a causal activation metric from a merely correlated one?", "What did fixing calendar connection do to payback in this example?", "What is my equivalent of 'connect your calendar' in week one?"], ["How does a well-kept owned audience improve paid acquisition directly?", "What does value-based bidding need from my first-party data?", "If targeting cleverness is gone, what edge is left for a small brand?"], ["Why is a referral programme the wrong fix for bad word of mouth?", "Show how revenue-based LTV inflates the number by roughly 40%", "What kind of customer does discounting to reduce churn actually retain?"], ["How do I build six cohorts from a year of messy, partial data?", "Walk me through a 25% churn improvement and its effect on max CAC", "How would I test whether my chosen activation metric is causal?"], ["What does a cohort curve that never flattens tell me about the product?", "Give me four growth loops with one concrete example each", "What separates a growth loop from a genuine network effect?"], ["Why does churn compound across future cohorts when ad tweaks do not?", "What is one point of churn worth in max CAC at my price point?", "With very little time, which retention work should I do first?"]], "assess": {"predict": "Two subscription businesses have identical products and prices, but one loses 3 percent of customers a month and the other loses 8 percent. Guess one advantage the first has when both bid on the same ad.", "quiz": [{"q": "A £60 per month subscription has a 55 percent gross margin and 6 percent monthly churn. At a 3:1 LTV:CAC target, what is the most you can pay to acquire a customer?", "options": ["About £183.", "About £333.", "About £550.", "About £110."], "answer": 0, "why": "Lifetime is 1 divided by 0.06, about 16.7 months; LTV on gross profit is £60 x 0.55 x 16.7, about £550; at 3:1 that is roughly £183. The £333 answer computes LTV on revenue rather than gross profit, which is the listed mistake that leads companies to over-spend on a number around 40 percent too high."}, {"q": "That same business cuts churn from 6 percent to 4.5 percent, a 25 percent relative improvement. What happens to lifetime and max CAC?", "options": ["Lifetime rises about 25 percent, to roughly 21 months, and max CAC rises about 25 percent to £229.", "Lifetime is unchanged; only payback improves, because customers pay for longer.", "Lifetime rises to about 22.2 months, LTV to about £733, and max CAC to about £244.", "Lifetime rises to about 18 months and max CAC to about £198."], "answer": 2, "why": "1 divided by 0.045 is 22.2 months, so LTV is £33 of monthly gross profit times 22.2, about £733, and max CAC at 3:1 is about £244 - a 33 percent rise in acquisition power from a 25 percent churn improvement. Assuming lifetime moves in proportion to the churn cut misses that the relationship is reciprocal, not linear."}, {"q": "Your cohort table shows month-6 retention of 34, 33, 35 and 36 percent across four consecutive cohorts, with each curve dropping steeply then levelling from about month four. What is the right reading?", "options": ["Losing 65 percent of customers by month six means retention is the emergency to fix before anything else.", "The curve flattens around 35 percent, so there is a durable core; growth compounds on top of that plateau, and later cohorts are holding or slightly improving.", "Report the average retention rate across all customers to the board, as it is the cleanest summary.", "Later cohorts are worse, which suggests a channel change brought in poorer customers."], "answer": 1, "why": "A curve that drops then levels means a durable core genuinely needs the product, and that plateau is the real business; a curve declining toward zero is the emergency. Averaging across all customers is explicitly wrong because a growing company's average is dominated by new joiners and hides every trend that matters."}, {"q": "Analysis shows customers who invite a teammate in week one retain at twice the rate of those who do not. The product team proposes forcing everyone through a mandatory invite step. What is the judgment?", "options": ["Do it. A doubling is a strong enough signal to act on immediately.", "Do it, and measure the result with a before-after comparison of the next two months.", "Use inviting as a lagging indicator in the board pack instead of a leading one.", "Test whether it is causal first. If inviting is a symptom of already-motivated users, pushing everyone toward it changes nothing."], "answer": 3, "why": "An activation metric must be causally plausible, not merely correlated; chasing a correlated metric and pushing users toward a behaviour that never caused anything is a listed mistake. The before-after option is doubly wrong, since M14 established that before-after comparisons measure your change plus everything else that happened."}, {"q": "Your content loop runs: publish, rank or get shared, attract users, users leave reviews and questions, that becomes more publishable material. What have you built?", "options": ["A network effect, since more users make the content better for everyone.", "A viral loop, correctly measured by the viral coefficient k.", "A growth loop but not a network effect: it makes you bigger, not more useful per user, so it creates efficiency rather than defensibility.", "A paid loop, whose speed limit is the payback period."], "answer": 2, "why": "A loop is a growth mechanism where output feeds input; a network effect is a value mechanism where the product gets better for each user as more join. Calling a loop a network effect is a named mistake, and the distinction matters because network effects create defensibility while loops only create efficiency."}, {"q": "A wedding venue owner asks whether to redirect budget from acquisition into churn reduction, having read that retention beats acquisition. What do you tell her?", "options": ["For a genuinely one-off high-ticket purchase, acquisition remains the main engine, and retention is redefined as referrals, reviews, reputation and adjacent services.", "Retention beats acquisition almost always, so redirect the budget and build a loyalty programme.", "Compute LTV projected to infinity first, since a venue's brand lasts decades.", "Launch a referral programme with a cash bounty to compensate for the lack of repeat purchase."], "answer": 0, "why": "Retention wins for subscription and repeat-purchase businesses, but nobody buys a second loft conversion, and the module names one-off high-ticket purchases as the exception. A cash bounty is the wrong reward too: it attracts people who want cash and produces customers who churn."}], "cards": [{"front": "Why does a churn improvement raise the CAC you can afford?", "back": "Lifetime is one over churn, so lower churn lengthens lifetime and raises LTV on gross profit. At a fixed LTV:CAC ratio a higher LTV means a higher max CAC, letting you outbid competitors for the same click."}, {"front": "Logo churn versus revenue churn, and what does NRR above 100 percent mean?", "back": "Logo churn counts customers lost, revenue churn counts money lost, and the gap shows which customers you are losing. NRR above 100 percent means expansion outgrows churn, so the base grows while acquiring nobody."}, {"front": "What does a flattening cohort curve tell you, and a non-flattening one?", "back": "Flattening means a durable core genuinely needs the product and growth compounds on that plateau. Declining toward zero means no core exists, so you must acquire forever, faster, just to stand still."}, {"front": "Time-to-value, activation metric, and the trap in choosing one.", "back": "Time-to-value is elapsed time from signup to first real benefit. The activation metric is the observable early behaviour that predicts retention. The trap is picking a symptom of already-motivated users rather than a causal behaviour."}, {"front": "Name four growth loops with an example each.", "back": "Viral: invites inside a collaboration tool. Content: reviews and questions becoming publishable pages. Paid: margin funding the next acquisition, limited by payback. UGC: customers posting after delivery. B2B word of mouth: a reference shortening the next deal."}, {"front": "What makes a referral programme actually work?", "back": "A product worth talking about, a double-sided reward so sharing is a favour, credit rather than cash, asked at the moment of realised value, frictionless mechanics, and measured on retained referred customers rather than shares."}], "elaborate": ["Compute the whole chain for your chosen business: churn or repeat rate, average lifetime, LTV on gross profit at a capped horizon, max CAC at your chosen ratio, and payback. Recompute it with a 25 percent relative churn improvement and name the specific channels the new max CAC would make affordable that are closed to you today.", "M15 said the right allocation equalises marginal return across channels. Using your own numbers, argue in three sentences whether a 20 percent churn improvement or 20 percent more acquisition spend is worth more next quarter, and state what would have to be true for the answer to flip."], "transfer": {"scenario": "A £39 per month B2B tool has a 70 percent gross margin, 9 percent monthly churn and a CAC of £190. Cohort analysis shows 45 percent of churn happens in the first 45 days, and customers who import their data in week one retain at roughly twice the rate; the current week-one import rate is 31 percent. The founder wants to put an extra £8,000 a month into Google Ads rather than fix onboarding, because ads produce customers this quarter and onboarding work does not.", "prompt": "Decide where the £8,000 goes, and justify it with the arithmetic.", "model": "Fix onboarding first. Today lifetime is 1 divided by 0.09, about 11.1 months; monthly gross profit is £27.30, so LTV is roughly £303 against a £190 CAC. That is 1.6:1 with a seven-month payback, so an extra £8,000 buys about 42 customers a month at a ratio that barely works. The cohort data points at the real lever: 45 percent of churn lands in the first 45 days, and week-one data import roughly doubles retention at only a 31 percent import rate. Test whether importing is causal rather than a symptom of motivated users, then move it into signup, add a one-click path and a day-two nudge. If churn falls from 9 to 6.5 percent, lifetime reaches 15.4 months and LTV about £420, a 39 percent gain that every future cohort inherits and that raises the CAC we can afford. No ad optimisation compounds like that."}}}, {"id": "M18", "num": 18, "part": "p3", "title": "The AI-Native Marketing Stack", "short": "AI-native marketing", "meta": "60 minutes (25 read · 25 exercise · 10 recall)", "minutes": 60, "sections": [{"h": "Why this matters", "html": "<p>Two opposite errors are common in 2026, and both are expensive.<\/p>\n<p>The first is treating AI as a novelty and doing by hand work a model does in seconds. That person is several times slower than a competent peer at the same job, and it shows in output volume.<\/p>\n<p>The second is treating AI as a strategy: publishing 400 undifferentiated articles, generating ad copy with no positioning behind it, and being confused when nothing works. Production was never the scarce resource; being worth reading was.<\/p>\n<p>This module draws the line — where AI creates leverage, where it destroys value, and what a working process looks like.<\/p>", "text": "Two opposite errors are common in 2026, and both are expensive. The first is treating AI as a novelty and doing by hand work a model does in seconds. That person is several times slower than a competent peer at the same job, and it shows in output volume. The second is treating AI as a strategy: publishing 400 undifferentiated articles, generating ad copy with no positioning behind it, and being confused when nothing works. Production was never the scarce resource; being worth reading was. This module draws the line — where AI creates leverage, where it destroys value, and what a working process looks like."}, {"h": "Core concepts", "html": "<h3>Where AI genuinely creates leverage<\/h3>\n<ul>\n<li><strong>Research synthesis.<\/strong> Reading 60 competitor pages, 200 reviews or a market report and returning a structured summary. The bottleneck was reading time, and that is what a model removes. Verify claims that matter.<\/li>\n<li><strong>First drafts, never final ones.<\/strong> A draft is faster to fix than a blank page is to fill; the value is in the editing that follows.<\/li>\n<li><strong>Creative variant production.<\/strong> Ten headline angles, six hooks, five image concepts for one offer. In an Advantage+ / Performance Max world, creative volume and diversity is the main input you control (M11, M15) — the clearest ROI use in paid media.<\/li>\n<li><strong>Ad copy at scale.<\/strong> Hundreds of ad-group-specific descriptions, or per-SKU copy for thousands of products, generated from structured data. Manually infeasible; mechanically straightforward.<\/li>\n<li><strong>Data analysis and the annoying technical layer.<\/strong> SQL, spreadsheet formulas, regex, cleaning a messy export. This quietly removes the biggest tax on a non-technical marketer.<\/li>\n<li><strong>Customer feedback clustering.<\/strong> Group 3,000 reviews, tickets or survey responses into themes with representative quotes. A week of someone's life becomes an afternoon, and it feeds positioning (M03) and hypothesis generation (M14) directly.<\/li>\n<li><strong>Personalisation at scale.<\/strong> Segment-specific landing pages, industry-specific case-study framings, per-persona emails. Personalisation was always limited by production capacity, and that limit is gone.<\/li>\n<li><strong>Campaign QA.<\/strong> Checking hundreds of links for correct UTMs, verifying tracking parameters, cross-checking copy against character limits and brand rules.<\/li>\n<li><strong>Translation and localisation first passes,<\/strong> with a native speaker reviewing anything customer-facing.<\/li>\n<\/ul>\n<p>The pattern: AI is strongest where work is <strong>high-volume, structured, verifiable, and bounded by production capacity rather than by judgment.<\/strong><\/p>\n<h3>Where AI destroys value<\/h3>\n<ul>\n<li><strong>Commodity content.<\/strong> Generic articles restating what is already on page one. Answer engines already synthesise that, and with ~60% of Google searches ending click-free, the marginal generic article earns close to nothing. This is where most AI marketing spend is currently wasted.<\/li>\n<li><strong>Generic brand voice.<\/strong> Default output converges on the same smooth, hedged, faintly enthusiastic register. If your copy is indistinguishable from your competitor's, you deleted your differentiation to save an hour.<\/li>\n<li><strong>Fabricated facts.<\/strong> Models invent statistics, studies, quotes and product features with complete confidence. One published fabrication can cost more credibility than the content earns in a year. Every figure, citation, price and capability claim needs a source.<\/li>\n<li><strong>Losing the customer contact that generates insight.<\/strong> The subtle one. If AI reads all the reviews and summarises all the calls, you get the conclusions but not the texture — the exact phrase a customer used, the hesitation before an objection. The best positioning comes from that texture. Use AI to widen coverage, not to replace the ten conversations you have yourself.<\/li>\n<li><strong>Automating a bad strategy,<\/strong> so a wrong plan fails faster and at larger scale.<\/li>\n<li><strong>Anything needing accountability you cannot provide<\/strong> — legal, medical, financial or regulated claims. You own the output regardless of what produced it.<\/li>\n<\/ul>\n<h3>The workflow: human strategy → AI production → human editing<\/h3>\n<p><strong>Human sets strategy.<\/strong> What we are saying, to whom, why it beats the alternative, what proof we have, what the constraint is. This comes from Parts 1 and 2 and cannot be delegated — a model has no access to your customers, your margins, or the argument you had with sales last week.<\/p>\n<p><strong>AI produces.<\/strong> Drafts, variants, structures, analysis, first passes. Volume, speed, coverage.<\/p>\n<p><strong>Human edits with taste.<\/strong> Cut the hedging. Replace the generic claim with the specific one only you know. Add the number, the customer quote, the opinion a model will not risk. Check every fact. Ask whether anyone would forward this.<\/p>\n<p>Skip the first step and you produce fluent nonsense; skip the last and you produce fluent averageness. <strong>AI shifts the marketer's time from producing to specifying and judging<\/strong> — the higher-value half of the job anyway.<\/p>\n<h3>Prompting for marketing tasks<\/h3>\n<p>The difference between useless and useful output is almost entirely context. \"Write five Facebook ads for my accounting software\" gets everyone the same five ads. A strong prompt has five components:<\/p>\n<ol>\n<li><strong>Role and task<\/strong>, specifically: \"cold-audience Meta ads for a first-touch prospecting campaign.\"<\/li>\n<li><strong>The ICP<\/strong> — who, their situation, their trigger, the language they use, what they have already tried (M02).<\/li>\n<li><strong>The positioning<\/strong> — category, primary alternative, the one differentiator and its proof (M03).<\/li>\n<li><strong>Examples<\/strong> — two or three pieces you consider good and one you consider bad, with a sentence on why. This does more than any other single element.<\/li>\n<li><strong>Constraints<\/strong> — length, format, forbidden words and claims, reading level, the action, and what the copy must not promise.<\/li>\n<\/ol>\n<p>Then iterate for <strong>range rather than polish<\/strong>: \"give me five that are angrier, five more specific, five that lead with the objection.\" Critique in your own words rather than accepting the first plausible option, and ask the model to argue against its own draft — \"what would a sceptical buyer say to this?\" — before taking it seriously.<\/p>\n<h3>The context file<\/h3>\n<p>Write your positioning and voice down once, in a file, and attach it at the start of every marketing task. This is the highest-return hour in this module.<\/p>\n<p>Contents: company and product in three sentences; ICP with situation, trigger and budget reality; positioning statement, alternative, differentiator, proof; the message hierarchy; <strong>voice rules<\/strong> in five to eight concrete lines (\"short sentences; no exclamation marks; never say 'seamless' or 'game-changing'; we say 'you' not 'businesses'; we state prices\"); <strong>proof assets<\/strong> — real numbers and real customer quotes, which is what stops the model inventing them; forbidden claims; and two or three examples of on-brand copy.<\/p>\n<p>Keep it under two pages, version it, and update it when positioning changes. It converts AI from a generic writer into something that sounds like your company — and it is the artefact that lets everyone else on the team use AI without re-explaining the business.<\/p>\n<h3>AI for competitive and customer research<\/h3>\n<ul>\n<li><strong>Competitor teardowns.<\/strong> Feed in their pages, ads and pricing; get positioning, claimed differentiators, target segment and gaps. Cross-check what it asserts.<\/li>\n<li><strong>Review mining.<\/strong> Cluster competitor reviews by theme and extract recurring complaints — the cheapest source of positioning angles that exists.<\/li>\n<li><strong>Interview processing.<\/strong> Transcribe and cluster your own calls (M02), but read some transcripts yourself, and ask for verbatim quotes rather than paraphrases so you keep the customer's actual language.<\/li>\n<li><strong>Search and intent landscape.<\/strong> Cluster keywords into topics and map them to funnel stages, checking volumes against real tools rather than model estimates.<\/li>\n<\/ul>\n<p>Standing rule: <strong>AI is reliable at organising information you give it, and unreliable at recalling information it was not given.<\/strong> Structure your research use around that boundary.<\/p>\n<h3>AI agents for reporting<\/h3>\n<p>Reporting is repetitive, rule-based and high-volume — a good fit. Pull platform data on a schedule, compute the same metrics weekly, write a first-pass narrative of what changed, flag anomalies (spend pacing, tracking breakage, a conversion count that dropped to zero), and draft the monthly report structure from M13.<\/p>\n<p>What stays human: which metrics matter, what counts as an anomaly worth escalating, causal interpretation, and the confidence note. An agent will confidently explain a 30% drop that was actually a broken tag. Automate the assembly; own the interpretation. Anomaly detection is arguably the highest-value automation available to a small team, because the expensive failures in marketing are the silent ones that ran for three weeks.<\/p>\n<h3>Optimising for answer engines as a channel<\/h3>\n<p>A distinct discipline, covered in depth in M08. It belongs here because its logic inverts the content-volume temptation.<\/p>\n<p>With roughly 60% of Google searches ending without a click and AI Overviews sharply reducing top-position organic CTR, a growing share of buyers form opinions inside an answer rather than on your site. The question shifts from \"do we rank\" to <strong>\"are we the brand the model names, and is what it says about us accurate.\"<\/strong><\/p>\n<p>What appears to matter: being mentioned across the third-party sources models draw on (review sites, comparison pages, forums, industry press); clear extractable content — definitions, comparison tables, specifications, prices; structured data; consistent entity information; and original material — proprietary data, research, distinctive expert opinion — that a synthesiser has to cite because it exists nowhere else.<\/p>\n<p>That last point is the crux: <strong>the content most likely to be cited by an answer engine is precisely the content AI cannot generate<\/strong>, because it is new information. The correct response to AI-abundant content is not more AI content; it is original research, first-hand data, and named expert opinion.<\/p>\n<p>Measurement is immature. Track branded search volume, direct traffic, referrals from AI assistants where your analytics identifies them, and periodically ask the major
