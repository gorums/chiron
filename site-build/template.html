<title>Marketing Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f1; --surface:#ffffff; --surface-2:#f1eee8; --surface-3:#e9e5dd;
  --text:#191817; --text-2:#4a4744; --muted:#7a756e; --line:#e2ddd4; --line-2:#cfc8bb;
  --accent:#0f6b60; --accent-2:#0b544b; --accent-soft:#dcefec; --accent-ink:#0a4f47;
  --warm:#b45309; --warm-soft:#fdf1e0;
  --ok:#137a4a; --ok-soft:#dff2e6; --bad:#a32b2b; --bad-soft:#fbe6e4;
  --shadow:0 1px 2px rgba(25,24,23,.05),0 8px 24px rgba(25,24,23,.06);
  --shadow-lg:0 2px 6px rgba(25,24,23,.07),0 24px 60px rgba(25,24,23,.13);
  --radius:14px; --radius-sm:9px;
  --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131518; --surface:#1a1d21; --surface-2:#22262b; --surface-3:#2b3037;
    --text:#eceae7; --text-2:#c3c0bb; --muted:#8f8b85; --line:#2b2f35; --line-2:#3a4048;
    --accent:#4fd1c0; --accent-2:#6fe0d1; --accent-soft:#16302d; --accent-ink:#8ceadd;
    --warm:#e0a458; --warm-soft:#2e2415;
    --ok:#5cc98d; --ok-soft:#14301f; --bad:#f08b84; --bad-soft:#33191a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.30);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#131518; --surface:#1a1d21; --surface-2:#22262b; --surface-3:#2b3037;
  --text:#eceae7; --text-2:#c3c0bb; --muted:#8f8b85; --line:#2b2f35; --line-2:#3a4048;
  --accent:#4fd1c0; --accent-2:#6fe0d1; --accent-soft:#16302d; --accent-ink:#8ceadd;
  --warm:#e0a458; --warm-soft:#2e2415;
  --ok:#5cc98d; --ok-soft:#14301f; --bad:#f08b84; --bad-soft:#33191a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.30);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink);text-underline-offset:3px}
::selection{background:var(--accent-soft)}
.hidden{display:none !important}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
#sidebar{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain}
#main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:center;padding:10px 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.view{padding:26px 22px 100px;flex:1}
.wrap{max-width:780px;margin:0 auto}
.wrap-wide{max-width:1080px;margin:0 auto}

/* ---------- sidebar ---------- */
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--serif);font-size:19px;margin:0;letter-spacing:-.2px;font-weight:600}
.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.ringwrap:hover{background:var(--surface-2)}
.ring{width:46px;height:46px;flex:none}
.ringtxt{font-size:12px;color:var(--muted);line-height:1.35}
.ringtxt b{display:block;font-size:15px;color:var(--text);font-weight:600}
.navsec{padding:14px 12px 4px}
.navsec h2{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 8px;font-weight:600}
.navlink{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:none;border-radius:8px;font-size:13.5px;color:var(--text-2);text-align:left}
.navlink:hover{background:var(--surface-2);color:var(--text)}
.navlink.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navlink .ico{width:16px;flex:none;opacity:.8;display:flex}
.pill{margin-left:auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warm-soft);color:var(--warm)}
.partgroup{margin:0 0 2px}
.parthead{display:flex;align-items:baseline;gap:8px;padding:12px 20px 5px}
.parthead .pn{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.parthead .ph{font-size:10.5px;color:var(--line-2);margin-left:auto}
.mrow{display:flex;align-items:center;gap:9px;width:100%;padding:6px 12px 6px 20px;border:0;background:none;text-align:left;font-size:13.5px;color:var(--text-2);border-left:2px solid transparent}
.mrow:hover{background:var(--surface-2);color:var(--text)}
.mrow.active{background:var(--accent-soft);color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}
.mrow .code{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;width:26px}
.mrow.active .code{color:var(--accent-ink)}
.mrow .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.dot.part{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.done{background:var(--accent);border-color:var(--accent)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:500;transition:.13s}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0b1a18}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.searchbtn{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.searchbtn:hover{border-color:var(--line-2)}
.searchbtn kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:10.5px;padding:1.5px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

/* ---------- cards & type ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.tight{padding:15px}
h2.big{font-family:var(--serif);font-size:27px;line-height:1.2;margin:0 0 6px;font-weight:600;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .n{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warm-soft);color:var(--warm)}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- reading ---------- */
.readhead{margin-bottom:18px}
.readhead .crumb{font-size:12px;color:var(--muted);margin-bottom:7px}
.readhead h2{font-family:var(--serif);font-size:32px;line-height:1.15;margin:0 0 8px;font-weight:600;letter-spacing:-.6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 22px;padding-bottom:2px}
.step{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);font-weight:500}
.step:hover{border-color:var(--line-2);color:var(--text)}
.step.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .step.on{color:#0b1a18}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .step.on{color:#0b1a18}}
.step .num{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--surface-3);font-size:10.5px;font-weight:700}
.step.on .num{background:rgba(255,255,255,.25)}
.step.did{border-color:var(--accent);color:var(--accent-ink)}
.step.did .num{background:var(--accent-soft);color:var(--accent-ink)}

.sec{border-top:1px solid var(--line);padding:20px 0 4px}
.sec:first-child{border-top:0}
.sechead{display:flex;align-items:flex-start;gap:11px;margin-bottom:2px}
.check{flex:none;width:21px;height:21px;margin-top:5px;border-radius:6px;border:1.5px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{opacity:0;width:12px;height:12px}
.check.on svg{opacity:1}
.sechead h3{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;letter-spacing:-.3px;flex:1}
.sec.done .prose{opacity:.62}
.prose{font-size:16.5px;line-height:1.72;color:var(--text-2);padding-left:32px}
.prose h3{font-size:17px;font-weight:700;color:var(--text);margin:26px 0 8px;font-family:var(--sans);letter-spacing:-.1px}
.prose h4{font-size:15px;font-weight:700;color:var(--text);margin:20px 0 6px}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 15px;padding-left:22px}
.prose li{margin:0 0 7px}
.prose strong{color:var(--text);font-weight:650}
.prose blockquote{margin:18px 0;padding:13px 18px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;color:var(--text);font-size:16px}
.prose blockquote p:last-child{margin:0}
.prose code{font-family:var(--mono);font-size:.87em;background:var(--surface-2);padding:1.5px 5px;border-radius:5px;color:var(--text)}
.prose pre{background:var(--surface-2);padding:14px;border-radius:10px;overflow-x:auto;border:1px solid var(--line)}
.prose pre code{background:none;padding:0}
.prose table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14.5px;display:block;overflow-x:auto}
.prose th{text-align:left;padding:9px 11px;background:var(--surface-2);border-bottom:1px solid var(--line-2);font-size:12.5px;letter-spacing:.02em;color:var(--text);white-space:nowrap}
.prose td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.prose hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.prose a{color:var(--accent-ink)}
.toc{position:sticky;top:78px;font-size:12.5px;line-height:1.5}
.toc a{display:block;padding:5px 10px;color:var(--muted);text-decoration:none;border-left:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a:hover{color:var(--text)}
.toc a.on{color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}

/* ---------- quiz ---------- */
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);margin-bottom:9px;transition:.12s;font-size:15px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.why{margin-top:12px;padding:14px 16px;border-radius:11px;background:var(--surface-2);border-left:3px solid var(--accent);font-size:14.5px;color:var(--text-2)}
.conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2)}
.qmeta{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.qmeta .bar{flex:1;max-width:180px}

/* ---------- flashcards ---------- */
.flash{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:34px 26px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);cursor:pointer}
.flash .front{font-family:var(--serif);font-size:23px;line-height:1.35;font-weight:600;letter-spacing:-.3px}
.flash .back{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:16px;color:var(--text-2);max-width:560px}
.gradebar{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.gradebar button{padding:11px 6px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center}
.gradebar button:hover{border-color:var(--accent);background:var(--accent-soft)}
.gradebar small{font-weight:400;font-size:10.5px;color:var(--muted)}

/* ---------- palette ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,14,13,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px 20px}
.palette{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;max-height:70vh;display:flex;flex-direction:column}
.palette input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 18px;font-size:16px;background:transparent}
.palette input:focus{outline:0}
.results{overflow-y:auto;padding:7px}
.res{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:9px}
.res:hover,.res.on{background:var(--accent-soft)}
.res .t{font-size:14px;font-weight:600;color:var(--text)}
.res .c{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg);padding:24px;max-height:76vh;overflow-y:auto}

/* ---------- misc ---------- */
.glossrow{padding:11px 0;border-bottom:1px solid var(--line)}
.glossrow b{color:var(--text);font-weight:650}
.star{color:var(--warm);font-weight:700}
.modelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s}
.modelcard:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.modelcard h3{font-family:var(--serif);font-size:18px;margin:0 0 4px;font-weight:600}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-family:var(--serif);font-size:22px;color:var(--text);margin-bottom:6px}
.calrow{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;padding:8px 0;font-size:13.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:500;z-index:200;opacity:0;transition:.28s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.footnav{display:flex;gap:10px;justify-content:space-between;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;padding:11px 14px;background:var(--surface-2);border-radius:10px;line-height:1.5}
.hint .i{flex:none;font-weight:700;color:var(--accent)}
.readbar{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:60;transition:width .12s}
#menubtn{display:none}

/* ---------- marks, ask ---------- */
mark.hl{background:var(--warm-soft);box-shadow:inset 0 -2px 0 var(--warm);color:inherit;padding:1px 0;cursor:pointer;border-radius:2px}
mark.hl:hover{background:var(--warm);color:#fff}
mark.hl.q{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
mark.hl.q:hover{background:var(--accent);color:#fff}
mark.hl.answered{background:var(--ok-soft);box-shadow:inset 0 -2px 0 var(--ok)}
.selbar{position:absolute;z-index:75;display:flex;gap:2px;background:var(--text);border-radius:11px;padding:4px;box-shadow:var(--shadow-lg);transform:translate(-50%,-100%)}
.selbar button{color:var(--bg);background:transparent;border:0;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;display:flex;gap:5px;align-items:center;white-space:nowrap}
.selbar button:hover{background:rgba(127,127,127,.35)}
.selbar .div{width:1px;background:rgba(127,127,127,.4);margin:4px 2px}
.askbtn{flex:none;width:24px;height:24px;margin-top:4px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;transition:.15s}
.sechead:hover .askbtn,.askbtn.has{opacity:1}
.askbtn:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.askbtn.has{color:var(--accent);border-color:var(--line-2)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line-2);z-index:96;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.panel header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel header h3{font-family:var(--serif);font-size:18px;margin:0;font-weight:600;flex:1}
.panel .body{flex:1;overflow-y:auto;padding:18px}
.panel .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
.quote{background:var(--surface-2);border-left:3px solid var(--warm);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;line-height:1.6;color:var(--text-2);max-height:190px;overflow-y:auto}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;color:var(--text-2)}

<script>
const DATA = /*__DATA__*/;
</script>
<script>
/* ============================ state ============================ */
const KEY = "mm_course_v1";
const DAY = 86400000;
const todayNum = () => Math.floor(Date.now() / DAY);
const BRIDGE_DEFAULT = { url: "http://127.0.0.1:8787", key: "", model: "claude-sonnet-5", route: "direct", mode: "none" };
const blank = () => ({
  progress: {}, cards: {}, notes: {}, marks: {}, convos: {}, active: {}, biz: "",
  bridge: Object.assign({}, BRIDGE_DEFAULT),
  streak: { days: 0, last: null, seen: [] },
  theme: null, v: 1
});
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    return Object.assign(blank(), JSON.parse(raw));
  } catch (e) { return blank(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
function P(id) {
  if (!S.progress[id]) S.progress[id] = { secs: {}, predict: "", quiz: null, elab: {}, transfer: null, done: false, doneAt: null, time: 0, step: 0 };
  return S.progress[id];
}
function markDay() {
  const t = todayNum();
  if (S.streak.last === t) return;
  S.streak.days = (S.streak.last === t - 1) ? S.streak.days + 1 : 1;
  S.streak.last = t;
  if (!S.streak.seen.includes(t)) S.streak.seen.push(t);
  S.streak.seen = S.streak.seen.slice(-120);
  save();
}

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MODS = DATA.modules;
const byId = id => MODS.find(m => m.id === id);
const mIndex = id => MODS.findIndex(m => m.id === id);

function secTotal(m) { return m.sections.length; }
function secDone(m) { const p = P(m.id); return m.sections.filter((_, i) => p.secs[i]).length; }
function modPct(m) {
  const p = P(m.id);
  let n = 0, d = 5;
  n += secDone(m) / secTotal(m);
  if (p.predict.trim()) n++;
  if (p.quiz && p.quiz.finished) n++;
  if (Object.values(p.elab).some(v => (v || "").trim())) n++;
  if (p.transfer && p.transfer.score != null) n++;
  return Math.min(1, n / d);
}
function isDone(m) { return P(m.id).done; }
function doneCount() { return MODS.filter(isDone).length; }
function minutesDone() { return MODS.filter(isDone).reduce((a, m) => a + m.minutes, 0); }
function timeSpent() { return MODS.reduce((a, m) => a + (P(m.id).time || 0), 0); }

function quizStats() {
  let right = 0, total = 0;
  const conf = { 1: [0, 0], 2: [0, 0], 3: [0, 0] };
  MODS.forEach(m => {
    const q = P(m.id).quiz;
    if (!q || !q.a) return;
    q.a.forEach(x => {
      if (!x) return;
      total++; if (x.ok) right++;
      const c = conf[x.conf] || conf[2];
      c[1]++; if (x.ok) c[0]++;
    });
  });
  return { right, total, pct: total ? right / total : 0, conf };
}
function cardKey(mid, i) { return mid + ":" + i; }
function dueCards() {
  const t = todayNum(), out = [];
  MODS.forEach(m => {
    (m.assess.cards || []).forEach((c, i) => {
      const k = cardKey(m.id, i), st = S.cards[k];
      if (!st) return;
      if (st.due <= t) out.push({ k, mid: m.id, mtitle: m.title, c, st });
    });
  });
  return out;
}
function cardCount() { return Object.keys(S.cards).length; }
function seedCards(mid) {
  const m = byId(mid); let added = 0;
  (m.assess.cards || []).forEach((c, i) => {
    const k = cardKey(mid, i);
    if (!S.cards[k]) { S.cards[k] = { due: todayNum(), ease: 2.4, ivl: 0, reps: 0, lapses: 0 }; added++; }
  });
  save(); return added;
}
function grade(k, g) {
  const st = S.cards[k]; if (!st) return;
  if (g === 0) { st.ease = Math.max(1.3, st.ease - .2); st.ivl = 0; st.lapses++; st.due = todayNum(); }
  else if (g === 1) { st.ease = Math.max(1.3, st.ease - .15); st.ivl = st.ivl ? Math.max(1, Math.round(st.ivl * 1.2)) : 1; st.due = todayNum() + st.ivl; }
  else if (g === 2) { st.ivl = st.ivl === 0 ? 1 : (st.ivl === 1 ? 3 : Math.round(st.ivl * st.ease)); st.due = todayNum() + st.ivl; }
  else { st.ease = Math.min(2.8, st.ease + .12); st.ivl = st.ivl === 0 ? 3 : Math.round(st.ivl * st.ease * 1.25); st.due = todayNum() + st.ivl; }
  st.reps++; save();
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove("on"), 2100);
}
function fmtH(mins) { const h = mins / 60; return (h % 1 === 0 ? h : h.toFixed(1)) + "h"; }
function fmtClock(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

/* ============================ theme ============================ */
function applyTheme() {
  if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
function cycleTheme() {
  const cur = S.theme;
  S.theme = cur === null ? "light" : (cur === "light" ? "dark" : null);
  save(); applyTheme();
  toast("Theme: " + (S.theme || "system"));
}
applyTheme();

/* ============================ router ============================ */
let route = { v: "home", id: null, step: 0 };
function go(hash) { location.hash = hash; }
function parseHash() {
  const h = (location.hash || "#/home").slice(2).split("/");
  route = { v: h[0] || "home", id: h[1] || null, step: h[2] ? +h[2] : 0 };
}
window.addEventListener("hashchange", () => { parseHash(); render(); window.scrollTo(0, 0); });

/* ============================ sidebar ============================ */
const ICONS = {
  home: "◈", review: "↻", stats: "◔", library: "▤", plan: "✦"
};
function renderSidebar() {
  const pct = doneCount() / MODS.length;
  const due = dueCards().length;
  const R = 20, C = 2 * Math.PI * R;
  let h = `<div class="brand"><h1>Marketing Mastery</h1><p>30 hours · beginner to practitioner</p></div>
  <button class="ringwrap" onclick="go('#/stats')">
    <svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="4"/>
    <circle cx="23" cy="23" r="${R}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" transform="rotate(-90 23 23)"/></svg>
    <span class="ringtxt"><b>${doneCount()} of ${MODS.length} modules</b>${fmtH(minutesDone())} of 30h · ${Math.round(pct * 100)}%</span>
  </button>
  <div class="navsec">
    <button class="navlink ${route.v === "home" ? "active" : ""}" onclick="go('#/home')"><span class="ico">${ICONS.home}</span>Dashboard</button>
    <button class="navlink ${route.v === "review" ? "active" : ""}" onclick="go('#/review')"><span class="ico">${ICONS.review}</span>Review${due ? `<span class="pill">${due}</span>` : ""}</button>
    <button class="navlink ${route.v === "stats" ? "active" : ""}" onclick="go('#/stats')"><span class="ico">${ICONS.stats}</span>Progress &amp; stats</button>
    <button class="navlink ${route.v === "marks" ? "active" : ""}" onclick="go('#/marks')"><span class="ico">✎</span>Marks &amp; questions${openQs() ? `<span class="pill">${openQs()}</span>` : ""}</button>
    <button class="navlink ${route.v === "library" ? "active" : ""}" onclick="go('#/library')"><span class="ico">${ICONS.library}</span>Library</button>
  </div>`;
  DATA.parts.forEach(p => {
    const ms = MODS.filter(m => m.part === p.id);
    h += `<div class="partgroup"><div class="parthead"><span class="pn">${esc(p.name)}</span><span class="ph">${p.hours}h</span></div>`;
    ms.forEach(m => {
      const pc = modPct(m), dn = isDone(m);
      h += `<button class="mrow ${route.v === "m" && route.id === m.id ? "active" : ""}" onclick="go('#/m/${m.id}')">
        <span class="dot ${dn ? "done" : (pc > 0 ? "part" : "")}"></span>
        <span class="code">${m.id}</span><span class="t">${esc(m.short)}</span></button>`;
    });
    h += `</div>`;
  });
  h += `<div class="navsec" style="border-top:1px solid var(--line);margin-top:10px">
    <button class="navlink ${route.v === "settings" ? "active" : ""}" onclick="go('#/settings')"><span class="ico">⚙</span>Settings<span class="dotstat ${bridgeChecking ? "busy" : connMode() !== "none" ? "on" : ""}" style="margin-left:auto"></span></button>
    <button class="navlink" onclick="go('#/plan/curriculum')"><span class="ico">${ICONS.plan}</span>The plan</button>
    <button class="navlink" onclick="openData()"><span class="ico">⇅</span>Backup / restore</button>
  </div><div style="height:24px"></div>`;
  $("#sidebar").innerHTML = h;
  const rb = $("#reviewbtn");
  if (due) { rb.style.display = ""; rb.innerHTML = `↻ ${due} due`; rb.onclick = () => go("#/review"); }
  else rb.style.display = "none";
}

/* ============================ views ============================ */
function viewHome() {
  const done = doneCount(), due = dueCards().length, qs = quizStats();
  const next = MODS.find(m => !isDone(m)) || MODS[MODS.length - 1];
  const inprog = MODS.filter(m => !isDone(m) && modPct(m) > 0);
  const cont = inprog[0] || next;
  const weak = MODS.map(m => {
    const q = P(m.id).quiz;
    if (!q || !q.finished) return null;
    const t = q.a.filter(Boolean), r = t.filter(x => x.ok).length;
    return t.length ? { m, pct: r / t.length } : null;
  }).filter(x => x && x.pct < .7).sort((a, b) => a.pct - b.pct).slice(0, 3);

  let h = `<div class="wrap-wide">
  <p class="eyebrow">${greeting()}</p>
  <h2 class="big">${done === 0 ? "Start with Module 01." : done === MODS.length ? "You finished all 19 modules." : `You are ${Math.round(done / MODS.length * 100)}% through the course.`}</h2>
  <p class="sub" style="margin-bottom:22px">${S.biz ? "Working business: <b>" + esc(S.biz) + "</b>" : "Set your practice business below — every exercise applies to it."}</p>

  <div class="grid g4" style="margin-bottom:18px">
    <div class="stat"><div class="n">${done}<span style="font-size:15px;color:var(--muted)">/${MODS.length}</span></div><div class="l">modules complete</div></div>
    <div class="stat"><div class="n">${fmtH(minutesDone())}</div><div class="l">of 30h curriculum</div></div>
    <div class="stat"><div class="n">${qs.total ? Math.round(qs.pct * 100) + "%" : "—"}</div><div class="l">quiz accuracy (${qs.total} answered)</div></div>
    <div class="stat"><div class="n">${S.streak.days}</div><div class="l">day streak</div></div>
  </div>`;

  h += `<div class="grid g2" style="margin-bottom:18px">
    <div class="card">
      <p class="eyebrow">${inprog.length ? "Continue" : "Next up"}</p>
      <h3 style="font-family:var(--serif);font-size:22px;margin:0 0 6px;font-weight:600">${cont.id} · ${esc(cont.title)}</h3>
      <p class="sub" style="margin-bottom:14px">${cont.minutes} minutes · ${esc(partName(cont.part))}</p>

/* ---------- module ---------- */
const STEPS = [
  { k: "predict", n: "Predict", d: "Guess before you read" },

}

function viewModule() {
  const m = byId(route.id);

    <button class="btn ${isDone(m) ? "" : "primary"}" onclick="toggleDone('${m.id}')">${isDone(m) ? "✓ Completed — undo" : "Mark module complete"}</button>
    ${next ? `<button class="btn" onclick="go('#/m/${next.id}')">${next.id} →</button>` : `<button class="btn" onclick="go('#/stats')">Stats →</button>`}
  </div></div>`;

}
function stepDone(m, i) {
  const p = P(m.id);
  if (i === 0) return !!p.predict.trim();
  if (i === 1) return secDone(m) === secTotal(m);
  if (i === 2) return !!(p.quiz && p.quiz.finished);
  if (i === 3) return Object.values(p.elab).some(v => (v || "").trim());
  return !!(p.transfer && p.transfer.score != null);
}
function toggleDone(id) {

}

function jump(e, i) { e.preventDefault(); document.getElementById("sec" + i).scrollIntoView({ behavior: "smooth", block: "start" }); }
function setupToc() {
  const links = [...document.querySelectorAll("#toc a")];
  const secs = [...document.querySelectorAll(".sec")];
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(ents => {
    ents.forEach(en => {
      if (en.isIntersecting) {
        const i = secs.indexOf(en.target);
        links.forEach((l, j) => l.classList.toggle("on", j === i));
        if (i >= 0) setCurSec(i);
      }
    });
  }, { rootMargin: "-80px 0px -70% 0px" });
  secs.forEach(s => io.observe(s));
}
function savePredict(id) { P(id).predict = $("#predin").value; save(); go("#/m/" + id + "/1"); }
function saveNote(id) { S.notes[id] = $("#noteIn").value; save(); toast("Notes saved"); go("#/m/" + id + "/2"); }
function saveElab(id) {
  const p = P(id);
  document.querySelectorAll("[data-el]").forEach(t => p.elab[t.dataset.el] = t.value);
  save(); toast("Saved"); go("#/m/" + id + "/4");
}
function saveTransfer(id, score) {
  const p = P(id); const ta = $("#trin");
  p.transfer = Object.assign({}, p.transfer, { answer: ta ? ta.value : (p.transfer || {}).answer || "" });
  if (score != null) p.transfer.score = score;
  save(); toast("Saved");
  if (score != null) renderStep(byId(id), 4);
}
function revealModel(id) {
  const p = P(id); const ta = $("#trin");
  if (ta && !ta.value.trim()) { toast("Write your own answer first — that is the whole exercise."); ta.focus(); return; }
  p.transfer = Object.assign({}, p.transfer, { answer: ta.value, revealed: true }); save();
  $("#modelbox").classList.remove("hidden");

}
function tickSec(id, i) {

  renderStep(byId(id), 1); renderSidebar();
}
function allSecs(id, on) {

/* ---------- quiz ---------- */
function renderQuiz(m) {
  const p = P(m.id);
  if (!p.quiz) p.quiz = { i: 0, a: [], finished: false };
  const q = p.quiz, b = $("#stepbody");
  if (q.finished) return quizResults(m);
  const item = m.assess.quiz[q.i];
  const state = q.a[q.i];
  let h = `<div class="card">
    <div class="qmeta"><span>Question ${q.i + 1} of ${m.assess.quiz.length}</span>
      <span class="bar"><i style="width:${Math.round(q.i / m.assess.quiz.length * 100)}%"></i></span>
      <span style="margin-left:auto">${q.a.filter(x => x && x.ok).length} correct so far</span></div>
    <h3 style="font-family:var(--serif);font-size:21px;line-height:1.35;font-weight:600;margin:0 0 16px">${esc(item.q)}</h3>`;
  item.options.forEach((o, i) => {
    let cls = "";
    if (state && state.answered) {
      if (i === item.answer) cls = "right";
      else if (i === state.pick) cls = "wrong";
    } else if (state && state.pick === i) cls = "sel";
    h += `<button class="opt ${cls}" ${state && state.answered ? "disabled" : ""} onclick="pick('${m.id}',${i})">
      <span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;
  });
  if (state && state.pick != null && !state.answered) {
    h += `<div class="conf"><span style="font-size:13px;color:var(--muted)">How sure are you?</span>
      ${[["Guessing", 1], ["Fairly sure", 2], ["Certain", 3]].map(([l, v], i) =>
        `<button class="btn sm" onclick="answer('${m.id}',${v})"><kbd>${i + 1}</kbd> ${l}</button>`).join("")}</div>
      <p class="sub" style="margin-top:10px;font-size:12px">Rating your confidence trains calibration — knowing what you actually know is most of what separates a good marketer from a confident one.</p>`;
  }
  if (state && state.answered) {
    h += `<div class="why"><b style="color:${state.ok ? "var(--ok)" : "var(--bad)"};display:block;margin-bottom:6px">${state.ok ? "Correct" : "Not quite — the answer is " + "ABCD"[item.answer]}</b>${esc(item.why)}</div>
    <div style="display:flex;gap:9px;margin-top:16px"><button class="btn primary" onclick="nextQ('${m.id}')">${q.i === m.assess.quiz.length - 1 ? "See results →" : "Next question →"} <kbd>↵</kbd></button></div>`;
  }
  h += `</div>`;
  b.innerHTML = h;
}
function pick(id, i) {
  const q = P(id).quiz;
  if (q.a[q.i] && q.a[q.i].answered) return;
  q.a[q.i] = { pick: i, answered: false }; save(); renderQuiz(byId(id));
}
function answer(id, conf) {
  const m = byId(id), q = P(id).quiz, st = q.a[q.i];
  if (!st || st.pick == null || st.answered) return;
  st.conf = conf; st.answered = true; st.ok = st.pick === m.assess.quiz[q.i].answer;
  save(); markDay(); renderQuiz(m);
}
function nextQ(id) {
  const m = byId(id), q = P(id).quiz;
  if (q.i === m.assess.quiz.length - 1) { q.finished = true; save(); renderSidebar(); quizResults(m); }
  else { q.i++; save(); renderQuiz(m); }
}
function quizResults(m) {
  const q = P(m.id).quiz, items = m.assess.quiz;
  const ok = q.a.filter(x => x && x.ok).length, tot = items.length;
  const pct = Math.round(ok / tot * 100);
  const overconf = q.a.filter((x, i) => x && x.conf === 3 && !x.ok).length;
  let h = `<div class="card" style="text-align:center">
    <p class="eyebrow">Step 3 · Retrieve</p>
    <div style="font-family:var(--serif);font-size:52px;font-weight:600;line-height:1;margin:8px 0 4px;color:${pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--warm)" : "var(--bad)"}">${pct}%</div>
    <p class="sub" style="margin-bottom:16px">${ok} of ${tot} correct</p>
    <p style="max-width:520px;margin:0 auto 18px;color:var(--text-2)">${pct >= 85 ? "Strong. The material is in there. The flashcards will keep it there." : pct >= 60 ? "Reasonable first pass. Re-read the sections behind the ones you missed, then retake in a few days — the retake is where the learning happens." : "This is a normal first score and it is useful data. Go back to Read, work through the sections behind the misses, and retake. Nobody learns this in one pass."}</p>`;
  if (overconf) h += `<div class="hint" style="max-width:520px;margin:0 auto 18px;text-align:left"><span class="i">Calibration</span> You were "certain" and wrong ${overconf} time${overconf > 1 ? "s" : ""}. That is the most valuable signal on this page — those are the beliefs that will cost you money.</div>`;
  h += `<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
    <button class="btn" onclick="retake('${m.id}')">Retake</button>
    <button class="btn" onclick="go('#/m/${m.id}/1')">Back to reading</button>
    <button class="btn primary" onclick="go('#/m/${m.id}/3')">Continue →</button></div></div>`;
  h += `<div class="card" style="margin-top:16px"><p class="eyebrow">Every question, with the reasoning</p>`;
  items.forEach((it, i) => {
    const st = q.a[i] || {};
    h += `<div style="padding:14px 0;border-top:${i ? "1px solid var(--line)" : "0"}">
      <div style="display:flex;gap:9px;align-items:flex-start">
        <span class="tag ${st.ok ? "ok" : ""}" style="${st.ok ? "" : "background:var(--bad-soft);color:var(--bad)"}">${st.ok ? "✓" : "✗"}</span>
        <div><b style="font-size:15px">${esc(it.q)}</b>
        <div style="font-size:14px;color:var(--muted);margin-top:5px">Correct: ${esc(it.options[it.answer])}${st.pick != null && !st.ok ? " · you chose: " + esc(it.options[st.pick]) : ""}</div>
        <div style="font-size:14px;color:var(--text-2);margin-top:7px">${esc(it.why)}</div></div></div></div>`;
  });
  h += `</div>`;
  $("#stepbody").innerHTML = h;
}
function retake(id) { P(id).quiz = { i: 0, a: [], finished: false }; save(); renderQuiz(byId(id)); }

  if (!cardCount()) {
    v.innerHTML = `<div class="wrap"><div class="empty"><div class="big">Your review deck is empty</div>
      <p>Complete a module and its flashcards drop into this deck automatically. They then come back on a schedule tuned to the moment just before you would forget them.</p>
      <button class="btn primary" style="margin-top:12px" onclick="go('#/home')">Back to dashboard</button></div></div>`;
    return;
  }
  if (!session || !session.queue.length) {
    const due = dueCards();
    if (!due.length) {
      const upcoming = forecast();
      v.innerHTML = `<div class="wrap"><div class="empty"><div class="big">Nothing due today</div>
        <p>${cardCount()} cards in the deck. Next batch: ${upcoming.next ? upcoming.next + " card(s) in " + upcoming.days + " day(s)" : "none scheduled"}.</p>
        <p style="max-width:460px;margin:12px auto">Reviewing early feels productive and is mostly wasted effort — the schedule is doing the work. Spend the time on a new module instead.</p>
        <button class="btn primary" style="margin-top:6px" onclick="go('#/home')">Dashboard</button>
        <button class="btn" style="margin-top:6px" onclick="cramAll()">Review everything anyway</button></div></div>`;
      return;
    }
    startSession(due);
  }
  drawCard();
}
function startSession(cards) {
  const q = cards.slice();
  for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[q[i], q[j]] = [q[j], q[i]]; }
  session = { queue: q, total: q.length, done: 0, flipped: false };
}
function cramAll() {
  const all = [];
  MODS.forEach(m => (m.assess.cards || []).forEach((c, i) => {
    const k = cardKey(m.id, i); if (S.cards[k]) all.push({ k, mid: m.id, mtitle: m.title, c, st: S.cards[k] });
  }));
  startSession(all); drawCard();
}
function drawCard() {
  const v = $("#view");
  if (!session || !session.queue.length) {
    const n = session ? session.done : 0; session = null;
    v.innerHTML = `<div class="wrap"><div class="empty"><div class="big">Session complete</div>
      <p>${n} card${n === 1 ? "" : "s"} reviewed. Each one is now scheduled further out.</p>
      <button class="btn primary" style="margin-top:12px" onclick="go('#/home')">Dashboard</button></div></div>`;
    renderSidebar(); return;
  }
  markDay();
  const cur = session.queue[0];
  const pct = Math.round(session.done / session.total * 100);
  v.innerHTML = `<div class="wrap">
    <div class="qmeta" style="margin-bottom:18px"><span>Review · interleaved</span><span class="bar"><i style="width:${pct}%"></i></span>
      <span style="margin-left:auto">${session.queue.length} left</span></div>
    <div class="flash" onclick="flip()">
      <span class="tag acc" style="margin-bottom:16px">${cur.mid} · ${esc(cur.mtitle)}</span>
      <div class="front">${esc(cur.c.front)}</div>
      ${session.flipped ? `<div class="back">${esc(cur.c.back)}</div>` : `<div class="back" style="border:0;color:var(--muted);font-size:13.5px">Answer out loud, then click or press <kbd>space</kbd></div>`}
    </div>
    ${session.flipped ? `<div class="gradebar">
      ${[["Again", "<1d", 0], ["Hard", "", 1], ["Good", "", 2], ["Easy", "", 3]].map(([l, s, g], i) =>
        `<button onclick="rate(${g})">${l}<small>${predictIvl(cur.k, g)}</small></button>`).join("")}
    </div><p class="sub" style="text-align:center;margin-top:12px;font-size:12px">Be honest. Marking "Good" on a card you fumbled is how a review deck becomes decoration. Keys <kbd>1</kbd>–<kbd>4</kbd>.</p>`
      : `<div style="text-align:center;margin-top:16px"><button class="btn primary" onclick="flip()">Show answer <kbd>space</kbd></button></div>`}
  </div>`;
}
function predictIvl(k, g) {
  const st = S.cards[k]; if (!st) return "";
  const save0 = JSON.stringify(st);
  let ivl;
  if (g === 0) ivl = 0;
  else if (g === 1) ivl = st.ivl ? Math.max(1, Math.round(st.ivl * 1.2)) : 1;
  else if (g === 2) ivl = st.ivl === 0 ? 1 : (st.ivl === 1 ? 3 : Math.round(st.ivl * st.ease));
  else ivl = st.ivl === 0 ? 3 : Math.round(st.ivl * st.ease * 1.25);
  JSON.parse(save0);
  return ivl === 0 ? "today" : ivl === 1 ? "1 day" : ivl < 30 ? ivl + " days" : Math.round(ivl / 30) + " mo";
}
function flip() { if (session) { session.flipped = true; drawCard(); } }
function rate(g) {
  if (!session || !session.flipped) return;
  const cur = session.queue.shift();
  grade(cur.k, g);
  if (g === 0) session.queue.push(cur); else session.done++;
  session.flipped = false; drawCard();
}
function forecast() {
  const t = todayNum(); let best = null;
  Object.values(S.cards).forEach(c => { if (c.due > t && (best === null || c.due < best)) best = c.due; });
  if (best === null) return { next: 0, days: 0 };
  const n = Object.values(S.cards).filter(c => c.due === best).length;
  return { next: n, days: best - t };
}

function connMode() { return (BR().route === "bridge" && bridgeOk) ? "bridge" : (BR().key ? "direct" : "none"); }

async function callAnthropic(key, system, messages, model, maxTokens) {
  const body = {
    model: model || "claude-sonnet-5",
    max_tokens: maxTokens || 1400,
    messages: messages.slice(-20)
  };
  if (system) body.system = system;
  const r = await fetch(API_URL, {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": API_VERSION,
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    const msg = (j && j.error && j.error.message) || ("HTTP " + r.status);
    const friendly = {
      401: "Anthropic rejected the key: " + msg,
      403: "That key is not allowed to do this: " + msg,
      404: "That model is not available on this key.",
      429: "Rate limited, or the key is out of credit.",
      529: "Anthropic is overloaded right now — try again in a moment."
    }[r.status] || ("Anthropic error " + r.status + ": " + msg);
    const err = new Error(friendly); err.status = r.status; throw err;
  }
  return (j.content || []).filter(c => c.type === "text").map(c => c.text).join("") || "(empty reply)";
}

async function verifyKey(key) {
  try {
    await callAnthropic(key, "", [{ role: "user", content: "hi" }], BR().model, 4);
    return { ok: true };
  } catch (e) {
    const net = /failed|network|load/i.test(e.message || "") && !e.status;
    return { ok: false, why: net
      ? (isLocalFile()
          ? "The request could not leave the browser. Check your internet connection."
          : "A published page is not allowed to call Anthropic. Open marketing-course-local.html from your Marketing folder instead.")
      : e.message };
  }
}

/* the bridge is optional now — only probed when it is the chosen route, or when there is no key */
async function checkBridge(quiet) {
  const b = BR();
  bridgeChecking = true; bridgeErr = "";
  if (!quiet) renderSidebar();
  if (b.key && b.route !== "bridge") {          // direct mode: nothing to probe
    bridgeOk = true; b.mode = "direct";
    bridgeChecking = false; save(); renderSidebar();
    if (route.v === "settings") viewSettings();
    if (route.v === "home") viewHome();
    const p0 = document.getElementById("panel"); if (p0 && currentPanelId) drawThread();
    return true;
  }
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 3000);
    const r = await fetch(b.url.replace(/\/$/, "") + "/health", { signal: ctrl.signal });
    clearTimeout(t);
    const j = await r.json();
    b.echo = !!j.echo; b.cliSeen = !!j.cli; b.hasKey = !!j.has_key;
    b.keySource = j.key_source || ""; b.keyHint = j.key_hint || "";
    bridgeOk = !!j.ok && j.ready !== false;
    b.mode = bridgeOk ? "bridge" : "none";
    if (bridgeOk) b.route = "bridge";
    if (!!j.ok && j.ready === false) bridgeErr = "The bridge is running but has no way to reach Claude yet.";
  } catch (e) {
    bridgeOk = false; b.mode = "none";
    bridgeErr = "Not connected yet.";
  }
  bridgeChecking = false; save();
  renderSidebar();
  if (route.v === "settings") viewSettings();
  if (route.v === "home") viewHome();
  const p = document.getElementById("panel");
  if (p && currentPanelId) drawThread();
  return bridgeOk;
}

async function askBridge(system, messages) {
  const b = BR();
  if (connMode() === "direct") {
    return callAnthropic(b.key, system, messages, b.model, 1400);
  }
  const r = await fetch(b.url.replace(/\/$/, "") + "/ask", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ key: "", model: b.model || "claude-sonnet-5", system, messages, max_tokens: 1400 })
  });
  const j = await r.json().catch(() => ({ error: "The bridge sent something unreadable." }));
  if (!r.ok || j.error) throw new Error(j.error || ("Bridge error " + r.status));
  if (j.notice) { toast(j.notice); save(); }
  return j.text || "(empty reply)";
}

/* Repair text that was already stored after being decoded with the wrong code page:
   UTF-8 bytes read as Windows-1252 turn "—" into "â€”". Only runs when that signature
   is present and the bytes really do form valid UTF-8, so correct text is never touched. */
const CP1252_HIGH = { "€": 128, "‚": 130, "ƒ": 131, "„": 132, "…": 133, "†": 134, "‡": 135, "ˆ": 136, "‰": 137, "Š": 138, "‹": 139, "Œ": 140, "Ž": 142, "‘": 145, "’": 146, "“": 147, "”": 148, "•": 149, "–": 150, "—": 151, "˜": 152, "™": 153, "š": 154, "›": 155, "œ": 156, "ž": 158, "Ÿ": 159 };
function unmojibake(s) {
  if (!s || !/Ã.|â€|Â./.test(s)) return s;
  try {
    const bytes = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) {
      const ch = s[i], code = ch.charCodeAt(0);
      if (code <= 0xFF) bytes[i] = code;
      else if (CP1252_HIGH[ch] != null) bytes[i] = CP1252_HIGH[ch];
      else return s;                       // not representable — leave it alone
    }
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  } catch (e) { return s; }
}

function mdLite(src) {
  let t = esc(unmojibake(src));
  t = t.replace(/```([\s\S]*?)```/g, (m, c) => "<pre style='white-space:pre-wrap;background:var(--surface-3);padding:9px;border-radius:8px;font-size:12.5px'>" + c.trim() + "</pre>");
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|\n)#{1,4}\s*([^\n]+)/g, "$1<h4>$2</h4>");
  const lines = t.split("\n");
  let out = "", list = null;
  lines.forEach(l => {
    const ul = l.match(/^\s*[-*]\s+(.*)$/), ol = l.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if (ul) { if (list !== "ul") { out += (list ? "</" + list + ">" : "") + "<ul>"; list = "ul"; } out += "<li>" + ul[1] + "</li>"; }
    else if (ol) { if (list !== "ol") { out += (list ? "</" + list + ">" : "") + "<ol>"; list = "ol"; } out += "<li>" + ol[2] + "</li>"; }
    else {
      if (list) { out += "</" + list + ">"; list = null; }
      if (l.trim()) out += l.startsWith("<h4>") || l.startsWith("<pre") ? l : "<p>" + l + "</p>";
    }
  });
  if (list) out += "</" + list + ">";
  return out;
}

function marksOf(mid) { if (!S.marks) S.marks = {}; if (!S.marks[mid]) S.marks[mid] = []; return S.marks[mid]; }
function allMarks() {
  const out = [];
  Object.keys(S.marks || {}).forEach(mid => marksOf(mid).forEach(m => out.push(Object.assign({ mid }, m))));
  return out.sort((a, b) => b.ts - a.ts);
}
function openQs() { return allMarks().filter(m => m.status === "open").length; }
function findMark(mid, id) { return marksOf(mid).find(x => x.id === id); }
function addMark(mid, sec, text, status) {
  const m = { id: "k" + Date.now().toString(36) + Math.floor(Math.random() * 999), sec, text, note: "", q: "", ans: "", status: status || "hl", ts: Date.now() };
  marksOf(mid).push(m); save(); return m;
}
function delMark(mid, id) {
  S.marks[mid] = marksOf(mid).filter(x => x.id !== id); save();
  if (route.v === "m") renderStep(byId(mid), 1); else render();
  closePanel(); toast("Removed");
}
function markClass(m) { return m.status === "open" ? "q" : m.status === "answered" ? "answered" : ""; }

function applyMarks(mid) {
  marksOf(mid).forEach(mk => {
    const host = document.querySelector("#sec" + mk.sec + " .prose");
    if (!host) return;
    wrapText(host, mk.text, markClass(mk), mk.id);
  });
}
function wrapText(el, text, cls, id) {
  if (!text) return false;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let full = "";
  while (walker.nextNode()) {
    const n = walker.currentNode;
    if (n.parentElement && n.parentElement.closest("mark")) continue;
    nodes.push([n, full.length]); full += n.textContent;
  }
  if (!nodes.length) return false;
  // whitespace-tolerant match: normalise, keep a map back to raw offsets
  let norm = "", map = [], prevSp = false;
  for (let k = 0; k < full.length; k++) {
    const c = full[k];
    if (c === " " || c === "\n" || c === "\t" || c === "\r") {
      if (prevSp) continue;
      norm += " "; map.push(k); prevSp = true;
    } else { norm += c; map.push(k); prevSp = false; }
  }
  const needle = String(text).replace(/\s+/g, " ").trim();
  if (!needle) return false;
  const ni = norm.indexOf(needle);
  if (ni < 0) return false;
  const i = map[ni], j = map[ni + needle.length - 1] + 1;
  let sN = null, sO = 0, eN = null, eO = 0;
  for (const [n, off] of nodes) {
    const len = n.textContent.length;
    if (sN === null && i >= off && i < off + len) { sN = n; sO = i - off; }
    if (eN === null && j > off && j <= off + len) { eN = n; eO = j - off; }
  }
  if (!sN || !eN) return false;
  try {
    const r = document.createRange(); r.setStart(sN, sO); r.setEnd(eN, eO);
    const mk = document.createElement("mark");
    mk.className = "hl " + cls; mk.dataset.k = id;
    mk.appendChild(r.extractContents()); r.insertNode(mk);
    return true;
  } catch (e) { return false; }
}

/* ---- selection toolbar ---- */
let selCtx = null, currentPanelMid = null, currentPanelId = null;
function killBar() { const b = document.getElementById("selbar"); if (b) b.remove(); }
function clearSel() { killBar(); selCtx = null; }
function handleSel() {
  if (route.v !== "m" || route.step !== 1) return;
  const s = window.getSelection();
  if (!s || s.isCollapsed) return clearSel();
  const text = s.toString().replace(/\s+/g, " ").trim();
  if (text.length < 4 || text.length > 900) return clearSel();
  const r = s.getRangeAt(0);
  let host = r.commonAncestorContainer;
  if (host.nodeType === 3) host = host.parentElement;
  const sec = host.closest ? host.closest(".sec") : null;
  if (!sec) return clearSel();
  const secIdx = +sec.id.replace("sec", "");
  const raw = s.toString();
  killBar();
  selCtx = { mid: route.id, sec: secIdx, text: raw.trim() };
  const rect = (r.getBoundingClientRect ? r.getBoundingClientRect() : null) || { left: 0, top: 0, width: 0 };
  const bar = document.createElement("div");
  bar.className = "selbar"; bar.id = "selbar";
  bar.style.left = (rect.left + rect.width / 2 + window.scrollX) + "px";
  bar.style.top = (rect.top + window.scrollY - 10) + "px";
  bar.innerHTML = `<button onclick="doMark('hl')">★ Highlight</button>
    <span class="div"></span><button onclick="doMark('note')">✎ Note</button>
    <span class="div"></span><button onclick="doMark('ask')">? Ask Claude</button>`;
  document.body.appendChild(bar);
}
function doMark(kind) {
  if (!selCtx) return;
  const { mid, sec, text } = selCtx;
  try { const s = window.getSelection(); if (s) s.removeAllRanges(); } catch (e) {}
  killBar();
  if (kind === "ask") {                    // straight into the rail, no clutter saved
    selCtx = null;
    pinQuote(text, sec);
    return;
  }
  const m = addMark(mid, sec, text, "hl");

  else openNote(mid, m.id);
}
document.addEventListener("mouseup", e => {

});
document.addEventListener("touchend", () => setTimeout(handleSel, 60));

/* ---------- conversations ---------- */
function CV() { if (!S.convos) S.convos = {}; return S.convos; }
function ACT() { if (!S.active) S.active = {}; return S.active; }
function migrateChats() {
  if (!S.chats || S._migrated) return;
  Object.keys(S.chats).forEach(mid => {
    const msgs = S.chats[mid] || [];
    if (!msgs.length) return;
    const id = newId();
    CV()[id] = { id, mid, msgs, created: msgs[0].ts || Date.now(),
                 updated: msgs[msgs.length - 1].ts || Date.now(), parent: null, summary: "", title: "" };
    ACT()[mid] = id;
  });
  S._migrated = true; save();
}
function newId() { return "c" + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
function convosFor(mid) {
  return Object.values(CV()).filter(c => c.mid === mid).sort((a, b) => b.updated - a.updated);
}
function allConvos() { return Object.values(CV()).sort((a, b) => b.updated - a.updated); }
function convoTitle(c) {
  if (c.title) return c.title;
  const first = (c.msgs || []).find(m => m.r === "u");
  if (first) return first.t.length > 46 ? first.t.slice(0, 46) + "…" : first.t;
  return c.summary ? "Continued conversation" : "New chat";
}
function activeConvo(mid, create) {
  const id = ACT()[mid];
  if (id && CV()[id]) return CV()[id];
  const existing = convosFor(mid)[0];
  if (existing) { ACT()[mid] = existing.id; return existing; }
  if (create === false) return null;
  return newConvo(mid);
}
function newConvo(mid, opts) {
  const id = newId();
  CV()[id] = { id, mid, msgs: [], created: Date.now(), updated: Date.now(),
               parent: (opts && opts.parent) || null, summary: (opts && opts.summary) || "",
               title: (opts && opts.title) || "" };
  ACT()[mid] = id; save();
  return CV()[id];
}
function switchConvo(id) {
  const c = CV()[id]; if (!c) return;
  ACT()[c.mid] = id; save(); menuOpen = false; renderRail();
}
function deleteConvo(id) {
  const c = CV()[id]; if (!c) return;
  if (!confirm("Delete this conversation? It cannot be undone.")) return;
  const mid = c.mid;
  delete CV()[id];
  if (ACT()[mid] === id) delete ACT()[mid];
  save(); menuOpen = false;
  if (route.v === "m") renderRail(); else render();
  toast("Conversation deleted");
}
function renameConvo(id) {
  const c = CV()[id]; if (!c) return;
  const t = prompt("Name this conversation:", convoTitle(c));
  if (t === null) return;
  c.title = t.trim().slice(0, 70); save();
  if (route.v === "m") renderRail(); else render();
}

/* compaction: carry the substance forward into a fresh conversation */
let compacting = false;
async function compactConvo(id) {
  const c = CV()[id] || activeConvo(route.id, false);
  if (!c || !c.msgs.length || compacting) return;
  if (connMode() === "none") { toast("Not connected — open Settings"); return; }
  compacting = true; menuOpen = false; renderRail();
  try {
    const transcript = c.msgs.filter(m => m.r !== "e")
      .map(m => (m.r === "u" ? "LEARNER: " : "TUTOR: ") + m.t).join("\n\n");
    const sys = "You compress a tutoring conversation into a handover brief for the next conversation, written for the tutor who picks it up. Under 180 words. Cover: what was actually settled, the learner's situation and business as revealed, any conclusion or decision reached, and what is still open or confusing. No preamble, no headings, plain prose. Do not repeat explanations — record outcomes.";
    const summary = await askBridge(sys, [{ role: "user", content: transcript.slice(-12000) }]);
    const fresh = newConvo(c.mid, { parent: c.id, summary: summary.trim(),
                                    title: "Continued: " + convoTitle(c).slice(0, 40) });
    compacting = false; renderRail();
    toast("Carried the important parts into a new chat");
    return fresh;
  } catch (e) {
    compacting = false; renderRail();
    toast((e && e.message) || "Could not compact this conversation");
  }
}

/* ---- questions built from the passage itself, instantly and for free ---- */
function termsIn(text) {
  const low = " " + text.toLowerCase().replace(/[^a-z0-9%$€£. ]+/g, " ") + " ";
  const hits = [];
  (DATA.library.glossary || []).forEach(g => {
    const t = g.term.toLowerCase().replace(/\s*\(.*?\)\s*/g, " ").trim();
    if (t.length < 4 || t.length > 34) return;
    if (low.indexOf(" " + t + " ") >= 0 || low.indexOf(" " + t + "s ") >= 0)
      hits.push({ t: g.term.replace(/\s*\(.*?\)\s*/g, "").trim(), star: g.star, len: t.length });
  });
  hits.sort((a, b) => (b.star - a.star) || (b.len - a.len));
  const out = [];
  hits.forEach(h => { if (!out.some(o => o.toLowerCase().includes(h.t.toLowerCase()) || h.t.toLowerCase().includes(o.toLowerCase()))) out.push(h.t); });
  return out.slice(0, 3);
}
function localQuestions(text, hints) {
  const seen = [];
  (hints || []).forEach(hStr => {
    const h = String(hStr).replace(/[.,;:]$/, "").trim();
    if (h.length >= 4 && h.length <= 44 && !seen.some(x => x.toLowerCase() === h.toLowerCase())) seen.push(h);
  });
  termsIn(text).forEach(t => { if (!seen.some(x => x.toLowerCase().includes(t.toLowerCase()))) seen.push(t); });
  const terms = seen.slice(0, 3);
  const num = (text.match(/\b\d+(\.\d+)?\s?(%|x\b|:1\b)|[$€£]\s?\d[\d,.]*/) || [])[0];
  const qs = [];
  qs.push(terms[0] ? `What does "${terms[0]}" actually mean here?` : "Say this back to me in plain language.");
  if (terms[1]) qs.push(`How is ${terms[1]} different from ${terms[0]}?`);
  else qs.push("Give me a concrete example of this.");
  if (num) qs.push(`Where does the ${num} come from?`);
  qs.push(`How would I apply this to ${S.biz || "my own business"}?`);
  qs.push("When does this stop being true?");
  return qs.slice(0, 5);
}
async function genQuestions() {
  if (!pinned || genning) return;
  if (connMode() === "none") { toast("Not connected — open Settings"); return; }
  genning = true; renderSuggest();
  try {
    const sys = "You write study questions. Given a passage from a marketing course, return the 5 questions a smart beginner should be asking about it. One per line, no numbering, no preamble, each under 90 characters, each answerable from thinking about this passage. Make them specific to this passage's actual content, not generic.";
    const reply = await askBridge(sys, [{ role: "user", content: pinned.text + (S.biz ? "\n\n(The reader's practice business: " + S.biz + ")" : "") }]);
    const lines = reply.split("\n").map(l => l.replace(/^\s*[-*\d.)]+\s*/, "").trim())
      .filter(l => l.length > 12 && l.length < 140 && l.indexOf("?") > 0).slice(0, 6);
    if (lines.length) { pinnedQs = lines; toast("Questions generated"); }
    else toast("Could not read the reply — keeping the current suggestions");
  } catch (e) { toast((e && e.message) || "Could not generate questions"); }
  genning = false; renderSuggest();
}

}
function systemForRail() {
  const m = byId(route.id);
  const sec = m.sections[pinned ? pinned.sec : curSec];
  const quote = pinned ? pinned.text : (sec ? sec.text.slice(0, 1200) : "");
  const c = activeConvo(m.id);
  return `You are a sharp, plain-spoken marketing tutor. The person is a complete beginner working through a 30-hour marketing course. Right now they are in module ${m.id}, "${m.title}", reading the section "${sec ? sec.h : ""}".

${pinned ? "They selected this passage and are asking about it:" : "The part of the text they are looking at:"}
"""
${quote}
"""
${S.biz ? `\nTheir practice business, which examples should be aimed at: ${S.biz}` : ""}
${c && c.summary ? `\nWhat happened in your earlier conversation with them, carried over. Do not repeat it; build on it:\n"""\n${c.summary}\n"""` : ""}

How to answer:
- Be concise. Two or three short paragraphs is plenty; a short list only when it genuinely helps.
- Be concrete: real numbers, real examples, a real first step.
- Tie it back to what they are reading.
- If the course text is a simplification, or you disagree with it, say so and explain where it breaks down.
- No preamble, no flattery. Answer the question.`;
}

  const m = byId(route.id); if (!m) return;
  const c = activeConvo(m.id);
  el.innerHTML = `
    <div class="railhead" id="railhead"></div>
    <div class="railbody" id="railbody"></div>
    <div class="chatmenu hidden" id="chatmenu"></div>
    <div class="railfoot">
      <div class="row">
        <textarea id="railin" rows="1" placeholder="Ask about this section…"></textarea>
        <button class="btn primary" id="railsend" onclick="railSend()">↑</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:7px">
        <span style="font-size:11px;color:var(--muted)">${connMode() === "none" ? "not connected" : "⌘/Ctrl+↵ to send"}</span>

function renderSuggest() {
  const box = document.getElementById("railsuggest");
  if (box) {
    box.innerHTML = railSuggestions().map(q =>
      `<button class="chip" onclick="askThis(this)" data-q="${esc(q)}">${esc(q)}</button>`).join("")
      + (pinned ? `<button class="chip gen" onclick="genQuestions()" ${genning ? "disabled" : ""}>
          ${genning ? "Thinking of better questions…" : "✦ Ask Claude for sharper questions"}</button>` : "");
  }
  const lead = document.getElementById("raillead2");
  if (lead) lead.innerHTML = `<p class="sub" style="font-size:12px;margin:0 0 8px">${pinned
    ? "Questions about <b>the passage you picked</b>:"
    : "Questions worth asking about <b>" + esc(railCtxLabel()) + "</b>:"}</p>`;
}
function askThis(el) {
  const inp = document.getElementById("railin");
  inp.value = el.dataset.q;
  railSend();
}
async function railSend() {
  const m = byId(route.id); if (!m) return;
  const inp = document.getElementById("railin"), btn = document.getElementById("railsend");
  const text = (inp.value || "").trim();
  if (!text) return;
  if (connMode() === "none") {
    const ok = await checkBridge(true);
    if (!ok) { toast("Not connected — open Settings"); go("#/settings"); return; }
  }
  const c = activeConvo(m.id);
  c.msgs.push({ r: "u", t: text, ts: Date.now(), sec: pinned ? pinned.sec : curSec, quote: pinned ? pinned.text : "" });
  c.updated = Date.now();
  save(); markDay();
  inp.value = ""; inp.style.height = "auto";
  menuOpen = false;
  renderRailBody(); renderSidebar();
  btn.disabled = true; inp.disabled = true;
  const pend = document.getElementById("railpending");
  if (pend) pend.innerHTML = `<div class="msg a typing"><i></i><i></i><i></i></div>`;
  const body = document.getElementById("railbody"); if (body) body.scrollTop = body.scrollHeight;
  try {
    const msgs = c.msgs.filter(x => x.r !== "e").slice(-12).map(x => ({ role: x.r === "u" ? "user" : "assistant", content: x.t }));
    const reply = await askBridge(systemForRail(), msgs);
    c.msgs.push({ r: "a", t: reply, ts: Date.now() });
  } catch (e) {
    c.msgs.push({ r: "e", t: (e && e.message) || "Something went wrong.", ts: Date.now() });
  }
  c.updated = Date.now(); save();
  btn.disabled = false; inp.disabled = false;
  renderRail();
  const i2 = document.getElementById("railin"); if (i2) i2.focus();
}

        <div style="font-size:15px;font-weight:600;margin-bottom:8px">${esc(convoTitle(c))}</div>

function continueConvo(id) {
  const c = CV()[id]; if (!c) return;
  ACT()[c.mid] = id; save();
  if (!S.ui) S.ui = {}; S.ui.rail = true; save();
  go("#/m/" + c.mid + "/1");
}
async function compactFromList(id) {
  const c = CV()[id]; if (!c) return;
  toast("Summarising…");
  const fresh = await compactConvo(id);
  if (fresh) continueConvo(fresh.id);
}
function exportChat(id) {
  const c = CV()[id]; if (!c) return;
  const mod = byId(c.mid);
  const head = "Marketing Mastery — " + mod.id + " " + mod.title + "\n" + convoTitle(c) + "\n";
  const carried = c.summary ? "\nCARRIED OVER FROM AN EARLIER CHAT:\n" + c.summary + "\n" : "";
  const txt = c.msgs.map(x => (x.r === "u" ? "ME: " : x.r === "e" ? "ERROR: " : "CLAUDE: ") + x.t).join("\n\n");
  toast(clip(head + carried + "\n" + txt) ? "Transcript copied" : "Could not copy");
}
function clip(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}

        <button class="btn" onclick="useBridge()">Use the bridge</button>
        ${b.route === "bridge" ? `<button class="btn ghost" onclick="useDirect()">Back to direct</button>` : ""}
      </div>
    </div>
  </details>

  <div class="card">
    <p class="eyebrow">Why the key sits in the browser</p>
    <p style="color:var(--text-2);margin:0 0 10px">Anthropic allows a page to call the API directly, as long as it says it means to. That is what this does — so there is no proxy, no Python and no window to leave open. The cost is that your key lives in this browser's storage for this file.</p>
    <p style="color:var(--text-2);margin:0">That is fine here because this page is a file on your own computer that only you open. It would <b>not</b> be fine in a page you put on the internet — anyone visiting could read the key. So do not host this file publicly with a key saved in it, and press <b>Forget it</b> on a shared machine.</p>
  </div></div>`;
  $("#view").innerHTML = h;
}

async function connectClaude() {
  const btn = document.getElementById("connectbtn"), log = document.getElementById("connectlog");
  const field = document.getElementById("mainkey");
  const b = BR();
  const key = ((field && field.value.trim()) || b.key || "").trim();
  const show = html => { const l = document.getElementById("connectlog") || log; if (l) l.innerHTML = html; };

  if (!key) {
    // no key typed — see whether the optional bridge is running instead
    show(`<div class="hint"><span class="i">…</span>No key given, checking for the local bridge.</div>`);
    b.route = "bridge";
    const ok = await checkBridge(true);
    if (!ok) { b.route = "direct"; save(); }
    show(ok
      ? `<div class="hint" style="background:var(--ok-soft);color:var(--ok)"><span class="i">✓</span>Connected through the local bridge.</div>`
      : `<div class="hint" style="background:var(--warm-soft);color:var(--warm)"><span class="i">!</span>Paste an API key above, or start the bridge if you would rather use Claude Code.</div>`);
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = "Checking…"; }
  show(`<div class="hint"><span class="i">…</span>Sending one tiny request to check the key.</div>`);
  const res = await verifyKey(key);
  if (res.ok) {
    b.key = key; b.route = "direct"; b.mode = "direct"; save();
    bridgeOk = true;
    renderSidebar(); viewSettings();
    show(`<div class="hint" style="background:var(--ok-soft);color:var(--ok)"><span class="i">✓</span>
      <div><b>Connected.</b> The key is saved in this browser — you will not be asked again. Go and read; select any sentence to ask about it.</div></div>`);
    toast("Connected to Claude");
  } else {
    if (btn) { btn.disabled = false; btn.textContent = "Connect"; }
    show(`<div class="hint" style="background:var(--bad-soft);color:var(--bad)"><span class="i">✕</span>
      <div><b>Did not work.</b> ${esc(res.why || "")}</div></div>`);
  }
}
async function testDirect() {
  const box = document.getElementById("diagbox");
  if (box) box.innerHTML = `<div class="hint"><span class="i">…</span>Checking.</div>`;
  const res = await verifyKey(BR().key);
  if (box) box.innerHTML = res.ok
    ? `<div class="hint" style="background:var(--ok-soft);color:var(--ok)"><span class="i">✓</span>The key works.</div>`
    : `<div class="hint" style="background:var(--bad-soft);color:var(--bad)"><span class="i">✕</span>${esc(res.why || "")}</div>`;
}
function disconnect() {
  BR().key = ""; BR().mode = "none"; bridgeOk = false; save();
  renderSidebar(); viewSettings(); toast("Key removed from this browser");
}
function useDirect() { BR().route = "direct"; save(); checkBridge(); }
async function useBridge() {
  const u = document.getElementById("seturl");
  if (u) BR().url = u.value.trim().replace(/\/$/, "");
  BR().route = "bridge"; save();
  const log = () => document.getElementById("connectlog");
  const l0 = log(); if (l0) l0.innerHTML = `<div class="hint"><span class="i">…</span>Looking for the bridge, then for Claude Code.</div>`;
  const up = await checkBridge(true);
  if (!up) {
    BR().route = "direct"; save(); renderSidebar(); viewSettings();
    const l = log(); if (l) l.innerHTML = `<div class="hint" style="background:var(--bad-soft);color:var(--bad)"><span class="i">✕</span>
      <div>The bridge is not running. Double-click <b>start-bridge.bat</b> in your <b>bridge</b> folder, leave that window open, then press this again.</div></div>`;
    return;
  }
  try {
    const j = await bridgePost("/connect", {});
    await checkBridge(true);
    const l = log();
    if (l) l.innerHTML = j.ok
      ? `<div class="hint" style="background:var(--ok-soft);color:var(--ok)"><span class="i">✓</span>
         <div><b>Connected — ${esc(j.source || "")}.</b> ${esc(j.note || "")}</div></div>`
      : `<div class="hint" style="background:var(--warm-soft);color:var(--warm)"><span class="i">!</span>
         <div><b>The bridge is running, but Claude Code did not answer.</b> ${j.cli
           ? "It is installed — run <code>claude</code> once in a terminal to sign in, then press this again."
           : "It does not appear to be installed. Install Claude Code and sign in, or use an API key instead."}</div></div>`;
    if (j.ok) toast("Connected — no API charges");
  } catch (e) {
    const l = log(); if (l) l.innerHTML = `<div class="hint" style="background:var(--bad-soft);color:var(--bad)"><span class="i">✕</span>${esc(e.message || "Could not reach the bridge")}</div>`;
  }
  renderSidebar();
}
async function bridgePost(path, payload) {
  const r = await fetch(BR().url.replace(/\/$/, "") + path, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify(payload || {})
  });
  return r.json();
}
function saveSettings() {
  const m = document.getElementById("setmodel");
  if (m) BR().model = m.value;
  const u = document.getElementById("seturl");
  if (u) BR().url = u.value.trim().replace(/\/$/, "");
  save(); toast("Saved");
}

/* ---------- keys ---------- */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea";
  if (e.key === "Escape") { closeModal(); closePanel(); clearSel(); $("#sidebar").classList.remove("open"); return; }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); return; }
  if (e.key === "?") { openHelp(); return; }
  if (e.key === "t") { cycleTheme(); return; }
  if (e.key === "a" && route.v === "m") { toggleRail(); return; }
  if (e.key === "i" && route.v === "m") { const el = document.getElementById("railin"); if (el) { el.focus(); e.preventDefault(); } return; }
  if ($("#modalhost").innerHTML) return;
  if (route.v === "review" && session) {
    if (e.key === " ") { e.preventDefault(); if (!session.flipped) flip(); return; }
    if (session.flipped && ["1", "2", "3", "4"].includes(e.key)) { rate(+e.key - 1); return; }
  }
  if (route.v === "m") {
    const m = byId(route.id), p = P(route.id);
    if (route.step === 2 && p.quiz && !p.quiz.finished) {
      const st = p.quiz.a[p.quiz.i];
      if (!st || st.pick == null) {
        const i = "abcd".indexOf(e.key.toLowerCase());
        if (i >= 0 || ["1", "2", "3", "4"].includes(e.key)) { pick(route.id, i >= 0 ? i : +e.key - 1); return; }
      } else if (!st.answered && ["1", "2", "3"].includes(e.key)) { answer(route.id, +e.key); return; }
      else if (st.answered && e.key === "Enter") { nextQ(route.id); return; }
    }
    const i = mIndex(route.id);
    if (e.key === "j" && MODS[i + 1]) go("#/m/" + MODS[i + 1].id);
    if (e.key === "k" && MODS[i - 1]) go("#/m/" + MODS[i - 1].id);
  } else {
    if (e.key === "j" || e.key === "k") go("#/m/" + MODS[0].id);
  }
});
window.addEventListener("scroll", () => {
  const h = document.body.scrollHeight - window.innerHeight;
  $("#readbar").style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + "%";
});
window.addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

/* ---------- boot ---------- */
function render() {
  if (route.v !== "m") stopTimer();
  closePanel(); clearSel();
  if (route.v !== "m") pinned = null;
  renderSidebar();
  const v = route.v;
  if (v === "m") viewModule();
  else if (v === "review") viewReview();
  else if (v === "stats") viewStats();
  else if (v === "marks") viewMarks();
  else if (v === "settings") viewSettings();
  else if (v === "library") viewLibrary();
  else if (v === "plan") viewPlan();
  else viewHome();
  $("#sidebar").classList.remove("open");
  applyRail();
  const tg = document.getElementById("railtoggle");
  if (tg) tg.classList.toggle("show", route.v === "m");
  if (route.v === "m" && railOpen()) renderRail();
}
$("#opensearch").onclick = openPalette;
$("#themebtn").onclick = cycleTheme;
$("#helpbtn").onclick = openHelp;
$("#menubtn").onclick = () => $("#sidebar").classList.toggle("open");
migrateChats();
parseHash(); render();
setTimeout(() => checkBridge(true), 250);
</script>
